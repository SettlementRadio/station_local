          playable: true
          fact: Every copy that exists outside the receiver's room came out of the four boxes the band carried away from the Gantry Street plant themselves.
          credits: {writers: [p_nesta_vire, p_ollan_beke], players: [p_nesta_vire, p_ollan_beke, p_tarrin_meel, p_deran_shale, p_hessa_lin], producer: p_ollan_beke}

    - id: al_147
      title: First Round Slow
      band: b_065
      label: label_6
      release_year: 2594
      kind: album
      genre: void-lounge
      cornerstone: false
      notes: >-
        The house's fifth record and the one that made it. Maro Deyn had founded Lower Bell Editions
        in 2589 to press other people and had put off pressing his own band for five years on the
        grounds that it would look exactly like what it was. He gave in the year the first burn
        festival emptied the quarter of everybody with a lane job, because the room was half full for
        a season and the band had nothing else to do with the nights. Talla Venn was hired for two of
        them and spent both arguing with Deyn about whether the guitar should answer the piano's left
        hand or stay out of its way; the record keeps both versions of the argument and settles
        neither. Bela Runn sings all six, in the last stretch of the twenty-six years she gave the
        band.
      songs:
        - id: s_1189
          title: First Round Slow
          track_number: 1
          genre: void-lounge
          mood_tags: [unhurried, warm, wry]
          playable: true
          fact: Bela Runn opens at the tempo the Lower Bell's staff pour at, which Maro Deyn timed against the bar clock one night and wrote on the back of a docket.
          credits: {writers: [p_bela_runn, p_maro_deyn], players: [p_bela_runn, p_maro_deyn, p_toben_alt, p_odell_prine], producer: p_maro_deyn}
        - id: s_1190
          title: Everyone's on the Lanes
          track_number: 2
          genre: void-lounge
          mood_tags: [wistful, spare, slow]
          playable: true
          fact: Written the week the first burn festival took the room's regulars out to the lanes, and the number of empty chairs in the second verse is the count Odell Prine made from behind the kit.
          credits: {writers: [p_bela_runn], players: [p_bela_runn, p_maro_deyn, p_toben_alt, p_odell_prine], producer: p_maro_deyn}
        - id: s_1191
          title: The Court at Four
          track_number: 3
          genre: void-lounge
          mood_tags: [hushed, cold, patient]
          playable: true
          fact: Toben Alt plays the whole song on two strings, after the stair door caught his hand on the way in and nobody wanted to lose the night.
          credits: {writers: [p_maro_deyn, p_toben_alt], players: [p_bela_runn, p_maro_deyn, p_toben_alt, p_odell_prine], producer: p_maro_deyn}
        - id: s_1192
          title: Send a Card Instead
          track_number: 4
          genre: void-lounge
          mood_tags: [tender, rueful, slow]
          playable: true
          fact: Bela Runn wrote it for her brother on the freight circuit and sings his reply as the second verse, which she has said is the only line of his she kept.
          credits: {writers: [p_bela_runn], players: [p_bela_runn, p_maro_deyn, p_toben_alt, sp_talla_venn], producer: p_maro_deyn}
        - id: s_1193
          title: Nothing Opens Till Nine
          track_number: 5
          genre: void-lounge
          mood_tags: [dry, warm, midtempo]
          playable: true
          fact: Talla Venn's guitar answers Maro Deyn's left hand all the way through, which is the opposite of what Deyn had written out and the two of them never agreed about it afterwards.
          credits: {writers: [p_maro_deyn], players: [p_bela_runn, p_maro_deyn, p_toben_alt, p_odell_prine, sp_talla_venn], producer: p_maro_deyn}
        - id: s_1194
          title: Warm Glass, Cold Court
          track_number: 6
          genre: void-lounge
          mood_tags: [final, tender, slow]
          playable: true
          fact: Sel Ardin sings the closing answer alone because the band's own harmony singers had gone home on the last ferry and nobody had thought to ask them to stay.
          credits: {writers: [p_bela_runn, p_maro_deyn], players: [p_bela_runn, p_maro_deyn, p_toben_alt, p_odell_prine, sp_sel_ardin], producer: p_maro_deyn}

    - id: al_148
      title: The Founder's Room
      band: b_065
      label: label_6
      release_year: 2612
      kind: album
      genre: void-lounge
      cornerstone: false
      notes: >-
        The band's second record and the last thing Lower Bell Editions ever pressed. Nothing had
        come between it and the first because Maro Deyn would not book his own band ahead of anybody
        he had signed, and by 2612 there was nobody left to be ahead of. It was made in the Lower
        Bell room he had bought in 2610 with a loan against the catalogue, which is what the title is
        about and what the band, rather than Deyn, chose to call it. Juna Carrow had sung with them
        for seven years by then and sings all six. The plant held the run against the debt within a
        month of finishing it, so the record went from being made to being disputed without ever
        being sold, and both claimants have listed it since.
      songs:
        - id: s_1195
          title: The Founder's Room
          track_number: 1
          genre: void-lounge
          mood_tags: [wry, cold, midtempo]
          playable: true
          fact: Juna Carrow chose the title and Maro Deyn approved it without saying anything, which the rest of the band took to mean the argument was over.
          credits: {writers: [p_juna_carrow], players: [p_juna_carrow, p_maro_deyn, p_toben_alt, p_odell_prine], producer: p_maro_deyn}
        - id: s_1196
          title: Bela's Key
          track_number: 2
          genre: void-lounge
          mood_tags: [tender, warm, slow]
          playable: true
          fact: Juna Carrow sings it in Bela Runn's key instead of her own and has never sung it in any other, including on the coast.
          credits: {writers: [p_juna_carrow, p_maro_deyn], players: [p_juna_carrow, p_maro_deyn, p_toben_alt, p_odell_prine], producer: p_maro_deyn}
        - id: s_1197
          title: Borrowed Against Us
          track_number: 3
          genre: void-lounge
          mood_tags: [bitter, tense, slow]
          playable: true
          fact: The second verse lists what the loan was secured on, in the order it appears on the paper the band was shown in 2611.
          credits: {writers: [p_juna_carrow, p_toben_alt], players: [p_juna_carrow, p_maro_deyn, p_toben_alt, p_odell_prine], producer: p_maro_deyn}
        - id: s_1198
          title: Nothing Since the Festival
          track_number: 4
          genre: void-lounge
          mood_tags: [wistful, spare, patient]
          playable: true
          fact: Odell Prine plays the brush pattern off the band's first record note for note, which is the only thing the four of them agreed on before they started.
          credits: {writers: [p_maro_deyn], players: [p_juna_carrow, p_maro_deyn, p_toben_alt, p_odell_prine], producer: p_maro_deyn}
        - id: s_1199
          title: The Plant Keeps Ours
          track_number: 5
          genre: void-lounge
          mood_tags: [cold, resigned, slow]
          playable: true
          fact: Toben Alt heard between the two nights that the plant intended to hold the run, and plays everything on the second night a whole tone lower than he had on the first.
          credits: {writers: [p_juna_carrow, p_toben_alt], players: [p_juna_carrow, p_maro_deyn, p_toben_alt, p_odell_prine, sp_oren_saye], producer: p_maro_deyn}
        - id: s_1200
          title: Close the House
          track_number: 6
          genre: void-lounge
          mood_tags: [final, aching, hushed]
          playable: true
          fact: Maro Deyn plays the closing figure alone, and he has not played in public since 2612.
          credits: {writers: [p_maro_deyn], players: [p_juna_carrow, p_maro_deyn], producer: p_maro_deyn}

    - id: al_149
      title: Numbers on the Sleeve
      band: b_066
      label: label_3
      release_year: 2619
      kind: album
      genre: void-lounge
      cornerstone: false
      notes: >-
        Stormline Issue's first record in the form, made for the plainest reason a house ever makes
        one: the coast had sealed, the crates had gone, the dance acts were off the coast, and there
        was a singer in a hall with a band she had put together four months earlier. It went out into
        the 2619 calendar, which was full of answers to the altered-credit edition, and every credit
        on it names who played what down to the part — which the settled worlds read as the band
        taking a side in somebody else's argument and which is about the two claimants who hold
        Coldwater Court. The sleeve prints eleven Lower Bell catalogue numbers and nothing else on
        the back. It sold better up the relay than anything Stormline Issue had pressed that was not
        for dancing, which is the whole reason there is a second one.
      songs:
        - id: s_1201
          title: Numbers on the Sleeve
          track_number: 1
          genre: void-lounge
          mood_tags: [cold, wry, slow]
          playable: true
          fact: The eleven numbers Juna Carrow sings are the Lower Bell catalogue numbers of the records she cannot get back, in the order the receiver listed them.
          credits: {writers: [p_juna_carrow], players: [p_juna_carrow, p_teme_hollick, p_ivor_sanne, p_dessa_roan], producer: p_teme_hollick}
        - id: s_1202
          title: A Coast With No Ferry
          track_number: 2
          genre: void-lounge
          mood_tags: [wistful, spacious, patient]
          playable: true
          fact: Juna Carrow wrote it in her first sealed season, on finding that a coast with no last ferry has no hour at which the night is agreed to be over.
          credits: {writers: [p_juna_carrow, p_teme_hollick], players: [p_juna_carrow, p_teme_hollick, p_ivor_sanne, p_dessa_roan], producer: p_teme_hollick}
        - id: s_1203
          title: The Hall Next Door Is Dancing
          track_number: 3
          genre: void-lounge
          mood_tags: [wry, warm, midtempo]
          playable: true
          fact: What is on the other side of the wall is Cordon Hours playing to a full room, and Dessa Roan set the tempo at exactly half theirs.
          credits: {writers: [p_juna_carrow, p_dessa_roan], players: [p_juna_carrow, p_teme_hollick, p_ivor_sanne, p_dessa_roan], producer: p_teme_hollick}
        - id: s_1204
          title: Slow Set at Six
          track_number: 4
          genre: void-lounge
          mood_tags: [tired, tender, slow]
          playable: true
          fact: Stormline Issue booked the band for the hour after the dancing stopped and paid it at the dancing's rate, which the house has never explained and has never repeated for anybody else.
          credits: {writers: [p_juna_carrow], players: [p_juna_carrow, p_teme_hollick, p_ivor_sanne, p_dessa_roan], producer: p_teme_hollick}
        - id: s_1205
          title: Somebody Else's Instrument
          track_number: 5
          genre: void-lounge
          mood_tags: [glassy, cool, hypnotic]
          playable: true
          fact: Miro Olt plays a synth-harpsichord that had come down in a dance crate and could not go back before the coast sealed, and he charged the house for the season it spent there.
          credits: {writers: [p_juna_carrow, p_teme_hollick], players: [p_juna_carrow, p_teme_hollick, p_ivor_sanne, p_dessa_roan, sp_miro_olt], producer: p_teme_hollick}
        - id: s_1206
          title: Ask Me About the Core
          track_number: 6
          genre: void-lounge
          mood_tags: [dry, bitter, midtempo]
          playable: true
          fact: Juna Carrow never answers the question in the chorus and Teme Hollick answers it for her, with the first four notes of Bela's Key.
          credits: {writers: [p_juna_carrow, p_teme_hollick], players: [p_juna_carrow, p_teme_hollick, p_ivor_sanne, p_dessa_roan], producer: p_teme_hollick}
        - id: s_1207
          title: Late Enough to Say It
          track_number: 7
          genre: void-lounge
          mood_tags: [warm, aching, final]
          playable: true
          fact: Sel Ardin sings the answering line, and it is the only song the band has ever ended with two voices.
          credits: {writers: [p_juna_carrow], players: [p_juna_carrow, p_teme_hollick, p_ivor_sanne, p_dessa_roan, sp_sel_ardin], producer: p_teme_hollick}

    - id: al_150
      title: The Quarter Without Me
      band: b_066
      label: label_3
      release_year: 2624
      kind: album
      genre: void-lounge
      cornerstone: false
      notes: >-
        Concordance's largest hall reopened in 2624 and every house in the settled worlds booked
        time in it. Stormline Issue did not: it had put its season's money into a wet hall on the
        storm coast and said in print that it would do it again. So The Quiet Half paid the hall's
        fee themselves, out of a season of hall work, and Stormline Issue paid for the sleeve and is
        credited on it for the sleeve. It is the first time Juna Carrow had been back in the
        late-club quarter since 2617, and she walked it for two days before the band played a note.
        The record is the only one in the wiki where a singer re-records her own song to keep the
        money away from the people who own the first version.
      songs:
        - id: s_1208
          title: The Quarter Without Me
          track_number: 1
          genre: void-lounge
          mood_tags: [aching, cold, slow]
          playable: true
          fact: Juna Carrow names four rooms in the second verse, all four of which closed between 2617 and 2624.
          credits: {writers: [p_juna_carrow], players: [p_juna_carrow, p_teme_hollick, p_ivor_sanne, p_dessa_roan], producer: p_teme_hollick}
        - id: s_1209
          title: Paid for It Ourselves
          track_number: 2
          genre: void-lounge
          mood_tags: [wry, defiant, midtempo]
          playable: true
          fact: The band paid the reopened hall's fee out of a season of coast work, and the sleeve credits Stormline Issue with the sleeve and nothing else.
          credits: {writers: [p_juna_carrow, p_teme_hollick], players: [p_juna_carrow, p_teme_hollick, p_ivor_sanne, p_dessa_roan], producer: p_teme_hollick}
        - id: s_1210
          title: The Room Was Rebuilt
          track_number: 3
          genre: void-lounge
          mood_tags: [wistful, warm, slow]
          playable: true
          fact: Ivor Sanne plays an upright bass the hall keeps in its own store, because the band's own did not survive the crossing out of Meridian.
          credits: {writers: [p_juna_carrow, p_ivor_sanne], players: [p_juna_carrow, p_teme_hollick, p_ivor_sanne, p_dessa_roan], producer: p_teme_hollick}
        - id: s_1211
          title: New Name, Old Song
          track_number: 4
          genre: void-lounge
          mood_tags: [bruised, spare, slow]
          playable: true
          fact: This is Borrowed Against Us under another title, re-recorded because every play of the 2612 version pays the two claimants who hold the Coldwater Court catalogue.
          credits: {writers: [p_juna_carrow, p_toben_alt], players: [p_juna_carrow, p_teme_hollick, p_ivor_sanne, p_dessa_roan], producer: p_teme_hollick}
        - id: s_1212
          title: Back on the Last Ferry
          track_number: 5
          genre: void-lounge
          mood_tags: [warm, tender, midtempo]
          playable: true
          fact: Dessa Roan plays the brushes against the ferry bell, which is still audible in the reopened hall through its loading door and is on the record twice.
          credits: {writers: [p_juna_carrow, p_dessa_roan], players: [p_juna_carrow, p_teme_hollick, p_ivor_sanne, p_dessa_roan, sp_calo_meret], producer: p_teme_hollick}
        - id: s_1213
          title: Leave It Lit
          track_number: 6
          genre: void-lounge
          mood_tags: [final, warm, hushed]
          playable: true
          fact: The band asked the hall to leave its lamps on for the last song and the hall's keeper is named on the sleeve for agreeing to it.
          credits: {writers: [p_juna_carrow], players: [p_juna_carrow, p_teme_hollick, p_ivor_sanne, p_dessa_roan, sp_calo_meret], producer: p_teme_hollick}

    - id: al_151
      title: When the Board Comes Down
      band: b_067
      label: label_3
      release_year: 2619
      kind: album
      genre: void-lounge
      cornerstone: false
      notes: >-
        Nine Lamps had been playing the last hour of coast dance nights for five years and had never
        been offered a record, on the reasonable grounds that Stormline Issue is a house for dancing.
        What changed is that the house had pressed one slow record that year and it had sold up the
        relay, so it pressed a second by the band that had been doing it longest. The sessions were
        six nights at the end of six dance nights, in the halls the band was already booked into,
        with the doors shut behind the last of the room. The sleeve files them under the core's name
        for the form and prints Sabin Loch's objection to that beside it, which is the first time a
        house had printed a band's complaint about its own filing and is now the band's contract.
      songs:
        - id: s_1214
          title: When the Board Comes Down
          track_number: 1
          genre: void-lounge
          mood_tags: [cold, patient, slow]
          playable: true
          fact: The four levels Sabin Loch names are the hazard board's own, in the order the board posts them, and the top one is where Bright Hazard got their name.
          credits: {writers: [p_sabin_loch], players: [p_sabin_loch, p_emre_talt, p_nera_bly, p_corle_sten], producer: p_emre_talt}
        - id: s_1215
          title: Nine Lamps Out
          track_number: 2
          genre: void-lounge
          mood_tags: [spare, hushed, cold]
          playable: true
          fact: Nera Bly plays one note for each of the nine sea-wall lamps before the voice comes in, and the band counts them in that order on stage as well.
          credits: {writers: [p_sabin_loch, p_nera_bly], players: [p_sabin_loch, p_emre_talt, p_nera_bly, p_corle_sten], producer: p_emre_talt}
        - id: s_1216
          title: Nothing to Dance To
          track_number: 3
          genre: void-lounge
          mood_tags: [wry, dry, slow]
          playable: true
          fact: Sabin Loch wrote it the night a hall manager asked the band to play faster, and it is the slowest thing Stormline Issue has ever pressed.
          credits: {writers: [p_sabin_loch], players: [p_sabin_loch, p_emre_talt, p_nera_bly, p_corle_sten], producer: p_emre_talt}
        - id: s_1217
          title: The Warm Hour
          track_number: 4
          genre: void-lounge
          mood_tags: [tender, warm, midtempo]
          playable: true
          fact: Emre Talt tunes his second-hand Concordance synth-harpsichord to the sea wall's hum before every night, and the wall was half a tone flat the week this was made.
          credits: {writers: [p_emre_talt, p_sabin_loch], players: [p_sabin_loch, p_emre_talt, p_nera_bly, p_corle_sten], producer: p_emre_talt}
        - id: s_1218
          title: Not the Core's Music
          track_number: 5
          genre: void-lounge
          mood_tags: [defiant, blunt, midtempo]
          playable: true
          fact: The band will not use the core's word for what it plays, and this is the song the sleeve prints their objection next to.
          credits: {writers: [p_sabin_loch, p_nera_bly], players: [p_sabin_loch, p_emre_talt, p_nera_bly, p_corle_sten], producer: p_emre_talt}
        - id: s_1219
          title: Salt on the Glass
          track_number: 6
          genre: void-lounge
          mood_tags: [final, cold, spacious]
          playable: true
          fact: Corle Sten's brushes are on a drum head the salt had already ruined, which the band kept because it had stopped ringing and has not replaced since.
          credits: {writers: [p_corle_sten, p_sabin_loch], players: [p_sabin_loch, p_emre_talt, p_nera_bly, p_corle_sten], producer: p_emre_talt}

    - id: al_152
      title: Lamps Left Burning
      band: b_067
      label: label_3
      release_year: 2624
      kind: album
      genre: void-lounge
      cornerstone: false
      notes: >-
        The sealed season of 2623 ran eleven weeks and Nine Lamps played the last hour of forty
        nights of it in the Longwall hall, after Cordon Hours had finished and most of the room had
        gone. Six of those hours were recorded and the record is what came out of them, issued in
        2624 while the whole of the rest of the industry was in Concordance booking the reopened
        hall. Sabin Loch has said the band would not have crossed for it if the crossing had been
        free. The hall's keeper left the lamps on past his own hours for every one of the six and is
        the only person outside the band named on the sleeve.
      songs:
        - id: s_1220
          title: Lamps Left Burning
          track_number: 1
          genre: void-lounge
          mood_tags: [warm, spacious, slow]
          playable: true
          fact: Recorded on the fortieth night of the sealed season of 2623, after Cordon Hours had finished and the hall's keeper had left the lamps on for it.
          credits: {writers: [p_sabin_loch, p_emre_talt], players: [p_sabin_loch, p_emre_talt, p_nera_bly, p_corle_sten], producer: p_emre_talt}
        - id: s_1221
          title: The Last Hour Each Night
          track_number: 2
          genre: void-lounge
          mood_tags: [tired, tender, patient]
          playable: true
          fact: The band played the last hour of every night of that seal, and Sabin Loch closed all forty of them with this one.
          credits: {writers: [p_sabin_loch], players: [p_sabin_loch, p_emre_talt, p_nera_bly, p_corle_sten], producer: p_emre_talt}
        - id: s_1222
          title: Nobody Went Home
          track_number: 3
          genre: void-lounge
          mood_tags: [warm, communal, slow]
          playable: true
          fact: Nera Bly counts the room in at the top of the song, and the number is the one the hall's door keeper handed her on a slip that night.
          credits: {writers: [p_nera_bly, p_sabin_loch], players: [p_sabin_loch, p_emre_talt, p_nera_bly, p_corle_sten], producer: p_emre_talt}
        - id: s_1223
          title: The Slow Hour Pays
          track_number: 4
          genre: void-lounge
          mood_tags: [dry, wry, midtempo]
          playable: true
          fact: The hall pays the dance bands by the night and Nine Lamps by the hour, which Sabin Loch has called the only honest arrangement on the coast.
          credits: {writers: [p_sabin_loch], players: [p_sabin_loch, p_emre_talt, p_nera_bly, p_corle_sten], producer: p_emre_talt}
        - id: s_1224
          title: Salt and Sleep
          track_number: 5
          genre: void-lounge
          mood_tags: [hushed, aching, spare]
          playable: true
          fact: Corle Sten fell asleep in the corner between two songs and the other three played this one without him, which is the only track on either record with no drums.
          credits: {writers: [p_emre_talt, p_sabin_loch], players: [p_sabin_loch, p_emre_talt, p_nera_bly], producer: p_emre_talt}
        - id: s_1225
          title: Open the Doors Slowly
          track_number: 6
          genre: void-lounge
          mood_tags: [final, warm, hopeful]
          playable: true
          fact: The last line is what the Longwall hall's keeper says when a seal lifts, and Emre Talt holds the closing chord until the doors are actually open.
          credits: {writers: [p_sabin_loch, p_emre_talt], players: [p_sabin_loch, p_emre_talt, p_nera_bly, p_corle_sten], producer: p_emre_talt}

layer_b:
  bands:
    - id: b_068
      name: The Coat Room
      kind: group
      home_settlement: Concordance late-club quarter
      label: label_1
      genre: void-lounge
      active_from: 2551
      active_to: 2585
      bio: >-
        The Coat Room played the quarter for thirty-four years and were pressed by the prestige house
        because the quarter had no house of its own yet, which is the gap Lower Bell Editions was
        founded in. Civic Lantern issued them as an evening act and would not put the word late on a
        sleeve.
      albums:
        - id: al_153
          title: The Last Ferry Goes
          label: label_1
          release_year: 2557
          kind: album
          genre: void-lounge
          notes: The first record of the quarter's music anybody pressed, issued by a house that filed it under evening entertainment.
          songs:
