          active_to: 2612
      movement:
        standing: Purist
        detail: >-
          Maro Deyn's line, printed on every sleeve the house issued, was that the form needs a room,
          a piano and somebody willing to stay up, and that anything else is a house trying to make
          the record louder than the night it came from. He kept to it in his own band and did not
          enforce it on the ones he signed.
      bio: >-
        Coldwater Court played the Lower Bell room for eleven years before Maro Deyn founded a house
        to press it, and they are the reason there is a house at all. Bela Runn sang the first
        twenty-six years and stopped in 2604 over a set of accounts she asked to see twice; Juna
        Carrow replaced her the following year and was told to sing it her own way, which she did
        not do for two years. Toben Alt has never played a song faster than the first time he played
        it, and the band's whole tempo is his. They made one record in 2594 and nothing else until
        2612, because Deyn was running the house and would not book his own band ahead of anybody
        he had signed.
      album_ids: [al_147, al_148]

