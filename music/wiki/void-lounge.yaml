          genre: void-lounge
          mood_tags: [tender, hushed, slow]
          playable: true
          fact: Deran Shale plays the whole song with brushes on the back of a chair, because the room's kit had gone out on loan to a wedding and came back a night late.
          credits: {writers: [p_nesta_vire], players: [p_nesta_vire, p_ollan_beke, p_tarrin_meel, p_deran_shale], producer: p_ollan_beke}
        - id: s_1173
          title: Same Round Again
