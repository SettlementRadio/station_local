layer_c:
  recordings: none survive
  figures:
    - id: f_024
      name: Ovin Halle
      kind: transfer-hall pianist
      genre: void-lounge
      active_from: 2451
      active_to: 2486
      played: hall piano
      history: >-
        Ovin Halle played a Concordance transfer hall between 2451 and 2486, in the hours when the
        hall had nobody in it but people who had missed the last connection and could not go home.
        He was employed as a porter and paid nothing for the playing, and no account of it survives
        beyond three lines in a hall roster and a complaint about the piano being moved. He is named
        whenever anybody explains where the form's hours came from, because playing to a room of
        people with nowhere to be is the whole of what it is and he is the first person recorded as
        having done it on purpose.
    - id: f_025
      name: Tem Wray
      kind: singer
      genre: void-lounge
      active_from: 2470
      active_to: 2505
      played: voice
      history: >-
        Tem Wray sang the core's late rooms from 2470 to 2505 and never once sang above the room's
        own conversation, on the argument that a room that has to lean in has already stopped
        talking. Nothing she sang was written down and the two songs everybody attributes to her
        were almost certainly not hers. She matters because every singer in this file works the same
        way, and because the quarter's rooms are still built quiet enough for it.
    - id: f_026
      name: Odile Prenn
      kind: bass player
      genre: void-lounge
      active_from: 2498
      active_to: 2531
      played: upright bass
      history: >-
        Odile Prenn worked the Concordance late rooms from 2498 to 2531 and is the reason there is a
        walking bass under everything the form has done since; before her the bass held the room
        still and after her it moved the room along. One handwritten part in her hand survives,
        behind the bar of the Lower Bell room, and two layer-A records quote it. She is the only
        figure in this file whose actual playing anybody can still hear, at one remove, because
        nobody has ever managed to claim ownership of a page nobody can date.
