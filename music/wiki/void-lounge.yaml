    - id: al_145
      title: Two Ferries Missed
      band: b_064
      label: label_6
      release_year: 2607
      kind: album
      genre: void-lounge
      cornerstone: false
      notes: >-
        The house's best year. Meridian's coast was shut for the season and the core's rooms filled
        up with players who had nowhere to be, so Lower Bell Editions had its pick of hired hands for
        the first and only time and spent the money on this record. Sel Ardin came down for three
        nights and built the answering voices, and Nesta Vire has said she sang the rest of the
        record differently once she had heard what a second voice could do underneath her. The house
        booked three nights in the room and the band played a fourth; Evening Claim had been billed
        for a fourth night in the same room in 2583 and After the Ferry refused to sign for theirs,
        which is the first time anybody had refused Maro Deyn anything. Hessa Lin's own instrument
        had been sold that spring to clear the band's back pay, so the last track is the room's
        upright piano.
      songs:
        - id: s_1177
          title: Two Ferries Missed
          track_number: 1
          genre: void-lounge
          mood_tags: [wry, warm, midtempo]
          playable: true
          fact: Nesta Vire counted the two ferries she had actually missed that week into the opening line and refused to change the number afterwards, so the band has sung it wrong on purpose ever since.
          credits: {writers: [p_nesta_vire], players: [p_nesta_vire, p_ollan_beke, p_tarrin_meel, p_deran_shale, p_hessa_lin], producer: p_ollan_beke}
        - id: s_1178
          title: The Room Fills at One
          track_number: 2
          genre: void-lounge
          mood_tags: [patient, glowing, slow]
          playable: true
          fact: Sel Ardin built the three answering voices around a lead she had heard once, standing at the bar with her coat still on.
          credits: {writers: [p_nesta_vire, p_ollan_beke], players: [p_nesta_vire, p_ollan_beke, p_tarrin_meel, p_deran_shale, p_hessa_lin, sp_sel_ardin], producer: p_ollan_beke}
        - id: s_1179
          title: Your Coat, My Fault
          track_number: 3
          genre: void-lounge
          mood_tags: [rueful, tender, slow]
          playable: true
          fact: Ollan Beke wrote the piano part out of an argument he had in the coat room and has never said which half of it was his.
          credits: {writers: [p_ollan_beke], players: [p_nesta_vire, p_ollan_beke, p_tarrin_meel, p_deran_shale], producer: p_ollan_beke}
        - id: s_1180
          title: Nothing Until Morning
          track_number: 4
          genre: void-lounge
          mood_tags: [aching, hushed, spare]
          playable: true
          fact: Tarrin Meel plays Toben Alt's bass on this one, borrowed off Coldwater Court for a fortnight while his own was away being repaired, and it is a whole tone darker than the rest of the record.
          credits: {writers: [p_nesta_vire, p_tarrin_meel], players: [p_nesta_vire, p_ollan_beke, p_tarrin_meel, sp_sel_ardin], producer: p_ollan_beke}
        - id: s_1181
          title: The Fourth Night
