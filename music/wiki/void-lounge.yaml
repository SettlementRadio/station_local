          genre: void-lounge
          mood_tags: [tired, warm, building]
          playable: true
          fact: The band played a fourth night the house had not paid for and would not sign for it, which is the only bill Maro Deyn ever wrote off.
          credits: {writers: [p_nesta_vire, p_ollan_beke, p_tarrin_meel, p_deran_shale, p_hessa_lin], players: [p_nesta_vire, p_ollan_beke, p_tarrin_meel, p_deran_shale, p_hessa_lin, sp_sel_ardin], producer: p_ollan_beke}
