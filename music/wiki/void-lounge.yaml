      movement:
        standing: Purist
        detail: >-
          Juna Carrow kept Maro Deyn's line about a room and a piano and took it to the most
          Synthesist house in the settled worlds, which finds it useful because it costs nothing.
          Teme Hollick plays the house's compact keyboards when the hall's piano is unplayable and
          says every time that it is the hall's fault and not the argument's.
      bio: >-
        The Quiet Half formed on Meridian's storm coast in 2617, four months after Juna Carrow took
        a hall job out there and the season sealed with her on the wrong side of it. They play the
        hour after the dancing stops, in halls built for the opposite, and Dessa Roan sets every
        tempo at half whatever was going on before them. Carrow will not sing anything from the
        Coldwater Court records on stage, because every play of them pays the two claimants who hold
        that catalogue, and she says so from the stage often enough that the coast is bored of it.
        Ivor Sanne came off a hauler and had never heard the form before he joined; he learned it
        off the records Carrow cannot get back, which she lent him and asked for back the same week.
      album_ids: [al_149, al_150]

