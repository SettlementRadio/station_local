          genre: void-lounge
          mood_tags: [resigned, warm, midtempo]
          playable: true
          fact: Tarrin Meel's bass figure is Odile Prenn's, learned off a handwritten part that has been kept behind the Lower Bell's bar since before anyone working there was born.
          credits: {writers: [p_ollan_beke, p_tarrin_meel], players: [p_nesta_vire, p_ollan_beke, p_tarrin_meel, p_deran_shale, p_hessa_lin], producer: p_ollan_beke}
