        standing: Localist
        detail: >-
          The band's position, stated in 2620 and repeated in writing every year since, is that the
          slow hour on the storm coast grew out of the coast's own nights and was not brought down
          from the core with the crates. Stormline Issue files them under the core's name anyway and
          prints their objection beside it, which both sides describe as settled.
      bio: >-
        Nine Lamps are named for the nine lamps on the Meridian sea wall and have played the last
        hour of coast dance nights since 2614, mostly in halls that booked them because somebody has
        to play while the room empties. Sabin Loch sings higher and quieter than anybody expects and
        has never once used the core's word for what the band does. Emre Talt bought a second-hand
        synth-harpsichord out of Concordance and tunes it to the sea wall's hum, which is a real
        pitch and changes with the weather. They have never played off the coast, have never been
        asked twice, and turned down the one hall in the core that asked once.
      album_ids: [al_151, al_152]

  albums:
    - id: al_144
      title: The Late Fare
      band: b_064
      label: label_6
      release_year: 2600
      kind: album
      genre: void-lounge
      cornerstone: false
      notes: >-
        Lower Bell Editions had been sitting on this band for six years and could not afford to press
        it. What changed in 2600 was the shared format the shipboard presses adopted that year, which
        cleared the plant's backlog and dropped the price of a short run far enough that Maro Deyn
        could pay for one out of the Lower Bell room's takings. It was recorded across four nights
        in the room itself, after the last ferry, with the band playing its ordinary set and stopping
        when the room emptied. Hessa Lin had joined that spring and her synth-harpsichord is on every
        track, which the house filed as the band changing sides and the band has never accepted.
        Nesta Vire has said the record is the room and not the band, and that this is why it works.
