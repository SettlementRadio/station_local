          title: The Late Fare
          track_number: 1
          genre: void-lounge
          mood_tags: [wry, unhurried, warm]
          playable: true
          fact: The fare Nesta Vire names in the second verse is what the room's own staff were charged to get home after the last ferry, which Ollan Beke copied off the board on the wall.
          credits: {writers: [p_nesta_vire, p_ollan_beke], players: [p_nesta_vire, p_ollan_beke, p_tarrin_meel, p_deran_shale, p_hessa_lin], producer: p_ollan_beke}
        - id: s_1172
          title: Coats on the Chair Backs
