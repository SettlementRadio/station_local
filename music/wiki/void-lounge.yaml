# Void-lounge — written by M-12.
#
# 55 playable songs on two labels, and the card that finishes both of them: label 6, the late-club
# house that folded in 2612 with its catalogue disputed, and label 3, the storm-coast house that
# picked the form up afterwards (D-068).
#
# Three things shape everything below:
#
# 1. **The form's own house folded.** Lower Bell Editions existed to press what the Concordance
#    late-club rooms played after the last ferry. It went under in 2612 owing the Gantry Street
#    plant two years of pressing, and its masters have been in a receiver's room ever since. Both
#    layer-A bands here are inside that catalogue, which is why one of them has made no record since
#    2612 and still plays every week. CONSTANTS.md section 1 puts the fold on the 2612 anchor and
#    calls the dispute the retrospective; this file is where the dispute is written down.
# 2. **The coast took the form up.** Stormline Issue presses the storm coast's dance music and, from
#    2617, the slow hour at the end of it — because Juna Carrow came out of the folded house looking
#    for work and could not get home before the season sealed. She is in two bands in this file,
#    b_065 and b_066, and she is the only person in the wiki who is.
# 3. **The two coast bands disagree about whose music it is.** The Quiet Half play the core's form on
#    the coast and say so. Nine Lamps play the slow hour too and will not use the core's name for it;
#    Stormline Issue files them as void-lounge over their objection, and prints the objection.
#
# `labels:` lists label_3 and label_6, the two the layer A sits on. Layer B reaches label_1, label_2
# and `unsigned`, all named elsewhere in the wiki, and check.py reads labels on layer-A albums only.
#
# **No cornerstone** (D-067): the list is full at six and this card designates none.

section:
  genre: void-lounge
  present_year: 2626
  layers:
    played: A
    referenced: B
    historical: C

labels:
  - id: label_3
    name: Stormline Issue
    home: Meridian storm coast
    tier: standard
    status: operating
    founded_year: 2597
    genre: void-lounge
    note: >-
      The house that presses the storm coast's dance music began pressing its slow hour in 2619, for
      the reason houses usually do: it had a singer on the coast, a sealed season, and nothing else
      to put out. It has kept doing it because the slow records sell up the relay in months the dance
      records cannot ship, and because the two acts cost it almost nothing. The house pays the slow
      hour at the same rate as the dancing, which it has been asked about in print and has never
      explained. It files both acts under the core's name for the form and one of them has objected
      to that in writing every year since 2620.
  - id: label_6
    name: Lower Bell Editions
    home: Concordance late-club quarter
    tier: standard
    status: folded
    founded_year: 2589
    folded_year: 2612
    catalogue_status: disputed
    founder: p_maro_deyn
    founder_comment: The founder has refused every catalogue interview since 2612.
    genre: void-lounge
    note: >-
      Maro Deyn founded the house in 2589 out of the Lower Bell room, where his own band had played
      three nights a week for eleven years, on the argument that the quarter's music was being
      pressed by houses that had never sat through an hour of it. For twenty-three years it was the
      only house in the settled worlds that existed for this form and nothing else. In 2610 Deyn
      borrowed against the catalogue to buy the Lower Bell room outright, the quarter's rents moved
      against him, and in 2612 the house folded owing the Gantry Street plant two years of pressing
      and its distributor a season paid in advance. Both claimed the catalogue, both were right about
      part of it, and the masters have sat in a receiver's room since. Everything the house ever
      pressed is inside that — After the Ferry, Coldwater Court, Evening Claim's last record, Warm
      Fraction's contested session parts, and Late Bell Set's two dance records, which went in with
      the rest and have not been pressed since.

