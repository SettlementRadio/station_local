          active_from: 2600
          active_to: 2626
      movement:
        initial: Purist
        changed_to: Synthesist
        changed_year: 2600
        detail: >-
          The band took Hessa Lin and her synth-harpsichord in for the first record and Lower Bell
          Editions filed it as a change of side. Nesta Vire's position is that a plucked electronic
          string in a room that small is a piano the band could afford, and she has never accepted
          the word for it.
      bio: >-
        After the Ferry have played the Lower Bell room three nights a week since 2594 and have never
        held a booking anywhere else in the quarter. Nesta Vire sings low and quietly enough that the
        room has to stop talking, which is a working method rather than a style, and she learned it
        from a room that would not. Ollan Beke writes at the room's own piano between the last ferry
        and the first, and the band's arrangements are what four people can carry up a stair. They
        have made no record since 2612, because everything they own is in the receiver's room with
        the rest of the house, and they play the same three nights anyway. Tarrin Meel keeps the
        band's accounts in the same book he kept them in when the house was paying.
      album_ids: [al_144, al_145, al_146]

