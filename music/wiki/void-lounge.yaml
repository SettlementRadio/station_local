    - id: al_146
      title: Everything on Account
      band: b_064
      label: label_6
      release_year: 2612
      kind: album
      genre: void-lounge
      cornerstone: false
      notes: >-
        Made in the spring of 2612 and pressed in the summer, by which time Lower Bell Editions was
        paying everybody in credit notes against a catalogue it had already borrowed against. The
        Gantry Street plant finished the run and then held it, as security for two years of unpaid
        pressing, and every copy the station has came out of the four boxes the band collected in
        person by arguing at the window for a day and a half. Nesta Vire wrote most of it out of the
        band's own paperwork and none of it is about the house in general; it is about four specific
        payments and one meeting. The record was not distributed, was never reviewed, and is the
        thing the quarter means when it talks about what was lost — which is inaccurate, because the
        band has it and plays it.
      songs:
        - id: s_1183
          title: Everything on Account
          track_number: 1
          genre: void-lounge
          mood_tags: [wry, bitter, midtempo]
          playable: true
          fact: The four amounts Nesta Vire sings are the four credit notes the band was last paid in, in the order they were issued.
          credits: {writers: [p_nesta_vire], players: [p_nesta_vire, p_ollan_beke, p_tarrin_meel, p_deran_shale, p_hessa_lin], producer: p_ollan_beke}
        - id: s_1184
          title: Who Signs for This
          track_number: 2
          genre: void-lounge
          mood_tags: [cold, tense, slow]
          playable: true
          fact: Ollan Beke wrote it in the plant's waiting room while the band argued for its own copies, and the count-in is the number on the clerk's window.
          credits: {writers: [p_ollan_beke, p_nesta_vire], players: [p_nesta_vire, p_ollan_beke, p_tarrin_meel, p_deran_shale], producer: p_ollan_beke}
        - id: s_1185
          title: Paid in Paper
          track_number: 3
          genre: void-lounge
          mood_tags: [resigned, warm, slow]
          playable: true
          fact: Tarrin Meel was paid for the record in paper the plant would not accept, kept all of it, and has it framed on the wall of the room the band still plays.
          credits: {writers: [p_nesta_vire, p_tarrin_meel], players: [p_nesta_vire, p_ollan_beke, p_tarrin_meel, p_deran_shale, p_hessa_lin], producer: p_ollan_beke}
