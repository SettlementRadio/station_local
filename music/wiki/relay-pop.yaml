    - id: al_008
      title: Shared Format
      band: b_004
      label: label_5
      release_year: 2600
      kind: EP
      genre: relay-pop
      cornerstone: false
      notes: >-
        The shared shipboard pressing format of 2600 let Cabin Treaty issue seven short songs beyond its usual freight circuit. Emi Soll standardized the group's session notes, but Cado Veir refused to replace percussion that other ships could not duplicate exactly. That argument ended the band's Purist claim and produced its Localist statement: a format could travel while an instrument remained tied to its room. The release reached more ports than the group's preceding work and returned every member's pressing share.
