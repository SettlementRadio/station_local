          title: Twenty Empty Chairs
          track_number: 4
          genre: relay-pop
          mood_tags: [lonely, restrained, slow]
          playable: true
          fact: The title counts the unused seats at the group's smallest paid Concordance performance in 2606.
          credits: {writers: [p_sena_quill, p_ivo_cern], players: [p_sena_quill, p_ivo_cern, p_keli_vos, p_arum_den, sp_oren_saye], producer: p_ivo_cern}
        - id: s_0028
          title: Raincheck Money
          track_number: 5
          genre: relay-pop
