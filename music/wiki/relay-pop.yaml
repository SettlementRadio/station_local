        - id: p_arum_den
          name: Arum Den
          genre: relay-pop
          instruments: [drum kit, metal blocks]
          active_from: 2603
          active_to: 2626
      movement:
        initial: Purist
        changed_to: Synthesist
        changed_year: 2607
        detail: The abandoned 2607 sessions convinced the group that repaired electronic instruments could preserve an idea instead of weakening it.
      bio: >-
        Open Parallax began as a Purist quartet playing unamplified lunch rooms in Concordance in 2603. Sena Quill changes a line whenever an audience sings it more cleanly than she does, so several accepted versions differ from the first issues. Studio closures in 2607 pushed the group toward repaired compact keyboards, and it has identified as Synthesist since that year. Ivo Cern handles the money, which is why the group has survived three expensive disagreements without missing a release.
      album_ids: [al_003, al_004]

