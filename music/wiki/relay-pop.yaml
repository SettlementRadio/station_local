        changed_to: Localist
        changed_year: 2600
        detail: The group rejected the Purist ban on ship-built percussion in 2600 and described every repairable freight instrument as local practice.
      bio: >-
        Cabin Treaty formed after four crew members settled a cabin-allocation dispute by agreeing to sing at the next port hall in 2590. Ressa Morn writes about pay, small favors, and relationships conducted around shift boards, while the band keeps freight detail as background rather than subject. The group began as Purist but adopted a Localist position in 2600 when Cado Veir proved that repaired oxygen tanks could be tuned consistently. Every member has a co-operative vote, and two planned tours were cancelled because the vote on ticket prices failed.
      album_ids: [al_007, al_008, al_009]

