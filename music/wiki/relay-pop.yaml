    - id: al_002
      title: Rooms With Windows
      band: b_001
      label: label_1
      release_year: 2624
      kind: album
      genre: relay-pop
      cornerstone: false
      notes: >-
        Civic Lantern placed Measure Kindly in the reopened Concordance public hall for eleven days in 2624. The group found that the restored high windows pulled the backing voices away from the lead microphone and rewrote the arrangements around that effect. A fee dispute stopped work for two days, after which all four members accepted less money to retain control of the session ledger. Demand for the hall forced the final mixes into a smaller room, and the difference is audible between the two halves of the record.
      songs:
        - id: s_0013
          title: Rooms With Windows
          track_number: 1
          genre: relay-pop
          mood_tags: [open, bright, expansive]
          playable: true
          fact: Sel Ardin placed the backing singers beneath separate windows so each answer arrived with a different room reflection.
          credits: {writers: [p_vara_ennel, p_odo_kest], players: [p_vara_ennel, p_odo_kest, p_rian_torc, p_pevi_marr, sp_sel_ardin], producer: p_rian_torc}
