        changed_year: 2605
        detail: Evening Claim stopped using stored sequence parts in 2605 after a royalty audit could not establish who owned them.
      bio: >-
        Evening Claim was the early-evening act at a late-club room in 2578 and made compact harmony songs for people who had not decided whether to go home. Mela Jorn records a guide at the piano, then removes any phrase that sounds cleverer than the complaint behind it. The group moved from Synthesist to Purist practice in 2605 after a royalty audit could not identify the owners of its stored sequence parts. Lower Bell Editions folded in 2612 with the band's final account unpaid, and the four members have declined every offer to recreate the missing paperwork.
      album_ids: [al_010, al_011]

  albums:
    - id: al_001
      title: Terms of Arrival
      band: b_001
      label: label_1
      release_year: 2619
      kind: album
      genre: relay-pop
      cornerstone: true
      notes: >-
        Measure Kindly booked a small committee chamber after the public halls became unavailable during the altered-credit rush of 2619. Vara Ennel brought twelve songs about ordinary negotiations and asked every guest player to accept the same fee. Odo Kest nearly left when the label proposed replacing his parts, but a blind vote kept the original takes. The record sold steadily, and its plain account sheet became part of the group's reputation.
      songs:
        - id: s_0001
          title: Meet Me at Noon
          track_number: 1
          genre: relay-pop
          mood_tags: [bright, expectant, brisk]
          playable: true
          fact: Vara Ennel wrote the chorus on the back of a room-booking refusal and kept the clerk's stamped time as the title.
          credits: {writers: [p_vara_ennel], players: [p_vara_ennel, p_odo_kest, p_rian_torc, p_pevi_marr, sp_sel_ardin], producer: p_odo_kest}
        - id: s_0002
          title: Paper Cup Promise
          track_number: 2
          genre: relay-pop
          mood_tags: [warm, playful, midtempo]
          playable: true
          fact: Pevi Marr plays the opening rhythm on four stacked drinking cups because the booked hand drum arrived cracked.
          credits: {writers: [p_vara_ennel, p_pevi_marr], players: [p_vara_ennel, p_odo_kest, p_rian_torc, p_pevi_marr], producer: p_odo_kest}
        - id: s_0003
