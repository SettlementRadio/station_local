layer_c:
  recordings: none survive
  figures:
    - id: f_001
      name: Edda Corven
      kind: solo
      genre: relay-pop
      active_from: 2432
      active_to: 2461
      played: lead voice and portable keyed strings
      history: >-
        Edda Corven sang compact call-and-answer pieces in communal meal rooms between 2432 and 2461. Written accounts describe her stopping mid-performance whenever a listener joined the answer too early, then beginning the whole piece again. Musicians still mention her because the pause before a reply in relay-pop is traditionally called a Corven space.

    - id: f_002
      name: Marn Ilex
      kind: group leader
      genre: relay-pop
      active_from: 2468
      active_to: 2502
      played: lead voice and struck metal frame
      history: >-
        Marn Ilex led a rotating group of shift workers from 2468 to 2502 and used a struck meal-room frame to keep their entries together. Surviving notices complain that Ilex credited every singer equally even when a room manager demanded a single author. Ilex remains important because later co-operative groups adopted that equal-line credit custom.

    - id: f_003
      name: Sola Dren
      kind: duo singer
      genre: relay-pop
      active_from: 2497
      active_to: 2524
      played: high answering voice and hand chimes
      history: >-
        Sola Dren exchanged verses with an unnamed low singer between 2497 and 2524, but no account agrees on whether they ever occupied the same settlement. Dren's hand chimes marked the expected arrival of each reply according to descriptions preserved in teaching notes. Presenters mention Dren because separated partners still call a precisely timed answer a Dren return.

    - id: f_004
      name: Tovin Karr
      kind: composer and singer
      genre: relay-pop
      active_from: 2511
      active_to: 2543
      played: low lead voice and composite table strings
      history: >-
        Tovin Karr wrote plain courtship pieces for a bright composite-string instrument from 2511 to 2543. A surviving contract shows that Karr refused a prestige hall unless the cleaners and room clerks could attend without charge. Karr is still cited when a relay-pop performer chooses a working room over a formal stage.