      label: label_6
      release_year: 2612
      kind: album
      genre: relay-pop
      cornerstone: false
      notes: >-
        Evening Claim entered the studio in 2612 while Lower Bell Editions was already refusing ordinary payment requests. The band turned eight disputed invoices into songs about favors, trust, and the discomfort of asking for what is owed. The label folded before manufacturing finished, and two catalogue claimants issued different track orders from the same masters. The station's order follows the signed session ledger, although ownership of that ledger remains part of the dispute.
      songs:
        - id: s_0098
          title: Catalogue of Small Debts
          track_number: 1
          genre: relay-pop
          mood_tags: [wry, controlled, midtempo]
          playable: true
          fact: Mela Jorn sings from the band's unpaid-invoice list but replaces every amount with the favor it was meant to purchase.
          credits: {writers: [p_mela_jorn, p_tovin_ashe], players: [p_mela_jorn, p_tovin_ashe, p_elo_vara, p_pira_nemm, sp_oren_saye], producer: p_mela_jorn}
