          genre: relay-pop
          mood_tags: [yearning, buoyant, late-night]
          playable: true
          fact: Sel Ardin built the answering chorus from a mistaken entrance that the group voted to keep.
          credits: {writers: [p_vara_ennel, p_rian_torc], players: [p_vara_ennel, p_odo_kest, p_rian_torc, p_pevi_marr, sp_sel_ardin], producer: p_odo_kest}
