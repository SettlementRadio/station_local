          genre: relay-pop
          instruments: [electronic drum kit, metal percussion]
          active_from: 2601
          active_to: 2626
      movement:
        initial: Synthesist
        changed_to: Synthesist
        changed_year: null
        detail: Rain Ledger argues that storm-season power limits are part of Meridian's musical language rather than a constraint to hide.
      bio: >-
        Rain Ledger formed in a storm-coast civic shelter in 2601 and still schedules sessions around the local power allotment. Nara Veck writes choruses first and refuses to record a verse until the whole group can sing the hook while packing equipment. The band is firmly Synthesist and treats power limits, damaged circuits, and compressed rehearsal time as useful arranging rules. Kerr Aven keeps a written list of every machine failure and brings the failed sound back on the next record if it can be played deliberately.
      album_ids: [al_005, al_006]

    - id: b_004
