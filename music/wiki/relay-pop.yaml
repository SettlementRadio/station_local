      label: label_5
      release_year: 2619
      kind: album
      genre: relay-pop
      cornerstone: true
      notes: >-
        Same Berth Twice followed a 2619 co-operative rule change that let Cabin Treaty hold one room for an entire route instead of rebuilding a session at each stop. The altered-credit dispute made the members unusually formal: every chorus contribution was logged before the next take. Ressa Morn and Jalen Rook stopped speaking outside performance after a disagreement over the title track, but both completed the record. The album became Common Wake Cooperative's strongest seller and financed repairs to three member-owned pressing units.
