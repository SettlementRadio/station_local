          name: Pevi Marr
          genre: relay-pop
          instruments: [compact drum kit, chimes]
          active_from: 2615
          active_to: 2626
      movement:
        initial: Synthesist
        changed_to: Localist
        changed_year: 2622
        detail: The group kept electronic strings but began writing arrangements around Concordance public-hall acoustics in 2622.
      bio: >-
        Measure Kindly formed from four clerks who sang together while checking public-hall accounts in 2615. Vara Ennel writes direct songs about manners, money, and the point where patience runs out. The group moved from strict Synthesist practice to a Localist position in 2622 after discovering that the repaired Concordance halls changed the balance of every chorus. They rehearse at lunch, keep written votes on arrangements, and discard any part that two members cannot remember the next day.
      album_ids: [al_001, al_002]

    - id: b_002
      name: Open Parallax
      kind: group
