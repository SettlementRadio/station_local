    - id: al_003
      title: Useful Trouble
      band: b_002
      label: label_1
      release_year: 2607
      kind: album
      genre: relay-pop
      cornerstone: false
      notes: >-
        Open Parallax started Useful Trouble in a Concordance room fitted only for unamplified performance. Meridian's closures in 2607 sent repaired compact keyboards into the core market, and Keli Vos persuaded the group to use one after its second session failed. The decision ended the band's Purist period and prompted a month of letters from its lunch-room audience. Civic Lantern recovered the modest cost within the release year, largely because the objections made listeners curious.
      songs:
        - id: s_0024
          title: Useful Trouble
          track_number: 1
          genre: relay-pop
          mood_tags: [mischievous, bright, brisk]
          playable: true
          fact: Keli Vos plays the repaired compact keyboard that caused the band's public break with Purist practice.
          credits: {writers: [p_sena_quill, p_keli_vos], players: [p_sena_quill, p_ivo_cern, p_keli_vos, p_arum_den, sp_sel_ardin], producer: p_ivo_cern}
        - id: s_0025
          title: Bad at Goodbye
          track_number: 2
          genre: relay-pop
          mood_tags: [wry, yearning, quick]
          playable: true
          fact: Sena Quill rewrote the chorus after an audience supplied a shorter final line during a lunch-room test.
          credits: {writers: [p_sena_quill], players: [p_sena_quill, p_ivo_cern, p_keli_vos, p_arum_den], producer: p_ivo_cern}
        - id: s_0026
          title: The Door Sticks
          track_number: 3
          genre: relay-pop
          mood_tags: [frustrated, catchy, midtempo]
          playable: true
          fact: Arum Den copied the rehearsal-room door's three-part knock on metal blocks for the opening figure.
          credits: {writers: [p_sena_quill, p_arum_den], players: [p_sena_quill, p_ivo_cern, p_keli_vos, p_arum_den, sp_brin_noll], producer: p_ivo_cern}
