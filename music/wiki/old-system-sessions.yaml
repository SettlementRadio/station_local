    - id: al_100
      title: Nobody Sings It Alone
      band: b_047
      label: label_7
      release_year: 2612
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        Cut in a Titan lake yard's hall over two evenings in 2611 and issued at the road head in
        2612, the first Shore Rounds record to leave the home system. The edition the station holds
        is not the one Titan bought: the crate had room for eight songs and the importer dropped the
        ninth, told nobody, and the band learned of it in 2616 from a letter written by a listener
        who had heard both. Relay Road Import has never argued that it was right, only that the
        alternative was leaving the record behind altogether. The four voices are recorded on one
        microphone at the distances they stand at when they sing in the yard, which took most of the
        first evening to arrange. Bran Teale plays with two fingers taped after a yard injury and the
        guitar parts were simplified in the room to suit it.
      songs:
        - id: s_0820
          title: Nobody Sings It Alone
          track_number: 1
          genre: old-system-sessions
          mood_tags: [warm, rolling, communal]
          playable: true
          fact: The four enter a line apart and the last voice in is Kell Moray's, the place he asked for when he joined and has kept on every record since.
          credits: {writers: [p_effa_lomm], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}
        - id: s_0821
          title: Count the Boats Back
          track_number: 2
          genre: old-system-sessions
          mood_tags: [steady, patient, cold]
          playable: true
          fact: The counting verse is the yard's return list and Effa Lomm sings the boats in the order they actually came in that evening.
          credits: {writers: [p_effa_lomm, p_ilva_reske], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}
        - id: s_0822
          title: Wet Rope, Cold Hands
          track_number: 3
          genre: old-system-sessions
          mood_tags: [plain, midtempo, hard]
          playable: true
          fact: Bran Teale plays it with two fingers taped together after a yard injury, and the part was cut down to what he could reach on the evening.
          credits: {writers: [p_bran_teale], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}
        - id: s_0823
          title: Lamp Room Round
          track_number: 4
          genre: old-system-sessions
          mood_tags: [close, warm, communal]
          playable: true
          fact: Sung in the yard's lamp room rather than the hall because the band wanted the walls, and the door being opened halfway through is on the take.
          credits: {writers: [p_effa_lomm], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}
        - id: s_0824
          title: The Far Shore Boat
          track_number: 5
          genre: old-system-sessions
          mood_tags: [slow, longing, sparse]
          playable: true
          fact: Effa Lomm sings it with nothing behind her, the only unaccompanied track the band has recorded, and she asked the others to leave the hall for it.
          credits: {writers: [p_effa_lomm], players: [p_effa_lomm], producer: p_effa_lomm}
        - id: s_0825
          title: Two Kinds of Cold
          track_number: 6
          genre: old-system-sessions
          mood_tags: [blue, slow, still]
          playable: true
          fact: Ilva Reske's low harmony was sung again after the others had gone home and laid over the take, which is the only overdub on any Shore Rounds record.
          credits: {writers: [p_ilva_reske], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}
        - id: s_0826
          title: Money in the Wrong Pocket
          track_number: 7
          genre: old-system-sessions
          mood_tags: [wry, brisk, blunt]
          playable: true
          fact: About a yard clerk who paid the crews late for a year, and the importer had the name in the third verse taken out before pressing it at the road head.
          credits: {writers: [p_effa_lomm, p_bran_teale], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}
        - id: s_0827
          title: Round for the Last Boat
          track_number: 8
          genre: old-system-sessions
          mood_tags: [final, warm, communal]
          playable: true
          fact: The last track of the imported edition, and on Titan it is followed by a ninth song the crate had no room for.
          credits: {writers: [p_effa_lomm], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}

    - id: al_101
      title: Two Lamps and a Table
      band: b_047
      label: label_7
      release_year: 2619
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        Made in 2618 in the lake yard's meeting room, which had a table, two lamps and one
        microphone, and issued at the road head in 2619. The band had refused a studio in the
        settlement for the second time and the importer stopped offering. Saira Dunn, of Undershore
        Local, came from Europa for it and spent two days tuning the yard office piano, which had
        not been touched since it was installed. This is the record on which the Shore Rounds began
        naming who sang which part on the sleeve, after four years of arguing that a round has no
        lead — Effa Lomm's position was that the importer would put a name on it anyway and it might
        as well be the right ones.
      songs:
        - id: s_0828
          title: Two Lamps and a Table
          track_number: 1
          genre: old-system-sessions
          mood_tags: [close, warm, slow]
          playable: true
          fact: Recorded around one table with two lamps and a single microphone, which is everything the yard's meeting room had in it.
          credits: {writers: [p_effa_lomm], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}
        - id: s_0829
          title: Everybody Take a Line
          track_number: 2
          genre: old-system-sessions
          mood_tags: [communal, bright, midtempo]
          playable: true
          fact: The four sing a verse each in the order they joined the band, which Bran Teale insisted on and Effa Lomm has called the only rule they have.
          credits: {writers: [p_effa_lomm, p_bran_teale], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}
        - id: s_0830
          title: The Borrowed Piano
          track_number: 3
          genre: old-system-sessions
          mood_tags: [rolling, warm, generous]
          playable: true
          fact: Saira Dunn plays the yard office piano she had spent two days tuning, and the band wrote the song around it once she had finished.
          credits: {writers: [p_effa_lomm, p_bran_teale], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske, p_saira_dunn], producer: p_effa_lomm}
        - id: s_0831
          title: Ice on the Steps
          track_number: 4
          genre: old-system-sessions
          mood_tags: [cold, sparse, restless]
          playable: true
          fact: Kell Moray bows the bass for the only time on any of the band's records, having borrowed the bow from a yard hand who played nothing else.
          credits: {writers: [p_kell_moray], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}
        - id: s_0832
          title: Ask the Lamp Man
          track_number: 5
          genre: old-system-sessions
          mood_tags: [wry, midtempo, plain]
          playable: true
          fact: The yard's lamp keeper was in the room for the take and objected to two lines, both of which stayed in.
          credits: {writers: [p_bran_teale], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske, p_saira_dunn], producer: p_effa_lomm}
        - id: s_0833
          title: A Long Wait at the Gate
          track_number: 6
          genre: old-system-sessions
          mood_tags: [patient, tired, steady]
          playable: true
          fact: Written waiting for a boat that never came, and Effa Lomm set the tempo by walking the length of the room while the others found it.
          credits: {writers: [p_effa_lomm], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}
        - id: s_0834
          title: Last One Off the Water
          track_number: 7
          genre: old-system-sessions
          mood_tags: [final, warm, close]
          playable: true
          fact: The four turn away from the microphone for the last round, so it gets quieter as it goes, and nobody asked them to do it again.
          credits: {writers: [p_effa_lomm, p_ilva_reske], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}

    - id: al_102
      title: Whatever Fits the Crate
      band: b_047
      label: label_7
      release_year: 2624
      kind: EP
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        The first record anybody in the home system made because the settled worlds asked for one.
        Relay Road Import wrote to the Shore Rounds in 2622 asking for more and, being an importer
        rather than a label, specified the request in minutes of crate space rather than songs. The
        band cut five in 2623 and the record runs to within a minute of the length the letter named.
        Amon Furlow came from Mars to play piano on one track, invited by the same letter, and met
        the band on the morning of the session. It is the only Shore Rounds record made in a hired
        room, and Effa Lomm has said that agreeing to the length was the concession and the room was
        merely the consequence.
      songs:
        - id: s_0835
          title: Whatever Fits the Crate
          track_number: 1
          genre: old-system-sessions
          mood_tags: [wry, brisk, warm]
          playable: true
          fact: The title is what Effa Lomm wrote back to the importer, and the record runs to within a minute of the length that letter asked for.
          credits: {writers: [p_effa_lomm], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}
        - id: s_0836
          title: Sing It Twice Over
          track_number: 2
          genre: old-system-sessions
          mood_tags: [communal, bright, rolling]
          playable: true
          fact: The round goes through twice because the band arrived with four songs and had been asked for five.
          credits: {writers: [p_effa_lomm, p_bran_teale], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}
        - id: s_0837
          title: A Letter and a Number
          track_number: 3
          genre: old-system-sessions
          mood_tags: [dry, midtempo, knowing]
          playable: true
          fact: The importer's letter asked for songs with fewer names in them, and Bran Teale put the request itself into the second verse.
          credits: {writers: [p_bran_teale], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}
        - id: s_0838
          title: Cold Meal, Warm Room
          track_number: 4
          genre: old-system-sessions
          mood_tags: [warm, slow, generous]
          playable: true
          fact: Amon Furlow plays piano, having crossed from Mars on the strength of a letter, and the band had never heard him play before that morning.
          credits: {writers: [p_effa_lomm], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske, p_amon_furlow], producer: p_effa_lomm}
        - id: s_0839
          title: Same Four Voices
          track_number: 5
          genre: old-system-sessions
          mood_tags: [final, close, communal]
          playable: true
          fact: The four sing it with no instruments at all, which is what they do at the end of every night in the yard and had never put on a record.
          credits: {writers: [p_effa_lomm, p_ilva_reske], players: [p_effa_lomm, p_bran_teale, p_kell_moray, p_ilva_reske], producer: p_effa_lomm}

    - id: al_103
      title: Nothing Dries Down Here
      band: b_048
      label: label_7
      release_year: 2600
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        Cut in 2599 in the canteens and galleries of the Europa under-ice works, where the band had
        played for eleven years, and issued at the road head in 2600. The union local paid for the
        recording out of its own funds after the works refused, which is why the sleeve of the Europa
        pressing carries a branch number instead of a producer's name. The cold defeated the piano —
        it could not be brought to pitch and Saira Dunn played it flat rather than move rooms — and
        the yard's four-second decay is on the tracks cut in the gallery. Relay Road Import took it
        because it was cheap and because the house had nothing else that season, and it is the oldest
        record in the station's import catalogue.
      songs:
        - id: s_0840
          title: Nothing Dries Down Here
          track_number: 1
          genre: old-system-sessions
          mood_tags: [wry, rolling, midtempo]
          playable: true
          fact: Hob Venner wrote the chorus on the back of a grievance form and the form is reproduced on the sleeve of the Europa pressing.
          credits: {writers: [p_hob_venner], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0841
          title: The Long Ladder
          track_number: 2
          genre: old-system-sessions
          mood_tags: [driving, hard, steady]
          playable: true
          fact: Marta Ospel plays it on a kit with no cymbals, which she took off because the gallery's echo made them unusable and never put back.
          credits: {writers: [p_hob_venner, p_marta_ospel], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0842
          title: Wages in Two Halves
          track_number: 3
          genre: old-system-sessions
          mood_tags: [blunt, brisk, defiant]
          playable: true
          fact: The local's committee asked the band not to record it during a live dispute about split payments, the only time it ever asked them for anything.
          credits: {writers: [p_hob_venner], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0843
          title: Saltwater Boots
          track_number: 4
          genre: old-system-sessions
          mood_tags: [plain, midtempo, cold]
          playable: true
          fact: Saira Dunn's piano is a quarter-tone flat for the whole track because it would not hold pitch in the cold and the band would not move rooms.
          credits: {writers: [p_hob_venner, p_saira_dunn], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0844
          title: Ask Me When I'm Dry
          track_number: 5
          genre: old-system-sessions
          mood_tags: [funny, shuffling, warm]
          playable: true
          fact: Tel Brask plays the harmonica through a lamp horn, which is how he played it in the canteens so it would carry down a gallery.
          credits: {writers: [p_tel_brask], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0845
          title: The Second Gate
          track_number: 6
          genre: old-system-sessions
          mood_tags: [slow, blue, still]
          playable: true
          fact: About a man who worked the second gate for thirty years; he heard the record when it came out and told the band he did not recognise himself in it.
          credits: {writers: [p_hob_venner], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0846
          title: Two Shifts, No Sleep
          track_number: 7
          genre: old-system-sessions
          mood_tags: [tired, driving, hard]
          playable: true
          fact: Cut at the end of a double shift and Hob Venner's voice fails on the last verse, which the band kept on the grounds that it was accurate.
          credits: {writers: [p_hob_venner, p_marta_ospel], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0847
          title: Under the Ice Yard
          track_number: 8
          genre: old-system-sessions
          mood_tags: [cold, spacious, slow]
          playable: true
          fact: Recorded in the gallery rather than the canteen, and the four-second decay on it is the room and not anything the recording did.
          credits: {writers: [p_saira_dunn], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0848
          title: Walk Out Together
          track_number: 9
          genre: old-system-sessions
          mood_tags: [communal, final, warm]
          playable: true
          fact: The local's whole night shift sings the last chorus, about forty people, and the sleeve credits them under the branch number rather than by name.
          credits: {writers: [p_hob_venner], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}

    - id: al_104
      title: Second Shift Blues
      band: b_048
      label: label_7
      release_year: 2607
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        The band's second and last record, cut in 2606 across four nights in the same canteen and
        issued at the road head in 2607. The works had gone to a rolling shift pattern that never put
        the four of them off duty together, and the sessions were arranged around the two nights a
        month it did — which is why it took four nights spread over a season to make a record of
        seven songs. Saira Dunn arranged all of it, including the harmonica parts, and played in
        cut-off gloves that are audible on the keys. Undershore Local knew this was the last one
        while they were making it and said so on the sleeve, in one line, without explanation.
      songs:
        - id: s_0849
          title: Second Shift Blues
          track_number: 1
          genre: old-system-sessions
          mood_tags: [slow, blue, weary]
          playable: true
          fact: The only song the band gave their own form's name to, and Hob Venner said he used the word because it was the plainest one available.
          credits: {writers: [p_hob_venner], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0850
          title: Nobody Off at the Same Time
          track_number: 2
          genre: old-system-sessions
          mood_tags: [wry, midtempo, tired]
          playable: true
          fact: Written about the shift pattern that ended the band, and recorded on one of the two nights a month that pattern left them all free.
          credits: {writers: [p_hob_venner, p_marta_ospel], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0851
          title: Cold Store, Late Hour
          track_number: 3
          genre: old-system-sessions
          mood_tags: [slow, close, cold]
          playable: true
          fact: Saira Dunn plays in gloves with the fingers cut off, which can be heard on the keys throughout, because the canteen heating was off after midnight.
          credits: {writers: [p_saira_dunn], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0852
          title: Half the Local Left
          track_number: 4
          genre: old-system-sessions
          mood_tags: [blunt, driving, hard]
          playable: true
          fact: The membership numbers in the second verse are the branch's real ones, read off the noticeboard on the night of the take.
          credits: {writers: [p_hob_venner], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0853
          title: Nothing Warm to Drink
          track_number: 5
          genre: old-system-sessions
          mood_tags: [dry, shuffling, funny]
          playable: true
          fact: Tel Brask sings the lead, the only time he does on either record, because Hob Venner was on shift and came in after it was finished.
          credits: {writers: [p_tel_brask], players: [p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0854
          title: The Last Grievance
          track_number: 6
          genre: old-system-sessions
          mood_tags: [hard, defiant, brisk]
          playable: true
          fact: Played once at the branch's final meeting and once for the record, and the band refused a second take on the grounds that they had already done it twice.
          credits: {writers: [p_hob_venner, p_saira_dunn], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}
        - id: s_0855
          title: Nobody Locks It Behind Us
          track_number: 7
          genre: old-system-sessions
          mood_tags: [final, slow, warm]
          playable: true
          fact: The last thing Undershore Local recorded, and the sound at the end is the yard gate, which nobody had ever locked and which is on the take anyway.
          credits: {writers: [p_hob_venner], players: [p_hob_venner, p_saira_dunn, p_tel_brask, p_marta_ospel], producer: p_saira_dunn}

    - id: al_140
      title: Ten Locks to the Sea
      band: b_063
      label: label_7
      release_year: 2607
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        Cut in 2605 in the lock house at the head of the cut and issued at the road head in 2607,
        and it is the first record made on Earth that Relay Road Import has ever landed. The house
        had been writing to Earth for eleven years and had been ignored every time or asked for
        money in advance; this master reached it because a clerk on Earth read one of those letters
        as the address of a district rather than of a yard, which is how a letter meant for the Bell
        Yard Rounds arrived at a lock house. An Earth record takes two crossings rather than one, so
        the band had been paid, once and flat, and had stopped thinking about the whole business
        long before anybody out here heard a note of it. The argument about whether the importer
        landed the wrong band from Earth started the season it went on sale and has not stopped
        since. Fenna Crole's reply to the original letter, which opens by telling the house that
        this is not the band it wrote for, hangs in the importer's office beside Wesla Tarn's.
      songs:
        - id: s_1141
          title: Ten Locks to the Sea
          track_number: 1
          genre: old-system-sessions
          mood_tags: [rolling, warm, midtempo]
          playable: true
          fact: Fenna Crole counts ten locks and there are eleven, because the eleventh was cut in after she wrote it and she has refused to change the number since.
          credits: {writers: [p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow], producer: p_torr_bexley}
        - id: s_1142
          title: Wait for the Water
          track_number: 2
          genre: old-system-sessions
          mood_tags: [patient, slow, wry]
          playable: true
          fact: Written in the hour and a half the top lock needs to fill, which Fenna Crole timed against the lock house clock before she would let the band shorten it.
          credits: {writers: [p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow], producer: p_torr_bexley}
        - id: s_1143
          title: Nobody Walks the Towpath
          track_number: 3
          genre: old-system-sessions
          mood_tags: [blue, midtempo, plain]
          playable: true
          fact: About the winter the towpath lamps were stripped off the posts for the metal in them, and the man the crews blamed lived four doors from Sim Pallow and never spoke to him again.
          credits: {writers: [p_fenna_crole, p_sim_pallow], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow], producer: p_torr_bexley}
        - id: s_1144
          title: Half a Mile an Hour
          track_number: 4
          genre: old-system-sessions
          mood_tags: [slow, steady, dry]
          playable: true
          fact: Aldis Merrow plays it at the speed a loaded boat moves and would not agree to the tempo until Torr Bexley had walked one alongside him.
          credits: {writers: [p_aldis_merrow, p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow], producer: p_torr_bexley}
        - id: s_1145
          title: Two Boats Waiting
          track_number: 5
          genre: old-system-sessions
          mood_tags: [funny, brisk, blunt]
          playable: true
          fact: The two crews who would not give way to one another for a whole afternoon in 2604 are both in the song, and both of them bought the record.
          credits: {writers: [p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow], producer: p_torr_bexley}
        - id: s_1146
          title: Paid at the Wharf
          track_number: 6
          genre: old-system-sessions
          mood_tags: [driving, hard, defiant]
          playable: true
          fact: The sum in the last verse is what the four of them were paid for this record, once and flat, and nothing has been added to it since.
          credits: {writers: [p_fenna_crole, p_torr_bexley], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow], producer: p_torr_bexley}
        - id: s_1147
          title: Down to the Lock House
          track_number: 7
          genre: old-system-sessions
          mood_tags: [close, warm, final]
          playable: true
          fact: Sim Pallow plays with his hands and no sticks the whole way through, because the lock house is joined to a house with a child asleep in it.
          credits: {writers: [p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow], producer: p_torr_bexley}

    - id: al_141
      title: Everything Comes By Water
      band: b_063
      label: label_7
      release_year: 2612
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        Made in 2610, the season the cut was drained for repair and nobody working on it earned
        anything, and issued at the road head in 2612. The band had a concertina in it for the first
        time — Wenna Ferrin had come off the next boat and joined that spring — and Relay Road
        Import, which had written asking for more of the first record, got a slower one made by five
        people with no wages coming in. The repair gang are on two of the choruses and were paid the
        way the band was, out of a share of what the lock house had. Fenna Crole has said the record
        is not about the closure and that it is simply the only time the five of them have ever been
        in the same room for a whole season. It has never been off the importer's list.
      songs:
        - id: s_1148
          title: Everything Comes By Water
          track_number: 1
          genre: old-system-sessions
          mood_tags: [rolling, warm, communal]
          playable: true
          fact: Wenna Ferrin's concertina is on it from the first bar and she had been in the band three months when they recorded it.
          credits: {writers: [p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1149
          title: The Cut Is Closed
          track_number: 2
          genre: old-system-sessions
          mood_tags: [still, cold, patient]
          playable: true
          fact: The gang who drained the cut sing the chorus, and they were paid for it out of the same share the band was.
          credits: {writers: [p_fenna_crole, p_torr_bexley], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1150
          title: A Winter Off the Boats
          track_number: 3
          genre: old-system-sessions
          mood_tags: [slow, blue, close]
          playable: true
          fact: Fenna Crole wrote it in the four days her whole family were in the lock house together for the first time since 2599, which she has said was three days more than anybody needed.
          credits: {writers: [p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1151
          title: Nothing Moves Till the Thaw
          track_number: 4
          genre: old-system-sessions
          mood_tags: [dry, tired, midtempo]
          playable: true
          fact: Torr Bexley plays with a boat rope wound round the neck of the bass to deaden it, which he began doing because of the cold and has never stopped.
          credits: {writers: [p_fenna_crole, p_aldis_merrow], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1152
          title: Owe It to the Shop
          track_number: 5
          genre: old-system-sessions
          mood_tags: [wry, brisk, plain]
          playable: true
          fact: The woman who kept the crews in credit through the closure is in the second verse and asked the band to leave her name in it.
          credits: {writers: [p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1153
          title: Somebody Else's Kitchen
          track_number: 6
          genre: old-system-sessions
          mood_tags: [warm, fond, slow]
          playable: true
          fact: Written about the fortnight the band spent eating in other people's kitchens, and Fenna Crole has never said whose.
          credits: {writers: [p_fenna_crole, p_wenna_ferrin], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1154
          title: Back on the Water
          track_number: 7
          genre: old-system-sessions
          mood_tags: [bright, driving, final]
          playable: true
          fact: The first thing the five of them played on the day the water came back, standing on the lock beam, and the record ends where the closure did.
          credits: {writers: [p_fenna_crole, p_torr_bexley], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}

    - id: al_142
      title: Not the Band You Wrote For
      band: b_063
      label: label_7
      release_year: 2619
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        Cut in 2617 in the lock house and in a wharf room at the bottom of the cut, and issued at
        the road head in 2619. Relay Road Import had sent the band, unasked, a bundle of the letters
        printed out here arguing about whether the house had landed the wrong band from Earth, and
        Fenna Crole read the whole bundle aloud in the lock house over one evening. The record is
        the band's answer to it and it disappointed the people who had written the letters, because
        it is not an angry record and only two songs on it are about the argument at all. Aldis
        Merrow worked out on paper, twice, that a reply cannot reach the settled worlds in the same
        year as the letter it answers, and the band would not believe him until the second time. It
        is the longest record they have made and the only one made in two rooms.
      songs:
        - id: s_1155
          title: Not the Band You Wrote For
          track_number: 1
          genre: old-system-sessions
          mood_tags: [brisk, dry, knowing]
          playable: true
          fact: The title is the line Fenna Crole put at the top of her first reply to Relay Road Import in 2605, when she thought that would be the end of it.
          credits: {writers: [p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1156
          title: Letters Take a Season
          track_number: 2
          genre: old-system-sessions
          mood_tags: [patient, blue, midtempo]
          playable: true
          fact: The second verse is Aldis Merrow's arithmetic about an answer that cannot arrive in the same year as the letter it answers, sung as he wrote it out.
          credits: {writers: [p_aldis_merrow, p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1157
          title: It Was Meant for Somebody Else
          track_number: 3
          genre: old-system-sessions
          mood_tags: [wry, rolling, plain]
          playable: true
          fact: About a coat somebody left in the lock house and never came back for, which is still on the same hook.
          credits: {writers: [p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1158
          title: Eleven Miles of Water
          track_number: 4
          genre: old-system-sessions
          mood_tags: [steady, warm, rolling]
          playable: true
          fact: Torr Bexley counts the eleven miles off by the bridges rather than by the locks, which is how the crews do it and why his numbers do not agree with the band's first record.
          credits: {writers: [p_torr_bexley], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1159
          title: The Bottom Gate Leaks
          track_number: 5
          genre: old-system-sessions
          mood_tags: [blunt, hard, driving]
          playable: true
          fact: The bottom gate of the lowest lock has leaked since 2601 and the band sent this song to the navigation office with a copy of the record.
          credits: {writers: [p_fenna_crole, p_torr_bexley], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1160
          title: Two Names on the Bill
          track_number: 6
          genre: old-system-sessions
          mood_tags: [midtempo, fond, plain]
          playable: true
          fact: The two names in the chorus belong to the lock keepers who worked the cut before Fenna Crole's family did, and both their daughters were in the room for it.
          credits: {writers: [p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1161
          title: Working Under the Bridge
          track_number: 7
          genre: old-system-sessions
          mood_tags: [loud, defiant, fast]
          playable: true
          fact: Sim Pallow strikes the arch of the bridge with a lock key all the way through, because the band played this one standing underneath it.
          credits: {writers: [p_fenna_crole, p_sim_pallow], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1162
          title: She Never Wrote Back
          track_number: 8
          genre: old-system-sessions
          mood_tags: [slow, aching, blue]
          playable: true
          fact: The only song on the record Fenna Crole did not write; Aldis Merrow wrote it, has never said who it is about, and the band have stopped asking him.
          credits: {writers: [p_aldis_merrow], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1163
          title: Stay Where the Water Is
          track_number: 9
          genre: old-system-sessions
          mood_tags: [final, close, warm]
          playable: true
          fact: The last thing cut in the wharf room, sung with the doors on to the water standing open, and a boat goes past underneath the final verse.
          credits: {writers: [p_fenna_crole, p_wenna_ferrin], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}

    - id: al_143
      title: Somebody Sent Us This
      band: b_063
      label: label_7
      release_year: 2624
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        Cut in 2621 and issued at the road head in 2624, because the first copy was in the crate
        that went astray in 2622 and very nearly closed the house. Fenna Crole had kept the band's
        second copy on the lock house shelf and it went out on the first crossing after the loss was
        worked out. The record exists at all because Relay Road Import had, in 2619, sent something
        up the road for once — a Shore Rounds pressing with no letter and no name on the sleeve —
        and the Ninefoot Cut spent a season finding out whose it was and then learned one of the
        rounds off it. It is the only record in the house's list on which the road ran both ways,
        and Effa Lomm has written that she would like to hear it and has not been sent one.
      songs:
        - id: s_1164
          title: Somebody Sent Us This
          track_number: 1
          genre: old-system-sessions
          mood_tags: [bright, warm, midtempo]
          playable: true
          fact: The record the importer sent to the lock house in 2619 arrived with no letter and no name on the sleeve, and the band wrote to the road head and waited a season to find out whose it was.
          credits: {writers: [p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1165
          title: Sing the One They Sent
          track_number: 2
          genre: old-system-sessions
          mood_tags: [communal, rolling, close]
          playable: true
          fact: The round is the Shore Rounds', learned off that record, and the Ninefoot Cut come in together where the Titan band come in a line apart.
          credits: {writers: [p_fenna_crole, p_wenna_ferrin], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1166
          title: Nine Foot of Water
          track_number: 3
          genre: old-system-sessions
          mood_tags: [dry, funny, brisk]
          playable: true
          fact: Fenna Crole gives the cut its depth in the first line and the navigation office wrote to the band to say that it is nine foot six.
          credits: {writers: [p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1167
          title: The Second Copy
          track_number: 4
          genre: old-system-sessions
          mood_tags: [patient, wry, steady]
          playable: true
          fact: Written about the crate that went astray in 2622 with the band's first copy in it, and finished before anybody had told them the crate was gone.
          credits: {writers: [p_fenna_crole, p_torr_bexley], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1168
          title: The Same Eleven Miles
          track_number: 5
          genre: old-system-sessions
          mood_tags: [slow, plain, fond]
          playable: true
          fact: Torr Bexley has worked the same eleven miles since 2598, and the song lists what has changed on them in order and ends on nothing.
          credits: {writers: [p_torr_bexley], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1169
          title: Who Taught You That
          track_number: 6
          genre: old-system-sessions
          mood_tags: [warm, generous, midtempo]
          playable: true
          fact: Wenna Ferrin learned the concertina from a woman on the next boat who would not play a tune twice, and this is the one tune she went back and asked for three times.
          credits: {writers: [p_wenna_ferrin, p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}
        - id: s_1170
          title: Leave the Gate Open
          track_number: 7
          genre: old-system-sessions
          mood_tags: [final, communal, bright]
          playable: true
          fact: The band played it out through the open lock house door and the crews tied up outside sing the last chorus back at them.
          credits: {writers: [p_fenna_crole], players: [p_fenna_crole, p_aldis_merrow, p_torr_bexley, p_sim_pallow, p_wenna_ferrin], producer: p_torr_bexley}

