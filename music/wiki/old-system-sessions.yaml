      kind: group
      home_settlement: Earth
      label: not imported
      genre: old-system-sessions
      active_from: 2568
      active_to: 2600
      bio: >-
        The Bell Yard Rounds sing on Earth itself, in the river yards where the form is generally
        agreed to have started, and are the band every account of the rounds gets round to
        eventually. Nothing of theirs has ever come down the road, so what is known out here is
        entirely second-hand and the settled worlds have argued about the running order of their
        second record without anybody having heard it.
