          fact: The works foreman asked the band not to play it in the canteen, which is why they opened with it every week for the rest of that year.
          credits: {writers: [p_wesla_tarn, p_nan_sudell], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_nan_sudell], producer: p_amon_furlow}
