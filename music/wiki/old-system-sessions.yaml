          fact: Written about holding the works shift and the canteen night at the same time, which all four of them were still doing when the record was made.
          credits: {writers: [p_wesla_tarn, p_amon_furlow], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_orin_lask], producer: p_amon_furlow}
        - id: s_0802
          title: The Water's Off Again
