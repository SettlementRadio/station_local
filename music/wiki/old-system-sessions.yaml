        - id: p_ilva_reske
          name: Ilva Reske
          genre: old-system-sessions
          instruments: [harmony vocal, hand percussion]
          active_from: 2596
          active_to: 2626
      movement: outside it
      bio: >-
        The Shore Rounds work the Titan lake yards and sing the rounds the yards have always sung,
        four voices entering a line apart with the instruments kept underneath. Effa Lomm takes most
        of the leads because she is the one who can be heard across water, and the band has no
        singer's name on any sleeve it controls. They record where they happen to be standing — a
        hall, a lamp room, a meeting room with one microphone — and have refused a studio twice on
        the grounds that a round needs a room that answers. Kell Moray joined two years after the
        others and asked for the last entrance in the round, which he has kept ever since. The band
        found out in 2616 that the edition sold in the settled worlds was one song shorter than
        theirs, and Bran Teale has raised it in every letter since.
      album_ids: [al_100, al_101, al_102]

