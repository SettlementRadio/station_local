    - id: al_099
      title: Later Than Advertised
      band: b_046
      label: label_7
      release_year: 2619
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        The band's first record, cut in the canteen in 2618 for a Mars house that pressed four
        hundred copies and did nothing else with them. Relay Road Import bought the master unheard on
        the recommendation of a clerk at the road head who had a cousin on Mars, which is the whole
        of the house's acquisition process and the reason it has the band at all. Nan Sudell is on
        drums throughout and plays with brushes on most of it because the room next to the canteen
        was still working. Tel Brask, of Undershore Local, is on one track; he was on Mars for a
        fortnight for someone else's wedding and walked in during the second night. It sold slowly
        for five years and then sold out entirely in the season after the second record landed.
      songs:
        - id: s_0809
          title: Later Than Advertised
          track_number: 1
          genre: old-system-sessions
          mood_tags: [shuffling, wry, brisk]
          playable: true
          fact: Named for the band's habit of starting an hour after the notice said, and the notice from 2617 is reproduced on the sleeve.
          credits: {writers: [p_wesla_tarn], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_nan_sudell], producer: p_amon_furlow}
        - id: s_0810
          title: Half the Fare Home
          track_number: 2
          genre: old-system-sessions
          mood_tags: [midtempo, plain, tired]
          playable: true
          fact: Nan Sudell plays the whole track with brushes because the machine shop next door was on a night run and the band could not be louder than it.
          credits: {writers: [p_wesla_tarn], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_nan_sudell], producer: p_amon_furlow}
        - id: s_0811
          title: Ask Me Again on Payday
          track_number: 3
          genre: old-system-sessions
          mood_tags: [dry, rolling, wry]
          playable: true
          fact: Written across two pay weeks, and the second verse names the exact sum the band was paid for these sessions.
          credits: {writers: [p_wesla_tarn, p_del_marran], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_nan_sudell], producer: p_amon_furlow}
        - id: s_0812
          title: Wrong Side of the Works
          track_number: 4
          genre: old-system-sessions
          mood_tags: [driving, hard, blunt]
          playable: true
          fact: Tel Brask plays harmonica, the only person from outside the band on any of their records, and he had never heard the song before that night.
          credits: {writers: [p_wesla_tarn], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_nan_sudell, p_tel_brask], producer: p_amon_furlow}
        - id: s_0813
          title: Nothing to Report
