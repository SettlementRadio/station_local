          track_number: 8
          genre: old-system-sessions
          mood_tags: [rolling, steady, patient]
          playable: true
          fact: Wesla Tarn plays the slide with the length of tram brake shoe she has used since 2606, and it is the track the band point at when anyone asks what the sound is.
          credits: {writers: [p_wesla_tarn], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_orin_lask], producer: p_amon_furlow}
