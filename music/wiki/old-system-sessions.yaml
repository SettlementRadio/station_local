          active_to: 2626
      movement:
        standing: outside it
        detail: >-
          Fenna Crole was asked by letter in 2621 where the band stood among the three movements and
          wrote back that she had had all three explained to her twice and still could not see what
          was being argued about. Relay Road Import printed the reply in its 2624 list with the
          question left in.
      bio: >-
        The Ninefoot Cut work the locks and the lighters on the eleven miles of Earth canal the band
        is named after, and play the lock houses and wharf rooms along it and nowhere else. Fenna
        Crole writes almost everything and has kept the same guitar since 2598, on the grounds that
        a new one would want playing differently. Aldis Merrow has recorded every song sitting on
        the same folding stool, which is carried out of the lock house to whichever room the band is
        working in. They learned that their first record was on sale in the settled worlds two years
        after it went on sale there, and Torr Bexley's first question was whether anybody out there
        had been paid for it. They have never played the river yards the form is agreed to have
        started in, and Crole has written twice that they have never claimed to.
      album_ids: [al_140, al_141, al_142, al_143]

  albums:
    - id: al_098
      title: The Room at Terrace Road
      band: b_046
      label: label_7
      release_year: 2624
      kind: album
      genre: old-system-sessions
      cornerstone: true
      notes: >-
        Cut over three nights in the tram works canteen on Mars in 2623 and issued at the road head
        in 2624. Relay Road Import had nearly closed in 2622, when a crate went astray, and it put
        the largest part of one crossing behind this record — everything else that came down that
        season had been bought and paid for before the crate was lost, which is a decision the house
        has never had to defend because the record sold better than anything it has imported. The canteen is free only between shifts, so the
        sessions ran from the end of one and stopped at the start of the next, and the works bell is
        audible on four tracks. Orin Lask is on drums, his first record with the band; the song Nan
        Sudell left behind when she went in 2622 is on it too, and the band recorded it without her.
        Terrace Road Four did not know the record had been issued in the settled worlds until a
        letter reached Mars a season later, and Wesla Tarn's reply asking who exactly had been
        buying it is framed in the importer's office.
