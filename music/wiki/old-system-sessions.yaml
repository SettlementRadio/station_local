          genre: old-system-sessions
          mood_tags: [warm, midtempo, fond]
          playable: true
          fact: About somebody who lived two streets from the canteen for nine years, and Wesla Tarn has always refused to say whether they ever met.
          credits: {writers: [p_wesla_tarn], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_nan_sudell], producer: p_amon_furlow}
        - id: s_0815
