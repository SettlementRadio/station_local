    - id: b_051
      name: The Long Ridge
      kind: group
      home_settlement: the Belt
      label: label_7
      genre: old-system-sessions
      active_from: 2578
      active_to: 2610
      bio: >-
        The Long Ridge were a cutting crew who worked the same Belt rock for eleven years and played
        the shift rooms of everything they were sent to afterwards. Both their records reached the
        road head and neither sold, which the importer has said is the fault of the sleeves and
