    - id: b_052
      name: The Lamp Room Four
      kind: group
      home_settlement: Titan
      label: not imported
      genre: old-system-sessions
      active_from: 2590
      active_to: 2619
      bio: >-
        The Lamp Room Four sang the same Titan lake yards as the Shore Rounds and are the band the
        Shore Rounds learned half their rounds from, which Effa Lomm says at every opportunity.
        Nothing of theirs was ever imported, because the importer took the younger band instead and
        has admitted in writing that it could only afford one.
