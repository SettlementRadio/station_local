      active_to: 2584
      bio: >-
        Sandhouse Trio played the terrace rooms of the same Mars district Terrace Road Four came out
        of, thirty years earlier, and are the oldest thing Relay Road Import ever brought down the
        road. They stopped in 2584 when the piano player went blind and refused to be led on to a
        stage.
