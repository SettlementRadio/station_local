layer_c:
  recordings: none survive
  figures:
    - id: f_017
      name: Adley Prewitt
      kind: yard singer and guitar player
      genre: old-system-sessions
      active_from: 2431
      active_to: 2465
      played: six-string guitar and voice
      history: >-
        Adley Prewitt worked the Earth river yards between 2431 and 2465 and is the name every
        account of the form begins with, on the strength of a yard's payment ledger and two written
        descriptions of him playing. The descriptions disagree with each other about almost
        everything, including whether he sang at all or only played while somebody else did. He
        matters out here because what reached the settled worlds was never a recording but an
        account of an account, and the argument about him is the oldest argument the form has.
    - id: f_018
      name: Corah Ames
      kind: piano player and teacher
      genre: old-system-sessions
      active_from: 2468
      active_to: 2500
      played: upright piano
      history: >-
        Corah Ames taught in a Mars terrace room from 2468 until 2500 and is credited with bringing
        the form to that world, mostly by people who were taught by people she taught. The rolling
        triplet figure every Mars piano player still uses is attributed to her and cannot be
        demonstrated to be hers. She is remembered because three generations of players learned in
        the same room and each of them said so.
    - id: f_019
      name: Tobin Oller
      kind: travelling player and caller
      genre: old-system-sessions
      active_from: 2489
      active_to: 2521
      played: harmonica and calling voice
      history: >-
        Tobin Oller worked the early Belt diggings between 2489 and 2521, moving between them as
        often as the crews did and playing wherever a crew would feed him. Crew records show him
        paid in passage rather than money on at least nine occasions, which is the earliest written
        instance of an arrangement Belt bands still use. He is mentioned whenever anybody asks how a
        band without money gets to a job, and the answer has not improved.
    - id: f_020
      name: Vessa Dunlow
      kind: round-singer and yard organiser
      genre: old-system-sessions
      active_from: 2512
      active_to: 2546
      played: voice, no instrument
      history: >-
        Vessa Dunlow organised the Titan lake yards' singing into fixed parts between 2512 and 2546,
        writing out who came in where so that a shift of forty could sing the same round without
        rehearsal. Nothing she made was ever recorded and the yards have never needed it to be,
        because the parts are still sung the way she set them. Half the rounds the Shore Rounds
        sing are hers, and the band credits her on every sleeve they control.
