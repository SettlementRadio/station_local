# Old-system sessions — written by M-10.
#
# Two conventions this genre needs and no other genre has:
#
# 1. `release_year` is the year the importer put the record on sale in the settled worlds, never
#    the year it was cut. Every record here was made in the home system and took a season to reach
#    the road head, so the notes name the cut year as well. Both are facts a presenter can say, and
#    the eight anchor years are issue years — which is what `make check` counts.
# 2. `session_players` is empty, and that is the finished state. CONSTANTS.md section 2's eight
#    work in the settled worlds; every record in this file was cut on Mars, Titan or Europa by
#    people who have never been out here (D-065). What carries the industry texture instead is the
#    three layer-A bands guesting on each other's records — the same piano, the same harmonica,
#    turning up across two thousand million kilometres of the same home system.
#
# Label 7 is named here for the first time — Relay Road Import — and every later genre that touches
# it uses that name. It is the only genre on the label: 60 songs, 3 bands, 7 albums, and no margin.

section:
  genre: old-system-sessions
  present_year: 2626
  layers:
    played: A
    referenced: B
    historical: C

labels:
  - id: label_7
    name: Relay Road Import
    home: Concordance, at the road head
    tier: import
    status: operating
    founded_year: 2541
    genre: old-system-sessions
    note: >-
      Two people and a rented press. The house licenses masters from home-system labels, waits a
      season for the crate, and sells what it can out of one shipment a year. It has come close to
      closing twice, most recently in 2622 when a crate went astray between the road head and the
      press, and it survives on the strength of records it did not make.

# Empty on purpose — see the header. A record cut on Titan cannot credit a player who works the
# frontier, and inventing a second roster to fill the gap is the failure D-064 closed.
session_players: []

