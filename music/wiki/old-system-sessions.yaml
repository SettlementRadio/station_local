        - id: p_orin_lask
          name: Orin Lask
          genre: old-system-sessions
          instruments: [drums]
          active_from: 2622
          active_to: 2626
      movement: outside it
      bio: >-
        Terrace Road Four have played the same tram works canteen on Mars every week since 2606 and
        have never played anywhere else for money. Wesla Tarn sings and plays the slide with a
        length of brake shoe off the works floor, which is the sound the band is known for and which
        she has never replaced. All four kept their shifts at the works the whole time, so the
        sessions happen between shifts and every record they have made was cut in the canteen. Nan
        Sudell left in 2622 over a dispute about who was owed what from the first record and Orin
        Lask took the kit. Asked in 2621 which of the three movements they belonged to, Wesla Tarn
        said she had not heard of any of them and that Mars had arguments of its own.
      album_ids: [al_099, al_098]

