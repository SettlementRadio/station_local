        - id: p_marta_ospel
          name: Marta Ospel
          genre: old-system-sessions
          instruments: [drums]
          active_from: 2588
          active_to: 2612
      movement:
        standing: outside it
        detail: >-
          Relay Road Import's sleeves file the band as Purist because it uses no electric
          instruments. Hob Venner, told this by letter in 2604, wrote back that the band used
          whatever the yard had and that the yard had never had anything.
      bio: >-
        Undershore Local took their name from the union branch they all belonged to in the Europa
        under-ice works, and they played the canteens of that yard and no others. Hob Venner wrote
        the words on yard paperwork and Saira Dunn arranged everything, including the parts she was
        not playing. Tel Brask played the harmonica through a lamp horn so it would carry down a
        gallery, which is the band's most copied trick and the one thing about them everybody out
        here can name. They stopped in 2612 when the works went to a shift pattern that never put
        the four of them off duty together, which Marta Ospel has said is a stupid way for a band to
        end and the true one.
      album_ids: [al_103, al_104]

  albums:
    - id: al_098
      title: The Room at Terrace Road
      band: b_046
      label: label_7
      release_year: 2624
      kind: album
      genre: old-system-sessions
      cornerstone: true
      notes: >-
        Cut over three nights in the tram works canteen on Mars in 2623 and issued at the road head
        in 2624. Relay Road Import had nearly closed the year before, when a crate went astray, and
        it put the whole capacity of one crossing behind this record — nothing else came down the
        road that season, which is a decision the house has never had to defend because the record
        sold better than anything it has imported. The canteen is free only between shifts, so the
        sessions ran from the end of one and stopped at the start of the next, and the works bell is
        audible on four tracks. Orin Lask is on drums, his first record with the band; the song Nan
        Sudell left behind when she went in 2622 is on it too, and the band recorded it without her.
        Terrace Road Four did not know the record had been issued in the settled worlds until a
        letter reached Mars a season later, and Wesla Tarn's reply asking who exactly had been
        buying it is framed in the importer's office.
      songs:
        - id: s_0796
          title: The Room at Terrace Road
          track_number: 1
          genre: old-system-sessions
          mood_tags: [rolling, warm, midtempo]
          playable: true
          fact: The works' shift bell rings twice during the take and the band played through it both times, because the canteen was theirs only until it rang the third.
          credits: {writers: [p_wesla_tarn], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_orin_lask], producer: p_amon_furlow}
        - id: s_0797
          title: Don't Wait Up for the Late Car
          track_number: 2
          genre: old-system-sessions
          mood_tags: [shuffling, wry, tired]
          playable: true
          fact: Del Marran built the bass figure out of the rhythm the last tram makes over the joints outside the canteen, and he has never played it any other way.
          credits: {writers: [p_wesla_tarn, p_del_marran], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_orin_lask], producer: p_amon_furlow}
        - id: s_0798
          title: Two Cups and No Sugar
          track_number: 3
          genre: old-system-sessions
          mood_tags: [dry, slow, funny]
          playable: true
          fact: Amon Furlow plays the whole track with his left hand because he would not put the cup down, and the band kept the take rather than have the argument.
          credits: {writers: [p_wesla_tarn], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_orin_lask], producer: p_amon_furlow}
        - id: s_0799
          title: She Took the Other Line
          track_number: 4
          genre: old-system-sessions
          mood_tags: [slow, aching, blue]
          playable: true
          fact: Nan Sudell wrote it and left it behind when she went in 2622, and it is the only song on any of the band's records Wesla Tarn did not write.
          credits: {writers: [p_nan_sudell], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_orin_lask], producer: p_amon_furlow}
        - id: s_0800
          title: Nobody Counts It In
          track_number: 5
          genre: old-system-sessions
          mood_tags: [loose, late, warm]
          playable: true
          fact: It starts with Wesla Tarn's foot on the canteen floor because nobody had settled who would count the band in now that Orin Lask was on the kit.
          credits: {writers: [p_wesla_tarn], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_orin_lask], producer: p_amon_furlow}
        - id: s_0801
          title: Working Both Ends
