          genre: old-system-sessions
          mood_tags: [wry, plain, midtempo]
          playable: true
          fact: The verse listing what the district is short of was chalked on the canteen wall and Wesla Tarn read it off the wall during the take.
          credits: {writers: [p_wesla_tarn], players: [p_wesla_tarn, p_amon_furlow, p_del_marran, p_orin_lask], producer: p_amon_furlow}
        - id: s_0803
