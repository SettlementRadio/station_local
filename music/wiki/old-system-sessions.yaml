      movement:
        standing: outside it
        detail: >-
          Relay Road Import's sleeves file the band as Purist because it uses no electric
          instruments. Hob Venner, told this by letter in 2604, wrote back that the band used
          whatever the yard had and that the yard had never had anything.
      bio: >-
        Undershore Local took their name from the union branch they all belonged to in the Europa
        under-ice works, and they played the canteens of that yard and no others. Hob Venner wrote
        the words on yard paperwork and Saira Dunn arranged everything, including the parts she was
        not playing. Tel Brask played the harmonica through a lamp horn so it would carry down a
        gallery, which is the band's most copied trick and the one thing about them everybody out
        here can name. They stopped in 2612 when the works went to a shift pattern that never put
        the four of them off duty together, which Marta Ospel has said is a stupid way for a band to
        end and the true one.
      album_ids: [al_103, al_104]

