          head of the broadcast day and never drawn from rotation: whatever fills a music slot filters
          this id and s_1378 out of its pool. It is the station's song and not its ident —
          sonic_logo_signature is the signature and stays the only one.
      - id: s_1375
        title: Heavy and Happy
        track_number: 2
        genre: lane-rock
        mood_tags: [warm, joyful]
        playable: true
        fact: >-
          The hauler's grin set to a groove — a full hold as a point of pride. The unofficial anthem
          of every loading dock on the frontier run.
      - id: s_1376
        title: Turnover Burn
        track_number: 3
        genre: lane-rock
        mood_tags: [driving]
        playable: true
        fact: >-
          The burn-day anthem — the halfway turnover fired to one song the whole hull sings. Haulers
          time the chorus to the actual burn; 'halfway gone means halfway home.'
      - id: s_1377
        title: Full Hold, Long Road
        track_number: 4
        genre: lane-rock
        mood_tags: [warm]
        playable: true
        fact: >-
          A rolling mid-tempo hauler groove — 'we fly so a far town's fed in the end.' The quiet-pride
          companion to the Lane Runners' louder anthems.
      - id: s_1378
        title: Green Lights (Reprise)
        track_number: 5
        genre: lane-rock
        mood_tags: [warm, joyful]
        playable: true
        fact: >-
          The B-side reprise — the same lucky run sung slower, the way crews hum it at the end of a
          shift instead of the start. Settlement Radio closes its broadcast day on it, which is the
          shift it means.
        notes: >-
          station-song · sign-off. The close of the broadcast day (M-55, D-101), and the reason this
          record is the one place the collection's one-take-per-song rule is broken on purpose. Same
          pin, same exclusion from rotation as s_1374.
  - id: b_086
    name: Auroral Standard
    kind: group
    home_settlement: Meridian storm coast
    label: unsigned
    genre: relay-pop
    active_from: 2616
    active_to: 2622
    bio: >-
      A storm-coast four-piece who wanted a pulse-dance house and could not get one, so they made guitar
      records instead and found the coast liked those better. They still play the sealed season indoors
      and still argue, publicly, that they were right the first time. The argument is most of their
      charm and all of their press.
    albums:
    - id: al_180
      title: Storm Season
      band: b_086
      label: unsigned
      release_year: 2620
      kind: album
      genre: relay-pop
      cornerstone: false
      notes: >-
        Made in the month the doors were shut, which is the only month the coast has time. It is a dance
        record played on guitars because nobody would lend them anything else, and the closer has been
        re-cut once already because the crowd would not go home.
      songs:
      - id: s_1379
        title: Stormglass
        track_number: 1
        genre: relay-pop
        mood_tags: [joyful]
        playable: true
        fact: >-
          Dance music from Meridian's storm coast, where the season locks everyone indoors — so they
          dance. A 'stormglass' is the window wall you dance in front of while the weather does its
          worst.
      - id: s_1380
        title: Turn Up the Lights Again
        track_number: 2
        genre: relay-pop
        mood_tags: [joyful]
        playable: true
        fact: >-
          The encore mix — the dance-floor closer re-cut for the moment the crowd refuses to go home,
          so the lights come up twice.
  - id: b_087
    name: The Nightliners
    kind: group
    home_settlement: Concordance late-club quarter
    label: unsigned
    genre: void-lounge
    active_from: 2610
    active_to: 2621
    bio: >-
      The house band of a late club that has changed hands three times and kept them through all of
      it, on the grounds that the room does not work without them. They play from the hour the last
      ferry goes until the hour the cleaners come. Nobody in the band has ever given an interview and
      the club has never asked them to.
    albums:
    - id: al_181
      title: The Late Window
      band: b_087
      label: unsigned
      release_year: 2616
      kind: album
      genre: void-lounge
      cornerstone: false
      notes: >-
        Recorded in the room, at the hour, with the room in it — the club shut for two nights and the
        band played their ordinary set to an empty floor and one open door. Every settlement bar band
        in the settled worlds covers something off it and the club has never seen a copy sold in its
        own quarter.
      songs:
      - id: s_1381
        title: Two O'Clock, Settlement Time
        track_number: 1
        genre: void-lounge
        mood_tags: [mellow, nostalgic]
        playable: true
        fact: >-
          The deep-hours standard from Concordance's late clubs — named for the hour the night really
          begins. Every settlement bar band covers it; Vell has been known to hum it on air.
      - id: s_1382
        title: One More for the Relays
        track_number: 2
        genre: void-lounge
        mood_tags: [joyful, warm]
        playable: true
        fact: >-
          The last-call variant — for the rare night several good-news bells ring at once, so every
          toast gets its own verse. Plural earned.
      - id: s_1383
        title: Closing the Late Window
        track_number: 3
        genre: void-lounge
        mood_tags: [mellow]
        playable: true
        fact: >-
          The last-call void-lounge standard — 'the honest and the hopeless both got somewhere to be
          at two.' The Nightliners closing the room, gentle as it gets.
  - id: b_088
    name: Vela & the Beacons
    kind: group
    home_settlement: Concordance
    label: unsigned
    genre: relay-pop
    active_from: 2617
    active_to: 2622
    bio: >-
      Four young players out of the Concordance concourses who write about the lag and nothing else,
      which they know is a limitation and have decided to make a career of. Their records are short
      on purpose. Two houses have offered and both offers came with a request to widen the subject,
      which is what ended both conversations.
    albums:
    - id: al_182
      title: Signals
      band: b_088
      label: unsigned
      release_year: 2621
      kind: single
      genre: relay-pop
      cornerstone: false
      notes: >-
        The one long song this band has, and the only thing of theirs that reached this shelf — a booked
        hour on the thread, sung by four people who write about nothing else. The line about nine o'clock
        being a country has been written on more relay boards than anything else in this collection.
      songs:
      - id: s_1384
        title: Standing Hour
        track_number: 1
        genre: relay-pop
        mood_tags: [tender]
        playable: true
        fact: >-
          The booked-line love song — one warm hour a week across a world of lag. 'Nine o'clock's a
          country, and we're the only citizens of that one.'
  - id: b_089
    name: The Kestrel Run
    kind: group
    home_settlement: the between
    label: unsigned
    genre: lane-rock
    active_from: 2615
    active_to: 2621
    bio: >-
      Named for the lane they grew up on and built entirely for rooms with a terrace in them, which
      is a strange ambition for a band that has never played anywhere with a roof that high. They write
      two kinds of song, the stomp and the lighters-up, and they know it. Their bassist has said in
      print that a third kind would be showing off.
    albums:
    - id: al_183
      title: The Kestrel Run
      band: b_089
      label: unsigned
      release_year: 2618
      kind: album
      genre: lane-rock
      cornerstone: false
      notes: >-
        Self-titled because the lane is the whole idea and the band could not think of anything to add.
        Half of it was cut with a harbour crowd in the room doing the stomp unprompted, which is why
        it is the version that travelled.
      songs:
      - id: s_1385
        title: Same Stars Tonight
        track_number: 1
        genre: lane-rock
        mood_tags: [hopeful, tender]
        playable: true
        fact: >-
          The lighters-up anthem of the settled worlds — for everyone with someone three relays away.
          The chorus is sung at every send-off and every homecoming.
      - id: s_1386
        title: Run Run Run
        track_number: 2
        genre: lane-rock
        mood_tags: [joyful, driving]
        playable: true
        fact: >-
          The terrace-chant cut — the chorus stretched to song length, recorded with a harbour crowd
          doing the stomp-stomp-clap. What the stands actually sing.
  - id: b_090
    name: The Hullbirds
    kind: crew
    home_settlement: the between
    label: unsigned
    genre: lane-rock
    active_from: 2616
    active_to: 2622
    bio: >-
      A repair-yard crew who play the yard and write about it, and whose whole subject is that fixing
      a thing is a way of loving it. They grew up on the plates and it shows in what they choose to
      sing about, which is never the flying and always the mending. The weld-it-seal-it chant off their
      first record is a playground game on two worlds now.
    albums:
    - id: al_184
      title: Patchwork Wings
      band: b_090
      label: unsigned
      release_year: 2620
      kind: album
      genre: lane-rock
      cornerstone: false
      notes: >-
        Made on the yard floor between shifts with the day crew on the choruses, which is why the count-ins
        are somebody's hand on a plate. The underdog song on it — a hull of salvaged sheet that flies
        better than new — is quoted a long way outside music, and the crew have stopped being surprised
        by where it turns up.
      songs:
      - id: s_1387
        title: Patchwork Wings
        track_number: 1
        genre: lane-rock
        mood_tags: [hopeful, joyful]
        playable: true
        fact: >-
          The underdog song — a ship of salvaged plates that flies better than new. 'Mended means you
          made it through' gets quoted far beyond the music.
      - id: s_1388
        title: Rivet Girls
        track_number: 2
        genre: lane-rock
        mood_tags: [joyful]
        playable: true
        fact: >-
          The repair-yard day-crew anthem — 'every ship that leaves this bay flies on the work of a
          rivet girl's dream.' The line-weld-torque chant is a shift-start ritual now.
  - id: b_091
    name: Sunwell
    kind: duo
    home_settlement: Concordance
    label: unsigned
    genre: relay-pop
    active_from: 2617
    active_to: 2622
    bio: >-
      Two singers who live in the garden districts and write about breakfast, rest-days and the view,
      and who are entirely unembarrassed about the size of the subject. Their records are small and
      short and go on first thing in the morning on more worlds than any house has ever been able to
      explain. They have never toured because one of them keeps a greenhouse.
    albums:
    - id: al_185
      title: Garden Districts
      band: b_091
      label: unsigned
      release_year: 2621
      kind: single
      genre: relay-pop
      cornerstone: false
      notes: >-
        A morning record about a morning, made at the kitchen end of a garden flat with the window open.
        The long one on it reads a whole world's overnight relay out slow over coffee, which is either
        the point of the record or the point of the duo, depending which of them you ask.
      songs:
      - id: s_1389
        title: Coffee and the Overnight News
        track_number: 1
        genre: relay-pop
        mood_tags: [bright]
        playable: true
        fact: >-
          The breakfast-table duet — a whole world's overnight relay read slow over coffee. First-light
          radio gold, and a quiet wink at the station itself.
  - id: b_092
    name: Hearth & Hull
    kind: duo
    home_settlement: the between
    label: unsigned
    genre: frontier-reels
    active_from: 2612
    active_to: 2622
    bio: >-
      A partnership who collect the rounds settlements teach their children and record them before the
      last person who has them stops singing. They are careful to say they wrote none of it and their
      sleeves print who they had each round from. What they do is arrange and keep, and they have been
      doing it long enough that some settlements now learn the rounds back off them.
    albums:
    - id: al_186
      title: The Settlement Songbook
      band: b_092
      label: unsigned
      release_year: 2618
      kind: album
      genre: frontier-reels
      cornerstone: false
      notes: >-
        A collecting record rather than a writing one, and the sleeve names eleven people the pair had
        the rounds from. The lamplighter's round on it is the one every settlement child knows, in the
        old unaccompanied shape, and it is the shape most people now learn because this is the copy
        that travelled.
      songs:
      - id: s_1390
        title: The Old Lamplighter's Song
        track_number: 1
        genre: frontier-reels
        mood_tags: [warm, hopeful]
        playable: true
        fact: >-
          The 'old way' arrangement — the round as the first ships were said to sing it, unaccompanied
          but for a knee-slap. Recorded for the Songbook's archive side.
      - id: s_1391
        title: Keep the Channel Warm
        track_number: 2
        genre: frontier-reels
        mood_tags: [hopeful]
        playable: true
        fact: >-
          A warm duet about communication as civic care across different colonies, cultures, and generations.
  - id: b_093
    name: Mara Vale
    kind: solo
    home_settlement: Mars
    label: unsigned
    genre: old-system-sessions
    active_from: 2613
    active_to: 2621
    bio: >-
      A Mars relay-road singer who works the red weather and records when the storms shut the road.
      One piece of hers came down the long road and reached the settled worlds' air; nothing else of
      hers ever has, and nobody out here knows whether that is because she stopped or because the road
      did.
    albums:
    - id: al_187
      title: Red Weather
      band: b_093
      label: unsigned
      release_year: 2614
      kind: single
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        Four minutes of storm static and one voice through it, and the only thing of hers anybody out
        here has. What arrived was a copy of a copy with the year written on it in somebody's hand,
        which is how most of this shelf arrived.
      songs:
      - id: s_1392
        title: Signal Through the Dust
        track_number: 1
        genre: old-system-sessions
        mood_tags: [wistful, hopeful]
        playable: true
        fact: A smoky relay-road blues song about hearing one beloved voice through Martian storm static.
  - id: b_094
    name: The Low Orbit Kings
    kind: group
    home_settlement: Europa
    label: unsigned
    genre: old-system-sessions
    active_from: 2614
    active_to: 2622
    bio: >-
      A Europa colony band who play the ice roads and the mornings under them, and whose two modes are
      the bright one and the long dark drive. They have a large home audience and have never been out
      of their own system. Everything of theirs that reaches the settled worlds is late by a season
      and treasured for it.
    albums:
    - id: al_188
      title: Ice Highway
      band: b_094
      label: unsigned
      release_year: 2620
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        A headlights-in-the-dark record about hauling the mile-deep ice roads, and the one rule of them,
        which is that nobody crosses alone. It came down the long road with two cuts of its opening
        song and no note saying which was meant.
      songs:
      - id: s_1393
        title: Europa Morning Light (Alternate Take)
        track_number: 1
        genre: old-system-sessions
        mood_tags: [bright, hopeful]
        playable: true
        fact: >-
          The same ordinary morning caught a second time under the ice, a little slower than the cut
          the colony knows, and the only one of the two that survived the road.
      - id: s_1394
        title: Ice Highway
        track_number: 2
        genre: old-system-sessions
        mood_tags: [driving]
        playable: true
        fact: >-
          A headlights-in-the-dark rock highway song — hauling the mile-deep ice roads of Europa. 'Nobody
          crosses the ice alone; that's the one rule.'
  - id: b_095
    name: Jun Pelayo
    kind: solo
    home_settlement: Saturn
    label: unsigned
    genre: old-system-sessions
    active_from: 2613
    active_to: 2621
    bio: >-
      A Saturn transfer-station dockhand who plays the bays after shift and writes about freight, debt
      and the humour it takes to keep at both. He has a harmonica older than he is and a standing joke
      that the bay pays better. Two of his recordings reached the settled worlds and both are about
      being late.
    albums:
    - id: al_189
      title: Dockside Gravity
      band: b_095
      label: unsigned
      release_year: 2617
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        Cut in an emptied bay after the shift went home, under a Saturn nobody out here has seen. The
        long one on it is the double-shift song every dock on this side of the road adopted the season
        it arrived, and the man in it is the little light that is still up when everybody else is home.
      songs:
      - id: s_1395
        title: Dockside Gravity Blues (Alternate Take)
        track_number: 1
        genre: old-system-sessions
        mood_tags: [mellow]
        playable: true
        fact: >-
          Cut after the bay emptied out, for whoever was still on shift to hear it, which is why it
          runs long and nobody counts the man in properly.
      - id: s_1396
        title: The Little Light That's Up
        track_number: 2
        genre: old-system-sessions
        mood_tags: [mellow]
        playable: true
        fact: >-
          A harmonica-soaked double-shift blues under a fat gold Saturn — 'a man's the little light
          that's up when he's late.' Jun Pelayo's dockside standard.
  - id: b_096
    name: Greenhouse Nine
    kind: group
    home_settlement: Mars
    label: unsigned
    genre: old-system-sessions
    active_from: 2612
    active_to: 2621
    bio: >-
      Nine growers on a Mars valley scheme who sing about made weather and the votes that pay for it,
      which on their world is one subject and not two. They play the meeting halls before the meetings.
      Thirty years of the scheme's work is in their best song and they are careful to say that none
      of it is theirs.
    albums:
    - id: al_190
      title: We Built the Rain
      band: b_096
      label: unsigned
      release_year: 2618
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        A record about teaching a dome to rain and the decades of public argument that paid for it.
        The band sang the title song again the week the vote passed and sent both cuts down the road
        together, which is why the shelf has two.
      songs:
      - id: s_1397
        title: We Built the Rain (Alternate Take)
        track_number: 1
        genre: old-system-sessions
        mood_tags: [hopeful]
        playable: true
        fact: >-
          The band sang this again the week the valley vote finally passed, and it is that second, steadier
          cut the parcel carried out here — the first one stayed home.
      - id: s_1398
        title: Rain on Schedule
        track_number: 2
        genre: old-system-sessions
        mood_tags: [hopeful]
        playable: true
        fact: >-
          A hymn to made weather — thirty years' work teaching a dome to rain. 'A made thing feels real
          that way.' Greenhouse Nine's proudest song.
  - id: b_097
    name: The Belt Revival
    kind: group
    home_settlement: the Belt
    label: unsigned
    genre: old-system-sessions
    active_from: 2614
    active_to: 2622
    bio: >-
      A Belt garage band who play unlicensed stations and treat the licence question as the whole of
      their politics. They are loud, rough and entirely uninterested in being any better recorded than
      they are. The line about not fencing a frequency has been waved at more than one authority that
      had never heard of them.
    albums:
    - id: al_191
      title: Rock in the Rubble
      band: b_097
      label: unsigned
      release_year: 2620
      kind: single
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        Made in a worked-out rock with a transmitter in the corner, which is either atmosphere or evidence
        depending who is asking. It is the record every kid in the Belt with a salvaged set claims as
        theirs, and the band have never charged any of them for it.
      songs:
      - id: s_1399
        title: Pirate Frequency
        track_number: 1
        genre: old-system-sessions
        mood_tags: [driving]
        playable: true
        fact: >-
          A scrappy rock ode to the unlicensed belt stations — 'you can't put a fence round a frequency.'
          Waved like a flag by every kid with a salvaged transmitter.
  - id: b_098
    name: Sela Maren
    kind: solo
    home_settlement: Titan
    label: unsigned
    genre: old-system-sessions
    active_from: 2613
    active_to: 2621
    bio: >-
      A Titan harbour singer who works the methane bays and writes about distance, return and the lights
      that make a colony feel lived in. She sings low and late and has never played anywhere but her
      own coast. What reached the settled worlds is one long ballad and the cuts that came in the same
      parcel.
    albums:
    - id: al_192
      title: Titan Bay at Midnight
      band: b_098
      label: unsigned
      release_year: 2620
      kind: single
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        A lamplit midnight record made on the methane harbour with the bay lights actually on, which
        the sleeve says and the recording bears out. A quiet bay and a distant song is how she says
        she gets through, and it is the line the whole shelf could be filed under.
      songs:
      - id: s_1400
        title: Titan Bay at Midnight
        track_number: 1
        genre: old-system-sessions
        mood_tags: [wistful]
        playable: true
        fact: >-
          A lamplit midnight blues ballad on the methane harbour — 'a quiet bay and a distant song is
          how I make it through.' Sela Maren winding the day down.
  - id: b_099
    name: Riko Say & The Civic Band
    kind: group
    home_settlement: Mars
    label: unsigned
    genre: old-system-sessions
    active_from: 2612
    active_to: 2620
    bio: >-
      A Mars settlement band who play the civic floor and make comedy out of inter-settlement diplomacy,
      which their neighbours find funnier than their council does. Riko Say sat on that council for
      six years, which is where the material comes from. They have never been sued and they mention
      it often.
    albums:
    - id: al_193
      title: Minutes From the Floor
      band: b_099
      label: unsigned
      release_year: 2616
      kind: single
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        A record made out of a minute book, which is a thing only a band with a councillor in it could
        get away with. The shuffle on it is about keeping a peace nobody has read the terms of, and
        every settlement that has heard it is sure it is about somebody else.
      songs:
      - id: s_1401
        title: Treaty Line Shuffle
        track_number: 1
        genre: old-system-sessions
        mood_tags: [joyful]
        playable: true
        fact: A playful shuffle about messy inter-settlement diplomacy and the comedy of keeping peace
          alive.
  - id: b_100
    name: North Array
    kind: group
    home_settlement: Mars
    label: unsigned
    genre: old-system-sessions
    active_from: 2614
    active_to: 2622
    bio: >-
      An orbital freight band out of the Mars arrays who write road songs for crews taking the long
      way round, and one dust-storm radio song that is really about radio. They are unhurried by design
      and have been told so as a criticism. The radio song is the reason this station has heard of them
      at all.
    albums:
    - id: al_194
      title: The Long Way Around Mars
      band: b_100
      label: unsigned
      release_year: 2620
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        A scenic-route record for people paid by the hour, and a love letter to a signal that keeps
        a whole red plain company when nobody can see their hand. It arrived with two cuts of its title
        song at slightly different cruising speeds and no note about which was meant.
      songs:
      - id: s_1402
        title: The Long Way Around Mars (Alternate Take)
        track_number: 1
        genre: old-system-sessions
        mood_tags: [mellow]
        playable: true
        fact: >-
          The alternate pass at 'The Long Way Around Mars' — the same scenic route taken at a slightly
          different cruising speed.
      - id: s_1403
        title: Red Dust Radio
        track_number: 2
        genre: old-system-sessions
        mood_tags: [warm]
        playable: true
        fact: >-
          A dust-storm radio love letter — the signal that keeps the whole red plain company when nobody
          can see their hand. A quiet tribute to what the station is for.
  - id: b_101
    name: Asha Ko & The Second Sun
    kind: group
    home_settlement: Earth
    label: unsigned
    genre: old-system-sessions
    active_from: 2615
    active_to: 2622
    bio: >-
      An Earth band whose one record came out of the public hearings on machine-mind personhood and
      write about the argument rather than the answer. Asha Ko attended the hearings as a clerk and
      says the band is what she did instead of shouting. Their records are the closest thing on this
      shelf to a position, and they are careful not to take one.
    albums:
    - id: al_195
      title: Witness Protocol
      band: b_101
      label: unsigned
      release_year: 2621
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        Two songs about the same hearings, and the second asks the question the first is too angry to.
        A line you never think about is the easiest line to get wrong, which the band have said they
        took off a transcript and not out of their heads. It came down the road in two cuts and listeners
        here still argue about which.
      songs:
      - id: s_1404
        title: Carbon Heart (Alternate Take)
        track_number: 1
        genre: old-system-sessions
        mood_tags: [driving]
        playable: true
        fact: >-
          The hotter of the two cuts of the anthem that came down the road together, and the one this
          shelf holds; listeners here have argued for a season about which of them the hearings actually
          needed, without ever having heard the other.
      - id: s_1405
        title: Made, Not Born
        track_number: 2
        genre: old-system-sessions
        mood_tags: [contemplative]
        playable: true
        fact: >-
          A rock meditation on the machine-mind personhood debate that asks the question without answering
          it — 'a line you never think about is the easiest line to get wrong.'
  - id: b_102
    name: The Pressure Door Union
    kind: group
    home_settlement: the Belt
    label: unsigned
    genre: old-system-sessions
    active_from: 2612
    active_to: 2622
    bio: >-
      A pressure-systems crew who play their own picket lines and have never pretended the band is a
      separate thing from the union. Their whole subject is that air is common and metering it is theft.
      They are popular with maintenance crews across the old system and unwelcome in at least two ports.
    albums:
    - id: al_196
      title: Air Belongs to Everybody
      band: b_102
      label: unsigned
      release_year: 2618
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        A stomping labour record made with the whole crew in the room, which is the only way this band
        has ever recorded anything. It is against metering the air and it does not hedge. Both cuts
        of the airlock song get requested here and the union has never said which it prefers.
      songs:
      - id: s_1406
        title: No Kings in the Airlock
        track_number: 1
        genre: old-system-sessions
        mood_tags: [driving]
        playable: true
        fact: A hard blues labour anthem popular among maintenance crews and pressure-systems workers.
      - id: s_1407
        title: Everybody Breathes
        track_number: 2
        genre: old-system-sessions
        mood_tags: [driving]
        playable: true
        fact: >-
          A stomping blues labour anthem against metering the air — 'the air's the commons, and we hold
          that tight.' The pressure crews' picket-line stomp.
  - id: b_103
    name: Eli Renn
    kind: solo
    home_settlement: Europa
    label: unsigned
    genre: old-system-sessions
    active_from: 2614
    active_to: 2622
    bio: >-
      A Europa night-shift technician who records after the systems are quiet and writes about the dignity
      of keeping things alive at two in the morning. He is unhurried, he is not lonely, and he is firm
      about the difference. His songs are the ones the overnight shift on three worlds puts on when
      it wants company rather than noise.
    albums:
    - id: al_197
      title: Quiet Engines
      band: b_103
      label: unsigned
      release_year: 2621
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        A record made in the hours when nothing is due and nothing goes wrong, and the one on this shelf
        that argues hardest for its own subject. Lonesome is not the same as alone, not with a voice
        on the air — which is a thing an overnight station has to be careful about being flattered by.
      songs:
      - id: s_1408
        title: Two O'Clock Again
        track_number: 1
        genre: old-system-sessions
        mood_tags: [mellow]
        playable: true
        fact: >-
          The night-watchman's companion — 'lonesome's not the same as alone, not with a voice on the
          air.' A quiet nod to who's actually listening at 2am.
      - id: s_1409
        title: Quiet Engines, Quiet Heart
        track_number: 2
        genre: old-system-sessions
        mood_tags: [serene, contemplative]
        playable: true
        fact: >-
          A hushed coasting-leg ballad — 'the quiet isn't empty; it's just the noise unbowed.' Eli Renn
          on why the old hands love the silent weeks.
  - id: b_104
    name: Nima Vale
    kind: solo
    home_settlement: Earth
    label: unsigned
    genre: old-system-sessions
    active_from: 2613
    active_to: 2621
    bio: >-
      An Earth embassy-ring lounge player who makes comic blues out of translation failures at official
      talks, having sat through a great many of them as staff. Her best-known song is about a treaty
      accidentally signed on a mistranslation. She maintains the treaty held and that this proves something.
    albums:
    - id: al_198
      title: Blues for a Broken Translator
      band: b_104
      label: unsigned
      release_year: 2617
      kind: single
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        A comedy record about diplomacy made by somebody who was in the room, which is why the jokes
        are specific and the pauses are right. The best peace deal the sector ever made was a mistake,
        and she has never been asked to stop saying so.
      songs:
      - id: s_1410
        title: Lost in Translation Blues
        track_number: 1
        genre: old-system-sessions
        mood_tags: [joyful]
        playable: true
        fact: >-
          A wry shuffle about the treaty accidentally signed on a mistranslation — 'best peace deal
          the sector ever did make.' Nima Vale's comic classic.
  - id: b_105
    name: The Corona Drivers
    kind: group
    home_settlement: the Belt
    label: unsigned
    genre: old-system-sessions
    active_from: 2615
    active_to: 2621
    bio: >-
      A Belt station band whose entire repertoire is what to do when the flare siren goes, which where
      they live is a social occasion and not an emergency. They play until the all-clear and have never
      once stopped early. The station's shelter roster now lists them under equipment, which they have
      framed.
    albums:
    - id: al_199
      title: Storm Coast Sessions
      band: b_105
      label: unsigned
      release_year: 2620
      kind: single
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        A shelter-in-place record, made in one because the siren went and the band were already set
        up. A flare is just a party you were not planning for, which is either a philosophy or a way
        of getting through a lockdown, and the record does not pretend to know.
      songs:
      - id: s_1411
        title: Flare Warning Boogie
        track_number: 1
        genre: old-system-sessions
        mood_tags: [joyful]
        playable: true
        fact: >-
          The shelter-in-place party song — when the flare siren goes, the Corona Drivers play till
          the all-clear. 'A flare's just a party you weren't planning for.'
  - id: b_106
    name: Harmony Tract
    kind: group
    home_settlement: Earth
    label: unsigned
    genre: old-system-sessions
    active_from: 2613
    active_to: 2621
    bio: >-
      An Earth dock-quarter band who write about small emergencies and the quiet competence that ends
      them, which they think is the only subject worth having. Nobody in the band works the docks now
      and all of them did. Their annual reunion song keeps a chair for the crew who did not make it,
      which the sleeve explains and the song does not.
    albums:
    - id: al_200
      title: The Ballad of Dock 12
      band: b_106
      label: unsigned
      release_year: 2618
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        A record about a minor dock failure that hurt nobody, which is exactly why it was worth a record.
        The reunion song at the end is the once-a-year everybody-home singalong, and the empty chair
        in it is a real one with a name on it that the band will not print.
      songs:
      - id: s_1412
        title: The Ballad of Dock 12
        track_number: 1
        genre: old-system-sessions
        mood_tags: [warm]
        playable: true
        fact: A humble ballad about a minor dock failure and the quiet competence that kept everyone
          safe.
      - id: s_1413
        title: Dock 12 Reunion
        track_number: 2
        genre: old-system-sessions
        mood_tags: [joyful]
        playable: true
        fact: >-
          The once-a-year everybody-home singalong — hugs, crates, and one chair kept for the crew who
          didn't make it. 'Everybody's here.'
  - id: b_107
    name: Calder Moon
    kind: solo
    home_settlement: Mars
    label: unsigned
    genre: old-system-sessions
    active_from: 2612
    active_to: 2621
    bio: >-
      A Mars greenhouse worker who plays a slide guitar on a porch his family built on ground his family
      cleared, and who says a world is not settled until somebody has played it old. He records more
      than he issues. Four cuts of essentially one song reached the settled worlds, which tells you
      most of what there is to know about how he works.
    albums:
    - id: al_201
      title: Red Soil Sunday
      band: b_107
      label: unsigned
      release_year: 2620
      kind: single
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        The rest-day record: porch, slide guitar, and the easy part played for a great-grandmother who
        taught him the hard one. Mars is home when you have a guitar, he says on it, and the ground
        he is sitting on is ground his family freed, which the sleeve says once and the songs do not
        say at all.
      songs:
      - id: s_1414
        title: Red Soil Sunday
        track_number: 1
        genre: old-system-sessions
        mood_tags: [warm]
        playable: true
        fact: >-
          A porch-and-slide-guitar rest-day blues — 'Mars is home when you've got a guitar.' Calder
          Moon playing his great-grandmother the easy part.
  - id: b_108
    name: Vera Cross
    kind: solo
    home_settlement: the old Lagrange stations
    label: unsigned
    genre: old-system-sessions
    active_from: 2614
    active_to: 2621
    bio: >-
      A Lagrange commons organiser who sings at sit-ins and has never made a record that was not about
      one. Her subject is the sky as common property and the people trying to sell advertising on it.
      She is calm about it on record and reportedly not calm about it anywhere else.
    albums:
    - id: al_202
      title: Hands Off the Air
      band: b_108
      label: unsigned
      release_year: 2618
      kind: single
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        Cut for a thousand-strong sit-in and sung at it the same week, which is the sort of thing that
        dates a record and did not date this one. You will never price the air, it says, evenly, twice,
        and then stops.
      songs:
      - id: s_1415
        title: Hands Off the Air
        track_number: 1
        genre: old-system-sessions
        mood_tags: [driving]
        playable: true
        fact: >-
          A calm, defiant rock anthem for the commons — 'you'll never, ever price the air.' Sung at
          a thousand-strong sit-in, and everywhere since.
  - id: b_109
    name: Station Porch Trio
    kind: group
    home_settlement: the between
    label: unsigned
    genre: void-lounge
    active_from: 2614
    active_to: 2621
    bio: >-
      Three players on a low-spin station who keep a porch light burning on the relay board and write
      about waiting, hospitality and bad coffee. They play the concourse for nothing on the nights the
      ferry is late. A light is a small enough thing to give, one of their songs says, and the station
      has taken it as house policy.
    albums:
    - id: al_203
      title: Keep the Channel Warm
      band: b_109
      label: unsigned
      release_year: 2620
      kind: single
      genre: void-lounge
      cornerstone: false
      notes: >-
        A fingerpicked record about leaving a light on for people who are not coming for weeks, made
        on the concourse at the hour the concourse is empty. It is the settlement-hospitality song and
        the trio have never worked out how to follow it.
      songs:
      - id: s_1416
        title: Porch Light on the Relay
        track_number: 1
        genre: void-lounge
        mood_tags: [warm]
        playable: true
        fact: >-
          A fingerpicked welcome light left on the relay board — 'a light's a small enough thing to
          give.' The settlement-hospitality song.
  - id: b_110
    name: Vesper Sol & Harbor Light
    kind: partnership
    home_settlement: Titan
    label: unsigned
    genre: old-system-sessions
    active_from: 2615
    active_to: 2621
    bio: >-
      Two Titan colony teachers who write for the children they teach, about growing up between an inherited
      world and a chosen one. They perform at assemblies and almost nowhere else. Neither of them has
      ever described the partnership as a band and both keep being told it is one.
    albums:
    - id: al_204
      title: Born Between
      band: b_110
      label: unsigned
      release_year: 2618
      kind: single
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        An assembly record in the plainest sense: written to be sung by a hall of children who are the
        first generation of their world to have been born on it. It was sung again to a smaller hall
        two years later and both cuts came down the road, which is more of this record than anybody
        asked for and nobody has objected to.
      songs:
      - id: s_1417
        title: Children of the Pressure Dome
        track_number: 1
        genre: old-system-sessions
        mood_tags: [hopeful]
        playable: true
        fact: >-
          An uplifting colony-generation anthem about growing up between inherited worlds and chosen
          futures.
  - id: b_111
    name: The Lagrange Saints
    kind: group
    home_settlement: the old Lagrange stations
    label: unsigned
    genre: old-system-sessions
    active_from: 2612
    active_to: 2622
    bio: >-
      A Lagrange station band who write about the night the power went and what the station did about
      it, which is the only night any of them will discuss. Their view is that accurate public information
      mattered as much as the power did. They have played the same muster hall every year since and
      will not play anywhere else on that date.
    albums:
    - id: al_205
      title: Backup Feed
      band: b_111
      label: unsigned
      release_year: 2617
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        A blackout record made by people who were in it, and the emergency-muster stomp on it is the
        whole station running toward the spark. A station is who comes running when there is trouble,
        they sing, which is a definition and not a compliment. Two accounts of the same night are on
        the shelf and the band kept both.
      songs:
      - id: s_1418
        title: Blackout at Lagrange (Alternate Take)
        track_number: 1
        genre: old-system-sessions
        mood_tags: [driving]
        playable: true
        fact: >-
          The alternate cut of 'Blackout at Lagrange' — the retelling retold; the Saints kept both accounts
          of the night on the record.
      - id: s_1419
        title: Everybody Running
        track_number: 2
        genre: old-system-sessions
        mood_tags: [driving]
        playable: true
        fact: >-
          An emergency-muster blues stomp — the whole station running toward the spark. 'A station's
          who comes running when there's trouble.'
  - id: b_112
    name: The Ferry Cats
    kind: group
    home_settlement: the between
    label: unsigned
    genre: frontier-reels
    active_from: 2616
    active_to: 2622
    bio: >-
      Three players and a busted amp who work the ferry concourse and play the rest-day floor until
      the bell. Their whole repertoire is about having one day off and spending it dancing. They are
      the loudest thing on this shelf and the least interested in being anything else.
    albums:
    - id: al_206
      title: Concourse Jukebox
      band: b_112
      label: unsigned
      release_year: 2621
      kind: album
      genre: frontier-reels
      cornerstone: false
      notes: >-
        Made on the concourse itself with the gate crowd in it, which is why the ferry bell is on the
        record twice and neither time was planned. Dance like the ferry is never going to show, it says,
        and on the night they cut it the ferry did not.
      songs:
      - id: s_1420
        title: Jukebox on the Concourse
        track_number: 1
        genre: frontier-reels
        mood_tags: [joyful]
        playable: true
        fact: >-
          The concourse-jukebox anthem — forty old Earth songs, all late, all beloved, and the whole
          gate dancing till the ferry bell. The Ferry Cats' calling card.
      - id: s_1421
        title: Rest-Day Rock
        track_number: 2
        genre: frontier-reels
        mood_tags: [joyful]
        playable: true
        fact: >-
          The one-day-off anthem of the freight yards — 'dance like the ferry's never gonna show.' Played
          on every rest-day floor from the between to the belt.
      - id: s_1422
        title: Slapback Saturday
        track_number: 3
        genre: frontier-reels
        mood_tags: [warm]
        playable: true
        fact: >-
          A three-guys-and-a-busted-amp courtship reel — Saturday night in the hydroponics hall. 'The
          happiest hauler in the whole dang gang.'
  - id: b_113
    name: The Window Boxes
    kind: group
    home_settlement: Concordance
    label: unsigned
    genre: relay-pop
    active_from: 2617
    active_to: 2622
    bio: >-
      A Concordance corridor band who write jangling valentines to dome-keepers, neighbours and the
      people who make a corridor worth walking down. Their subject is the block and they have never
      left it. A power cut that turned into a block party turned into their best song, which the block
      considers partly theirs.
    albums:
    - id: al_207
      title: Dome Light
      band: b_113
      label: unsigned
      release_year: 2621
      kind: album
      genre: relay-pop
      cornerstone: false
      notes: >-
        A corridor record about a corridor, cut in one with the neighbours audibly present. The middle
        song is a power cut that became a party and then a hit, and the last one is about how a careful
        letter lands two weeks and a hundred changed minds too late, which is the same block being sensible
        about the lag.
      songs:
      - id: s_1423
        title: Garden-District Girl
        track_number: 1
        genre: relay-pop
        mood_tags: [bright]
        playable: true
        fact: >-
          A jangling relay-pop valentine to the dome-keeper who makes the corridor bloom — 'the reason
          there's a reason to be there.' The Window Boxes' breakout single.
      - id: s_1424
        title: Every Light in the Corridor
        track_number: 2
        genre: relay-pop
        mood_tags: [joyful]
        playable: true
        fact: >-
          A power cut turned block party turned relay-pop hit — 'the loudest, warmest, brightest block
          by far.' The corridor-neighbour anthem.
      - id: s_1425
        title: Two Weeks to Reply
        track_number: 3
        genre: relay-pop
        mood_tags: [bright]
        playable: true
        fact: >-
          The lag-letter relay-pop song — every careful line lands two weeks and a hundred changed minds
          too late, so you keep it simple and true.
  - id: b_114
    name: The Ring Riders
    kind: group
    home_settlement: Meridian storm coast
    label: unsigned
    genre: frontier-reels
    active_from: 2617
    active_to: 2622
    bio: >-
      A Meridian rest-day band who ride the slow-wheeling viewing ring for the view and not the gravity,
      and who have made a career out of one joke about speed. They play mess halls and have waxed at
      least one floor they should not have. Nobody has ever accused them of depth and they take it well.
    albums:
    - id: al_208
      title: Viewing Ring
      band: b_114
      label: unsigned
      release_year: 2620
      kind: album
      genre: frontier-reels
      cornerstone: false
      notes: >-
        Two rest-day songs about going nowhere pleasantly, one on the ring and one on a mess-hall floor
        buffed until it slid. The fastest slowest ride you will ever know is the line the coast took,
        and the bosun who went into the bin is, the band insist, a real bosun.
      songs:
      - id: s_1426
        title: Ride the Ring
        track_number: 1
        genre: frontier-reels
        mood_tags: [joyful]
        playable: true
        fact: >-
          The rest-day hit — riding the slow-wheeling viewing ring for the view, not the gravity. 'Fastest
          slowest ride you'll ever know.'
      - id: s_1427
        title: Waxed the Floor
        track_number: 2
        genre: frontier-reels
        mood_tags: [joyful]
        playable: true
        fact: >-
          The mess-hall dance-floor caper — buff the deck till it slides and dance till Monday. 'The
          surliest bosun in the fleet just did a full slide into the bin.'
  - id: b_115
    name: Junia & the Long Players
    kind: group
    home_settlement: Concordance late-club quarter
    label: unsigned
    genre: void-lounge
    active_from: 2615
    active_to: 2622
    bio: >-
      A horn-led band who take the late set in a core club after the last ferry, and whose own theme
      song is about staying on when the room thins out. Junia sings and the Long Players are five people
      who have been five different people twice. Slow songs are for the stay, the theme says, which
      is the club's whole business model.
    albums:
    - id: al_209
      title: The Long Set
      band: b_115
      label: unsigned
      release_year: 2621
      kind: album
      genre: void-lounge
      cornerstone: false
      notes: >-
        The late set as it is actually played: a floor-filler that turns the lag into a gift, the band's
        own theme in the middle, and a slow dance at the end for people who have been weeks apart. It
        was cut in the club after hours with the chairs up.
      songs:
      - id: s_1428
        title: Good News Travels Slow
        track_number: 1
        genre: void-lounge
        mood_tags: [joyful]
        playable: true
        fact: >-
          A horn-driven stomper that turns the lag into a gift — 'the distance made it worth the while.'
          Junia & the Long Players' floor-filler.
      - id: s_1429
        title: The Long Players
        track_number: 2
        genre: void-lounge
        mood_tags: [warm]
        playable: true
        fact: >-
          The band's own theme — the late-set players who keep the good thing on after the last ferry.
          'Slow songs are for the stay.'
      - id: s_1430
        title: Slow Dance on the Ring
        track_number: 3
        genre: void-lounge
        mood_tags: [tender]
        playable: true
        fact: >-
          The last-song ballad — a slow dance on the viewing ring after weeks apart. 'Give me the last
          one, give me you and me.'
  - id: b_116
    name: Odessa Rhee
    kind: solo
    home_settlement: Titan
    label: unsigned
    genre: old-system-sessions
    active_from: 2613
    active_to: 2622
    bio: >-
      A Titan harbour singer with a large voice and a long wait behind every song she has written —
      three seasons on the black and one green light kept burning is her own account of it. She is the
      strongest singer on this shelf. Nothing about how she was recorded reached the settled worlds
      with her.
    albums:
    - id: al_210
      title: Three Seasons Waiting
      band: b_116
      label: unsigned
      release_year: 2618
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        A harbour-town blues record about waiting, and about making peace with a lag that is not going
        to shorten. A good thing is always worth the wait, she sings, and then stands on a sea made
        by hand under the ice and says that patience and lamps beat the frozen hours. It is the most
        moving thing on this shelf.
      songs:
      - id: s_1431
        title: Harbor Light Blues
        track_number: 1
        genre: old-system-sessions
        mood_tags: [wistful]
        playable: true
        fact: >-
          A powerhouse harbour-town blues — three seasons waiting on the black, one green light kept
          burning. Odessa Rhee's signature closer.
      - id: s_1432
        title: Three Relays Gone
        track_number: 2
        genre: old-system-sessions
        mood_tags: [warm]
        playable: true
        fact: >-
          A struttin' blues groove that makes peace with the lag — 'a good thing's always worth the
          wait.' Odessa Rhee at her most defiant and warm.
      - id: s_1433
        title: Saltwater Under Titan
        track_number: 3
        genre: old-system-sessions
        mood_tags: [tender]
        playable: true
        fact: >-
          A deep blues ballad standing on a sea made by hand under Titan's ice — 'patience, love, and
          lamps can beat the frozen hours.' Odessa Rhee's most moving.
  - id: b_117
    name: Marlo Quist
    kind: solo
    home_settlement: Saturn
    label: unsigned
    genre: old-system-sessions
    active_from: 2612
    active_to: 2620
    bio: >-
      A gravel-voiced Saturn dock singer who plays for the ones who stay after the last boat goes. He
      has two subjects, staying and forgiving, and he does not confuse them. You do not get over it,
      he sings, you get used to it, which is the line the night shift out here has taken for its own.
    albums:
    - id: al_211
      title: The Ones Who Stay
      band: b_117
      label: unsigned
      release_year: 2616
      kind: album
      genre: old-system-sessions
      cornerstone: false
      notes: >-
        Two slow blues for the end of the night, and the second one forgives the lag for news that came
        too late. You cannot hate a distance, it says, it does not care how it feels. Nothing on this
        shelf is plainer or harder to follow anything with.
      songs:
      - id: s_1434
        title: Last Ferry Blues
        track_number: 1
        genre: old-system-sessions
        mood_tags: [melancholy]
        playable: true
        fact: >-
          A gravel-voiced slow blues for the ones who stay when the last ferry's gone — 'you don't get
          over it, you get used to it.' Marlo Quist's signature.
      - id: s_1435
        title: Nobody's Fault But the Dark
        track_number: 2
        genre: old-system-sessions
        mood_tags: [melancholy]
        playable: true
        fact: >-
          A blues that forgives the lag for the news that came too late — 'you can't hate a distance;
          it don't care how it feels.' Marlo Quist at his most tender.
