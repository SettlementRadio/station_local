  bands:
  - id: b_118
    name: The Ninefold Pipes of Forge
    kind: collective
    home_settlement: Forge
    label: unsigned
    genre: core-harmonies
    active_from: 2610
    active_to: 2620
    bio: >-
      A Forge foundry ensemble of pipe players drawn from the night shifts, who play the cooling floors
      out at the end of a run and have never recorded a note with a voice on it. That is the whole reason
      no house has ever pressed them and the reason this station cannot hold them either. Everything
      they have made circulates on the works' own copies.
    albums:
    - id: al_244
      title: The Cooling Floors
      band: b_118
      label: unsigned
      release_year: 2615
      kind: ep
      genre: core-harmonies
      cornerstone: false
      notes: >-
        Two long pipe pieces off the foundry floor, wordless from end to end — the signal call that
        answers itself, and the evensong the night shift plays out on.
