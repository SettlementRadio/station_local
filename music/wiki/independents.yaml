# Independents — the July collection, written by M-53.
#
# **This file is a collection, not a genre** (`wiki.COLLECTIONS`, D-099). It has no allocation in
# `plan.yaml`, it is not counted against one, and its albums are not bound to CONSTANTS.md section
# 1's eight anchor years. Everything else reads it exactly as it reads the nine: its ids are
# counted for collisions, its layer-A songs carry a fact and its layer-B titles carry none, its
# names are screened, and its playable songs become catalogue rows. It does not touch the
# commissioned 500.
#
# **What it is in the world.** 135 records that reached the station from outside the seven houses —
# unsigned, one at a time, mostly as copies of copies with a year written on the sleeve in
# somebody's hand. 42 bands, 76 records, 76 songs the station holds and 59 titles it can only name.
# `label: unsigned` throughout; there is no eighth house here and there never will be.
#
# **What it is on the disk.** 135 takes made between 2026-07-03 and 2026-07-25 on one Suno Pro
# account, v5.5, before COMMISSION.md was written. They arrived at `music/audio/RAW/music/` with a
# hand-written `tracks.yaml` beside them; M-54 copied the 76 the station holds to
# `music/audio/unsigned/` on 2026-09-02 and **M-56 deleted that folder the same day**. This file is
# now the only description of the collection, and unlike the folder it is in git.
#
# ## The split — 76 layer A, 59 layer B, and the rules that produced it
#
# 1. **The nine instrumentals are layer B.** COMMISSION.md section 7 wants instrumental passages and
#    not wordless tracks. The record exists; the station does not hold it.
# 2. **Everything under 2:00 is layer B** — section 7's floor, and 24 files are under it.
# 3. **One take per song.** 38 of the 135 are a second generation of a song already in the pile: 18
#    titled `(Alternate Take)` and 20 retitled (*Dockyard Heart* / *Dockyard Hearts*, *Pass It On* /
#    *Let's Pass It On*, *Red Soil, Blue Guitar* / *Red Soil Sunday* / *Blue Guitar, Red Evening*,
#    and so on). The longest surviving take of each cluster is the one the station holds, because
#    section 7's duration arithmetic runs short everywhere else in this project. Six of the winners
#    are titled `(Alternate Take)` and keep that title: the cut that reached this shelf is the second
#    one, and saying so is truer than swapping the labels round.
# 4. **The station's own song keeps both takes** — *Green Lights All the Way* and *Green Lights
#    (Reprise)* — `s_1374` and `s_1378`, tracks 1 and 5 of `al_179`. M-55 adopted them on
#    2026-09-02 and the section below is what that means.
#
# A fifth rule was added by ear rather than by reading, and it took one take out: **a take that hits
# the model's ceiling is not a record**. See `s_1362` below.
#
# **Layer B is a record of its own, never a track on a layer-A one.** `check.py` asks every song on
# a layer-A album for a fact and refuses one on a layer-B album, so the takes the station does not
# hold sit on their own record — the single or EP that circulated and never reached us. That is why
# 33 of the 42 bands carry two entries here and why the album count is 76 rather than the 46 the
# card estimated.
#
# ## The station's own song — `s_1374` and `s_1378`, and the pin they need (M-55, D-101)
#
# Settlement Radio has adopted *Green Lights All the Way* (`s_1374`, 2:39, track 1 of `al_179`) as
# the song it opens the broadcast day on, and *Green Lights (Reprise)* (`s_1378`, 2:14, track 5) as
# the one it closes on. Nothing had to be invented for this: the reason is the record's own story —
# every buoy green from dock to bay, haulers playing it leaving port for luck and harbourmasters
# swearing it works — and a station that opens on a luck song is a station with a character. Canon
# 65-arts calls the works the station treats as common reference the Station Canon, inferred by
# listeners from repeats rather than published; this is the station putting one there on purpose.
# It is also why rule 4 above keeps both takes where every other duplicate cluster kept one.
#
# **It is a song and not an ident, and it must not become one.** `sonic_logo_signature.mp3` is the
# station's signature — twelve seconds of sung station name, approved by the operator 2026-08-23,
# and every other imaging piece quotes its glass-bell motif (`music/jingles/README.md` section 5a).
# Two competing signatures is how a station stops sounding like one station. The logo is the ident;
# this is the song. Any edit of it into a sting or a bed is an imaging asset and the operator's, in
# an editor: placement is config, audio is not.
#
# **The pin itself cannot be written yet, and this is the requirement it inherits.** `config/grid.yaml`
# does not exist — the hour clocks are `imaging/IMAGING_TASKS.md` I-14 and the pinned junction is
# `docs/TASKS.md` T-012. When they are written: **these two ids play from a fixed slot and are never
# drawn from rotation.** PROGRAMMING.md section 8 runs the broadcast day 05:00 to 04:59, so the head
# is the 05:04 open and the foot is the last music before 05:00 in the 04:04 slot. Whatever fills a
# music slot must filter `s_1374` and `s_1378` out of its pool, or ARCHITECTURE.md section 8's
# separation rules — same track four hours, same artist sixty minutes, same album ninety minutes —
# will fight the pin every day and one of the two loses audibly. Both songs carry the mark in their
# own `notes:` field: **grep `station-song` and the file answers.**
#
# ## The one take that was judged by ear — `s_1362`, *Cargo-Hold Lullaby*
#
# It ran 479.4 seconds, which to the tenth of a second was the length of the runaway generation the
# operator deleted on 2026-09-01. Section 7 has no upper floor, so M-53's rules kept it and wrote it
# in as playable on `al_171`; M-53 could not judge it by reading and left the question for the
# operator. **The operator listened on 2026-09-02 and it is a runaway.** It is now `playable: false`
# on `al_245`, a layer-B record of its own, and no audio for it was ever copied. That is why the
# collection is **76 held and 59 named** where the section above it once said 77 and 58, and why
# `al_171` is a single rather than an album. Nothing else in this file moved.
#
# ## The dating
#
# The pile's own years cluster 2620–2626, which would have put all 135 in heavy rotation (`category`
# is derived, not chosen — five in-world years or older is `gold`, D-085) and crowded the
# commissioned 500. Everything here is re-dated into **2613–2621**, so the whole collection is gold.
# No lyric, fact or album story had ever been written against the old years. The eight anchors do
# not bind a collection and this one mostly misses them on purpose: records that arrived one at a
# time are not records that came out in the years every house shipped into. **No playable song here
# lands on an anchor at all** — six layer-B records sit on 2619 and nothing else touches one, so
# CONSTANTS.md section 1's frozen per-anchor tallies of playable songs do not move.
#
# ## The retitles — the collection's copy moves, never the wiki's
#
# Albums: *After the Last Ferry* → *The Long Set* · *Old-System Sessions* (three different bands
# used it) → *Concourse Jukebox*, *Three Seasons Waiting*, *The Ones Who Stay* · *Resonance* → *The
# Cooling Floors* · *Turnover* → *The Thousand-Hour Road* · *Under the Ice* → *Ice Highway*.
# Songs: *Burn Day* → *The Whole Crew's Holiday* · *Hold the Line* → *Everybody Running* · *Second
# Shift Blues* → *The Little Light That's Up* · *The Long Way Round* → *To Stay Awake on the
# Crossing*.
#
# Two more moved on the Wikidata screen rather than on a wiki collision, and CONSTANTS.md section 3
# carries the verdicts: the album *The Commons* → *Hands Off the Air*, and the song *Wings* →
# *Patchwork Wings (Late Cut)*, which is what that take is.
#
# **Three more album titles moved and were not written down, and M-56's check 4 found them.** The
# collection's *Red Soil, Blue Guitar* (Calder Moon) is `al_201` *Red Soil Sunday* · *Light on Titan
# Bay* (Sela Maren) is `al_192` *Titan Bay at Midnight* · *Red Weather Sessions* (Mara Vale) is
# `al_187` *Red Weather*. **Why they moved is not recorded and is not being guessed at here**; what
# is on the page is that the first two named an album after a song the same band's pile also carries
# — *Red Soil, Blue Guitar* and *Light on Titan Bay* are both song titles, and the split sent both
# songs to a layer-B record — so keeping the sleeve's name would have put an album and a song of the
# same name on one band's shelf. Each of the three is a single here and takes the title of the one
# take that survived rule 3. Recorded because `tracks.yaml` is being deleted and these three names
# were the last thing that existed only in it.
#
# ## The facts are the pile's own blurbs, edited twice and only twice
#
# Every layer-A song's fact is its `story_blurb` from `tracks.yaml`. Two things were edited out.
# **Names canon does not have** — `Orin` and `Greaves` are the previous attempt's vocabulary and
# appear nowhere in `canon/`; `Vell` is canon and stays. **The production vocabulary** — COMMISSION.md
# section 8 keeps real genre and technique words out of the wiki entirely, because the wiki is read
# into the station and can reach the microphone, and the blurbs were written full of them
# ("power-pop", "folk-rock", "surf-rock", "soul-rock"). The in-world vocabulary is the nine canon
# forms, plus the one exception that is exactly three words wide and old-system material only:
# blues, rock, the folk rounds. Twenty-eight facts and three bios were edited to that rule and to
# nothing else. **The era words were not edited**: `age-of-relays`, `reconnection` and
# `first-expansion` are the tags, not the prose, and canon 10-history names all three ages.
#
# **M-54 filed the audio by (band, title).** Every other title in this file is the title the take
# carried in `music/audio/RAW/music/tracks.yaml` — deleted at M-56 — and every (artist, title) pair
# there was unique, so the mapping was mechanical. **M-56's check 4 walked that file one last time
# before deleting it**: all 43 artist names, 59 albums and 135 song titles reach this page, under
# their own name or a retitle recorded above. The five song retitles above are the only places it is not — four of
# them on playable songs — and
# `First Generation` is the one artist that moved: its single take is filed here under The
# First-Ships Choir, because the pile itself puts the name in quotation marks and the sleeve's
# first-generation claim is a claim and not a credit (canon 70-music, fact 22 — nothing that old
# plays).
#
# ## What is deliberately not here
#
# **No style cards** (M-53's own note): a style card fixes how a band sounds for records not yet
# made, and every record these bands will ever make already exists. **No members, no session
# players, no layer C** — the card asks these bands for a bio, a home and a kind, and a shelf of
# unsigned copies does not come with a line-up. **No cornerstones**: the list is full at six and
# nothing here is a cornerstone of anything.
section:
  genre: independents
  collection: true
  present_year: 2626
  layers:
    played: A
    referenced: B
layer_a:
  bands:
  - id: b_077
    name: Halden Vre
    kind: solo
    home_settlement: Far Reach
    label: unsigned
    genre: void-ballads
    active_from: 2609
    active_to: 2616
    bio: >-
      Halden Vre kept a one-keeper relay months out from the nearest light and sang to the star in his
      window because the alternative was the beacon. He recorded on the outpost's own gear, sent the
      results down the road with whoever was passing, and never once asked a house for anything. Nobody
      on Far Reach can say what he did before the vigil and nobody there considers it their business.
    albums:
    - id: al_170
      title: A Window in the Dark
      band: b_077
      label: unsigned
      release_year: 2613
      kind: album
      genre: void-ballads
      cornerstone: false
      notes: >-
        Three pieces off one watch, cut on outpost gear and carried down the relay road by a crew who
        were not asked twice. It is the record every keeper on the far stations claims to have heard
        first, which cannot be true of all of them. What makes it is the room — a space built for machinery,
        with one man in it.
      songs:
      - id: s_1359
        title: The Slow Star
        track_number: 1
        genre: void-ballads
        mood_tags: [melancholy]
        playable: true
        fact: >-
          Written on a one-keeper station months from the nearest light — a man singing to the single
          star that never sets in his window.
      - id: s_1360
        title: Nobody Answers the Dark
        track_number: 2
        genre: void-ballads
        mood_tags: [contemplative]
        playable: true
        fact: >-
          A keeper's half-question to the emptiness beyond the last settlement — sent out on a relay
          that won't reach anyone for half a year.
  - id: b_078
    name: Ysolde Mar
    kind: solo
    home_settlement: the between
    label: unsigned
    genre: void-ballads
    active_from: 2611
    active_to: 2618
    bio: >-
      Ysolde Mar navigates freight and plays in the hold on the long crossings, which is where everything
      she has ever recorded was made. Her two surviving pieces run long because a crossing runs long
      and she has never seen a reason to cut one short for a stranger. She has been offered terms twice
      and has not answered either time.
    albums:
    - id: al_171
      title: Cargo-Hold Songs
      band: b_078
      label: unsigned
      release_year: 2615
      kind: single
      genre: void-ballads
      cornerstone: false
      notes: >-
        One long piece made in a freight hold between watches, on a crossing nobody has been able to
        name since. It is the only thing of hers the station has ever managed to hold a clean copy of;
        the other one that circulates is on the sleeve below and nobody's copy of it ends the same way.
      songs:
      - id: s_1361
        title: To Stay Awake on the Crossing
        track_number: 1
        genre: void-ballads
        mood_tags: [mellow]
        playable: true
        fact: >-
          A navigator's own slow shape of an old Earth-origin new-year piece, learned in a cargo hold
          from a woman who played to stay awake on the crossings — it loops the way a long journey does,
          and it is the only thing of hers anybody has been able to name a year for.
  - id: b_079
    name: Concordance Exchange Consort
    kind: collective
    home_settlement: Concordance
    label: unsigned
    genre: core-harmonies
    active_from: 2610
    active_to: 2620
    bio: >-
      A standing consort of Exchange House players who rehearse in the roofed gardens and have never
      been signed, because the houses they play for pay them better as staff than any label would as
      artists. They record when the gardens are shut and the acoustic is theirs, which is twice a year
      at most. Everything they make circulates by copy among the gardeners, the clerks and the people
      who clean the glass.
    albums:
    - id: al_172
      title: Deep Listening, Vol. II
      band: b_079
      label: unsigned
      release_year: 2614
      kind: single
      genre: core-harmonies
      cornerstone: false
      notes: >-
        The volume the consort made for the Council's long table and then could not stop people copying.
        It is a room record: written for a glass roof and unbearable anywhere else, which is why the
        houses have never wanted it and the clerks have never let it go out of circulation.
      songs:
      - id: s_1363
        title: The Long Table
        track_number: 1
        genre: core-harmonies
        mood_tags: [warm]
        playable: true
        fact: >-
          A gentle piece for the Settlement Council's long table — the sound of many worlds sitting
          down together, for once, in the same room.
  - id: b_080
    name: Brace & the Tin Reelers
    kind: group
    home_settlement: Breathe Easy
    label: unsigned
    genre: frontier-reels
    active_from: 2614
    active_to: 2621
    bio: >-
      Brace runs a salvage yard and the Tin Reelers are whoever is working it that month, which is why
      the line-up on any two of their recordings is different and none of them minds. Everything they
      play is made from what came off a hull: oxygen-tank drums, stripped-wire chimes, and one fiddle
      that has been rebuilt four times. They have turned down two houses on the grounds that a house
      would want the same six people every time.
    albums:
    - id: al_173
      title: Salvage & Song
      band: b_080
      label: unsigned
      release_year: 2617
      kind: album
      genre: frontier-reels
      cornerstone: false
      notes: >-
        Recorded across four Saturday nights in the yard itself, with the doors open and whoever turned
        up on the choruses. Brace has said the record cost nothing but the drink, and the yard's insurers
        have said something else. It is the reel record the near frontier learned its send-off tunes
        off.
      songs:
      - id: s_1364
        title: Salvage Yard Saturday
        track_number: 1
        genre: frontier-reels
        mood_tags: [joyful]
        playable: true
        fact: >-
          A Freeholds reel banged out on oxygen-tank drums and wire chimes — the Saturday sound of people
          who work hard all week and celebrate harder, on instruments made from what broke.
      - id: s_1365
        title: Wire and Bone
        track_number: 2
        genre: frontier-reels
        mood_tags: [driving]
        playable: true
        fact: >-
          The reel they play at a Freeholds send-off — half work-song, half dare, all made of wire and
          bone and whatever rings when you hit it.
  - id: b_081
    name: Sixteen Hands
    kind: collective
    home_settlement: separate relay settlements
    label: unsigned
    genre: core-harmonies
    active_from: 2612
    active_to: 2619
    bio: >-
      Sixteen players on eight settlements who have never been in a room together and compose entirely
      by relay, each part cut where its player lives and stitched at the far end. The distance is audible
      and they have always said it is the point. No house has worked out how to sign a band whose members
      cannot be got into the same contract, and the collective has never tried to help.
    albums:
    - id: al_174
      title: Across the Dark
      band: b_081
      label: unsigned
      release_year: 2616
      kind: single
      genre: core-harmonies
      cornerstone: false
      notes: >-
        Every part of this was cut on a different world and the joins were never hidden. The collective's
        rule is that nobody hears the whole thing until it is finished, so the singers on it heard the
        record for the first time the same week the rest of the settled worlds did.
      songs:
      - id: s_1366
        title: Letters We Sent Ahead
        track_number: 1
        genre: core-harmonies
        mood_tags: [wistful]
        playable: true
        fact: >-
          A collective whose members have never met — each part recorded on a different world and stitched
          together across the relays. You can hear the distance between the voices; that's the point.
  - id: b_082
    name: The Shellwrights
    kind: collective
    home_settlement: Far Reach
    label: unsigned
    genre: void-ballads
    active_from: 2611
    active_to: 2620
    bio: >-
      A far-worlds collective who build every instrument they play from the shells of the creatures
      their world grows, under the compact that lets them take only what the tide leaves. They are Localists
      by practice rather than by argument and get impatient with people who want it to be an argument.
      Their instruments do not survive shipping, which is the whole reason nobody has ever booked them
      anywhere else.
    albums:
    - id: al_175
      title: Deep Listening, Vol. IV
      band: b_082
      label: unsigned
      release_year: 2615
      kind: single
      genre: void-ballads
      cornerstone: false
      notes: >-
        The fourth of a copied series that has no first three anybody can produce, which the collective
        finds funnier than the people cataloguing it do. What is on it is a shell resonance no manufactured
        instrument makes and a lullaby sung to the creatures the shells came from, in that order, and
        the order is deliberate.
      songs:
      - id: s_1367
        title: Fauna Song
        track_number: 1
        genre: void-ballads
        mood_tags: [tender]
        playable: true
        fact: >-
          A lullaby the far-worlds sing to the creatures whose shells become their instruments — gratitude
          and apology in the same breath.
  - id: b_083
    name: The First-Ships Choir
    kind: collective
    home_settlement: Concordance
    label: unsigned
    genre: core-harmonies
    active_from: 2610
    active_to: 2621
    bio: >-
      An unpaid choir of about forty who meet in a Concordance hall on rest-days to sing the hymns that
      outlived the ships, and who are firm that they are singing repertoire and not history. None of
      them is a professional and two of them have been in it fifty years. The Council has asked them
      to sing at three openings and they have said yes to one.
    albums:
    - id: al_176
      title: The Deep Stacks
      band: b_083
      label: unsigned
      release_year: 2613
      kind: album
      genre: core-harmonies
      cornerstone: false
      notes: >-
        Old repertoire re-cut by the people who still sing it, which is the only way any of it reaches
        anybody — the ships themselves left nothing that plays. The record closes with a fragment somebody
        put a first-generation claim on, and the choir printed the claim without endorsing it and has
        declined to discuss it since.
      songs:
      - id: s_1368
        title: Departure Hymn
        track_number: 1
        genre: core-harmonies
        mood_tags: [solemn]
        playable: true
        fact: >-
          An Exodus Hymn from the first ships — solemn, hopeful, carrying the weight of leaving and
          the dream of arrival. Centuries old and still sung when a settlement sends someone out.
      - id: s_1369
        title: The Blue Cradle
        track_number: 2
        genre: core-harmonies
        mood_tags: [nostalgic]
        playable: true
        fact: >-
          The hymn every settled child learns about Earth — half record, half founding myth: the blue
          planet, the place humanity first learned to look up and wonder.
      - id: s_1370
        title: Earthlight (First-Generation Recording)
        track_number: 3
        genre: core-harmonies
        mood_tags: [nostalgic]
        playable: true
        fact: >-
          The sleeve calls it a first-generation recording off the original ship and the choir prints
          the claim without believing it; nothing that old plays, and what is on this is one voice and
          a worn acoustic instrument that everybody agrees sounds older than it can be.
