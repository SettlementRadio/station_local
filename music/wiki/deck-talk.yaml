      home_settlement: Cold Harbor
      label: label_2
      genre: deck-talk
      active_from: 2598
      active_to: 2624
      bio: >-
        Corner Bay Crew worked the smallest bay in Cold Harbor and built a whole style out of calling
        quietly, because the room they used was too small to shout in. They stopped in 2624 when their
        percussionist was told she could no longer work the docks and the crew declined to replace her.
      albums:
