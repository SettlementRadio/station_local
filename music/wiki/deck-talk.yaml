          genre: deck-talk
          instruments: [answering verse]
          active_from: 2596
          active_to: 2609
        - id: p_pim_calder
          name: Pim Calder
          genre: deck-talk
          instruments: [answering verse, struck cargo plate]
          active_from: 2609
          active_to: 2626
        - id: p_odri_vane
          name: Odri Vane
          genre: deck-talk
          instruments: [oxygen-tank drums, struck cargo plate]
          active_from: 2596
          active_to: 2626
        - id: p_sten_halvo
          name: Sten Halvo
          genre: deck-talk
          instruments: [composite bass, sung hook]
          active_from: 2596
          active_to: 2626
      movement: Localist
      bio: >-
        The Wake Count are a hauler crew who record in cargo bays between runs and have never made a
        record in a room they were not working in. Hesta Orlow keeps the running order on the same
        clipboard she uses for the load sheet and has been photographed with both. Alto Renn answered
        the verses until 2609, when he took a berth on a circuit that does not come back, and Pim
        Calder has answered them since. Common Wake Cooperative pays them the same share it pays its
        loaders, which the crew has said in public is the only reason they are still on it.
      album_ids: [al_060, al_061, al_062, al_063]

    - id: b_030
      name: Gate Shift Callers
      kind: crew
      home_settlement: Cold Harbor
      label: label_2
      genre: deck-talk
      active_from: 2578
      active_to: 2607
      bio: >-
        Gate Shift Callers were the first crew anyone recorded calling a shift total over percussion,
        and they made both their records for a Cold Harbor freight office rather than a label. They
        stopped in 2607 when the office was closed and the two callers took posts on opposite sides of
        the settlement. Nera Ostell clerked the relay berth two gates along and has said she learned
        to hold a long list from listening to them through a wall, which is the only thing anybody in
        Cold Harbor agrees the crew are owed.
      albums:
        - id: al_064
          title: Gate Shift
          label: label_2
          release_year: 2579
          kind: album
          genre: deck-talk
          notes: The oldest deck-talk record anyone can produce a copy of, and the one every crew on the near frontier claims to have heard first.
          songs:
            - {id: s_0523, title: Gate Shift, track_number: 1, genre: deck-talk, playable: false}
            - {id: s_0524, title: Call the Bay Total, track_number: 2, genre: deck-talk, playable: false}
            - {id: s_0525, title: Nobody Signed for It, track_number: 3, genre: deck-talk, playable: false}
            - {id: s_0526, title: Stand at the Board, track_number: 4, genre: deck-talk, playable: false}
