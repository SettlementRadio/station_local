layer_c:
  recordings: none survive
  figures:
    - id: f_009
      name: Anse Duro
      kind: ledger caller
      genre: deck-talk
      active_from: 2431
      active_to: 2464
      played: calling voice and struck ration tin
      history: >-
        Anse Duro called the stores ledger aloud in a Freehold settlement between 2431 and 2464, at a
        time when doing so was a legal requirement and not a performance. Settlement records describe
        a caller who kept time on a ration tin so that a room of two hundred could follow a list to the
        end, and complaints survive from clerks who wanted the readings shortened. Duro is named
        because every account of deck-talk starts with the reading being made audible on purpose, and
        this is the earliest reading anybody wrote down.
    - id: f_010
      name: Lubek Yarrow
      kind: instrument maker and caller
      genre: deck-talk
      active_from: 2459
      active_to: 2492
      played: calling voice, cut oxygen tanks and wire chimes
      history: >-
        Lubek Yarrow cut the first oxygen tanks into a tuned set between 2459 and 2492 and taught
        several settlements to make their own, charging nothing and refusing to keep a design to
        himself. Written orders survive in which a Freehold committee tried to stop the practice on
        safety grounds and was ignored. Yarrow matters because the percussion the form is built on is
        an instrument somebody deliberately made, not scrap that happened to be there.
    - id: f_011
      name: Ossa Wend
      kind: counting singer
      genre: deck-talk
      active_from: 2488
      active_to: 2521
      played: calling voice and struck plate
      history: >-
        Ossa Wend worked the transfer halls of an early frontier port from 2488 to 2521 and was the
        first caller anyone described as having a style rather than a duty. Accounts from three
        settlements agree that she would take on any caller who claimed a longer list, and that she
        was beaten twice and said so herself both times. The contest that deck-talk is built around is
        first recorded as a contest in the arguments about her.
    - id: f_012
      name: Torrel Byce
      kind: crew answerer
      genre: deck-talk
      active_from: 2513
      active_to: 2546
      played: answering voice and stripped-wire chimes
      history: >-
        Torrel Byce answered other people's calls for thirty-three years and is not recorded as having
        ever led one. Contemporary notices treat the answering part as the harder job and name him
        ahead of the callers he worked with, which no later account does. He is still mentioned
        because every crew since has been built on two voices rather than one, and the answer is the
        part that decides whether the exchange works.
