          name: Onn Karvel
          genre: deck-talk
          instruments: [lead verse, struck alloy]
          active_from: 2603
          active_to: 2626
        - id: p_sudi_farrow
          name: Sudi Farrow
          genre: deck-talk
          instruments: [answering verse, sung hook]
          active_from: 2603
          active_to: 2626
        - id: p_juda_ness
          name: Juda Ness
          genre: deck-talk
          instruments: [composite bass]
          active_from: 2603
          active_to: 2615
        - id: p_emel_prise
          name: Emel Prise
          genre: deck-talk
          instruments: [resonance pipes, composite bass]
          active_from: 2615
          active_to: 2626
        - id: p_tova_ilm
          name: Tova Ilm
          genre: deck-talk
          instruments: [oxygen-tank drums, stripped-wire chimes]
          active_from: 2603
          active_to: 2626
      movement:
        initial: Localist
        changed_to: Synthesist
        changed_year: 2615
        detail: >-
          Emel Prise joined in 2615 and put amplified resonance pipes under the whole record, which
          Juda Ness had refused to allow for twelve years and left rather than play with.
      bio: >-
        The Long Tally have called Forge's floor counts since 2603 and are the crew every younger
        Forge crew is measured against. Onn Karvel writes his verses out as a numbered list and
        crosses off lines he cannot say in one breath. Juda Ness left in 2615 over the amplified
        pipes and has not spoken to the crew since, which Deep Register printed on the sleeve without
        asking. Sudi Farrow sings the hooks and is the only member who will take a second take.
      album_ids: [al_057, al_058, al_059]

    - id: b_029
      name: The Wake Count
      kind: crew
      home_settlement: the between
      label: label_5
      genre: deck-talk
      active_from: 2596
      active_to: 2626
      members:
