      genre: deck-talk
      active_from: 2590
      active_to: 2619
      bio: >-
        Struck Metal Union were a rotating group of Forge floor workers with no fixed line-up, who
        held that anyone who could carry the count could record with them. They ended in 2619 after an
        argument about whether a paid member could be turned away, which nobody would put in writing.
      albums:
