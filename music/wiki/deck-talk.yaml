      genre: deck-talk
      active_from: 2586
      active_to: 2612
      bio: >-
        Open Ledger were three haulers who called the manifest aloud on every run and started
        recording it because a settlement clerk kept disputing what had been delivered. They stopped in
        2612 when their lead caller took a shore post and told the co-operative he had run out of
        lists.
      albums:
