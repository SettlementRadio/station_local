      kind: crew
      home_settlement: Cold Harbor
      label: unsigned
      genre: deck-talk
      active_from: 2610
      active_to: 2626
      bio: >-
        Half a Shift have turned down every label that has approached them and press their own records
        in runs of two hundred, which is how the form spread before any label was interested. They are
        the most widely traded deck-talk crew nobody's catalogue lists.
      albums:
