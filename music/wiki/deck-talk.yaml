    - id: al_062
      title: Longest List We Carry
      band: b_029
      label: label_5
      release_year: 2621
      kind: album
      genre: deck-talk
      cornerstone: false
      notes: >-
        Made in one bay over nine days in 2621, the first Wake Count record cut in a single room, after
        the co-operative agreed to hold the ship in port so it could be. Hesta Orlow and Pim Calder
        had by then been trading verses for ten years and the record is built almost entirely on
        exchanges with no hook at all. Two tracks were cut and replaced on the last day because a
        member vote found them too close to a Cold Harbor crew's record. Burn Day Wages had the ship
        held for them the season before and voted against holding it again, which Hesta Orlow has
        never let go of. It is the one Common Wake Cooperative sends out when anyone asks what the
        label does.
