      kind: crew
      home_settlement: the between
      label: label_5
      genre: deck-talk
      active_from: 2601
      active_to: 2626
      bio: >-
        Tally and Answer are two haulers who have recorded nothing but exchanges since 2601 and have
        never put a sung line on a record. They are the crew other crews on the circuits challenge,
        and they have said in public that they have never turned a challenge down.
      albums:
        - id: al_072
          title: Tally and Answer
          label: label_5
          release_year: 2603
          kind: album
          genre: deck-talk
          notes: Eight straight exchanges with no hooks at all, and the record that made the form's contests a thing crews travelled for.
          songs:
