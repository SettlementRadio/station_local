# Layer A is empty on purpose. Deck-talk is one of the two forms the station does not press
# (D-068, M-44). Every band, record, credit, bio and album story it ever had is below, in layer B:
# a presenter can talk about all of it and the station holds none of it. COMMISSION.md §1 —
# "most of the music you invent will never be recorded, and that is correct."
layer_a:
  bands: []
  albums: []

layer_b:
  bands:
    - id: b_027
      name: Read It Back
      kind: crew
      home_settlement: Cold Harbor
      label: label_2
      genre: deck-talk
      active_from: 2609
      active_to: 2626
      members:
        - id: p_vess_arun
          name: Vess Arun
          genre: deck-talk
          instruments: [lead verse]
          active_from: 2609
          active_to: 2626
        - id: p_dob_ferrin
          name: Dob Ferrin
          genre: deck-talk
          instruments: [answering verse]
          active_from: 2609
          active_to: 2626
        - id: p_ilma_torre
          name: Ilma Torre
          genre: deck-talk
          instruments: [oxygen-tank drums, stripped-wire chimes]
          active_from: 2609
          active_to: 2626
        - id: p_kal_denn
          name: Kal Denn
          genre: deck-talk
          instruments: [composite bass, sung hook]
          active_from: 2609
          active_to: 2626
      movement: Localist
      bio: >-
        Read It Back are four Cold Harbor dockers who started calling shift totals across a transfer
        bay because the posted sheet was too far from the floor to read. Vess Arun and Dob Ferrin
        trade the verses and have never recorded one in a single voice. Ilma Torre builds the
        percussion out of whatever the bay is throwing away that month and refuses to carry an
        instrument between sessions. Harbor Standard signed them in 2611 after a bay supervisor
        complained about the noise in writing and the complaint was read out at a hearing.
      album_ids: [al_054, al_055, al_056]

    - id: b_028
      name: The Long Tally
      kind: crew
      home_settlement: Forge
      label: label_4
      genre: deck-talk
      active_from: 2603
      active_to: 2626
      members:
