layer_c:
  recordings: none survive
  figures:
    - id: f_013
      name: Tam Rickett
      kind: dance fiddler
      genre: frontier-reels
      active_from: 2438
      active_to: 2471
      played: gut-strung fiddle and stamped board
      history: >-
        Tam Rickett worked the earliest near-frontier settlements between 2438 and 2471, playing for
        dances in rooms that had been built for something else. Settlement minutes record payments
        to him in rations rather than money and one dispute in which a committee argued that dancing
        wasted heat. He is named because every account of the form begins with a single fiddler and
        a board to stamp on, and Rickett is the first one anybody wrote a payment down for.
    - id: f_014
      name: Ordell Mave
      kind: instrument maker
      genre: frontier-reels
      active_from: 2466
      active_to: 2499
      played: composite fiddle, of her own making
      history: >-
        Ordell Mave cut the first fiddles from engineered composite between 2466 and 2499 after wood
        stopped arriving on the near frontier, and the thin bright tone every reel band has since is
        hers. She made instruments to order and kept no pattern, so no two survive that measure the
        same. She matters because the sound of the form is a material shortage that somebody turned
        into a decision.
    - id: f_015
      name: Bessel Kroy
      kind: caller and dancing master
      genre: frontier-reels
      active_from: 2491
      active_to: 2524
      played: calling voice, no instrument
      history: >-
        Bessel Kroy travelled eleven near-frontier settlements between 2491 and 2524 teaching the
        figures that dancers still walk through, and he never played an instrument in his life.
        Three settlements kept his written sets and two of them disagree about the same dance,
        which is an argument callers still have. He is remembered because the tunes were never the
        difficult part and the figures were.
    - id: f_016
      name: Ivet Sallow
      kind: dance fiddler and hall keeper
      genre: frontier-reels
      active_from: 2513
      active_to: 2546
      played: composite fiddle
      history: >-
        Ivet Sallow kept a hall on the near frontier from 2513 to 2546 and played in it every week
        she owned it, which is the first time anyone combined the two jobs. Her ledgers survive and
        are the earliest record of what a dance cost to put on and what a band was paid for it. She
        is mentioned whenever anybody argues about door money, and the argument has not changed.
