    - id: al_038
      title: Ten Ports Out
      band: b_019
      label: label_5
      release_year: 2612
      kind: album
      genre: lane-rock
      cornerstone: false
      notes: >-
        Written across a single ten-port run and recorded in a covered bay with the doors open, this
        is the record the band made in the year a core late-club label folded and took a booking of
        theirs with it. Una Brack sings a lead line on it for the first time. Bel Corrow spent the
        sessions collecting contract wording, four lines of which ended up in the middle of a song.
        The co-operative pressed twice as many copies as it had for the previous record and sold
        every one.
      songs:
        - id: s_0320
          title: Ten Ports Out
          track_number: 1
          genre: lane-rock
          mood_tags: [driving, restless, fast]
          playable: true
          fact: Dov Reyland wrote one verse at each of the first four ports of a single run and finished the rest at the fifth.
          credits: {writers: [p_dov_reyland], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0321
          title: The Year the Room Closed
          track_number: 2
          genre: lane-rock
          mood_tags: [angry, heavy, midtempo]
          playable: true
          fact: The band wrote it after a late-club room cancelled their booking without notice when its label folded in 2612.
          credits: {writers: [p_dov_reyland, p_ryke_alden], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0322
          title: Whose Catalogue Is It
          track_number: 3
          genre: lane-rock
          mood_tags: [bitter, hard, brisk]
          playable: true
          fact: Ryke Alden wrote the riff the night the band heard a label's back catalogue had become disputed, and the words were added a month later.
          credits: {writers: [p_ryke_alden], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0323
          title: Four Voices, One Line
          track_number: 4
          genre: lane-rock
          mood_tags: [warm, singalong, midtempo]
          playable: true
          fact: Una Brack sings the top line alone here for the first time, having refused to do it on the band's previous record.
          credits: {writers: [p_una_brack, p_dov_reyland], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0324
          title: Load Out in the Rain
          track_number: 5
          genre: lane-rock
          mood_tags: [weary, driving, brisk]
          playable: true
          fact: The band kept the take in which the weather changed the sound of the covered bay halfway through the song.
          credits: {writers: [p_dov_reyland], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0325
          title: Don't Read the Contract Aloud
          track_number: 6
          genre: lane-rock
          mood_tags: [wry, rowdy, fast]
          playable: true
          fact: Bel Corrow reads four lines of a real haulage contract in the middle of the song, chosen because they contradict one another.
          credits: {writers: [p_bel_corrow, p_ryke_alden], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0326
          title: Slow Berth
          track_number: 7
          genre: lane-rock
          mood_tags: [reflective, sustained, slow]
          playable: true
          fact: Calo Meret played the whole piano part with the lid closed, after the band asked for something quieter than the bay.
          credits: {writers: [p_dov_reyland, p_una_brack], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_una_brack, sp_calo_meret], producer: p_ryke_alden}
        - id: s_0327
          title: Keep the Kit Loud
          track_number: 8
          genre: lane-rock
          mood_tags: [rowdy, loud, fast]
          playable: true
          fact: Brin Noll retuned the bay's loose metal before the engineers were allowed to place a microphone, which is the only condition he works under.
          credits: {writers: [p_hess_vantry, p_dov_reyland], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, sp_brin_noll], producer: p_ryke_alden}
        - id: s_0328
          title: Home Port Eventually
          track_number: 9
          genre: lane-rock
          mood_tags: [hopeful, warm, midtempo]
          playable: true
          fact: Sel Ardin wrote the answering chorus during a session break and the band learned it in one pass.
          credits: {writers: [p_dov_reyland, p_ryke_alden], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack, sp_sel_ardin], producer: p_ryke_alden}

    - id: al_039
      title: Hold the Whole Chorus
      band: b_019
      label: label_5
      release_year: 2619
      kind: album
      genre: lane-rock
      cornerstone: true
      notes: >-
        Burn Day Wages recorded this across three ports inside one run in 2619, tracking the rhythm
        section at the first, the guitars at the second and the vocals at the third. A copy reached
        the band with a different writer's name printed on the label, which produced both a song and
        a formal complaint the co-operative is still cited for. Una Brack had written a resignation
        before the sessions and stayed after a members' vote changed how backing singers were paid.
        The running order was decided by that same membership, and the record is the one every
        hauler settlement plays on burn day.
      songs:
        - id: s_0329
          title: Hold the Whole Chorus
          track_number: 1
          genre: lane-rock
          mood_tags: [anthemic, singalong, midtempo]
          playable: true
          fact: Thirty-one members of the co-operative sing the final chorus, recorded in a transfer hall between two departures.
          credits: {writers: [p_dov_reyland, p_ryke_alden], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0330
          title: Three Ports, One Take
          track_number: 2
          genre: lane-rock
          mood_tags: [driving, restless, fast]
          playable: true
          fact: The drums were recorded at one port, the guitars at the second and the vocals at the third, all inside a single run.
          credits: {writers: [p_dov_reyland], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0331
          title: Altered Credit
          track_number: 3
          genre: lane-rock
          mood_tags: [bitter, hard, brisk]
          playable: true
          fact: Ryke Alden wrote it after a copy of the band's own record reached them with a different writer's name printed on the label.
          credits: {writers: [p_ryke_alden, p_dov_reyland], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0332
          title: The Between
          track_number: 4
          genre: lane-rock
          mood_tags: [reflective, expansive, midtempo]
          playable: true
          fact: Dov Reyland recorded the lead vocal alone in a sealed bay because he could not sing the second verse with the band watching.
          credits: {writers: [p_dov_reyland], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry], producer: p_ryke_alden}
        - id: s_0333
          title: Talk to the Crew, Not Me
          track_number: 5
          genre: lane-rock
          mood_tags: [wry, rowdy, fast]
          playable: true
          fact: The verse is what Bel Corrow says to anyone who asks the band to decide something the co-operative has not voted on.
          credits: {writers: [p_bel_corrow], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0334
          title: Fourteen Hours to Meridian
          track_number: 6
          genre: lane-rock
          mood_tags: [urgent, driving, fast]
          playable: true
          fact: The tempo was set by the departure timer in the hall, which the band left running through the take.
          credits: {writers: [p_dov_reyland, p_hess_vantry], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0335
          title: The Notice She Didn't Give
          track_number: 7
          genre: lane-rock
          mood_tags: [tense, warm, midtempo]
          playable: true
          fact: Una Brack sang this the morning after the members' vote that changed how backing singers were paid, with her resignation already written.
          credits: {writers: [p_una_brack, p_dov_reyland], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0336
          title: Two Bows, Neither Lent
          track_number: 8
          genre: lane-rock
          mood_tags: [bright, rowdy, fast]
          playable: true
          fact: Nessa Dray plays both fiddle parts herself, having refused to lend either bow to the guest player the co-operative had booked.
          credits: {writers: [p_ryke_alden], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, sp_nessa_dray], producer: p_ryke_alden}
        - id: s_0337
          title: Everything on the Manifest
          track_number: 9
          genre: lane-rock
          mood_tags: [blunt, driving, brisk]
          playable: true
          fact: The lyric lists what the crew was carrying on the run the record was made during, in the manifest's own order.
          credits: {writers: [p_dov_reyland, p_bel_corrow], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0338
          title: Pipes at the Turnaround
          track_number: 10
          genre: lane-rock
          mood_tags: [solemn, sustained, slow]
          playable: true
          fact: Ivena Sorn played the pipe part in a hall she had not worked in since 2600 and refused a second take once the room had settled around the instrument.
          credits: {writers: [p_dov_reyland, p_una_brack], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_una_brack, sp_ivena_sorn], producer: p_ryke_alden}
        - id: s_0339
          title: Hold Your Own Line
          track_number: 11
          genre: lane-rock
          mood_tags: [defiant, loud, fast]
          playable: true
          fact: The membership vote on the running order moved this track from last to eleventh by two votes.
          credits: {writers: [p_ryke_alden, p_hess_vantry], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack], producer: p_ryke_alden}
        - id: s_0340
          title: Wages at the End of It
          track_number: 12
          genre: lane-rock
          mood_tags: [warm, resolute, midtempo]
          playable: true
          fact: Calo Meret copied out a full arrangement and then cut it to a single sustained chord, which is what the record uses.
          credits: {writers: [p_dov_reyland, p_ryke_alden], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, p_una_brack, sp_calo_meret], producer: p_ryke_alden}

    - id: al_134
      title: One Day in Port
      band: b_061
      label: label_5
      release_year: 2619
      kind: album
      genre: lane-rock
      cornerstone: false
      notes: >-
        Turn and Burn made this across five ports in 2619 without staying anywhere longer than a
        turnaround, and it is the first of their records to use the amplification the Common Wake
        Cooperative had voted three times before it would buy — Loose Cargo had asked for the same
        rig for years and stopped working the route before the membership agreed to it. The
        membership then voted down the
        band's request to be paid by the port rather than by the record, and two of these songs come
        straight out of that. Rhea Molt has never written a set list down, so the running order here
        is simply the order the songs were finished in. It travelled further than anything the
        co-operative had issued since Burn Day Wages' last, which is where the bad feeling between
        the two bands starts.
      songs:
        - id: s_1096
          title: One Day in Port
          track_number: 1
          genre: lane-rock
          mood_tags: [driving, restless, fast]
          playable: true
          fact: Rhea Molt wrote it walking from the berth to the hall and the band played it that night without anyone else having heard it; the take on the record is from the following morning.
          credits: {writers: [p_rhea_molt], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_wyll_petrin, p_iber_tance], producer: p_cass_verrow}
        - id: s_1097
          title: Three Ballots for a Speaker
          track_number: 2
          genre: lane-rock
          mood_tags: [wry, rowdy, brisk]
          playable: true
          fact: The co-operative voted three times before it would pay for the band's amplification, and Cass Verrow's solo here is the first thing they ever played through it.
          credits: {writers: [p_cass_verrow, p_rhea_molt], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_wyll_petrin, p_iber_tance], producer: p_cass_verrow}
        - id: s_1098
          title: Paid by the Record
          track_number: 3
          genre: lane-rock
          mood_tags: [bitter, hard, fast]
          playable: true
          fact: Tem Osgar wrote it the evening the membership voted down the band's request to be paid by the port instead.
          credits: {writers: [p_tem_osgar], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_wyll_petrin, p_iber_tance], producer: p_cass_verrow}
        - id: s_1099
          title: Nothing to Unpack
          track_number: 4
          genre: lane-rock
          mood_tags: [comic, loud, fast]
          playable: true
          fact: Wyll Petrin has never carried more than one bag on a circuit, and the second verse is a list of what is in it.
          credits: {writers: [p_wyll_petrin, p_rhea_molt], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_wyll_petrin], producer: p_cass_verrow}
        - id: s_1100
          title: Berth Nineteen
          track_number: 5
          genre: lane-rock
          mood_tags: [tender, plain, slow]
          playable: true
          fact: Rhea Molt sings it to a partner who works the opposite circuit, and the two of them have been in the same port eleven times.
          credits: {writers: [p_rhea_molt], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_iber_tance], producer: p_cass_verrow}
        - id: s_1101
          title: Faster Than the Freight
          track_number: 6
          genre: lane-rock
          mood_tags: [triumphant, driving, fast]
          playable: true
          fact: Nessa Dray played the fiddle line an octave above where it was written, which Rhea Molt has said is the only change to one of her songs she has ever accepted.
          credits: {writers: [p_rhea_molt, p_cass_verrow], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_wyll_petrin, sp_nessa_dray], producer: p_cass_verrow}
        - id: s_1102
          title: Sign It on the Way Out
          track_number: 7
          genre: lane-rock
          mood_tags: [defiant, singalong, midtempo]
          playable: true
          fact: The chorus is what the band say to the co-operative's clerks, and the clerks sing it back at them at the annual meeting.
          credits: {writers: [p_rhea_molt, p_tem_osgar], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_wyll_petrin, p_iber_tance], producer: p_cass_verrow}

    - id: al_135
      title: Paid by the Port
      band: b_061
      label: label_5
      release_year: 2624
      kind: album
      genre: lane-rock
      cornerstone: false
      notes: >-
        The Common Wake Cooperative reversed its own vote of 2619 and began paying Turn and Burn by
        the port, which is where the title comes from and why the band could stay two days in three
        of these halls instead of one. Cass Verrow left a guitar at a berth on the second port and
        played the rest of the record on one bought from a stall for the price of a night's fee.
        Iber Tance is credited as a writer on a Turn and Burn record for the first time. Rhea Molt
        lost the band's long argument about set lists during it, and this is the only one of their
        records made to a written order.
      songs:
        - id: s_1103
          title: Paid by the Port
          track_number: 1
          genre: lane-rock
          mood_tags: [triumphant, driving, fast]
          playable: true
          fact: The membership reversed its own vote of 2619, and Rhea Molt sings the new wording of it in the chorus.
          credits: {writers: [p_rhea_molt, p_tem_osgar], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_wyll_petrin, p_iber_tance], producer: p_cass_verrow}
        - id: s_1104
          title: Two Days in the Same Hall
          track_number: 2
          genre: lane-rock
          mood_tags: [warm, expansive, midtempo]
          playable: true
          fact: It is the first song Turn and Burn ever played twice in one room, which the change to how they were paid is what allowed.
          credits: {writers: [p_rhea_molt], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_wyll_petrin, p_iber_tance], producer: p_cass_verrow}
        - id: s_1105
          title: Stall-Bought
          track_number: 3
          genre: lane-rock
          mood_tags: [rowdy, comic, fast]
          playable: true
          fact: Cass Verrow plays the whole session on an instrument bought from a port stall for the price of one night's fee, having left the other at a berth.
          credits: {writers: [p_cass_verrow], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_wyll_petrin], producer: p_cass_verrow}
        - id: s_1106
          title: The Written Order
          track_number: 4
          genre: lane-rock
          mood_tags: [wry, brisk, warm]
          playable: true
          fact: Rhea Molt lost the band's long argument about set lists, and the words are that argument as Tem Osgar remembers it.
          credits: {writers: [p_tem_osgar, p_rhea_molt], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_wyll_petrin, p_iber_tance], producer: p_cass_verrow}
        - id: s_1107
          title: Keys at the Back
          track_number: 5
          genre: lane-rock
          mood_tags: [heavy, building, midtempo]
          playable: true
          fact: Iber Tance is credited as a writer on one of the band's songs for the first time here, having joined them in 2614.
          credits: {writers: [p_iber_tance, p_rhea_molt], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_wyll_petrin, p_iber_tance], producer: p_cass_verrow}
        - id: s_1108
          title: Cold Circuit
          track_number: 6
          genre: lane-rock
          mood_tags: [weary, plain, slow]
          playable: true
          fact: Tem Osgar wrote it about the two ports the band's circuit stopped calling at in 2624, and names neither of them.
          credits: {writers: [p_tem_osgar], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_iber_tance], producer: p_cass_verrow}
        - id: s_1109
          title: Nobody Waits for Us
          track_number: 7
          genre: lane-rock
          mood_tags: [defiant, loud, fast]
          playable: true
          fact: Wyll Petrin plays struck alloy in place of a cymbal throughout, in a pattern copied from the co-operative's own departure schedule.
          credits: {writers: [p_wyll_petrin, p_cass_verrow], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_wyll_petrin], producer: p_cass_verrow}
        - id: s_1110
          title: Turn and Burn
          track_number: 8
          genre: lane-rock
          mood_tags: [anthemic, singalong, fast]
          playable: true
          fact: The band had been playing since 2607 and this is the first of their songs to carry their own name; Rhea Molt has said she will not write a second one.
          credits: {writers: [p_rhea_molt, p_cass_verrow], players: [p_rhea_molt, p_cass_verrow, p_tem_osgar, p_wyll_petrin, p_iber_tance], producer: p_cass_verrow}

layer_b:
  bands:
    - id: b_020
      name: Hardline Sundays
      kind: group
      home_settlement: Forge
      label: label_4
      genre: lane-rock
      active_from: 2549
      active_to: 2583
      bio: >-
        Hardline Sundays played Forge's shed halls on two unamplified guitars and were the first
        lane-rock group anyone outside Forge could name. They stopped in 2583 when their singer took
        a maintenance post and turned down every offer to come back.
      albums:
        - id: al_040
          title: First Shed Hall
          label: label_4
          release_year: 2552
          kind: album
          genre: lane-rock
          notes: The record that gave the form its whole-crew chorus, and still the one older Forge players name first.
          songs:
