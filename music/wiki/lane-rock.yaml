            - {id: s_0343, title: "Two Guitars, No Room", track_number: 3, genre: lane-rock, playable: false}
            - {id: s_0344, title: Loud Enough to Carry, track_number: 4, genre: lane-rock, playable: false}
            - {id: s_0345, title: Wages Before Dark, track_number: 5, genre: lane-rock, playable: false}
