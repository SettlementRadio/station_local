layer_a:
  bands:
    - id: b_016
      name: Second Hitch
      kind: group
      home_settlement: Cold Harbor
      label: label_2
      genre: lane-rock
      active_from: 2619
      active_to: 2626
      members:
        - id: p_wen_arbo
          name: Wen Arbo
          genre: lane-rock
          instruments: [lead vocal, rhythm composite guitar]
          active_from: 2619
          active_to: 2626
        - id: p_dessa_kelm
          name: Dessa Kelm
          genre: lane-rock
          instruments: [lead composite guitar, backing vocal]
          active_from: 2619
          active_to: 2626
        - id: p_orl_mance
          name: Orl Mance
          genre: lane-rock
          instruments: [composite bass, backing vocal]
          active_from: 2619
          active_to: 2626
        - id: p_teff_onda
          name: Teff Onda
          genre: lane-rock
          instruments: [drum kit]
          active_from: 2619
          active_to: 2626
      movement: Localist
      bio: >-
        Second Hitch are four Cold Harbor transfer-shed loaders who started playing in the bay they
        still record in. Wen Arbo writes in the words the crew actually uses on shift and throws out
        any line he would not say out loud at the gate. Harbor Standard offered them a core studio in
        2623 and the band turned it down twice, which the label now puts on the sleeve. They rehearse
        after night shift and have never played a room they could not walk home from.
      album_ids: [al_131, al_032]

    - id: b_017
      name: Pipe and Hammer
      kind: group
      home_settlement: Forge
      label: label_4
      genre: lane-rock
      active_from: 2592
      active_to: 2626
      members:
        - id: p_havel_ost
          name: Havel Ost
          genre: lane-rock
          instruments: [lead vocal, rhythm composite guitar]
          active_from: 2592
          active_to: 2626
        - id: p_juno_kerrick
          name: Juno Kerrick
          genre: lane-rock
          instruments: [resonance pipes, compact keyboards]
          active_from: 2592
          active_to: 2626
        - id: p_saul_ravik
          name: Saul Ravik
          genre: lane-rock
          instruments: [composite bass]
          active_from: 2592
          active_to: 2612
        - id: p_ade_prosk
          name: Ade Prosk
          genre: lane-rock
          instruments: [composite bass, backing vocal]
          active_from: 2612
          active_to: 2626
        - id: p_tor_dolo
          name: Tor Dolo
          genre: lane-rock
          instruments: [drum kit, struck alloy]
          active_from: 2592
          active_to: 2626
      movement:
        initial: Localist
        changed_to: Synthesist
        changed_year: 2612
        detail: >-
          Juno Kerrick amplified the resonance pipes for the first time in 2612, after Saul Ravik
          left and the band could no longer fill a hall on four unamplified players.
      bio: >-
        Pipe and Hammer have played Forge halls since 2592 and are the band the settlement's younger
        groups measure themselves against. Havel Ost sings every take standing, and refuses to record
        a song the band has not already played to a paying room. Saul Ravik left over the amplified
        pipes in 2612 and Ade Prosk has held the bass since. Juno Kerrick tunes the pipes to whatever
        hall they are in and makes the guitars follow, which is why no two of their records sit in
        the same key.
      album_ids: [al_033, al_132, al_034]

    - id: b_018
      name: Ballast Weather
      kind: group
      home_settlement: Forge
      label: label_4
      genre: lane-rock
      active_from: 2597
      active_to: 2626
      members:
        - id: p_isa_lorne
          name: Isa Lorne
          genre: lane-rock
          instruments: [lead vocal, composite guitar]
          active_from: 2597
          active_to: 2626
        - id: p_perin_dask
          name: Perin Dask
          genre: lane-rock
          instruments: [lead composite guitar]
          active_from: 2597
          active_to: 2626
        - id: p_kolm_estry
          name: Kolm Estry
          genre: lane-rock
          instruments: [composite bass, resonance pipes]
          active_from: 2597
          active_to: 2626
        - id: p_neve_atlin
          name: Neve Atlin
          genre: lane-rock
          instruments: [drum kit]
          active_from: 2597
          active_to: 2626
      movement: Synthesist
      bio: >-
        Ballast Weather have kept the same four players since 2597 and have never taken a break
        longer than a season. Isa Lorne runs the band's money herself and will not sign anything at
        the table it is offered at. Kolm Estry doubles on resonance pipes, which is the only reason
        Deep Register signed a second Forge band at all. They play the same four settlements every
        year in the same order and have said they intend to keep doing so.
      album_ids: [al_035, al_133, al_036]

    - id: b_019
      name: Burn Day Wages
      kind: group
      home_settlement: the between
      label: label_5
      genre: lane-rock
      active_from: 2596
      active_to: 2626
      members:
        - id: p_dov_reyland
          name: Dov Reyland
          genre: lane-rock
          instruments: [lead vocal, rhythm composite guitar]
          active_from: 2596
          active_to: 2626
        - id: p_ryke_alden
          name: Ryke Alden
          genre: lane-rock
          instruments: [lead composite guitar, backing vocal]
          active_from: 2596
          active_to: 2626
        - id: p_bel_corrow
          name: Bel Corrow
          genre: lane-rock
          instruments: [composite bass, backing vocal]
          active_from: 2596
          active_to: 2626
        - id: p_hess_vantry
          name: Hess Vantry
          genre: lane-rock
          instruments: [drum kit, oxygen-tank drums]
          active_from: 2596
          active_to: 2626
        - id: p_una_brack
          name: Una Brack
          genre: lane-rock
          instruments: [backing vocal, stripped-wire chimes]
          active_from: 2604
          active_to: 2626
      movement: Localist
      bio: >-
        Burn Day Wages are a hauler crew who record between runs and have been the Common Wake
        Cooperative's biggest act since 2600. Dov Reyland will not take a decision the co-operative
        has not voted on, including the running order of the records. Una Brack joined as a fifth
        voice in 2604 and nearly resigned in 2619 over how backing singers were paid. Every one of
        their records prints all its players on a single line, which was the band's condition for
        signing.
      album_ids: [al_037, al_038, al_039]

    - id: b_061
      name: Turn and Burn
      kind: group
      home_settlement: the between
      label: label_5
      genre: lane-rock
      active_from: 2607
      active_to: 2626
      members:
        - id: p_rhea_molt
          name: Rhea Molt
          genre: lane-rock
          instruments: [lead vocal, rhythm composite guitar]
          active_from: 2607
          active_to: 2626
        - id: p_cass_verrow
          name: Cass Verrow
          genre: lane-rock
          instruments: [lead composite guitar, backing vocal]
          active_from: 2607
          active_to: 2626
        - id: p_tem_osgar
          name: Tem Osgar
          genre: lane-rock
          instruments: [composite bass, backing vocal]
          active_from: 2607
          active_to: 2626
        - id: p_wyll_petrin
          name: Wyll Petrin
          genre: lane-rock
          instruments: [drum kit, struck alloy]
          active_from: 2607
          active_to: 2626
        - id: p_iber_tance
          name: Iber Tance
          genre: lane-rock
          instruments: [compact keyboards, backing vocal]
          active_from: 2614
          active_to: 2626
      movement: Synthesist
      bio: >-
        Turn and Burn are five haulers on the Common Wake Cooperative's fastest circuit and have
        never spent longer than a turnaround in a port they played. Rhea Molt decides the set on the
        walk from the berth to the hall and has never written one down. They were the first band the
        co-operative voted to buy amplification for, which took three ballots and is still brought
        up at meetings. Burn Day Wages and Turn and Burn are the co-operative's two lane-rock bands
        and have not agreed about anything since 2619.
      album_ids: [al_134, al_135]

  albums:
    - id: al_131
      title: Bay Rate
      band: b_016
      label: label_2
      release_year: 2619
      kind: EP
      genre: lane-rock
      cornerstone: false
      notes: >-
        Five songs cut in a Cold Harbor transfer shed in 2619, the year the four of them started
        playing together, on a night the bay was out of use for a door repair and nobody needed it.
        The band paid for it themselves and sold sixty copies at the gate over one winter. Harbor
        Standard bought the recording afterwards and pressed it without changing a thing, which is
        how a shed act came to be on a flagship label without ever auditioning for one. Wen Arbo has
        said the whole record cost less than a night's wages.
      songs:
        - id: s_1076
          title: Bay Rate
          track_number: 1
          genre: lane-rock
          mood_tags: [blunt, driving, fast]
          playable: true
          fact: Wen Arbo built the verse out of the four different rates the crew was paid for four different bays, which they had argued about all that week.
          credits: {writers: [p_wen_arbo], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda], producer: p_wen_arbo}
        - id: s_1077
          title: Door Out of Use
          track_number: 2
          genre: lane-rock
          mood_tags: [wry, rowdy, brisk]
          playable: true
          fact: The band only had the bay that night because its door was out of use, and the take keeps the repair crew's radio under the second verse.
          credits: {writers: [p_wen_arbo, p_orl_mance], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda], producer: p_wen_arbo}
        - id: s_1078
          title: Second Hitch
          track_number: 3
          genre: lane-rock
          mood_tags: [defiant, singalong, midtempo]
          playable: true
          fact: Dessa Kelm wrote it about being the crew called in when the first one does not turn up, and the band took their name from it rather than the other way round.
          credits: {writers: [p_dessa_kelm], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda], producer: p_wen_arbo}
        - id: s_1079
          title: Walk Home After
          track_number: 4
          genre: lane-rock
          mood_tags: [tender, plain, slow]
          playable: true
          fact: Wen Arbo wrote it about the walk back from the shed, and the band have never played a room they could not walk home from since.
          credits: {writers: [p_wen_arbo], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda], producer: p_wen_arbo}
        - id: s_1080
          title: Nobody Signed Us
          track_number: 5
          genre: lane-rock
          mood_tags: [proud, comic, fast]
          playable: true
          fact: Teff Onda counts the band in by shouting the number of copies they had money for, which was sixty.
          credits: {writers: [p_wen_arbo, p_teff_onda], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda], producer: p_wen_arbo}

    - id: al_032
      title: Nothing Loose
      band: b_016
      label: label_2
      release_year: 2624
      kind: album
      genre: lane-rock
      cornerstone: false
      notes: >-
        Second Hitch recorded over eleven nights in a cleared Cold Harbor transfer shed in 2624,
        after refusing Harbor Standard's offer of a core studio for the second time. Teff Onda broke
        a wrist two days in and played the rest of the sessions strapped. A pay dispute with the shed
        operator stopped work for one night and was settled by the band paying the fee themselves.
        The label pressed it exactly as delivered, including the shed door, and it is the record that
        made the near frontier take the band seriously. Harbor Late played the shed the week after it
        was cleared and Teff Onda has said the two nights sounded like different buildings.
      songs:
        - id: s_0266
          title: Nothing Loose
          track_number: 1
          genre: lane-rock
          mood_tags: [driving, blunt, fast]
          playable: true
          fact: Wen Arbo built the chorus out of the check the crew shouts before a bay door opens, and the band kept the counting-in shout on the take.
          credits: {writers: [p_wen_arbo], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda], producer: p_dessa_kelm}
        - id: s_0267
          title: Count Me on the Manifest
          track_number: 2
          genre: lane-rock
          mood_tags: [defiant, singalong, brisk]
          playable: true
          fact: Dessa Kelm refused to record a solo lead on a song about being listed with everybody else, so all four members sing the last chorus.
          credits: {writers: [p_wen_arbo, p_dessa_kelm], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda], producer: p_dessa_kelm}
        - id: s_0268
          title: Wrong Bay, Right Crew
          track_number: 3
          genre: lane-rock
          mood_tags: [wry, rowdy, midtempo]
          playable: true
          fact: The second verse names the four loading errors the band made during one night shift in 2623.
          credits: {writers: [p_wen_arbo, p_orl_mance], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda], producer: p_dessa_kelm}
        - id: s_0269
          title: Hold the Sheet Down
          track_number: 4
          genre: lane-rock
          mood_tags: [urgent, hard, fast]
          playable: true
          fact: Teff Onda plays the whole track with a strapped wrist, and the band declined the label's offer to bring in a session drummer.
          credits: {writers: [p_wen_arbo], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda], producer: p_dessa_kelm}
        - id: s_0270
          title: Sleep on the Ride Back
          track_number: 5
          genre: lane-rock
          mood_tags: [tired, warm, slow]
          playable: true
          fact: Sel Ardin arranged the backing voices to drop out one at a time in the order the crew usually falls asleep.
          credits: {writers: [p_wen_arbo, p_dessa_kelm], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda, sp_sel_ardin], producer: p_dessa_kelm}
        - id: s_0271
          title: Weather at the Gate
          track_number: 6
          genre: lane-rock
          mood_tags: [tense, building, midtempo]
          playable: true
          fact: The band recorded with the shed door open and the wind under the second verse was not added afterwards.
          credits: {writers: [p_wen_arbo], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda], producer: p_dessa_kelm}
        - id: s_0272
          title: You Left the Light On
          track_number: 7
          genre: lane-rock
          mood_tags: [tender, plain, midtempo]
          playable: true
          fact: Orl Mance wrote it for a partner working the opposite shift, and the band cut the guitar solo to keep it under three minutes.
          credits: {writers: [p_orl_mance], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda], producer: p_dessa_kelm}
        - id: s_0273
          title: Cheap Coffee, Loud Room
          track_number: 8
          genre: lane-rock
          mood_tags: [rowdy, comic, fast]
          playable: true
          fact: Talla Venn played the lead figure on a borrowed instrument after her own left Cold Harbor on a transfer that had already departed.
          credits: {writers: [p_wen_arbo, p_dessa_kelm], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda, sp_talla_venn], producer: p_dessa_kelm}
        - id: s_0274
          title: Twelve Hours to Say It
          track_number: 9
          genre: lane-rock
          mood_tags: [regretful, driving, brisk]
          playable: true
          fact: The lyric is the argument Wen Arbo did not have before a twelve-hour run, written down in the order he had rehearsed it.
          credits: {writers: [p_wen_arbo], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda], producer: p_dessa_kelm}
        - id: s_0275
          title: Everything Rattles
          track_number: 10
          genre: lane-rock
          mood_tags: [triumphant, loud, fast]
          playable: true
          fact: Brin Noll retuned the shed's loose panel fixings before the session so the room would rattle with the chorus instead of against it.
          credits: {writers: [p_wen_arbo, p_teff_onda], players: [p_wen_arbo, p_dessa_kelm, p_orl_mance, p_teff_onda, sp_brin_noll], producer: p_dessa_kelm}

    - id: al_033
      title: Burn Day Overtime
      band: b_017
      label: label_4
      release_year: 2594
      kind: album
      genre: lane-rock
      cornerstone: false
      notes: >-
        Deep Register funded four hundred copies so that Pipe and Hammer would have a record to sell
        at the first freight-circuit burn festival in 2594. The band were still a shed act and
        recorded in the hall they rehearsed in, over four consecutive nights, because it was the only
        time the room was free. The festival crowd learned the chorus of the title track on the first
        night and sang it back with a change the band then adopted. It sold out during the festival
        and the label has reissued it in every year it has had press time since.
      songs:
        - id: s_0276
          title: Burn Day Overtime
          track_number: 1
          genre: lane-rock
          mood_tags: [driving, celebratory, fast]
          playable: true
          fact: Havel Ost wrote it during a shift he had volunteered for and finished the second verse walking home from it.
          credits: {writers: [p_havel_ost], players: [p_havel_ost, p_juno_kerrick, p_saul_ravik, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_0277
          title: Four Hundred Copies
          track_number: 2
          genre: lane-rock
          mood_tags: [proud, wry, brisk]
          playable: true
          fact: The title is the size of the only pressing Deep Register would pay for before the festival.
          credits: {writers: [p_havel_ost, p_juno_kerrick], players: [p_havel_ost, p_juno_kerrick, p_saul_ravik, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_0278
          title: Pipes Before Sunrise
          track_number: 3
          genre: lane-rock
          mood_tags: [heavy, solemn, midtempo]
          playable: true
          fact: Ivena Sorn and Juno Kerrick played the two resonance-pipe parts in the same take, standing at opposite ends of the hall.
          credits: {writers: [p_juno_kerrick], players: [p_havel_ost, p_juno_kerrick, p_saul_ravik, p_tor_dolo, sp_ivena_sorn], producer: p_juno_kerrick}
        - id: s_0279
          title: Hold the Circuit Open
          track_number: 4
          genre: lane-rock
          mood_tags: [defiant, loud, fast]
          playable: true
          fact: The recorded chorus is the version the festival crowd sang back on the first night, not the one the band arrived with.
          credits: {writers: [p_havel_ost, p_tor_dolo], players: [p_havel_ost, p_juno_kerrick, p_saul_ravik, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_0280
          title: Whose Route Is It
          track_number: 5
          genre: lane-rock
          mood_tags: [angry, rowdy, fast]
          playable: true
          fact: Saul Ravik built the bass figure out of an argument between two crews that he had refused to take a side in.
          credits: {writers: [p_saul_ravik, p_havel_ost], players: [p_havel_ost, p_juno_kerrick, p_saul_ravik, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_0281
          title: Ash on the Windows
          track_number: 6
          genre: lane-rock
          mood_tags: [weary, warm, slow]
          playable: true
          fact: The issued take keeps a false start, because Tor Dolo's count-in landed with the hall's ventilation and the band could not repeat it.
          credits: {writers: [p_havel_ost], players: [p_havel_ost, p_juno_kerrick, p_saul_ravik, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_0282
          title: Nobody Sleeps Through It
          track_number: 7
          genre: lane-rock
          mood_tags: [rowdy, comic, fast]
          playable: true
          fact: Oren Saye played the whole track after one run-through, having discarded the chart as he does on every session.
          credits: {writers: [p_havel_ost, p_juno_kerrick], players: [p_havel_ost, p_juno_kerrick, p_tor_dolo, sp_oren_saye], producer: p_juno_kerrick}
        - id: s_0283
          title: Take the Long Way In
          track_number: 8
          genre: lane-rock
          mood_tags: [expansive, hopeful, midtempo]
          playable: true
          fact: Everyone in the hall sings the closing chorus, including the two engineers, who are credited on the sleeve by first name only.
          credits: {writers: [p_havel_ost, p_juno_kerrick, p_saul_ravik, p_tor_dolo], players: [p_havel_ost, p_juno_kerrick, p_saul_ravik, p_tor_dolo], producer: p_juno_kerrick}

    - id: al_132
      title: Four Won't Fill It
      band: b_017
      label: label_4
      release_year: 2612
      kind: album
      genre: lane-rock
      cornerstone: false
      notes: >-
        The record Pipe and Hammer made in the year Saul Ravik left over the amplified pipes and Ade
        Prosk came in on the bass. Half of it was already written when the argument started and the
        band would not go back and redo the early songs, so both bass players are on it and the
        sound changes halfway through. Deep Register wanted one name on the sleeve and Havel Ost
        refused, which is why it prints two. It sold slowly and it is still the record Forge players
        argue about, because nobody agrees which half is the better one.
      songs:
        - id: s_1081
          title: Four Won't Fill It
          track_number: 1
          genre: lane-rock
          mood_tags: [driving, defiant, fast]
          playable: true
          fact: The title is what Juno Kerrick said to the rest of the band the first night he put the resonance pipes through an amplifier.
          credits: {writers: [p_juno_kerrick, p_havel_ost], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_1082
          title: Argue It in the Hall
          track_number: 2
          genre: lane-rock
          mood_tags: [angry, hard, brisk]
          playable: true
          fact: Saul Ravik plays the bass here and it is the last song of the band's he ever played on, four days before he left over the amplification.
          credits: {writers: [p_havel_ost, p_saul_ravik], players: [p_havel_ost, p_juno_kerrick, p_saul_ravik, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_1083
          title: Whoever Stays Plays
          track_number: 3
          genre: lane-rock
          mood_tags: [wry, rowdy, midtempo]
          playable: true
          fact: Havel Ost wrote it in one sitting the week the band was down to three players, and Juno Kerrick plays the bass part on it.
          credits: {writers: [p_havel_ost], players: [p_havel_ost, p_juno_kerrick, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_1084
          title: New Hands on the Low End
          track_number: 4
          genre: lane-rock
          mood_tags: [warm, singalong, midtempo]
          playable: true
          fact: Ade Prosk learned the band's whole set in nine days and plays this one in the key Saul Ravik had written it in.
          credits: {writers: [p_havel_ost, p_juno_kerrick], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_1085
          title: Same Riff, More of It
          track_number: 5
          genre: lane-rock
          mood_tags: [heavy, loud, fast]
          playable: true
          fact: Tor Dolo refused to play any harder to keep up with the amplified pipes, and the rest of the band came down to him instead.
          credits: {writers: [p_havel_ost, p_tor_dolo], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_1086
          title: The Hall Answers Back
          track_number: 6
          genre: lane-rock
          mood_tags: [expansive, solemn, slow]
          playable: true
          fact: Ivena Sorn plays the low pipe unamplified beside Juno Kerrick's amplified one, and it is the only place on the record the two can be heard against each other.
          credits: {writers: [p_juno_kerrick], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo, sp_ivena_sorn], producer: p_juno_kerrick}
        - id: s_1087
          title: Count the Empty Seats
          track_number: 7
          genre: lane-rock
          mood_tags: [weary, blunt, midtempo]
          playable: true
          fact: Havel Ost built the lyric out of the attendance figures for the band's own halls in 2610 and 2611, which he had kept.
          credits: {writers: [p_havel_ost], players: [p_havel_ost, p_juno_kerrick, p_saul_ravik, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_1088
          title: Still the Same Four
          track_number: 8
          genre: lane-rock
          mood_tags: [resolute, warm, midtempo]
          playable: true
          fact: Saul Ravik and Ade Prosk both play the last chorus, and it is the only thing the two of them ever recorded together.
          credits: {writers: [p_havel_ost, p_juno_kerrick, p_tor_dolo], players: [p_havel_ost, p_juno_kerrick, p_saul_ravik, p_ade_prosk, p_tor_dolo], producer: p_juno_kerrick}

    - id: al_034
      title: Hammer Down the Line
      band: b_017
      label: label_4
      release_year: 2619
      kind: album
      genre: lane-rock
      cornerstone: true
      notes: >-
        Pipe and Hammer took eleven days in Forge's largest pipe hall in 2619 and came out with the
        record that fixed their reputation. Havel Ost lost his voice on the sixth day and the band
        spent two days recording beds around him rather than stop. The altered-credit dispute
        circulating that year turned an evening of the sessions into an argument about writing
        shares, which the band settled by printing every share on the sleeve. Deep Register asked for
        a shorter record on the last day and got two verses cut instead of two songs. The Long Tally
        had the hall for the fortnight before and left the pipe rig standing, which is the only
        reason eleven days were enough.
      songs:
        - id: s_0284
          title: Hammer Down the Line
          track_number: 1
          genre: lane-rock
          mood_tags: [driving, anthemic, fast]
          playable: true
          fact: The band recorded the opening riff twenty-two times and chose the second take after playing all twenty-two back in one sitting.
          credits: {writers: [p_havel_ost, p_juno_kerrick], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_0285
          title: Six Days In
          track_number: 2
          genre: lane-rock
          mood_tags: [hoarse, defiant, midtempo]
          playable: true
          fact: Havel Ost sings the whole track on the voice he had left after losing it on the sixth day of the sessions.
          credits: {writers: [p_havel_ost], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_0286
          title: Put My Name Beside It
          track_number: 3
          genre: lane-rock
          mood_tags: [angry, hard, brisk]
          playable: true
          fact: Ade Prosk wrote the verse the evening the band argued about writing shares, and it is the first song of theirs he is credited on.
          credits: {writers: [p_ade_prosk, p_havel_ost], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_0287
          title: Long Alloy
          track_number: 4
          genre: lane-rock
          mood_tags: [heavy, solemn, slow]
          playable: true
          fact: Juno Kerrick and Ivena Sorn tuned the hall's largest pipe to the room rather than to the band, and every guitar was retuned to match it.
          credits: {writers: [p_juno_kerrick], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo, sp_ivena_sorn], producer: p_juno_kerrick}
        - id: s_0288
          title: Everything Runs Hot
          track_number: 5
          genre: lane-rock
          mood_tags: [urgent, loud, fast]
          playable: true
          fact: Tor Dolo plays a cracked cymbal for the whole take because the replacement did not arrive before the hall booking ended.
          credits: {writers: [p_havel_ost, p_tor_dolo], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_0289
          title: The Shift You Don't Come Back From
          track_number: 6
          genre: lane-rock
          mood_tags: [ominous, building, midtempo]
          playable: true
          fact: The lyric was assembled from a list of near-misses the band collected from the pipe hall's own maintenance crew.
          credits: {writers: [p_havel_ost], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_0290
          title: Second Bass Player
          track_number: 7
          genre: lane-rock
          mood_tags: [wry, rowdy, brisk]
          playable: true
          fact: Ade Prosk asked for the title to be changed and the rest of the band voted to keep it.
          credits: {writers: [p_havel_ost, p_tor_dolo], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_0291
          title: Wages and Weather
          track_number: 8
          genre: lane-rock
          mood_tags: [weary, warm, midtempo]
          playable: true
          fact: Calo Meret plays the piano part with one hand so that the resonance pipes could keep the low register to themselves.
          credits: {writers: [p_havel_ost, p_juno_kerrick], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo, sp_calo_meret], producer: p_juno_kerrick}
        - id: s_0292
          title: Don't Wait Up for the Yard
          track_number: 9
          genre: lane-rock
          mood_tags: [tender, plain, slow]
          playable: true
          fact: Havel Ost recorded the vocal sitting down, which he had refused to do on any previous record.
          credits: {writers: [p_havel_ost], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_0293
          title: Straight Through Meridian
          track_number: 10
          genre: lane-rock
          mood_tags: [driving, bright, fast]
          playable: true
          fact: Two verses were cut on the last day, after Deep Register asked for a record that would fit one side of a pressing.
          credits: {writers: [p_havel_ost, p_ade_prosk], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo], producer: p_juno_kerrick}
        - id: s_0294
          title: Count the Loud Ones
          track_number: 11
          genre: lane-rock
          mood_tags: [rowdy, comic, fast]
          playable: true
          fact: Brin Noll built the percussion out of the hall's loose railing fittings, retuning them between takes.
          credits: {writers: [p_havel_ost, p_tor_dolo], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo, sp_brin_noll], producer: p_juno_kerrick}
        - id: s_0295
          title: Nothing Sounds Like That Room
          track_number: 12
          genre: lane-rock
          mood_tags: [nostalgic, expansive, midtempo]
          playable: true
          fact: Sel Ardin assembled the closing harmony from eleven separate takes sung by five different people in the hall.
          credits: {writers: [p_juno_kerrick, p_havel_ost], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo, sp_sel_ardin], producer: p_juno_kerrick}
        - id: s_0296
          title: Home on the Slow Circuit
          track_number: 13
          genre: lane-rock
          mood_tags: [warm, resolute, midtempo]
          playable: true
          fact: The final chorus is the one the band had closed every performance with since 2594 and had never put on a record.
          credits: {writers: [p_havel_ost, p_juno_kerrick, p_tor_dolo], players: [p_havel_ost, p_juno_kerrick, p_ade_prosk, p_tor_dolo], producer: p_juno_kerrick}

    - id: al_035
      title: Nothing Rides Free
      band: b_018
      label: label_4
      release_year: 2600
      kind: album
      genre: lane-rock
      cornerstone: false
      notes: >-
        Ballast Weather cut their first record in the week Forge's shipboard presses changed to the
        shared format, and chose to record to the new timing rather than wait for a slot in the old
        one. The kit arrived incomplete and Neve Atlin played a ballast plate for most of the
        sessions. The band had just lost a disputed haulage invoice, which is where the title and
        half the words came from. Deep Register expected a Forge house record and got one that mostly
        sold on the hauler routes instead.
      songs:
        - id: s_0297
          title: Nothing Rides Free
          track_number: 1
          genre: lane-rock
          mood_tags: [blunt, driving, brisk]
          playable: true
          fact: Isa Lorne took the chorus straight from the wording of a haulage invoice the band had disputed and lost.
          credits: {writers: [p_isa_lorne], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_0298
          title: Pressed in One Week
          track_number: 2
          genre: lane-rock
          mood_tags: [proud, rowdy, fast]
          playable: true
          fact: The band recorded to the new shared press timing in the week Forge adopted it, rather than wait for a slot on the old format.
          credits: {writers: [p_isa_lorne, p_kolm_estry], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_0299
          title: Ballast and Bad Coffee
          track_number: 3
          genre: lane-rock
          mood_tags: [wry, warm, midtempo]
          playable: true
          fact: Neve Atlin plays a ballast plate instead of a floor tom for the whole song, because the kit arrived without one.
          credits: {writers: [p_isa_lorne, p_neve_atlin], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_0300
          title: Where the Line Bends
          track_number: 4
          genre: lane-rock
          mood_tags: [tense, building, midtempo]
          playable: true
          fact: Perin Dask plays the lead figure a half-step against the pipes, which Kolm Estry insisted on keeping over the label's objection.
          credits: {writers: [p_perin_dask, p_kolm_estry], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_0301
          title: Say It at the Gate
          track_number: 5
          genre: lane-rock
          mood_tags: [urgent, hard, fast]
          playable: true
          fact: The lyric names the three things Isa Lorne says out loud before every shift and had never told the rest of the band about.
          credits: {writers: [p_isa_lorne], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_0302
          title: Two Bunks, One Window
          track_number: 6
          genre: lane-rock
          mood_tags: [tender, plain, slow]
          playable: true
          fact: Oren Saye remembered Isa Lorne's original key from a rehearsal two years earlier and played it back to her when she could not find it.
          credits: {writers: [p_isa_lorne], players: [p_isa_lorne, p_perin_dask, p_neve_atlin, sp_oren_saye], producer: p_isa_lorne}
        - id: s_0303
          title: Everyone Off the Deck
          track_number: 7
          genre: lane-rock
          mood_tags: [triumphant, loud, fast]
          playable: true
          fact: The buzz under the last chorus is the cracked bridge of the scarred instrument Talla Venn has been repairing between sessions since 2591.
          credits: {writers: [p_isa_lorne, p_perin_dask], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin, sp_talla_venn], producer: p_isa_lorne}

    - id: al_133
      title: The Route in Order
      band: b_018
      label: label_4
      release_year: 2619
      kind: album
      genre: lane-rock
      cornerstone: false
      notes: >-
        Ballast Weather made four of these songs in the four settlement halls they play every year,
        in the order the route takes them, and the other three in a Forge yard afterwards. Deep
        Register would only pay for four rooms and Isa Lorne paid for the yard days herself rather
        than cut a song. Perin Dask broke a string in the third hall and finished on five, and it
        is the running order, not the songs, that people talk about: it is the only one of their
        records that follows the route rather than the label's idea of a first side.
      songs:
        - id: s_1089
          title: The Route in Order
          track_number: 1
          genre: lane-rock
          mood_tags: [driving, warm, brisk]
          playable: true
          fact: The running order is the order the band's annual route visits the four settlements, and Isa Lorne refused every rearrangement Deep Register proposed.
          credits: {writers: [p_isa_lorne], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_1090
          title: First Hall of the Year
          track_number: 2
          genre: lane-rock
          mood_tags: [bright, resolute, fast]
          playable: true
          fact: Kolm Estry plays the hall's own resonance pipes rather than the band's, and Ivena Sorn spent the afternoon before it bringing them back into tune.
          credits: {writers: [p_kolm_estry, p_isa_lorne], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin, sp_ivena_sorn], producer: p_isa_lorne}
        - id: s_1091
          title: Five Strings Will Do
          track_number: 3
          genre: lane-rock
          mood_tags: [rowdy, comic, fast]
          playable: true
          fact: Perin Dask broke a string two lines in and played the rest on five, and that is the take on the record.
          credits: {writers: [p_perin_dask], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_1092
          title: Nothing Signed at the Table
          track_number: 4
          genre: lane-rock
          mood_tags: [blunt, hard, midtempo]
          playable: true
          fact: Isa Lorne wrote the verse out of what she says to anyone who puts a contract in front of her at the end of an evening.
          credits: {writers: [p_isa_lorne], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_1093
          title: Yard Days
          track_number: 5
          genre: lane-rock
          mood_tags: [weary, plain, slow]
          playable: true
          fact: Isa Lorne paid for the three days in the Forge yard out of her own money after Deep Register declined to book a fifth room.
          credits: {writers: [p_isa_lorne, p_kolm_estry], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_1094
          title: Ask the Hall Keeper
          track_number: 6
          genre: lane-rock
          mood_tags: [wry, warm, midtempo]
          playable: true
          fact: The verse is what the keeper of the second hall on the route has said to the band on arrival every year since 2600, word for word.
          credits: {writers: [p_isa_lorne, p_perin_dask], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_1095
          title: Off Season
          track_number: 7
          genre: lane-rock
          mood_tags: [reflective, sustained, slow]
          playable: true
          fact: Neve Atlin plays brushes here and nowhere else in the band's whole catalogue, at Isa Lorne's asking and after arguing against it for a week.
          credits: {writers: [p_isa_lorne], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}

    - id: al_036
      title: Slow Yard
      band: b_018
      label: label_4
      release_year: 2624
      kind: album
      genre: lane-rock
      cornerstone: false
      notes: >-
        Ballast Weather booked a Forge yard building for a season in 2624 and worked in it on the
        days it was not in use, which is why the record took longer to make than any of their others.
        Isa Lorne wanted a slower record and the band tracked most of it under the tempo they play it
        at live. A loader the band knew from the yard gate plays one of the solos. Deep Register
        released it without a single and it has outsold everything else they have made.
      songs:
        - id: s_0304
          title: Slow Yard
          track_number: 1
          genre: lane-rock
          mood_tags: [weary, heavy, slow]
          playable: true
          fact: The band tracked the whole song under the tempo they play it at live, and Isa Lorne has said it is the only recording of theirs she prefers to the performance.
          credits: {writers: [p_isa_lorne], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_0305
          title: Same Route Every Year
          track_number: 2
          genre: lane-rock
          mood_tags: [nostalgic, warm, midtempo]
          playable: true
          fact: The second verse lists the four settlements Ballast Weather have played every year since 2600, in the order the route takes them.
          credits: {writers: [p_isa_lorne, p_kolm_estry], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_0306
          title: Rust Doesn't Argue
          track_number: 3
          genre: lane-rock
          mood_tags: [blunt, driving, brisk]
          playable: true
          fact: Kolm Estry wrote the title on the back of a maintenance report and the band recorded the song before anyone had written a second verse.
          credits: {writers: [p_kolm_estry, p_isa_lorne], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_0307
          title: Give the Solo Away
          track_number: 4
          genre: lane-rock
          mood_tags: [generous, rowdy, fast]
          playable: true
          fact: Perin Dask stood down and the solo is played by a loader the band met at the yard gate, credited on the sleeve by name.
          credits: {writers: [p_perin_dask], players: [p_isa_lorne, p_kolm_estry, p_neve_atlin], producer: p_isa_lorne}
        - id: s_0308
          title: Ask Me When I'm Off
          track_number: 5
          genre: lane-rock
          mood_tags: [wry, warm, midtempo]
          playable: true
          fact: Calo Meret arrived with the arrangement copied out in full and removed most of it once the band started playing, as he does.
          credits: {writers: [p_isa_lorne], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin, sp_calo_meret], producer: p_isa_lorne}
        - id: s_0309
          title: Last Bell at the Hall
          track_number: 6
          genre: lane-rock
          mood_tags: [reflective, sustained, slow]
          playable: true
          fact: Ivena Sorn ends the track alone on the pipes and marked the tuning on her cuff, and it is the tuning the band have used ever since.
          credits: {writers: [p_kolm_estry], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin, sp_ivena_sorn], producer: p_isa_lorne}
        - id: s_0310
          title: Everything Still Moves
          track_number: 7
          genre: lane-rock
          mood_tags: [resolute, loud, fast]
          playable: true
          fact: Sel Ardin built the closing chorus around Isa Lorne's guide vocal without telling her, and the guide take is the one on the record.
          credits: {writers: [p_isa_lorne, p_perin_dask], players: [p_isa_lorne, p_perin_dask, p_kolm_estry, p_neve_atlin, sp_sel_ardin], producer: p_isa_lorne}

    - id: al_037
      title: Every Crew Signs
      band: b_019
      label: label_5
      release_year: 2600
      kind: album
      genre: lane-rock
      cornerstone: false
      notes: >-
        The Common Wake Cooperative made this the first record it sent past its own routes, using the
        shared press format adopted that year. Burn Day Wages recorded it in cargo bays at four ports
        during a single run and would not begin until the co-operative agreed to print every player
        on one line. Hess Vantry missed one session and a relief hauler played the drums on that
        track. The Wake Count were pressed in the same run and the two crews have argued ever since
        about which of them the format was bought for. It is the record that turned a crew band into
        the co-operative's biggest act.
      songs:
        - id: s_0311
          title: Every Crew Signs
          track_number: 1
          genre: lane-rock
          mood_tags: [defiant, singalong, brisk]
          playable: true
          fact: The song is about the argument that produced the band's one-line credit, which the co-operative agreed to before recording began.
          credits: {writers: [p_dov_reyland, p_bel_corrow], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry], producer: p_ryke_alden}
        - id: s_0312
          title: Beyond the Usual Lanes
          track_number: 2
          genre: lane-rock
          mood_tags: [expansive, driving, fast]
          playable: true
          fact: The second verse names the four ports the record reached first once the shared press format let it travel past the band's own route.
          credits: {writers: [p_dov_reyland], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry], producer: p_ryke_alden}
        - id: s_0313
          title: Burn Day Wages
          track_number: 3
          genre: lane-rock
          mood_tags: [celebratory, rowdy, fast]
          playable: true
          fact: The chorus is the one the crew shouted on the band's first burn day, and Dov Reyland has refused every suggestion to change a word of it.
          credits: {writers: [p_dov_reyland, p_ryke_alden], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry], producer: p_ryke_alden}
        - id: s_0314
          title: Split It Nine Ways
          track_number: 4
          genre: lane-rock
          mood_tags: [wry, warm, midtempo]
          playable: true
          fact: Bel Corrow wrote the verse as an accurate account of how the band's earnings were divided in 2600.
          credits: {writers: [p_bel_corrow], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry], producer: p_ryke_alden}
        - id: s_0315
          title: Somebody's Cousin on the Kit
          track_number: 5
          genre: lane-rock
          mood_tags: [comic, loud, fast]
          playable: true
          fact: Hess Vantry is not on this track; a relief hauler who had never recorded before plays the drums and is credited on the same line as everyone else.
          credits: {writers: [p_dov_reyland, p_hess_vantry], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow], producer: p_ryke_alden}
        - id: s_0316
          title: Fiddle on the Long Run
          track_number: 6
          genre: lane-rock
          mood_tags: [bright, rowdy, fast]
          playable: true
          fact: Nessa Dray changed the tempo halfway through the take with a look across the bay and the band followed her without stopping.
          credits: {writers: [p_ryke_alden], players: [p_dov_reyland, p_ryke_alden, p_bel_corrow, p_hess_vantry, sp_nessa_dray], producer: p_ryke_alden}
