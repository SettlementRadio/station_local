layer_c:
  recordings: none survive
  figures:
    - id: f_005
      name: Berrin Solt
      kind: shed singer
      genre: lane-rock
      active_from: 2441
      active_to: 2474
      played: shouting lead voice and struck engine plate
      history: >-
        Berrin Solt sang over the maintenance sheds of an early freight settlement between 2441 and
        2474, keeping time on a plate cut out of a scrapped engine housing. Accounts describe him
        refusing to perform anything a full shift could not learn in one hearing, and rewriting
        whatever failed that test on the spot. Lane-rock crews still call a chorus the whole room has
        by the second verse a Solt chorus.

    - id: f_006
      name: Corr Ashcart
      kind: crew leader and singer
      genre: lane-rock
      active_from: 2468
      active_to: 2499
      played: lead voice and two-string haul fiddle
      history: >-
        Corr Ashcart led a loading crew that sang its way through night work from 2468 to 2499 and
        never performed for anybody who was not working at the time. Surviving complaints from
        settlement clerks call the noise unmanageable and, in the same sentence, call the crews the
        fastest on the docks. Ashcart is still mentioned because singing the work rather than singing
        about it is the oldest habit lane-rock kept.

    - id: f_007
      name: Delia Ovrin
      kind: solo singer
      genre: lane-rock
      active_from: 2495
      active_to: 2528
      played: lead voice and struck alloy frame
      history: >-
        Delia Ovrin travelled the early freight circuits between 2495 and 2528 and sang in whichever
        bay would let her stand in it. Written notices record that she charged nothing and took a
        share of whatever the crew was paid that day, which some settlements refused to allow. The
        co-operative bands still divide their money the way Ovrin did, and say so.

    - id: f_008
      name: Matten Broe
      kind: group leader
      genre: lane-rock
      active_from: 2513
      active_to: 2546
      played: low lead voice and long alloy tubes
      history: >-
        Matten Broe led a shed group that built long alloy tubes into its arrangements from 2513 to
        2546, well before Forge made a finished instrument of them. Descriptions survive of a group
        loud enough that neighbouring workshops moved their shift times rather than argue about it.
        Broe matters because the resonance pipe's place in lane-rock starts with that group and not
        with the instrument's makers.
