layer_c:
  recordings: none survive
  figures:
    - id: f_021
      name: Ilse Corran
      kind: hall keeper and lamp signaller
      genre: pulse-dance
      active_from: 2451
      active_to: 2488
      played: hand-cranked signal lamp, no instrument
      history: >-
        Ilse Corran kept a tide-gate hall on Meridian's storm coast between 2451 and 2488 and ran
        its sealed-season nights by lamp, cranking a signal light on the beat so that a room too
        loud to hear a caller could still stay together. Nothing she did was ever recorded and the
        lamp went for scrap with the gate. She is named every time a coast band talks about holding
        a hall in time, because putting the beat in the light rather than the sound started with her
        and has never stopped.
    - id: f_022
      name: Doran Ekke
      kind: pump machinist
      genre: pulse-dance
      active_from: 2489
      active_to: 2523
      played: tide-pump machinery
      history: >-
        Doran Ekke worked the storm coast's tide pumps from 2489 to 2523 and wired a hall's lights
        to the pump stroke so that the room lit on the beat the machinery already had. Two written
        complaints from the settlement office survive and no account at all of what it sounded like.
        He matters because the coast's whole form takes its pulse off machinery that was already
        running, and he is the first person written down as having done it on purpose.
    - id: f_023
      name: Nell Varrow
      kind: caller and singer
      genre: pulse-dance
      active_from: 2510
      active_to: 2544
      played: voice and a hand drum
      history: >-
        Nell Varrow called the sealed-season nights in three storm-coast settlements between 2510
        and 2544 and is remembered for one of them, a power failure in a full hall that she carried
        for two hours on her voice and a hand drum. Nobody wrote down what she called and everybody
        on the coast has an opinion about it. She comes up whenever the machines fail out there,
        which is often, and what every band says about her is that somebody has to be able to do it
        without them.
