# Pulse-dance — written by M-11.
#
# The genre is label 3's own: 60 of Stormline Issue's 80 playable songs are here, and the house is
# described in full in this file for the first time (relay-pop named it and nothing more).
#
# Two things shape everything below:
#
# 1. **The seal.** Meridian's storm coast closes for a season every year. Nothing ships, nobody
#    leaves, and the halls run all night — which is what the form is. Every album note either
#    happens inside a seal or is arranged around one, and the 2607 anchor is this coast's own:
#    CONSTANTS.md section 1 puts the storm-coast studios reopening that year.
# 2. **The two layer-A bands disagree about export.** Cordon Hours make records for one hall in one
#    season and have refused three times to master louder for the relay; Bright Hazard make records
#    to travel and time them to leave before the seal. Stormline Issue put both on one crate sleeve
#    in 2618 with Bright Hazard's name larger, and that is the running argument the genre carries.
#    It is people and consequences rather than a philosophy seminar, which is what COMMISSION.md
#    section 2 asks for.
#
# `labels:` lists label_3 only. Layer B reaches label_1, label_6 and `unsigned`, all of which are
# already named elsewhere in the wiki, and check.py reads labels on layer-A albums only.

section:
  genre: pulse-dance
  present_year: 2626
  layers:
    played: A
    referenced: B
    historical: C

labels:
  - id: label_3
    name: Stormline Issue
    home: Meridian storm coast
    tier: standard
    status: operating
    founded_year: 2597
    genre: pulse-dance
    note: >-
      The youngest house in the catalogue and the fastest-growing. It presses on the coast, sells up
      the relay, and times its whole year to the storm calendar — nothing leaves during a seal, so
      the house either has its crates loaded by the week the coast closes or it has no year. It lost
      a season to the 2607 closures and made it back by issuing everything it had already paid for
      in one spring. Its office holds a piano nobody at the house plays, which is on more Meridian
      records than any instrument the house owns.

# From CONSTANTS.md section 2, and only inside their dates. Five of the eight fit this genre: a
# vocal arranger for a form built on hooks, two keyboard players, and two whose instruments the
# coast has no equivalent of. The seal is why several of these credits exist at all — a hired player
# caught on the coast when it closes is on the coast until it opens.
session_players:
  - id: sp_sel_ardin
    name: Sel Ardin
    instrument: backing vocals and vocal arrangement
    active_from: 2593
    active_to: 2626
    genre: pulse-dance
  - id: sp_miro_olt
