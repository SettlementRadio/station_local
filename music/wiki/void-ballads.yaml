          credits: {writers: [p_nera_ostell], players: [p_nera_ostell], producer: p_nera_ostell}

    - id: al_167
      title: Same Note All Night
      band: b_075
      label: label_2
      release_year: 2619
      kind: album
      genre: void-ballads
      cornerstone: false
      notes: >-
        Harbor Standard had been without a void ballad voice since 2612 and found this one at the
        same gate it found the last one, which the house has been teased about ever since. What
        makes the record is the box: Vantry built a thing that holds one note, the note is the tonic
        of the Station Cycles, and he printed where it came from on the back of the sleeve when
        nobody had asked him to. He did that in the year the altered-credit edition of a Pell and
        Tern recording surfaced and the whole industry spent twelve months arguing about whose name
        belonged on what, which is why a small record about a note ended up being discussed in rooms
        that do not otherwise discuss this form. The seventh song is not his. It is the one Nera
        Ostell left behind when she went out to a rota, and the house had been sitting on it for
        seven years waiting for somebody who could sing it.
