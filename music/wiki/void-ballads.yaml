# Void Ballads — written by M-14.
#
# 25 playable songs on label 2, the last genre in the wiki and the smallest layer A in it. Cold
# Harbor needed nothing — M-48 took Harbor Standard past COMMISSION.md section 5's floor already —
# so every song here is margin, and the card was free to spend all of it on the one thing this form
# has that no other form has: a record the whole settled worlds knows and the station cannot play.
#
# Four things shape everything below:
#
# 1. **The famous record is layer B and always will be.** Corin Hale is fixed canon: a lifetime on
#    one relay outpost, the Station Cycles, the life-support drone left unrepaired because it had
#    become the tonic note. Hale left the recordings to the outpost's rota under a rule the rota has
#    never bent — anybody may copy them, nobody may sell them — so no house has ever pressed them.
#    That is why they are layer B, and it is a reason a presenter can use forever.
# 2. **Both layer-A voices exist because of that.** In 2583 the Cycles went round every world and
#    Harbor Standard had a form everybody suddenly wanted and nothing it was allowed to sell. So it
#    went to the Cold Harbor relay berth and recorded the gate clerk who sang to the night traffic.
# 3. **Two solo voices, not one** (D-069). Twenty-five songs from a single artist is one texture the
#    rotation cannot separate. Nera Ostell is a low voice and a wire-strung composite guitar; Aro
#    Vantry is a high one, a hand-pumped reed organ, and a box he built to hold one note. They have
#    never met and one of them will not answer the other.
# 4. **The form is one voice and one instrument** (COMMISSION.md section 2), so this is the thinnest
#    layer A in the wiki by design. A held note underneath is the only thing allowed in, which is
#    why exactly one session player appears in the whole file.
#
# `labels:` lists label_2 alone — the whole genre sits on it. Layer B is Corin Hale and nothing
# else, per plan.yaml, and layer C is the one keeper the form comes from.
#
# **No cornerstone** (D-067): the list is full at six and the longest record here is seven songs.

section:
  genre: void-ballads
  present_year: 2626
  layers:
    played: A
    referenced: B
    historical: C

labels:
  - id: label_2
    name: Harbor Standard
    home: Cold Harbor
    tier: flagship
    status: operating
    founded_year: 2571
    genre: void-ballads
    note: >-
      Cold Harbor's own house, and the one that has to keep a quiet list beside a loud one. Harbor
      Standard was built on halls — Wire and Rosin, then The Turning Room, then Board and Bow — and
      on the lane-rock it signs off the freight gates, and it keeps Harbor Late for the hours after
      the reel halls empty. Void ballads are the smallest thing on its list and the only thing on it
      that sells the same number of copies every year. The house has been trying to press the
      Station Cycles since 2583 and has been told no by the same eleven people every time it asks.

# One name, and it is the only one the form allows in. COMMISSION.md section 2 permits a held note
# underneath a void ballad and nothing else, so a second player is either the drone or is a
# different form. Ivena Sorn plays the held note on one song in this file, in 2600, inside her dates.
session_players:
  - id: sp_ivena_sorn
    name: Ivena Sorn
    instrument: resonance pipes
    active_from: 2594
    active_to: 2626
    genre: void-ballads

layer_a:
  bands:
    - id: b_074
      name: Nera Ostell
      kind: solo
      home_settlement: Cold Harbor
      label: label_2
      genre: void-ballads
      active_from: 2578
      active_to: 2612
      members:
        - id: p_nera_ostell
          name: Nera Ostell
          genre: void-ballads
          instruments: [voice, wire-strung composite guitar]
          active_from: 2578
          active_to: 2612
      movement:
        standing: Purist
        detail: >-
          Filed Purist and has never claimed it. Everything she owns that makes a sound was made
          from what the berth threw away, which is a habit from eleven years of logging anything
          that drew power, not a position about instruments. Asked once whether she was on a side,
          she said the gate does not have sides, it has a night shift.
      bio: >-
        Nera Ostell kept a gate at the Cold Harbor relay berth from 2578 and sang to the night
        traffic because there were hours in a shift when nothing was due in and the alternative was
        the beacon. Harbor Standard came looking for her in 2583, for the plainest reason there is:
        the Station Cycles were in every room in the settled worlds that year and the house was not
        allowed to sell them, so it found a voice at a relay berth of its own. She sings low and
        close and plays one composite guitar strung with wire off the berth's scrap yard, in an open
        tuning she has never changed, and she has never sung a Corin Hale song in her life — she is
        asked every time and says no every time. In 2612 she put her name on a rota and went out to
        Ashlin Reach, and there has been no record since; the house still lists both of hers and
        still sends her the money.
      album_ids: [al_165, al_166]

    - id: b_075
      name: Aro Vantry
      kind: solo
      home_settlement: Cold Harbor
      label: label_2
      genre: void-ballads
      active_from: 2617
      active_to: 2626
      members:
        - id: p_aro_vantry
          name: Aro Vantry
          genre: void-ballads
          instruments: [voice, hand-pumped reed organ, drone box]
          active_from: 2617
          active_to: 2626
      movement:
        standing: Synthesist
        detail: >-
          Filed Synthesist for the box, which is a scrubber fan and a rank of reeds and does one
          thing: it holds a note. He says a machine that can only hold a note is not a side of an
          argument, and has stopped saying it because the filing has sold him records.
      bio: >-
        Aro Vantry sings high and thin over a hand-pumped reed organ, and under all of it sits a box
        he built to hold the tonic of the Station Cycles, which he learned off a copy somebody at
        the Cold Harbor gate had made off a copy. He is the only artist on Harbor Standard's list
        who prints where his own note came from, on every sleeve, unasked. He put his name on the
        relay rota in 2619 and has kept two watches since, which is how he came to be allowed to
        make a record at Verrin Reach, and he sends a copy of everything he makes up the road to
        Nera Ostell at Ashlin Reach. She has never answered.
      album_ids: [al_167, al_168]

  albums:
    - id: al_165
      title: Sung at the Gate
      band: b_074
      label: label_2
      release_year: 2583
      kind: album
      genre: void-ballads
      cornerstone: false
      notes: >-
        The year the complete Station Cycles reached general circulation, every house in the settled
        worlds wanted the form and one of them had it. Harbor Standard asked the rota at Verrin
        Reach for terms and was told the terms: anybody may copy them and nobody may sell them.
        Bela Roon, who ran the house's list then, went down to its own relay berth instead, on the
        word of a crew who had heard the gate clerk singing between arrivals, and made this over two
        nights in a store room off the berth with the traffic still coming in. It is a house record
        of the plainest commercial kind and it is the only one on Cold Harbor's list that names
        nobody but the person on the sleeve — Ostell played everything on it, and the generation of
        hired players that fills the rest of this catalogue had not started work. It has never been
        out of print and it has never sold quickly.
      songs:
        - id: s_1322
          title: Sung at the Gate
          track_number: 1
          genre: void-ballads
          mood_tags: [spare, low, patient]
          playable: true
          fact: She had sung this at the berth gate for four years before anybody wrote it down, and the version here is the one the night crew corrected her on — they had heard it more often than she had sung it sober.
          credits: {writers: [p_nera_ostell], players: [p_nera_ostell], producer: p_nera_ostell}
        - id: s_1323
          title: Nothing Due Till Morning
          track_number: 2
          genre: void-ballads
          mood_tags: [still, plain, wry]
          playable: true
          fact: Written on a shift with nothing due in until morning, which she says is the only kind of shift anybody writes on, and the berth's own log for that night carries the last verse in the margin.
          credits: {writers: [p_nera_ostell], players: [p_nera_ostell], producer: p_nera_ostell}
        - id: s_1324
          title: Two Crossings Out
          track_number: 3
          genre: void-ballads
          mood_tags: [distant, aching, slow]
          playable: true
          fact: About Verrin Reach, the outpost two crossings out that Corin Hale kept, and it is the nearest Nera Ostell has ever come to the Cycles — she has been asked to sing one on air four times and has said no four times.
          credits: {writers: [p_nera_ostell], players: [p_nera_ostell], producer: p_nera_ostell}
        - id: s_1325
          title: I Kept the Book
          track_number: 4
          genre: void-ballads
          mood_tags: [dry, close, steady]
          playable: true
          fact: The book is the berth's arrival log, which she kept for eleven years, and in the middle of the song she reads four lines out of a real entry — a crew short one hand, a hold opened late, and the weather.
          credits: {writers: [p_nera_ostell], players: [p_nera_ostell], producer: p_nera_ostell}
        - id: s_1326
          title: Wire Off the Yard
          track_number: 5
          genre: void-ballads
          mood_tags: [rough, warm, unhurried]
          playable: true
          fact: The guitar is strung with wire off the berth's scrap yard and she has never put a bought string on it, which is why the low course sounds like something that was doing another job first.
          credits: {writers: [p_nera_ostell], players: [p_nera_ostell], producer: p_nera_ostell}
        - id: s_1327
          title: Last One Through
          track_number: 6
          genre: void-ballads
          mood_tags: [final, quiet, tender]
          playable: true
          fact: The gate shutting behind the night's last crew is the last thing on the record, and she asked the berth to leave it running because the song is about them going and she was not going to fake it.
          credits: {writers: [p_nera_ostell], players: [p_nera_ostell], producer: p_nera_ostell}

    - id: al_166
      title: Further Than I Went
      band: b_074
      label: label_2
      release_year: 2600
      kind: album
      genre: void-ballads
      cornerstone: false
      notes: >-
        Seventeen years and one record, because Harbor Standard was busy with halls and Ostell was
        busy with a gate, and because neither of them had a reason to hurry. What made this one is
        the shared press format: from 2600 a hauler crew could carry a record off its own lane and
        have it play at the other end, and the first record went further in a year than it had gone
        in the whole time before. Ostell has still never left Cold Harbor. The whole album is about
        that — things that travel, people who do not, and what it is like to be told by strangers
        where your own voice has been. It was made in the same store room off the berth, with one
        exception the house had to argue her into, and it is the record that put the form on lanes
        that had never heard it.
      songs:
        - id: s_1328
          title: Further Than I Went
          track_number: 1
          genre: void-ballads
          mood_tags: [wondering, spare, warm]
          playable: true
          fact: The title is what she said out loud when a hauler crew told her they had heard the first record three ports past anywhere she has ever been, and she wrote the song before that crew's hold was shut.
          credits: {writers: [p_nera_ostell], players: [p_nera_ostell], producer: p_nera_ostell}
        - id: s_1329
          title: Ask the Crew Who Carried It
          track_number: 2
          genre: void-ballads
          mood_tags: [grateful, plain, rolling]
          playable: true
          fact: Two Common Wake Cooperative crews moved her first record along the lanes for nothing under the shared format, and she has printed both crew names on every sleeve since, above her own.
          credits: {writers: [p_nera_ostell], players: [p_nera_ostell], producer: p_nera_ostell}
