layer_c:
  recordings: none survive
  figures:
    - id: f_029
      name: Maren Kist
      kind: relay keeper
      genre: void-ballads
      active_from: 2461
      active_to: 2495
      played: voice, and the interval between one beacon and the next
      history: >-
        Maren Kist kept a relay through the worst of the Silence and left a written book of her
        watches, which is why she has a name at all — the keeper the worlds remember best from those
        years has none, and the Children of the Signal prefer it that way. Her book records that she
        sang the interval between one maintenance beacon and the next in order to keep the count
        without a clock, and that she went on doing it after the clock was fixed. Nothing of her
        voice survives and nobody claims it does; what survives is the practice, and every keeper
        who has sung to a machine's own note since — Corin Hale included, who is on record saying he
        got it from a book and not from an idea — is doing what a clerk did to stay awake.
