layer_b:
  bands:
    - id: b_076
      name: Corin Hale
      kind: solo
      home_settlement: Verrin Reach
      label: not for sale
      genre: void-ballads
      active_from: 2549
      active_to: 2584
      members:
        - id: p_corin_hale
          name: Corin Hale
          genre: void-ballads
          instruments: [voice, and the outpost's life support]
          active_from: 2549
          active_to: 2584
      bio: >-
        Corin Hale kept the vigil at Verrin Reach, a relay outpost two crossings out from Cold
        Harbor, for a working lifetime, and came out of it in old age with the Station Cycles — void
        ballads sung against the actual drone of the outpost's life support, which Hale would not
        have repaired because it had become the tonic note. The Cycles were left to the rota rather
        than to a house, under one rule the rota has kept ever since: anybody may copy them and
        nobody may sell them. Every house in the settled worlds has asked and every house has been
        refused, so what circulates is copies of copies, passed hand to hand along the night shift,
        and the settled worlds' most-loved record in this form is the one no station's library
        holds.
      albums:
        - id: al_169
          title: Station Cycles
          label: not for sale
          release_year: 2583
          kind: album
          genre: void-ballads
          notes: The year the complete cycles reached general circulation, and the record the whole form is measured against — never pressed by anybody, and never out of anybody's reach.
          songs:
