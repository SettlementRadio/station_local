          playable: true
          fact: The one song of hers the gate crew asked her not to put out, because they thought it made the berth sound like a place people are stuck in, and she put it out and then sang it to them.
          credits: {writers: [p_nera_ostell], players: [p_nera_ostell], producer: p_nera_ostell}
