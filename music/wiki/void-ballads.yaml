      label: label_2
      release_year: 2624
      kind: album
      genre: void-ballads
      cornerstone: false
      notes: >-
        In the year every house in the settled worlds was booking nights in Concordance's reopened
        hall, Harbor Standard paid for one crossing each way to Verrin Reach so that its quietest
        artist could sing in a store room with eleven people in it. The idea was to make the record
        against the life support Corin Hale would not let anybody repair. It was not there: the
        outpost's plant had been replaced, the note had gone with it, and the only tonic on the
        record is the box Vantry brought out with him. That is what the record is about, and the
        house — which had expected a pilgrimage and got a wake — put it out unchanged. The eleven
        keepers gave their permission on one condition, and it is printed on the back of the sleeve.
