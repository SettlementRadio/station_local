layer_c:
  recordings: none survive
  figures:
    - id: f_027
      name: Oram Selck
      kind: chamber clerk and chorus master
      genre: core-harmonies
      active_from: 2451
      active_to: 2484
      played: voice, and the direction of untrained rooms
      history: >-
        Oram Selck was a clerk in one of Concordance's council chambers between 2451 and 2484, whose
        job was reading decisions aloud so that a full room could hear them and nobody could claim
        afterwards they had not. Somewhere in those years he began having the room read the last line
        back to him together, and then having it sung, and the practice spread to every public room
        in the core within a generation. He is named whenever anybody explains why this form is
        crowds rather than choirs: he never trained a singer in his life and never turned one away,
        and the rule that anybody standing in the room may join the line is his.
    - id: f_028
      name: Ilke Marran
      kind: copyist
      genre: core-harmonies
      active_from: 2489
      active_to: 2523
      played: nothing — she wrote the parts out
      history: >-
        Ilke Marran spent thirty-four years copying vocal parts for the core's public rooms and
        invented the shape-notation that is still used for them, in which the marks show a singer
        where the line goes rather than what it is called. Not one page in her own hand survives and
        no piece of music is attributed to her at all. She is why the form belongs to people who
        cannot read music: every chorus in the core still learns from her marks, and the ensembles
        that use them mostly do not know there was a person.
