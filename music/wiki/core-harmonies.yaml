    - id: al_162
      title: Thirty-One Names
      band: b_072
      label: label_1
      release_year: 2619
      kind: album
      genre: core-harmonies
      cornerstone: false
      notes: >-
        Twelve years with no record, for two reasons that had nothing to do with each other. The
        house's position was that the first one still sold and that a flat fee for a night is not a
        thing you repeat annually. And the Long Assembly shut in 2615 for structural repairs, which
        took the ensemble's whole sound away — thirty-one voices in a small room is a mistake, not a
        style. What changed in 2619 is that the altered-credit edition of a Pell and Tern recording
        surfaced and the entire settled worlds spent the year arguing about whose name belonged on
        what. Sarra Lome asked Civic Lantern, in that year and not before it, to print the chorus by
        name; the house agreed, because in 2619 refusing would have been the story. It was made in
        the North Line transfer hall in the hours after the last connection had gone, which is the
        only room in Concordance big enough that the ensemble could have for nothing, and the sleeve
        carries thirty-one names in the order the singers were standing.
