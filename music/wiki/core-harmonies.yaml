    - id: al_163
      title: Seven Lanterns
      band: b_072
      label: label_1
      release_year: 2624
      kind: album
      genre: core-harmonies
      cornerstone: false
      notes: >-
        The Long Assembly reopened in 2624 and every house in the settled worlds booked into it.
        Civic Lantern held one night of that season and gave it to this ensemble rather than to
        Measure Kindly, who had asked for it; the house has been asked why in print and answers by
        pointing at what it was founded to press. What they sang is Lanternlight — Odessa Vail's
        cycle, the Lumen Festival's test piece, the record Civic Lantern has never once let go out of
        catalogue. Twelve movements do not fit a night, so Sarra Lome chose seven, and has never
        said anything about the five she left out. Nobody had sung the cycle in a room this size
        since Vail's own première, because there had been no room this size to sing it in, and the
        ensemble that got to do it is the one that spent six years in the upper rail of it listening
        to other people.
