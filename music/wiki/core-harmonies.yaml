# Core Harmonies — written by M-13.
#
# 20 playable songs on label 1, and the card that finishes Concordance's own house. Civic Lantern
# stood at 2 layer-A bands and 4 albums after the re-weight, one band and two albums short of the
# retrospective COMMISSION.md section 5 asks for; the three records below take it to 3 bands, 7
# albums and 65 songs.
#
# Four things shape everything here:
#
# 1. **The form is the core's grand one and the core's establishment owns it.** Civic Lantern has
#    issued Core Harmonies since before anybody working there was born, and the one record its whole
#    standing rests on is by a composer who made nothing else: Odessa Vail's Lanternlight, 2559,
#    which is fixed canon and sits in deep layer B here.
# 2. **The layer-A band came in through the cheap door.** The Standing Gallery formed in the upper
#    rail of Concordance's largest public hall, out of people who could afford to stand and not to
#    sit, and the whole of their argument with the house is about who gets named and who gets paid.
# 3. **The hall is a character.** The Long Assembly shut in 2615 for structural repairs and reopened
#    in 2624, which is that anchor's own story; the twelve years between the first record and the
#    second are the twelve years the ensemble had nowhere its sound worked.
# 4. **A later performance of Lanternlight may be layer A** (COMMISSION.md section 4). The 2624
#    record is seven of the cycle's twelve movements, sung in the reopened hall on the one night
#    Civic Lantern held of that season.
#
# `labels:` lists label_1 alone — the whole genre sits on it. Layer B is Odessa Vail and nothing
# else, because canon says she wrote one work and stopped.
#
# **No cornerstone** (D-067): the list is full at six and this card designates none.

section:
  genre: core-harmonies
  present_year: 2626
  layers:
    played: A
    referenced: B
    historical: C

labels:
  - id: label_1
    name: Civic Lantern
    home: Concordance
    tier: flagship
    status: operating
    founded_year: 2544
    genre: core-harmonies
    note: >-
      Concordance's oldest house and the one every other house is measured against, which is a thing
      it says about itself more often than anybody says it about the house. It was founded in 2544 to
      press the core's formal music and it has never stopped; its catalogue runs from Odessa Vail to
      Measure Kindly without anybody there being able to say when the second kind of record started
      outselling the first. It files Core Harmonies under civic entertainment, which is a category it
      invented and has never redefined, and until 2619 it paid a chorus a flat fee for a night and
      printed no singer's name on any sleeve. The house has been asked in print whether Lanternlight
      is a record it made or a record it was lucky enough to be handed, and its answer both times has
      been to reprint the record.

