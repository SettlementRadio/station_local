          fact: The chorus holds the closing chord until the Long Assembly's ventilation cycles, which Edrick Pol counts from the keyboard, and the issued take runs longer than the ensemble has managed on any night since.
          credits: {writers: [p_edrick_pol], players: [p_sarra_lome, p_edrick_pol, p_perra_mull, p_dovel_ashe, p_mena_thole], producer: p_edrick_pol}
        - id: s_1292
