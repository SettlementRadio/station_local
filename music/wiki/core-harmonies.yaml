          playable: true
          fact: Dovel Ashe sings it alone against the chorus in place of Mena Thole, who had asked for it a year earlier and handed it to him the week a crew her brother was on failed to make the port.
          credits: {writers: [p_odessa_vail], players: [p_sarra_lome, p_edrick_pol, p_perra_mull, p_dovel_ashe, p_mena_thole, p_tovan_reck], producer: p_sarra_lome}
