      active_from: 2542
      active_to: 2561
      members:
        - id: p_odessa_vail
          name: Odessa Vail
          genre: core-harmonies
          instruments: [composition, voice]
          active_from: 2542
          active_to: 2561
      bio: >-
        Odessa Vail wrote one towering work and then, so far as any record shows, stopped: Lanternlight,
        the Core Harmony cycle made for a Lumen Festival, which became the festival's test piece and
        has never been out of Civic Lantern's catalogue since. The silence afterwards is argued in
        every music programme the core has ever run — perfection reached, nerve lost, or a second
        cycle sent by relay to somebody on the frontier and never received — and it is where the
        worlds' phrase for a finished artist comes from, that they went to the lanterns.
      albums:
