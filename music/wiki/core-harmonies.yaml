          mood_tags: [grand, warm, rising]
          playable: true
          fact: Sarra Lome will not begin until the standing rail is full, and on the night this was made the hall waited eleven minutes for her, which the hall's keeper timed and entered in the room's own book.
          credits: {writers: [p_sarra_lome, p_edrick_pol], players: [p_sarra_lome, p_edrick_pol, p_perra_mull, p_dovel_ashe, p_mena_thole], producer: p_edrick_pol}
        - id: s_1291
