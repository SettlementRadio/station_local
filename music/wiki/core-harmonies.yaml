      movement:
        standing: Synthesist
        detail: >-
          Edrick Pol plays the core's own keyboard instrument and has been filed as a Synthesist for
          it since the ensemble's first record, which he answers by pointing out that the thing has
          been in Concordance's rooms longer than the argument has existed and that it belongs to the
          hall rather than to a side. Sarra Lome has never given a position at all. What the ensemble
          argues about in public is money and credit, not instruments.
      bio: >-
        The Standing Gallery are thirty-one voices and formed in 2601 in the upper rail of the Long
        Assembly, Concordance's largest public hall, out of people who came to other acts' concerts
        because the standing rail cost a tenth of a seat. They sang after the seats emptied, while
        the hall staff stacked, and were doing it for six years before anybody put them on a bill.
        Sarra Lome directs and sings the lead and will not start a piece until the rail is full,
        which on one recorded night meant the whole hall waiting eleven minutes for her. Perra Mull
        writes every part out by hand for singers who do not read music, in a shape-notation that has
        been in the core's public rooms for two hundred years. The ensemble has one long argument
        with its house and it is not about music: until 2619 no singer's name was printed on any
        record of the form, and Civic Lantern paid a chorus a flat fee for a night and its hired
        players by the hour.
      album_ids: [al_161, al_162, al_163]

  albums:
    - id: al_161
      title: Nobody Sat Down
      band: b_072
      label: label_1
      release_year: 2607
      kind: album
      genre: core-harmonies
      cornerstone: false
      notes: >-
        Civic Lantern did not go looking for this ensemble. What happened in 2607 is that Open
        Parallax had the Long Assembly booked for a week and finished two days early, the hall was
        paid for either way, and somebody at the house remembered that a chorus had been singing in
        the upper rail after concerts for six years and could be had for the price of the night. So
        the record was made in the room the ensemble already knew, by people who had never been on
        its floor, in two days that belonged to somebody else. The house filed it under civic
        entertainment, paid a flat fee for the night, printed the ensemble's name and the director's
        and nobody else's, and considered the matter settled for the next twelve years. It sold
        steadily and quietly for a decade and is the record that made the form current again in the
        core, which Civic Lantern has taken credit for in print and Sarra Lome has never contested.
      songs:
