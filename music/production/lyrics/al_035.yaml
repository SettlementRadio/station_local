  - id: s_0301
    title: Say It at the Gate
    track_number: 5
    mood: [urgent, hard, fast]
    fact: >-
      The lyric names the three things Isa Lorne says out loud before every shift and had never told
      the rest of the band about.
    arrangement_note: the three things are the only lines in the song that stop dead with the band silent behind them, and everything else runs without a gap anywhere
    intro: 4
    outro: cold
    target_duration: "3:50"
    prompt: >-
      Even mid-tempo heartland rock at its fastest, 134 BPM, urgent and hard, fast. Female lead
      vocal, warm mid alto, level and unhurried, plain diction, ending lines flat rather than
      lifting them, never belting. No backing vocal of any kind anywhere; the second guitar answers
      in the chorus gaps only and stays silent behind the three stopped lines. Two bright thin-toned electric guitars hard
      apart, electric bass, resonance pipes doubling the bass under the chorus with a deep alloy
      organ tone, drum kit. Tracked live on a shop floor, steady unhurried drums, light compression,
      no reverb of any size. Three single lines where the whole band stops dead behind the voice and
      no gap anywhere else in the song. Four seconds of drums alone before the first sung word. Cold
      stop.
    exclude: backing vocals of any kind, group or shouted choruses, synthesizers, electronic drums, brass, orchestral strings, stadium reverb, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 4 seconds, drums alone, no vocal]

      [Verse 1]
      I have done the same three things at the same gate for eleven years
      and I have never told anybody in this band that I do them,
      and they are not a superstition, or if they are I do not care,
      and saying them here means three other people know them now.

      [Chorus]
      Say it at the gate. Out loud. Every time.
      Not in your head, because your head does not count,
      and not in the yard afterwards when it is over,
      at the gate, before, where somebody could hear you.

      [Verse 2 - band stopping dead behind each line]
      One. I know exactly what is in this hold.
      Two. I know who is behind me and what they are doing.
      Three. If it goes wrong today it will not be because I was quick.

      [Chorus]
      Say it at the gate. Out loud. Every time.
      Not in your head, because your head does not count,
      and not in the yard afterwards when it is over,
      at the gate, before, where somebody could hear you.

      [Verse 3]
      My mother worked a scrubber line for twenty-two years
      and had two of them, and never told me what they were,
      and I found out from a woman on her crew after she stopped
      and I have wished every day since that I had asked her myself.

      [Verse 4]
      So here are mine, all three, in the order that I say them,
      and now the four of us are stuck with them at every gate,
      and Neve has started saying the second one under her breath,
      and I have not mentioned it and I am not going to.

      [Final Chorus]
      Say it at the gate. Out loud. Every time.
      Not in your head, because your head does not count.
      Somebody said it to me once and I have never stopped,
      and that is the whole of what I have got to pass on.

      [Outro - cold stop]
