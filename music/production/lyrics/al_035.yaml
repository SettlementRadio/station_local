      [Verse 1]
      Two bunks and one window and the window is above his,
      which we did not decide, it was how the berth came,
      and for the first month I said nothing about it at all
      and then one morning I said it and he swapped that afternoon.

      [Verse 2]
      There is a thing that happens in a berth that size
      where you learn somebody's whole day from how they take their coat off,
      and after about a year you stop needing to ask
      and after about two you have to start asking again on purpose.

      [Chorus]
      Two bunks and one window and a settlement out of it
      that neither of us has been able to leave or wanted to.
      It is small. I know it is small. People say so.
      They say it kindly and they have not been in it.

      [Verse 3]
      I lost the key of this one somewhere between writing it
      and standing in a room with three people waiting for me,
      and a man I had met twice played four notes back on the upright
      from a rehearsal two years earlier that I had forgotten.

      [Chorus]
      Two bunks and one window and a settlement out of it
      that neither of us has been able to leave or wanted to.
      It is small. I know it is small. People say so.
      They say it kindly and they have not been in it.

      [Verse 4]
      He keeps every singer's original key and no charts at all
      and could not tell you how he does it if you asked him,
      and he was in the room for one afternoon in the whole of that year
      and it is his low end holding this song up.

      [Final Chorus]
      Two bunks and one window and a settlement out of it,
      and a song that was nearly lost and came back in the right key.
      The window is above mine now and has been for years,
      and I still wake up and look at where it used to be.

      [Outro - fade on the upright bass]
