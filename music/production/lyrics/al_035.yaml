  - id: s_0298
    title: Pressed in One Week
    track_number: 2
    mood: [proud, rowdy, fast]
    fact: >-
      The band recorded to the new shared press timing in the week Forge adopted it, rather than
      wait for a slot on the old format.
    arrangement_note: the whole song is played to a fixed length rather than to an arrangement, so it stops where it stops, and the last chorus is cut off by the ending rather than resolving into it
    intro: 5
    outro: cold
    target_duration: "3:50"
    prompt: >-
      Even mid-tempo heartland rock at its fastest, 136 BPM, proud and rowdy, fast. Female lead
      vocal, warm mid alto, level and unhurried, plain diction, ending lines flat rather than
      lifting them, never belting. No backing vocal of any kind anywhere; the second guitar answers
      only the ends of chorus phrases with short figures and leaves the verses open. Two bright thin-toned electric guitars hard
      apart, electric bass, resonance pipes doubling the bass under the chorus with a deep alloy
      organ tone, drum kit. Tracked live on a shop floor, steady unhurried drums, light compression,
      no reverb of any size. The fixed running time cuts the final chorus off immediately after its
      third line, on the bar, with a cold stop and no fade. Five seconds of drums and one guitar
      before the first sung word.
    exclude: backing vocals of any kind, group or shouted choruses, synthesizers, electronic drums, brass, orchestral strings, stadium reverb, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 5 seconds, drums and one guitar, no vocal]

      [Verse 1]
      They changed the format on the Monday and the whole settlement
      spent the week arguing about it in the way that Forge argues,
      which is quietly, at length, and mostly about the timing,
      and by the Friday every press in the place had turned over.

      [Verse 2]
      Two ways to go. Wait nine months for a slot on the old one,
      or be in a room by Wednesday with a record that is not finished.
      I said Wednesday before anybody had asked for a vote
      and nobody argued, which is how I know they had all decided too.

      [Chorus]
      Six days. One room. Whatever we have got by then.
      There is no version of this where we come back in the spring.
      Bad first records get made. Good first records get planned
      and half of them never happen, and I have watched that twice.

      [Verse 3]
      So it is short and it is fast and two of the endings are wrong
      and one of them is on this song and you have not got to it yet,
      and it is out, and it exists, and people bought it,
      and the one we would have made in the spring does not.

      [Chorus]
      Six days. One room. Whatever we have got by then.
      There is no version of this where we come back in the spring.
      Bad first records get made. Good first records get planned
      and half of them never happen, and I have watched that twice.

      [Bridge]
      Somebody's shipboard press was running the whole of that week
      and every hauler out of Forge had a crate on it by the Sunday.

      [Final Chorus - cut off by the ending]
      Six days. One room. Whatever we have got by then.
      There is no version of this where we come back in the spring.
      Bad first records get made and this is one of them—

      [Outro - immediate cold cut on the fixed bar, no fade]
