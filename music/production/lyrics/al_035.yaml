    exclude: backing vocals of any kind, group or shouted choruses, synthesizers, electronic drums, brass, orchestral strings, stadium reverb, vocal tuning, whispered or rapped sections, dance and electronic production, random out-of-tune playing
    lyrics: |
      [Intro - 16 seconds, pipes and guitar refusing each other, no vocal]

      [Verse 1]
      There is a bend on the near lane about two hours out
      where the road stops going where it looks like it is going
      and every new hauler pilot takes it too fast once
      and every old one still slows down without deciding to.

      [Verse 2]
      A man from the label sat on the shop floor with his hands together
      and said, very reasonably, that one of the two was wrong,
      and Kolm said no, both of them are right, that is the point,
      and did not explain any further, and we kept it.

      [Chorus]
      It is where that line bends that you find out about a person.
      Not the long straight. Anybody is fine on the long straight.
      The bend, in the dark, in the fourth hour, on your own,
      with nothing coming the other way to tell you where it is.

      [Instrumental - lead guitar against the pipes, nothing else, 14 seconds]

      [Verse 3]
      I have been in the cab beside people who took it beautifully
      and beside one who took it badly and was never told,
      because it went fine, and the fine ones are the frightening ones,
      and I have not been in a cab with him since and I have not said why.

      [Chorus]
      It is where that line bends that you find out about a person.
      Not the long straight. Anybody is fine on the long straight.
      The bend, in the dark, in the fourth hour, on your own,
      with nothing coming the other way to tell you where it is.

      [Bridge]
      Two notes that will not agree, held for four minutes.
      The label wanted one of them gone. It is the whole song.

      [Final Chorus]
      It is where that line bends that you find out about a person,
      and about a band, and about which of them will not move.
      He has been right about one thing in all the years I have known him.
      It is this, and he has never mentioned it since.

      [Outro - held chord, both still there]
