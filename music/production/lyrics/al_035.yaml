    prompt: >-
      Even mid-tempo heartland rock, 112 BPM, tense and building, midtempo. Female lead vocal, warm
      mid alto, level and unhurried, plain diction, ending lines flat rather than lifting them,
      never belting. No backing vocal of any kind anywhere; the second guitar leaves the verses open
      and answers only the final chorus line. Two bright thin-toned electric guitars hard apart. In
      the intro and choruses, the lead figure makes a deliberate short half-step rub against the
      resonance pipes; the verses are firmly tonal, and neither part sounds accidentally out of
      tune. Electric bass, resonance pipes doubling the bass under the chorus with a deep alloy
      organ tone, drum kit. Tracked live on a shop floor, steady unhurried drums, light compression,
      no reverb of any size. A fourteen-second lead guitar break against the pipes with nothing else
