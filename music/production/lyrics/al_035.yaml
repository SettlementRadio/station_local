    lyrics: |
      [Intro - 12 seconds, both guitars and the pipe tone, no vocal]

      [Verse 1]
      It is four pages and the fourth one is the only one that matters
      and the fourth one has a paragraph at the bottom of it
      that I have read about ninety times since the spring
      and it says the same thing every time I read it.
      One hold, one lane, one delay that was not ours,
      and a number at the bottom with our name under it.

      [Chorus]
      Nothing rides free. Nothing has ever ridden free.
      Carriage, handling, storage, and a charge for the delay
      that was caused by the storage that we did not ask for.
      Somebody wrote that down and somebody signed it.

      [Verse 2]
      We took it to two people and both of them were sorry
      and neither of them was sorry enough to move a number,
      and the second one said, kindly, that we should read things,
      which is the most expensive sentence anybody has said to me.

      [Chorus]
      Nothing rides free. Nothing has ever ridden free.
      Carriage, handling, storage, and a charge for the delay
      that was caused by the storage that we did not ask for.
      Somebody wrote that down and somebody signed it.

      [Verse 3]
      So I put the paragraph in a song, word for word,
      which is the only thing I have ever got back out of it,
      and it scans, which tells you something about the person who wrote it,
      and I hope they hear it and I hope they know it is theirs,
      and I hope it is playing in an office somewhere on the day
      that somebody hands them four pages of their own.

      [Bridge]
      I am not owed anything. I signed it. I read it after.
      That is the lesson and it cost about a season's work.

      [Final Chorus]
      Nothing rides free. Nothing has ever ridden free.
      Not the cargo, not the room, not the hour it sat there.
      Read the fourth page. Read it at the table.
      Do not read it at home on a Thursday like I did.

      [Outro - cold stop]
