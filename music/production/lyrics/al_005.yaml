album:
  id: al_005
  title: Pressure Weather
  band: b_003
  band_name: Rain Ledger
  label: label_3
  release_year: 2607
  genre: relay-pop
  cornerstone: false
  song_count: 10
  style_card: b_003
  room: >-
    The wiki puts this record in two rooms and neither of them was booked for it: a small concrete
    storm-shelter room on the Meridian coast, and a repair depot the band moved to whenever the
    power allotment came back on. Stormline Issue paid for portable storage and not for room time,
    so several vocals were sung beside working crews. The style card's "dry verses opening into a
    wide reverberant chorus" is therefore literal here — the verses are the shelter room and the
    choruses are the depot's metal space. Voice remains untouched. Two fact-bound session
    exceptions are explicit rather than silent: Talla Venn's guest composite guitar on s_0053 and
    the whole-band replacement answer on s_0054. Neither changes the band's line-up or base sound;
    all other backing, instruments and exclusions remain fixed.

