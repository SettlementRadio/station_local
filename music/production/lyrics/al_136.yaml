  - id: s_1115
    title: Every Tune Twice
    track_number: 5
    mood: [rolling, generous, midtempo]
    fact: >-
      Dane Verrow announces the repeat before it arrives because the floor had already asked for the
      tune twice that night.
    arrangement_note: the singer says out loud, over the band and before it happens, that the tune is about to go round again, which is a thing said at a dance and not on a record, and the pipes take the break in the repeat rather than in the first pass
    intro: 12
    outro: fade
    target_duration: "4:30"
    prompt: >-
      146 BPM rolling live reel; dry male tenor, spoken repeat call, amplified pipe break, hot hall fade.
    exclude: sung harmony, backing vocals, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, clean studio recording, cold ending
    lyrics: |
      [Intro - pipes and fiddle, twelve seconds]

      [Verse 1]
      They called for it at nine before the coats were stacked.
      We gave it once; the west-side line took every turn too fast.
      At quarter past ten, the same request came from the loading deck,
      boots striking out the opening before we answered yes.
      Bree looked at Toller. Toller looked at Orsa's pipe rack.
      I held the fiddle high and waited till the floor came quiet.
      A repeat works better when the whole room hears it coming.

      [Announcement - spoken plainly over the band]
      Right. Same one. Round again. Get yourselves back out.

      [Chorus]
      Every tune twice if the floor asks twice,
      first for the ones already up, then those along the wall.
      Every tune twice if four hundred boots insist.
      Round again, but let the second one belong to someone else.

      [Verse 2]
      Orsa hates a repeat and never once plays it lazily.
      He opens both low valves and makes the first bar twice its size.
      Bree shifts the count ahead; Toller shortens every landing.
      I trade the fiddle line for something rougher at the gate.
      The early dancers lean against the wall and catch their breath.
      Night-shift couples take the places they left warm.
      Four hundred people change the floor without a caller.

      [Instrumental - pipes take the break in the repeat, eighteen seconds]

      [Verse 3]
      The second pass is never the same as the first one.
      It runs quicker because everybody knows the shape.
      Someone near the bench adds one hard stamp before the chorus.
      The whole near corner answers and the timing bends around it.
      Orsa takes the break he would not take the first time through.
      Amplified pipes hold high while coats slide down the wall.
      By the final turn, both halves of the settlement meet in one long line.

      [Chorus]
      Every tune twice if the floor asks twice,
      first for the ones already up, then those along the wall.
      Every tune twice if four hundred boots insist.
      Round again, but let the second one belong to someone else.

      [Final Chorus - pipes answering the vocal line]
      Every tune twice if the floor asks twice.
      The bench-side line is up; the west-side line sits down.
      Orsa holds the break and Bree drives through the answer.
      Round again. The money waits beneath the lamp.

      [Outro - fade]
