songs:
  - id: s_1111
    title: Ask the Whole Shop
    track_number: 1
    mood: [fast, communal, bright]
    fact: >-
      Dane Verrow shouts the first line as a question and the hall answers it, which is how the band
      opened every dance it ever played and never once did on a record.
    arrangement_note: the first line is shouted flat as a question with no music under it and a hall full of people shouts an answer back, which is how this band opened a dance for twenty years and had never been recorded doing
    intro: 10
    outro: cold
    target_duration: "4:00"
    prompt: >-
      164 BPM live reel; dry male tenor, shouted hall response, amplified pipes, hot floor, cold stop.
    exclude: sung harmony, backing vocals, vocal stacking, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, clean studio recording, fade-out
    lyrics: |
      [Intro - band, ten seconds]

      [Call and Answer - shouted flat, no music, the hall answers]
      Is the whole shop in?
      THE WHOLE SHOP IS IN.

      [Verse 1]
      Four hundred people push their work coats toward the wall.
      Late-shift boots come black with grease from Forge's loading deck.
      The queue still runs outside beneath the settlement lamps.
      Inside, Bree has both sticks raised and Orsa holds one valve.
      I ask the only question loud enough to cross the hall.
      One answer hits the rafters, shakes the water from the pipes,
      and every separate body turns into a single floor.

      [Chorus]
      Ask them. Ask them out loud and wait for it.
      Let the last word land before the fiddle takes the room.
      Half came straight from shift with supper in their pockets.
      Half came off a hauler at the loading deck.
      Ask once, hear the roof move, then count four and go.

      [Verse 2]
      The man beside the back door gives his answer early.
      Eleven years of doing that; eleven years of being wrong.
      Everybody hears him. Nobody turns to shame him.
      Near the front, one woman keeps her whole mouth closed.
      She sets her feet before the count and never misses once.
      When the early man runs out of breath, she is still turning,
      sleeves rolled above both elbows, heel hard on the boards.

      [Call and Answer - shouted flat, no music, the hall answers]
      Is the whole shop in?
      THE WHOLE SHOP IS IN.

      [Verse 3]
      By the second turn, the nearest wall has started sweating.
      Someone shouts, "Kill the heat," and someone answers, "Find the valve."
      Four hundred workers bring enough warmth off their shifts.
      Coats pile higher; condensation runs behind the bench.
      Orsa's amplified pipes hold one note above the complaints.
      Bree drives faster just to make the whole thing worse.
      The silent woman laughs and dances harder through the steam.

      [Final Chorus - pipes answering the vocal line]
      Ask them. Ask them out loud and wait for it,
      and then go, and do not stop until somebody makes you.
      Half of them came here straight off a shift at four.
      Throw the doors wide. It is only getting worse.
      Ask once, hear the whole roof answer, count four and go.

      [Outro - cold stop]
