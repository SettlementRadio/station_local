  - id: s_1114
    title: Three Halls in a Week
    track_number: 4
    mood: [driving, tired, bright]
    fact: >-
      The band played three different Forge halls in one week in 2596 and this is the third of them,
      with Orsa Lipp's pipes still tuned for the second.
    arrangement_note: the pipes are audibly in the wrong key for this hall because they are still tuned for the previous one and there was no time to change them, so the fiddle spends the whole track working around them
    intro: 8
    outro: fade
    target_duration: "3:55"
    prompt: >-
      160 BPM tired live reel; dry male tenor, mistuned pipes, fiddle works around them, hot hall fade.
    exclude: sung harmony, backing vocals, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, clean studio recording, corrected tuning, cold ending
    lyrics: |
      [Intro - band, eight seconds]

      [Verse 1]
      Monday at the west hall, Thursday by the loading deck,
      Saturday in here with morning shift still on our hands.
      Eleven pipes went on the cart and off the cart three times,
      ninety minutes at each door to lift the rack and test the valves.
      The rota gave us supper once and missed the last ferry twice.
      Orsa tied the Thursday tuning down and pushed the cart again.
      Saturday began before he found the wrench to change it.

      [Chorus]
      Three halls in a week and the cart between the halls
      and a shift in the morning after every one of them.
      Boots at six, coats at seven, fiddle up at nine.
      We are here because a Saturday still needs a Saturday.

      [Verse 2]
      Orsa's first long note sits Thursday-flat against the room.
      I keep my eyes upon the bow and find a space beside it.
      Every second turn, the fiddle climbs where no chart sends it,
      halfway between the hall's clean pitch and what the pipes can give.
      Bree hears the gap and drives the struck alloy through it.
      Toller plants the low end where both tunings have to meet.
      By the chorus, half of Forge is dancing on the fault.

      [Verse 3]
      There is a woman on the floor tonight who was at all three.
      Same coat. Same place, about a third of the way back.
      Monday she walked the west hall figure without a partner.
      Thursday she came straight from shift and kept the same work boots.
      Tonight she hears the wrong-key pipes and takes the turn unchanged.
      Four years beside our floor and never one word at the gate.
      Bree sees her from the kit and lifts one stick in greeting.
      The woman lifts one hand, then pulls her partner through the gap.

      [Chorus]
      Three halls in a week and the cart between the halls
      and a shift in the morning after every one of them.
      Boots at six, coats at seven, fiddle up at nine.
      We are here because a Saturday still needs a Saturday.

      [Final Chorus - pipes answering the vocal line, still in the wrong key]
      Three halls in a week and the cart is at the door,
      and the pipes go back on the rack before the whistle.
      The woman in the same coat finds the long step through it.
      Saturday is here. Thursday's key will have to do.

      [Outro - fade]
