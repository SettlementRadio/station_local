  - id: s_1111
    title: Ask the Whole Shop
    track_number: 1
    mood: [fast, communal, bright]
    fact: >-
      Dane Verrow shouts the first line as a question and the hall answers it, which is how the band
      opened every dance it ever played and never once did on a record.
    arrangement_note: the first line is shouted flat as a question with no music under it and a hall full of people shouts an answer back, which is how this band opened a dance for twenty years and had never been recorded doing
    intro: 10
    outro: cold
    target_duration: "4:00"
    prompt: >-
      Jump blues and reel tempos, 164 BPM, fast and bright, communal. Male lead vocal, dry mid tenor,
      flat and matter-of-fact, clipping the ends of lines, singing against the fiddle he is playing
      himself, shouting rather than singing at the top. No sung harmony or backing vocal of any kind
      anywhere. A large untrained crowd in a hall shouts a spoken answer back at him twice — a shout,
      ragged and unpitched, never a sung harmony line. Amplified resonance pipes, composite fiddle,
      upright bass, cut-stock kit and struck alloy. Recorded live in a hot crowded dance hall on
      equipment that was not made for it: rough, loud, slightly distorted, the floor and the room very
      present. Ten seconds of band before the first sung word. Cold stop.
    exclude: sung harmony, backing vocals, vocal stacking, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, clean studio recording, fade-out
    lyrics: |
      [Intro - band, ten seconds]

      [Call and Answer - shouted flat, no music, the hall answers]
      Is the whole shop in?
      THE WHOLE SHOP IS IN.

      [Verse 1]
      That is how you start a dance and it is not a trick.
      You ask the room a question that the room can answer,
      and once four hundred people have said one thing together
      they are a floor, and before that they were a queue.
      We have done it in every hall in this settlement
      and we have never once done it in front of a machine.

      [Chorus]
      Ask them. Ask them out loud and wait for it.
      Do not start playing over the top of the answer.
      Half of them came here straight off a shift at four
      and half the rest came off a hauler at the loading deck.

      [Verse 2]
      There is a man at the back who does the answer early.
      There is always a man at the back who does the answer early.
      He has been coming to these for eleven years, that man,
      and he thinks nobody has noticed, and everybody has.
      There is a woman near the front who never says it at all
      and dances harder than anybody in the building.

      [Call and Answer - shouted flat, no music, the hall answers]
      Is the whole shop in?
      THE WHOLE SHOP IS IN.

      [Verse 3]
      It is too hot in here. It is always too hot in here.
      They have got the heat on for a room that was half this size
      and four hundred people off a late shift generate their own,
      and by the second tune there is water running down the wall.
      You can hear them complaining about it on this recording.
      They complained about it every week for twenty years.

      [Final Chorus - pipes answering the vocal line]
      Ask them. Ask them out loud and wait for it,
      and then go, and do not stop until somebody makes you.
      Half of them came here straight off a shift at four.
      Take your coats off. It is going to get worse.

      [Outro - cold stop]
