  - id: s_1116
    title: Pay Us in Order
    track_number: 6
    mood: [blunt, midtempo, hard]
    fact: >-
      Toller Grange sings the second verse, the only time he sang anything in front of an audience,
      having lost an argument about which of them would.
    arrangement_note: the bass player sings the second verse and the usual singer does not sing on it at all, and the difference between the two voices is the whole point of the track rather than something to be smoothed out
    intro: 5
    outro: cold
    target_duration: "3:45"
    prompt: >-
      140 BPM blunt live reel; dry male tenor, rough bass-player verse two, amplified pipes, cold stop.
    exclude: sung harmony, backing vocals, vocal blending, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, clean studio recording, fade-out
    lyrics: |
      [Intro - band, five seconds]

      [Verse 1]
      Four bands took the yard hall through the festival week.
      Three found money on the bench; the fourth found someone's promise.
      That fourth crew left Tuesday on a nine-day freight run.
      When they came back, the keeper's room was stripped and dark.
      We had our coins already, every one beneath the lamp.
      That is why we took their list and brought it here tonight.
      Fairness spoken after payment still has work to do.

      [Chorus]
      Pay us in order. Pay us in the order that we played.
      Not the loudest, not the last, not whoever is still standing.
      There is a list at that door with four names on it
      and the list is the list and it goes in order.

      [Verse 2 - a different, lower voice; the lead does not sing]
      I keep the names because the rest of them lose paper.
      Four names at the door mean first through fourth, not maybe.
      First band lifts the first coins; second follows second.
      If the bench runs short, say so before the cases open.
      A list is a manifest. That is all a list is.
      Cargo loads in order and the pay comes back in order.
      A promise cannot catch a crew once it has cleared the berth.

      [Chorus]
      Pay us in order. Pay us in the order that we played.
      Not the loudest, not the last, not whoever is still standing.
      There is a list at that door with four names on it
      and the list is the list and it goes in order.

      [Verse 3]
      Toller reaches the last word half a beat behind us.
      He steps back to the bass like passing through his own front door.
      Someone by the loading wall shouts, "Read the list again."
      He lowers both eyes and plants the next low note instead.
      Before next Saturday, two hall keepers mark their benches:
      four chalk lines for four bands, four envelopes in order.
      Two doors out of all of Forge is two doors better than before.

      [Final Chorus - pipes answering the vocal line]
      Pay us in order. Pay us in the order that we played,
      and if there is not enough, say so at the start.
      There is a list at that door with four names on it,
      and Toller's back behind the bass, holding down the floor.
      First name first. Last name last. No promises at the berth.

      [Outro - cold stop]
