  - id: s_1112
    title: Hollan's Reel
    track_number: 2
    mood: [hard, fast, defiant]
    fact: >-
      Bree Hollan wrote it and would not let the band play it in front of the supervisor it is about,
      so it was only ever played at dances he did not attend.
    arrangement_note: the drummer wrote it and it is built round the kit rather than round the tune, with the struck alloy carrying the figure and the fiddle playing underneath it, and the fiddle break is short and angry
    intro: 14
    outro: cold
    target_duration: "4:10"
    prompt: >-
      170 BPM live reel; dry male tenor, struck alloy, amplified pipes, angry fiddle break, cold stop.
    exclude: sung harmony, backing vocals, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, clean studio recording, fade-out
    lyrics: |
      [Intro - struck alloy and kit, fourteen seconds]

      [Verse 1]
      Bree came from the gate with three rota sheets rolled tight,
      spread them on the bench and set a spanner on each corner.
      Eleven names sat wrong beneath the coming storm-season week.
      The man who wrote the hours would not work a single one.
      She counted every split shift twice, then reached for both sticks.
      Forty minutes later, struck alloy carried all the figures.
      Nobody needed his name. The bad rota named him well enough.

      [Chorus]
      He is not here tonight. Somebody went and checked.
      He is at the other hall on the far side of the yard.
      Bree lifts both sticks; the whole deck knows the reason.
      Eleven crooked hours hit the boards on every bar.

      [Verse 2]
      Before the count, a runner checks the stair and doorway,
      crosses through the yard and looks behind the keeper's room.
      Twice we saw his supervisor coat after the first hard turn.
      Twice Bree cut the figure dead and changed without a word.
      She will not throw it at him while he stands there smiling.
      This is not a warning sent across a crowded hall.
      It is eleven workers hearing their own week described.

      [Instrumental - fiddle break, twelve seconds, hard]

      [Verse 3]
      Two night shifts meet two mornings without space for sleeping.
      Three workers cross the settlement twice for one short turn.
      One woman loses every last ferry for a week.
      Bree took the sheets upstairs and read the numbers slowly.
      He said, "It is the same for all." Eleven names said otherwise.
      She folded every page and carried all three home.
      Tonight they sit beneath the snare while every figure lands.

      [Final Chorus - pipes answering the vocal line]
      He is not here tonight. Somebody went and checked,
      and every wrong-side worker knows the count by now.
      Bree lifts both sticks; the whole deck takes the answer.
      Nine years, never at him, always where his rota lands.
      The last hard stroke comes down upon the supervisor's empty chair.

      [Outro - cold stop]
