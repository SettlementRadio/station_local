    lyrics: |
      [Intro - pipes and fiddle, twelve seconds]

      [Verse 1]
      They asked for it at nine and they got it at nine,
      and they asked for it again at about a quarter past ten,
      which you are allowed to do twice and not three times,
      and the second time you have to be told it is happening.
      So here it is again and I am telling you now.
      Nobody at a dance likes finding out afterwards.
      Say it like a manifest: read out, then loaded.

      [Announcement - spoken plainly over the band]
      Right. Same one. Round again. Get yourselves back out.

      [Chorus]
      Every tune twice if the floor asks twice,
      and nothing more than twice, because there are other tunes.
      A band that plays what it is asked is a band that eats.
      A band that only plays what it is asked is a jukebox.

      [Verse 2]
      There is a difference between a request and an instruction
      and the difference is whether anybody is dancing to it.
      They were dancing to it. Four hundred of them were.
      You do not stand on a stage and be interesting about that.
      Orsa hates this and plays it beautifully every time,
      which is the most Forge thing about the man.

      [Instrumental - pipes take the break in the repeat, eighteen seconds]

      [Verse 3]
      The second pass is never the same as the first one.
      It is quicker. Everybody knows the shape of it now.
      The ones who sat the first one out are up for this one
      and the ones who did the first one are already tired,
      so the floor swaps over halfway through without anybody deciding,
      and that is a whole settlement's evening in about four minutes.

      [Chorus]
      Every tune twice if the floor asks twice,
      and nothing more than twice, because there are other tunes.
      A band that plays what it is asked is a band that eats.
      A band that only plays what it is asked is a jukebox.

      [Final Chorus - pipes answering the vocal line]
      Every tune twice if the floor asks twice.
      That is the arrangement and it has never been written down.
      A band that plays what it is asked is a band that eats,
      and there is a bench by the door with the money on it.

      [Outro - fade]
