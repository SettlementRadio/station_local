    lyrics: |
      [Intro - pipes and fiddle, sixteen seconds]

      [Verse 1]
      There is a beat in this one that should not be there
      and it has been there since before any of us were playing
      and every set that anybody has ever written down
      has four in a bar all the way through and this does not.
      A caller came out from the core to look at it once
      and stood at the side for an hour and went away again.

      [Chorus]
      Turn under it, turn under it, and take the long step there.
      Everybody in this room does it and nobody was taught.
      You cannot read it off a page. It is not on a page.
      It is in four hundred pairs of boots and that is where it lives.

      [Verse 2]
      The written sets are good and the written sets are useful
      and somebody had to do it or half of it would be gone,
      and the man who did it was thorough and was honest
      and wrote down what he saw in the halls he could get to.
      He never got to this one. It is a long way out
      and the yard hall is not on anybody's list of rooms.

      [Verse 3]
      So there are two arguments and both of them are old.
      One says a figure that is not written is not a figure.
      One says the writing is a record and not the thing,
      and the thing is a settlement doing what it does on a Saturday.
      Callers have been having it since before I was born.
      Meanwhile the floor turns under the pipes and does not care.

      [Chorus]
      Turn under it, turn under it, and take the long step there.
      Everybody in this room does it and nobody was taught.
      You cannot read it off a page. It is not on a page.
      It is in four hundred pairs of boots and that is where it lives.

      [Final Chorus - pipes answering the vocal line]
      Turn under it, turn under it, and take the long step there,
      and let the ones from off the relay road watch and count.
      You cannot read it off a page. It is not on a page.
      Come to the yard hall on a Saturday and learn it.

      [Outro - fade]
