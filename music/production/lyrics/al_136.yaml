      Both of those are probably true and neither is provable
      and it has stopped mattering to either of us.
      There is no paper anywhere with the date of it on.
      There is no bench, no manifest, no note in a hold.

      [Chorus]
      Who wrote it. Who cares. Somebody in this room did.
      It has been going round Forge for about four years
      and a hall out past the yard plays it faster than we do
      and a girl at the west hall sings a different second line.

      [Verse 2]
      That is the honest history of most of what gets played.
      Somebody had it, somebody heard it, somebody changed it,
      and by the time anybody thinks to write a name on it
      there are nine versions and four settlements involved.
      The written ones are the ones somebody made money from.
      That is not the same as the ones somebody made.

      [Instrumental - fiddle and pipes trading four bars each, twenty seconds]

      [Verse 3]
      Bree says split it four ways like everything else
      and neither of us has ever argued with Bree about money,
      and that is what the paper says and that is the end of it.
      It is the only tune this band has that nobody claims.
      It is also the one that gets asked for most weeks,
      in every hall in this settlement and two out past the yard,
      which the two of us have decided not to think about.

      [Final Chorus - pipes answering the vocal line]
      Who wrote it. Who cares. Somebody in this room did.
      It has been going round Forge for about four years.
      A hall out past the yard plays it faster than we do,
      and they are right, and we are not going to change.

      [Outro - a held pipe note ringing over the hall]
