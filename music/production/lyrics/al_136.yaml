    exclude: sung harmony, backing vocals, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, clean studio recording, fade-out
    lyrics: |
      [Intro - struck alloy and kit, fourteen seconds]

      [Verse 1]
      She wrote it on a bench in about forty minutes flat
      after a conversation at a gate about a rota,
      and it is the angriest thing anybody in this band has made
      and it is about one man and everybody knows which one.
      There is no name in it. She was careful about that.
      There does not need to be a name in it in this settlement.
      Everybody on that deck can name him by the second bar.

      [Chorus]
      He is not here tonight. Somebody went and checked.
      He is at the other hall on the far side of the yard.
      So we are going to play the one we do not play,
      and every one of you is going to know why.

      [Verse 2]
      Rules for this tune: he is not in the building.
      Not at the door, not in the yard, not on the stair.
      Twice in eight years we have got halfway through it
      and stopped dead, and gone into something else, and never explained.
      She will not have it played at him. She has been clear.
      She says it is not a message, it is a description.

      [Instrumental - fiddle break, twelve seconds, hard]

      [Verse 3]
      What it describes is a shift rota written badly
      by somebody who does not have to work it himself,
      and eleven people on the wrong side of a decision
      and a woman who counted it up and took it to him twice.
      He said it was the same for everybody. It was not.
      She has the sheets. She keeps the sheets. She still has them.

      [Final Chorus - pipes answering the vocal line]
      He is not here tonight. Somebody went and checked,
      and there is a room in Forge that knows every word of this
      and has never sung it in front of the man it is about.
      Nine years, and not once, and that is a kind of discipline.

      [Outro - cold stop]
