  - id: s_1120
    title: Last Dance in Forge
    track_number: 10
    mood: [fast, final, communal]
    fact: >-
      The last thing The Foundry Set played in public, three weeks after Bree Hollan took the
      supervisor's post and told the other three she was finished.
    arrangement_note: the fastest and longest thing on the record, played by four people who have already agreed that this is the end and have not told the room, with the whole band audibly refusing to finish it
    intro: 8
    outro: sustain
    target_duration: "4:40"
    prompt: >-
      172 BPM frantic live reel; dry male tenor, amplified pipes, huge floor, extra final turn, held end.
    exclude: sung harmony, backing vocals, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, clean studio recording, cold ending, fade-out
    lyrics: |
      [Intro - band, eight seconds]

      [Verse 1]
      Three weeks back, Bree found us at the bench before first shift.
      She had taken supervisor on the second loading line.
      "I cannot pay eleven people less on Friday," she said,
      "then stand here Saturday and ask those same hands to dance."
      Nobody argued. Toller folded up the stock list.
      Orsa closed one valve. I watched the kettle start to shake.
      We named this final hall and never told another person.

      [Chorus]
      Last one in Forge and the room does not know it.
      Do not tell them. Do not make a thing of it.
      There is no announcement coming and there is no speech.
      There is a tune, and it is fast, and then we go.

      [Verse 2]
      Bree counts four as if this Saturday were any other.
      Toller sets the low note; Orsa opens all eleven pipes.
      The woman in the same coat stands one third back again.
      Early-answer man comes early. Nobody turns around.
      Coats slide down the wall; heat runs in silver lines.
      Four hundred workers stamp the figure off the loading deck.
      Only the four upon the boards know what the last bar means.
      We keep our eyes apart and drive the first turn faster.

      [Verse 3]
      Halfway through, Toller catches Bree looking at the door.
      He leans into the bass and gives her somewhere else to look.
      Orsa pushes one long pipe note till the valve begins to rattle.
      I pull the fiddle line four beats ahead of sense.
      The silent woman shouts once at the second chorus.
      Bree laughs so hard she nearly drops the following stroke.
      Nobody in the hall has ever heard her miss and cheer it.

      [Chorus]
      Last one in Forge and the room does not know it.
      Do not tell them. Do not make a thing of it.
      There is no announcement coming and there is no speech.
      There is a tune, and it is fast, and then we go.

      [Final Chorus - pipes answering the vocal line, the hall over the top]
      Last one in Forge, and round it goes again,
      and again, because none of us will play the last bar.
      There is no announcement coming and there is no speech.
      The last ferry has gone. The morning shift can wait.
      Somebody has to stop this. It will not be me.
      Bree raises both sticks, counts one more, and does not leave.

      [Outro - held chord, the hall still going]
