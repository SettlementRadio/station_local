  - id: s_1118
    title: Nobody Wrote It Down
    track_number: 8
    mood: [quick, warm, loose]
    fact: >-
      Neither Dane Verrow nor Orsa Lipp could say afterwards which of them wrote it, so the 2619 sleeve
      credits the band, and it is the one track Bree Hollan did not dispute.
    arrangement_note: the loosest thing on the record, with the fiddle and the pipes trading the break between them four bars at a time because neither of them has a better claim to it than the other
    intro: 4
    outro: sustain
    target_duration: "4:05"
    prompt: >-
      162 BPM loose live reel; dry male tenor, fiddle and amplified pipes trade, held pipe ending.
    exclude: sung harmony, backing vocals, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, clean studio recording, tight arrangement, cold ending
    lyrics: |
      [Intro - band, four seconds]

      [Verse 1]
      Nobody can remember and both of us have tried.
      He says I had it in the cart on the way to the west hall.
      I say he was playing it at the bench about a month before
      and that I took it off him without noticing I had.
      Both of those are probably true and neither is provable
      because a tune can pass between two hands without a gate.
      No date beside the pipe rack, no note upon a manifest,
      only Bree's first count and Toller finding where the low part went.

      [Chorus]
      Who wrote it. Who cares. Somebody in this room did.
      It has been going round Forge for about four years
      and a hall out past the yard plays it faster than we do
      and a girl at the west hall sings a different second line.

      [Verse 2]
      The west-hall girl puts "cold hands" where I sing "late shift."
      A siding crew drops half the turn and stamps another beat.
      Children by the transfer gate whistle only Orsa's answer.
      The yard hall takes it faster till the final bars run hot.
      Nobody asked permission at a single relay stop.
      They heard a useful part and fitted it to local feet.
      By winter, nine close versions crossed four settlements.

      [Instrumental - fiddle and pipes trading four bars each, twenty seconds]

      [Verse 3]
      Bree says neither one of us may claim the opening.
      She made the count that fixed it; Toller changed the final fall.
      Orsa says the pipes were there before my fiddle found them.
      I say my cart-road line gave him the note he says was first.
      Then someone at the loading door demands the tune again.
      We drop the argument, because the floor has picked its version,
      and four hands enter somewhere no one wrote a starting point.

      [Final Chorus - pipes answering the vocal line]
      Who wrote it. Who cares. Somebody in this room did.
      It has been going round Forge for about four years.
      A hall out past the yard plays it faster than we do,
      and the west-hall girl has got the better second line.
      Count four, let it loose, and see who changes it by dawn.

      [Outro - a held pipe note ringing over the hall]
