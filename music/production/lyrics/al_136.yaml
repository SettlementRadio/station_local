  - id: s_1117
    title: Turn Under the Pipes
    track_number: 7
    mood: [deep, strange, driving]
    fact: >-
      Forge dancers walk a figure to this one that appears in none of Bessel Kroy's written sets, which
      callers have been using as an argument ever since.
    arrangement_note: the tune has a bar of five in every second turn, which is what the figure is walked to and which no written set accounts for, and the pipes hold through the odd bar rather than marking it
    intro: 16
    outro: fade
    target_duration: "4:20"
    prompt: >-
      150 BPM odd-meter live reel; dry male tenor, bar of five every second turn, held pipes, hall fade.
    exclude: sung harmony, backing vocals, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, clean studio recording, straightened or corrected metre, cold ending
    lyrics: |
      [Intro - pipes and fiddle, sixteen seconds]

      [Verse 1]
      A caller from the core came down the relay road with paper,
      Bessel Kroy's complete written sets tied square beneath one arm.
      He counted every opening and nodded through the first turn.
      On the second, one beat arrived where all his bars said four.
      Forty local couples took the long step without looking.
      He stopped his pencil in the air and counted us again.
      The amplified pipes held straight while five went underneath.

      [Chorus]
      Turn under it, turn under it, and take the long step there.
      Everybody in this room does it and nobody was taught.
      You cannot read it off a page. It is not on a page.
      It is in four hundred pairs of boots and that is where it lives.

      [Verse 2]
      He asked the caller by the stove to walk the figure slowly.
      She said, "Left, close, under, long," and showed him with her boots.
      He wrote four strokes, crossed one out, then added one between.
      On paper, every version put the weight in the wrong place.
      A grey-haired woman took his sleeve and pulled him to the floor.
      First turn he struck her heel; the second nearly worked.
      Third time, his long step landed where the room had always put it.

      [Verse 3]
      At closing, he laid Bessel's pages on the money bench,
      drew a fifth small mark beside the second turning bar.
      The yard-hall caller watched him, arms folded at the stove.
      "That is not the step," she said. He sighed, "I know it isn't."
      They argued through the coats, the sweeping and the count.
      Meanwhile, twenty tired couples walked it once more for the door,
      long step under held pipe, never waiting for a name.

      [Chorus]
      Turn under it, turn under it, and take the long step there.
      Everybody in this room does it and nobody was taught.
      You cannot read it off a page. It is not on a page.
      It is in four hundred pairs of boots and that is where it lives.

      [Final Chorus - pipes answering the vocal line]
      Turn under it, turn under it, and take the long step there,
      and let the ones from off the relay road watch and count.
      You cannot read it off a page. It is not on a page.
      Fold the written set and let the grey-haired woman lead.
      Five beneath the pipes; the whole yard hall turns clean.

      [Outro - fade]
