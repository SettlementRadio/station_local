      flat and matter-of-fact, clipping the ends of lines, singing against the fiddle he is playing
      himself. No harmony or backing vocal of any kind anywhere. Built around the percussion rather
      than the tune: struck alloy carrying the main figure, loud and pitched, cut-stock kit hard
      underneath, with the composite fiddle playing below the alloy rather than above it. Amplified
