  - id: s_1113
    title: Money on the Bench
    track_number: 3
    mood: [brisk, plain, wry]
    fact: >-
      Forge halls paid a band by leaving the money on a workbench beside the door, and Toller Grange
      counts it out loud at the end of this one.
    arrangement_note: the tune ends about twenty seconds before the track does and what fills the gap is a man counting coins out loud onto a bench with the hall still noisy around him
    intro: 6
    outro: fade
    target_duration: "3:40"
    prompt: >-
      152 BPM brisk live reel; dry male tenor, amplified pipes, coin counting after band, noisy hall fade.
    exclude: sung harmony, backing vocals, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, clean studio recording, cold ending
    lyrics: |
      [Intro - band, six seconds]

      [Verse 1]
      There is no envelope. There has never been an envelope.
      There is a bench by the door with a lamp over it
      and whatever the hall decided you were worth is on it
      and it is on it before you play, which is the good part.
      You walk in, you look at the bench, you know your night.
      Nobody has to have a conversation about anything.

      [Chorus]
      Money on the bench and the lamp on over it,
      and it does not go up if we are good and it does not go down.
      Count it at the end in front of whoever is left.
      That is not distrust. That is how this is done.

      [Verse 2]
      Toller does the counting because Toller can count
      and because the rest of us get it wrong and argue.
      He does it out loud. He has always done it out loud.
      He says a thing counted quietly is a thing counted twice.
      When the last pipe note ends, he carries every coin
      to the lamp and goes up in fours like counting a manifest.

      [Chorus]
      Money on the bench and the lamp on over it,
      and it does not go up if we are good and it does not go down.
      Count it at the end in front of whoever is left.
      That is not distrust. That is how this is done.

      [Verse 3]
      Once, in a hall out past the yard, the bench was empty
      and the keeper said he would settle it in the morning,
      and Bree took the kit apart and put it on the cart
      and we played nothing, and stood there, and went home.
      He paid the next band on the bench before they walked in.
      That is the only argument this settlement understands.

      [Final Chorus - pipes answering the vocal line]
      Money on the bench and the lamp on over it,
      and a man in the corner going up in fours out loud.
      Count it at the end in front of whoever is left.
      Nobody in Forge has ever been paid on a promise.

      [Outro - the counting, out loud, over the room, fading]
