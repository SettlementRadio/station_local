    lyrics: |
      [Intro - band, eight seconds]

      [Verse 1]
      Monday the west hall, Thursday the yard hall, Saturday here,
      and eleven pipes on a cart between the three of them
      and about ninety minutes each time to get them up,
      which is not enough, and everybody knows it is not enough.
      A cart, a rack, a manifest and a bad rota.
      So they are in Thursday's key and this is Saturday
      and nobody in this room is going to notice but us.

      [Chorus]
      Three halls in a week and the cart between the halls
      and a shift in the morning after every one of them.
      Nobody is doing this for a living. Nobody could.
      We are doing it because Saturday is Saturday.

      [Verse 2]
      Orsa has spent the whole tune about a quarter tone off
      and I have spent the whole tune not looking at him
      and the fiddle has gone somewhere nobody wrote down
      to sit in a gap between what is right and what is here.
      It sounds strange. Half of Forge thinks that is our sound.
      Our sound is a cart, a rota and not enough time.

      [Verse 3]
      There is a woman on the floor tonight who was at all three.
      Same coat. Same place, about a third of the way back.
      She has not spoken to any of us in four years of this
      and she has been at more of our dances than Bree has.
      That is what a band actually is in a settlement like this:
      not the four on the boards, the forty who come every week.

      [Chorus]
      Three halls in a week and the cart between the halls
      and a shift in the morning after every one of them.
      Nobody is doing this for a living. Nobody could.
      We are doing it because Saturday is Saturday.

      [Final Chorus - pipes answering the vocal line, still in the wrong key]
      Three halls in a week and the cart is at the door,
      and the pipes go back on the rack before the whistle.
      We are doing it because Saturday is Saturday,
      and Thursday's key is going to have to do.

      [Outro - fade]
