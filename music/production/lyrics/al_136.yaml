  - id: s_1112
    title: Hollan's Reel
    track_number: 2
    mood: [hard, fast, defiant]
    fact: >-
      Bree Hollan wrote it and would not let the band play it in front of the supervisor it is about,
      so it was only ever played at dances he did not attend.
    arrangement_note: the drummer wrote it and it is built round the kit rather than round the tune, with the struck alloy carrying the figure and the fiddle playing underneath it, and the fiddle break is short and angry
