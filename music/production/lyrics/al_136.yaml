  - id: s_1119
    title: Cold Walk to the Shift
    track_number: 9
    mood: [slow, weathered, warm]
    fact: >-
      Written about going from a dance straight to a morning shift, which all four of them did for
      twenty years and none of them stopped doing to make a record.
    arrangement_note: the slowest thing on the record and the only one taken well under the band's usual range, with the pipes holding one very long tone under the whole track the way the building hums before a shift starts
    intro: 12
    outro: sustain
    target_duration: "4:35"
    prompt: >-
      88 BPM slow live blues; tired dry male tenor, one held amplified pipe tone, quiet hall, held end.
    exclude: sung harmony, backing vocals, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, reel tempo, fast tempo, clean studio recording, cold ending, fade-out
    lyrics: |
      [Intro - one held pipe tone, twelve seconds]

      [Verse 1]
      It is a quarter to five and the hall is nearly empty
      and there is a walk from here to the gate of about a mile
      and the shift is at six and there is no point going home,
      so you go slowly, and you get there early, and you sit.
      All four of us have done that for about twenty years.
      Not one of us has ever traded that walk for sleeping late.

      [Chorus]
      Cold walk, warm coat, and a shift at the end of it,
      and a settlement getting up around you as you go.
      The first lamps in the yard come on at about half five.
      That is the most beautiful thing in Forge and nobody looks.

      [Verse 2]
      You can hear the shop before you can see the shop.
      It has a note. It has had the same note all my life.
      Somewhere under everything this settlement does
      there is a long low sound that nobody hears any more,
      and the first time Orsa put a pipe under a tune
      what he was doing was making people hear it again.

      [Turnaround - the held pipe tone alone, four bars]

      [Verse 3]
      Bree goes in with her hands still ringing from the kit.
      Toller has a bass on a cart and a shift on a rack.
      I have sung for four hours and I have to talk at six
      to a man about a stock order and I will manage it.
      Nobody made us do this. Nobody is watching.
      There is a dance every Saturday and we are always at it.
      Same lamps, same gate, same berth, same cold.

      [Chorus]
      Cold walk, warm coat, and a shift at the end of it,
      and a settlement getting up around you as you go.
      The first lamps in the yard come on at about half five.
      That is the most beautiful thing in Forge and nobody looks.

      [Final Chorus - the held pipe tone answering the vocal line]
      Cold walk, warm coat, and the whistle in an hour,
      and a note under the whole of it that has always been there.
      The first lamps in the yard come on at about half five.
      Look at them once. That is all anybody is asking.

      [Outro - the one pipe tone, left going]
