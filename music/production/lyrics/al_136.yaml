    lyrics: |
      [Intro - band, eight seconds]

      [Verse 1]
      Three weeks ago she told us at the bench, in about a sentence,
      that she has taken the supervisor's post on the second line
      and is not going to stand in front of a room on a Saturday
      and pay eleven people less than she is being paid to pay them.
      Nobody argued. There was nothing to argue with.
      She is right, and we all knew she was right immediately.

      [Chorus]
      Last one in Forge and the room does not know it.
      Do not tell them. Do not make a thing of it.
      There is no announcement coming and there is no speech.
      There is a tune, and it is fast, and then we go.

      [Verse 2]
      Twenty years of a shop, a cart, a rack and a hall.
      Two records made in a building we do not own,
      and a settlement that never once asked us to make them.
      A rota, an argument, a wall with a sentence on it,
      a cart pushed past the berth at four in the morning,
      four names on a piece of paper because one of us insisted.
      That is the whole of it and it is more than most get
      and there is not one of us who thinks otherwise tonight.

