    lyrics: |
      [Intro - bass figure alone, then piano, sixteen seconds]

      [Verse 1]
      There is a part behind the bar in someone's handwriting
      that is older than the woman pouring now.
      The bass has played it every night for forty seasons
      and it has not asked the room for anything.
      It goes around and comes back where it started.
      That is the whole of what it does and what it is.

      [Chorus]
      One more of the same, if you are pouring.
      One more, and then I promise I will go.
      I have said that in this room since I was twenty.
      The room has never once believed me. Nor did I.

      [Verse 2]
      He comes in off the freight crew every Tuesday
      with the same six words and the same coat.
      She takes it and she does not count it over.
      She knows the sum the way she knows the door.
      They have done this eight years running, more or less,
      and neither one of them has said what for.

      [Chorus]
      One more of the same, if you are pouring.
      One more, and then I promise I will go.
      I have said that in this room since I was twenty.
      The room has never once believed me. Nor did I.

      [Instrumental - upright piano break over the bass figure, fourteen seconds]

      [Verse 3]
      There is no version of this evening where it ends well
      and there is no version where it ends at all.
      Outside, the lane is emptying towards the water.
      In here the same four notes come round again.
      I am a person in a room that knows my name.
      Bring it round, and bring one for the bass player,
      and put the handwritten thing back where it came.

      [Chorus]
      One more of the same, if you are pouring.
      One more, and then I promise I will go.
      I have said that in this room since I was twenty.
      The room has never once believed me. Nor did I.

      [Outro - bass figure alone, fading]
