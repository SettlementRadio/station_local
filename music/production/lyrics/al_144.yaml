    lyrics: |
      [Intro - piano and bass, twelve seconds]

      [Verse 1]
      The last ferry goes at half past midnight.
      This room does not empty until two.
      We stack the chairs, we count the drawer out,
      The board outside has stopped announcing.
      The lane runs quiet as a held breath.
      Whoever wants to cross the water after
      pays the late fare or walks home in the dark.

      [Chorus]
      The late fare, the late fare.
      Eleven and a half to cross the water,
      eleven and a half to come back down.
      I have paid it every night this winter
      and I have never once begrudged the town.

      [Verse 2]
      There is a card behind the service window
      with the night rates written out by hand.
      The clerk there knows me by my coat now,
      knows I never argue with the price.
      He counts it twice and slides the paper over.
      He says the same two words to me each time.

      [Chorus]
      The late fare, the late fare.
      Eleven and a half to cross the water,
      eleven and a half to come back down.
      I have paid it every night this winter
      and I have never once begrudged the town.

      [Verse 3]
      You said you would wait up and you waited.
      You said the kettle would be on and it was.
      I came in cold and smelling of the river
      and you asked what a crossing costs these days.
      Nothing, I said, and put the ticket in the drawer
      with all the other nothings I have paid.
      The drawer will not shut properly by spring now.
      That is the only accounting we have made.

      [Final Chorus - one voice added from the keyboard chair]
      The late fare, the late fare.
      Eleven and a half to cross the water
      and whatever the walk home is worth to you.
      I would pay it twice to find the kettle boiling.
      I have never once begrudged the crossing through.

      [Outro - piano and bass, fading]
