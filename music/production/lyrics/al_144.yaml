# The house had sat on this band for six years and could not afford to press it; what changed in
# 2600 was the shared format that cleared the plant's backlog. Four nights in the Lower Bell room
# itself, after the last ferry, the band playing its ordinary set and stopping when the room emptied.
# **Everything on this record is the room's own economy** — a fare off the wall board, a round, a
# night porter's hours, an empty ferry board, and the phrase the staff use to clear the place out.
