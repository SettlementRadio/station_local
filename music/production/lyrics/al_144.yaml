    exclude: saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending, backing vocals before the final chorus
    lyrics: |
      [Intro - piano and bass, ten seconds]

      [Verse 1]
      There is an hour that belongs to nobody paying,
      after the drawer is counted and the door is on the latch.
      The people still in here are here on sufferance
      and every one of them knows exactly that.
      Nobody minds. It is the best part of the evening.
      The prices stop, the argument runs down.
      Somebody's coat is being used as a cushion.
      Somebody's shift begins in half an hour.

      [Chorus]
      Turn the lamps down, that's the finish.
      Turn the lamps down, take your glass.
      We are not throwing anybody out into the weather.
      We are only saying that the night has passed.

      [Verse 2]
      She has been saying it for nineteen seasons
      in a voice that has never once been raised.
      It works because it does not sound like closing.
      It sounds like somebody being kind and tired.
      The freight crew go, the ones from the storm coast go,
      the two who never speak to one another go,
      and the room lets out its held breath at the doorway
      and stands there being empty in the cold.

      [Pre-Chorus]
      One more and then the lamps.
      One more and then the stairs.

      [Verse 3]
      Somebody wrote it down and put it on a record,
      which is a thing you are not really meant to do.
      A house phrase is a house phrase, said the founder.
      A room's own words should stay inside the room.
      And then he printed it across the sleeve in full,
      because he is a man who loses arguments in style,
      and now the whole of the core can say it to each other
      and none of them have ever climbed our stair.

      [Chorus - one voice added from the keyboard chair]
      Turn the lamps down, that's the finish.
      Turn the lamps down, take your glass.
      We are not throwing anybody out into the weather.
      We are only saying that the night has passed.

      [Outro - piano fading, voice last]
