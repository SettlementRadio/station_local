    exclude: drum kit, snare, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, backing vocals, cold ending
    lyrics: |
      [Intro - piano and brushes on wood, nine seconds]

      [Verse 1]
      Two coats are on the chair backs by the window
      and the people who arrived in them are gone.
      One went out at midnight with a hauler,
      one went out at one and left the other one.
      I am not the person who decides here
      whether a thing gets carried to the door.
      I only turn the lamps down in the corners
      and set the chairs the way they were before.

      [Verse 2]
      She wore the grey one every second evening.
      He wore the other one all year and more.
      Then something happened somewhere in the middle
      of a night that I was working and not near,
      and now there are two coats across the chair backs
      and no arrangement made for either here.

      [Refrain]
      Somebody will come back for them by morning.
      Somebody has meant to for a week.
      I hang them where the light will not get at them
      and I do not say the thing I want to speak.

      [Verse 3]
      The last ferry took the rest of them at midnight.
      I could tell you what was said across this table.
      I have never told a soul and never will.
      A room like this is mostly what is left in it —
      a glass, a folded ticket, and a chair,
      and two coats that have been waiting since the storm season
      for whoever should have carried them from here.

      [Bridge]
      If you are cold tonight, that is the reason.
      If you are cold tonight, come in and sit.
      There is a fire that stays alight until the morning
      and nobody at all is watching it.

      [Refrain]
      Somebody will come back for them by morning.
      Somebody has meant to for a week.
      I hang them where the light will not get at them
      and I do not say the thing I want to speak.

      [Outro - piano sustaining, brushes stopping first]
