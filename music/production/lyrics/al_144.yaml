    exclude: saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, backing vocals, cold ending, drums in the opening sections
    lyrics: |
      [Intro - piano, seven seconds]

      [Verse 1]
      He has the chair beside the service door
      and a book he has been reading since the spring.
      He is not waiting for the room to empty.
      He is waiting on a shift that has no end time.
      Some nights it is eleven, some it is four,
      and there is not a rota anywhere that says.
      So he sits where he can hear the outer stairwell
      and turns a page each time it does not open.

      [Refrain]
      Who waits up is not a small arrangement.
      Who waits up is most of what there is.
      Anybody can be somewhere at an agreed hour.
      It is the unagreed hours that are his.

      [Verse 2]
      The last ferry went at midnight, so that settles
      one whole class of ways she might arrive.
      Now it is the long way round or nothing,
      the lane, the stair, the cold half of the night.
      He does not phone the depot. He has learned that.
      He asked once and they told him and it hurt.
      Not knowing is a kinder sort of company
      than a voice that says another two hours yet.

      [Refrain]
      Who waits up is not a small arrangement.
      Who waits up is most of what there is.
      Anybody can be somewhere at an agreed hour.
      It is the unagreed hours that are his.

      [Verse 3]
      And when she comes, she comes in like the weather,
      cold hands, a bag, the smell of somewhere else.
      She never says she's sorry and he never
      asks her to, because she isn't, and nor is he.
      The lamps are down, the chairs are on the tables.
      Then the two of them go out into the quiet
      and the door swings shut on nobody at all.

      [Coda - brushed kit entering under the last lines]
      It is the unagreed hours that are his.
      It is the unagreed hours. And she knows.

      [Outro - piano sustaining]
