    exclude: saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, backing vocals, fade ending
    lyrics: |
      [Intro - one held chord, twenty seconds]

      [Verse 1]
      There is nothing on the board tonight.
      Not delayed, not cancelled, not a time.
      Just the frame and the empty slots inside it
      and a man with a cloth who has gone home.
      A blank board is worse than a bad one.
      A bad one you can plan against and swear.
      This one only says that somewhere up the line
      a decision has been made and not declared.

      [Verse 2]
      We opened anyway. We always open.
      The lamps went on at nine the way they do.
      The bass came in, the brushes came in after,
      and I stood at the front and looked at you —
      four people at two tables near the window,
      and the rest of the settlement outside somewhere
      deciding whether it was worth the crossing home.

      [Chorus]
      Play it for whoever is in the doorway.
      Play it for whoever is not there.
      A blank board is a room that has not answered.
      A room that has not answered is still a room.

      [Instrumental - upright piano break, twelve seconds]

      [Verse 3]
      By one o'clock there were nineteen and a hauler crew,
      by two the coats were three deep on the stand.
      Nobody said a word about the ferry.
      Nobody was going anywhere by boat.
      They stayed until the piano stopped for good and
      they went out into a cold with no last ferry in it,
      and the board outside still said absolutely nothing.

      [Chorus]
      Play it for whoever is in the doorway.
      Play it for whoever is not there.
      A blank board is a room that has not answered.
      A room that has not answered is still a room.

      [Final Chorus]
      Play it for whoever is in the doorway.
      Play it until the doorway is not full.
      A blank board is a room that has not answered,
      and we answered, and we did it all night long.

      [Outro - cold stop]
