  - id: s_1147
    title: Down to the Lock House
    track_number: 7
    mood: [close, warm, final]
    fact: >-
      Sim Pallow plays with his hands and no sticks the whole way through, because the lock house is
      joined to a house with a child asleep in it.
    arrangement_note: everything on this record is quiet because of one wall and one sleeping child, and this is the track that says so, with the whole band at the bottom of its range
    intro: 14
    outro: sustain
    target_duration: "4:05"
    prompt: >-
      74 BPM warm blues; quiet female lead, low male harmony, soft guitar, piano, hand kit, held end.
    exclude: concertina, female harmony vocal, slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, drum sticks, loud dynamics, vocal tuning, whispered or rapped sections, modern studio production, cold ending, fade-out
    lyrics: |
      [Intro - guitar and piano, fourteen seconds]

      [Verse 1]
      Come in from the towpath, shake the rain off,
      leave your heavy boots beside the door.
      There's onion in the pot and coal enough till morning,
      one chair at the table, two crates on the floor.
      The last freight crew tied below the window;
      their hauler wears a crust of river cold.
      Speak easy when you tell us where you've come from.
      A little girl is sleeping through the wall.

      [Round]
      Pass the bread low, pass the good cup slowly.
      Keep the fire small and let the kettle hum.
      The lane can shout till daylight finds it;
      under this roof, let the quiet make us one.

      [Verse 2]
      She spent the afternoon outrunning thunder,
      made a fort of blankets by the stair.
      Now one small hand is open on the pillow,
      trusting every grown voice in the air.
      So tell your joke without the table shaking,
      tap the rhythm with your palm, not wood.
      We have all heard louder kinds of welcome;
      none of them have ever warmed us half as good.

      [Round]
      Pass the bread low, pass the good cup slowly.
      Keep the fire small and let the kettle hum.
      The lane can shout till daylight finds it;
      under this roof, let the quiet make us one.

      [Verse 3]
      Before first light the top gate needs attending,
      and cargo wants the sea before the rain.
      You may take the spare coat from the nail there;
      send it homeward on the next relay.
      If the sleeping child should wake and call us,
      we'll say the dark has nothing left to prove.
      Just water at the sill and friends below her,
      keeping time so softly no dream has to move.

      [Final Round]
      Pass the bread low, pass the good cup slowly.
      Keep the fire small and let the kettle hum.
      The whole wide settlement may hurry;
      under this roof, let the quiet make us one.
      Come in from the weather, there is room beside the fire.
      Mind the wall, and set another place for anyone.

      [Coda - sustain]
