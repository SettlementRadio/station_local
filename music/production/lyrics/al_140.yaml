  - id: s_1146
    title: Paid at the Wharf
    track_number: 6
    mood: [driving, hard, defiant]
    fact: >-
      The sum in the last verse is what the four of them were paid for this record, once and flat, and
      nothing has been added to it since.
    arrangement_note: the hardest thing on the record and still played with hands, which puts the whole weight on the guitar and the bass and is why it drives without ever getting loud
    intro: 4
    outro: cold
    target_duration: "3:30"
    prompt: >-
      108 BPM driving blues; high female lead, low male harmony, hard guitar, bass, hand kit, cold stop.
    exclude: concertina, female harmony vocal, slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, drum sticks, loud dynamics, vocal tuning, whispered or rapped sections, modern studio production, fade-out
    lyrics: |
      [Intro - full band, four seconds]

      [Verse 1]
      We brought the flour down through freezing water,
      four bent backs and two nights without sleep.
      The sacks stayed dry beneath the patched tarpaulin;
      the hauler took the frost along its keel.
      At dawn the buyer stood beside the weighbridge,
      clean cuffs, warm coat, pencil in his hand.
      He found three faults not written on the manifest,
      then named the only price that crossed the lane.

      [Refrain]
      Count it once and close your fingers.
      Split it four ways, bite the coin.
      Hunger makes a poor negotiator,
      but hunger always reaches work on time.

      [Verse 2]
      Nine and four, the cargo and the winter,
      nine and four, the room above the store,
      nine and four for rope burns, cracked skin, waiting,
      and carrying every sack across the wharf.
      One share buys a ration and a candle.
      One share keeps the rent man from the door.
      One goes back to patch the leaking cover.
      The final share is gone before it's warm.

      [Bridge]
      We could have turned the bow and kept the flour.
      We could have watched it spoil inside the hold.
      A choice between a bad price and no supper
      is a choice that only sounds free when it's told.

      [Verse 3]
      Next market, if his table still is standing,
      we'll lay our own black ledger by the scale.
      Freight crew hours, storm loss, rope and patched canvas,
      every cost his tidy sums conceal.
      If he laughs, we'll tie and take the cargo,
      find another buyer down the cut.
      If every gate is barred against a fair share,
      we'll feed each other first and call their bluff.

      [Refrain]
      Count it twice and open your fingers.
      Split it four ways, name the coin.
      Need may make a hard negotiator,
      but four clear voices make a stronger line.

      [Outro - cold stop]
