  - id: s_1145
    title: Two Boats Waiting
    track_number: 5
    mood: [funny, brisk, blunt]
    fact: >-
      The two crews who would not give way to one another for a whole afternoon in 2604 are both in
      the song, and both of them bought the record.
    arrangement_note: two flat blunt voices take one exchange with the band dropped out behind them, and they are the lead and the bass chair rather than anybody new, because there is nobody else in this band
    intro: 5
    outro: cold
    target_duration: "3:35"
    prompt: >-
      104 BPM brisk blues; high female lead, low male harmony, flat spoken pair, guitar, hand kit, stop.
    exclude: concertina, female harmony vocal, slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, drum sticks, additional voices, vocal tuning, whispered or rapped sections, modern studio production, fade-out
    lyrics: |
      [Intro - full band, five seconds]

      [Verse 1]
      One bow noses north and one bow noses southward,
      meeting where the fourth lock narrows to a throat.
      He has sacks of barley riding low behind him;
      she has empty crates and one offended goat.
      The painted rule is plain above the paddle:
      loaded vessel first, the lighter vessel yields.
      She reads it twice and ties her rope more firmly.
      He folds both arms and settles at the wheel.

      [Chorus]
      Nobody moving, kettle coming on.
      Six deep in the north lane, five behind the south.
      Plenty of canal and one small gate between them;
      pride has found the narrowest place to spread itself about.

      [Verse 2]
      A freight crew lays a blanket on the towpath.
      Someone sells hot buns from a cargo tin.
      A child starts taking wagers on the outcome;
      even odds they both stay there till spring.
      The goat eats half the corner of a manifest.
      The barley man objects as if it matters now.
      She lifts her cup and smiles across the water.
      He checks the rule again and clears his throat.

      [Spoken Exchange - two flat voices, band out]
      You back up.
      No, you back up.
      My hold is full.
      Your head is fuller.
      That goat is eating paperwork.
      The goat has made the wisest move all day.

      [Chorus]
      Nobody moving, kettle coming on.
      Six deep in the north lane, five behind the south.
      Plenty of canal and one small gate between them;
      pride has found the narrowest place to spread itself about.

      [Verse 3]
      At dusk they both untie without discussion,
      each reversing at the very selfsame beat.
      He insists he moved from reason, not surrender;
      she declares she only pitied those who'd eat.
      The queues slide through while both crews cheer the darkness,
      and the goat receives the final sugared bun.
      Next week the pair will meet down at the wharfside,
      each retelling how the other one was won.

      [Break - piano and hand kit, six seconds]

      [Final Chorus]
      Everybody moving, kettle emptied out.
      Six boats going northward, five boats heading south.
      Plenty of canal behind the gate between them;
      pride can fill a whole long day and leave by either mouth.

      [Outro - cold stop]
