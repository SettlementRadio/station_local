# al_140 — Ten Locks to the Sea · The Ninefoot Cut (b_063) · Relay Road Import · 2607 · 7 songs · album
#
# Written by M-25. **The file shape is fixed by al_001.yaml — read that header once.** Production
# vocabulary (COMMISSION.md §8): never enters the wiki, never said on air. Lyrics written by hand;
# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# Cut in 2605 in the lock house at the head of eleven miles of Earth canal and issued at the road
# head in 2607 — **the first record made on Earth that Relay Road Import ever landed**, and only
# because a clerk read a letter meant for the Bell Yard Rounds as the address of a district rather
# than of a yard. The band had been paid once and flat and had stopped thinking about the whole
# business long before anybody out here heard a note of it, which is `s_1146`.
#
# **The style card is dated here and this record is before the date** (D-096, following D-095's first
# shape). Wenna Ferrin joins in 2610, so on al_140 there is **no concertina anywhere and only one
# harmony voice** — Torr Bexley's, male, low under the lead — where the card describes two. Every
# exclude line on this record keeps the concertina and the female harmony out; the card was not
# amended and should not be. The first concertina in this band's life is the first bar of `al_141`.
#
# **Sim Pallow plays with his hands and no sticks on all seven tracks**, not only on `s_1147`: the
# lock house shares a wall with a house that had a child asleep in it for the whole week. That one
# fact took the volume out of the entire record, which is what `s_1147` is about.
#
# `generation:` and every `take:` are empty until M-34.

album:
  id: al_140
  title: Ten Locks to the Sea
  band: b_063
