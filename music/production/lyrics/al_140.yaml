  - id: s_1143
    title: Nobody Walks the Towpath
    track_number: 3
    mood: [blue, midtempo, plain]
    fact: >-
      About the winter the towpath lamps were stripped off the posts for the metal in them, and the
      man the crews blamed lived four doors from Sim Pallow and never spoke to him again.
    arrangement_note: the drummer on this track is the man the song is about being wronged alongside, and he plays it with his hands like everything else here, which nobody in the room mentioned at the time
    intro: 12
    outro: fade
    target_duration: "3:55"
    prompt: >-
      88 BPM plain blues; high female lead, low male harmony, guitar, piano, bass, hand kit, fade.
    exclude: concertina, female harmony vocal, slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, drum sticks, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - guitar and bass, twelve seconds]

      [Verse 1]
      One winter every lamp went blind in order,
      first by the wharf and then beyond the bend.
      Bare posts held their stripped wire to the weather,
      little copper tongues no current came to mend.
      The towpath kept its stones, the locks kept turning,
      freight crews still tied their haulers before dawn.
      But every window watched the dark grow longer,
      and every mouth supplied the missing hand.

      [Chorus]
      No one takes the black path home now.
      Boots go round by the lane and the houses stay awake.
      A lamp can lose its metal in a minute;
      a neighbor loses years for one mistake.

      [Verse 2]
      They chose the man who lived four doors below us,
      because he sold old fittings at the quay.
      No court called him, no witness crossed his threshold,
      but suspicion needs no manifest to leave.
      His oldest friend looked down across the flour sacks,
      then turned his face when both reached for the scale.
      They had shared storm season, tools, and Sunday supper;
      now they trade their silence twice a week.

      [Instrumental - guitar and piano, eight seconds]

      [Chorus]
      No one takes the black path home now.
      Boots go round by the lane and the houses stay awake.
      A lamp can lose its metal in a minute;
      a neighbor loses years for one mistake.

      [Verse 3]
      I met him where the final post leans waterward,
      his hands deep in a coat too thin for frost.
      He said he knew who first had laid the story,
      then shook his head and would not name the cost.
      Behind us, cargo chains were knocking softly;
      ahead, the unlit towpath held its breath.
      He took the longer road among the windows,
      and I took it too, four careful doors behind.

      [Final Chorus]
      No one takes the black path home now.
      Boots go round by the lane and the houses stay awake.
      The posts may wear new lamps before next winter,
      bright enough to show the faces at the gate.
      But light cannot unsay what fear has spoken,
      or teach two old friends how to meet again.

      [Outro - fade]
