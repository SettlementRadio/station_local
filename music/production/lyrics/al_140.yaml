  - id: s_1141
    title: Ten Locks to the Sea
    track_number: 1
    mood: [rolling, warm, midtempo]
    fact: >-
      Fenna Crole counts ten locks and there are eleven, because the eleventh was cut in after she
      wrote it and she has refused to change the number since.
    arrangement_note: an opener taken at a walking roll with the kit played by hand throughout, and the male harmony only on the last line of each chorus rather than across it
    intro: 10
    outro: fade
    target_duration: "3:50"
    prompt: >-
      96 BPM warm blues; high female lead, low male harmony, guitar, piano, bass, hand kit, fade.
    exclude: concertina, female harmony vocal, slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, drum sticks, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - guitar and piano, ten seconds]

      [Verse 1]
      My mother kept the third gate through the long rain,
      her mother kept it before the concrete learned to crack.
      They taught me every paddle by the pull against my shoulder,
      every shallow place a loaded hauler ought to miss.
      Back then ten black doors stood between our kettle
      and the salt wind leaning inland from the basin.
      I can still count them right with both hands in my pockets,
      though a fresh white gate is shining farther down.

      [Chorus]
      Ten locks to the sea, let the old count carry me.
      Let the water take the cargo, let the cargo take its time.
      Every freight crew knows the map can move beneath you,
      but the way you learned your home stays written in your stride.

      [Verse 2]
      The new gate has a rail that never catches winter,
      a painted number no one here remembers asking for.
      Young hands read the manifest and call the distance eleven;
      I nod and lift the beam and never trouble them with mine.
      They have routes beyond the basin, lanes beyond the weather,
      lights that tell them where their next clean berth will be.
      I have rain upon the window, bread beside the ledger,
      and the third lock opening where my people used to stand.

      [Turn]
      Add a gate, add a mile, add a mark beside the water.
      You cannot add another childhood to the bank.

      [Chorus]
      Ten locks to the sea, let the old count carry me.
      Let the water take the cargo, let the cargo take its time.
      Every freight crew knows the map can move beneath you,
      but the way you learned your home stays written in your stride.

      [Verse 3]
      I went down once at dawn to see the open water,
      where the cut gives up its name among the cranes.
      The basin smelled of rope and fuel and foreign oranges,
      and every voice was bargaining for somewhere else.
      I watched one empty hauler turn its bow toward homeward,
      heard the stern line slap the stone below my feet.
      Eleven gates were waiting, but my body counted ten of them,
      ten small falls of water to the fire and the key.

      [Chorus]
      Ten locks to the sea, let the old count carry me.
      Let the water take the cargo, let the cargo take its time.
      Every freight crew knows the map can move beneath you,
      but the way you learned your home stays written in your stride.

      [Outro - fade]
