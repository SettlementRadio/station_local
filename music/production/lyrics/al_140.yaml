  - id: s_1144
    title: Half a Mile an Hour
    track_number: 4
    mood: [slow, steady, dry]
    fact: >-
      Aldis Merrow plays it at the speed a loaded boat moves and would not agree to the tempo until
      Torr Bexley had walked one alongside him.
    arrangement_note: the tempo is a measurement rather than a choice — a loaded boat walked past a lock house window and counted — and nothing in the arrangement is allowed to push against it anywhere
    intro: 13
    outro: fade
    target_duration: "4:20"
    prompt: >-
      62 BPM slow blues; high female lead, low male harmony, steady piano, guitar, bass, hand kit, fade.
    exclude: concertina, female harmony vocal, slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, drum sticks, tempo changes, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano alone, thirteen seconds]

      [Verse 1]
      I left before the market lamps were waking,
      with flour in the hold and rain ahead.
      Your note lay underneath the folded manifest,
      six quiet words I must have often read.
      The hauler leaned against its rope and waited,
      loaded low enough to comb the canal.
      I told the morning I would reach you by tomorrow;
      the morning knew the distance better than I did.

      [Verse 2]
      At the second gate the freight crew shared their coffee.
      At the fourth, a fallen branch had caught the chain.
      At the sixth, two children traded pears for stories.
      At the eighth, the towpath disappeared in rain.
      Every delay felt personal till evening,
      every mile a judgment I had earned.
      Then your window rose above the farther water,
      one square of gold that never asked me to be fast.

      [Refrain]
      Half a mile an hour and the cargo still comes home.
      Half a mile an hour with the towline pulling true.
      Let the quick lanes spend themselves beyond us;
      I have nothing left to outrun coming back to you.

      [Verse 3]
      I have lived where every clock runs like an argument,
      where the last ferry shuts before goodbye.
      I have pushed through transfer halls at closing,
      with a berth number burning in my eye.
      Still my hands remember this old balance,
      stone beside me, dark green water under keel.
      A loaded boat will tell the plainest measure:
      what arrives too quickly may not arrive whole.

      [Refrain]
      Half a mile an hour and the cargo still comes home.
      Half a mile an hour with the towline pulling true.
      Let the quick lanes spend themselves beyond us;
      I have nothing left to outrun coming back to you.

      [Final Verse]
      When I tied below your window it was midnight.
      The flour was dry, the bow was cold with dew.
      You came down barefoot, carrying no questions,
      and held the line while I stepped onto stone.
      Behind us all the lock gates kept their patience;
      ahead, the kettle clouded up the pane.
      I had crossed eleven miles in one long answer,
      slow enough to know I meant every word.

      [Outro - fade]
