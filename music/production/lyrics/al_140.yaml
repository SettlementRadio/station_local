  style_card: b_063
  room: >-
    The front room of a canal lock house on Earth — small, wooden, with water and stone behind
    everything and one wall shared with a neighbour. One or two microphones, everything acoustic and
    close, nothing overdubbed. The card holds with one dated exception: light high female lead, clear
    and even, unhurried, singing quietly and letting the room carry it, with **one** male harmony
    voice low under her on choruses and never above her. Wenna Ferrin has not joined yet, so there is
    no concertina and no female harmony on this record at all. Sim Pallow plays the kit with his hands
    throughout because of the child asleep the other side of the wall, so nothing here has a stick on
    it and the guitar and piano both came down to meet it. Two fact-bound details live in their own
    songs: the tempo of s_1144, which is a loaded boat walked past the window and counted, and the
    stripped wire left hanging on the towpath posts in s_1143.

