  - id: s_1142
    title: Wait for the Water
    track_number: 2
    mood: [patient, slow, wry]
    fact: >-
      Written in the hour and a half the top lock needs to fill, which Fenna Crole timed against the
      lock house clock before she would let the band shorten it.
    arrangement_note: the slowest thing on the record after s_1144 and the only one with no kit at all in the first verse, because a lock filling makes no rhythm anybody can play to
    intro: 16
    outro: sustain
    target_duration: "4:15"
    prompt: >-
      66 BPM patient blues; high female lead, low male harmony, piano, guitar, hand kit after verse one.
    exclude: concertina, female harmony vocal, slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, drum sticks, vocal tuning, whispered or rapped sections, modern studio production, cold ending, fade-out
    lyrics: |
      [Intro - piano and guitar, sixteen seconds]

      [Verse 1]
      I came with a pocket full of reasons to be early,
      one clean shirt and a message folded small.
      The top gate wore a skin of green in morning,
      and the gauge had hardly lifted from the wall.
      I pulled the paddle, heard the first deep answer,
      then paced the beam as if my boots could help.
      A heron took the only post of sunlight.
      The water climbed without consulting me at all.

      [Refrain]
      Let it rise the way it rises, dark to silver, stone by stone.
      You can curse the slow arrival, you can make the waiting home.
      No lane runs round the chamber, no quick bargain lifts the gate.
      Put your worry on the balance. What is coming will not break.

      [Verse 2]
      A freight crew brought a hauler close behind me,
      with cold tea, tired eyes, and half a hold of grain.
      They checked the time against a distant relay,
      then laughed when I said hurry to the rain.
      One dealt cards across an upturned bucket,
      one mended canvas where the cargo rubbed it thin.
      By noon they knew the story in my pocket,
      and offered three bad answers with a grin.

      [Refrain]
      Let it rise the way it rises, dark to silver, stone by stone.
      You can curse the slow arrival, you can make the waiting home.
      No lane runs round the chamber, no quick bargain lifts the gate.
      Put your worry on the balance. What is coming will not break.

      [Middle Eight]
      I thought the far end held a final sentence.
      I thought one voice could settle what I knew.
      But the mark crept past the moss while I was breathing,
      and the hour made a little room for two.

      [Verse 3]
      When the gate swung wide the day had changed its color,
      and the folded message weighed no more than thread.
      I tied beside the wharf and found you waiting,
      with no grand speech and rain upon your head.
      You said the last ferry could leave without us,
      the manifest could find another hand.
      We watched the empty chamber lose its brightness,
      and let the next slow water make its plans.

      [Refrain]
      Let it rise the way it rises, dark to silver, stone by stone.
      You can curse the slow arrival, you can make the waiting home.
      No lane runs round the chamber, no quick bargain lifts the gate.
      Put your worry on the balance. What is coming will not break.

      [Outro - sustain]
