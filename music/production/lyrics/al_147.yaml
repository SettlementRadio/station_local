  room: >-
    The Lower Bell room across a season in which it was half empty, recorded the way the house's
    founder said a room should be — one voice, a piano, and nothing added. The card holds: low grainy
    female lead singing behind the piano with no ornament and no vibrato, upright piano taking every
    instrumental break, upright bass, brushed kit with light hand percussion, and **no keyboard or
