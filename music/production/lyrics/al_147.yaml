    same guitar answering the piano's left hand from the first bar to the last, which is what the two
    players argued about and what the take keeps; and `s_1194` ends on one female answering voice,
    the only backing vocal on any Coldwater Court record. `s_1191` is played on a bass with two
    working strings, so the bass part is sparse and stays low all the way through.

