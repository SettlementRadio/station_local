    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals before the closing section, harmony above the lead, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano and bass, eleven seconds]

      [Verse 1]
      A warm glass and a cold court is the whole of it.
      That is the bargain and it has never changed.
      Outside there is a yard with a stone floor
      and a wind that comes up off the water at three.
      In here there is a lamp and a low ceiling
      and forty people breathing the same air.
      There is a hauler crew who come up every Tuesday
      and stand exactly where they always stand.
      Nobody has ever said it is worth it.
      Everybody comes back the following week.

      [Verse 2]
      They had gone home. That is the plain explanation.
      The two who sing the answer had a ferry
      and nobody had thought to ask them to stay on
      and by the time we noticed it was gone.
      So there was one voice left in the whole building
      who had come in for something else entirely,
      and she stood where they stand and sang it once through
      and we did not do a second take of it.
      She had not heard the song before that evening.
      She has not sung it since, and will not now.

      [Chorus]
      Warm glass, cold court, and the door standing open.
      Warm glass, cold court, and the lamps down low.
      Whoever is still standing when the piano stops
      can have the rest of what is in the pot.

      [Verse 3]
      This is the end of the record and the season.
      The quarter fills again in about a week.
      The regulars come back off the burn festival
      and the chairs go down and the whole thing starts again.
      I have sung the last song on four hundred evenings
      and it is never the last song. That is the joke.
      There is always somebody putting on a coat
      and always somebody deciding not to.

      [Coda - one answering voice alone, then piano under her]
      Warm glass, cold court, and the lamps down low.
      Whoever is still standing, come on through.

      [Outro - voice and piano sustaining]
