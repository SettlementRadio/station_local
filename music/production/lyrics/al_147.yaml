    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano and guitar, five seconds]

      [Verse 1]
      Nothing opens until nine in this whole quarter
      and it is twenty past six and it is raining,
      and I have got four hours and a wet coat
      and a thing I have decided I will say.
      There is no place at all to say it in.
      The transfer hall is warm and full of strangers.
      The stair is cold. The lane is out of the way.
      So I will walk about with it until the doors.

      [Chorus]
      Nothing opens until nine, and I am ready now.
      Nothing opens until nine, and I am not.
      Give me three hours and I will talk myself
      out of every word of it. I know I will.

      [Verse 2]
      He wrote the part out properly, in pencil,
      and gave it to the man who plays the strings,
      and the man looked at it and put it on the music stand
      and did the opposite from the first bar on.
      Every place the left hand leaves a gap in
      there is an answer in it that was not asked for.
      They have not agreed about it in eleven years.
      They have also never played it any other way.

      [Instrumental - piano and guitar answering each other, fourteen seconds]

      [Verse 3]
      By nine o'clock I had it down to one line
      and by five past I had not said the line.
      You made tea. You asked about the record.
      I said the record's fine. And it is fine.
      There is an answer in the gap and I can hear it.
      There is an answer in the gap and it is yours.
      Nothing opens until nine, and then it opens,
      and then a person has to go on in.

      [Chorus]
      Nothing opens until nine, and I am ready now.
      Nothing opens until nine, and I am not.
      Give me three hours and I will talk myself
      out of every word of it. I know I will.

      [Outro - guitar last, fading]
