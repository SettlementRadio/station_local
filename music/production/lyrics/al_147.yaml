    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, fade ending
    lyrics: |
      [Intro - piano alone, eighteen seconds]

      [Verse 1]
      The stair door took his hand at half past ten
      and there was a good deal of blood and no discussion.
      He wrapped it in a cloth from behind the counter
      and asked what time the second set began.
      There was a hauler crew in at the front table
      who stood up when he came back down the room.
      Nobody talked him out of it. You do not.
      He played the whole night on the two that worked
      and the piano went down under him and covered,
      and it is the best thing on the record. Ask him.

      [Verse 2]
      Four in the morning is a different room.
      The chairs are up. The far half has gone dark.
      Whoever is still here has made a decision
      and every one of them has made it twice.
      There is a man asleep against the panelling
      whose shift begins in ninety minutes' time.
      There is a woman who has not touched her glass since one.
      There is nobody here who is here by accident.
      Out there the lane is empty to the water.
      In here the ceiling holds the whole of it.

      [Instrumental - upright piano break, fifteen seconds]

      [Verse 3]
      Play it low. There is nothing to be gained
      by asking any more of anybody now.
      The last ferry went before the first set finished.
      Whatever gets you home is on your feet.
      I have been in this room at four a thousand times
      and it has never once been the same room twice,
      and every one of them has ended the same way,
      and it is never any warmer than the outside,
      and I have never once been cold in it at all.

      [Refrain]
      Four in the morning, and the piano is still open.
      Four in the morning, and the door is on the latch.
      Whoever wants to sit down and say nothing,
      there is a chair, and nobody will ask.

      [Outro - cold stop]
