  - id: s_1189
    title: First Round Slow
    track_number: 1
    mood: [unhurried, warm, wry]
    fact: >-
      Bela Runn opens at the tempo the Lower Bell's staff pour at, which Maro Deyn timed against the
      bar clock one night and wrote on the back of a docket.
    arrangement_note: the tempo is the pouring tempo and nothing on the record is faster than it, and the piano waits a full bar behind the voice at every entry
    intro: 14
    outro: fade
    target_duration: "3:55"
    prompt: >-
      54 BPM unhurried Purist slow torch; low grainy female lead singing behind the piano with no
      vibrato and no ornament, upright piano, upright bass, brushed kit with light hand percussion,
      tracked live in a small club room, tape warmth, fade.
    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano and bass, fourteen seconds]

      [Verse 1]
      Nobody hurries what is poured in this room.
      It is not a policy. Nobody wrote it down.
      It is the speed the woman at the tap goes,
      and she has gone that speed since she was young.
      He stood one night and timed her with the bar clock
      and wrote the number on the back of a docket,
      and the docket is in a drawer behind the bottles,
      and that is the tempo everything here takes.

      [Chorus]
      First round slow, and the second one slower.
      Nothing in this quarter is on time.
      The ferry is, the plant is, and the lane is.
      In here we are pouring, and we take the night.

      [Verse 2]
      A man came in from the core last winter,
      the kind who taps the counter with a coin.
      He asked her twice and she did not go faster
      and he watched his own glass fill and stopped complaining.
      By one o'clock he was the last one talking.
      By two he had his coat over a chair.
      He comes back every season now, that man,
      and he has never once tapped anything since.

      [Chorus]
      First round slow, and the second one slower.
      Nothing in this quarter is on time.
      The ferry is, the plant is, and the lane is.
      In here we are pouring, and we take the night.

      [Verse 3]
      I sing it at the speed the glass goes down,
      which is slower than a person wants at first
      and exactly right by about the second verse,
      and by the third you cannot hear the clock.
      That is the whole trick and there is nothing else.
      Everybody who has played here knows the tempo.
      Everybody who has drunk here knows it too.
      Nobody in the settlement has ever named it.
      It is not in a book. It is not on the wall.
      It is the speed a woman pours, and that is all.

      [Outro - piano and bass, fading]
