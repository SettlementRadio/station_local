    prompt: >-
      70 BPM dry midtempo Purist slow blues torch; low grainy female lead behind the piano, no
      vibrato, upright piano, a fretted composite acoustic guitar answering the piano's left hand in
      every gap throughout, upright bass, brushed kit with hand percussion, piano and guitar taking a
