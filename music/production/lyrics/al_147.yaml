  - id: s_1192
    title: Send a Card Instead
    track_number: 4
    mood: [tender, rueful, slow]
    fact: >-
      Bela Runn wrote it for her brother on the freight circuit and sings his reply as the second
      verse, which she has said is the only line of his she kept.
    arrangement_note: no drums anywhere — a fretted composite guitar takes the pulse instead, and the second verse is his answer sung in her own voice with the guitar dropping out under it
