    outro: fade
    target_duration: "3:40"
    prompt: >-
      52 BPM tender Purist torch ballad; low grainy female lead behind the piano, no vibrato, upright
      piano, upright bass, a fretted composite acoustic guitar carrying the pulse in place of drums,
      no percussion of any kind, guitar dropping out entirely for the second verse, fade.
    exclude: drums, brushed kit, hand percussion, keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - guitar and piano, eight seconds]

      [Verse 1]
      He has been on the freight circuit nineteen years
      and he is not a man who writes and never was.
      I send four a season and he sends back one
      and the one is always shorter than the stamp.
      I do not mind. I want that understood.
      He is where he is and he is doing well.
      But there is the lag on everything he sends me
      and by the time it lands the news has gone.
      A season is a long way to be pleased in.
      A season is a long way to be sorry.

      [Verse 2]
      Don't write, he says. It only makes it longer.
      Don't tell me about the room and who comes in.
      Every letter takes a season to catch up with me
      and lands the day I've stopped thinking about home.
      Send a card. A card is a card. A card says nothing
      except that on a Tuesday you were there.
      I read it out. That is the whole of his reply.
      That is the only line of his I kept.

      [Chorus]
      So I send him a card, and I say nothing at all.
      Weather. Work. A line about the stair.
      Everything I actually want to tell him
      I have been putting in the second set instead.

      [Verse 3]
      He came through once, four seasons back, in summer,
      stood at the bar and did not take his coat off,
      heard three numbers, said that I had got good,
      and went out on the midnight with a hauler.
      He had the manifest already in his hand.
      He did not sit down once in the whole hour.
      I did not sing this one. I had it ready.
      There is a version where I sing it and he hears it
      and neither of us would have known what to do,
      and this is not that version, and it never was.

      [Outro - guitar and piano fading]
