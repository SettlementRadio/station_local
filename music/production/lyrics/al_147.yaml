  - id: s_1190
    title: Everyone's on the Lanes
    track_number: 2
    mood: [wistful, spare, slow]
    fact: >-
      Written the week the first burn festival took the room's regulars out to the lanes, and the
      number of empty chairs in the second verse is the count Odell Prine made from behind the kit.
    arrangement_note: the count of empty chairs is sung as a plain number and the band stops dead under it, and the hand percussion is the only thing that comes back in after
    intro: 6
    outro: sustain
    target_duration: "3:45"
    prompt: >-
      50 BPM wistful spare Purist torch; low grainy female lead behind the piano, no vibrato, upright
      piano, upright bass, light hand percussion and brushes, the whole band stopping dead under one
      spoken number, sustained ending.
    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano, six seconds]

      [Verse 1]
      The first burn festival took the whole quarter
      and left us with the ones who could not go.
      Everybody with a lane job went out to it.
      Everybody with a berth was on the water.
      The rest of us are here, which is the truth of it,
      and the truth of it is not a complaint.
      Somebody has to be in the room in the empty season.
      Somebody has to keep the lamps alight.

      [Verse 2]
      He counted them from behind the kit that evening.
      Thirty-one chairs, and eleven of them down.
      He said the number afterwards quite flatly,
      the way a man says a thing he has been checking.
      The band stops dead when the number comes around
      because it is a fact and not a feeling,
      and a fact should have some quiet either side of it
      or people will mistake it for a mood.

      [Refrain]
      Everybody's out along the lane tonight.
      Everybody's where the fires are and the noise.
      I am in a warm room with eleven empty chairs
      and I would not be anywhere but here.

      [Verse 3]
      They will come back in a fortnight, sunburnt, broke,
      wanting the same table and the same hour,
      and none of them will ask what we were doing
      and none of us will tell them what it was.
      This is what it was: a slow week and a piano,
      and a woman counting chairs from behind a kit,
      and rain against a window nobody looked at,
      and the best three nights this band has ever played
      in front of almost nobody at all.

      [Refrain]
      Everybody's out along the lane tonight.
      Everybody's where the fires are and the noise.
      I am in a warm room with eleven empty chairs
      and I would not be anywhere but here.

      [Outro - hand percussion and piano sustaining]
