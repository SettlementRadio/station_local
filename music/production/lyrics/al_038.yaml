#
# **b_019's card is complete for the first time on this record.** Una Brack joined in 2604, so from
# here on the crew chorus is five voices with one woman clearly audible above the men, and the
# stripped-wire chimes are in the kit — both of which al_037 had to do without. s_0323 is the first
