  - id: s_0323
    title: Four Voices, One Line
    track_number: 4
    mood: [warm, singalong, midtempo]
    fact: >-
      Una Brack sings the top line alone here for the first time, having refused to do it on the
      band's previous record.
    arrangement_note: the woman's voice, which is normally the top of the crew chorus, takes the pre-chorus entirely alone with the band out, and the lead does not sing at all until the chorus arrives underneath her
    intro: 9
    outro: sustain
    target_duration: "4:35"
    prompt: >-
      Boogie-driven rock, 124 BPM, warm and midtempo, built to be sung back. Male lead vocal, high
      hard tenor, carrying and a shade nasal, pushing at the top of every chorus and staying there,
      plain and undecorated, no vibrato. A crew chorus of five voices in unison rather than harmony,
      mixed registers, with the woman's voice clearly above the men — and taking each pre-chorus
      entirely alone with the band out and no lead vocal anywhere near her. Two electric guitars,
      electric bass, drum kit with tuned oxygen-tank drums left ringing rather than damped,
      stripped-wire chimes. Tracked whole-band in one live covered bay with the doors open, loose
      rather than gridded, light compression. Nine seconds of chimes and bass before the first sung
      word. Ends on a held chord with all five voices on it.
    exclude: close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 9 seconds, stripped-wire chimes and bass, no vocal]

      [Verse 1]
      She has been the top of everything this band has sung since 2604
      in a bay, in a hold, on a deck, in a transfer hall,
      and you can pick her out of any chorus we have ever recorded
      and she has never once been the only person singing,
      which was a decision, and it was hers, and we let it stand.

      [Pre-Chorus - one voice alone, band out]
      I am not the singer. I am one of the singers.

      [Chorus]
      Four of us on one line, and one of them over the top of it,
      and that is the sound of this band and it always has been.
      Nobody in it is a soloist and nobody wants to be
      and we have turned down two offers that were only for one of us.

      [Verse 2]
      Last record there was a place for her to take one on her own
      and she looked at it and said no, and gave a reason,
      and the reason was that she had not been in the band long enough,
      which was eight years, and none of us knew what to say.

      [Pre-Chorus - one voice alone, band out]
      Eight years is long enough. Somebody should have said.

      [Chorus]
      Four of us on one line, and one of them over the top of it,
      and that is the sound of this band and it always has been.
      Nobody in it is a soloist and nobody wants to be
      and we have turned down two offers that were only for one of us.

      [Verse 3]
      So this year she came in and asked for one, at a meeting,
      formally, as an item, with a vote on it, which is very her,
      and it went through with nobody against and one abstention
      and the abstention was hers, on the grounds that it was about her.

      [Final Chorus - all five voices]
      Four of us on one line, and one of them over the top of it,
      and for eleven seconds in the middle of this record
      the whole crew is out of the room and the line is hers,
      and the rest of us are standing in the bay listening.

      [Outro - held chord, five voices on it]
