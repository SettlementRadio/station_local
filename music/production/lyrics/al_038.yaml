#
# Written across one ten-port run and recorded in a covered bay with the doors open. The year a core
# late-club label folded and took a booking with it is on this record twice, in two different moods,
# and neither of them is a song about a label: one is about a room full of people who lost the room,
# and the other is about who owns a thing after the person who made it has stopped.
#
# s_0325 puts four lines of a haulage contract in the middle of a song. **They are sung flat on one
# note at speaking pace, not spoken** — b_019's card excludes whispered and rapped sections, and this
# station's spoken form is deck-talk, which lane-rock is not.
