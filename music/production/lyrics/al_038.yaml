  - id: s_0325
    title: Don't Read the Contract Aloud
    track_number: 6
    mood: [wry, rowdy, fast]
    fact: >-
      Bel Corrow reads four lines of a real haulage contract in the middle of the song, chosen
      because they contradict one another.
    arrangement_note: the four contract lines are sung flat on one note at speaking pace by the bass chair with the band vamping under them, and the contradiction lands because nothing in the arrangement points at it
    intro: 5
    outro: fade
    target_duration: "4:15"
    prompt: >-
      Boogie-driven rock, 144 BPM, wry and rowdy, fast. Male lead vocal, high hard tenor, carrying
      and a shade nasal, pushing at the top of every chorus and staying there, plain and undecorated,
      no vibrato. A crew chorus of four and five voices in unison rather than harmony, mixed
      registers with one woman's voice clearly audible above the men. One passage of four lines sung
      flat on a single note at conversational speed by a second male voice, with the band vamping
      underneath — sung, never spoken and never whispered. Two electric guitars, electric bass, drum
      kit with tuned oxygen-tank drums left ringing rather than damped, stripped-wire chimes. Tracked
      whole-band in one live covered bay with the doors open, loose rather than gridded, light
      compression. Five seconds of full band before the first sung word. Fade.
    exclude: close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, spoken-word delivery, dance and electronic production
    lyrics: |
      [Intro - 5 seconds, full band, no vocal]

      [Verse 1]
      Bel has been collecting them for about eleven years
      the way other people collect something reasonable,
      and he has a folder, and the folder has tabs in it,
      and every one of the tabs is a sentence somebody wrote on purpose
      about cargo, or a hold, or an hour that went missing,
      and got paid for writing, and never had to say out loud.

      [Chorus]
      Don't read the contract aloud. It sounds worse out loud.
      On paper it is a paragraph and it goes past you.
      Say it in a bay with four people listening
      and somebody will laugh before you get to the end of it.

      [Verse 2 - flat, one note, at speaking pace, band vamping]
      The carrier shall not be liable for any delay however caused.
      The carrier shall notify the client of any delay within four hours.
      No notification shall be construed as an admission of delay.
      Time is of the essence in all matters under this agreement.

      [Chorus]
      Don't read the contract aloud. It sounds worse out loud.
      On paper it is a paragraph and it goes past you.
      Say it in a bay with four people listening
      and somebody will laugh before you get to the end of it.

      [Verse 3]
      Those four are from one page and they are all on one page
      and every one of them was read and approved by somebody
      and none of them was written to be true, they were written
      to be there in case, which is a different job entirely,
      and the person who reads it at the table is the only one
      who ever finds out which of the four is going to matter.

      [Chorus]
      Don't read the contract aloud. It sounds worse out loud.
      On paper it is a paragraph and it goes past you.
      Say it in a bay with four people listening
      and somebody will laugh before you get to the end of it.

      [Tag - all five voices, twice]
      Read it at the table. Read it out loud at the table.

      [Outro - fade]
