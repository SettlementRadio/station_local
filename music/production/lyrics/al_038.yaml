songs:
  - id: s_0320
    title: Ten Ports Out
    track_number: 1
    mood: [driving, restless, fast]
    fact: >-
      Dov Reyland wrote one verse at each of the first four ports of a single run and finished the
      rest at the fifth.
    arrangement_note: four verses before the first chorus, one for each port, and the band adds nothing at all until the chorus finally arrives more than two minutes in
    intro: 6
    outro: cold
    target_duration: "4:40"
    prompt: >-
      Boogie-driven rock, 146 BPM, driving and restless, fast. Male lead vocal, high hard tenor,
      carrying and a shade nasal, pushing at the top of every chorus and staying there, plain and
      undecorated, no vibrato. A crew chorus of four and five voices in unison rather than harmony,
      mixed registers with one woman's voice clearly audible above the men, answering the lead
      through the verses and singing the chorus as loud as he does. Two electric guitars, electric
      bass, drum kit with tuned oxygen-tank drums left ringing rather than damped, stripped-wire
      chimes. Tracked whole-band in one live covered bay with the doors open, loose rather than
      gridded, light compression. Four verses before the first chorus with nothing added to the
      arrangement across them. Six seconds of chimes and guitar before the first sung word. Cold
      stop.
    exclude: close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 6 seconds, stripped-wire chimes and guitar, no vocal]

      [Verse 1]
      First port and everybody is still being polite about the bunks
      and the food is a novelty and the run is a good idea
      and somebody has brought a thing to do in the evenings
      and everybody has agreed that they will all be doing it.

      [Verse 2]
      Second port and the thing to do in the evenings is in a locker
      and two people have stopped speaking about something from the Tuesday
      and the food is the food and the bunks are the bunks
      and there are eight ports left and nobody has said that out loud.

      [Verse 3]
      Third port and I got off the hauler and walked for two hours
      in a settlement I have been to nine times and never looked at,
      and bought nothing, and spoke to nobody, and came back on
      and felt better than I had felt for about a week.

      [Verse 4]
      Fourth port and the two who stopped speaking are speaking again
      and neither of them has any idea what the argument was
      and one of them has told me about it twice with different reasons
      and I did not correct him either time and I am not going to.

      [Chorus]
      Ten ports out and ten ports back and nine days between them
      and the whole of the crew is a different set of people by the end.
      Nobody warns you about that. They warn you about the hours.
      The hours are fine. It is the ninth day that gets you.

      [Verse 5]
      Fifth port and I wrote the rest of it in a transfer hall
      waiting for a manifest that did not come until the morning,
      and it came out in about forty minutes, all of it,
      which has happened to me four times in twenty-six years.

      [Chorus]
      Ten ports out and ten ports back and nine days between them
      and the whole of the crew is a different set of people by the end.
      Nobody warns you about that. They warn you about the hours.
      The hours are fine. It is the ninth day that gets you.

      [Final Chorus - all five voices]
      Ten ports out and ten ports back and here we still are,
      and I would not do anything else and I have tried twice.
      Ask me on the ninth day and you will get a different answer
      and the answer on the ninth day is not the true one.

      [Outro - cold stop]
