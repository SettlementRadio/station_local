  - id: s_0321
    title: The Year the Room Closed
    track_number: 2
    mood: [angry, heavy, midtempo]
    fact: >-
      The band wrote it after a late-club room cancelled their booking without notice when its label
      folded in 2612.
    arrangement_note: the crew do not answer the lead anywhere in this song until the last chorus, so the verses are one voice on his own against the band, which happens nowhere else on the record
    intro: 12
    outro: cold
    target_duration: "4:45"
    prompt: >-
      Boogie-driven rock, 118 BPM, angry and heavy, midtempo. Male lead vocal, high hard tenor,
      carrying and a shade nasal, pushing at the top of every chorus and staying there, plain and
      undecorated, no vibrato, and completely alone through every verse. A crew chorus of four and
      five voices in unison rather than harmony, mixed registers with one woman's voice clearly
      audible above the men, absent from the whole song until the final chorus. Two electric guitars,
      electric bass, drum kit with tuned oxygen-tank drums left ringing rather than damped,
      stripped-wire chimes. Tracked whole-band in one live covered bay with the doors open, loose
      rather than gridded, light compression. Twelve seconds of bass and tank drums before the first
      sung word. Cold stop.
    exclude: close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 12 seconds, bass and tank drums, no vocal]

      [Verse 1]
      We found out from a man at a gate who was not sure he should tell us
      and told us anyway, which is the only decent part of it,
      and we were four days out with a berth booked and a rate agreed
      and a room at the end of it that had already stopped existing.

      [Chorus]
      The year that room closed. It closed in an afternoon.
      Nobody who worked in it knew until the following week.
      A thing that took nineteen years to become a place
      stopped being one in the time it takes to sign something.

      [Verse 2]
      It is not our loss and I want to be clear about that.
      We lost a night and a fee and a long drive for nothing.
      The woman on the door had been on that door since 2593
      and the man who did the sound had never done anything else.

      [Chorus]
      The year that room closed. It closed in an afternoon.
      Nobody who worked in it knew until the following week.
      A thing that took nineteen years to become a place
      stopped being one in the time it takes to sign something.

      [Bridge]
      There is a settlement in the core with a good room in it
      and now there is a settlement in the core with a shut room in it,
      and the difference between those two sentences is everybody's evening.

      [Verse 3]
      We played the yard outside it in the end, for nothing, in the cold,
      about forty people, no rate, no fee, no arrangement,
      and the woman from the door stood at the front the whole time
      and did not sing and did not leave and did not say anything after.

      [Final Chorus - the crew entering for the first time]
      The year that room closed. It closed in an afternoon,
      and the whole of the settlement went and stood in the yard,
      and it is not the same, and it was not nothing either,
      and I have not been back down that lane since.

      [Outro - cold stop]
