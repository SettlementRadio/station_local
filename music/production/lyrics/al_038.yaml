  - id: s_0322
    title: Whose Catalogue Is It
    track_number: 3
    mood: [bitter, hard, brisk]
    fact: >-
      Ryke Alden wrote the riff the night the band heard a label's back catalogue had become
      disputed, and the words were added a month later.
    arrangement_note: the riff came a month before the words and the song is built to show it, opening on eight bars of the riff on its own and returning to it unaccompanied between every section
    intro: 4
    outro: cold
    target_duration: "4:20"
    prompt: >-
      Boogie-driven rock, 140 BPM, bitter and hard, brisk. Male lead vocal, high hard tenor, carrying
      and a shade nasal, pushing at the top of every chorus and staying there, plain and undecorated,
      no vibrato. A crew chorus of four and five voices in unison rather than harmony, mixed
      registers with one woman's voice clearly audible above the men. Two electric guitars, electric
      bass, drum kit with tuned oxygen-tank drums left ringing rather than damped, stripped-wire
      chimes. Tracked whole-band in one live covered bay with the doors open, loose rather than
      gridded, light compression. One riff returning unaccompanied between every section. A
      fourteen-second lead guitar break. Four seconds of the riff alone before the first sung word.
      Cold stop.
    exclude: close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 4 seconds, the riff alone, no vocal]

      [Verse 1]
      A house goes under and the records do not go anywhere.
      They sit in a room in a building nobody is paying for
      while four sets of people who have never made anything
      work out which of them is allowed to sell them,
      and the room has a rent on it that nobody is paying either,
      and one day somebody will open the door and start deciding.

      [Riff - eight bars, unaccompanied]

      [Chorus]
      Whose is it now. Go on. Say it out loud.
      Not the singer. Not the crew who played it. Not the settlement.
      Somebody in an office with a claim and a date,
      and a woman who wrote all eleven of them is not on the list.

      [Verse 2]
      Ryke came in with this on the night we heard about it
      and had no words for it and did not want any yet,
      and played it at us for about an hour without stopping
      and then put it down and did not touch it for a month.

      [Instrumental - lead guitar break, 14 seconds]

      [Chorus]
      Whose is it now. Go on. Say it out loud.
      Not the singer. Not the crew who played it. Not the settlement.
      Somebody in an office with a claim and a date,
      and a woman who wrote all eleven of them is not on the list.

      [Verse 3]
      This is why every record we make prints all of us on one line
      and why the co-operative holds the thing rather than a person,
      and it is not idealism, it is having watched it happen
      to somebody good on a lane about four hours from here,
      who is on a scrubber line now and does not talk about it.

      [Final Chorus - all five voices]
      Whose is it now. Go on. Say it out loud.
      Somebody is going to ask that about ours one day
      and the answer is going to be a page with five names on it
      and a membership of ninety who all voted for it.

      [Outro - cold stop on the riff]
