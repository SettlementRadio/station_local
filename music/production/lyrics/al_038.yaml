      on anything this band has recorded, and that is the point of it.

      [Final Chorus - both choruses at once]
      Home port eventually. Not soon and not on a date.
      He will get there. He always gets there.
      There is a run and then a turnaround and then another run
      and a light on in a hall and somebody asleep upstairs.

