  - id: s_0324
    title: Load Out in the Rain
    track_number: 5
    mood: [weary, driving, brisk]
    fact: >-
      The band kept the take in which the weather changed the sound of the covered bay halfway
      through the song.
    arrangement_note: the room changes halfway through this take because the weather did, so the second half is duller and closer than the first and no attempt was made to match them
    intro: 15
    outro: fade
    target_duration: "4:25"
    prompt: >-
      Boogie-driven rock, 134 BPM, weary and driving, brisk. Male lead vocal, high hard tenor,
      carrying and a shade nasal, pushing at the top of every chorus and staying there, plain and
      undecorated, no vibrato. A crew chorus of four and five voices in unison rather than harmony,
      mixed registers with one woman's voice clearly audible above the men. Two electric guitars,
      electric bass, drum kit with tuned oxygen-tank drums left ringing rather than damped,
      stripped-wire chimes. Tracked whole-band in one live covered bay with the doors open, and the
      room audibly changing halfway through — brighter and more open in the first half, duller and
      closer in the second, with no attempt to match them. Loose rather than gridded, light
      compression. A sixteen-second lead guitar break at the point where the room changes. Fifteen
      seconds of rain on the bay roof and one guitar before the first sung word. Fade.
    exclude: close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 15 seconds, rain on the bay roof and one guitar, no vocal]

      [Verse 1]
      Everything comes off in the order it went on and no other order,
      and the order it went on is on the manifest in somebody's coat,
      and the coat is in the cab and the cab is at the far end
      and it is raining, and there are nine hours of this.

      [Chorus]
      Load it out in the rain and do not get clever about it.
      Do it the long way. Do it the way that is written down.
      Everybody who has ever been hurt on a wet floor
      was going faster than the page said they should be.

      [Verse 2]
      There is a version of this job where you are dry and warm
      and it is a version nobody in this crew has ever met,
      and the ones who get it are not better at anything,
      they were somewhere else on the day the roster went round,
      and it is a lane and a rate and a coat and nothing else.

      [Instrumental - lead guitar break, 16 seconds, the room changing under it]

      [Chorus]
      Load it out in the rain and do not get clever about it.
      Do it the long way. Do it the way that is written down.
      Everybody who has ever been hurt on a wet floor
      was going faster than the page said they should be.

      [Verse 3]
      Halfway through this take the weather came round the bay
      and the whole room got smaller and closer and duller,
      and you can hear it happen, and we kept it, and Hess said
      that a record made in a bay ought to sound like a bay.

      [Bridge]
      Nine hours and then a plate of something and then out again.
      That is not a complaint. Somebody asked, so I am saying it.

      [Chorus - all five voices]
      Load it out in the rain and do not get clever about it.
      Do it the long way. Do it the way that is written down.
      Everybody who has ever been hurt on a wet floor
      was going faster than the page said they should be.

      [Outro - fade, the rain last]
