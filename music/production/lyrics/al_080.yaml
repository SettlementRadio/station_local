    target_duration: "4:30"
    prompt: >-
      Slow old-time dance music at an easy walking tempo, 104 BPM, tired and warm. Female lead vocal,
      clear high soprano with a hard edge, sung in short phrases, never a held note, plain and
      unornamented, tired and close. One male harmony voice a third below the lead on the chorus
      only, nothing under the verses. Bright thin-toned composite fiddle, fretted acoustic-toned
      composite guitar, upright bass, cut-stock kit brushed softly. Recorded in a studio with about
      forty people in it who are now leaving. Twelve seconds of fiddle before the first sung word.
      Over the last forty seconds the band thins to almost nothing and the sounds of a room being put
      back in order take over — chairs dragged and stacked, boots, a door, low voices — with the
      fiddle finishing quietly underneath. Long fade on the room rather than on the band.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, big finish, applause, cold ending
    lyrics: |
      [Intro - fiddle, twelve seconds]

      [Verse 1]
      That is it. That is the last one. Somebody get the door.
      There are forty people in here who came in off the street
      four hours ago for a hot drink and stayed for a record
      and are now, without anybody asking, stacking chairs.
      They have all done this before. Everybody here has.
      A room does not put itself back and it never has.

      [Chorus]
      Put the chairs back. Put the chairs back where they were.
      Somebody find the lid of the thing the kit came in.
      Nothing is finished until the room looks like a room,
      which is the last thing anybody's mother ever said.

      [Verse 2]
      Twenty-nine years of this and it always ends the same:
      four people and a cart and a berth and a cold walk.
      Not once has it ended with anybody making a speech.
      You just put the chairs back and you go and you come again.
      Except this time we are not going to come again,
      and I am not going to say that to anybody in this room.

      [Verse 3]
      Marda has the kit in the crate and the crate on the cart.
      Suli is talking to a woman about how to hold a bar back.
      Arel has that bass on his shoulder like a hold's last load
      and he is going to walk it home the way he has since seventy-eight.
      There is a man doing the chairs who has not spoken all night
      and he is doing the whole far wall on his own, quickly.

      [Chorus]
      Put the chairs back. Put the chairs back where they were.
      Somebody find the lid of the thing the kit came in.
      Nothing is finished until the room looks like a room,
      which is the last thing anybody's mother ever said.

      [Final Chorus - harmony a third below, very quiet]
      Put the chairs back and put the light out and go home.
      There will be a cart on the ice road in about ten minutes.
      Nothing is finished until the room looks like a room.
      Leave it the way you found it. That is the whole of it.

      [Outro - the room being put back in order, fiddle underneath, long fade]
