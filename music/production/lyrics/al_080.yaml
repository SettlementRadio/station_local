songs:
  - id: s_0657
    title: Rosin on Everything
    track_number: 1
    mood: [warm, midtempo, worn]
    fact: >-
      Hessa Lund plays both fiddle parts, the first time the band ever overdubbed anything, and she
      has said she would not do it again.
    arrangement_note: two fiddle parts played by the same player and audibly the same player, one carrying the tune and one a third under it, which is the only overdub anywhere in the band's catalogue and sounds slightly wrong on purpose
    intro: 14
    outro: fade
    target_duration: "4:00"
    prompt: >-
      134 BPM worn fiddle reel; hard female soprano, doubled solo fiddle, dry empty studio, soft fade.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, audience noise, hall reverb, cold ending
    lyrics: |
      [Intro - two fiddle parts, one player, fourteen seconds]

      [Verse 1]
      Hessa laid the first part down beside the little red light.
      The clean-room man asked for the same road underneath it.
      She lifted the bow again before she could say no.
      Nine minutes later both her hands came through the wall.
      One fiddle led. The second stayed a third below.
      She heard herself answer and put the instrument away.

      [Chorus]
      Rosin on everything. Rosin on the strings and the coat
      and the door handle and the cart and both my hands.
      Twenty-nine winters of it and you cannot get it off,
      which is the only honest thing in this whole building.

      [Verse 2]
      Two people breathe apart and land a little wide.
      These two bows rise together, turn together, stop together.
      No shoulder blocks the view. No boot shifts on the boards.
      Hessa knows the answer before the question leaves.
      Arel calls it clean. Marda studies both her hands.
      Suli says it sounds like one shadow under another.

      [Verse 3]
      Rosin lies white on the carpet by the chair.
      No dancer's heel will grind it into the boards.
      No freight hand arrives wet from the late berth.
      The settlement is outside and the dry wall stays still.
      Hessa steps back, but both fiddles keep their distance.
      She has never heard a room return so little.

      [Chorus]
      Rosin on everything. Rosin on the strings and the coat
      and the door handle and the cart and both my hands.
      Twenty-nine winters of it and you cannot get it off,
      which is the only honest thing in this whole building.

      [Final Chorus - harmony a third below]
      Rosin on everything, and it will not come out of wool,
      and it is on the sleeve of a coat I do not wear any more.
      I would not do that again and I am glad I did it once,
      one bow in each hand and only one hand mine.

      [Outro - fade]
