    title: Put the Chairs Back
    track_number: 8
    mood: [tired, warm, slow]
    fact: >-
      The last thing Wire and Rosin recorded, cut with the dancers still in the room, and the sound at
      the end is the hall being put back in order.
    arrangement_note: the tune winds down rather than ending and the last forty seconds have almost no band on them at all, just the room being put back in order — chairs, boots, a door — with the fiddle finishing somewhere underneath it
