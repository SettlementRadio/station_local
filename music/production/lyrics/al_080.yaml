  - id: s_0658
    title: New Hand on the Guitar
    track_number: 2
    mood: [brisk, bright, generous]
    fact: >-
      Written for Suli Orley by the band that hired her, and she plays the introduction alone because
      none of the others would record it for her.
    arrangement_note: sixteen seconds of unaccompanied guitar open the track, played by the newest member because the other three left the room rather than record it for her, and the band comes in underneath her only once she has got all the way through the figure
    intro: 16
    outro: fade
    target_duration: "3:45"
    prompt: >-
      146 BPM bright fiddle reel; hard female soprano, nervous solo guitar intro, dry studio fade.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, audience noise, hall reverb, cold ending
    lyrics: |
      [Intro - solo guitar, unaccompanied, sixteen seconds]

      [Verse 1]
      Suli learned the first four tunes after the last ferry.
      Eleven years old, one hand around a borrowed coat.
      She watched Finn's left hand from the floor beside the berth.
      At home she found the shapes on a freight-board guitar.
      Now his empty chair is waiting by the little red light.
      She puts her case beside it and does not sit.

      [Chorus]
      New hand on the guitar and the same four tunes,
      and the tunes have come out different, which we did not expect.
      Not wrong. Different. She holds a bar back
      and lets the fiddle get there first, which nobody taught her.

      [Verse 2]
      Hessa opens the corridor door and takes the others through.
      Suli stays alone with sixteen seconds to fill.
      First her thumb finds nothing. Then one bright string.
      The figure comes back from every night beside the floor.
      At the last turn Marda enters softly with the brush.
      Arel finds the bottom. Hessa lets the fiddle wait.

      [Verse 3]
      On the second pass she holds one bar behind them.
      Hessa reaches the corner first and looks around.
      Suli leaves the space exactly where she meant it.
      Marda grins. Arel turns the low note over.
      Three people who left her alone come back beneath her.
      The empty chair becomes the place where Suli stands.

      [Chorus]
      New hand on the guitar and the same four tunes,
      and the tunes have come out different, which we did not expect.
      Not wrong. Different. She holds a bar back
      and lets the fiddle get there first, which nobody taught her.

      [Final Chorus - harmony a third below, the new voice on it]
      New hand on the guitar and a new voice underneath,
      a third below, in the same place, out of a different throat.
      The girl from the Cold Harbor floor has found the first bar.
      This time the fiddle waits and lets the guitar lead.

      [Outro - fade]
