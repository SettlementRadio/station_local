  - id: s_0660
    title: Bring Them In From the Street
    track_number: 4
    mood: [fast, loud, communal]
    fact: >-
      This is the first of the four tracks recorded with dancers present, and the band would not
      begin until there were more than forty of them in the room.
    arrangement_note: the room changes completely between this track and the one before it because there are now forty people in it, and the band plays about eight beats a minute faster than it has all week as a direct result
    intro: 20
    outro: sustain
    target_duration: "4:25"
    prompt: >-
      Reel-tempo rockabilly and old-time dance music, 162 BPM, fast and loud, communal. Female lead
      vocal, clear high soprano with a hard edge, sung in short phrases between fiddle passages,
      never a held note, plain and unornamented. One male harmony voice a third below the lead on the
      chorus only, nothing under the verses. Bright thin-toned composite fiddle, fretted
      acoustic-toned composite guitar, upright bass, cut-stock drum kit played with sticks, and
      stripped-wire chimes — thin, high, irregular struck metal — well back in the mix. Recorded in a
      studio with about forty people standing and dancing in it: the room is suddenly alive, feet on
      a hard surface, voices, none of it tidy. Twenty seconds of band and the room filling before the
      first sung word. A fourteen-second fiddle break. Ends on a held chord with the room still on it.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, dry studio silence, cold ending
    lyrics: |
      [Intro - band and a room filling up, twenty seconds]

      [Verse 1]
      I told them on the Monday I would not sing another note
      into a room with nobody in it, and they thought I was negotiating.
      I was not negotiating. I had run out of things to do.
      You cannot make this music at a wall. It is not for a wall.
      So somebody from the label went out onto the street
      and came back an hour later with about forty people.

      [Chorus]
      Bring them in. Bring them in out of the cold.
      Bring them in off the road and do not ask them for anything.
      Forty is enough. Forty will hold a room.
      Under forty and you can hear yourself, and that is the end of it.

      [Instrumental - fiddle break, fourteen seconds, the room loud under it]

      [Verse 2]
      There were nine of them at first and I said no.
      There were twenty-two and I said no, and had a cup of tea.
      At forty-one Marda counted them, out loud, twice,
      and I put the fiddle up and we went straight into it.
      Listen to the difference. It is not subtle. It is not small.
      That is a band with something to be late for.

      [Chorus]
      Bring them in. Bring them in out of the cold.
      Bring them in off the road and do not ask them for anything.
      Forty is enough. Forty will hold a room.
      Under forty and you can hear yourself, and that is the end of it.

      [Verse 3]
      Half of them work a scrubber shift and came in wet.
      One of them had a full manifest under his arm all night
      and danced with it, which I would like on the record somewhere,
      so it is here: a man dancing with a hold's worth of paper.
      They were not paid. They were not asked. Nobody wrote them down.
      The label bought them one hot drink each and they stayed four hours.

      [Final Chorus - harmony a third below, the room over the top]
      Bring them in, and bring them in, and do not shut the door,
      and let it be untidy, and let somebody be wrong.
      Forty is enough. Forty will hold a room.
      That is not a rule about music. That is a rule about people.

      [Outro - held chord, the room still going]
