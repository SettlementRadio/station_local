  - id: s_0657
    title: Rosin on Everything
    track_number: 1
    mood: [warm, midtempo, worn]
    fact: >-
      Hessa Lund plays both fiddle parts, the first time the band ever overdubbed anything, and she
      has said she would not do it again.
    arrangement_note: two fiddle parts played by the same player and audibly the same player, one carrying the tune and one a third under it, which is the only overdub anywhere in the band's catalogue and sounds slightly wrong on purpose
    intro: 14
    outro: fade
    target_duration: "4:00"
    prompt: >-
      Reel-tempo rockabilly and old-time dance music, 134 BPM, warm and worn, midtempo. Female lead
      vocal, clear high soprano with a hard edge, sung in short phrases between fiddle passages,
      never a held note, plain and unornamented. One male harmony voice a third below the lead on the
      chorus only, nothing under the verses. Two bright thin-toned composite fiddle parts played by
      the same player and identical in tone — one carrying the tune, one a third underneath it,
      slightly too together to be two people. Fretted acoustic-toned composite guitar, upright bass,
      cut-stock drum kit played with brushes. Recorded in a small dry studio: close, quiet, no room
