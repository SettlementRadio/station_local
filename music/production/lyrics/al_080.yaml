  - id: s_0659
    title: The Room With No Floor
    track_number: 3
    mood: [cold, sparse, restless]
    fact: >-
      The title is what Hessa Lund called the studio, and the band left the phrase in the lyric after
      the label's engineer asked twice for it to go.
    arrangement_note: the sparsest thing on the record — the kit plays nothing but a rim through the verses and the bass is left almost alone under the second one — because the song is about a room with nothing in it
    intro: 6
    outro: sustain
    target_duration: "3:30"
    prompt: >-
      Reel-tempo rockabilly and old-time dance music, 140 BPM, cold and restless, sparse. Female lead
      vocal, clear high soprano with a hard edge, sung in short phrases between fiddle passages,
      never a held note, plain and unornamented, flat and unimpressed. One male harmony voice a third
      below the lead on the chorus only, nothing under the verses. Bright thin-toned composite
      fiddle, fretted acoustic-toned composite guitar, upright bass, and a cut-stock kit playing
      almost nothing at all — a rim click through the verses, no snare, no cymbals. The bass nearly
      alone under the second verse. Recorded in a small dry studio: close, dead, no room sound and no
      audience whatsoever. Six seconds of band before the first sung word. Ends on a held chord
      that dies almost immediately, because there is nothing in the room to carry it.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, audience noise, hall reverb, big drums, fade-out, cold ending
    lyrics: |
      [Intro - band, six seconds]

      [Verse 1]
      I have called it a lot of things in the last four days
      and the one that stuck is the room with no floor,
      which their engineer has now asked me twice to take out,
      politely, both times, and it is going to stay in.
      There is no floor. There is a covering on the ground.
      Nothing happens on it and nothing can happen on it.

      [Chorus]
      No floor. No stove. No coats. No door that will not shut.
      Nobody at the far end pretending not to dance.
      A little red light on a stand and a man behind glass
      and four people in a settlement of two hundred thousand.

      [Verse 2 - bass almost alone]
      Everything this band does, it does against a room.
      You rush because they rush. You slow because they will not.
      A tune is a negotiation with four hundred people
      and every good take we have is an argument we lost.
      Here there is nothing to lose an argument to.
      You just play it, and it is right, and it is nothing.

      [Chorus]
      No floor. No stove. No coats. No door that will not shut.
      Nobody at the far end pretending not to dance.
      A little red light on a stand and a man behind glass
      and four people in a settlement of two hundred thousand.

      [Verse 3]
      To be fair to them, and I am trying to be fair,
      you can hear the bass. You have never been able to hear the bass.
      Twenty-nine years of Arel underneath four hundred boots
      and here he is at last, plain, in the middle of the room.
      He said it was like hearing his own voice on a carrier wave.
      He said he would rather not, and then he played it beautifully.

      [Final Chorus - harmony a third below]
      No floor. No stove. No coats. No door that will not shut,
      and the best take of my life in a room I cannot stand.
      A little red light on a stand and a man behind glass,
      and it is going on the record, and so is this line.

      [Outro - held chord, dying almost at once in the dead room]
