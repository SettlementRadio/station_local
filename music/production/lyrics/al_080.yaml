      Fades.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, audience noise, hall reverb, cold ending
    lyrics: |
      [Intro - two fiddle parts, one player, fourteen seconds]

      [Verse 1]
      Twenty-nine years I have played one part at a time
      because that is what a person can do and I am a person.
      Then a man in a clean room asks would I play it again
      over the top of the one I had just played, and I said yes.
      I do not know why I said yes. I have thought about it since.
      I said yes and it took nine minutes and it is on the record.

      [Chorus]
      Rosin on everything. Rosin on the strings and the coat
      and the door handle and the cart and both my hands.
      Twenty-nine winters of it and you cannot get it off,
      which is the only honest thing in this whole building.

      [Verse 2]
      It sounds wrong. Nobody else will hear that it sounds wrong.
      It is too together. Two players are never that together.
      There is a gap between two people that you can hear
      and there is no gap in this, and the gap is the band.
      Arel says it is fine. Arel says nobody will know.
      Marda has not said anything and Marda is the one who is right.

      [Verse 3]
      The floor is not here. That is the whole difference.
      There is no floor here, there is a carpet and a wall,
      and four hundred people are what we have played against
      since before the settlement had a berth worth the name.
      You cannot rush against a carpet. You cannot arrive late.
      Everything we know how to do is a thing this room removes.

      [Chorus]
      Rosin on everything. Rosin on the strings and the coat
      and the door handle and the cart and both my hands.
      Twenty-nine winters of it and you cannot get it off,
      which is the only honest thing in this whole building.

      [Final Chorus - harmony a third below]
      Rosin on everything, and it will not come out of wool,
      and it is on the sleeve of a coat I do not wear any more.
      I would not do that again and I am glad I did it once,
      and there is one of me on this and there should be one of me.

      [Outro - fade]
