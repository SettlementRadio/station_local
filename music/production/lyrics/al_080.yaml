  - id: s_0658
    title: New Hand on the Guitar
    track_number: 2
    mood: [brisk, bright, generous]
    fact: >-
      Written for Suli Orley by the band that hired her, and she plays the introduction alone because
      none of the others would record it for her.
    arrangement_note: sixteen seconds of unaccompanied guitar open the track, played by the newest member because the other three left the room rather than record it for her, and the band comes in underneath her only once she has got all the way through the figure
    intro: 16
    outro: fade
    target_duration: "3:45"
    prompt: >-
      Reel-tempo rockabilly and old-time dance music, 146 BPM, brisk and bright, generous. Female
      lead vocal, clear high soprano with a hard edge, sung in short phrases between fiddle passages,
      never a held note, plain and unornamented. One male harmony voice a third below the lead on the
      chorus only, nothing under the verses. Opens with sixteen seconds of solo fretted
      acoustic-toned composite guitar, completely unaccompanied, slightly nervous, before anything
