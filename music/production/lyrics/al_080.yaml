# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# The band's last record and the only one made in a studio, which is the argument of the whole
# thing. Twenty-nine years of refusing a room with no floor in it, and then a room with no floor in
# it. **The record splits in two and the prompts split with it**: s_0657, s_0658, s_0659 and s_0662
# are dry, close and empty, with no crowd anywhere; s_0660, s_0661, s_0663 and s_0664 are the four
# tracks the wiki says the dancers were brought in for, and the room comes back on them. The wiki
# calls this the quietest thing the band made, so every tempo here sits under al_079's, which sat
# under al_078's.
#
# Finn Derrow has been gone three years and Suli Orley has the guitar chair. The harmony voice is
# still one voice a third below the lead from the guitar chair, which is what the card says and what
# the line-up still supplies — a different person singing the same part, not a new part.
#
# **s_0657 is the only overdub in the band's life** and the wiki says so; it is written as an
# admission rather than as a technique. Three of the eight take a fiddle break, which is b_037's
# break instrument on every record. `generation:` and every `take:` were filled from the dispatch manifest at M-33.

