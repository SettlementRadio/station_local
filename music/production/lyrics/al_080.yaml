  - id: s_0663
    title: Nobody Asked Us to Stop
    track_number: 7
    mood: [fast, defiant, bright]
    fact: >-
      Talla Venn plays second guitar against Suli Orley and the two parts were cut facing each other
      in one take with no separation.
    arrangement_note: two guitars audibly in the same small space with no separation between them, each bleeding into the other's microphone, playing against each other rather than in unison, and the fiddle break sits on top of both
    intro: 8
    outro: cold
    target_duration: "4:05"
    prompt: >-
      166 BPM bright two-guitar reel; hard female soprano, crowded room, fiddle break, cold stop.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, clean channel separation, fade-out
    lyrics: |
      [Intro - two guitars, eight seconds]

      [Verse 1]
      Nobody shut a hall or took the cart away.
      No ferry left us standing with the cases on the berth.
      The winter books still carry nights we could have taken.
      Three more thaws are marked beside the four old names.
      Hessa drew one line beneath the final date.
      Marda read it once and put her wrist upon the table.
      Arel brought the coats. Suli brought the cases.
      No one told us to stop. We chose the place ourselves.

      [Chorus]
      Nobody asked. Nobody closed the door.
      The floor is full and every night book has a space.
      Mark the final thaw while all four hands are steady.
      Leave before the keeper has to lower down the lights.

      [Verse 2]
      Talla Venn came off the ferry with a scarred guitar.
      Suli set her newer one three feet across.
      They faced each other where forty dancers made a ring.
      Talla struck low. Suli answered near the bridge.
      Neither moved aside and neither found a unison.
      Two guitars filled the little space between their boots.

      [Instrumental - fiddle break over both guitars, twelve seconds]

      [Bridge]
      The winter book stays open on a chair beside the wall.
      A dancer turns the page beyond the final marked thaw.
      Hessa turns it back. Marda counts the room in.

      [Verse 3]
      At the fast turn Marda's wrist falls half a beat.
      She catches it, but Hessa sees the hand go down.
      Arel misses nothing. Suli drives the dancers wider.
      Talla laughs across the strings and takes the turn again.
      Three more years. Two more thaws. The dates stay marked.
      Tonight the whole floor moves and nobody is being kind.
      Hessa looks at Marda. Marda gives the count.
      Nobody asked, and all five strike the ending.

      [Final Chorus - harmony a third below]
      Nobody asked. Nobody closed the door.
      Three more years are waiting in the winter book.
      Mark the final thaw while all four hands are steady.
      Forty people dance straight through the line.

      [Outro - cold stop]
