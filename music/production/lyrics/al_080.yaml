      Slow old-time dance music at walking pace, 96 BPM, warm and weathered. Female lead vocal, clear
      high soprano with a hard edge, sung in short phrases, never a held note, plain and
      unornamented, close and tired. One male harmony voice a third below the lead on the chorus
