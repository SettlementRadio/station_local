  - id: s_0662
    title: Twenty-Nine Winters
    track_number: 6
    mood: [slow, warm, weathered]
    fact: >-
      Arel Tocke's bass is the instrument he built in 2578 and it is audibly failing, which the band
      decided to record rather than repair.
    arrangement_note: the bass buzzes and drops notes audibly all the way through and is deliberately the loudest thing in the mix, because the instrument coming apart is the subject rather than a fault in the take
    intro: 18
    outro: sustain
    target_duration: "4:40"
    prompt: >-
      96 BPM weathered old-time folk; hard female soprano, failing upright bass loud, dry held ending.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, clean bass tone, audience noise, fast tempo, cold ending, fade-out
    lyrics: |
      [Intro - bass and fiddle, eighteen seconds]

      [Verse 1]
      He made it out of drum stock in the yard behind the shed
      in the first year, because there was no bass and no money,
      and he has repaired it eleven times with what came to hand
      and the eleventh repair was four winters ago and it was the last one.
      It buzzes now. It drops a note if you ask it for a low one.
      There is something loose inside it that nobody can find.

      [Chorus]
      Twenty-nine of them, and a box made out of stock,
      and every dance this band has played has come out of that box.
      He will not have it mended. He has been very clear.
      He said mend it and it is a different instrument.

      [Turnaround - bass alone, four bars]

      [Verse 2]
      They brought a new bass through on the morning relay.
      Clean bridge, straight neck, core wood without a scar.
      Arel played one scale and thanked them properly.
      Then he crossed the berth yard and opened up the cart.
      His old box buzzed before he put a hand on it.
      He carried that one in and left the new one wrapped.

      [Verse 3]
      The lowest note dies halfway through the first bar.
      Arel moves the next one higher without looking down.
      Something in the body rattles when Marda uses brushes.
      Suli leaves the bottom open and Hessa takes the top.
      Nobody reaches for a tool between the verses.
      The loose piece finds the beat and stays there to the end.

      [Chorus]
      Twenty-nine of them, and a box made out of stock,
      and every dance this band has played has come out of that box.
      He will not have it mended. He has been very clear.
      He said mend it and it is a different instrument.

      [Final Chorus - harmony a third below, very quiet]
      Twenty-nine of them, and a box made out of stock,
      and a man who built the thing he has stood behind all his life.
      He said mend it and it is a different instrument,
      so let the last note buzz and let it die itself.

      [Outro - one held bass note, buzzing, dying early]
