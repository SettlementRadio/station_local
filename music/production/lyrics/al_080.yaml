    lyrics: |
      [Intro - two guitars, eight seconds]

      [Verse 1]
      Twenty-nine years and not one person ever said stop.
      No label folded on us. No hall shut its doors.
      Nobody died and nobody had a falling out that held.
      No hall on this coast has shut a door on us,
      and no freight crew has ever once asked us to leave.
      One man left over money and one woman took his chair.
      We are going to finish because we have decided to,
      which is a rarer way for a band to end than you would think.

      [Chorus]
      Nobody asked. Nobody wrote and nobody came round.
      There was no last dance that anybody knew was the last.
      There is just a point where you have had a good run
      and the next thing to do is stop having it,
      before somebody in a hall has to be kind about you.

      [Verse 2]
      Talla Venn came off a ferry with a scarred guitar
      he has been repairing between other people's records for thirty years,
      and they put him in the same three feet of air as Suli
      with no screen and no separation and one take.
      You can hear them in each other's microphones the whole way.
      That is not a mistake. That is two people in a room.

      [Instrumental - fiddle break over both guitars, twelve seconds]

      [Verse 3]
      There is a version of this band that carries on to the end
      and gets slower every thaw and nobody ever says it,
      and plays a hall on a Tuesday to about thirty people,
      and dies in a room somewhere with somebody's grandchild in it,
      and I have thought about it and I do not want it,
      and Marda's wrist has thought about it and it agrees.
      Three more years. Two more thaws. We have said so out loud.
      Nobody asked, and we are stopping anyway.

      [Final Chorus - harmony a third below]
      Nobody asked. Nobody wrote and nobody came round.
      No fold, no fire, no argument, no ice.
      There is just a point where you have had a good run,
      and forty people in this room are dancing through it.

      [Outro - cold stop]
