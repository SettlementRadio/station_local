    lyrics: |
      [Intro - guitar and fiddle disagreeing, ten seconds]

      [Verse 1]
      She has a version of this that is not the one we play
      and she got it off the floor of the exchange hall as a child
      from a band that is not us, playing it wrong, in about ninety-one,
      and she has never once been told and never once found out.
      There is a bar in the second turn where she goes up
      and every one of us goes down, and she is right.

      [Chorus]
      Every tune this settlement has, somebody learned it standing up.
      Nobody wrote it down. Nobody could have.
      A tune off a floor is a tune that has been through people,
      and people put their hands on it, and that is not damage.

      [Verse 2]
      I have played this since before she was born and I am wrong.
      I have been wrong for about eighteen years, cheerfully.
      Somewhere between a hall and a cart and a hall again
      the second turn came off it and nobody noticed but her.
      I said so, in front of the band, which cost me something,
      and Arel laughed for a full minute and had to sit down.

      [Instrumental - fiddle break, sixteen seconds, playing the guitar's version]

      [Verse 3]
      So the break is her version played on my instrument
      which is as close to an apology as a fiddle can get.
      She will not take the credit and there is no credit to take.
      It is not hers either. It belongs to a room full of people
      who have been carrying it about between them for forty years
      the way a freight crew carries anything: badly, and it arrives.

      [Final Chorus - harmony a third below]
      Every tune this settlement has, somebody learned it standing up,
      and half of them are wrong, and the wrong ones are the good ones.
      A tune off a floor is a tune that has been through people.
      Play it her way. Everybody else is going to.

      [Outro - fade]
