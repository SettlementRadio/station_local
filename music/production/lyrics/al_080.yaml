    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, audience noise, hall reverb, cold ending
    lyrics: |
      [Intro - solo guitar, unaccompanied, sixteen seconds]

      [Verse 1]
      There is a young woman in the room who took a chair
      that had one man in it for twenty-six years.
      She did not audition. Nobody asked her to.
      She already knew every tune we have, off the floor,
      because she was on that floor from about the age of eleven,
      between the ration store and the berth and the long night
      and she has been learning this band for longer than she has been in it.

      [Chorus]
      New hand on the guitar and the same four tunes,
      and the tunes have come out different, which we did not expect.
      Not wrong. Different. She holds a bar back
      and lets the fiddle get there first, which nobody taught her.

      [Verse 2]
      We wrote this for her and then we would not play the front of it.
      All three of us went out to the corridor and left her there.
      That is not cruelty. That is the only way anybody learns
      that a room with a light on is not going to bite them.
      She sat there for a minute and thirty seconds not playing
      and then she played it, and it is the take you can hear.

      [Verse 3]
      Finn left over money, which is what people leave over.
      A run of dances got cancelled and the cancellation got paid
      to somebody who was not us, and he asked, and it got worse,
      and he went, and none of us has managed to say it plainly since.
      She is not a replacement. She is a different band.
      That is what happens and we are too old to pretend otherwise.

      [Chorus]
      New hand on the guitar and the same four tunes,
      and the tunes have come out different, which we did not expect.
      Not wrong. Different. She holds a bar back
      and lets the fiddle get there first, which nobody taught her.

      [Final Chorus - harmony a third below, the new voice on it]
      New hand on the guitar and a new voice underneath,
      a third below, in the same place, out of a different throat.
      There is a woman off the Cold Harbor floor in this band now
      and she will still be doing this when the rest of us are not.

      [Outro - fade]
