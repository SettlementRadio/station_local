  - id: s_0659
    title: The Room With No Floor
    track_number: 3
    mood: [cold, sparse, restless]
    fact: >-
      The title is what Hessa Lund called the studio, and the band left the phrase in the lyric after
      the label's engineer asked twice for it to go.
    arrangement_note: the sparsest thing on the record — the kit plays nothing but a rim through the verses and the bass is left almost alone under the second one — because the song is about a room with nothing in it
    intro: 6
    outro: sustain
    target_duration: "3:30"
    prompt: >-
      140 BPM sparse fiddle reel; hard female soprano, rim clicks, near-solo bass, dead studio room.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, audience noise, hall reverb, big drums, fade-out, cold ending
    lyrics: |
      [Intro - band, six seconds]

      [Verse 1]
      Hessa called it the room with no floor on Monday.
      The engineer stopped winding cable and looked up.
      On Tuesday he asked if she could lose that line.
      On Wednesday he asked again and shut the glass door.
      Hessa put both boots flat upon the carpet.
      Nothing answered either heel. She kept the line.

      [Chorus]
      No floor. No stove. No coats. No door that will not shut.
      Nobody at the far end pretending not to dance.
      A little red light on a stand and a man behind glass
      and four people in a settlement of two hundred thousand.

      [Verse 2 - bass almost alone]
      Marda taps the rim and waits for boots beneath it.
      Suli holds one bar for somebody coming late.
      Hessa lifts the turn toward coats that are not there.
      Only Arel answers from the centre of the carpet.
      His bass fills every space the dancers used to take.
      Four people finish clean and nobody moves.

      [Chorus]
      No floor. No stove. No coats. No door that will not shut.
      Nobody at the far end pretending not to dance.
      A little red light on a stand and a man behind glass
      and four people in a settlement of two hundred thousand.

      [Verse 3]
      Arel hears each finger landing on the string.
      Twenty-nine years beneath a storm of boots,
      then every scrape arrives alone behind the glass.
      He says it sounds like his voice on a carrier wave.
      He asks them once to move the bass away.
      They leave it where it is. He plays the next verse softer.

      [Final Chorus - harmony a third below]
      No floor. No stove. No coats. No door that will not shut,
      one rim, one bass, four boots upon the carpet.
      The little red light dies. The held chord dies before it.
      Hessa names the room once more and leaves the line.

      [Outro - held chord, dying almost at once in the dead room]
