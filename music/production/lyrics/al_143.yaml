# al_143 — Somebody Sent Us This · The Ninefoot Cut (b_063) · Relay Road Import · 2624 · 7 songs · album
#
# Written by M-25. **The file shape is fixed by al_001.yaml — read that header once.** Production
# vocabulary (COMMISSION.md §8): never enters the wiki, never said on air. Lyrics written by hand;
# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# Cut in 2621 and issued at the road head in 2624, because the first copy was in the crate that went
# astray in 2622 and very nearly closed the house. **It is the only record in the importer's list on
# which the road ran both ways**: Relay Road Import had, in 2619, sent something up the road for once
# — a Shore Rounds pressing with no letter and no name on the sleeve — and the Ninefoot Cut spent a
# season finding out whose it was and then learned one of the rounds off it. `s_1164` is the arrival
# and `s_1165` is the round, sung the way five lock-crew people sing rather than the way a Titan yard
# does: **all five come in together where b_047 come in a bar apart, and the lyric says so.**
#
# **`s_1167` was written before the fact it now carries.** The band's own copy was lost in the 2622
# crate; the song was finished in 2621 and is about second copies in general, because a thing that
# goes down a canal is a thing you may not see again inside a year. Nothing in the lyric knows what
# happened, and nothing in it should: the record was cut two years before the crate went.
#
# Effa Lomm has written that she would like to hear this record and has not been sent one, which is
# the last verse of `s_1165` and the last verse of `s_1170`.
#
# `generation:` and every `take:` are empty until M-34.

