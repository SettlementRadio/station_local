    lyrics: |
      [Intro - full band, eight seconds]

      [Verse 1]
      Four boats tie along the top pound evening,
      canvas folded, cargo made secure.
      Someone starts a tune across the water,
      someone else replies from near the door.
      Warm air carries onion from the kitchen,
      boots collect like driftwood on the step.
      No one asks which freight crew has permission.
      No one counts how many chairs are left.

      [Chorus]
      Leave the gate open, leave the front door wide.
      If a voice comes off the water, bring that voice inside.
      There is room beside the kettle, there is bread upon the board.
      Nobody is checking who the evening is for.

      [Verse 2]
      One deck hand sings sharp above the others.
      One comes late and never finds the key.
      Someone's child keeps time against a bucket;
      someone laughs so hard she loses three.
      The relay road can carry perfect copies,
      names aligned and every minute planned.
      Here a chorus reaches through an open doorway,
      rough enough to fit each passing hand.

      [Chorus]
      Leave the gate open, leave the front door wide.
      If a voice comes off the water, bring that voice inside.
      There is room beside the kettle, there is bread upon the board.
      Nobody is checking who the evening is for.

      [Verse 3]
      Near midnight, mist lies low across the towpath.
      Berth lamps make long ladders in the stream.
      Morning takes the haulers toward the basin;
      tonight their tired crews have nowhere else to be.
      We carry different weather in our jackets,
      different ports and debts and reasons home.
      But every stranger knows the final answer:
      keep the fire, pass the cup, and take the room.

      [The Crews - nine or ten voices outside, ragged and unpitched]
      LEAVE THE GATE OPEN. LEAVE THE FRONT DOOR WIDE.
      IF A VOICE COMES OFF THE WATER, BRING THAT VOICE INSIDE.

      [Final Chorus]
      Leave the gate open, leave the front door wide.
      If a voice comes off the water, bring that voice inside.
      There is room beside the kettle, there is bread upon the board.
      Mind the step and join us. That is what the doorway is for.

      [Outro - cold stop]
