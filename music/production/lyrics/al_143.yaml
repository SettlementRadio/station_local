    exclude: staggered or canon entries, round or fugue entries a bar apart, slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern studio production, cold ending, fade-out
    lyrics: |
      [Intro - concertina, seven seconds]

      [Verse 1]
      The tune came folded in with foreign weather,
      four clean voices entering one by one.
      We tried to leave a bar between our breathing,
      lost the second entrance, missed the third.
      Five lock workers know one kind of singing:
      catch the line together, hold it fast.
      So we met upon the same first syllable,
      shoulder close, and let the order pass.

      [Round - all five enter together, never staggered]
      Take the tune they carried and lift it as we can.
      All five voices on the beat, no voice behind another.
      Words may cross the lag in their first clothing;
      songs come home wearing the hands that hold them.

      [Verse 2]
      We sang it hauling sacks across the towpath,
      sang it tying canvas over grain.
      Every freight crew bent the ending sideways;
      every child put daylight in the phrase.
      No one kept the distant shape unbroken.
      Nothing living travels without marks.
      Cargo takes the salt of every harbor;
      melody takes breath from every heart.

      [Round - all five enter together, never staggered]
      Take the tune they carried and lift it as we can.
      All five voices on the beat, no voice behind another.
      Words may cross the lag in their first clothing;
      songs come home wearing the hands that hold them.

      [Bridge]
      Let their cold hall answer line by line there.
      Let our lock house meet upon the one.
      Different rooms can keep the same small fire,
      neither one required to become the other.

      [Verse 3]
      We sent our version outward with the flour,
      no apology tied beneath the string.
      Maybe someone near that distant siding
      hears five voices land where one should begin.
      Maybe she will laugh and call it clumsy.
      Maybe she will teach it to her crew.
      Then the road will carry back an answer,
      changed again and twice as plainly true.

      [Final Round - all five together, held at the end]
      Take the tune they carried and lift it as we can.
      All five voices on the beat, no voice behind another.
      If the relay brings it home remade again,
      we will learn the change and sing it all together.

      [Outro - sustain]
