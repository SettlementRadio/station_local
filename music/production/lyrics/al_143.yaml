  - id: s_1166
    title: Nine Foot of Water
    track_number: 3
    mood: [dry, funny, brisk]
    fact: >-
      Fenna Crole gives the cut its depth in the first line and the navigation office wrote to the
      band to say that it is nine foot six.
    arrangement_note: the office's reply is read flat by one voice with the band out of it, in the same place and the same manner as the leaflet they sent about the leaking gate
    intro: 5
    outro: cold
    target_duration: "3:30"
    prompt: >-
      104 BPM dry blues; high female lead, low harmonies, flat spoken letter, band out, concertina, stop.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, fade-out
    lyrics: |
      [Intro - full band, five seconds]

      [Verse 1]
      Everyone calls this the Ninefoot water,
      every painted hauler wears the word.
      Children learn it pointing from the footbridge;
      freight crews use it when the locks run slow.
      Then an office letter crossed the basin,
      dry as dust and measured to the inch.
      Our familiar depth had grown while reading,
      six spare inches no one here had missed.

      [Chorus]
      Nine feet deep when the kettle's boiling,
      nine feet deep when the cargo clears.
      Keep your extra half foot in the ledger;
      local water does not need it here.

      [Office Letter - one flat voice, band silent]
      We write to clarify the navigable measure.
      The stated depth is nine feet and six inches.
      Please amend all future correspondence.

      [Verse 2]
      I thanked them for the useful correction,
      asked about the bottom gate instead.
      Back there came a leaflet on consultation,
      closing three full months before I read.
      Somewhere forms are moving without water,
      every box aligned and every margin sound.
      Here we push a pole through summer shallows,
      finding silt their figures never found.

      [Chorus]
      Nine feet deep when the kettle's boiling,
      nine feet deep when the cargo clears.
      Keep your extra half foot in the ledger;
      local water does not need it here.

      [Bridge]
      A loaded hold draws less than half the channel.
      A hidden bank can catch it just the same.
      Numbers tell you what the cut was built for;
      boatmen tell you where the bottom changed.

      [Verse 3]
      Come at dawn and bring the proper ruler.
      Walk the long pound slowly in your boots.
      Measure every shoal below the willow,
      every bicycle and sunken root.
      When your clean six inches meet the mud there,
      write the silt in language offices use.
      We will keep the old name on the signboard,
      and save the half foot for more urgent news.

      [Final Chorus]
      Nine feet deep when the kettle's boiling,
      nine feet deep when the cargo clears.
      Keep your extra half foot in the ledger;
      send someone who knows why water disappears.

      [Outro - cold stop]
