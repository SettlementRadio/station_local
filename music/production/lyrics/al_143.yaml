  - id: s_1169
    title: Who Taught You That
    track_number: 6
    mood: [warm, generous, midtempo]
    fact: >-
      Wenna Ferrin learned the concertina from a woman on the next boat who would not play a tune
      twice, and this is the one tune she went back and asked for three times.
    arrangement_note: the concertina opens alone and plays the tune it was taught, and the rest of the band come in underneath it rather than round it, which is the only track where they do
    intro: 10
    outro: fade
    target_duration: "3:55"
    prompt: >-
      92 BPM warm blues; plain concertina intro, high female lead, low harmonies, guitar, piano, fade.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, ornamented or virtuoso concertina, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - concertina alone, ten seconds]

      [Verse 1]
      The woman on the next boat played at sundown,
      one plain tune while cargo lines were tied.
      Ask again and she would choose another,
      leave the first one drifting with the tide.
      She had work before the upper lock gate,
      no spare hour to school a waiting hand.
      I went back three evenings for the same phrase,
      each time losing where the turn should land.

      [Chorus]
      Who taught you that, and where is she now?
      Did you thank her while the berth lines held?
      Play it twice before the last boat leaves us;
      memory is water carried without pails.

      [Verse 2]
      She kept no paper folded in the casework,
      read no marks and wrote no measure down.
      If your fingers miss it, take the next one;
      there are more tunes than nights in any town.
      I called that generous when I caught the opening,
      called it cruel whenever I lost the end.
      Now I hear both truths inside the breathing:
      music is a gift that will not wait.

      [Chorus]
      Who taught you that, and where is she now?
      Did you thank her while the berth lines held?
      Play it twice before the last boat leaves us;
      memory is water carried without pails.

      [Verse 3]
      Her old hauler rests beside the sea end,
      deck boards roofed and hold turned into store.
      No one knows which lane or settlement took her,
      whether she still plays from boat to shore.
      Four young hands can carry all she left here,
      each one bending something in the tune.
      When a stranger asks who first began it,
      we point down the cut beneath the moon.

      [Final Chorus]
      Who taught you that, and where is she now?
      Did you thank her while the berth lines held?
      Play it twice and let the next hand change it;
      gratitude is keeping what was freely sent.
      If she hears it somewhere past the basin,
      may she know one evening traveled well.

      [Outro - fade]
