  - id: s_1164
    title: Somebody Sent Us This
    track_number: 1
    mood: [bright, warm, midtempo]
    fact: >-
      The record the importer sent to the lock house in 2619 arrived with no letter and no name on the
      sleeve, and the band wrote to the road head and waited a season to find out whose it was.
    arrangement_note: the concertina and the guitar open together and stay together, which is this band sounding like itself deliberately at the start of a record about somebody else's
    intro: 9
    outro: fade
    target_duration: "3:45"
    prompt: >-
      98 BPM bright blues; high female lead, low harmonies, guitar-concertina unison, piano, bass, fade.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - concertina and guitar, nine seconds]

      [Verse 1]
      A parcel rode beneath the winter cargo,
      wrapped in river paper, tied with blue.
      No return mark hid below the binding,
      no short letter told us what to do.
      When we opened it, four distant voices
      crossed a cold hall one by one in time.
      None of us had heard that kind of weather,
      none could name the water in the rhyme.

      [Chorus]
      Somebody sent us this across the lag,
      sent no name and asked no answer back.
      Let the relay lose the hand that started it;
      what arrived has found the room it lacked.

      [Verse 2]
      Every night we set the kettle boiling,
      let those voices enter line by line.
      We guessed a yard beneath a distant moonlight,
      guessed the workers leaving after nine.
      Freight crews stopped and listened from the doorway.
      One said those vowels came from farther out.
      We added concertina where none sounded,
      gave the empty spaces our own ground.

      [Post-Chorus]
      A gift can lose its sender in the between
      and still know exactly where to land.

      [Middle Eight]
      Maybe it was sent by someone lonely,
      maybe by a clerk who loved the sound.
      Maybe no one chose this little lock house;
      water simply turned the parcel round.
      Chance can be a hand without a body,
      giving what it never meant to give.

      [Verse 3]
      Seasons later, news came with a hauler:
      four night workers, one wide answering room.
      By then every rise lived in our breathing,
      every pause had gathered local dust.
      We sent thanks along the relay road then,
      though the proper words were years behind.
      Somewhere strangers may unfold our paper,
      hearing their own weather changed by mine.

      [Chorus]
      Somebody sent us this across the lag,
      sent no name and asked no answer back.
      Let the relay lose the hand that started it;
      what arrived has found the room it lacked.

      [Outro - fade]
