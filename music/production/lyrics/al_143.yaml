  - id: s_1167
    title: The Second Copy
    track_number: 4
    mood: [patient, wry, steady]
    fact: >-
      Written about the crate that went astray in 2622 with the band's first copy in it, and finished
      before anybody had told them the crate was gone.
    arrangement_note: written in 2621 about second copies in general and about no crate in particular, and nothing in the words knows what was going to happen to this record's own
    intro: 12
    outro: fade
    target_duration: "3:55"
    prompt: >-
      84 BPM patient blues; high female lead, low harmonies, piano, guitar, concertina, dry bass, fade.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano and guitar, twelve seconds]

      [Verse 1]
      Two lock keys hang beside the doorway,
      two gate books sleep above the shelf.
      One pump handle works the lower chamber;
      one stays wrapped against the day it fails.
      My grandmother kept doubles of the useful,
      taught my mother, who passed the rule to me:
      anything sent outward with the cargo
      may spend a year becoming memory.
      That rule made the cupboards feel like lifeboats,
      every spare a wall against the dark.

      [Refrain]
      Keep one safe against the missing.
      Keep one dry above the flood.
      Hands are careful, roads are honest;
      distance loses what it could.

      [Verse 2]
      Every crate meets rain and hurried counting,
      every manifest meets one tired eye.
      Relay roads have bends no map can straighten,
      last ferries leave while labels still are wet.
      I make a second letter before sealing,
      press the same blue flower into both.
      One may reach the friend who waits beyond us.
      One may prove the words existed here.
      I copied even jokes beneath the margin,
      fearing laughter might be one of one.

      [Bridge]
      But there was only one red scarf my mother
      wore through every storm season of my youth.
      I kept no second laugh inside a cupboard,
      no spare hand to show me what to do.

      [Verse 3]
      So I know the comfort and the error:
      shelves can guard a tool, a page, a key.
      They cannot keep a person from departing,
      cannot make one winter happen twice.
      Still I wrap the duplicate in paper,
      mark the year and set it out of sun.
      Fear may never need the thing it saves there;
      love is knowing which things come as one.

      [Refrain]
      Keep one safe against the missing.
      Keep one dry above the flood.
      Send the first along the water;
      trust the many careful hands it meets.

      [Outro - fade]
