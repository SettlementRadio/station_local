  - id: s_1168
    title: The Same Eleven Miles
    track_number: 5
    mood: [slow, plain, fond]
    fact: >-
      Torr Bexley has worked the same eleven miles since 2598, and the song lists what has changed on
      them in order and ends on nothing.
    arrangement_note: the list is sung flat over the piano alone three times and is the same list each time, because it is short and that is the whole finding of the song
    intro: 16
    outro: sustain
    target_duration: "4:20"
    prompt: >-
      70 BPM plain blues; female lead, low harmonies, flat piano list repeated thrice, concertina, hold.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, cold ending, fade-out
    lyrics: |
      [Intro - piano and concertina, sixteen seconds]

      [Verse 1]
      I have walked this water since my shoulders
      reached the towline hanging from the bow.
      Every bend is waiting in my footsteps,
      every bridge tells weather by its sound.
      Ask me what has changed and I say nothing.
      Ask again and set the paper down.
      Small things rise like silt beneath the surface,
      enough to shift a hauler off its line.

      [The List - one flat voice over piano alone]
      The eleventh lock. The towpath lamps gone.
      Two houses empty. One family home.
      A new berth number. The bridge rail mended.
      The same rain finding the same old stone.

      [Verse 2]
      Children who once waved from upper windows
      bring their own freight crews around the turn.
      One shop closed and left its faded lettering;
      one new kettle burns where coal once burned.
      Cargo lists arrive on thinner paper.
      Rope is better, winter just as long.
      Nothing changed enough to call a meeting;
      everything has changed enough to belong.

      [The List - one flat voice over piano alone]
      The eleventh lock. The towpath lamps gone.
      Two houses empty. One family home.
      A new berth number. The bridge rail mended.
      The same rain finding the same old stone.

      [Bridge]
      Change is not a gate that opens once there.
      It is wear beneath the hand from daily use.
      Stand away and decades look like stillness;
      stay, and every morning brings the proof.

      [Verse 3]
      I have left these miles for eleven mornings,
      came back knowing distance made them strange.
      The lane looked narrow, houses leaned together,
      water held a color without name.
      Soon another worker will count longer,
      add my absence somewhere on the page.
      I will say the cut remains as ever,
      then recite the little weight of change.

      [The List - one flat voice over piano alone]
      The eleventh lock. The towpath lamps gone.
      Two houses empty. One family home.
      A new berth number. The bridge rail mended.
      The same rain finding the same old stone.

      [Outro - sustain]
