  room: >-
    The lock house front room, three days of it, with the front door open on to the top pound for the
    last track. Small wooden room, water and stone behind everything, one or two microphones, nothing
    overdubbed, bass still deadened with rope. The card holds throughout: light high female lead sung
    quietly, two close harmonies under her, concertina. Two things are this record's own. s_1165 is
    another band's round learned off a record and sung wrong on purpose — all five voices entering
    together rather than a bar apart — and the prompt asks for exactly that, because a generator given
    the word "round" will otherwise stagger the entries. And the last chorus of s_1170 is nine or ten
    people off the boats tied up outside the open door, ragged and unpitched, who had started singing
    before the band did.

