  - id: s_0679
    title: Last Set Before the Whistle
    track_number: 8
    mood: [fast, urgent, communal]
    fact: >-
      The shift whistle sounds forty seconds before the end and the band played through it rather than
      stop, which is why the take was kept.
    arrangement_note: a real shift whistle sounds forty seconds before the end and none of the four players stops or acknowledges it, so the last forty seconds are the band and a very loud building signal happening at the same time
    intro: 8
    outro: sustain
    target_duration: "4:25"
    prompt: >-
      170 BPM urgent jump-reel; dry male tenor, shift whistle over final 40 seconds, held ending.
    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, cold ending, fade-out
    lyrics: |
      [Intro - band, eight seconds]

      [Verse 1]
      There is a whistle in this settlement that has gone at the same minute
      for about a hundred and forty years without missing one,
      and every person in Forge can tell you what it means
      and none of them has ever needed to be told.
      It goes out over the yard and the rack and the loading deck.
      It is not a warning. It is not an alarm. It is a time.
      Tonight it found us halfway through the quickest turn we had.

      [Chorus]
      The last set of the night, and the whistle does not wait.
      Play it through. Play it through. Nobody stops.
      There is a shift coming in that door in eleven minutes
      and there is about a minute of this left and it is ours.

      [Instrumental - fiddle break, fourteen seconds]

      [Verse 2]
      Bree did not look up. Toller did not look up.
      Orsa had a note going and he kept it going.
      And I sang a whole verse into a signal that is louder
      than anything four people with instruments can produce,
      felt the deck plates answer underneath my heels,
      lost every other word and drove the fiddle harder.
      Bree saw the shift at the door and kicked us through the turn.

      [Chorus]
      The last set of the night, and the whistle does not wait.
      Play it through. Play it through. Nobody stops.
      There is a shift coming in that door in eleven minutes
      and there is about a minute of this left and it is ours.

      [Verse 3]
      The morning freight crew filled the doorway by the dozen,
      lunch tins, rolled sleeves, manifests beneath their arms.
      We moved no faster. They could wait the forty seconds.
      One woman marked the time and leaned against the frame.
      Then Orsa held the final note beneath the dying whistle,
      Bree put both sticks up, and the whole shift crossed the floor.
      Our cases shut as their first rack came through the gate.

      [Final Chorus - pipes answering the vocal line, whistle over everything]
      The last set of the night, and the whistle does not wait.
      Play it through, play it through, and let them come in.
      There is a shift coming in that door in eleven minutes.
      Leave the note going. Let it go under the door.

      [Outro - held chord, the whistle still going]
