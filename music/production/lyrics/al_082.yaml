      [Verse 1]
      It went on for years. It went on in the yard and the bench room
      and at the gate and in the cart and once at somebody's table
      and every single time it ended the same way, which is not at all,
      because there is no end to an argument nobody can lose.
      Purist. Synthesist. Two words for what you like.
      Two words that had four people not speaking by 2590.
      Ask a hauler crew which half of the argument they are.

      [Chorus]
      Nobody here is pure. Nobody on this whole coast is.
      The alloy came off a hull. The hull came off a yard.
      The yard runs on a line that runs on somebody's power,
      and the power is the argument, and we are all in it.

      [Verse 2]
      Orsa said the sentence standing up, on a Thursday,
      and put his hands flat on the bench, and that was that.
      Bree had a marker in her pocket, because Bree has,
      and wrote it on the wall behind the rack in letters that high.
      It is still there. It has been painted round twice.
      The shop will not paint over it and will not say why.

      [Pre-Chorus]
      Two words, and a bench, and four people who had to work together
      in a room the size of a settlement for another eight years.

      [Verse 3]
      Ivena is back on this one with her own set
      and the two are in unison, which is the point of the tune:
      no beating, no argument, no two tunings disagreeing,
      just twice as much of the same thing, very loud.
      There is nothing subtle in this track anywhere at all
      and there is not supposed to be. It is a full stop.

      [Chorus]
      Nobody here is pure. Nobody on this whole coast is.
      The alloy came off a hull. The hull came off a yard.
      The yard runs on a line that runs on somebody's power,
      and the power is the argument, and we are all in it.

      [Final Chorus - both sets of pipes answering the vocal line]
      Nobody here is pure, and it is on the wall,
      and it is on this record, and it is the end of it.
      The yard runs on a line that runs on somebody's power.
