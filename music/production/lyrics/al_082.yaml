  - id: s_0673
    title: I Was Wrong About the Pipes
    track_number: 2
    mood: [rolling, wry, deep]
    fact: >-
      Orsa Lipp wrote the lyric and made Dane Verrow sing it, and the two of them have given different
      accounts of whose idea the title was.
    arrangement_note: the pipe player wrote the words and does not sing them, so the pipes carry the melody line under the singer all the way through and take the instrumental break, which is the nearest this band gets to a second voice
    intro: 16
    outro: fade
    target_duration: "4:20"
    prompt: >-
      134 BPM deep jump-reel; dry male tenor, melodic amplified pipes, pipe break, workshop fade.
    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, cold ending
    lyrics: |
      [Intro - amplified pipes, sixteen seconds]

      [Verse 1]
      Orsa wrote eleven words across the back of a stock sheet,
      folded it once, and slid it underneath my cup.
      He said, "Sing that before the first turn," then faced the pipe rack
      as if the sizes needed checking and the morning had got short.
      He will not sing. He barely says good evening.
      So I cleared my throat and held his paper to the lamp,
      while Bree found the count and Toller hid a smile.

      [Chorus]
      I was wrong about the pipes and I have been wrong for a while.
      I made a load of measured alloy heavier than a hull.
      I kept that load beside me through the gate and down the siding.
      I was wrong about the pipes. Set the long note going now.

      [Verse 2]
      What happened was a doorway, somebody else's workroom,
      rain coming sideways off the yard, a relay light gone red.
      He heard one pipe come warm through a battered desk and speaker,
      and stood there twenty minutes with the wet upon his coat.
      He came home and held his tongue for six weeks.
      Then Tuesday, while we checked a freight crew's dented rack,
      he said, "The argument was crooked," and went to make the tea.

      [Instrumental - amplified pipes take the break, twenty seconds]

      [Verse 3]
      He says the title was mine and it was not mine.
      I say the title was his and he says that is convenient.
      Somewhere in this settlement that stock sheet sits in a drawer,
      under valve counts, ferry dates and orders never filled.
      Neither of us looks, though we both know where the drawer is.
      Bree says she will settle it whenever we grow tired.
      Orsa checks the rack. I find another thing to carry.
      We have managed not to tire of this in twelve long months.

      [Chorus]
      I was wrong about the pipes and I have been wrong for a while.
      I made a load of measured alloy heavier than a hull.
      I kept that load beside me through the gate and down the siding.
      I was wrong about the pipes. Set the long note going now.

      [Final Chorus - pipes answering the vocal line]
      I was wrong about the pipes; I am saying what he wrote.
      Orsa has the long note. I have got the folded paper.
      Bree is at the count and Toller leans into the turn.
      I was wrong about the pipes. The kettle starts to knock.
      He reaches for the switch, then leaves the warm hum on.

      [Outro - fade]
