  - id: s_0678
    title: Ask Me at the Gate
    track_number: 7
    mood: [midtempo, fond, plain]
    fact: >-
      Toller Grange plays a bowed bass part here and nowhere else on either record, having borrowed
      the bow from a visiting fiddle player and not given it back.
    arrangement_note: the upright bass is bowed rather than plucked for the whole track, which happens nowhere else in this band's catalogue and gives the bottom of the arrangement a sustained tone that sits inside the pipes instead of under them
    intro: 10
    outro: fade
    target_duration: "3:55"
    prompt: >-
      142 BPM plain jump-reel; dry male tenor, bowed upright bass inside amplified pipes, soft fade.
    exclude: vocal harmony, backing vocals, second voices, plucked or pizzicato bass, slap bass, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, cold ending
    lyrics: |
      [Intro - bowed bass and pipes, ten seconds]

      [Verse 1]
      A woman came through Forge on a route with a fiddle case
      and sat in for one night at the hall on the west side
      and left her spare bow on a bench, which she has not forgotten,
      and Toller has had it now for a year and eleven days.
      He has written to her twice. She has not written back.
      He has decided this constitutes an arrangement.
      There is a berth number on the case and he has not used it.

      [Chorus]
      Ask me later, at the gate. Do not ask me on the floor.
      I will say anything on a floor and mean about a third of it.
      Ask me where the lists are checked and the boots come off,
      and I will give you a plain answer or none at all.

      [Verse 2]
      Toller took the bow from where it slept above the bench,
      pulled one bass string long enough to wake the hanging pipes.
      Orsa laid a low note over it and neither sound gave way.
      The alloy and the string kept passing through each other,
      one rough edge under one, one warm edge over two.
      Bree came in with brushes so she would not break the line.
      A stranger's name stayed pencilled on the leather by his hand.

      [Verse 3]
      He is going to give it back. He says so at every session.
      He said so at the gate on the way in tonight
      to nobody, out loud, in the way a man says a thing
      that he has decided is true and is not doing anything about.
      There is a settlement's worth of borrowed tools in this shop
      and every one of them is going back on Tuesday.

      [Chorus]
      Ask me later, at the gate. Do not ask me on the floor.
      I will say anything on a floor and mean about a third of it.
      Ask me where the lists are checked and the boots come off,
      and I will give you a plain answer or none at all.

      [Final Chorus - pipes answering the vocal line]
      Ask me later, at the gate, with the shift going in,
      and I will tell you what I think and it will be short.
      Ask me where the lists are checked and the boots come off.
      Toller, use the berth number. Send the woman back her bow.

      [Outro - fade]
