  - id: s_0675
    title: Wage Packet Reel
    track_number: 4
    mood: [fast, hard, defiant]
    fact: >-
      Bree Hollan refused to record it until the band agreed to split the writing four ways, which
      they did, and every song after this one is credited the same way.
    arrangement_note: the four instruments enter one at a time in the first sixteen bars and each gets exactly four bars alone before the next one arrives, which was the drummer's condition and is the arrangement equivalent of what she was asking for
    intro: 5
    outro: cold
    target_duration: "3:40"
    prompt: >-
      166 BPM hard jump-reel; dry male tenor, four staggered instrument entries, struck-alloy stop.
    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, fade-out
    lyrics: |
      [Intro - struck alloy alone, five seconds]

      [Verse 1]
      She put the sticks down in the middle of the second run
      and said she was not playing it, and sat on the bench,
      and Orsa said which part, and she said the whole tune,
      and the shop went quieter than it goes when it is stopped.
      Eleven years and she had never once refused anything.
      That is why it worked. That is exactly why it worked.

      [Chorus]
      Four names or no reel. Four names on the paper.
      I am not asking for more money. I am asking to be listed.
      A wage packet with one name on it is a decision
      about who this band is, and somebody made it quietly.

      [Verse 2]
      Nobody had done it on purpose. That is the worst part.
      Dane writes the words down, so Dane's name goes on,
      and it went on for eleven years and nobody looked,
      and the money followed the name the way money does.
      She had done the arithmetic. Of course she had.
      She had it on a stock sheet and she read it out.

      [Turnaround - struck alloy alone, four bars]

      [Verse 3]
      It took about nine minutes. There was no argument.
      Toller said yes before she reached the second figure.
      Orsa said it should have been four ways from the shop floor up.
      Dane stood quiet, read the stock sheet, then said, "Write it fair."
      Bree made the clerk put four names across the next clean line,
      checked each one herself, and tucked the paper by the manifest.
      Then she picked the sticks up, clicked them once, and counted fast.

      [Chorus]
      Four names or no reel. Four names on the paper.
      I am not asking for more money. I am asking to be listed.
      A wage packet with one name on it is a decision
      about who this band is, and somebody made it quietly.

      [Final Chorus - pipes answering the vocal line]
      Four names or no reel, and she went back to the kit,
      and counted it in fast, and did not mention it again.
      A wage packet with one name on it is a decision.
      Ask a freight crew. Ask anybody with a manifest.

      [Outro - cold stop]
