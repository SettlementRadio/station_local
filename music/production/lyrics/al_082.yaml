  - id: s_0677
    title: Nobody Here Is Pure
    track_number: 6
    mood: [brisk, blunt, bright]
    fact: >-
      The title was the sentence Orsa Lipp used to end the band's argument about the movement in 2591,
      and Bree Hollan wrote it on the shop wall.
    arrangement_note: two sets of pipes again but in hard unison this time rather than at two tunings, so the track is the heaviest thing on the record without being the fastest, and the fiddle plays underneath the pipes rather than over them
    intro: 6
    outro: cold
    target_duration: "3:35"
    prompt: >-
      156 BPM blunt jump-reel; dry male tenor, two amplified pipe sets in heavy unison, cold stop.
    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, detuned or beating pipes, fade-out
    lyrics: |
      [Intro - two sets of pipes in unison, six seconds]

      [Verse 1]
      Orsa chalked "Purist" above the rack for half a season.
      Dane wrote "Synthesist" beneath it to watch him turn.
      The words followed yard to gate, rode in the tool cart,
      and came home every evening in the chalk upon our coats.
      One Thursday no one spoke through thirty feet of stripped wire.
      Bree stopped the count and crossed both sticks upon the snare.
      Four people faced one bench and would not share a kettle.

      [Chorus]
      Nobody here is pure; look at our hands.
      Alloy off a hull, stripped wire out of cargo,
      borrowed power in the wall, old grease around the valves.
      Nobody here is pure. Good. Put the kettle on.
      That rack must meet the morning freight crew.

      [Verse 2]
      Orsa said the sentence standing up that Thursday,
      both hands flat beside the parts we had to ship.
      Bree had a marker in her pocket, because Bree always does.
      She climbed onto Toller's stool before the echo quit,
      wrote it on the wall behind the rack in letters tall as spanners,
      capped the marker with her teeth and started up the count.
      Twice they painted round it. Nobody will paint it out.

      [Pre-Chorus]
      Check the valves. Pass the small wrench down.
      Relay hauler at six, finished rack at seven.
      Four cups on the bench, and nobody gets a throne.

      [Verse 3]
      Ivena shoulders up beside Orsa at the pipe rack.
      Two hands lift together, two sets take the same low note.
      The cups move. The lamp shakes. Dust comes off the bulkhead.
      Bree drives the heel down; Toller braces by the gate.
      Dane's fiddle saws below them, hard against the floor.
      No one wins and no one yields; the long notes move as one.
      Orsa sees the chalk above him and laughs before the stop.

      [Chorus]
      Nobody here is pure; look at our hands.
      Alloy off a hull, stripped wire out of cargo,
      borrowed power in the wall, old grease around the valves.
      Nobody here is pure. Good. Put the kettle on.
      That rack must meet the morning freight crew.

      [Final Chorus - both sets of pipes answering the vocal line]
      Nobody here is pure; the words stay on the wall.
      Alloy off a hull and two pipe sets against the weather.
      Nobody here is pure. Good. Open up the gate.
      Let the morning freight crew find us working all together.
      Leave the chalk up by the rack. We know what it cost.

      [Outro - cold stop]
