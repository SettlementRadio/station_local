  - id: s_0676
    title: Warm Room, Late Start
    track_number: 5
    mood: [slow, warm, patient]
    fact: >-
      Recorded at four in the morning after a failed evening, and Dane Verrow's voice is an octave
      lower than anywhere else in the band's catalogue.
    arrangement_note: sung a full octave below the register this singer uses anywhere else, at four in the morning after a wasted evening, with the band playing at about half the tempo of everything around it and nobody trying to lift it
    intro: 12
    outro: fade
    target_duration: "4:30"
    prompt: >-
      84 BPM slow blues; exhausted low male baritone, amplified pipes, warm empty workshop, fade.
    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, reel tempo, fast tempo, bright vocal, cold ending
    lyrics: |
      [Intro - pipes and fiddle, twelve seconds]

      [Verse 1]
      We wasted the whole evening and there is no other word.
      Six hours on a tune that never learned to stand up
      and a disagreement about the order of the second half
      and Bree walking out to the yard twice to not say anything.
      By two nobody was playing anything anybody wanted.
      By three we had stopped pretending and put the kettle on.
      The last ferry off this rock went at eleven anyway.

      [Chorus]
      A warm room, a late start, and the shop still holding the heat
      from a day of work that finished about ten hours ago.
      This is the only time this building is comfortable.
      Nobody has ever been in here at four to find out.

      [Verse 2]
      Then Orsa put a long note up on the pipes, one note,
      and left it there, and Toller found something under it,
      and I opened my mouth and this came out instead of my voice,
      about an octave down, because there was nothing left of it.
      Nobody stopped. Nobody said anything at all.
      Bree kept the brush moving. Toller stayed under the note.
      My voice stayed down there until the whistle found us.

      [Verse 3]
      A shop at four in the morning is a warm dark thing.
      The stock is stacked. The rack is straight. The floor is swept.
      In two hours a settlement's worth of people come through that door
      and none of them are going to know that anybody was here.
      There is a lamp on over the bench and it is the only one,
      and four tired people are the whole of Forge for a while.

      [Chorus]
      A warm room, a late start, and the shop still holding the heat
      from a day of work that finished about ten hours ago.
      This is the only time this building is comfortable.
      Nobody has ever been in here at four to find out.

      [Final Chorus - pipes answering the vocal line]
      Warm room, late start, and the whistle at a quarter to six,
      and a voice I am not going to have again after tonight.
      This is the only time this building is comfortable,
      and we found that out by wasting a whole evening.

      [Outro - fade]
