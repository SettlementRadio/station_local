  - id: s_0672
    title: Take the Weight Off
    track_number: 1
    mood: [midtempo, warm, generous]
    fact: >-
      The first sound on the record is the shop amplifier being switched on, which Orsa Lipp put
      there deliberately as an admission.
    arrangement_note: the first thing on the record is a large valve amplifier being switched on and finding its hum, left in at full length before any instrument arrives, because the man who spent ten years arguing against it wanted it on the front of the sleeve
    intro: 12
    outro: fade
    target_duration: "4:00"
    prompt: >-
      140 BPM warm jump-reel; dry male tenor, amplified resonance pipes, valve hum intro, workshop fade.
    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, clean digital tone, cold ending
    lyrics: |
      [Intro - a valve amplifier switched on and finding its hum, twelve seconds]

      [Verse 1]
      Orsa stood with one thumb resting on the switch,
      coat still buttoned, kettle cold, morning off the glass.
      Bree leaned back on two legs of a stool and waited.
      Toller watched the little valve go from black to orange.
      Then the rack began to hum through every loose tool on the bench,
      through an alloy cup, through the pipes, through the soles of our boots.
      Orsa took his hand away and nobody helped him with the silence.

      [Chorus]
      Take the weight off, take the weight off, sit down.
      Leave that old iron with the coats beside the door.
      Nobody in this settlement is asking for a confession.
      Put the kettle on. Let the warm valve find the floor.
      If the pipe sounds bigger, we can call it bigger and play.

      [Verse 2]
      Ten years he said a pipe was only measured alloy,
      cut from a hull, set on a rack, struck clean and left alone.
      Ten years we heard that speech at lunch and after closing,
      while stripped wire waited in a drawer beneath his hand.
      Now he fed the line himself and turned the gain up slowly,
      stopped where the whole bench shook, and looked at every face.
      "There," he said. "That ought to carry past the gate."

      [Verse 3]
      We had offcuts in the bin and borrowed pipes above us,
      a patched lead by the desk and freight dust in the seams.
      Bree counted four, the fiddle caught against the humming,
      and Orsa brought the first low note up underneath.
      A spanner walked an inch across the bench from all the ringing.
      He caught it, set it down, and finally took off his coat.
      By the second turn he was grinning where he thought we could not see.

      [Chorus]
      Take the weight off, take the weight off, sit down.
      Leave that old iron with the coats beside the door.
      Nobody in this settlement is asking for a confession.
      Put the kettle on. Let the warm valve find the floor.
      If the pipe sounds bigger, we can call it bigger and play.

      [Final Chorus - pipes answering the vocal line]
      Take the weight off, take the weight off, sit down.
      The cups are on the bench and the old speech is done.
      Nobody in this settlement was keeping score but Orsa.
      He lets the thing hum. We hit the turn and run.
      It sounds enormous. That is enough for everyone.

      [Outro - fade]
