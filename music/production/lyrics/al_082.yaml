      [Verse 1]
      She put the sticks down in the middle of the second run
      and said she was not playing it, and sat on the bench,
      and Orsa said which part, and she said the whole tune,
      and the shop went quieter than it goes when it is stopped.
      Eleven years and she had never once refused anything.
      That is why it worked. That is exactly why it worked.

      [Chorus]
      Four names or no reel. Four names on the paper.
      I am not asking for more money. I am asking to be listed.
      A wage packet with one name on it is a decision
      about who this band is, and somebody made it quietly.

      [Verse 2]
      Nobody had done it on purpose. That is the worst part.
      Dane writes the words down, so Dane's name goes on,
      and it went on for eleven years and nobody looked,
      and the money followed the name the way money does.
      She had done the arithmetic. Of course she had.
      She had it on a stock sheet and she read it out.

