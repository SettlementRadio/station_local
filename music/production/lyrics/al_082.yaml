    lyrics: |
      [Intro - amplified pipes, sixteen seconds]

      [Verse 1]
      He wrote it down on the back of a stock sheet and handed it over
      and said sing that, and would not discuss it further,
      and there are eleven words in the first line that are his
      and I have been saying them out loud for about a year.
      He will not sing. He has never sung. He is not going to.
      So I stand here saying a man's own apology for him.

      [Chorus]
      I was wrong about the pipes and I have been wrong for a while.
      They were never pure. Nothing in this shop is pure.
      A signalling tube on a rack is not a philosophy,
      and I made it one, and I made everybody carry it.

      [Verse 2]
      What actually happened is smaller and less noble.
      He heard them through a desk at somebody else's session
      and stood in a doorway for twenty minutes not moving
      and came back to the shop and did not mention it for six weeks.
      Then he said, on a Tuesday, in front of the whole band,
      that the argument had been dishonest, and went and made tea.

      [Instrumental - amplified pipes take the break, twenty seconds]

      [Verse 3]
      He says the title was mine and it was not mine.
      I say the title was his and he says that is convenient.
      Somewhere in this settlement is a stock sheet with it written on
      and neither of us has ever gone and looked for it,
      which tells you what both of us think is on the paper,
      and which is why this is the one thing we do not discuss.

      [Chorus]
      I was wrong about the pipes and I have been wrong for a while.
      They were never pure. Nothing in this shop is pure.
      A signalling tube on a rack is not a philosophy,
      and I made it one, and I made everybody carry it.

      [Final Chorus - pipes answering the vocal line]
      I was wrong about the pipes and there is a record of it now,
      pressed, and sold, and sitting in a rack in the core.
      A signalling tube on a rack is not a philosophy,
      and I am playing one, through a desk, on this take.

      [Outro - fade]
