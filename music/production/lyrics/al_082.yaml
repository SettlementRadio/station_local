    lyrics: |
      [Intro - a valve amplifier switched on and finding its hum, twelve seconds]

      [Verse 1]
      That is the sound of a man losing an argument he started.
      Ten years of standing in this shop saying a pipe is a pipe,
      it is alloy, it is a length, it is a thing you hit,
      and there is nothing electrical about a length of metal.
      All of which was true, and all of which was beside the point,
      because we ran it through the shop's own desk to be heard.
      A pipe is a length of alloy off a hull off a deck.

      [Chorus]
      Take the weight off. Take the weight off and sit down.
      You have been carrying that for a decade and nobody asked you to.
      Nobody in this settlement was ever keeping score,
      and the two people who were are both in this room.

      [Verse 2]
      Orsa put that hum on the front of the record himself.
      He did not have to. The label wanted it taken off.
      He said if I am going to do it I am going to say I did it,
      and put twelve seconds of his own defeat on track one.
      That is the whole of the man in one decision.
      He would rather be wrong loudly than right in private.

      [Verse 3]
      A movement is a thing people put in an argument
      when what they actually mean is I like this and not that.
      There is nothing pure about a shop full of offcuts.
      There is nothing pure about a rack of borrowed pipes.
      We took what Forge had and we played it and it worked,
      and then we took the next thing Forge had, which was power.

      [Chorus]
      Take the weight off. Take the weight off and sit down.
      You have been carrying that for a decade and nobody asked you to.
      Nobody in this settlement was ever keeping score,
      and the two people who were are both in this room.

      [Final Chorus - pipes answering the vocal line]
      Take the weight off, and put the kettle on the bench,
      and let the thing hum, because it is going to hum.
      Nobody in this settlement was ever keeping score.
      It sounds enormous. That is the end of it.

      [Outro - fade]
