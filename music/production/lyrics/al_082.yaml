  - id: s_0674
    title: Two Sets of Pipes
    track_number: 3
    mood: [deep, fast, strange]
    fact: >-
      Ivena Sorn plays the second set against Orsa Lipp and marked both tunings on her cuffs, which is
      the only written record of what the shop pipes were tuned to that year.
    arrangement_note: two sets of resonance pipes at two different tunings playing against each other, which nobody had ever recorded and which produces beating tones the band did not expect and kept, and the instrumental break is the two sets alone with nothing else playing
    intro: 18
    outro: cold
    target_duration: "4:35"
    prompt: >-
      158 BPM deep jump-reel; dry male tenor, two detuned amplified pipe sets, beating tones, cold stop.
    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, tuned unison pipes, fade-out
    lyrics: |
      [Intro - two sets of pipes at two tunings, eighteen seconds]

      [Verse 1]
      The relay door opened with the weather pushing through it,
      and Ivena Sorn came sideways with a canvas bag of tools.
      Eleven pipes were waiting on the rack behind Orsa.
      She set eleven more against the bench and tried one low.
      His set answered flat enough to make the lamp wire tremble.
      He asked if she would tune. She said, "I already did."
      Bree struck the rim once, delighted by the trouble.

      [Chorus]
      Two pipe sets, two measures, two different years.
      Where the long notes cross, the whole room beats between them.
      Keep that rolling in the walls. Do not sand the edges off.
      Let two pieces of alloy find the distance in the air.

      [Verse 2]
      Ivena wrote the numbers up and down her cuffs in marker,
      left arm for her travelling set and right arm for the shop.
      Paper slid beneath the tools; her hands were full of valves.
      Sweat took half a figure, so she wrote the figure twice.
      Those cuffs are all that anyone kept of both the tunings,
      black strokes for a settlement year no gauge remembers now.
      She gave the shirt away and wore her coat back to the berth.

      [Instrumental - the two sets of pipes alone, twenty seconds]

      [Verse 3]
      Toller says it makes him feel like a bulkhead is failing.
      Bree laughs every time the beating shakes the cups.
      Orsa listens with his head down by the smaller valves,
      then asks Ivena, far too formally, to stay another night.
      Her berth is booked for morning on the eastbound ferry.
      She walks to the relay desk, moves it on one day,
      comes back with rain upon her coat and says, "From the top."

      [Chorus]
      Two pipe sets, two measures, two different years.
      Where the long notes cross, the whole room beats between them.
      Keep that rolling in the walls. Do not sand the edges off.
      Let two pieces of alloy find the distance in the air.

      [Final Chorus - both sets of pipes answering the vocal line]
      Two pipe sets, and one goes out on Thursday.
      One marked cuff is folded in a drawer behind the gate.
      Let two pieces of alloy hold their distance in the air.
      Ivena shoulders up the travelling set before first light.
      The shop feels half its width when eleven pipes have gone.

      [Outro - cold stop]
