    outro: fade
    target_duration: "4:00"
    prompt: >-
      64 BPM rueful slow blues torch; quiet low female contralto close and level, upright piano
      answering every vocal line and taking a fifteen-second break alone, upright bass, brushed kit,
      plucked electronic strings, fade.
    exclude: backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano, nine seconds]

      [Verse 1]
      It started over nothing in the coat room.
      It always starts in coat rooms. Ask around.
      Somewhere between the hangers and the doorway
      a whole year of not saying it came down.
      You had my coat. I had already said the thing.
      Neither of us could put either of them back.
      And the room outside went on being a room
      with a piano in it and a hum of talk.

      [Chorus]
      My fault, your coat, and both of us standing.
      My fault, your coat, and the door half wide.
      Somebody wanting past us with an armful.
      Somebody saying sorry to the side.

      [Verse 2]
      He wrote the piano part out of that evening
      and he has never said which half was his.
      You can hear both of them in it if you want to.
      The left hand will not let the right hand finish.
      That is the argument, and that is all of it,
      and it goes round twice and does not resolve.
      I asked him once. He looked at me and shrugged.
      He said a part is not a confession, love.

      [Instrumental - upright piano break, fifteen seconds]

      [Verse 3]
      We got the coats the right way round eventually.
      We went out into a cold that did not care.
      The last ferry had gone an hour before that
      and neither of us mentioned it out there.
      Whatever it was, it was not about the coat.
      Whatever it was, it is not settled yet.
      Nobody has ever won a thing in a doorway
      with an armful of somebody else's winter.
      But I have the sleeve of it in my two hands
      and I am not the one who lets it go.

      [Chorus]
      My fault, your coat, and both of us standing.
      My fault, your coat, and the lane outside.
      Somebody wanting past us with an armful.
      Somebody saying sorry to the side.

      [Outro - piano fading]
