    exclude: bright bass tone, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, fade ending, backing vocals before the last chorus
    lyrics: |
      [Intro - bass and piano, seven seconds]

      [Verse 1]
      There is nothing to be done about it now.
      The office shut at six. The clerk went home.
      Whatever it is that you have found out this evening
      is a thing you have to carry until nine.
      I know. I know. I have had those nights myself.
      There is no hour worse than the one you cannot use.
      Sit down. Put it on the table where I can see it.
      We will look at it together and then leave it.

      [Verse 2]
      A borrowed bass is under this, and you can hear it —
      lower than the room is built to hold,
      lent for a fortnight out of the other house
      by a man who never asks what for or when.
      That is what people are, in the end, at this hour:
      whatever they can lend you that will keep.
      Nobody solved a thing at four in the morning.
      Plenty have been carried to the light.

      [Chorus]
      Nothing till morning. Nothing until then.
      The dark is not a place where things get mended.
      Stay in it with me and do not think.
      There is a whole day coming. Let it come.

      [Verse 3]
      By seven you will be somebody with a problem,
      which is better than a person in a hole.
      You will make a call. Somebody will answer.
      It will be smaller in a coat and out of doors.
      I am not telling you it is nothing. It is something.
      I am telling you it is nothing until nine,
      and there are two hours yet, and the piano is still open,
      and I have not stopped playing in my life.

      [Chorus - one answering voice underneath]
      Nothing till morning. Nothing until then.
      The dark is not a place where things get mended.
      Stay in it with me and do not think.
      There is a whole day coming. Let it come.

      [Outro - cold stop]
