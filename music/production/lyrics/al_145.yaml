  - id: s_1181
    title: The Fourth Night
    track_number: 5
    mood: [tired, warm, building]
    fact: >-
      The band played a fourth night the house had not paid for and would not sign for it, which is
      the only bill Maro Deyn ever wrote off.
    arrangement_note: the only track on the record the whole band wrote, and it builds from one instrument to five across the three verses without ever getting loud
    intro: 15
    outro: cold
    target_duration: "4:25"
    prompt: >-
      70 BPM building slow torch; quiet low female contralto close and tired, entering over piano
      alone with upright bass, brushed kit, plucked electronic strings and one low female answering
      voice added one at a time across the song, upright piano taking a fourteen-second break, hard
      cold stop.
    exclude: loud dynamics, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, fade ending
    lyrics: |
      [Intro - piano alone, fifteen seconds]

      [Verse 1]
      Three nights every chair carried a number,
      every glass and hour entered in the book.
      On the fourth, the coast stayed closed by weather,
      and nine wet travelers gathered on the stair.
      The last ferry had no room to take them.
      The relay named no beds within the quarter.
      We left the lamps alight, unlatched the doorway,
      turned the little price board to the wall,
      and let the room become what people needed.

      [Chorus]
      Not for the docket. Not for the account.
      Some nights only live when they are not counted.
      Put another ration by the kettle.
      Pull another chair out from the stack.
      Morning can decide what all of this was worth.

      [Verse 2]
      One freight hand slept beneath two borrowed jackets.
      One child drew a hauler on a bill.
      Someone's cousin found a tune from storm coast,
      hummed the first line softly by the sill.
      A second voice came underneath her breathing.
      Bass arrived as footsteps found the floor.
      Brushes followed cups along the tabletop.
      Nothing rose above the tired talk.
      By two, the cold had nowhere left to enter;
      every stranger knew who needed more.

      [Instrumental - upright piano break, fourteen seconds]

      [Verse 3]
      Dawn put silver lines across the glasses.
      The coast crew rose and folded every chair.
      Someone swept the mud along the passage.
      Someone left dry gloves beside the stair.
      On the desk, the fourth line of the docket
      waited blank beneath the other three.
      No one signed it, crossed it, or explained it.
      The empty line was plain enough to read.
      Work can end exactly at the payment;
      welcome starts where counting loses track.

      [Final Chorus]
      Not for the docket. Not for the account.
      Some nights only live when they are not counted.
      Put the final ration by the kettle.
      Leave the first chair ready by the stack.
      Morning came and never asked its money back.

      [Outro - cold stop]
