# (D-092's precedent), and the three tracks she is on say so in the prompt and in `room:` — the other
# three keep the card exactly.
#
# The fourth night is `s_1181` and the band would not sign for it. The record ends on the room's own
# upright piano because Hessa Lin's instrument had been sold that spring to clear the band's back pay,
