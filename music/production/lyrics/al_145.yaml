  - id: s_1181
    title: The Fourth Night
    track_number: 5
    mood: [tired, warm, building]
    fact: >-
      The band played a fourth night the house had not paid for and would not sign for it, which is
      the only bill Maro Deyn ever wrote off.
    arrangement_note: the only track on the record the whole band wrote, and it builds from one instrument to five across the three verses without ever getting loud
    intro: 15
    outro: cold
    target_duration: "4:25"
    prompt: >-
      70 BPM building slow torch; quiet low female contralto close and tired, entering over piano
      alone with upright bass, brushed kit, plucked electronic strings and one low female answering
      voice added one at a time across the song, upright piano taking a fourteen-second break, hard
      cold stop.
    exclude: loud dynamics, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, fade ending
    lyrics: |
      [Intro - piano alone, fifteen seconds]

      [Verse 1]
      Three nights were paid for and we played a fourth.
      Nobody asked us to. The room was there.
      The doors were open and the lamps were burning
      and the five of us had nowhere else to be.
      There was a docket on the table in the morning
      with a line for what a fourth night should have cost.
      We looked at it a while and left it blank
      and put it back exactly where it was.

      [Chorus]
      Not for the docket. Not for the account.
      A fourth night is the one that is not counted.
      Everything before it we were working.
      This one we were only in the room.

      [Verse 2]
      He came in at two and stood against the doorframe,
      the man who signs for everything down here,
      and he watched us do an hour we were not paid for
      and he did not say a word to anyone.
      Next week the paper came back through the letterbox
      with a line drawn through the whole of what was owed.
      It is the only bill he ever wrote off
      and he has never once explained the reason.

      [Instrumental - upright piano break, fourteen seconds]

      [Verse 3]
      It was the best of the four and everybody knows it.
      The freight crew stayed. The people from the coast stayed.
      Somebody's cousin sang a thing we did not know
      and we found it under her by the second time.
      There is no version of it anywhere on tape.
      That is not a tragedy. That is the point.
      A night you cannot sell is still a night.
      Ask anybody on the stair, or up the relay,
      or anywhere at all outside the core.

      [Final Chorus]
      Not for the docket. Not for the account.
      A fourth night is the one that is not counted.
      Everything before it we were working.
      This one we were only in the room. Go home.

      [Outro - cold stop]
