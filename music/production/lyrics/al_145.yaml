  - id: s_1177
    title: Two Ferries Missed
    track_number: 1
    mood: [wry, warm, midtempo]
    fact: >-
      Nesta Vire counted the two ferries she had actually missed that week into the opening line and
      refused to change the number afterwards, so the band has sung it wrong on purpose ever since.
    arrangement_note: the count is in the first sung line and the band comes in behind it a beat late on purpose, which is how they have played it ever since
    intro: 11
    outro: fade
    target_duration: "3:45"
    prompt: >-
      74 BPM wry slow torch; quiet low female contralto close and conversational, upright piano,
      upright bass, brushed kit entering a beat behind the vocal, plucked electronic strings, fade.
    exclude: backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano and bass, eleven seconds]

      [Verse 1]
      Two ferries missed this week and it is Thursday.
      One by a minute and one by half an hour.
      I stood on the wrong side of the water twice
      and watched the lights go out across the lane.
      There is a kind of person this keeps happening to
      and I have stopped pretending I am not.
      The timetable has never once been wrong.
      I am the variable. I have checked.

      [Chorus]
      Two ferries missed, and I am still here.
      Two ferries missed, and the room is warm.
      Whatever I was hurrying towards this evening
      has managed without me and will do again.

      [Verse 2]
      It was three by Sunday, if we're honest,
      but two was all I could admit that night.
      Three would make a habit out of failure;
      two still sounded almost like bad luck.
      So I keep the smaller number in the telling,
      not to fool you — you were there for every one.
      Memory has its own fare for crossing:
      pay the truth you can afford, then carry on.

      [Verse 3]
      You were on the far bank in the cold both times,
      not waving, not annoyed, just standing there,
      the way somebody waits for someone hopeless
      whom they have decided not to give up on.
      The last ferry does not wait for anybody
      and the long way round is nine and a half miles.
      When I came round the long way you had gone in.
      The kettle had already been and gone.
      You said, without looking up from what you were doing,
      that you had put a second one on.

      [Final Chorus]
      Two ferries missed, and I am still here.
      Two ferries missed, and the kettle has been on.
      Whatever I was hurrying towards this evening
      is exactly where I have ended up. Go on.

      [Outro - piano and bass, fading]
