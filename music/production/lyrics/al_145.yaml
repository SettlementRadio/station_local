  - id: s_1182
    title: Down to the Last Lamp
    track_number: 6
    mood: [final, warm, slow]
    fact: >-
      Hessa Lin plays the closing figure on the room's upright piano because her own instrument had
      been sold that spring to pay the band what the house owed it.
    arrangement_note: no plucked electronic strings anywhere on this track — the keyboard chair is at the room's upright piano instead, and the closing figure is hers
    intro: 12
    outro: fade
    target_duration: "3:50"
    prompt: >-
      60 BPM warm closing torch; quiet low female contralto close and unhurried, two upright pianos
      and no electronic instruments of any kind, upright bass, brushed kit, the second piano taking
      the closing figure alone, fade.
    exclude: plucked electronic strings, synthesizers, keyboards, backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - two pianos, twelve seconds]

      [Verse 1]
      They carried her bright keyboard down in April,
      wrapped in two grey blankets from the store.
      What it fetched became five narrow envelopes:
      rent, coal, groceries, nothing more.
      She did not make a speech or watch it leaving.
      Only touched the mark it left beside the door.
      That evening she returned before the ferry,
      sat beside the room's old upright piano,
      tested every key from low to high,
      and found one honest middle left to start from.

      [Verse 2]
      There is a way of playing a thing you did not choose
      that is not resignation and not spite.
      It is learning where the yellow keys catch slightly,
      where the pedal lifts before the sound is through.
      It is choosing this imperfect room at midnight
      over anywhere with better keys and no one known.
      The lamps are going off along the wall.
      We are down to the last lamp and the one figure
      and the bass is putting its cloth over the strings.
      There is no ceremony being made of this.
      There are tired hands still making something whole.

      [Chorus]
      Down to the last lamp, and it is enough.
      Down to the last lamp and the door.
      What we could not keep has crossed the water.
      What remains can make a home once more.

      [Verse 3]
      Somewhere past the core, another player
      may wake those plucked strings after storm season.
      May never know the hands that wore them smooth,
      or what five envelopes came home instead.
      Let the lost thing have another future.
      Let this old piano hold the room tonight.
      The last ferry sounds below the stairwell.
      Every coat is waiting by the door.
      She plays the closing figure without hurry,
      then rests both hands where borrowed silence starts.

      [Coda]
      Down to the last lamp, and it is enough.
      Down to the last lamp. Take your coat.

      [Outro - the closing figure alone, fading]
