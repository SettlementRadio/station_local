  - id: s_1182
    title: Down to the Last Lamp
    track_number: 6
    mood: [final, warm, slow]
    fact: >-
      Hessa Lin plays the closing figure on the room's upright piano because her own instrument had
      been sold that spring to pay the band what the house owed it.
    arrangement_note: no plucked electronic strings anywhere on this track — the keyboard chair is at the room's upright piano instead, and the closing figure is hers
    intro: 12
    outro: fade
    target_duration: "3:50"
    prompt: >-
      60 BPM warm closing torch; quiet low female contralto close and unhurried, two upright pianos
      and no electronic instruments of any kind, upright bass, brushed kit, the second piano taking
      the closing figure alone, fade.
    exclude: plucked electronic strings, synthesizers, keyboards, backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - two pianos, twelve seconds]

      [Verse 1]
      Her instrument went out of here in April
      in the back of somebody's van, and did not come back.
      What it fetched went round the five of us in envelopes
      and squared what we were owed and nothing more.
      She did not make a speech about it. She came in,
      sat at the room's old upright, and began.
      You would not know, unless you knew, what you were hearing.
      You are hearing it. It is the whole last track.

      [Verse 2]
      There is a way of playing a thing you did not choose
      that is not resignation and not spite.
      It is the sound of somebody who would rather
      be in this room on this instrument tonight
      than anywhere at all with better keys.
      The lamps are going off along the wall.
      We are down to the last lamp and the one figure
      and the bass is putting its cloth over the strings.
      There is no ceremony being made of this.
      There is a woman playing, and a room.

      [Chorus]
      Down to the last lamp, and it is enough.
      Down to the last lamp and the door.
      What we could not keep, we could not keep.
      What we can play, we are playing. Hear it out.

      [Verse 3]
      Somebody in the storm season will ask her
      whether she minds, and she will say she doesn't,
      and half of that is true and half is manners
      and the half that is true is the half that made this.
      The relay carries what we pressed this April
      out past the core to rooms we will not see.
      It goes out with the room's own piano on it.
      That is the only thing I want them to hear.

      [Coda]
      Down to the last lamp, and it is enough.
      Down to the last lamp. Get your coat.

      [Outro - the closing figure alone, fading]
