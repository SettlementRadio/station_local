  - id: s_1178
    title: The Room Fills at One
    track_number: 2
    mood: [patient, glowing, slow]
    fact: >-
      Sel Ardin built the three answering voices around a lead she had heard once, standing at the
      bar with her coat still on.
    arrangement_note: three answering female voices under the lead from the first refrain on, built to sit below her and never above, and the lead is not doubled anywhere
    intro: 18
    outro: sustain
    target_duration: "4:10"
    prompt: >-
      56 BPM patient slow torch; quiet low female contralto close and unhurried, three low female
      answering voices underneath her from the first refrain, upright piano, upright bass, brushed
      kit, plucked electronic strings, sustained ending.
    exclude: harmony above the lead, doubled lead vocal, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano alone, then bass, eighteen seconds]

      [Verse 1]
      Nothing happens in this room till one.
      Before that it is chairs and a low lamp
      and four of us in front of eleven people,
      three of whom are waiting for a friend.
      But we all know the hour we are working toward
      and none of us has ever said it out.

      [Refrain]
      This room fills at one. It always has.
      The last ferry lands them and they climb the stair.
      You can hear it coming up before you see it,
      that particular noise of somewhere else out there.

      [Verse 2]
      She came in with her coat still on, that evening,
      stood at the bar and did not order once.
      Watched the service door between each footstep,
      checked the stair whenever cold came up.
      Whoever she expected missed the ferry.
      She folded both hands round an empty glass.
      Before the first full table found its laughter,
      someone moved a chair and asked her not to stand.

      [Refrain]
      This room fills at one. It always has.
      The last ferry lands them and they climb the stair.
      You can hear it coming up before you see it,
      that particular noise of somewhere else out there.

      [Verse 3]
      At one the stairwell carries up a weather:
      wet coats, dock dust, voices from the quay.
      The stranger at the bar is no longer waiting;
      two night porters make her room for tea.
      By closing she has learned their children's ages,
      which freight crew leaves before the morning bell.
      The eleven are the reason there are ninety.
      Somebody has to keep the first chairs warm.

      [Refrain]
      This room fills at one. It always has.
      The last ferry lands them and they climb the stair.
      Whatever it is you came across the water for,
      it starts about an hour from now. Sit there.

      [Outro - voices and piano sustaining]
