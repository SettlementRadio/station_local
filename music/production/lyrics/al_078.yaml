# Written by M-24. **The file shape is fixed by al_001.yaml — read that header once.** Production
# vocabulary (COMMISSION.md §8): never enters the wiki, never said on air. Lyrics written by hand;
# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# **The cornerstone of the genre and the record every other band in this file is compared to.** Six
# nights in the Cold Harbor exchange hall, cut live to two microphones with a floor of dancers on
# every track, because Harbor Standard owned two microphones and had no room of its own. The wiki
# gives this record a broken bass string, a harmony a line behind the lead, a promoter who paid
# half, and a hall keeper asking the band to stop. The dancers are the fifth instrument and the
# arrangement notes treat them as one: they clap the count in, they sing a whole chorus, they are
# still in the room on twelve of the thirteen and pointedly gone on the thirteenth.
#
# Frontier Reels takes an instrumental break in roughly one song in three (§7) and b_037's card
# gives every break to the composite fiddle, which Hessa Lund plays herself while singing. **Four of
# these thirteen take one**, and the longest is s_0640's, because that song's own fact is that the
# dancers would not stop.
#
# **Two songs are written against the room rather than against a person** — s_0640 and s_0643 — and
# both are the ones where the floor is doing the work. Rule 6 is a wiki rule and not this file's,
# but the same instinct applies to a lyric: a record about a hall is worth one song about the hall.
#
# `generation:` and every `take:` were filled from the dispatch manifest at M-33.

