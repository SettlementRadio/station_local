  - id: s_0644
    title: Rosin and Rain
    track_number: 10
    mood: [slow, warm, close]
    fact: >-
      The slowest thing Wire and Rosin ever recorded, and it was put on the record to give the
      dancers somewhere to stop, which the band resented and the label insisted on.
    arrangement_note: the slowest tempo anywhere in the band's catalogue and the only track that is not a dance tune at all, played reluctantly and with the fiddle staying low and unornamented throughout, and the room noise drops to almost nothing because the floor has stopped moving
    intro: 20
    outro: fade
    target_duration: "4:30"
    prompt: >-
      92 BPM slow old-time folk; hard female soprano, low fiddle, quiet brushes, close live hall.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, fast tempo, reel tempo, big finish
    lyrics: |
      [Intro - fiddle and guitar, twenty seconds]

      [Verse 1]
      The Harbor man held one finger up from the corner.
      Not one more tune. One slower. Give the floor a rest.
      Hessa shook her head. He pointed at the stove,
      at four hundred people breathing frost into the room.
      Marda changed to brushes. Arel found the walking note.
      Nobody thanked the man. The whole floor stopped together.

      [Chorus]
      Rosin on the fingers and rain against the roof,
      and a hall that has gone quiet for the first time all week.
      Twelve people at the stove with their boots off.
      Everybody else out there just standing, holding on.

      [Verse 2]
      A man beside the coats kept both hands at his sides.
      The woman facing him had crossed on the last ferry.
      He asked if she was warm. She said not even slightly.
      He offered her one glove. She took the other too.
      They stood there through the verse without deciding anything.
      By the chorus they were moving at the same slow step.

      [Verse 3]
      Nobody left. That was the part we had not counted.
      Boots went still but every coat stayed in the hall.
      The woman from the ferry laid her head against his shoulder.
      Twelve tired freight hands sat barefoot by the stove.
      Rain worked the roof and ice held to the window.
      The quiet kept four hundred people exactly where they were.

      [Chorus]
      Rosin on the fingers and rain against the roof,
      and a hall that has gone quiet for the first time all week.
      Twelve people at the stove with their boots off.
      Everybody else out there just standing, holding on.

      [Final Chorus - harmony a third below]
      Rosin on the fingers and the rain not letting up,
      one borrowed pair of gloves between two people by the coats.
      Twelve pairs of boots are drying by the stove.
      Nobody is dancing. Nobody has gone home.

      [Outro - fade]
