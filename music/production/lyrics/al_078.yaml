  - id: s_0643
    title: Half the Town Was There
    track_number: 9
    mood: [bright, loud, communal]
    fact: >-
      The chorus is sung by the floor rather than the band, which is why it is the only track on the
      record with no credited harmony vocal.
    arrangement_note: the lead sings the verses and does not sing the choruses at all — the floor sings every chorus unaccompanied by any band voice, with the instruments still playing under them — and the harmony singer does not open his mouth anywhere on the track
    intro: 14
    outro: sustain
    target_duration: "4:20"
    prompt: >-
      166 BPM loud fiddle reel; female soprano verses, untrained crowd choruses, live dance hall.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, studio backing vocals, tidy group harmony, cold ending
    lyrics: |
      [Intro - band and rising room noise, fourteen seconds]

      [Verse 1]
      The gate clerk is here. Both the gate clerks are here.
      The woman who runs the ration store is here with all her sisters.
      Two people who have not spoken since a dispute about a berth
      are eleven feet apart and both pretending it is fine.
      The school cook has flour on the front of her coat.
      The night ferry crew came straight through in work boots.

      [Chorus - sung by the floor alone, no band voice]
      Half the town was there and the other half heard about it,
      and by the morning shift the other half will say they came.
      Ask anybody where they were and they will tell you here.
      There is not a hall on this coast that holds as many as claim it.

      [Verse 2]
      Hessa reached the chorus and four hundred voices got there first.
      She lowered the bow and let the first line cross her.
      Finn opened his mouth late, then shut it with a laugh.
      The sisters from the ration store took the high part.
      Two gate clerks found the bottom somewhere near the beat.
      The people by the berth dispute sang without looking across.

      [Chorus - sung by the floor alone, no band voice]
      Half the town was there and the other half heard about it,
      and by the morning shift the other half will say they came.
      Ask anybody where they were and they will tell you here.
      There is not a hall on this coast that holds as many as claim it.

      [Instrumental - fiddle break, twelve seconds]

      [Verse 3]
      There is a young one at the front who cannot be fifteen
      standing on a chair so that she can see the bow.
      She has got the whole tune already. You can watch her get it.
      In nine years she is going to be doing this in some other hall
      with flour on her coat or a gate stamp in her hand.
      Tonight she only knows the whole room sings when she does.

      [Final Chorus - the floor alone, band underneath]
      Half the town was there and the other half heard about it,
      and by the morning shift the other half will say they came.
      Ask anybody where they were and they will tell you here,
      and let them. Let them all have been here.

      [Outro - held chord, the room still singing]
