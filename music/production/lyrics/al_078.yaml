  - id: s_0638
    title: Ask Her While the Band Plays
    track_number: 4
    mood: [warm, quick, hopeful]
    fact: >-
      Finn Derrow sings the harmony a full line behind Hessa Lund because he could not hear her over
      the floor, and the band kept the mistake after the second night made it deliberate.
    arrangement_note: the harmony voice sings a full line behind the lead all the way through both choruses rather than with her, which began as a mistake on the first night and is played deliberately here, and the fiddle drops out entirely under the second verse so the two voices are audible against each other
    intro: 4
    outro: fade
    target_duration: "3:20"
    prompt: >-
      164 BPM warm fiddle reel; hard female soprano, male harmony one line late, loud live dance hall.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, tight vocal stacking
    lyrics: |
      [Intro - full band, four seconds]

      [Verse 1]
      You have been standing at that end of the hall for forty minutes
      working out a sentence you are never going to say.
      She is three rows in and dancing with somebody's brother
      and she has looked over here twice, which you have counted.
      There is no good moment. That is the whole trouble.
      A good moment is a thing people invent afterwards.

      [Chorus - harmony a full line behind the lead]
      Ask her while the band plays. Ask her while it is loud.
      Nobody hears a bad question with a fiddle over the top.
      If it goes wrong the tune covers it and you both keep moving,
      and if it goes right you have got the rest of the night.

      [Verse 2 - no fiddle]
      The fiddle drops away. Finn lands one line behind.
      She laughs because his answer reaches after mine.
      You cross two rows while everybody turns the other way.
      The floor is loud enough to let her answer honestly.
      She takes your hand somewhere between the hall and berth.
      Both of you can blame the tune for what comes after.

      [Chorus - harmony a full line behind the lead]
      Ask her while the band plays. Ask her while it is loud.
      Nobody hears a bad question with a fiddle over the top.
      If it goes wrong the tune covers it and you both keep moving,
      and if it goes right you have got the rest of the night.

      [Verse 3]
      Half the households in this settlement started on a floor
      about nine feet from where the four of us are standing.
      They will tell you it was the thaw or the ice or a shared shift.
      It was a hall and a hard winter and a band that would not stop.
      There is a man out there tonight who met his wife at one of ours,
      and he still cannot dance, and he is out there anyway.

      [Final Chorus - both voices, the second still a line behind]
      Ask her while the band plays. Ask her while it is loud.
      Nobody hears a bad question with a fiddle over the top.
      We have got four more tunes and then the doors go up.
      Four tunes is a long time. Four tunes is not long at all.

      [Outro - fade under the room]
