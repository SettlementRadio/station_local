  - id: s_0642
    title: Standing at the Wrong End
    track_number: 8
    mood: [wry, midtempo, plain]
    fact: >-
      Hessa Lund wrote it about arriving late to a dance she had been hired to play, and she names
      the hall in the second verse.
    arrangement_note: the tune starts as though it is already halfway through, with no introduction and the first sung word arriving almost immediately, and the band plays the first verse deliberately ragged as if three of them had only just got their coats off
    intro: 2
    outro: fade
    target_duration: "3:30"
    prompt: >-
      144 BPM ragged fiddle reel; hard female soprano, no intro, embarrassed vocal, live dance hall.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, long instrumental introduction
    lyrics: |
      [Intro - two seconds, band already going]

      [Verse 1 - deliberately ragged]
      There is a particular way a hall goes quiet when you come in late.
      Not angry quiet. Worse. Interested quiet.
      Four hundred people turning round to see who it is
      and every one of them already knows exactly who it is.
      Our cart was on the ice road behind a stopped hauler
      for one hour and ten minutes, which nobody wants to hear.

      [Chorus]
      Stood at the cold end of a room I am supposed to be running,
      with my coat still on and the fiddle still in the case.
      There is no dignified way to cross a full floor.
      There is only crossing it, so you cross it and you play.

      [Verse 2]
      The exchange hall has a long room and one door at the cold end,
      which is fine when you are early and a punishment when you are not.
      I have walked that room in front of a full house twice in my life
      and I would rather do a winter on the ice than do it again.
      Marda went first and carried the drum in front of her
      like a person who has decided to be shameless about it.

      [Chorus]
      Stood at the cold end of a room I am supposed to be running,
      with my coat still on and the fiddle still in the case.
      There is no dignified way to cross a full floor.
      There is only crossing it, so you cross it and you play.

      [Verse 3]
      Then you are up, and you are tuning, and it goes away.
      Eight bars in and not one person in that hall remembers.
      That is the mercy of the job and it is a real one:
      nobody holds anything against a band that is playing.
      They will hold it against you for years if you cancel.
      Late is forgiven at the door. Absent is not.

      [Final Chorus - harmony a third below]
      Stood at the cold end and then not standing anywhere,
      because you get four bars in and the room comes back to you.
      There is no dignified way to cross a full floor,
      and there was never anything at the far end of it but work.

      [Outro - fade]
