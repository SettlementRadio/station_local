  - id: s_0640
    title: The Long Way Round the Floor
    track_number: 6
    mood: [bright, rolling, generous]
    fact: >-
      It runs longer than anything else on the record because the dancers would not stop and the
      band did not want to be the ones who did.
    arrangement_note: the longest track on the record and the only one that goes round the tune four times, with an unusually long fiddle break in the middle taken at the dancers' insistence rather than the band's, and the last chorus arriving much later than the shape of the song predicts
    intro: 18
    outro: fade
    target_duration: "5:15"
    prompt: >-
      Reel-tempo rockabilly and old-time dance music, 158 BPM, bright and rolling, generous and
      unhurried despite the tempo. Female lead vocal, clear high soprano with a hard edge, sung in
      short phrases between fiddle passages, never a held note, plain and unornamented. One male
      harmony voice a third below the lead on the chorus only, nothing under the verses. Bright
      thin-toned composite fiddle, fretted acoustic-toned composite guitar, upright bass, cut-stock
      drum kit played with brushes and sticks. Tracked live in a wooden dance hall with two
      microphones and no click, light slapback on the voice, the floor very loud behind the band and
      audibly not stopping. Eighteen seconds of fiddle and guitar before the first sung word. A long
      twenty-four-second fiddle break in the middle. The longest track on the record. Long fade with
      the dancers still going.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, cold ending
    lyrics: |
      [Intro - fiddle and guitar, eighteen seconds]

      [Verse 1]
      There is a short way round this floor and everybody knows it.
      Eight bars, turn, eight bars, and you are back where you began.
      It is the one they teach the young ones and it works in a small room
      and it is not what any of these four hundred people came for.
      Take the long way round. Go all the way to the wall.
      The wall is where the good part of the evening happens.

      [Chorus]
      The long way round the floor and back again,
      past the door, past the coats, past the ones who came to watch.
      Nobody is counting and nobody is timing you.
      We will keep playing while there is anybody moving.

      [Verse 2]
      We were going to finish this one at the second time around.
      Hessa had her bow up. Marda had the look.
      And four hundred people on a cold night did not stop,
      so the four of us went round it again and did not say anything.
      You cannot be the one who stops it. That is the whole job.
      The band is the last thing in the hall that is allowed to be tired.

      [Instrumental - fiddle break, twenty-four seconds, the floor still going]

      [Verse 3]
      A man came off a hauler at the port hall at eleven
      with a full manifest still to sign and ice all down his coat,
      and he has been on this floor since and he has not sat once,
      and the cargo is going to be exactly where he left it in the morning.
      There is a woman who works the scrubber shift at six
      dancing like the shift is somebody else's problem, which it is not.

      [Chorus]
      The long way round the floor and back again,
      past the door, past the coats, past the ones who came to watch.
      Nobody is counting and nobody is timing you.
      We will keep playing while there is anybody moving.

      [Final Chorus - harmony a third below, the floor over the top]
      The long way round, and round, and one more time,
      and the keeper at the back can look at us all he likes.
      Nobody is counting and nobody is timing you.
      This is the longest thing we ever put on a record.

      [Outro - long fade, the dancers still going]
