  - id: s_0647
    title: Walk Home Cold
    track_number: 13
    mood: [tired, warm, midtempo]
    fact: >-
      The band played it to an empty hall after the dancers had gone, and it is the only track on the
      record with no audience on it at all.
    arrangement_note: the only track on the record with nobody in the room, so the hall's own reverberation is suddenly audible where four hundred bodies had been absorbing it, and the band plays quieter than anywhere else because there is no longer anything to play over
    intro: 22
    outro: sustain
    target_duration: "4:35"
    prompt: >-
      116 BPM tired old-time reel; close female soprano, soft fiddle, empty reverberant dance hall.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, audience noise, applause, crowd, dancers, cold ending
    lyrics: |
      [Intro - fiddle alone in an empty hall, twenty-two seconds]

      [Verse 1]
      The last pair left together twenty minutes back.
      Their steps went past the ration store and faded at the berth.
      Four hundred coats had held the walls close all week.
      Now one fiddle note runs clear to the sea-end door.
      It comes back late, after everybody thinks it finished.
      Hessa plays the phrase again and waits to hear it return.

      [Chorus]
      Walk home cold, walk home slow, walk home talking.
      That is the second half of the night and nobody records it.
      Down past the ration store and the berth and the water,
      with the whole thing still going round in your head.

      [Verse 2]
      Two gate clerks walk the ice road with their stamps inside.
      The school cook carries both her shoes and one wet coat.
      A freight hand takes the long route past the water tanks.
      Somebody from the last ferry walks beside him without gloves.
      At every corner one of them says this is where I turn.
      At every corner both of them keep going straight.

      [Chorus]
      Walk home cold, walk home slow, walk home talking.
      That is the second half of the night and nobody records it.
      Down past the ration store and the berth and the water,
      with the whole thing still going round in your head.

      [Verse 3]
      Marda is asleep against the wall with a brush in her hand.
      Arel coils one cable, then uncoils the same one.
      The stove is out. Finn has gone to find the cart.
      There is one lamp on at the far end and it is not enough.
      No dancers, no gate clerk, nobody left to please.
      Four people play more quietly than they knew they could.

      [Final Chorus - harmony a third below, very quiet]
      Walk home cold, walk home slow, walk home talking,
      past the ration store, the berth, the water tanks.
      Say this is my corner. Keep on walking anyway.
      Put the chairs back. Put the lamp out. Leave together.

      [Outro - held chord left to decay into the empty hall]
