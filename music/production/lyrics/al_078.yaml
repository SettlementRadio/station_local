  - id: s_0639
    title: Hall Fee Paid
    track_number: 5
    mood: [driving, plain, midtempo]
    fact: >-
      Arel Tocke plays the whole track without the low string, which had broken on the third night
      and could not be replaced until the sessions were over.
    arrangement_note: the bass sits a register higher than anywhere else on the record because its low string is broken, which leaves a hole under the band that the guitar fills by playing lower and duller than usual, and the whole arrangement is built around not having a bottom end
    intro: 9
    outro: fade
    target_duration: "3:45"
    prompt: >-
      148 BPM plain fiddle reel; hard female soprano, high upright bass, low guitar, live dance hall.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, deep bass, sub-bass, low end weight
    lyrics: |
      [Intro - band, no low end, nine seconds]

      [Verse 1]
      The keeper laid the hall bill flat beside the stove.
      Six nights of light. Six nights of heat and doors.
      One line for the man who crawls beneath the floor
      with a lamp, a spanner and two boards across his back.
      Marda counted every line and pushed the coins across.
      The keeper counted once, then opened both his hands.

      [Chorus]
      The hall is paid. Put the money in the middle.
      Heat and light are settled. The floor is covered too.
      Four chairs, four hands, four shares before the ferry.
      Nobody at the door gets to count it twice.

      [Verse 2]
      Arel's low string broke before the third-night doors.
      No shop on this coast keeps another till the thaw.
      He moved his left hand higher and never looked at us.
      Finn dropped every guitar turn to meet him underneath.
      The dancers stamped straight through the missing bottom note.
      We heard the space. They only heard the floor.

      [Verse 3]
      Marda used the back side of a freight manifest.
      Ferry over. Coat hooks. Cart hire for the bass.
      A meal at midnight and the lamp beneath the boards.
      She drew four boxes round the little that remained.
      Arel took his share and bought a length of useless wire.
      He knew it would not fit. He bought it all the same.
      Marda folded the manifest and kept it in her coat.

      [Chorus]
      The hall is paid. Put the money in the middle.
      Heat and light are settled. The floor is covered too.
      Four chairs, four hands, four shares before the ferry.
      Nobody at the door gets to count it twice.

      [Final Chorus - harmony a third below]
      The hall is paid. Both doors are standing open.
      Four shares counted while the last coats disappear.
      Arel has three strings and a coil that does not fit.
      We have the ferry home and enough until next week.

      [Outro - fade]
