  - id: s_0636
    title: Two Coats to the Door
    track_number: 2
    mood: [brisk, wry, warm]
    fact: >-
      The tune is the one Wire and Rosin used to clear a hall at the end of a night, and it is the
      only track on the record the band had never played from the stage.
    arrangement_note: the band plays it at the tempo they use to get a hall empty rather than the tempo they use to fill one, dropping to guitar and brushes under the third verse as if the room were already thinning, and the harmony voice comes in late because it was never learned properly
    intro: 6
    outro: fade
    target_duration: "3:30"
    prompt: >-
      Reel-tempo rockabilly and old-time dance music, 156 BPM, brisk and wry, warm rather than hard.
      Female lead vocal, clear high soprano with a hard edge, sung in short phrases between fiddle
      passages, never a held note, plain and unornamented. One male harmony voice a third below the
      lead on the chorus only, entering slightly late, and nothing under the verses. Bright
      thin-toned composite fiddle, fretted acoustic-toned composite guitar, upright bass, cut-stock
      drum kit played with brushes and sticks. Tracked live in a wooden dance hall with two
      microphones and no click, takes short and slightly rushing, light slapback on the voice, the
      floor audible behind the band. Six seconds of fiddle and guitar before the first sung word.
      Four bars of unaccompanied fiddle after the second chorus. Guitar and brushes alone under
      the third verse, the band back for the last chorus. Fades out
      slowly with the room noise still under it.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, hard ending
    lyrics: |
      [Intro - fiddle and guitar, six seconds]

      [Verse 1]
      Every band that works a floor has one tune held in reserve
      that is never on the card and never gets announced.
      You do not play it early and you do not play it well.
      You play it when the keeper wants his hall back before the morning.
      Ours has been the same one since the year the last ferry changed,
      and until this week we had never played it from a stage.

      [Chorus]
      Two coats going out and forty still on the hook,
      and the ones still on the hook belong to people who will argue.
      Get your gloves, get your friend, get whoever brought you here,
      the doors are going to be shut whether you are through them or you are not.

      [Verse 2]
      It works because it does not sound like it is finishing.
      It sounds like something starting, so they stand there and they wait,
      and by the time the second turn comes round they have their coats
      and half of them are talking on the step and not inside.
      Finn worked that out in a hall in his first year
      and has been quietly proud of it since, which he would deny.

      [Chorus]
      Two coats going out and forty still on the hook,
      and the ones still on the hook belong to people who will argue.
      Get your gloves, get your friend, get whoever brought you here,
      the doors are going to be shut whether you are through them or you are not.

      [Turnaround - fiddle alone, four bars]

      [Verse 3 - guitar and brushes only]
      There is a man who has been last out of this hall for nine years.
      He helps stack the chairs so that nobody can tell him to go.
      He was on a hauler crew for thirty years before that
      and he says a room is not finished while there is anyone still in it.
      We are not going to be the ones who put him on the ice.
      We will play it round again and he can leave in his own time.

      [Final Chorus - full band, harmony late]
      Two coats going out and forty still on the hook,
      and the last one on the hook is the one we know by name.
      Get your gloves, get your friend, get whoever brought you here.
      We are going to keep playing until the room decides.

      [Outro - long fade, the room still talking]
    take: null # M-33 fills this in at the Suno sitting

  - id: s_0637
    title: Short Money Reel
    track_number: 3
    mood: [fast, hard, defiant]
    fact: >-
      Written about a dance promoter who paid the band in two instalments and never made the second,
      and Harbor Standard checked with a lawyer before agreeing to the title.
    arrangement_note: the fiddle takes a fourteen-second break where a fourth verse would have gone, played hard and without ornament, and the band stops dead for one bar before the last chorus in the place where the second payment did not arrive
    intro: 16
    outro: cold
    target_duration: "4:05"
    prompt: >-
      Reel-tempo rockabilly and old-time dance music, 176 BPM, fast and hard, defiant. Female lead
      vocal, clear high soprano with a hard edge, sung in short phrases between fiddle passages,
      never a held note, plain and unornamented, angrier than the tune. One male harmony voice a
      third below the lead on the chorus only, nothing under the verses. Bright thin-toned composite
      fiddle, fretted acoustic-toned composite guitar, upright bass, cut-stock drum kit played with
      brushes and sticks. Tracked live in a wooden dance hall with two microphones and no click,
      takes short and slightly rushing, light slapback on the voice, the floor audible behind the
      band. Sixteen seconds of unaccompanied fiddle before the first sung word. A fourteen-second
      hard fiddle break where a fourth verse would be. Whole band stops dead for one bar before the
      final chorus. Cold stop.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, fade-out
    lyrics: |
      [Intro - unaccompanied fiddle, sixteen seconds]

      [Verse 1]
      Half in the hand on the night and half at the end of the month.
      That is a normal arrangement and we have taken it before.
      We played the room, we filled the room, the man was very pleased,
      he shook all four of us by the hand and used our first names.
      He counted out the first half in front of everybody,
      which we should have noticed, and at the time we did not.

      [Chorus]
      Short money, short money, and a long walk to the berth.
      You can carry a bad night. A bad month is different.
      We are not asking for a favour and we are not asking twice.
      We are asking for the other half of what was said out loud.

      [Verse 2]
      The month went by. There was a message about a delay.
      Then a message about a hall fee we had not been told about.
      Then a message about the ferry and the weather on the coast,
      and after that there were no messages at all.
      Arel went to the office twice and stood there being polite,
      and the second time the office had a different name on it.

      [Chorus]
      Short money, short money, and a long walk to the berth.
      You can carry a bad night. A bad month is different.
      We are not asking for a favour and we are not asking twice.
      We are asking for the other half of what was said out loud.

      [Instrumental - fiddle break, hard and unornamented, fourteen seconds]

      [Verse 3]
      Every band on this coast can name him and not one of us can prove it,
      and the label had a lawyer read this before they let us cut it.
      So there is no name in this song and there is not going to be.
      He knows. We know. Half the floor tonight knows.
      Play it in his hall and watch him not react,
      and that is as close to an admission as anybody gets.

      [Break - whole band stopped, one bar]

      [Final Chorus - harmony a third below]
      Short money, short money, and a long walk to the berth.
      Ask a freight crew what a promise at the gate is worth.
      We are not asking for a favour and we are not asking twice.
      We will just keep playing this one everywhere we go.

      [Outro - cold stop]
