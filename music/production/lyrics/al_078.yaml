  - id: s_0635
    title: Nobody Sat Down
    track_number: 1
    mood: [fast, bright, driving]
    fact: >-
      Hessa Lund counted the tune in at the speed the hall was already clapping rather than the
      speed the band had rehearsed, and it is about four beats a minute faster than every later
      performance.
    arrangement_note: the record opens on the floor clapping alone for eight seconds, the fiddle comes in on the clap rather than against it, and the whole band arrives at the speed the room set instead of the speed the band rehearsed
    intro: 12
    outro: cold
    target_duration: "3:35"
    prompt: >-
      Reel-tempo rockabilly and old-time dance music, 172 BPM, fast and bright, driving hard from
      the first bar. Female lead vocal, clear high soprano with a hard edge, sung in short phrases
      between fiddle passages, never a held note, plain and unornamented. One male harmony voice a
      third below the lead on the chorus only and nothing at all under the verses. Bright thin-toned
      composite fiddle, fretted acoustic-toned composite guitar, upright bass, cut-stock drum kit
      played with brushes and sticks. Tracked live in a wooden dance hall with two microphones and
      no click, takes short and slightly rushing, light slapback on the voice, the floor and the
      dancers audible behind the band throughout. Opens on the floor clapping alone for eight
      seconds; the fiddle enters on the clap and the band arrives at the room's speed, faster than
      it means to. Cold stop with the clapping still going.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, studio silence at the top
    lyrics: |
      [Intro - the floor clapping alone, eight seconds, no instruments]

      [Verse 1]
      We had it at a hundred and sixty in the shed on Tuesday night,
      counted careful, counted level, every one of us agreed.
      Then four hundred people started clapping while we tuned,
      and the four of us looked sideways and not one of us said stop.
      You do not tell a room it has the tempo wrong.
      You come in where the room is and you argue afterwards.

      [Chorus]
      Nobody sat down. Nobody sat down.
      Not the ones who came to watch, not the ones who came to talk.
      Four hours in a hall that has no heating worth the name
      and the coldest thing in Cold Harbor was outside the door.

      [Verse 2]
      Hessa put the fiddle up and took the speed off the floor,
      and Marda found it second and the bass came in behind.
      Four beats faster than we ever played it since,
      which you can hear if you have heard us play it anywhere else.
      A settlement that races on the ice all winter
      is not going to be told what a fast tune is.

      [Chorus]
      Nobody sat down. Nobody sat down.
      Not the ones who came to watch, not the ones who came to talk.
      Four hours in a hall that has no heating worth the name
      and the coldest thing in Cold Harbor was outside the door.

      [Verse 3]
      There were people on that floor who had come off a freight crew
      at the end of a long run with the cargo still to sign,
      and they went straight past the berth and straight past their own beds
      because somebody had said there was a band in the exchange hall.
      They will feel it in the morning and they knew that at the time.
      That is not our fault and it is not exactly not.

      [Final Chorus - harmony a third below, the floor coming in]
      Nobody sat down. Nobody sat down.
      Not the ones who came to watch, not the ones who came to talk.
      Six nights in a hall with the doors iced up at the hinge,
      and nobody sat down and nobody went home.

      [Outro - cold stop, the clapping carrying on into the silence]
