  - id: s_0640
    title: The Long Way Round the Floor
    track_number: 6
    mood: [bright, rolling, generous]
    fact: >-
      It runs longer than anything else on the record because the dancers would not stop and the
      band did not want to be the ones who did.
    arrangement_note: the longest track on the record and the only one that goes round the tune four times, with an unusually long fiddle break in the middle taken at the dancers' insistence rather than the band's, and the last chorus arriving much later than the shape of the song predicts
    intro: 18
    outro: fade
    target_duration: "5:15"
    prompt: >-
      158 BPM rolling fiddle reel; hard female soprano, long fiddle break, tireless live dance floor.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, cold ending
    lyrics: |
      [Intro - fiddle and guitar, eighteen seconds]

      [Verse 1]
      Eight bars takes the young ones down the middle.
      Eight more brings them safely to the place they left.
      Tonight they pass the turn and carry on toward the wall.
      Coats brush shoulders. Gate clerks lose the count.
      A girl in borrowed boots goes farther every time.
      Her brother waits at centre and she waves him on.

      [Chorus]
      The long way round the floor and back again,
      past the door, past the coats, past the ones who came to watch.
      Take the far turn. Let the near turn go.
      Come back when the room brings you around.

      [Verse 2]
      At the second ending Hessa raised the bow.
      Marda closed the pattern. Arel faced the door.
      Four hundred boots kept going past the final bar.
      The girl in borrowed boots had reached the coats again.
      Hessa dropped the bow and caught the moving beat.
      Nobody on the floor had asked for anything but more.

      [Instrumental - fiddle break, twenty-four seconds, the floor still going]

      [Verse 3]
      A man came off a hauler at the port hall at eleven
      with a full manifest still to sign and ice all down his coat,
      and every turn takes him past the unsigned page.
      It will be waiting at the berth when morning comes.
      A woman on the scrubber shift keeps checking the hall clock.
      Each time she sees it, she goes the long way once again.

      [Chorus]
      The long way round the floor and back again,
      past the door, past the coats, past the ones who came to watch.
      Take the far turn. Let the near turn go.
      Come back when the room brings you around.

      [Final Chorus - harmony a third below, the floor over the top]
      The long way round, and round, and one more time,
      past the keeper with his keys held at his side.
      The scrubber shift is coming. The manifest still waits.
      One more far turn. Nobody takes the short way home.

      [Outro - long fade, the dancers still going]
