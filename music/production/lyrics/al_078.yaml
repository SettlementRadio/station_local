    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, deep bass, sub-bass, low end weight
    lyrics: |
      [Intro - band, no low end, nine seconds]

      [Verse 1]
      A hall costs money before anybody has been paid.
      Heat costs money. Light costs money. The floor costs most of all,
      because a floor that four hundred people are going to work
      needs somebody underneath it twice a year with a spanner.
      Whoever tells you a dance is free has never hired a room.
      Somebody always paid. It is only ever a question of who.

      [Chorus]
      Room is paid for, and the rest of it is ours,
      and the rest of it divides four ways at the end of the night.
      Not five ways. Not a share for the man who owns the door.
      Four ways at a table with the money in the middle.

      [Verse 2]
      Arel's bass broke a string on the third night of the six
      and there is nothing on this coast that fits it until the thaw.
      So he has played the whole record in the middle of the instrument
      and Finn has gone down to meet him and it sounds like another band.
      Nobody in that hall noticed and every one of us did.
      You can hear the hole in it. We decided to keep the hole.

      [Verse 3]
      Marda worked out the arithmetic on the back of the manifest
      because it was the only paper anybody had that night.
      Hall, heat, the ferry over, what the coats cost to store,
      what we owe the man who lends us a cart for the bass.
      What was left was enough and it was not much more than enough,
      and all four of us said yes and nobody said it twice.

      [Chorus]
      Room is paid for, and the rest of it is ours,
      and the rest of it divides four ways at the end of the night.
      Not five ways. Not a share for the man who owns the door.
      Four ways at a table with the money in the middle.

      [Final Chorus - harmony a third below]
      Room is paid for and the doors are still open,
      and there is nobody standing at them counting who came in.
      Four ways at a table with the money in the middle,
      and a broken string, and the best week of the year.

      [Outro - fade]
