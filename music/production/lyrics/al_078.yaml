      fiddle passages, never a held note, plain and unornamented. One male harmony voice a third
      below the lead on the chorus only, nothing under the verses. Bright thin-toned composite
      fiddle, fretted acoustic-toned composite guitar played low and dull, upright bass with no
      bottom end at all — the low register missing entirely, the bass working in its middle. No
      sub-bass anywhere. Cut-stock drum kit with brushes and sticks. Tracked live in a wooden dance
