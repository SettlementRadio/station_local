  - id: s_0645
    title: Come Back Through the Side Door
    track_number: 11
    mood: [quick, sly, warm]
    fact: >-
      Finn Derrow wrote it about getting into dances without paying, and he refused to say whether
      the route he describes was a real one.
    arrangement_note: the guitar leads the whole tune instead of the fiddle, which is the only time that happens on the record, and the fiddle answers it in short two-bar phrases like somebody keeping a lookout
    intro: 3
    outro: cold
    target_duration: "3:40"
    prompt: >-
      170 BPM sly guitar-led reel; hard female soprano, short fiddle replies, live dance hall.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, fiddle-led arrangement, fade-out
    lyrics: |
      [Intro - guitar alone, three seconds]

      [Verse 1]
      There is a way into this hall that does not go past the desk.
      It involves a stack of cargo crates, a gap, and a certain amount of nerve,
      and a man on the inside who is looking the other way
      for reasons that are between him and whoever asked him to.
      Finn wrote this one and Finn will not say if it is true.
      Finn has also never once paid to get into a dance.

      [Chorus]
      Round the back, past the coats, and up the second step.
      Do not run. Nobody ever got caught walking.
      If a keeper stops you, tell him you are with the band.
      Everybody is with the band. That is the whole system.

      [Verse 2]
      The keeper knows. Of course the keeper knows.
      He has run this hall for nineteen years and he can count.
      He knows how many came in and he knows what the take was
      and he knows those numbers have never once agreed.
      He also knows a full hall is worth more than a fair one
      and that is the arrangement nobody has ever written down.

      [Chorus]
      Round the back, past the coats, and up the second step.
      Do not run. Nobody ever got caught walking.
      If a keeper stops you, tell him you are with the band.
      Everybody is with the band. That is the whole system.

      [Verse 3]
      There were four of us once who could not afford a ticket
      to a dance in this same hall about two hundred nights ago,
      and there is a stack of cargo off a hauler at the sea end still,
      and the gap is still there, and we have never mentioned it.
      We are the band now and we get in at the front,
      and every one of us still looks at that gap going past.

      [Bridge]
      Finn came through once with rosin on both sleeves.
      The keeper looked at him, then looked at the clean fiddle case.
      Finn said he was with the band. The keeper opened the door.
      Neither one has ever settled which of them was joking.

      [Final Chorus - harmony a third below]
      Round the back, past the coats, and up the second step.
      Do not run. Nobody ever got caught walking.
      There is a rate at that desk and it is not a small one,
      and there is a stack of crates, and the floor does not care how you came.

      [Outro - cold stop]
