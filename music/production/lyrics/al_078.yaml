  - id: s_0646
    title: One More Before the Doors
    track_number: 12
    mood: [fast, urgent, bright]
    fact: >-
      This is the sixth night's last tune and the last thing recorded, and the hall keeper can be
      heard asking the band to finish before the first verse.
    arrangement_note: a man's speaking voice is audible over the introduction asking the band to finish, the band does not acknowledge it and starts anyway, and the fiddle takes a short hard break in the middle that gets faster rather than staying level
    intro: 8
    outro: cold
    target_duration: "4:00"
    prompt: >-
      178 BPM urgent fiddle reel; hard female soprano, keeper speaks at intro, accelerating break.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, fade-out, ritardando
    lyrics: |
      [Intro - eight seconds, the hall keeper's voice off-microphone asking the band to finish]

      [Verse 1]
      The keeper calls from the side door: finish now.
      Hessa lifts the bow before his last word lands.
      He has the keys in one hand and our coats in the other.
      The ferry leaves at six. His morning starts at five.
      He points at the clock. The floor points back at us.
      Marda gives the count. The keeper shuts his eyes.

      [Chorus]
      One more before the doors. One more and we are done.
      Sixth night, last tune, and the sixth night is the good one.
      Whatever you were saving, this is what you saved it for.
      Get out on that floor. There is not going to be another.

      [Verse 2]
      The woman from the ration store has found one glove.
      A freight hand holds the other high above the floor.
      The young one on the chair is dancing in her socks.
      Both gate clerks have left tomorrow's forms unsigned.
      The keeper sees each one and adds it to the clock.
      Nobody moves toward the coats when the fiddle turns.

      [Instrumental - fiddle break, ten seconds, getting faster]

      [Verse 3]
      Marda has not been able to feel her hands since Wednesday.
      Arel is playing on a bass with a string that is not there.
      Hessa has sung for six nights on a throat full of ice air
      and Finn has been a full line behind since the second night.
      The bow hair hangs loose. One brush has lost its wire.
      The floor comes in ahead and pulls us through the turn.
      Marda laughs when the loose brush catches on the skin.
      Arel finds the missing bottom in the boards below.

      [Final Chorus - harmony a third below, the floor over the top]
      One more before the doors. One more and we are done.
      Last ferry, first shift, every reason to be gone.
      Whatever you were saving, spend it on the final turn.
      The keeper gets his hall when the last boot leaves the floor.

      [Outro - cold stop, dead on the beat]
