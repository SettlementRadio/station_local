  - id: s_0641
    title: Weather Off the Water
    track_number: 7
    mood: [cold, quick, restless]
    fact: >-
      Marda Kell plays the whole track with brushes on a single cut drum because the hall's floor was
      already carrying the rest of the rhythm.
    arrangement_note: one cut drum played with brushes and nothing else from the kit anywhere on the track, with the dancers' feet on the wooden floor doing the work the rest of the kit would do, and the band drops out completely twice to leave the floor alone for a bar
    intro: 10
    outro: sustain
    target_duration: "3:40"
    prompt: >-
      168 BPM cold fiddle reel; hard female soprano, one brushed drum, boot-stomp floor, live hall.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, full drum kit, cymbals, fade-out, cold ending
    lyrics: |
      [Intro - fiddle, guitar and one brushed drum, ten seconds]

      [Verse 1]
      It comes off the water and it comes in under the door
      and there is no coat made anywhere that keeps it out for long.
      Four days it has been doing this and four days it will do it again,
      and the ferry has not run since the middle of last week.
      You can hear it on the roof if the band stops long enough,
      which is one of several reasons why the band does not stop.

      [Chorus]
      Weather off the ice, weather at the wall,
      and forty coats still steaming in a hall with one small stove.
      Keep moving, keep moving, that is the entire trick.
      The cold gets the ones who stand about deciding.

      [Break - band out, the floor alone, one bar]

      [Verse 2]
      Marda heard the boot heels rolling under us.
      She set both sticks down and kept one cut drum.
      Brush on the skin. Four hundred feet below it.
      She left a space and every boot came through.
      One small circle from her wrist held all of them together.
      By midnight both her sleeves were wet with work.

      [Chorus]
      Weather off the ice, weather at the wall,
      and forty coats still steaming in a hall with one small stove.
      Keep moving, keep moving, that is the entire trick.
      The cold gets the ones who stand about deciding.

      [Verse 3]
      There is a bulkhead door at the sea end that has iced up twice
      and a man has been out to it twice with a lamp and a bar.
      He comes back in, he stamps, he does not say a word,
      he takes his gloves off and he goes straight back on the floor.
      At midnight the latch freezes hard a third time.
      He sees the keeper looking and reaches for his gloves.

      [Break - band out, the floor alone, one bar]

      [Final Chorus - harmony a third below]
      Weather off the ice, weather at the wall,
      and the long night outside doing what the long night does.
      Keep moving, keep moving, that is the entire trick,
      and the door holds till the morning if somebody keeps going out to it.

      [Outro - held chord, the floor still going]
