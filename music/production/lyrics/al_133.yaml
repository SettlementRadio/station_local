    title: The Route in Order
    track_number: 1
    mood: [driving, warm, brisk]
    fact: >-
      The running order is the order the band's annual route visits the four settlements, and Isa
      Lorne refused every rearrangement Deep Register proposed.
    arrangement_note: recorded in the first hall of the route, so the room on this track is the largest on the record and everything after it is smaller
    intro: 10
