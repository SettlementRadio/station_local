    prompt: >-
      Even mid-tempo heartland rock, 126 BPM, driving and warm, brisk. Female lead vocal, warm mid
      alto, level and unhurried, plain diction, ending lines flat rather than lifting them, never
      belting. No backing vocal of any kind anywhere; the second guitar answers every vocal line
      where a harmony voice would be. Two bright thin-toned electric guitars hard apart, electric
      bass, resonance pipes doubling the bass under the chorus with a deep alloy organ tone, drum
      kit. Tracked live in a large settlement hall, the biggest room on the record, steady unhurried
