    lyrics: |
      [Intro - 4 seconds, drums and rhythm guitar, no vocal]

      [Verse 1]
      Two lines in and there was a noise from the far side
      that I have heard about four hundred times in nineteen years
      and I did not turn round, because turning round is how you stop,
      and I have stopped for that noise before and it cost us a take.

      [Chorus]
      Five strings will do. Five strings have always done.
      Nobody in that hall knew there were six to start with.
      You go round the hole in it and you keep the shape
      and you tell them about it afterwards or you do not.

      [Verse 2]
      He got most of it. There is a place in the second chorus
      where the figure reaches for something that has gone
      and comes back down a different way and it is better,
      and he has played it that way ever since on all six.

      [Instrumental - lead guitar break on five strings, 14 seconds]

      [Verse 3]
      I have watched a hauler crew take a full hold out of a bay
      with two people short and a lift that would only go one way,
      and nobody in the transfer hall could tell afterwards,
      and they did not tell anybody either, which is the same thing.

      [Chorus]
      Five strings will do. Five strings have always done.
      Nobody in that hall knew there were six to start with.
      You go round the hole in it and you keep the shape
      and you tell them about it afterwards or you do not.

      [Bridge]
      He was furious for about an hour and then he heard it back.
      Nineteen years and it is the only take of his I have ever heard him play twice.

      [Final Chorus]
      Five strings will do. Five strings have always done,
      and the whole of that room went home not knowing anything,
      and it is on the record, and the reason it is on the record
      is that it is the best thing he has ever played.

      [Outro - cold stop]
