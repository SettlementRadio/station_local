      [Verse 2]
      Their pipes are bolted to the wall and are older than the hall
      and are half a beat slow because of how long they are,
      and a woman came in the afternoon before and worked on them
      and would not tell anybody what she had changed,
      and marked the number on her cuff and went and sat at the side
      and did not come to the front once all evening.

      [Instrumental - lead guitar break, 12 seconds]

      [Verse 3]
      So the chorus lands and then the bottom of it lands after,
      which sounds like a mistake for about four bars
      and then sounds like the only way this song could ever go,
      and we have played it that way in every hall since.

      [Chorus]
      The first one of the year. Nobody is any good at it.
      Not us, not the keeper, not the man who does the lights.
      Everybody is a season out of practice at once
      and everybody knows it and nobody says it.

      [Final Chorus]
      The first one of the year, and the coats come off,
      and the second one is better and the third one is the one,
      and nobody at the third one knows what the first one cost
      and I would not go back and skip it for anything.

      [Outro - cold stop, the pipes last]
