    lyrics: |
      [Intro - 12 seconds, both guitars, no vocal]

      [Verse 1]
      Every year at the second hall the same man comes out
      before we have got the doors of the van properly open
      and says the same eleven things in the same order
      and has done since the year two thousand six hundred.

      [Chorus]
      Ask the keeper. The keeper has been here longer.
      Longer than the label, longer than the route,
      longer than the four of us and the band before us,
      and everything anybody needs to know is in those eleven things.

      [Verse 2 - at speaking pace, the band waiting]
      You are early. The heating is on. It has been on since six.
      Do not put anything on the left-hand rail, it is a bulkhead.
      There is tea. There is not much tea. Somebody took the tea.
      The floor is wet by the far door and it is not going to dry.
      Same as last year. Same as last year. In you come.

      [Chorus]
      Ask the keeper. The keeper has been here longer.
      Longer than the label, longer than the route,
      longer than the four of us and the band before us,
      and everything anybody needs to know is in those eleven things.

      [Verse 3]
      I asked him once what he did before he did this
      and he looked at me as though I had asked what colour the hall was,
      and said he had done this, and that was the whole answer,
      and I have never asked another question in nineteen years.

      [Chorus]
      Ask the keeper. The keeper has been here longer.
      Longer than the label, longer than the route,
      longer than the four of us and the band before us,
      and everything anybody needs to know is in those eleven things.

      [Bridge]
      He will not come to the front. He watches from the side door.
      He has seen every band this settlement has had.

      [Final Chorus]
      Ask the keeper. The keeper has been here longer.
      One day we will arrive and it will be somebody else
      and they will say something different and it will be fine
      and I will sit in the van for a minute before I go in.

      [Outro - fade]
