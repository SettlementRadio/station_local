      [Verse 1]
      It is always at the end. It is never at the beginning.
      Nobody has ever put a page in front of me at ten in the morning
      with a cup of something and an hour to look at it,
      and I have thought about why that is for nineteen years.

      [Chorus]
      Nothing gets signed at the table. Not one thing.
      Not in a good mood, not after a good night,
      not because it is easier than saying it out loud,
      not ever, and I have said it to eleven people now.

      [Verse 2]
      They are not villains. Most of them are tired too
      and have been told to come back with something signed
      and have a room booked out and a departure in the morning
      and they are asking me to solve their week with my year.

      [Chorus]
      Nothing gets signed at the table. Not one thing.
      Not in a good mood, not after a good night,
      not because it is easier than saying it out loud,
      not ever, and I have said it to eleven people now.

      [Verse 3]
      The first time I said it I was shaking and I said it badly
      and the man laughed, not unkindly, and put the page away,
      and it was fine, it was completely fine, nothing happened,
      and it took me another four years to believe that.

      [Verse 4]
      Take it home. Read it at a table you are paying for.
      Read the fourth page. Read the paragraph at the bottom.
      Then say yes on a Tuesday morning in your own settlement
      or say no on a Tuesday morning, which is also a thing you can do.

      [Final Chorus]
      Nothing gets signed at the table. Not one thing.
      That is the only piece of advice I have got
      and it is not about music and it never was,
      and every crew on every lane could tell you the same.

      [Outro - cold stop]
