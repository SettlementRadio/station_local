    exclude: backing vocals of any kind, group or shouted choruses, synthesizers, electronic drums, brass, orchestral strings, stadium reverb, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 10 seconds, both guitars and the hall, no vocal]

      [Verse 1]
      Same four settlements, same four halls, same order, every year,
      four halls off one lane and nineteen years of doing it,
      and we have done it nineteen times and it has never once been discussed,
      and people ask whether we get bored and the answer is no,
      and the reason is not a good one, it is just true.

      [Chorus]
      The route in order. That is how it goes on the record.
      Not the loud one first and the slow one at the end,
      the way we actually arrive at them, in the order the year does,
      and if that makes a bad first side then it makes a bad first side.

      [Verse 2]
      A man from the label had four other orders drawn up,
      and every one of them was better, and I said no to all four,
      and he asked me why and I did not have a reason he would take,
      and I said it anyway and he wrote it down and printed it.

      [Chorus]
      The route in order. That is how it goes on the record.
      Not the loud one first and the slow one at the end,
      the way we actually arrive at them, in the order the year does,
      and if that makes a bad first side then it makes a bad first side.

      [Verse 3]
      There are people in the second settlement who have seen us
      more times than my own brother has, and by a long way,
      and there is a woman at the fourth one who has stood in the same place
      since the year we started and has never spoken to me once.

      [Bridge]
      Nineteen years is not loyalty, it is a road that goes that way.
      But it starts as a road and it turns into something.

      [Final Chorus]
      The route in order. That is how it goes on the record,
      and the halls get smaller as it goes and so does the band,
      and by the end of it we are in a yard in Forge
      with three days paid for out of my own pocket.

      [Outro - fade, the hall last]
