      declined to book a fifth room.
    arrangement_note: the first of the three Forge yard tracks, so the room shuts down to something small and close after four halls, and the pipes are further away than they have been all record
    intro: 18
    outro: fade
    target_duration: "4:50"
    prompt: >-
      Even mid-tempo heartland rock at its slowest, 100 BPM, weary and plain, slow. Female lead
      vocal, warm mid alto, level and unhurried, plain diction, ending lines flat rather than
      lifting them, never belting. No backing vocal of any kind anywhere; the second guitar answers
      every vocal line where a harmony voice would be. Two bright thin-toned electric guitars hard
      apart, electric bass, resonance pipes doubling the bass under the chorus but set further back
      than elsewhere on the record, drum kit played quietly. Tracked live in a small dry yard
      building, close and unglamorous after four halls, steady unhurried drums, light compression.
      Eighteen seconds of one guitar and the room before the first sung word. Fade.
    exclude: backing vocals of any kind, group or shouted choruses, synthesizers, electronic drums, brass, orchestral strings, stadium reverb, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 18 seconds, one guitar and the room, no vocal]

      [Verse 1]
      Four halls and then the money stopped, which we were told
      in a message that came down the carrier wave while we were loading
      out of the third hall with the van half full in the rain,
      and there are three songs left and there is nowhere to do them
      and everybody in the van already knew what I was going to say.

      [Verse 2]
      There is a yard building in Forge that is empty most weeks
      and the man who has the keys wanted almost nothing for it,
      and I paid him out of my own account on the Thursday morning
      and did not tell the band the number and they did not ask.

      [Chorus]
      Three days in a yard. Nobody is going to hear the difference
      except the four of us, and we hear it every time.
      The room is small and the record is finished
      and finished is the only thing that has ever mattered.

      [Verse 3]
      It is not a noble thing and I do not want it made into one.
      It is a bad deal, of the kind every freight crew knows,
      and I took it because the only alternative
      was a record with four songs on it and an argument
      that would have gone on until the following spring.

      [Chorus]
      Three days in a yard. Nobody is going to hear the difference
      except the four of us, and we hear it every time.
      The room is small and the record is finished
      and finished is the only thing that has ever mattered.

      [Bridge]
      I got it back inside two years, which I did not expect.
      That is not why I did it and it is nice that it happened.

      [Final Chorus]
      Three days in a yard, in the cold, with the door open,
      and the last three songs on this record are the best three.
      Somebody has to decide and then pay for deciding.
      It is the one part of this job nobody ever tells you about.

      [Outro - fade on the room]
