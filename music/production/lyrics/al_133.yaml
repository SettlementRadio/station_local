      [Verse 1]
      It is always cold and it is always the wrong week for it
      and half the settlement has not been out since the sealed season
      and they come in with their coats on and keep them on
      and by the third song there is a pile of them by the door,
      and somebody's ration of something warm is going round the back row.

      [Chorus]
      The first one of the year. Nobody is any good at it.
      Not us, not the keeper, not the man who does the lights.
      Everybody is a season out of practice at once
