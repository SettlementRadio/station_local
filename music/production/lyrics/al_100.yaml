  - id: s_0823
    title: Lamp Room Round
    track_number: 4
    mood: [close, warm, communal]
    fact: >-
      Sung in the yard's lamp room rather than the hall because the band wanted the walls, and the
      door being opened halfway through is on the take.
    arrangement_note: a nine-foot metal room with a half-beat slap on every voice, and a door opening halfway through that makes the room briefly twice the size before it shuts again
    intro: 4
    outro: fade
    target_duration: "3:45"
    prompt: >-
      82 BPM close round; clear lead, three staggered voices, metal slap, organ, guitar, door opens, fade.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, large hall reverb, close modern vocal production, vocal tuning, whispered or rapped sections, cold ending
    lyrics: |
      [Intro - four voices humming, four seconds]

      [First line - lead alone]
      Bring the storm inside; these metal walls can hold it.

      [Verse 1]
      Lake wind drives the lower-yard lamps sideways.
      Four wet coats crowd the hooks above the bench.
      Beyond the door, the weather feed keeps changing,
      every update later than the one before.
      Inside, a small flame steadies under glass.
      One low line returns from every metal wall.
      We cannot calm the lake, so we answer one another.

      [Round - four voices in a small metal room]
      Light the lamps and set them down along the wall.
      Keep one burning for the berth beyond the weather.
      If your own voice fails, take the one returning.
      Four breaths enter; every wall sends more.

      [Verse 2]
      Halfway through, the door lifts on its upper runner.
      Cold lake air lays flat the little flame.
      A child stands framed there, searching every face,
      one parent still assigned to the last repair boat.
      The room grows wide enough to hold the outer dark.
      Then the door comes down; the metal gathers close.
      Five wet coats now hang above the bench.

      [Round - four voices in a small metal room]
      Light the lamps and set them down along the wall.
      Keep one burning for the berth beyond the weather.
      If your own voice fails, take the one returning.
      Four breaths enter; every wall sends more.

      [Verse 3]
      Near morning, one green marker clears the breakwater.
      The child sees it first through scratched door glass.
      No one shouts; the lamp room has gone past shouting.
      We turn the flames down, count the coats, unlatch the door.
      The storm will leave salt on every hook and hinge.
      Tomorrow other hands will trim these lamps for work.
      Tonight their walls have carried more than light.

      [Final Round - four voices in a small metal room]
      Light the lamps and set them down along the wall.
      Keep one burning for the berth beyond the weather.
      If your own voice fails, take the one returning.
      Open the door. The last green marker is coming home.

      [Coda - fade, one voice last]
