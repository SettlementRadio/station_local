# Written by M-25. **The file shape is fixed by al_001.yaml — read that header once.** Production
# vocabulary (COMMISSION.md §8): never enters the wiki, never said on air. Lyrics written by hand;
# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# Cut in a Titan lake yard's hall over two evenings in 2611 and issued at the road head in 2612 —
# the first Shore Rounds record to leave the home system, and **not the record Titan bought**: the
# crate had room for eight songs, the importer dropped the ninth and told nobody, and the band
# learned of it in 2616 from a listener's letter. `s_0827` is written as the last track of a record
# that is one song short and says so, which is the only place the missing ninth reaches the air.
#
# **This band's shape is the round and the lyrics are written for it.** Effa Lomm sings the first
# line of every round alone; Bran Teale enters a bar behind her on the same words; Ilva Reske a bar
# behind him; Kell Moray last and underneath, the place he asked for in 2598 and has kept. The
# `[Round]` sections are written to be entered a line apart and the `[First line]` sections are one
# voice with nothing under it. There is no drum kit anywhere in this band and nothing here asks for
# one.
#
# Two songs break the card and both are wiki facts. **`s_0824` is one voice with nothing at all
# under it** — Effa Lomm asked the others to leave the hall — and its exclude line keeps every other
# voice and every instrument out. **`s_0825` carries the only overdub on any Shore Rounds record**,
# Ilva Reske's low harmony sung again after the others had gone home, against a production line that
# says no overdubs (D-096). Bran Teale plays with two fingers taped throughout, so the guitar parts
# are three chords and no more, everywhere on the record and not only on `s_0822`.
#
# `generation:` and every `take:` were filled from the dispatch manifest at M-34. All eight takes
# match their lyric exactly and the record is complete.

