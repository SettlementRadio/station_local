  - id: s_0826
    title: Money in the Wrong Pocket
    track_number: 7
    mood: [wry, brisk, blunt]
    fact: >-
      About a yard clerk who paid the crews late for a year, and the importer had the name in the
      third verse taken out before pressing it at the road head.
    arrangement_note: the third verse has a hole in it where a name was and the lyric says so rather than filling it, so the band sing round a gap that the listener can hear being left
    intro: 5
    outro: cold
    target_duration: "3:30"
    prompt: >-
      100 BPM brisk folk blues; clear female lead, staggered trio, guitar, bass, hand drum, cold stop.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, vocal tuning, whispered or rapped sections, fade-out
    lyrics: |
      [Intro - guitar and hand percussion, five seconds]

      [Verse 1]
      For eleven years the wage came through on Friday.
      Then one winter Friday passed without the sum.
      Monday found it pending, Tuesday found it altered,
      Wednesday found the clerk behind a newly locked door.
      At the top yard, nobody could see a problem.
      At the berth, each freight crew counted meals and heat.
      Missing money always knows exactly whom to visit.
      The heating meter does not accept explanations.
      Neither does the child awake behind the wall.

      [Chorus]
      Money in the wrong pocket is still money.
      Warm and comfortable, earning for somebody.
      Ask the empty pocket if the difference is small.

      [Verse 2]
      One week means nothing with a month behind you.
      One week means six ration marks spread across nine days,
      a child kept from the storm because the boots need sealing,
      one relay charge declined, one landlord at the door.
      She keeps every figure underneath the kitchen lamp.
      By Thursday, what the office calls a brief delay
      has eaten every soft thing from the coming week.
      Her boots may cross the winter if the failing seal holds.
      The seal can wait. The hunger cannot do the same.

      [Chorus]
      Money in the wrong pocket is still money.
      Warm and comfortable, earning for somebody.
      Ask the empty pocket if the difference is small.

      [Verse 3]
      The manifest has every worker, hour and berth,
      every transfer signed, each late amount approved.
      Between the words released and paid, one space lies open.

      [One beat left empty]

      Leave it bare. The yard can hear what should be there.
      A missing word may travel farther than a spoken one.
      The locked office may keep whatever word was taken.
      The crews keep all the days that word withheld.
      Friday comes at last. The empty beat remains.

      [Final Chorus]
      Money in the wrong pocket is still money.
      Warm and comfortable, earning for somebody.
      Ask the empty pocket. It remembers every day.

      [Outro - cold stop]
