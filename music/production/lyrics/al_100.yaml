      [Intro - reed organ and guitar, ten seconds]

      [First line - lead alone]
      Last boat in, and the lamps go along the wall.

      [Verse 1]
      Eight green markers rest against the return board.
      One square stays dark beneath the marked storm-season time.
      Tools go back in lockers; nobody goes home.
      The ration room keeps soup below a simmer.
      At the outer berth, one woman holds two coats,
      watching every light divide across the water.
      Evening has no end while one boat keeps it open.

      [Round - four voices, a bar apart]
      Sing the last boat in, and the last light on.
      Sing for whoever is still out on the water.
      Come in behind me. Leave a place for one more voice.

      [Verse 2]
      Relay weather loses contact past the northern reeds.
      Search lamps move like needles over black glass.
      The woman folds one coat and opens it again.
      Her child sleeps upright on a coil of working rope.
      No one offers comfort large enough to sound dishonest.
      Someone starts the lowest line beside the gate.
      Other voices enter where the fear leaves room.

      [Round - four voices, a bar apart]
      Sing the last boat in, and the last light on.
      Sing for whoever is still out on the water.
      Come in behind me. Leave a place for one more voice.

      [Verse 3]
      Near dawn, a weak lamp answers from the snow line.
      Then it disappears. Then answers once again.
      The marker board stays dark; the yard keeps watching.
      Hope is not arrival. Hope is one more signal.
      The woman puts both coats across her shoulders.
      No one closes out the manifest or song.
      The lake has not returned the final line.

      [Final Round - four voices, the last entry held]
      Sing the last boat in, and the last light on.
      Sing for whoever is still out on the water.
      Come in behind me. Leave a place for one more voice.
      One more to come. One more to come. One more—

      [Coda - fade]
