  - id: s_0822
    title: Wet Rope, Cold Hands
    track_number: 3
    mood: [plain, midtempo, hard]
    fact: >-
      Bran Teale plays it with two fingers taped together after a yard injury, and the part was cut
      down to what he could reach on the evening.
    arrangement_note: the guitar is three chords and nothing more anywhere on the track, played by a man with two fingers taped, and the arrangement was cut to fit the hand rather than the hand worked round the arrangement
    intro: 6
    outro: cold
    target_duration: "3:35"
    prompt: >-
      94 BPM folk blues; clear female lead, staggered trio, three-chord guitar, bass, hand drum, stop.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, vocal tuning, whispered or rapped sections, elaborate guitar work, fade-out
    lyrics: |
      [Intro - guitar and bass, six seconds]

      [Verse 1]
      He came through the berth gate with two fingers bound,
      lake water in his boots and blood beneath the tape.
      The yard nurse wrote fourteen days of lighter duty.
      The pay clerk turned the paper toward a smaller sum.
      At home, she cut his supper and unfastened both his sleeves.
      Neither called it bravery. Neither called it fair.
      The storm kept working every loose frame in the wall.

      [Chorus]
      Wet rope and cold hands and a yard that does not stop.
      Tie the working hand to mine until the swelling goes.
      A wage can lose two fingers and still call itself complete.

      [Verse 2]
      She had worked the same deck in her first storm season,
      carried one white scar across the centre of her palm.
      Every winter made the old line rise against the skin.
      She placed that hand beneath his bandaged one at midnight,
      not to prove she understood or tell him what came next,
      only so the pain had something warmer underneath.
      Outside, the freight crews changed beneath the bell.

      [Chorus]
      Wet rope and cold hands and a yard that does not stop.
      Tie the working hand to mine until the swelling goes.
      A wage can lose two fingers and still call itself complete.

      [Verse 3]
      On Thursday he returned before the tape came loose,
      took the shore-side manifest and stayed away from lines.
      Pride lasted till the cold went through his borrowed glove.
      At noon he used the canteen relay to call her home.
      She did not praise him for enduring or condemn him for the wage.
      She said the soup was hot and one chair waited empty.
      Sometimes going home is the only honest strength.

      [Final Chorus]
      Wet rope and cold hands and a yard that does not stop.
      Tie the working hand to mine and let the yard bell ring.
      A life is more than anything the pay clerk calls complete.

      [Outro - cold stop]
