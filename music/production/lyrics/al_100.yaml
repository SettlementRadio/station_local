  - id: s_0825
    title: Two Kinds of Cold
    track_number: 6
    mood: [blue, slow, still]
    fact: >-
      Ilva Reske's low harmony was sung again after the others had gone home and laid over the take,
      which is the only overdub on any Shore Rounds record.
    arrangement_note: one low female harmony sits under the round and is plainly not in the room with it — closer, drier and a shade in front — because it was sung hours later against a take that was already finished
    intro: 15
    outro: fade
    target_duration: "4:05"
    prompt: >-
      66 BPM cold round; clear female lead, dry low female double, reed organ, bass, hand drum, fade.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, vocal tuning, whispered or rapped sections, matched vocal placement, cold ending
    lyrics: |
      [Intro - reed organ, fifteen seconds]

      [Verse 1]
      There is the cold that comes off the water in the evening
      and the cold that starts when two cups sit untouched.
      The first one salts the berth rail, lifts the skin,
      works through any coat not closed up to the throat.
      The second keeps the room warm and the chairs divided.
      I have carried both kinds through this storm season.
      Only one grows worse when someone lights the lamp.

      [Chorus]
      Two kinds of cold (two kinds of cold),
      and only one of them is the weather.
      Put the lamp on. Draw the other chair close.
      Sit with me until one kind begins to break.

      [Verse 2]
      You came home after midnight from the western hold,
      lake ice in your hair, my message still unanswered.
      I had built a careful speech from every quiet hour.
      Then your hands shook once above the ration heater.
      Anger lost its order; pride forgot the opening line.
      I moved the second chair without forgiving anything.
      Sometimes mercy is a coat laid over both shoulders.

      [Chorus]
      Two kinds of cold (two kinds of cold),
      and only one of them is the weather.
      Put the lamp on. Draw the other chair close.
      Sit with me until one kind begins to break.

      [Verse 3]
      Morning finds the outer lake gone white and harmless,
      though we know what waits beneath the level light.
      Your cup is empty. Mine has cooled between my hands.
      Nothing has been solved enough to call it over.
      Still the room no longer holds two separate weathers.
      At the airlock, you turn back and touch my sleeve.
      One kind follows you to work; one stays behind.

      [Bridge]
      One coat for the first kind.
      One honest word for the second.

      [Final Chorus]
      Two kinds of cold (two kinds of cold),
      and only one of them is the weather.
      Leave the lamp on. Leave the other chair close.
      Come back before the second kind returns.

      [Outro - fade]
