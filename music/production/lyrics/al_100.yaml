songs:
  - id: s_0820
    title: Nobody Sings It Alone
    track_number: 1
    mood: [warm, rolling, communal]
    fact: >-
      The four enter a line apart and the last voice in is Kell Moray's, the place he asked for when
      he joined and has kept on every record since.
    arrangement_note: the four voices enter a bar apart in a fixed order and the male bass voice is last and underneath, which is the band's whole architecture stated on the first track of the record
    intro: 9
    outro: fade
    target_duration: "3:50"
    prompt: >-
      88 BPM warm round; clear female lead, three staggered voices, bass last, reed organ, guitar, fade.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, vocal tuning, whispered or rapped sections, unison singing, cold ending
    lyrics: |
      [Intro - reed organ, nine seconds]

      [First line - lead alone]
      Nobody sings it alone. Not here. Not through this weather.

      [Verse 1]
      I came off the lake with both hands shaking,
      one lamp gone and half the deck ice-white.
      Pride got me across the yard and through the berth gate.
      Pride could not lift the wet coat from my back.
      One voice found me by the locker, then another,
      one low enough to settle underneath my breath.
      By the time the storm bell stopped, my hands were still.

      [Round - four voices, a bar apart]
      Nobody sings it alone on this water.
      Bring the line you have; another line will meet it.
      Come in late, come in low, come in tired from the hold.
      There is room inside the turning if we make it.

      [Verse 2]
      You brought a debt folded small inside your ration card,
      three missed wages and a room about to close.
      No speech can warm a number written by the office.
      No brave face makes a landlord lose the sum.
      So we stayed beside you while the lamp burned lower,
      passed the hard page round without advice,
      and left four hand marks where one name had been.

      [Round - four voices, a bar apart]
      Nobody sings it alone on this water.
      Bring the line you have; another line will meet it.
      Come in late, come in low, come in tired from the hold.
      There is room inside the turning if we make it.

      [Verse 3]
      The freight crews use the line when engines fail.
      Children use it crossing flooded lower walkways.
      Someone starts it softly at a storm-season vigil;
      no one turns to see whose mouth was first.
      It belongs to every throat that cannot finish,
      every worker called away before the final word,
      every empty place another person sings around.

      [Final Round - four voices, the last entry held]
      Nobody sings it alone on this water.
      Bring the line you have; another line will meet it.
      Come in late, come in low, come in tired from the hold.
      There is room. There was room before us. Keep it open.

      [Outro - fade]
