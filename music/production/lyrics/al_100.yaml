  - id: s_0821
    title: Count the Boats Back
    track_number: 2
    mood: [steady, patient, cold]
    fact: >-
      The counting verse is the yard's return list and Effa Lomm sings the boats in the order they
      actually came in that evening.
    arrangement_note: the list is sung flat and even by one voice with the other three out of it entirely, because it is a working list being read and the yard does not sing it in parts
    intro: 12
    outro: sustain
    target_duration: "4:00"
    prompt: >-
      76 BPM patient round; clear female lead, flat solo boat list, reed organ, hand drum, held end.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, vocal tuning, whispered or rapped sections, harmony on the list section, cold ending, fade-out
    lyrics: |
      [Intro - reed organ and hand percussion, twelve seconds]

      [Verse 1]
      At dusk she takes the weather slate out to the jetty,
      nine departure marks still bright beneath her thumb.
      Families keep to work because work gives the hands somewhere:
      rope into a coil, lamp glass wiped, berth hooks laid in rows.
      No one asks the water what it means by getting darker.
      No one says the number that the yard already knows.
      She faces every lamp and lets the list begin.

      [The list - lead alone, flat and even]
      Nine out. North skiff. Lamp tender. Ferry boat.
      Ice tow. Cold-store launch. Long reach. Yard three. Net repair. West sounder.
      Eight in. Eight in by dark. The ninth in at nine.

      [Verse 2]
      The office counts by berth and scheduled landing.
      Waiting counts the coat left hanging by the stove,
      the supper skinning over, one child refusing sleep,
      a work glove on the table with its other half away.
      The storm-season feed says visibility is rising.
      The lake gives back no answer anyone can use.
      Eight lamps touch the breakwater. One line stays dark.

      [The list - lead alone, flat and even]
      Nine out. North skiff. Lamp tender. Ferry boat.
      Ice tow. Cold-store launch. Long reach. Yard three. Net repair. West sounder.
      Eight in. Eight in by dark. The ninth in at nine.

      [Verse 3]
      Nine o'clock arrives before the missing engine.
      Then a low horn moves behind the outer ice.
      One lamp dead, one hauling line gone overboard,
      the ninth boat limps between the markers under hand power.
      She rubs one departure mark away and does not cheer.
      The whole yard breathes, then bends back to the wet rope.
      Relief is work returning to its ordinary weight.

      [The list - lead alone, flat and even]
      Nine out. North skiff. Lamp tender. Ferry boat.
      Ice tow. Cold-store launch. Long reach. Yard three. Net repair. West sounder.
      Eight in. Eight in by dark. The ninth in at nine.

      [Outro - sustain]
