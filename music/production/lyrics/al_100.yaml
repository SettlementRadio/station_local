  - id: s_0824
    title: The Far Shore Boat
    track_number: 5
    mood: [slow, longing, sparse]
    fact: >-
      Effa Lomm sings it with nothing behind her, the only unaccompanied track the band has recorded,
      and she asked the others to leave the hall for it.
    arrangement_note: one voice in an empty hall with no instrument and no other singer anywhere on the track, which happens nowhere else in this band's life and is why the next song sounds warm
    intro: 6
    outro: sustain
    target_duration: "4:10"
    prompt: >-
      62 BPM bare ballad; one clear female mezzo alone in a large hall, no instruments, held end.
    exclude: all instruments, backing vocals, harmony vocals, drum kit, electric instruments, synthesizers, brass, orchestral strings, close modern vocal production, vocal tuning, whispered or rapped sections, cold ending, fade-out
    lyrics: |
      [Intro - empty hall, six seconds]

      [Verse 1]
      Across the lake, one lamp wakes before the evening,
      fixed above a boat pulled high beyond the reeds.
      Seven days it has not shifted toward the water.
      Seven nights the far-shore weather hides the lower hull.
      You left from that berth last storm season without warning,
      said the crossing took an hour in ordinary wind.
      Ordinary wind has not come back since then.

      [Refrain]
      One boat on the far shore, one lamp in the dark.
      No ferry crossing after dusk, no signal on the relay.
      I can wait until the water gives the distance back.

      [Verse 2]
      At the yard they say the boat belongs to no one,
      only an old survey hull with grass around the keel.
      Yet each night the lamp comes on at our old supper hour.
      Each night a moving shadow crosses once behind it.
      I keep two cups warming on the canteen plate,
      one for foolish hope and one for anyone who asks.
      Neither one has cooled enough to throw away.

      [Refrain]
      One boat on the far shore, one lamp in the dark.
      No ferry crossing after dusk, no signal on the relay.
      I can wait until the water gives the distance back.

      [Verse 3]
      Spring will open water between both landing marks.
      I could take the first work ferry, climb the farther bank,
      touch that weathered hull and settle what the lamp means.
      But wanting sometimes lives because the shore stays distant.
      Truth may be a cold boat no one ever boarded.
      Let the reeds hold fast. Let the one light answer mine.
      Tonight the lake is wide enough to keep us kind.

      [Refrain]
      One boat on the far shore, one lamp in the dark.
      No ferry crossing after dusk, no signal on the relay.
      I can wait until the water gives the distance back.

      [Outro - sustain, empty hall]
