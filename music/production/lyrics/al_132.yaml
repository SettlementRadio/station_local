  - id: s_1081
    title: Four Won't Fill It
    track_number: 1
    mood: [driving, defiant, fast]
    fact: >-
      The title is what Juno Kerrick said to the rest of the band the first night he put the
      resonance pipes through an amplifier.
    arrangement_note: the amplified pipes arrive on the first downbeat at full size and never come back down, and the sixteen-second break is the loudest thing anybody in this band had put on a record
    intro: 12
    outro: cold
    target_duration: "4:10"
    prompt: >-
      Riff-led hall rock at the hard-rock edge, 140 BPM, driving and defiant, fast. Male lead vocal,
      big hall baritone with a hard edge at the top of the range, pushing into the chorus rather
      than belting it, sung slightly ahead of the band, no vibrato. One low male harmony voice from
      the bass chair, under the lead on choruses only, never above him and never a stack. Amplified
      resonance pipes — long alloy tubes, deep organ tone, arriving at full size on the first
      downbeat and staying there — rhythm electric guitar, electric bass, drum kit with struck
      alloy. Tracked live in a large ringing hall, the amplified alloy organ tone carrying the
      bottom under the guitar, drums roomy, guitar mid-range and unpolished. A sixteen-second
