  - id: s_1084
    title: New Hands on the Low End
    track_number: 4
    mood: [warm, singalong, midtempo]
    fact: >-
      Ade Prosk learned the band's whole set in nine days and plays this one in the key Saul Ravik
      had written it in.
    arrangement_note: the new bass chair sings its harmony line for the first time here, low under the lead through both choruses, and the song stays in the key the last bass player wrote it in rather than the one that suits the new one
    intro: 9
    outro: fade
    target_duration: "4:05"
    prompt: >-
      Riff-led hall rock at the hard-rock edge, 122 BPM, warm and midtempo, built to be sung back.
      Male lead vocal, big hall baritone with a hard edge at the top of the range, pushing into the
      chorus rather than belting it, sung slightly ahead of the band, no vibrato. One low male
      harmony voice from the bass chair, under the lead through both choruses, never above him and
      never a stack. Amplified resonance pipes — long alloy tubes, deep organ tone — rhythm electric
      guitar, electric bass, drum kit with struck alloy. Tracked live in a large ringing hall, the
      amplified alloy organ tone under the guitar, drums roomy, guitar mid-range and unpolished.
      Nine seconds of bass and pipes before the first sung word. Fade on the repeated chorus.
    exclude: acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production, stacked studio harmony
    lyrics: |
      [Intro - 9 seconds, bass and pipes, no vocal]

      [Verse 1]
      Nine days to learn a set that took us eighteen years to build,
      and he did it in a room above a transfer hall with the door shut,
      and he came in on the tenth morning and played the whole thing through
      and got one thing wrong and it was a thing we get wrong too.
      Nine days is what a hauler takes to run the long lane out
      and he learned twenty years of us in the same nine days.

      [Chorus]
      New hands on the low end (new hands, same songs)
      and the songs do not mind, which is the hard part.
      Twenty years of somebody and the songs do not mind.
      They will sound like this now and they will sound fine.

      [Verse 2]
      He asked if we wanted to move this one up a tone for him.
      I said no before I had thought about why I was saying it.
      He did not argue. He learned it where it was and it is high for him
      and you can hear it costing him in the second chorus.

      [Chorus]
      New hands on the low end (new hands, same songs)
      and the songs do not mind, which is the hard part.
      Twenty years of somebody and the songs do not mind.
      They will sound like this now and they will sound fine.

      [Verse 3]
      His voice sits under mine the way the other one never did,
      lower and further back and it took me a month to like it,
      and now I cannot hear the old shape of the chorus at all
      and I do not know when exactly that stopped being a loss.

      [Bridge]
      He put his name on nothing for the first two years.
      Nine days, one key, one chair, and no complaint about any of it.

      [Final Chorus]
      New hands on the low end and the same eleven songs,
      and the songs do not mind, which is the hard part.
      Welcome to the hall. It is cold and it is ours.
      Do not let anybody move that one up a tone.

      [Outro - fade on the repeated chorus]
