  - id: s_1085
    title: Same Riff, More of It
    track_number: 5
    mood: [heavy, loud, fast]
    fact: >-
      Tor Dolo refused to play any harder to keep up with the amplified pipes, and the rest of the
      band came down to him instead.
    arrangement_note: one riff for the whole song with nothing added but volume, the drums played at exactly the weight they would be on any other track, and everything else pulled back to sit with them
    intro: 6
    outro: cold
    target_duration: "4:15"
    prompt: >-
      Riff-led hall rock at the hard-rock edge, 138 BPM, heavy and loud, fast. Male lead vocal, big
      hall baritone with a hard edge at the top of the range, pushing into the chorus rather than
      belting it, sung slightly ahead of the band, no vibrato. One low male harmony voice from the
      bass chair, under the lead on choruses only, never above him and never a stack. Amplified
      resonance pipes — long alloy tubes, deep organ tone — rhythm electric guitar, electric bass,
      drum kit with struck alloy played at ordinary weight and never pushed, with the rest of the
      band pulled back to sit with it. One riff for the whole song with nothing added but volume.
      Tracked live in a large ringing hall, drums roomy, guitar mid-range and unpolished. An
      eighteen-second amplified pipe break on the same riff. Six seconds of the riff alone before
      the first sung word. Cold stop.
    exclude: acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production, stacked studio harmony, double kick drumming
    lyrics: |
      [Intro - 6 seconds, the riff alone, no vocal]

      [Verse 1]
      There is one figure in this song and you have heard it by now.
      It does not develop. It does not go anywhere clever.
      It is four bars long and we play it forty-one times
      and the only thing that changes is how much of it there is.
      Same as a hold. Same as a lane. Same as a shift.
      Nobody down there gets a second figure either.

      [Chorus]
      Same riff. And more of it. That is the whole idea.
      You do not need a new one, you need it played properly.
      Everybody wants a second figure by the second chorus.
      Sit down. It is coming round again.

      [Verse 2]
      When the pipes got loud everybody looked at the drummer
      and the drummer looked back and carried on at his own weight,
      and said if the song needs hitting harder then the song is wrong,
      and did not say another word about it for the rest of the week.
      He has hit a drum at one weight since the year we started
      and every argument this band has had has ended at that weight.

      [Chorus]
      Same riff. And more of it. That is the whole idea.
      You do not need a new one, you need it played properly.
      Everybody wants a second figure by the second chorus.
      Sit down. It is coming round again.

      [Instrumental - amplified pipe break on the same riff, 18 seconds]

      [Verse 3]
      So the rest of us came down to him instead of up to it,
      which took a day and an argument and a walk round the yard,
      and the record is quieter than the night that started it
      and heavier than anything either of those men has played since.

      [Final Chorus]
      Same riff. And more of it. That is the whole idea.
      Four bars, a hall, an alloy tube and a man who will not rush.
      Nothing on this record cost anybody a new idea.
      Forty-one times, and the last one is the best one,
      and if you disagree you have not been listening properly.

      [Outro - cold stop, all together]
