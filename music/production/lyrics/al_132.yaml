    exclude: backing vocals of any kind, amplified or distorted organ tone, acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 4 seconds, bass and kick, no vocal]

      [Verse 1]
      Do not do it in a letter and do not do it at the gate.
      Do not do it in front of a label or a hall keeper
      or a hauler pilot who is going to repeat half of it wrong
      to somebody at the far end of a lane who will repeat it worse.

      [Chorus]
      Argue it out in the hall with the doors shut.
      Say the whole thing, say the ugly part, say it to my face.
      I would rather lose a friend on a Tuesday afternoon
      than keep one by never finishing a sentence.

      [Verse 2]
      He has been in the chair since the year we started
      and he has been right about more of it than I have.
      He says a thing that gets louder stops being the thing.
      I say a hall that empties stops being a hall,
      and a settlement with no hall in it is a siding with beds.

      [Chorus]
      Argue it out in the hall with the doors shut.
      Say the whole thing, say the ugly part, say it to my face.
      I would rather lose a friend on a Tuesday afternoon
      than keep one by never finishing a sentence.

      [Verse 3]
      Four days after this take he put the bass in its case
      and carried it out through the yard and did not slam anything,
      and I did not go after him because I knew what I would say,
      and what I would have said would have been about the volume.

      [Bridge]
      There is a version of this where I go out into the cold after him.
      I have played that one in my head more than I have played this song.

      [Final Chorus]
      Argue it out in the hall with the doors shut,
      and then open the doors, and then both of you walk out of them.
      That is the part nobody tells you about arguing properly.
      Somebody still has to be the one who leaves.

      [Outro - cold stop on the bass]
