  - id: s_1083
    title: Whoever Stays Plays
    track_number: 3
    mood: [wry, rowdy, midtempo]
    fact: >-
      Havel Ost wrote it in one sitting the week the band was down to three players, and Juno
      Kerrick plays the bass part on it.
    arrangement_note: three players and no bassist, so the pipe player covers the bass line as well and the low end drops out entirely every time the pipes have to move
    intro: 7
    outro: fade
    target_duration: "4:00"
    prompt: >-
      Riff-led hall rock at the hard-rock edge, 124 BPM, wry and rowdy, midtempo. Male lead vocal,
      big hall baritone with a hard edge at the top of the range, pushing into the chorus rather
      than belting it, sung slightly ahead of the band, no vibrato, and no other voice anywhere.
      Three players only: acoustic resonance pipes — long alloy tubes, deep organ tone — covering
      the bass line as well as their own part, so the bottom of the arrangement disappears every
      time they move; rhythm electric guitar; drum kit with struck alloy. Tracked live in a large
      ringing hall, drums roomy, guitar mid-range and unpolished, obvious holes left in the low end
      rather than filled. Seven seconds of guitar and struck alloy before the first sung word. Fade.
    exclude: backing vocals of any kind, electric bass, amplified or distorted organ tone, acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 7 seconds, guitar and struck alloy, no vocal]

      [Verse 1]
      Three of us in a hall booked for four and paid for in advance,
      one chair with nothing on it and nobody sitting in it,
      and a set list with eleven songs on it that need a low end,
      and a man on the pipes who says he will have a go.

      [Pre-Chorus]
      Nobody is coming. The doors open at eight.

      [Chorus]
      Whoever is still standing plays it.
      That is the arrangement and it has always been the arrangement.
      Not the best player, not the one who wrote it,
      whoever is in the room when the doors come open.

      [Verse 2]
      He got about two thirds of it and dropped the rest on purpose,
      so the bottom falls out of every chorus and comes back late,
      and the hall does something to that hole that I cannot describe,
      and we have never once tried to fix it since.

      [Pre-Chorus]
      Nobody noticed. Eight hundred people and nobody noticed.

      [Chorus]
      Whoever is still standing plays it.
      That is the arrangement and it has always been the arrangement.
      Not the best player, not the one who wrote it,
      whoever is in the room when the doors come open.

      [Verse 3]
      I wrote the whole of this in an afternoon in a cold hall
      and it is the least worked-on thing on the record
      and the only one I have never wanted to change a word of,
      which is a lesson I have refused to learn from twice already.

      [Bridge]
      A freight crew short of two still takes the cargo out.
      Nobody down there gets to wait for a full line-up.

      [Final Chorus]
      Whoever is still standing plays it.
      Three of us, a borrowed low end and a hole in every chorus,
      and eight hundred people who did not ask for their money back.
      Somebody is always missing. The hall does not care.

      [Outro - fade on guitar and alloy]
