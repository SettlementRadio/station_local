    exclude: acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production, stacked studio harmony
    lyrics: |
      [Intro - 22 seconds, the two pipes finding each other, no vocal]

      [Verse 1]
      Put the new one through the amplifier and the old one beside it
      and play the same line on both of them half a bar apart,
      and one of them is a band and the other one is a building
      and I could not tell you which of them I trust more.

      [Verse 2]
      She has played these tubes in this hall since before the reorganisation
      and she would not have one of them wired for any money,
      not for a burn day, not for a whole season's rate,
      and she stood next to the loudest thing in the settlement
      and played quieter than it and won every exchange.

      [Chorus]
      The hall answers. It has always answered.
      You can put a speaker in front of it if you like.
      It will wait for you to stop and then it will say the line back
      the way the room has always said it, and slower.

      [Instrumental - both pipes alone, band out, 20 seconds]

      [Verse 3]
      Juno stood there afterwards with his hand flat on the cabinet
      and did not say anything for about the length of a song,
      and then said, quietly, that he had been wrong about one thing
      and did not say which thing and has never said since.

      [Chorus]
      The hall answers. It has always answered.
      You can put a speaker in front of it if you like.
      It will wait for you to stop and then it will say the line back
      the way the room has always said it, and slower.

      [Bridge]
      Nobody in this settlement built that hall to be argued with.
      They built it to keep the weather out and it does that too.

      [Final Chorus]
      The hall answers. It has always answered.
      Two tubes, one room, one of them plugged in and one not,
      and the only honest bar on this whole record
      is the one where you cannot tell which is which.

      [Outro - held note, left to decay in the hall]
