    exclude: acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production, stacked studio harmony
    lyrics: |
      [Intro - 12 seconds, amplified pipes and struck alloy, no vocal]

      [Verse 1]
      He had it wired by seven and said nothing about it all evening,
      let us set up, let us tune, let us run the first one through,
      and then he leaned on the low tube and took the roof off the hall
      and the three of us stopped playing without deciding to.

      [Chorus]
      Four won't fill it. Four of us won't fill it.
      Not this room, not on a Friday, not any more.
      I have been standing in the same corner for twenty years
      and the corner has stopped being big enough.

      [Verse 2]
      Twenty years of getting a hall this size on four pairs of hands.
      It worked when the halls were half full and it worked when we were young
      and it does not work on a burn day with eight hundred in
      and somebody at the back shouting that they cannot hear us.
      Half the freight crew off the late lane come straight from the siding
      and stand at the back in their coats and deserve to hear it.

      [Chorus]
      Four won't fill it. Four of us won't fill it.
      Not this room, not on a Friday, not any more.
      I have been standing in the same corner for twenty years
      and the corner has stopped being big enough.

      [Instrumental - amplified pipe break, 16 seconds, at full size]

      [Verse 3]
      Saul went outside for the whole of that. Nobody followed him.
      He came back in and picked up the bass and said we would talk in the morning
      and we did talk in the morning and it did not help,
      and the record has both of the things he was right about on it,
      and one of them is on the front of the sleeve in his own words.

      [Final Chorus]
      Four won't fill it. Four of us won't fill it.
      He said it once, at half past seven, to nobody in particular,
      and I have put it on the front of a record without asking him,
      and he was talking about the hall and I am not.

      [Outro - cold stop, amplified pipes last]
