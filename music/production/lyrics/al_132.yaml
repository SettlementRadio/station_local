# bass — and the wiki says half the album was already written when the argument started and the band
# would not go back and redo it. So the pipes are amplified on the five tracks Prosk plays and
# acoustic on the three that Ravik plays or that the band cut as a three-piece, and the card's
# backing line — *one male harmony voice from the bass chair* — is only available on the same five,
# because the wiki gives Ravik no vocal. **Neither is a bend of the card; both are the card arriving
# in the middle of the record it was written for.** The voice line never moves.
#
# The running order is not the calendar. The title track is the newest thing here and opens the
# album, and the last song Ravik played on is track 2, which is the sleeve's own joke and the reason
# Forge players still argue about which half is better.
#
# Lane-rock takes a break in roughly one song in three (§7). The break belongs to the pipes, and the
# three that take one are the three where the amplification is the point.
#
