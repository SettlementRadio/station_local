    fact: >-
      Ivena Sorn plays the low pipe unamplified beside Juno Kerrick's amplified one, and it is the
      only place on the record the two can be heard against each other.
    arrangement_note: two pipes, one amplified and one not, playing the same line a half-bar apart so the acoustic one reads as the room replying to the amplified one, and the twenty-second break is both of them alone
    intro: 22
    outro: sustain
    target_duration: "5:20"
    prompt: >-
      Riff-led hall rock at the hard-rock edge, 104 BPM, expansive and solemn, slow. Male lead
      vocal, big hall baritone with a hard edge at the top of the range, pushing into the chorus
      rather than belting it, sung slightly ahead of the band, no vibrato. One low male harmony
      voice from the bass chair, under the lead on choruses only, never above him and never a stack.
      Two resonance-pipe parts — long alloy tubes, deep organ tone — one amplified and one acoustic,
      playing the same line half a bar apart so the acoustic one reads as the room answering;
      rhythm electric guitar, electric bass, drum kit with struck alloy. Tracked live in a large
      ringing hall, drums roomy, guitar mid-range and unpolished. A twenty-second break with both
