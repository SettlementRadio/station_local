  - id: s_0685
    title: Sign for the Load
    track_number: 6
    mood: [brisk, plain, satisfied]
    fact: >-
      The band recorded it while the hold was being signed off and the manifest is being read aloud
      underneath the first verse.
    arrangement_note: a second voice reads a cargo manifest aloud underneath the first verse, flat and uninterested and not in time with anything, because the hold was being signed off while the take was running and nobody stopped either
    intro: 4
    outro: sustain
    target_duration: "3:45"
    prompt: >-
      148 BPM brisk skiffle reel; low dry male bass-baritone, manifest under verse one, held ending.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, rapped or rhythmic spoken delivery, cold ending
    lyrics: |
      [Intro - band, four seconds]

      [Verse 1 - a manifest being read aloud underneath]
      The clerk begins at item one before the hatch is open,
      flat as rain and twice as steady, pencil tucked behind one ear.
      Couplings, grain, machine parts, sealant, thirty coils of rope.
      Four hundred and eleven lines, and he intends to read them all.
      Reddin finds the pace against a crate marked forty-seven.
      Col slips round the numbers; Ilsa checks them as they pass.
      I wait until the clerk says load, then give the word a tune.

      [Chorus]
      Sign at the top, sign at the bottom, sign for the load.
      Somebody has to be the person whose name is on it.
      That is the whole of the freight business in one line.
      Everything else is weather, missing numbers, rope and time.

      [Verse 2]
      Ilsa signs. Ilsa has always signed. Nobody voted.
      She follows every item with one finger down the page.
      Col says yes to anything; Reddin says it will be fine.
      I lose my place whenever someone opens up the gate.
      At the near-port berth, they check our manifest twice
      because one crew signed a winter hold that no one ever loaded.
      Ilsa found the empty line before the port could find the fine.

      [Verse 3]
      The best part is the twenty minutes after signing.
      Cargo becomes somebody else's trouble in blue ink.
      Nine days of listening for every strap and shifting corner,
      then the port owns every coupling, grain sack, coil and crate.
      Reddin takes the kit apart and puts the chain back on the hatch.
      Col has found the hall lamps burning one long mile away.
      Ilsa blots her name, folds up the copy, and we go.

      [Chorus]
      Sign at the top, sign at the bottom, sign for the load.
      Somebody has to be the person whose name is on it.
      That is the whole of the freight business in one line.
      Everything else is weather, missing numbers, rope and time.

      [Final Chorus - harmony from the bass chair]
      Sign at the top, sign at the bottom, and go.
      Shut the hold, return the pencil, leave the gate behind.
      Somebody has to be the person whose name was on it.
      Ilsa has the signed-off copy buttoned in her coat.
      Thursday in the port hall. Friday, load again.

      [Outro - held chord]
