  - id: s_0682
    title: Nothing Tied Down Properly
    track_number: 3
    mood: [quick, wry, driving]
    fact: >-
      Reddin Vosk plays a kit built out of the hold's own loose fittings and the take was stopped twice
      by the ship moving.
    arrangement_note: the percussion is entirely the hold's own loose fittings rather than anything brought aboard, and the track has two audible interruptions where everything shifts and the band waits and comes back in
    intro: 6
    outro: cold
    target_duration: "3:35"
    prompt: >-
      Skiffle and jump blues at reel tempo, 164 BPM, quick and driving, wry. Male lead vocal, low
      bass-baritone, unhurried and dry, sitting under the fiddle, staying in his own low register and
      never lifted. One female harmony voice on the choruses only. Percussion is entirely loose metal
      fittings, chain, a hatch cover and struck crate — no drum kit of any kind. Composite fiddle,
      fretted composite guitar, big woody upright bass. Recorded inside a loaded cargo hold on two
