    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, drum kit, cymbals, bright or lifted lead vocal, fade-out
    lyrics: |
      [Intro - loose fittings and fiddle, six seconds]

      [Verse 1]
      Reddin has never once bought an instrument in his life.
      He has a chain, a hatch cover, two lengths of stripped wire
      and whatever is loose in whichever hold we are in,
      and he has an argument about it that he is bored of making.
      A kit is a thing you buy and carry and insure.
      This is a thing that is already here and rings.

      [Chorus]
      Nothing in here is tied down and nothing ever is,
      and the load shifts about a hand's width every night.
      That is fine. That is inside tolerance. That is the job.
      It is also the reason this take has two holes in it.

      [Verse 2 - the take stops here]
      There. That is one of them. That is the ship.
      Everything in this hold moved about that far, at once,
      and four people stopped playing at exactly the same moment
      without looking at each other, which you learn in about a year.
      Ilsa put a hand on the bass. Col lifted the bow off.
      Nobody said anything. We waited. We came back in.

      [Chorus]
      Nothing in here is tied down and nothing ever is,
      and the load shifts about a hand's width every night.
      That is fine. That is inside tolerance. That is the job.
      It is also the reason this take has two holes in it.

      [Verse 3]
      The co-operative wanted us to do it again clean.
      We said there is no clean. There is no such run.
      Every crew on the lane has a hold that moves at night
      and every one of them has stopped what they were doing and waited.
      Leave the holes in. The holes are what it is.
      They left the holes in, which is why we stayed with them.

      [Final Chorus - harmony from the bass chair]
      Nothing in here is tied down and nothing ever is,
      and the second one is coming in about four bars.
      That is fine. That is inside tolerance. That is the job.
      There it is. Wait. Right — back in.

      [Outro - cold stop]
