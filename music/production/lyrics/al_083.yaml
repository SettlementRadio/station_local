  - id: s_0681
    title: Dance at Both Ends
    track_number: 2
    mood: [fast, bright, communal]
    fact: >-
      The two halves of the tune are the dances at either end of the band's route, and they are in
      different keys because the two halls tuned differently.
    arrangement_note: the tune changes key exactly halfway through and does not modulate into it — the second half simply starts somewhere else, because that is the pitch the hall at the far end of the route has always been at
    intro: 14
    outro: cold
    target_duration: "4:20"
    prompt: >-
      158 BPM bright reel; low dry male bass-baritone, female chorus, abrupt mid-song key jump, cold stop.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, smooth modulation, bright or lifted lead vocal, fade-out
    lyrics: |
      [Intro - fiddle, fourteen seconds]

      [Verse 1]
      The near-end hall has leaned a little flat for forty years.
      Col lays his ear against the bridge and follows where it sits.
      Nobody repairs what every pair of feet has learned already.
      The caller lifts one finger; all the longshore couples turn.
      An old man by the stove comes in before the fiddle does.
      He stamps the crooked pitch so hard the hanging lamps complain.
      At midnight he says, "Play ours once more before you load."

      [Chorus]
      A dance at either end, and count yourself lucky.
      Most crews get one hall or they get none at all.
      Nine days out, one night, nine days back, one night.
      Two floors under one tune, and room enough for us.

      [Instrumental - fiddle break across the key change, sixteen seconds]

      [Verse 2]
      Then Col lifts the bow, the old pitch ends, and nine days pass.
      Cargo shifts below us; sleep and meals and watch bells turn.
      At the far hall every string sits one full step above us.
      He gives no warning, takes no road between the keys.
      The first high note lands clean and half the room is moving.
      A woman near the port door laughs before she joins the line.
      She says, "You took your time," as if we crossed the floor, not space.

      [Chorus]
      A dance at either end, and count yourself lucky.
      Most crews get one hall or they get none at all.
      Nine days out, one night, nine days back, one night.
      Two floors under one tune, and room enough for us.

      [Verse 3]
      The woman at the far end calls us hers on every Thursday.
      The old man near the stove says we belong to him.
      Neither knows the other's hall, its tuning or its weather.
      Neither plans to spend nine days above a loaded hold.
      Col says both are right and tightens up the travelling case.
      A route is not the line somebody printed on a manifest.
      It is two rooms claiming four tired people in different keys.

      [Final Chorus - harmony from the bass chair]
      A dance at either end, and do not tell either of them
      that the tune they think is theirs is somebody else's too.
      Nine days out, one night, nine days back, one night,
      shut the fiddle case, change key, and open it again.
      Two floors under one tune, and both of them are home.

      [Outro - cold stop]
