  - id: s_0683
    title: She Waits at the Far End
    track_number: 4
    mood: [warm, slow, longing]
    fact: >-
      Ilsa Brack sings the harmony and it is the only vocal on the record not recorded on the same
      microphone as the lead, because there was not room.
    arrangement_note: the harmony voice is on the second microphone rather than sharing the lead's, so she is audibly further away and in a different part of the hold, which is the only separation anywhere on the record
    intro: 12
    outro: fade
    target_duration: "4:15"
    prompt: >-
      120 BPM warm slow reel; low dry male bass-baritone, distant female chorus, boxy cargo hold, fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, blended or close-stacked harmony, cold ending
    lyrics: |
      [Intro - fiddle and guitar, twelve seconds]

      [Verse 1]
      Nine days out, nine back, one night in between
      and the one night holds the answer neither of us sends.
      Her shift board takes no notice of a hauler running late.
      About one time in three, she works the far-end berth
      with another freight crew unloading under yellow lamps.
      I find her at the gate with tally chalk across one sleeve.
      Eleven minutes by the clock, and that becomes the month.

      [Chorus]
      She waits at the far end, or she does not wait,
      I have never asked which one is true.
      There is no version of this where I am there more.
      There is no version of this where she is there less.
      Nine days out, and let the one night answer me.

      [Verse 2]
      When she is there, she smells of cable grease and rain.
      She checks the time behind me while I try not to check hers.
      We trade the names of broken valves and people changing shifts.
      I tell her what the cargo did on day six in the dark.
      She tells me who got married, who got fined, whose berth moved east.
      Then somebody lifts the gate and both our crews begin to call.
      She puts one cold hand on my cheek and walks back to her load.

      [Chorus]
      She waits at the far end, or she does not wait,
      I have never asked which one is true.
      There is no version of this where I am there more.
      There is no version of this where she is there less.
      Nine days out, and let the one night answer me.

      [Verse 3]
      Once I said I might leave the route and find a room nearby.
      She asked which work I meant to do and where I meant to sleep.
      I had no answer past the part where distance disappeared.
      She smiled and read the chalk marks drying on her cuff.
      Nine days out and nine days back is mostly arithmetic.
      One night is not enough; one night is what there is.
      We have kept it seven years by never calling it a promise.

      [Final Chorus - harmony from the far microphone]
      She waits at the far end, or she does not wait,
      and the relay says our Thursday landing may be late.
      There is no version of this where I am there more,
      and she has never once asked me to find one.
      Nine days out. Let the far gate answer me.

      [Outro - fade]
