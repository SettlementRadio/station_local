    A loaded cargo hold on the band's own route, recorded on two microphones borrowed from Harbor
    Standard because the co-operative owned none. The card is unbent: low bass-baritone lead sitting
    under the fiddle and never lifted, one female harmony from the bass chair on choruses only,
    fiddle taking every break, improvised kit built out of crates and struck metal, stripped-wire
