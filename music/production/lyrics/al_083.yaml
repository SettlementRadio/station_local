    lyrics: |
      [Intro - fiddle and crates, eight seconds]

      [Verse 1]
      Col learned the fiddle off recordings played in a hold
      by a man who is dead now and who played it wrong himself,
      and he holds the bow like somebody carrying a hot pan
      and every single review of this band has mentioned it.
      Somebody from the co-operative asked him to play it properly.
      He said this is properly. This is how I was taught.

      [Chorus]
      A short run and a long night, and back before the week is out,
      and the accent lands where the accent lands, and there it is.
      There is nobody out here to tell any of us how it is done.
      That is the good half and the bad half of the whole business.

      [Verse 2]
      What it does is put a limp in the middle of the bar
      and a floor that has never heard it does not know what to do
      and a floor that has heard it once is on it immediately
      because a limp is easier to dance to than a straight line.
      Ask anybody who has ever worked a real load:
      nothing that moves properly moves evenly.

      [Instrumental - fiddle break, unorthodox bowing, fourteen seconds]

      [Verse 3]
      There are people in the core who learn this from a teacher
      in a room, from paper, at an hour agreed in advance,
      and they are better than Col by every measure that exists
      and not one of them has made anybody dance in a port hall.
      He has never had a lesson. He has had about nine hundred nights.
      Those are two different instruments with the same name.

      [Final Chorus - harmony from the bass chair]
      A short run and a long night, and the far hall on Thursday,
      and a bow held wrong by a man who will not be corrected.
      There is nobody out here to tell any of us how it is done,
      and if there were, this crew would not have listened.

      [Outro - fade]
