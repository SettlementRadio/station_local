  - id: s_0684
    title: Short Run, Long Night
    track_number: 5
    mood: [fast, tired, defiant]
    fact: >-
      Col Sennet plays the whole tune with the unusual bowing hand he learned from recordings, and the
      co-operative asked him to play it conventionally and he declined.
    arrangement_note: the fiddle is bowed with an unorthodox hand all the way through, which puts the accent in the wrong half of the bar and gives the tune a limp that everybody who reviews this band mentions, and it takes the break exactly as it is
    intro: 8
    outro: fade
    target_duration: "3:50"
    prompt: >-
      162 BPM tired fast reel; low dry male bass-baritone, crooked-accent fiddle break, crate kit, fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, smooth or conservatory fiddle technique, bright or lifted lead vocal, cold ending
    lyrics: |
      [Intro - fiddle and crates, eight seconds]

      [Verse 1]
      Col learned from old recordings played above a loaded hold,
      watching one dead player's hand go crooked in the frame.
      He copied every angle with a mop handle and some twine,
      palm turned up as if he carried supper from the stove.
      No teacher came to straighten him; no teacher knew the route.
      By sixteen he could hold a near-port floor until the lamps went out.
      The bow still lands a little late and pulls the bar behind it.

      [Chorus]
      Short run and a long night, freight dust on the floor.
      Let the accent fall behind; the working feet will find it.
      Straight lines look fine printed on a manifest at noon.
      Nothing carries cargo through the dark by moving straight.

      [Verse 2]
      A co-operative man came down the ramp before a Thursday dance,
      heard the first eight bars and raised one careful hand.
      "Could you bow it conventionally, just once, before we start?"
      Col looked past him to the couples stacking coats beside the wall.
      "This is convention where I work," he said, and checked the tuning.
      Ilsa hid a laugh behind the shoulder of the bass.
      Reddin struck the crate and all the port hall took the floor.

      [Instrumental - fiddle break, unorthodox bowing, fourteen seconds]

      [Chorus]
      Short run and a long night, freight dust on the floor.
      Let the accent fall behind; the working feet will find it.
      Straight lines look fine printed on a manifest at noon.
      Nothing carries cargo through the dark by moving straight.

      [Verse 3]
      The first pair miss the crooked beat and laugh against each other.
      The second pair catch hold; the third are waiting when it comes.
      Soon the whole floor leans together where the bow hand drags.
      Boots that spent nine days correcting every shift beneath a load
      know a useful kind of wrong the moment that they feel it.
      The co-operative man stays planted by the coats for half the night.
      Near closing, Col looks over. Even he is stepping late.

      [Final Chorus - harmony from the bass chair]
      Short run and a long night, far berth on Thursday.
      Let the accent fall behind; the whole floor comes to meet it.
      Straight lines look fine printed on a manifest at noon.
      Col shuts the travelling case. Nobody asks him twice.
      Load at first light. Keep the crooked hand exactly where it is.

      [Outro - fade]
