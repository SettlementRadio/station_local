    lyrics: |
      [Intro - band, four seconds]

      [Verse 1 - a manifest being read aloud underneath]
      That is the load going off and that is a man reading it
      and he started before we did and he is not going to stop
      and there is no point asking him, because he has a form
      and the form is why anybody on this run gets paid at all.
      Four hundred and eleven items and he says every one.
      We put a tune under it because there was nothing else to do.

      [Chorus]
      Sign at the top, sign at the bottom, sign for the load.
      Somebody has to be the person whose name is on it.
      That is the whole of the freight business in one line.
      Everything else is weather and argument and rope.

      [Verse 2]
      Ilsa signs. Ilsa has always signed. Nobody voted.
      She is the one of the four of us who reads a list properly
      and does not go down it going yes, yes, yes, fine,
      which is what the rest of us do and what gets crews fined.
      There is a berth in the near port where they check twice
      because of a crew who signed for a hold nobody had loaded.

      [Verse 3]
      The good part is the twenty minutes after the signing.
      The load is somebody else's problem, formally, in writing.
      Whatever is in it is now the port's and not ours
      and there is a hall about a mile away and it is Thursday.
      Nine days of that hold and we are done with it,
      and Reddin is already taking the kit apart.

      [Chorus]
      Sign at the top, sign at the bottom, sign for the load.
      Somebody has to be the person whose name is on it.
      That is the whole of the freight business in one line.
      Everything else is weather and argument and rope.

      [Final Chorus - harmony from the bass chair]
      Sign at the top, sign at the bottom, and go.
      Six tunes, one hold, two microphones and a run.
      That is the whole of the freight business in one line,
      and the whole of this record, and it is finished.

      [Outro - held chord]
