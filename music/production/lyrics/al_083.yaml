#
# Six tracks because six is what the route allowed. Cut in a loaded hold with the cargo still in it,
# on two microphones borrowed from Harbor Standard — **the same two microphones that made al_078 in
# the same year**, which is why the two records sound like the same people made them, and they did.
# The band would not stop working to make it, so the room is a working hold: close, boxy, dead, the
# crates ringing behind an improvised kit, and the ship moving twice during one take.
#
# b_039's card is the whole arrangement here and it is unusual in two ways worth stating. The lead
# sits **under** the fiddle rather than over it and is never lifted into a brighter key — the
# co-operative asked twice and was refused twice, and no prompt in this genre asks for a higher key
# on this band. And the harmony is one female voice from the bass chair, choruses only; **she takes
# the lead outright exactly once in the band's life**, which is not on this record but on al_085.
#
# Two of the six take a fiddle break. `generation:` and every `take:` are empty until M-33.

