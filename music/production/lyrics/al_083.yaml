    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, room reverb, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, proper drum kit, cold ending
    lyrics: |
      [Intro - fiddle and crates, ten seconds]

      [Verse 1]
      There is a hall at one end of this run and a hall at the other
      and about nine days of nothing in between the two,
      and this band exists because somebody had to fill the nine days
      and there is not a great deal else to do in a loaded hold.
      Reddin started hitting the cargo about four years ago.
      Col had a fiddle. I had a guitar and no sense.

      [Chorus]
      Between two ports and neither of them ours,
      and a manifest signed at one end to be signed again at the other.
      Everything we own is in a crate with a number on it.
      Everything we are is somewhere on that list.

      [Verse 2]
      The co-operative wanted a record and had no room to make one
      and no equipment and no money and no obvious idea,
      so they borrowed two microphones off a label on the coast
      and sent them out on the run with a note saying be careful.
      We put one on the fiddle and one in front of me
      and Reddin played the load, and that is the record.

      [Verse 3]
      You can hear which crate. That is the strange part.
      The high one near the door is somebody's machine parts.
      The dead one is grain and the ringing one is empty
      and by the third day we knew the whole hold by its note.
      A different load makes a different record entirely.
      Nobody is ever going to be able to make this one again.

      [Chorus]
      Between two ports and neither of them ours,
      and a manifest signed at one end to be signed again at the other.
      Everything we own is in a crate with a number on it.
      Everything we are is somewhere on that list.

      [Final Chorus - harmony from the bass chair]
      Between two ports, and the middle is the job,
      and the middle is where every tune we have got written.
      Everything we own is in a crate with a number on it,
      and we are going to unload it on Thursday and go back.

      [Outro - fade]
