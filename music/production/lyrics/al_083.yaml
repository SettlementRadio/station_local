  - id: s_0682
    title: Nothing Tied Down Properly
    track_number: 3
    mood: [quick, wry, driving]
    fact: >-
      Reddin Vosk plays a kit built out of the hold's own loose fittings and the take was stopped twice
      by the ship moving.
    arrangement_note: the percussion is entirely the hold's own loose fittings rather than anything brought aboard, and the track has two audible interruptions where everything shifts and the band waits and comes back in
    intro: 6
    outro: cold
    target_duration: "3:35"
    prompt: >-
      164 BPM driving skiffle reel; low dry male bass-baritone, loose fittings, two ship-lurch stops.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, drum kit, cymbals, bright or lifted lead vocal, fade-out
    lyrics: |
      [Intro - loose fittings and fiddle, six seconds]

      [Verse 1]
      Reddin kneels beside the hatch and empties both his pockets:
      two lengths of stripped wire, one bent pin, a coupling ring.
      He hangs the chain where every little link can answer,
      tries the cover with his palm, then turns a crate around.
      The loaded hold has given him a different kit each crossing.
      He owns two sticks, a blanket and the boots that he arrived in.
      Everything he needs is loose already and can ring.

      [Chorus]
      Nothing in here is tied down properly tonight.
      The load can move a hand's width and still pass at the port.
      Brace your heel, hold the note, leave room beside the hatch.
      When the hull says wait, we wait. When it settles, count us in.

      [Break - first ship lurch, fittings slide, band stops]

      [Verse 2]
      The deck drops half an inch and every crate leans east.
      Ilsa catches up the bass before its shoulder hits the wall.
      Col lifts clear; my fretting hand closes hard around the neck.
      Reddin pins the rolling coupling underneath one boot.
      No one calls a warning. All four bodies know the movement.
      We listen while the cargo finds another place to rest.
      Then Reddin's quiet count comes softly from the sticks.

      [Chorus]
      Nothing in here is tied down properly tonight.
      The load can move a hand's width and still pass at the port.
      Brace your heel, hold the note, leave room beside the hatch.
      When the hull says wait, we wait. When it settles, count us in.

      [Verse 3]
      Four bars later, something heavy tests the forward strap.
      Chain strikes chain, the hatch complains, the floor goes light.
      Again our hands come off together in the middle of the turn.
      Beyond the bulkhead, watch crew boots go running past.
      Ilsa starts to laugh but keeps one hand upon the bass.
      Reddin waits until the last loose fitting quits its travel,
      taps the cover twice, and brings us back exactly where we left.

      [Break - second ship lurch, low groan, then silence]

      [Final Chorus - harmony from the bass chair]
      Nothing in here is tied down properly tonight.
      Neither are the four of us, and still we know the run.
      Brace your heel, find the note, leave room beside the hatch.
      When the hull says wait, we wait. Now Reddin counts us in.
      Chain, cover, crate and wire all meet upon the one.

      [Outro - cold stop]
