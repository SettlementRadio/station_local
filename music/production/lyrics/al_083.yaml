songs:
  - id: s_0680
    title: Between Two Ports
    track_number: 1
    mood: [rolling, restless, midtempo]
    fact: >-
      Recorded in a loaded hold with the cargo still in it, and Wend Amory has said the crates are the
      reason the record sounds the way it does.
    arrangement_note: the kit is played on the cargo itself rather than beside it, so every accent lands on a different crate and the pitch of the rhythm changes as the tune goes on, which nobody planned and nobody corrected
    intro: 10
    outro: fade
    target_duration: "4:00"
    prompt: >-
      138 BPM rolling skiffle reel; low dry male bass-baritone, female chorus, pitched crate kit, fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, room reverb, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, proper drum kit, cold ending
    lyrics: |
      [Intro - fiddle and crates, ten seconds]

      [Verse 1]
      The near port lets us loose an hour before the lamps go pale.
      Ilsa folds the manifest and buttons it inside her coat.
      Below our boots, machine parts lean against a crate of grain,
      all of it assigned a number and a berth that is not ours.
      Reddin taps the high box with his heel before we cast off.
      Col finds the answer on a string and I come in below.
      The loaded hold begins to knock the time against the hull.

      [Chorus]
      Between two ports and neither of them ours,
      nine days with a cargo list folded in a coat.
      Every crate has got a number, every gate another name.
      We sleep above the load and let the old route pull us on.
      Between two ports, the middle knows us best.

      [Verse 2]
      On day three the empty crate beside the hatch rings sharp.
      The grain box gives us nothing but a dry and wooden thud.
      Machine parts sound like weather trying bolts along a bulkhead.
      By day five we know each item by the note beneath our feet.
      Ilsa sleeps through all of it; Col sleeps with one eye open.
      Reddin moves his blanket when the highest box gets loud.
      I lie awake and count the knocks until the dark shifts over.

      [Verse 3]
      At the far port, hands come down and break the rhythm open.
      Grain goes first, then machine parts, then the hollow box.
      Every lifted number leaves a colder square of deck.
      By noon the hold is bare enough to throw our voices back.
      We do not like the echo. We go up and find the hall.
      Thursday gives us one good night and someone else's floor.
      Friday brings another load, and all the notes have changed.

      [Chorus]
      Between two ports and neither of them ours,
      nine days with a cargo list folded in a coat.
      Every crate has got a number, every gate another name.
      We sleep above the load and let the old route pull us on.
      Between two ports, the middle knows us best.

      [Final Chorus - harmony from the bass chair]
      Between two ports and neither of them ours,
      Thursday at the far hall, next week at the near.
      Every crate has got a number; we are not upon the list.
      Load the grain and machine parts. Let the hull begin again.
      Between two ports, the middle keeps us here.

      [Outro - fade]
