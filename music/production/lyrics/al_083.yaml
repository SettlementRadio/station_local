  - id: s_0681
    title: Dance at Both Ends
    track_number: 2
    mood: [fast, bright, communal]
    fact: >-
      The two halves of the tune are the dances at either end of the band's route, and they are in
      different keys because the two halls tuned differently.
    arrangement_note: the tune changes key exactly halfway through and does not modulate into it — the second half simply starts somewhere else, because that is the pitch the hall at the far end of the route has always been at
    intro: 14
    outro: cold
    target_duration: "4:20"
    prompt: >-
      Skiffle and jump blues at reel tempo, 158 BPM, fast and bright, communal. The track changes key
      abruptly at the exact halfway point with no modulation and no warning — the second half simply
      begins in a different key, about a tone away, and stays there. Male lead vocal, low
      bass-baritone, unhurried and dry, sitting under the fiddle, staying in his own low register and
      never lifted into a brighter key even after the change. One female harmony voice on the choruses
      only. Composite fiddle, fretted composite guitar, big woody upright bass, a kit built out of
      wooden cargo crates and struck metal, stripped-wire chimes. Recorded inside a loaded cargo hold
      on two microphones: close, boxy and dead. Fourteen seconds of fiddle before the first sung word.
      A sixteen-second fiddle break across the key change. Cold stop.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, smooth modulation, bright or lifted lead vocal, fade-out
    lyrics: |
      [Intro - fiddle, fourteen seconds]

      [Verse 1]
      The hall at the near end has been flat since before I was working.
      Not badly. Half a tone, maybe, and it has never been fixed
      because fixing it would mean somebody paying for it
      and everybody has learned to play there the way it is.
      The hall at the far end is where it should be, roughly.
      So the same tune is two tunes depending which week it is.
      Nine days of hold and cargo in between the two.

      [Chorus]
      A dance at either end, and count yourself lucky.
      Most crews get one hall or they get none at all.
      Nine days out, one night, nine days back, one night.
      That is a whole life and it is not a bad one.

      [Instrumental - fiddle break across the key change, sixteen seconds]

      [Verse 2]
      So we put both of them on the record, one after the other,
      and did not join them, because they do not join in life.
      You finish the near end on a Tuesday and you load,
      and nine days later you unload and it is somewhere else.
      Col will not modulate into it. He says that is a lie.
      He says you get there or you do not, and we do not.

      [Chorus]
      A dance at either end, and count yourself lucky.
      Most crews get one hall or they get none at all.
      Nine days out, one night, nine days back, one night.
      That is a whole life and it is not a bad one.

      [Verse 3]
      There is a woman at the far end who thinks we are a far-end band
      and a man at the near end who is certain we are his,
      and neither of them has ever been to the other hall
      and neither of them is going to, and both of them are right.
      A route is not a line between two places on a chart.
      A route is two rooms full of people who do not know each other.

      [Final Chorus - harmony from the bass chair]
      A dance at either end, and do not tell either of them
      that the tune they think is theirs is somebody else's too.
      Nine days out, one night, nine days back, one night,
      and a key change in the middle that nobody has explained.

      [Outro - cold stop]
