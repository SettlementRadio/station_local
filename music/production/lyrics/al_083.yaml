  room: >-
    A loaded cargo hold on the band's own route, recorded on two microphones borrowed from Harbor
    Standard because the co-operative owned none. The card is unbent: low bass-baritone lead sitting
    under the fiddle and never lifted, one female harmony from the bass chair on choruses only,
    fiddle taking every break, improvised kit built out of crates and struck metal, stripped-wire
    chimes, bass big and woody, slapback kept short, and no hall reverberation anywhere because there
    is no hall. Three fact-bound details live in their own songs: the two halves of s_0681 are in
    different keys because the halls at the two ends of the route tuned differently; s_0682's take was
    stopped twice by the ship moving and the kit on it is the hold's own loose fittings; and s_0683's
    harmony is on the second microphone rather than the lead's, because there was not room for two
    people at one. The manifest is being read aloud under s_0685's first verse.

