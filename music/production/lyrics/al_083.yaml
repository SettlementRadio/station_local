    lyrics: |
      [Intro - fiddle and guitar, twelve seconds]

      [Verse 1]
      Nine days out and nine days back and one night in between
      and the one night is the whole of it and everybody knows.
      There is a woman at the far end who has a shift pattern
      that does not care in the slightest what a route does,
      and about one time in three she is working the late berth
      on a freight crew that is not ours, when we land,
      and we get eleven minutes at a gate and that is the month.

      [Chorus]
      She waits at the far end, or she does not wait,
      and I have never once asked her which of those it is.
      There is no version of this where I am there more.
      There is no version of this where she is there less.

      [Verse 2]
      Ilsa is singing this from about nine feet away
      because the two microphones are where the two microphones are
      and there was no room to put two people at one of them
      with the cargo where it is and the fiddle where it has to be.
      So she sounds far off, which nobody planned,
      and which is the best accident on this whole record.

      [Chorus]
      She waits at the far end, or she does not wait,
      and I have never once asked her which of those it is.
      There is no version of this where I am there more.
      There is no version of this where she is there less.

      [Verse 3]
      Every crew has a version of this and they all sound the same
      and they are all completely different and none of them travel.
      You cannot explain it to somebody who lives in one place.
      They think it is romantic and it is mostly arithmetic.
      Nine and nine and one, and one is not enough,
      and one is what there is, and one is a great deal.

      [Final Chorus - harmony from the far microphone]
      She waits at the far end, or she does not wait,
      and there is a hall on Thursday and I will know by then.
      There is no version of this where I am there more,
      and she has never once asked me to find one.

      [Outro - fade]
