  - id: s_0680
    title: Between Two Ports
    track_number: 1
    mood: [rolling, restless, midtempo]
    fact: >-
      Recorded in a loaded hold with the cargo still in it, and Wend Amory has said the crates are the
      reason the record sounds the way it does.
    arrangement_note: the kit is played on the cargo itself rather than beside it, so every accent lands on a different crate and the pitch of the rhythm changes as the tune goes on, which nobody planned and nobody corrected
    intro: 10
    outro: fade
    target_duration: "4:00"
    prompt: >-
      Skiffle and jump blues at reel tempo, 138 BPM, rolling and restless, midtempo. Male lead vocal,
      low bass-baritone, unhurried and dry, sitting UNDER the fiddle rather than over it, staying in
      his own low register throughout and never lifted into a brighter key. One female harmony voice
      on the choruses only and nothing under the verses. Composite fiddle, fretted composite guitar,
      big woody upright bass, and a kit built out of wooden cargo crates and struck metal — each hit
      a different pitch, boxy, ringing, plainly not a drum kit. Recorded inside a loaded cargo hold on
      two microphones: close, boxy and dead, no room reverberation at all, the crates audible behind
