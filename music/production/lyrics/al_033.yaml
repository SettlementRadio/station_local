    exclude: backing vocals of any kind, amplified resonance pipes, electric organ, acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 10 seconds, one held low pipe note and struck alloy, no vocal]

      [Verse 1]
      They put the list up on the Tuesday and I put my name at the bottom.
      Nobody made me. Nobody was going to make anybody.
      Double for the burn day and double again for the night half,
      and the hall is booked for the week after and the hall costs money.

      [Chorus]
      Burn day overtime, burn day overtime,
      everybody else out at the festival and me on the floor.
      I can hear it from the yard. I have got the door propped open.
      Twelve hours of somebody else's good evening.

      [Verse 2]
      At four I walked home with the whole settlement still up,
      the lanes still full and every festival door still open,
      people coming the other way with their coats undone,
      while the last lines found their order somewhere by the water.

      [Chorus]
      Burn day overtime, burn day overtime,
      everybody else out at the festival and me on the floor.
      I can hear it from the yard. I have got the door propped open.
      Twelve hours of somebody else's good evening.

      [Verse 3]
      My father did nine burn days in a row on the same freight circuit
      and never once said it was a sacrifice, because it was not,
      it was a rate, and he took it, and bought the panels
      for the back room where I slept until I left home.
      Nine burn days and a scrubber that he serviced himself
      and a family who remember exactly what the extra hours bought.

      [Bridge]
      There is no medal in it. There is money in it.
      That is a cleaner thing and it says what it is.

      [Final Chorus]
      Burn day overtime, burn day overtime,
      everybody else out at the festival and me on the floor.
      I will be there next year and I will be unbearable about it,
      and the hall will be paid for and the doors will be open.

      [Outro - cold stop on the low pipe]
