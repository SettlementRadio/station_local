    lyrics: |
      [Intro - 20 seconds, the far pipe alone across the hall, no vocal]

      [Verse 1]
      There is an hour in a hall like this before anybody is up
      when the alloy has come down to the temperature of the room
      and everything you play sits exactly where you put it,
      and after about seven it is gone and you cannot get it back.
      The freight crew are not on yet, the scrubber is on its low setting,
      and the hall is the only honest thing in the settlement.

      [Verse 2]
      Ivena stood at the far end and Juno at the near one.
      Two sets of tubes, one cold room, no talking.
      Her first low note crossed the hall and came back thinner;
      his answer met it halfway and the walls held both.

      [Chorus]
      Play them before sunrise or do not play them at all.
      The hall sits still for about an hour and then it shifts.
      Whatever you set in that hour stays where it lands,
      and whatever you miss can wait for another year.

      [Instrumental - Juno's near pipes alone, Ivena and the band out, 20 seconds]

      [Verse 3]
      She has been doing this since before I could lift one,
      marks every tuning she has ever found on her own cuff
      and will not start again once the room has warmed and shifted,
      and she is right, and I have stopped arguing about it.

      [Chorus]
      Play them before sunrise or do not play them at all.
      The hall sits still for about an hour and then it shifts.
      Whatever you set in that hour stays where it lands,
      and whatever you miss can wait for another year.

      [Bridge]
      The freight crew came on at six and we lost the room.
      That is not a complaint. That is what the room is for.

      [Final Chorus]
      Play them before sunrise or do not play them at all.
      The hall sat still for an hour and we were in it.
      What we set there stayed exactly where it landed,
      and the walls gave back the last note as the sun came up.

      [Outro - held pipe note, left to decay in the hall]
