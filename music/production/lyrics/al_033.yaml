      [Verse 1]
      There is a short way into this settlement and a long way,
      and the short one comes off the siding through the yards,
      and the long one goes round the water and adds forty minutes
      and every single person I like takes the long one.
      The short way is for a hauler with a hold full and a slot booked.
      Nobody in this band has been in a hurry since 2592.

      [Chorus]
      Take the long way in. There is nothing waiting.
      Whatever it is, it will still be a thing at seven.
      Take the long way in and come round by the water,
      and get here late and get here in a better state.

      [Verse 2]
      Four nights in this hall and the four of us are finished
      and the last shift has started on the loading floor below.
      The two people behind the machines have not slept either,
      but neither has anybody waiting to lock the outer doors.

      [Chorus]
      Take the long way in. There is nothing waiting.
      Whatever it is, it will still be a thing at seven.
      Take the long way in and come round by the water,
      and get here late and get here in a better state.

      [Instrumental - pipe break alone, 18 seconds]

      [Verse 3]
      Then everybody in the building sang the last one,
      the crew off the loading floor, the man who locks the doors,
      two engineers, a hauler pilot who had come for the noise,
      somebody's daughter who had been asleep on a coat since ten,
      and not one of them in tune and all of them on time.

      [Final Chorus - the whole hall in rough unison]
      Take the long way in. There is nothing waiting.
      Whatever it is, it will still be a thing at seven.
      Take the long way in and come round by the water.
      We will leave the door open. We are not going anywhere.

      [Outro - held chord, the room still singing over it]
