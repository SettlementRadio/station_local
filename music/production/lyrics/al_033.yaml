    lyrics: |
      [Intro - 8 seconds, guitar and drums, no vocal]

      [Verse 1]
      We came in with a line about keeping the circuit open
      and it was fine, it scanned, it did what it was told.
      Then four hundred people on a burn day put their own words in it
      and by the second chorus ours had stopped existing.

      [Pre-Chorus]
      You cannot take it back off a room that size.

      [Chorus]
      Hold the circuit open, hold it open,
      nobody closes a road that somebody still lives on.
      Hold the circuit open, hold the circuit open,
      and we will keep coming down it until the day you do.

      [Verse 2]
      Juno heard it first and stopped playing to listen,
      which he has done twice in his life and both times mattered.
      Tor kept the beat because Tor keeps the beat.
      I sang theirs on the second night and have sung theirs ever since.

      [Pre-Chorus]
      You do not get a vote once the whole room has it.

      [Chorus]
      Hold the circuit open, hold it open,
      nobody closes a road that somebody still lives on.
      Hold the circuit open, hold the circuit open,
      and we will keep coming down it until the day you do.

      [Verse 3]
      There were two settlements that year that lost their stop
      and one of them had a hall in it we had played four times.
      The route is a decision somebody makes in an office,
      and the people on it find out from a notice at the gate.
      One of those halls is boarded and the other one is a store,
      and both of them had four hundred people in them once.

      [Bridge]
      A song you wrote is yours until a room takes it.
      After that you are just the one who has to keep up.

      [Final Chorus]
      Hold the circuit open, hold the circuit open,
      nobody closes a road that somebody still lives on.
      That is not our line and it has never been our line,
      and it is the only line from us that anybody remembers.

      [Outro - fade on the repeated chorus]
