      [Verse 1]
      Two crews in a transfer hall and one road between them
      and both of them have been running it eleven years.
      One says the near lane was theirs before the reorganisation,
      the other says nothing was anybody's before the reorganisation.
      Both of them have a man who remembers it differently
      and both of those men are certain and one of them is wrong.

      [Chorus]
      Whose route is this, whose route is this,
      ask the office and the office will send you to the other office.
      Ask the crews and you will get two answers and a shove,
      and the cargo sits in the hold while you work it out.

      [Verse 2]
      Saul stood between them while both crews asked him to choose.
      He said the near lane carried freight in both directions
      and a man in the middle did not own either end of it.
      Each side heard that as support for the other one,
      which is how refusing them became the third position.

      [Chorus]
      Whose route is this, whose route is this,
      ask the office and the office will send you to the other office.
      Ask the crews and you will get two answers and a shove,
      and the cargo sits in the hold while you work it out.

      [Instrumental - pipe break over both bass phrases, 14 seconds, resolving neither]

      [Verse 3]
      There is a bench outside the second hall where they both drink
      and they have never once had this argument sitting down.
      Standing up, at a gate, with a manifest in one hand,
      it is the end of the world. On the bench it does not come up.
      They ask after each other's people. They split the last ration of tea.
      Then the shift starts and the whole thing begins again.

      [Final Chorus]
      Whose route is this, whose route is this,
      I have got a hall to be in and I do not care.
      Settle it or do not settle it, it will still be there,
      and so will both of you, and so will the road.

      [Outro - cold stop, both bass phrases at once]
