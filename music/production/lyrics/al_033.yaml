      Four nights. One room. Nobody paid to be here.
      We will not get this hall again until the spring.

      [Chorus]
      Ash on the glass and a light coming through it,
      and everybody who is going to be here is already here.
      Somebody put the kettle on before the last one.
      It was a long week. Do not clean the windows.

