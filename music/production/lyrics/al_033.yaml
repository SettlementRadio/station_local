    lyrics: |
      [Intro - 5 seconds, guitar figure alone, no vocal]

      [Verse 1]
      A man came up from the office with a number already in his mouth.
      Not a discussion, not an offer, a number, said once.
      Four hundred, he said, before the festival, and that is the whole of it,
      and if they go we will talk again and if they do not we will not.
      He had his coat on the whole time he was saying it,
      which is how you know a man has already decided.

      [Chorus]
      Four hundred of them in a crate on a siding.
      That is the size of everything we are.
      Not a career, not a plan, not a thing to tell your mother,
      four hundred and a hall and a week to shift them in.

      [Verse 2]
      Juno wanted eight hundred and said so twice and got nowhere.
      Tor said four hundred is four hundred more than none
      and went back to the kit, which is how he ends most arguments.
      I did not say anything because I was doing the sum in my head.

      [Chorus]
      Four hundred of them in a crate on a siding.
      That is the size of everything we are.
      Not a career, not a plan, not a thing to tell your mother,
      four hundred and a hall and a week to shift them in.

      [Verse 3]
      We sold the crate out on the second day of the burn festival
      and stood there afterwards with an empty box and nowhere to put it,
      and the office rang the hall in the morning wanting to talk again,
      and I let it ring twice before I picked it up. Only twice.

      [Final Chorus]
      Four hundred of them in a crate on a siding.
      That was the size of everything we were.
      Ask me again next year what the number is,
      and the number will be bigger and the crate will still be ours.

      [Outro - cold stop]
