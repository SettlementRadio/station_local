    lyrics: |
      [Intro - 10 seconds, full band, no vocal]

      [Verse 1]
      Seventeen years before anybody wrote this one down
      and it is two words that a crew shouts at a berth
      about a turnaround so short you do not put the kettle on,
      and it has been the name over the door since 2607.

      [Chorus]
      Turn and burn. In at six and out again at four.
      Nine ports, eleven days, and a hall in every one.
      Whatever you were going to do with the afternoon,
      you are not going to do it, and you knew that at the gate.

      [Verse 2]
      I did not want to write it and I said so for years,
      because a band with a song about itself has usually finished
      and I have seen four do it and all four were right to,
      and then I wrote it anyway, in a hall, in about an hour.

      [Chorus]
      Turn and burn. In at six and out again at four.
      Nine ports, eleven days, and a hall in every one.
      Whatever you were going to do with the afternoon,
      you are not going to do it, and you knew that at the gate.

      [Verse 3]
      There is not going to be a second one and I have said that
      at a meeting, out loud, on the record, in front of everybody,
      partly so that I cannot do it and partly because it is true:
      you get one, and it goes at the end, and then you stop.

      [Verse 4]
      Cass on a guitar he bought off a stall for one night's fee.
      Tem, who was right five years ago and has not mentioned it.
      Wyll and one bag and a pattern off a departure board,
      Iber at the back, where the mark is, not moving forward.
      A hauler pulling out behind all four of them every night.

      [Final Chorus - the whole band on one line, nobody above]
      Turn and burn. In at six and out again at four.
      Nine ports, eleven days, and a hall in every one,
      and there are five of us shouting the same words,
      and a departure at four, and that is where this stops.

      [Outro - held chord, every voice on it]
