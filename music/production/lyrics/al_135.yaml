    exclude: acoustic instruments, orchestral strings, brass, ballad tempos, stacked harmony, close studio harmony, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 8 seconds, keyboard and bass, no vocal]

      [Verse 1]
      This is how Tem tells it. I agreed to hold corrections.
      Seventeen years of choosing the set between berth and hall.
      No paper. No list. No mark beside a title.
      Four people learned the first song when I faced the microphone.
      Cass watched my left hand. Wyll watched Cass.
      Iber waited for two bars and found us from there.

      [Pre-Chorus]
      He is right about all of that. That is what happened.

      [Chorus]
      There is a written order and it is on the wall.
      One through twelve in a clerk's square hand.
      I read it with the others. I do not like it.
      We start together now. Nobody has to guess.
      That is my whole concession. Leave it there.

      [Verse 2]
      Tem says he played the first two bars of nine hundred songs
      while deciding which nine hundred I had meant.
      He says Cass guessed wrong twice at the last ferry.
      He says Wyll once counted four different openings.
      Tem says these things quietly, at a table, once,
      after carrying the figures around for a fortnight.

      [Pre-Chorus]
      Iber said he had been going to mention it in 2616.

      [Chorus]
      There is a written order and it is on the wall.
      One through twelve in a clerk's square hand.
      I read it with the others. I do not like it.
      We start together now. Nobody has to guess.
      That is my whole concession. Leave it there.

      [Verse 3]
      On the first night, the page stayed up by the side door.
      I reached the third title and did not change it.
      At number seven, Cass was ready before I turned.
      Wyll had the count. Iber had both hands down.
      The walk from the berth felt ten minutes shorter.
      I had mistaken choosing quickly for not being afraid.

      [Final Chorus - the whole band]
      There is a written order and it is on the wall.
      Tem wrote these words. I left his count alone.
      One through twelve, and everybody enters together.
      I lost the argument. We stopped losing the first bar.
      That is my whole concession. Take the page down tomorrow.

      [Outro - fade]
    take: null                    # M-31 fills this in at the Suno sitting

