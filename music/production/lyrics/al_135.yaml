  - id: s_1103
    title: Paid by the Port
    track_number: 1
    mood: [triumphant, driving, fast]
    fact: >-
      The membership reversed its own vote of 2619, and Rhea Molt sings the new wording of it in the
      chorus.
    arrangement_note: the chorus is the amended wording of a membership resolution sung as a hook, and the two answering voices come in on the last three words of every line of it
    intro: 6
    outro: fade
    target_duration: "4:15"
    prompt: >-
      Fast boogie rock at the hard-rock edge, 162 BPM, triumphant and driving, fast and amplified.
      Female lead vocal, bright hard mezzo, fast and clipped, singing ahead of the beat and cutting
      line ends off short instead of holding them, no vibrato. Two male voices answering the last
      three words of every chorus line, blunt and unpolished, never close harmony, the whole band
      shouting the last one. Two electric guitars, electric bass, drum kit with struck alloy, compact
      electric organ-toned keyboards high beside the guitars. Tracked over two days in a hall beside
      the berth, first-take feel, very little overdub. Six seconds of full band before the first sung
      word. Fade.
    exclude: acoustic instruments, orchestral strings, brass, ballad tempos, stacked harmony, close studio harmony, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 6 seconds, full band, no vocal]

      [Verse 1]
      The spring sheet went up by the office door.
      Same clips. Same paper. One new line near the bottom.
      Nobody made a speech. Nobody cleared a throat.
      A clerk read it once and ninety hands came up.
      Four minutes from the first word to the entered count.
      Tem spent five years asking. He missed the vote.

      [Chorus]
      Paid by the port. Paid by the night and the hall.
      That is the wording. Read it off the page.
      A performing member shall be paid by the engagement.
      Four clerks wrote that with a straightedge and a pen.
      I get to shout it all the way down the lane.

      [Verse 2]
      Tem was on the lane out of Forge that morning,
      with a nine-hour hold before the next berth.
      The count reached him on the carrier wave after midnight.
      He left the message unanswered for two whole days.
      Then four words came back through the relay:
      Good. Keep the paper.

      [Chorus]
      Paid by the port. Paid by the night and the hall.
      That is the wording. Read it off the page.
      A performing member shall be paid by the engagement.
      Four clerks wrote that with a straightedge and a pen.
      I get to shout it all the way down the lane.

      [Verse 3]
      It bought a second morning in three port halls.
      The cables stayed taped. The kit stayed where it stood.
      Iber found his keyboard waiting at the same wall.
      Cass moved left instead of loading for the hauler.
      Five years became three ordinary mornings,
      which is not much to a membership and plenty to us.

      [Bridge]
      Nobody has told Tem he was right. Nobody is going to.
      He would not know where to put it if they did.

      [Final Chorus - the whole band shouting]
      Paid by the port. Paid by the night and the hall.
      Read the line. Count the hands. Put down the rate.
      A performing member shall be paid by the engagement.
      The sheet is on the door and the hauler leaves at four.
      We get tomorrow in the hall. That is the difference.

      [Outro - fade]
