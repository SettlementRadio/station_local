    exclude: cymbals, acoustic instruments, orchestral strings, brass, ballad tempos, stacked harmony, close studio harmony, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 5 seconds, struck alloy alone, no vocal]

      [Verse 1]
      Every port hall has a board above the side door.
      Forty departures, white letters, one narrow row for us.
      The row says four even when the room is full.
      At three fifty-nine, a clerk turns the gate sign.
      At four, our line goes blank and the hauler moves.
      Nobody asks whether the last chord was good.

      [Chorus]
      Nobody waits for us. Nobody has ever waited.
      Not the hauler. Not the gate. Not the board on the wall.
      Four means through the door, boots down, cases loaded.
      Four means wave from the berth or watch it leave.
      Get on it. The white row is already moving.

      [Verse 2]
      Wyll stood under that board with one stick in his hand.
      He tapped each change against the leg of a case.
      Two close together. One alone. Three with a gap.
      The clerk cleared a row. Wyll struck the case again.
      At the next hall he found a strip of alloy
      and made the rest of us come in on the departures.

      [Chorus]
      Nobody waits for us. Nobody has ever waited.
      Not the hauler. Not the gate. Not the board on the wall.
      Four means through the door, boots down, cases loaded.
      Four means wave from the berth or watch it leave.
      Get on it. The white row is already moving.

      [Instrumental - lead guitar break over the alloy pattern, 16 seconds]

      [Verse 3]
      We missed one departure in 2618.
      The gate was shut. Our row had already gone blank.
      Wyll stood with one bag on the wrong side of it.
      That cost a fortnight's pay and the next port hall.
      Since then he reaches every berth before the clerk.
      He sets the cases down. He checks the white row.
      Ask what happened that year and he checks it again.

      [Shout - the whole band]
      Get on it. Get on it. It is not going to wait.

      [Final Chorus - the whole band shouting]
      Nobody waits for us. Nobody has ever waited,
      not the hauler, not the gate, not the board on the wall.
      Three fifty-nine. Wyll brings the alloy down.
      Four o'clock. The row goes blank. The berth is clear.
      We are through the door before the last strike stops.

      [Outro - fade on the alloy pattern]
