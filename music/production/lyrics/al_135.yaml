  - id: s_1104
    title: Two Days in the Same Hall
    track_number: 2
    mood: [warm, expansive, midtempo]
    fact: >-
      It is the first song Turn and Burn ever played twice in one room, which the change to how they
      were paid is what allowed.
    arrangement_note: this is the second day's take, so it is the only thing in the band's catalogue that has been played twice in the same room, and everything about it is set better and further apart than usual
    intro: 12
    outro: sustain
    target_duration: "4:50"
    prompt: >-
      Fast boogie rock at the hard-rock edge, 140 BPM, warm and expansive, midtempo for this band and
      still quick, amplified. Female lead vocal, bright hard mezzo, fast and clipped, singing ahead
      of the beat and cutting line ends off short, no vibrato. Two male voices answering short
      phrases on the chorus, blunt and unpolished, never close harmony, the whole band shouting the
      last one. Two electric guitars, electric bass, drum kit with struck alloy, compact electric
      organ-toned keyboards high beside the guitars — everything better set and further apart than
      anywhere else in this band's catalogue, because it is a second day in a room they already knew.
      Twelve seconds of keyboard and guitars before the first sung word. Ends on a held chord.
    exclude: acoustic instruments, orchestral strings, brass, ballad tempos, stacked harmony, close studio harmony, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 12 seconds, keyboard and guitars, no vocal]

      [Verse 1]
      Monday at six, we carried everything through the side door.
      Cass found a socket. Wyll found the loose floorboard.
      Iber put a chalk mark where the keyboard stopped humming.
      Tem ran one note until the far wall threw it back.
      I sang toward the ceiling and lost every hard word.
      At four we left the cables taped and caught the hauler.

      [Verse 2]
      Tuesday at six, the side door opened on the same room.
      The socket still worked. The floorboard still moved.
      Chalk on the boards. Tape on every cable.
      Wyll's sticks were lying where he dropped them.
      Nobody asked where to stand or which wall was bad.
      We had a whole morning left after finding nothing.

      [Chorus]
      Two days in one hall. Two of them. In a row.
      Same side door. Same bad board. Same mark below.
      Leave it where it works. Come back and start there.
      Hear what went wrong. Move four feet. Go again.

      [Verse 3]
      Cass heard the low strings pile up at the far wall.
      He had heard it by the second song on Monday.
      On Tuesday he moved four feet left and struck one chord.
      The note went clean between the keyboard and the kit.
      He looked at Tem. Tem nodded. That settled it.
      Usually the answer arrives while we are leaving the port.

      [Chorus]
      Two days in one hall. Two of them. In a row.
      Same side door. Same bad board. Same mark below.
      Leave it where it works. Come back and start there.
      Hear what went wrong. Move four feet. Go again.

      [Bridge]
      Every other band on this lane has had this for years.
      We got it late. We still came back through the door.

      [Final Chorus - the whole band]
      Two days in one hall. Two of them. In a row,
      same five chalk marks waiting on the floor.
      Nothing packed. Nothing dragged back from the berth.
      Monday found the room. Tuesday found the song.
      Leave it where it works. We get another go.

      [Outro - held chord]
