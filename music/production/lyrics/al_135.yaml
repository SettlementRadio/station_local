      and moved about four feet to the left and solved it,
      which he had known about since the second song on the Monday
      and had not been able to do anything about until now,
      because there has never been an until now on this circuit,
      there has only ever been a departure and the next port.

      [Chorus]
      Two days in one hall. Two of them. In a row.
      You come back in and the room has already met you
      and the thing that went wrong last night has been thought about
      and somebody has had an idea overnight, which is new.

      [Bridge]
      Every other band on this lane has had this for years.
      I am not going to pretend that it is not a bit late.

      [Final Chorus - the whole band]
      Two days in one hall. Two of them. In a row,
      and this is the second one, and you can hear the difference,
      and the three songs on here that only got one day
      are the three I would take off if anybody let me.

      [Outro - held chord]
