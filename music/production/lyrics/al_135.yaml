    lyrics: |
      [Intro - 15 seconds, guitars and keyboard, no vocal]

      [Verse 1]
      They do not announce it. There is no notice and no meeting.
      The schedule goes up in the spring and there are nine ports on it
      and there were eleven ports on it the year before,
      and that is how everybody on this circuit finds out.

      [Refrain]
      The circuit got colder. Two fewer halls and nobody said anything.
      Two rooms that were warm in the winter and are not now.
      I am not going to name them because they are still there
      and the people in them do not need it said out loud.

      [Verse 2]
      One of them has been on our schedule since 2607
      and I have played it seventeen times and know the keeper's name
      and know which of the doors sticks and where the good light is
      and I am not going to be in that building again.

      [Refrain]
      The circuit got colder. Two fewer halls and nobody said anything.
      Two rooms that were warm in the winter and are not now.
      I am not going to name them because they are still there
      and the people in them do not need it said out loud.

      [Verse 3]
      Tem wrote this and would not put either name in it
      and I argued for both of them, at a table, for an hour,
      and he said that a settlement that has lost its hall
      does not want to hear about it from somebody who left.

      [Bridge]
      There is a hauler that stops calling and then a shop
      and then a school and then it is a siding with beds on it.
      I have watched it twice. Both times it started like this.

      [Refrain - two words added]
      The circuit got colder. Two fewer halls and nobody said anything.
      Two rooms that were warm in the winter and are not now.
      I am not going to name them because they are still there
      and the people in them do not need it said out loud by me.

      [Outro - fade]
