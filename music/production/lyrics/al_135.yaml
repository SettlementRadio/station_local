    lyrics: |
      [Intro - 18 seconds, keyboard alone, no vocal]

      [Verse 1]
      Iber came on a Tuesday in 2614 for one night.
      He stood beside the kit where the wall cut off the light.
      Wyll moved a case and gave him four feet of floor.
      Iber marked the place with chalk before we left.
      Ten years of lanes, holds and port halls later,
      the mark is different and the four feet are the same.

      [Verse 2]
      I leave a line too early. He keeps the chord under it.
      Cass drives past the turn. Iber puts the turn back.
      Tem drops a beat to watch what Wyll will do.
      The keyboard holds the gap until both of them return.
      Then Iber lifts his hands and coils the keyboard lead.

      [Chorus]
      Keyboard at the back. Where he has always stood.
      Left of the kit, beside the wall, out of the light.
      When the guitar runs wide, he closes up the gap.
      When I cut the line, one hard chord stays under it.
      Nobody turns around. It is already there.

      [Instrumental - keyboard break, guitars out, 20 seconds]

      [Verse 3]
      Tem put his name on the writing line for this one
      without a meeting and without telling him first.
      Iber found the proof waiting in a transfer hall.
      He read the five names twice at the counter.
      Then he set it down and went outside before the ferry call.
      We found him at the berth with nothing to say.

      [Chorus]
      Keyboard at the back. Where he has always stood.
      Left of the kit, beside the wall, out of the light.
      When the guitar runs wide, he closes up the gap.
      When I cut the line, one hard chord stays under it.
      Nobody turns around. It is already there.

      [Bridge]
      He has still not moved forward. There is a mark on the floor.
      Cass takes both guitars out. Iber stays exactly there.
      Twenty seconds. Both hands. No wall left between us.

      [Final Chorus - the whole band]
      Keyboard at the back. Where he has always stood.
      Chalk at his boots and five names on the proof.
      Ten years closing every gap we leave behind.
      Tonight the guitars stop. The keyboard does not.
      Iber takes the room without taking one step.

      [Outro - held keyboard chord]
