      ends off short, no vibrato. Two male voices answering short phrases on the chorus, blunt and
      unpolished, never close harmony, the whole band shouting the last one. Two electric guitars,
      electric bass, compact electric organ-toned keyboards high beside the guitars, and a drum kit
      with no cymbals at all — struck alloy in their place, playing one fixed repeating pattern that
      never responds to anything else in the arrangement. Tracked in one turnaround, first-take feel,
