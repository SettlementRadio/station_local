    lyrics: |
      [Intro - 6 seconds, full band, no vocal]

      [Verse 1]
      Five years and nobody said anything about it once,
      not at a meeting, not in a corridor, not to Tem,
      and then somebody put it back on the paper for the spring
      and it went through on a show of hands in about four minutes.

      [Chorus]
      Paid by the port. Paid by the night and the hall.
      That is the wording. I have not changed a word of it.
      A performing member shall be paid by the engagement.
      Somebody typed that and I am singing it at you.

      [Verse 2]
      Tem was not at that meeting. He was on a lane out of Forge
      with about nine hours of a hold in front of him
      and found out from a message that came down the carrier wave
      and did not say anything back for about two days,
      and then sent four words down it, and the four words were fine.

      [Chorus]
      Paid by the port. Paid by the night and the hall.
      That is the wording. I have not changed a word of it.
      A performing member shall be paid by the engagement.
      Somebody typed that and I am singing it at you.

      [Verse 3]
      What it actually buys is two days instead of one
      in three of the halls that this record was made in,
      and you can hear which three, and everybody can hear it,
      and that is the whole argument and it took five years,
      and five years is nothing to a membership and it is a lot to a band.

      [Bridge]
      Nobody has said he was right. Nobody is going to.
      He would not know where to put it if they did.

      [Final Chorus - the whole band shouting]
      Paid by the port. Paid by the night and the hall.
      Ninety people changed their minds without ever saying so
      and the four clerks had it on the paper inside a fortnight
      and we have been better ever since and it is not close.

      [Outro - fade]
