  - id: s_0837
    title: A Letter and a Number
    track_number: 3
    mood: [dry, midtempo, knowing]
    fact: >-
      The importer's letter asked for songs with fewer names in them, and Bran Teale put the request
      itself into the second verse.
    arrangement_note: the letter is quoted flat by one voice with the band out of it, and every name in the other four songs was left where it was, which is the answer the song does not bother to state
    intro: 12
    outro: sustain
    target_duration: "3:55"
    prompt: >-
      90 BPM dry folk blues; clear female lead, staggered trio, flat solo quote, guitar, bass, held end.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, vocal tuning, whispered or rapped sections, cold ending, fade-out
    lyrics: |
      [Intro - guitar and bass, twelve seconds]

      [Verse 1]
      A clerk beyond the lag unfolds the yard into four lines,
      one polite request and one precise amount.
      No wet rope stains the page, no berth lamp shakes above it.
      No winter ration waits behind the careful script.
      Distance makes a person neat enough for cargo.
      Distance turns a working life to syllables and minutes.
      Then one sentence asks us to become a little smaller.

      [The letter - lead alone, flat]
      Fewer names in them, if that can be arranged.
      Twenty-two minutes. Yours faithfully.

      [Verse 2]
      Here, a name means someone keeping west-gate weather,
      someone stretching six meals from five ration marks,
      someone whose spare gloves fit the newest freight hand,
      someone who leaves one lamp for boats beyond the reeds.
      There, a name may catch against an unfamiliar tongue.
      The clerk is not unkind; she is very far away.
      Care can lose its object over that much dark before the far page opens.

      [Refrain]
      One letter and one number is what we were sent.
      One season through the lag can wear a sentence smooth.
      Fold the whole yard small enough to travel.
      Open it elsewhere and hope the people rise again.

      [Verse 3]
      We answer with the jetty, soup and broken airlock,
      with the third iced step and every counted boat.
      Not one private name, yet nothing living taken out.
      The clerk will hear a room and never see the table.
      We will never see the hand that opens what we send.
      Between us lies a cargo road and one good chance:
      strangers may feel known without knowing whom to thank.

      [Refrain]
      One letter and one number is what we were sent.
      One season through the lag can wear a sentence smooth.
      Fold the whole yard small enough to travel.
      Open it elsewhere and let the people rise again.

      [Outro - sustain]
