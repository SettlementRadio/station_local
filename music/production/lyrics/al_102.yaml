  - id: s_0836
    title: Sing It Twice Over
    track_number: 2
    mood: [communal, bright, rolling]
    fact: >-
      The round goes through twice because the band arrived with four songs and had been asked for
      five.
    arrangement_note: the round is sung all the way through twice with one bar between, and the second time is deliberately not a repeat — the entrances are tighter and the voices are ahead of where they were
    intro: 4
    outro: cold
    target_duration: "3:35"
    prompt: >-
      100 BPM rolling round; clear female lead, staggered trio, tighter second pass, organ, guitar, stop.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, identical repeats, vocal tuning, whispered or rapped sections, fade-out
    lyrics: |
      [Intro - reed organ, four seconds]

      [First line - lead alone]
      Say it once before the storm and once when it is over.

      [Verse 1]
      You promised at the berth before the weather changed:
      home by ration bell, wet coat beside the heater,
      both hands round the cup I leave above the stove.
      The words were light enough to cross the morning water.
      I carried them all day without examining the seams.
      Then storm-season warning closed the northern markers,
      and the same words took on every weight they had concealed.

      [Round - four voices, a bar apart, twice through]
      Sing it twice over and the second time is not the first.
      Once for what we promise, once for what we learn.
      Come in behind me; leave one bar for changing.

      [Verse 2]
      Relay contact failed beyond the cold-store launch.
      I walked from stove to window till the cup went dark.
      At midnight, one weak signal crossed the yard receiver:
      engine holding, outer hold dry, no arrival time.
      Home by ration bell became home if water lets me.
      I heard your voice inside the altered sentence,
      tighter at the entrance, less certain at the end.

      [Round - four voices, a bar apart, twice through]
      Sing it twice over and the second time is not the first.
      Once for what we promise, once for what we learn.
      Come in behind me; leave one bar for changing.

      [Verse 3]
      Near dawn, your marker moved behind the breakwater.
      You crossed the airlock slower than the injured crews.
      The cup was cold; the stove had used its final cell.
      You touched both hands around it all the same.
      Home by ration bell came back without its innocence.
      We said it once together for the people we had been,
      then once again for those who knew the water better.

      [Final Round - four voices, a bar apart, twice through]
      Sing it twice over and the second time is not the first.
      Once for what we promise, once for what we learn.
      Come in behind me. We are different at the turning.

      [Coda - cold stop]
