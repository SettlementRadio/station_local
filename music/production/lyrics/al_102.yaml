  - id: s_0838
    title: Cold Meal, Warm Room
    track_number: 4
    mood: [warm, slow, generous]
    fact: >-
      Amon Furlow plays piano, having crossed from Mars on the strength of a letter, and the band had
      never heard him play before that morning.
    arrangement_note: the guest piano leaves holes in the time on purpose and the four voices fall into them, which took about a bar to work out and had never happened to this band before
    intro: 15
    outro: fade
    target_duration: "4:10"
    prompt: >-
      74 BPM warm folk blues; clear female lead, staggered trio, sparse late piano, organ, warm fade.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, busy or continuous piano, vocal tuning, whispered or rapped sections, cold ending
    lyrics: |
      [Intro - piano and reed organ, fifteen seconds]

      [Verse 1]
      He comes off the inner-route hauler after nightfall,
      coat sealed to the throat, meal packet frozen through.
      One letter brought him farther than good sense would recommend.
      The hired-room stove is red behind its guard.
      Nobody knows the shape his silence takes at home.
      Nobody asks him to make distance entertaining.
      A chair moves nearer to the heat; that is enough.

      [Chorus]
      Cold meal in a warm room is not a bad evening.
      Put your travelling coat across the broken door.
      Come in from the cargo road and let the quiet stay.

      [Verse 2]
      There is root stew for four and now there are five bowls.
      Someone thins the pot; someone divides the bread.
      He eats the cold meal first, saving heat for later,
      and leaves long spaces where another guest might talk.
      The lake wind worries at the unsealed door.
      A berth lamp swings across the ceiling every minute.
      Strangers become company by needing the same fire.

      [Chorus]
      Cold meal in a warm room is not a bad evening.
      Put your travelling coat across the broken door.
      Come in from the cargo road and let the quiet stay.

      [Verse 3]
      Near midnight, he uncovers the hired-room piano,
      presses one low key and waits beyond its ending.
      No one rushes in to fill the open measure.
      The next note lands as softly as a cup set down.
      Four voices find the spaces without taking them away.
      Outside, the return board clears its final marker.
      Inside, nobody has asked where he will go tomorrow.

      [Bridge]
      One letter. One crossing. Five bowls around a stove.
      Leave room in every measure for the far-travelled person.

      [Final Chorus]
      Cold meal in a warm room is not a bad evening.
      Put your travelling coat across the broken door.
      Morning has the cargo road. Tonight, let the quiet stay.

      [Outro - fade]
