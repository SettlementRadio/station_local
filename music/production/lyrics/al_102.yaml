  - id: s_0839
    title: Same Four Voices
    track_number: 5
    mood: [final, close, communal]
    fact: >-
      The four sing it with no instruments at all, which is what they do at the end of every night in
      the yard and had never put on a record.
    arrangement_note: four voices and nothing else anywhere on the track — no reed organ, no guitar, no bass, no hands on anything — which is the only track on this record with no instrument under it
    intro: 3
    outro: sustain
    target_duration: "4:00"
    prompt: >-
      66 BPM bare round; four unaccompanied voices enter a bar apart, bass last, natural room, held end.
    exclude: all instruments, reed organ, guitar, bass, percussion, drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, vocal tuning, whispered or rapped sections, cold ending, fade-out
    lyrics: |
      [Intro - four voices humming, three seconds]

      [First line - lead alone]
      When the lamps come down, leave one line inside the room.

      [Verse 1]
      Last boat tied, wet rope lifted from the walkway,
      four workers wait while marker lights go dark.
      The hold is empty; every name is off the board.
      Still nobody reaches for the outer airlock.
      A day this long needs more than gates to close it.
      One clear line rises where the engine noise had been.
      Three more enter slowly, carrying the ending round.

      [Round - four voices, no instruments]
      Four voices after labour, four breaths in the cold.
      One for those gone home and one for those still travelling.
      Leave the final line awake inside the yard.

      [Verse 2]
      One of them once waited eleven nights beside this berth,
      partner overdue beyond the storm-season relay.
      The others stayed without pretending hope was certain.
      Every night they gave the empty water one low line.
      On the twelfth, a damaged marker answered through the snow.
      Since then, no one leaves before the last note settles.
      Habit may be gratitude that never learned a speech.

      [Round - four voices, no instruments]
      Four voices after labour, four breaths in the cold.
      One for those gone home and one for those still travelling.
      Leave the final line awake inside the yard.

      [Verse 3]
      Tonight the hired room stands far from lake and gate.
      No return board waits beside the closing door.
      Yet when the first line starts, the berth comes with it:
      salt upon the steps, lamp oil, rope against the wall.
      Distance cannot choose which rooms a voice remembers.
      Four coats lift; four shadows turn toward home.
      The final breath remains after the door goes still.

      [Final Round - four voices, no instruments, the last entry held]
      Four voices after labour, four breaths in the cold.
      One for those gone home and one for those still travelling.
      Leave the final line awake inside the yard.
      Leave it there. The morning crew will find it.

      [Coda - sustain, four voices]
