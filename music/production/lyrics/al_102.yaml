songs:
  - id: s_0835
    title: Whatever Fits the Crate
    track_number: 1
    mood: [wry, brisk, warm]
    fact: >-
      The title is what Effa Lomm wrote back to the importer, and the record runs to within a minute
      of the length that letter asked for.
    arrangement_note: a brisk opener that stops exactly where it is asked to rather than where the round wants to, which is the whole joke of the record played once at the front of it
    intro: 6
    outro: fade
    target_duration: "3:40"
    prompt: >-
      96 BPM brisk folk round; clear female lead, staggered trio, guitar, bass, hand drum, warm fade.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, vocal tuning, whispered or rapped sections, cold ending
    lyrics: |
      [Intro - guitar and hand percussion, six seconds]

      [Verse 1]
      Her transfer notice gives one crate and twenty-two minutes
      at the cargo gate before the northbound hauler seals.
      Twelve years in a berth-side room must learn one measure:
      one work coat, two good pans, the blanket from her mother,
      four relay letters tied beneath a ration cord.
      Everything else waits in cupboards like a question.
      The crate stands open, smaller every time she looks.

      [Chorus]
      Whatever fits the crate is what you are going to get.
      Keep the useful things and one thing with no use.
      A whole life never travelled by obeying every limit.

      [Verse 2]
      The neighbour wants the kettle; the yard nurse takes the chair.
      Children choose the coloured cups and argue over both.
      She gives away the heavy things with practical relief,
      then finds an old gate token underneath the table burn.
      It opens nothing now; the berth changed locks nine years ago.
      Still it takes the final corner meant for winter socks.
      Memory has never learned to pack according to its weight.

      [Chorus]
      Whatever fits the crate is what you are going to get.
      Keep the useful things and one thing with no use.
      A whole life never travelled by obeying every limit.

      [Verse 3]
      At the transfer hall, the weight comes half a mark too high.
      The clerk taps the blankets, waiting for a sacrifice.
      She takes one steel pan out, leaves the useless token in.
      Twenty-two minutes after that, the hauler joins the dark.
      Her old room holds a pale square where the crate had stood.
      Her new one waits beyond a season of cargo road.
      Between them, one small key keeps every door she chose.

      [Final Chorus]
      Whatever fits the crate is what you are going to get.
      Keep the useful things and one thing with no use.
      A whole life never travelled by obeying every limit.
      Close the lid. The part that matters will not stay behind.

      [Outro - fade]
