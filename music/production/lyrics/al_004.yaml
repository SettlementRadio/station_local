    lyrics: |
      [Intro - 7 seconds, guitars and keyboard bass, kit at four seconds, no vocal]

      [Verse 1]
      There is one place left with the lights still on
      And a man behind the counter who has given up asking us to go.
      Everybody in here is somebody's problem tomorrow,
      And tomorrow is a long way down the street.

      [Chorus 1]
      Open until dawn (until dawn)
      That is not a promise, that is a warning (that's a warning)
      You have missed the last ferry and you knew that you would -
      Sit down, you have nowhere to be until seven.

      [Verse 2]
      You put your coat on the back of my chair, not yours,
      Which is either nothing or the whole of the evening.
      I have decided not to find out for at least an hour,
      Because the finding out is the part that ends things.

      [Chorus 2 - title line phrased differently]
      Open until dawn (until dawn)
      That is not a promise, that is a warning (that's a warning)
      The transfer hall is shut and the rain has not let up -
      Sit down, you have nowhere to be until seven.

      [Bridge - all four shouting]
      Last one out gets the chairs up!
      Nobody is volunteering, nobody is moving!

      [Chorus 3 - title line phrased differently again]
      Open until dawn (until dawn)
      That is not a promise, that is a warning (that's a warning)
      There are four of us left and one of us is asleep -
      Sit down, you have nowhere to be until seven.

      [Final Chorus - all four voices, title line different a fourth time]
      Open until dawn (until dawn)
      That is not a promise, that is a warning (that's a warning)
      He will lock it behind us and be back at eleven -
      Sit down, you have nowhere to be until seven.

      [Outro - fade on the guitars and the group hook]
