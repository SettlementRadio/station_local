    lyrics: |
      [Intro - 3 seconds, guitar, no vocal]

      [Verse 1]
      You work nights and I work the back half of the day
      and we have done it four years and we are fine.
      I get in at two to a warm and empty flat
      with a plate under cloth and the hall light on.
      Four years of that in a settlement this size,
      and the two of us still somehow managing to miss each other.

      [Chorus]
      You left the light on. You always leave the light on.
      Nine credits a season and you will not let me change it.
      You say it is so I can find the step without falling,
      I say it is so I know somebody meant to be here.

      [Verse 2]
      I keep a list of things to tell you from the shed:
      the storm coast wind, the wrist, the argument about the fee.
      By the time you wake I will have slept it off,
      and none will be worth the breath it takes to say.

      [Chorus]
      You left the light on. You always leave the light on.
      Nine credits a season and you will not let me change it.
      You say it is so I can find the step without falling,
      I say it is so I know somebody meant to be here.

      [Verse 3 - four-bar lead guitar figure under the first four lines, no break]
      Some mornings I hear your key as mine leaves the latch,
      and we get one sentence each before the kettle starts.
      There is no extra hour hiding anywhere between us.
      There is only the light, the plate, and the step I find.

      [Chorus]
      You left the light on. You always leave the light on.
      Nine credits a season and you will not let me change it.
      Leave it on tomorrow. I will be later than this.
      Leave it on and I will find the step.

      [Outro - fade]
