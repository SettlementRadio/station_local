    exclude: synthesizers, keyboards, acoustic guitar, orchestral strings, brass, stadium reverb, heavy vocal tuning, spoken-word or rapped sections, whispered vocals, dance and electronic production, cymbal-heavy drumming
    lyrics: |
      [Intro - 4 seconds, kick and snare alone, no vocal]

      [Verse 1]
      Wind came round the corner of the shed at about eleven
      and took the corner of the sheet like it was asking a question.
      Two of us on the near edge and nobody on the far one
      and the whole load standing there open to the storm coast.

      [Chorus]
      Hold that sheet down till I take the near side.
      Keep your bad hand clear; shout if the corner runs.
      The load and sheet can take the weather.
      Nobody's hand is cargo. Nobody has to prove it.

      [Verse 2]
      Teff went over on the second night and came up wrong,
      wrist strapped by morning and the kit still where he left it.
      The work board sent another drummer across the yard.
      Teff said he could play if the useless motions went,
      so we made the part fit the hand he had
      instead of asking one wrist to pretend it had two.

      [Chorus]
      Hold that sheet down till I take the near side.
      Keep your bad hand clear; shout if the corner runs.
      The load and sheet can take the weather.
      Nobody's hand is cargo. Nobody has to prove it.

      [Verse 3]
      For the next nine nights we changed the way we moved together.
      Nobody sent him for a corner and nobody let him lift.
      At the kit he kept the beat with what the strapped hand gave him,
      and the rest of us left room instead of filling every gap.

      [Bridge]
      Anybody can hold a corner on a still night.
      The test is letting go before the weather takes the hand.
      Nine nights left, one strapped wrist, one shed,
      and four people making sure that one injury stayed one.

      [Final Chorus - all four, shouted]
      Hold that sheet down till I take the near side.
      Keep your bad hand clear; shout if the corner runs.
      The load and sheet can take the weather.
      We held it down together. That is the whole story.

      [Outro - cold stop]
