    exclude: synthesizers, keyboards, acoustic guitar, orchestral strings, brass, stadium reverb, heavy vocal tuning, spoken-word or rapped sections, whispered vocals, dance and electronic production
    lyrics: |
      [Intro - 8 seconds, rhythm guitar and bass, no vocal]

      [Verse 1]
      It was the last night of a bad week and we were all still standing,
      which on any other week would have been the good news.
      Four of us, one hold, one sheet of paper,
      and a supervisor who had gone home at eleven and left it to us.

      [Chorus]
      Wrong bay. The right crew.
      We put it back and nobody has to know.
      Wrong bay, and the right four hands to be standing there,
      because the ones that made the mess are the ones that shift it twice.

      [Verse 2]
      One: two pallets to the near door that should have gone to the far one.
      Two: a strap through the wrong ring, which held anyway, which is worse.
      Three: the sheet signed before it was checked, by me, in my writing.
      Four: forty minutes lost pretending the third one had not happened.

      [Chorus]
      Wrong bay. The right crew.
      We put it back and nobody has to know.
      Wrong bay, and the right four hands to be standing there,
      because the ones that made the mess are the ones that shift it twice.

      [Instrumental - one bar of dead silence, then a lead guitar break, 14 seconds]

      [Verse 3]
      Teff said write them down and we will sing them at the gate,
      because a thing you can sing is a thing that has stopped being frightening.
      So here they are, all four, in the order that we made them,
      and every crew on the dock knows all four off by heart.

      [Bridge]
      Nobody died. Nothing was broken. The cargo went out on time.
      And it took the four of us the whole of that night to be sure of it,
      and the hold was shut and sealed by twenty past five in the morning,
      and not one word of any of it went up to the office.

      [Final Chorus - all four, shouted]
      Wrong bay. The right crew.
      We put it back and everybody knows.
      Wrong bay, and the right four hands to be standing there,
      because the ones that made the mess are the ones that shift it twice.

      [Outro - fade on the riff]
