  - id: s_0266
    title: Nothing Loose
    track_number: 1
    mood: [driving, blunt, fast]
    fact: >-
      Wen Arbo built the chorus out of the check the crew shouts before a bay door opens, and the
      band kept the counting-in shout on the take.
    arrangement_note: the four-word crew check opens the record shouted flat with no music under it, a counted stick brings the band in, and the same exact check returns between the second and third verses
    intro: 0
    outro: cold
    target_duration: "3:45"
    prompt: >-
      Dry pub rock, 150 BPM, driving and blunt, fast. Male lead vocal, plain mid baritone,
      conversational and unforced, sung hard on the beat, getting louder rather than higher at the
      end of a chorus, no vibrato. Two band voices in unison under the lead on the chorus only,
      never in harmony, all four shouting the hook on the last one. Two bright thin-toned electric
      guitars, one rhythm and one lead, electric bass, compact drum kit. Tracked live in a small
      hard-walled shed bay, guitars close-mic'd and mid-forward, drums tight and untreated, nothing
      overdubbed but a doubled chorus vocal. Opens immediately with all four voices shouting
      "Straps, sheet, corners, latch" flat and with no music under them; a counted stick brings the
      band in. The same exact four-word check returns once between the second and third verses, again
      with the band stopped. Cold stop.
    exclude: synthesizers, keyboards, acoustic guitar, orchestral strings, brass, stadium reverb, heavy vocal tuning, spoken-word or rapped sections, whispered vocals, dance and electronic production
    lyrics: |
      [Crew Check - all four voices shouted flat, no music]
      Straps! Sheet! Corners! Latch!

      [Count-in - counted stick brings the band in]

      [Verse 1]
      Straps, sheet, corners, latch, and then you say it out loud,
      because saying it in your head has killed people before.
      Four of us on the floor and every one of us checks,
      and the one who checks last is the one who opens the door.
      That is not a rule anybody wrote down. It is older than the shed.

      [Chorus]
      Nothing loose, nothing loose,
      say it back to me before that door comes up.
      Nothing loose, nothing standing where it should not stand.
      I want to hear it from all four of you or the door stays shut.

      [Verse 2]
      Orl went under a pallet in his second year on the dock
      because a man on the far side said fine instead of saying yes.
      He was out for nine weeks and he came back and said nothing
      and he has said the whole list out loud every shift since.
      There is nothing on any manifest worth a man's shoulder.
      There is nothing in any hold that is in a hurry.

      [Chorus]
      Nothing loose, nothing loose,
      say it back to me before that door comes up.
      Nothing loose, nothing standing where it should not stand.
      I want to hear it from all four of you or the door stays shut.

      [Crew Check - all four voices shouted flat, no music]
      Straps! Sheet! Corners! Latch!

      [Verse 3]
      Every crew on this coast has a short list of its own.
      Some name the straps first and some begin with the latch.
      The words come out different but the meaning stays the same:
      nobody lifts and nobody opens until everybody answers back.
      Ask a hauler pilot, ask anybody walking off a deck,
      they will stop at the hatch and call their own check out too.

      [Final Chorus - all four voices, shouted]
      Nothing loose, nothing loose,
      say it back to me before that door comes up.
      Nothing loose, nothing standing where it should not stand,
      and the cargo goes out whole and so does everybody else.

      [Outro - cold stop]
    take: null                    # M-31 fills this in at the Suno sitting

  - id: s_0267
    title: Count Me on the Manifest
    track_number: 2
    mood: [defiant, singalong, brisk]
    fact: >-
      Dessa Kelm refused to record a solo lead on a song about being listed with everybody else, so
      all four members sing the last chorus.
    arrangement_note: the two band voices sing in unison under the lead through both choruses and the last chorus is sung by all four in unison with no lead vocal above it at all
    intro: 10
    outro: sustain
    target_duration: "4:00"
    prompt: >-
      Dry pub rock, 138 BPM, defiant and brisk, built to be sung back. Male lead vocal, plain mid
      baritone, conversational and unforced, sung hard on the beat, getting louder rather than
      higher at the end of a chorus, no vibrato. Two band voices in unison under the lead through
      the choruses, never in harmony, and the last chorus sung by all four in unison with no lead
      vocal above it. Two bright thin-toned electric guitars, one rhythm and one
      lead, electric bass, compact drum kit. Tracked live in a small hard-walled shed bay, guitars
      close-mic'd and mid-forward, drums tight and untreated, nothing overdubbed but a doubled
      chorus vocal. Ten seconds of full band on the chorus figure before the first sung word. Ends
      on a held chord with the four voices still on it.
    exclude: synthesizers, keyboards, acoustic guitar, orchestral strings, brass, stadium reverb, heavy vocal tuning, spoken-word or rapped sections, whispered vocals, dance and electronic production
    lyrics: |
      [Intro - 10 seconds, full band on the chorus figure, no vocal]

      [Verse 1]
      There is a page at the gate with everybody's name on it
      and the names are not in order of anything at all.
      Not who lifts most, not who has been here longest,
      just the crew that showed, in the order that we walked in.
      Same page as the hold, same page as the cargo,
      which is the only sensible way anybody has ever run a dock.

      [Chorus - two band voices in unison under the lead]
      Count me on the manifest (count me on it)
      same line, same ink, same page as the rest.
      I do not want my name up higher than the others,
      I want it in the middle where it can be read.

      [Verse 2]
      Dessa found a manifest with half the night crew missing,
      four names on the loading line and one name on the pay.
      She took it back across the yard and waited at the window
      until the clerk found ink enough to put the others in.
      He said somebody has to stand first on every page.
      She said not tonight, and stood there until he changed it.

      [Chorus - two band voices in unison under the lead]
      Count me on the manifest (count me on it)
      same line, same ink, same page as the rest.
      I do not want my name up higher than the others,
      I want it in the middle where it can be read.

      [Bridge]
      Somebody will always want a face on the front of it.
      Somebody will always want one throat to blame.
      Put the whole crew on it or leave the whole thing off,
      and we will find another room and another door.

      [Verse 3]
      We have seen a foreman's name above a page of other people
      as if his hands had lifted every case and tied every sheet.
      Put Orl beside Teff, put Dessa beside Wen,
      and leave enough line for whoever takes the next shift after us.

      [Final Chorus - all four in unison, no lead vocal above them]
      Count me on the manifest,
      same line, same ink, same page as the rest.
      I do not want my name up higher than the others,
      I want it in the middle where it can be read.
      Where anybody standing at the gate can read it.

      [Outro - held chord, four voices still on it]
