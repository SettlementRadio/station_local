    lyrics: |
      [Intro - 18 seconds, bass and one guitar, drums entering late, no vocal]

      [Verse 1]
      Two in the morning and the van smells like the shed does,
      four coats, four bags, one window that will not shut.
      Nobody says anything for the first ten minutes,
      which is not a bad silence, it is just the shape we are in.
      The hold went out at midnight and the manifest is signed
      and there is nothing left in any of us to give anybody.

      [Verse 2]
      Orl goes first. He always goes first. Head against the strut,
      out before the gate is even properly behind us.
      Then Dessa, halfway up the coast road, mid-sentence,
      and Teff hangs on to about the second bridge out of pride.

      [Chorus - two backing voices in unison under the lead]
      Sleep. There is nothing to do until the yard.
      Sleep. I have got the road and the road is straight.
      I will wake you at the gate and not one minute sooner.
      Everything you were worried about will still be there.

      [Verse 3]
      Past the second bridge Teff gives the window one last pull,
      misses the catch, says leave it, and folds into his coat.
      Three breathing rhythms settle underneath the road noise,
      each one arriving separately and somehow making one quiet.

      [Chorus - one backing voice left]
      Sleep. There is nothing to do until the yard.
      Sleep. I have got the road and the road is straight.
      I will wake you at the gate and not one minute sooner.
      Everything you were worried about will still be there.

      [Bridge]
      Somebody has to stay awake and drive it.
      Some nights it is me and some nights it is not,
      and the ones where it is not are the best hours of the week.

      [Chorus - lead voice alone]
      Sleep. There is nothing to do until the yard.
      Sleep. I have got the road and the road is straight.
      I will wake you at the gate and not one minute sooner,
      and the settlement will be exactly where we left it.

      [Outro - fade on the lead voice alone]
