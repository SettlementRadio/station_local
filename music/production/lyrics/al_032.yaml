    lyrics: |
      [Intro - 15 seconds, one guitar and the open shed door, no vocal]

      [Verse 1]
      It comes off the water about an hour before it arrives,
      you can hear it in the fittings before you can feel it on your face.
      Everybody on the dock knows the sound and nobody names it,
      you just start moving faster and stop finishing your sentences.

      [Verse 2 - real wind audible beneath the band]
      We left the door open on the second night to get the air in
      and the whole of the storm coast came through it sideways.
      The loading sheets climbed the wall and every fitting answered.
      Nobody closed it. We needed to know what was coming.

      [Chorus]
      There is weather out at the gate and weather in the room,
      and only one of them is going to blow over.
      Get the load on, get the door down, get the crew inside,
      and after that you can worry about the rest of it.

      [Verse 3]
      Dessa lost a roof in the sealed season when she was small
      and does not talk about it and does not have to.
      She just gets very quiet and very fast at the same time
      and everybody on the floor moves the way she moves.

      [Chorus]
      There is weather out at the gate and weather in the room,
      and only one of them is going to blow over.
      Get the load on, get the door down, get the crew inside,
      and after that you can worry about the rest of it.

      [Bridge]
      It is not the storm season yet. That is what makes it bad.
      Nobody has the boards up. Nobody has been told.
      An hour of warning is a whole hour, if you use it.

      [Final Chorus - all four, shouted, everything at once]
      There is weather out at the gate and weather in the room,
      and only one of them is going to blow over.
      Get the load on, get the door down, get the crew inside.
      We are all inside. Let it come.

      [Outro - fade at full volume]
