    lyrics: |
      [Intro - 12 seconds, loose metal ringing and one guitar, no vocal]

      [Verse 1]
      Every shed on this coast makes a noise you learn to hate,
      panels going in the wind, fittings arguing with the frame,
      a bulkhead somewhere down the row with a note of its own,
      and for eleven nights we fought it and lost every time,
      because you cannot play louder than a building.

      [Chorus]
      Everything rattles. Everything rattles.
      Let it. Let the whole shed come in on the chorus.
      We are not going to win against four hundred loose fixings,
      so we are going to sing the note the fixings are already on.

      [Verse 2]
      Brin came down on the ninth night with a bag and a spanner
      and went round the walls for two hours tapping every seam,
      and when he had finished the room answered the key of the song
      and none of us knew that was a thing a person could do.
      He does it in every hold and every bay he works in,
      and he will not call a room ready until the bad notes are gone.

      [Chorus]
      Everything rattles. Everything rattles.
      Let it. Let the whole shed come in on the chorus.
      We are not going to win against four hundred loose fixings,
      so we are going to sing the note the fixings are already on.

      [Instrumental - lead guitar break over the ringing panels, band out, 16 seconds]

      [Verse 3]
      By the end of eleven nights we knew what could stay loose:
      not the straps, not the corners, not the load behind the door,
      but the shed could keep its voice if Brin could find the note,
      and four tired people could stop fighting where they worked
      long enough to let the whole loud building answer back.

      [Final Chorus - all four, shouted, the building ringing with them]
      Everything rattles. Everything rattles.
      Let it. Let the whole shed come in on the chorus.
      We are not going to win against four hundred loose fixings.
