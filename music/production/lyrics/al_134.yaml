    lyrics: |
      [Intro - 10 seconds, fiddle and guitars, no vocal]

      [Verse 1]
      There is a fast circuit and there is a faster one
      and the co-operative runs both of them and we are on the second,
      and the reason we are on it is that nobody else wanted it
      and the reason nobody wanted it is that it is nine ports in eleven days
      with a hold coming off behind you at every one of them.

      [Chorus]
      Out ahead of the freight and ahead of the manifest,
      into a hall with the cargo still coming off behind us.
      Nobody on this circuit has ever waited for anything
      and none of us can sit down in a room any more.

      [Verse 2]
      I wrote the line for this about halfway up the neck
      and she came in and played it a whole octave above,
      which put it over the top of the guitars instead of in them,
      and I said keep it, which I have never said to anybody,
      and she said she had assumed I meant it that way,
      and I did not correct her, and I am not going to.

      [Instrumental - lead guitar break with the fiddle over it, 16 seconds]

      [Chorus]
      Out ahead of the freight and ahead of the manifest,
      into a hall with the cargo still coming off behind us.
      Nobody on this circuit has ever waited for anything
      and none of us can sit down in a room any more.

      [Verse 3]
      Wyll says it will end and that everybody comes off it
      at about year fifteen and takes a route with towns on it,
      and I have watched two crews do exactly that and be happy
      and I am not going to and I have known that for a while.

      [Final Chorus - the whole band shouting]
      Out ahead of the freight and ahead of the manifest,
      and one day the circuit will change and we will not be on it
      and I will be in a hall somewhere with a slow set list
      and that is somebody else's song and not this one.

      [Outro - fade on the fiddle]
