  room: >-
    Five halls at five ports, none held longer than a turnaround. The narrow first hall gives s_1096
    a short alloy crack; the wide freight hall on s_1097 and s_1098 throws the new amplification back
    at the band; the low dead room on s_1099 swallows everything after each stop; the high empty hall
    on s_1100 leaves the drumless guitars and keyboard exposed; and the long final hall carries
    s_1101's fiddle and s_1102's answering voices to the far door. No arrangement is carried to a
    second port. The title track was first played at night and recorded the following morning in the
    same hall. Cass Verrow's badly set break on s_1097 was captured as the rig's first test before the
    full-band take and kept inside it. Three credited absences are explicit: Iber Tance and the
    keyboard are absent from s_1099 and s_1101, while Wyll Petrin and the drums are absent from
    s_1100. Nessa Dray's guest fiddle on s_1101 plays the written line an octave up, the only change
    to one of her own songs Rhea Molt has accepted; the instrumental break remains the lead guitar's.

