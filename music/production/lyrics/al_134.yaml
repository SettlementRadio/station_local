      and I have not managed to say anything back once.

      [Bridge]
      They read everything. They have read every page we have signed.
      Twice they have stopped us signing something and both times they were right.

      [Final Chorus - the two answering voices alone, lead out]
      Sign it on the way out. Do not read it to me.
      There is a berth at six and a hall at eight
      and four people at a counter who have read the whole thing
      and will still be there in the spring when we get back.

      [Outro - held chord, the answering voices on it]
