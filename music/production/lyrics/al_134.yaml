  - id: s_1097
    title: Three Ballots for a Speaker
    track_number: 2
    mood: [wry, rowdy, brisk]
    fact: >-
      The co-operative voted three times before it would pay for the band's amplification, and Cass
      Verrow's solo here is the first thing they ever played through it.
    arrangement_note: the eighteen-second break is the first sound the band ever put through the rig they had to win three votes for, and it is louder and dirtier than anything around it because nobody had worked out how to set it yet
    intro: 8
    outro: fade
    target_duration: "4:10"
    prompt: >-
      Fast boogie rock at the hard-rock edge, 148 BPM, wry and rowdy, brisk, amplified and loud.
      Female lead vocal, bright hard mezzo, fast and clipped, singing ahead of the beat and cutting
      every line end short, no vibrato. Two blunt male voices answer "ask again" and "eleven words"
      in the choruses, never harmony; the five-person band shouts the last chorus. Two electric
      guitars, electric bass, struck-alloy drum kit, compact electric organ-toned keyboard punching
      short chords high beside the guitars. Wide freight hall with a hard return from the new rig,
      tracked quickly, first-take feel, very little overdub. The eighteen-second lead-guitar break is
      the rig's captured setup test, made before the full-band take and retained inside it: a sudden
      jump in level, dirty input, badly set, physically startling, never corrected. Eight seconds of
      bass, drums and clipped keyboard before the first sung word. Fade after the full-band shout.
    exclude: acoustic instruments, orchestral strings, brass, ballad tempos, stacked harmony, close studio harmony, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 8 seconds, bass, drums and clipped keyboard, no vocal]

      [Verse 1]
      First vote: thirty hands against us.
      I understood every one of them.
      A second van carries freight. A speaker carries noise.
      One has a rate. One has a promise.
      Tem sat at the back with his figures folded.
      When the chair called finished, he stood anyway.

      [Chorus - two men answer "ask again" after line 2 and "eleven words" after line 5]
      Same room. Same question. Same row of hands.
      Stand up, Tem. Ask it again.
      He hates the front. He hates a speech.
      He knows every number on the page.
      Third night. No spare words.
      Say what it costs. Then sit down.

      [Verse 2]
      Second vote: four hands short.
      We had carried the figures through nine kitchens,
      over cold food, past sleeping children,
      to a clerk with flour still on both wrists.
      Four freight crew were out on the lane.
      They came home with somebody else's version.
      Tem unfolded the page and started a third list.

      [Chorus - same two blunt answers]
      Same room. Same question. Same row of hands.
      Stand up, Tem. Ask it again.
      He hates the front. He hates a speech.
      He knows every number on the page.
      Third night. No spare words.
      Say what it costs. Then sit down.

      [Verse 3]
      Third vote: Tem used eleven words.
      No story. No kitchens. No second van.
      Price of the rig. Number of halls. Five names.
      He put the page down before the count began.
      The four missing hands came up first.
      Then six more. Then the chair stopped counting.

      [Instrumental - Cass's lead-guitar break, 18 seconds, the badly set rig test]

      [Bridge]
      Cass pulled both hands off the strings.
      The first note bent the paper cups at the back.
      Nobody asked for less.
      Tem said: put that one on the record.

      [Final Chorus - the whole band shouting]
      Same room. Third question. Every hand counted.
      Stand up, Tem. Never mind. Sit down.
      The membership is never wrong for free.
      Every one of them has to live with the noise.
      Every one of them came on the third night.
      Every one of them heard what they bought.

      [Outro - fade]
