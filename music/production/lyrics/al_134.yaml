    lyrics: |
      [Intro - 8 seconds, full band, no vocal]

      [Verse 1]
      First one went down by about thirty and I understood it.
      It is a lot of money and there are people on this membership
      who have been asking for a second van since 2611
      and a van is a thing that carries something and a rig is not.
      Half that membership is a freight crew and the other half is clerks
      and not one of them has ever stood at the back of a hall.

      [Chorus]
      Three times. Three separate evenings. Three shows of hands.
      Somebody had to stand up at the front and ask again
      and it was Tem, all three times, and he is not a talker,
      and the third time he did it in about eleven words.

      [Verse 2]
      Second one lost by four and that one I did not understand,
      because between the first and the second we had done the numbers
      and taken them round and sat in nine people's kitchens
      and the four who moved were four we had not got to,
      because they were out on a lane for the whole of that fortnight
      and came back the day before and voted on what they had heard.

      [Instrumental - lead guitar break, 18 seconds, badly set and left]

      [Chorus]
      Three times. Three separate evenings. Three shows of hands.
      Somebody had to stand up at the front and ask again
      and it was Tem, all three times, and he is not a talker,
      and the third time he did it in about eleven words.

      [Verse 3]
      That solo is the first thing that ever went through it
      and it is far too loud and nobody knew how to set it
      and Cass came off it looking like a man who had been hit
      and we kept it exactly as it came out of the room.

      [Final Chorus - the whole band shouting]
      Three times. Three separate evenings. Three shows of hands,
      and a membership that has never once been wrong for free,
      and every one of them has to live with what it costs
      and every one of them turned up on the third night.

      [Outro - fade]
