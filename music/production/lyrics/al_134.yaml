  - id: s_1100
    title: Berth Nineteen
    track_number: 5
    mood: [tender, plain, slow]
    fact: >-
      Rhea Molt sings it to a partner who works the opposite circuit, and the two of them have been in
      the same port eleven times.
    arrangement_note: Wyll is absent and there are no drums, so the band's slowest tempo is held by clipped guitars and bass under one continuous keyboard chord; Rhea lets the line ends ring and the two men answer only "not nothing"
    intro: 18
    outro: fade
    target_duration: "4:35"
    prompt: >-
      Fast boogie rock at the hard-rock edge, 132 BPM — the bottom of this band's range and still
      quick — tender and plain while the pulse stays insistent. Female lead vocal, bright hard mezzo,
      slightly ahead of the beat, but here letting line endings ring instead of cutting them short;
      no vibrato. Two blunt male voices answer only "not nothing" at the end of each chorus, never
      harmony. Wyll Petrin is absent: no drums and no struck alloy. Two clipped electric guitars and
      electric bass maintain the 132 BPM pulse while a compact electric organ-toned keyboard holds
      one long chord underneath, changing only between sections. Tracked in a high empty hall where
      every exposed pick and breath carries, very little overdub. Eighteen seconds of keyboard, then
      bass, then both guitars before the first word. Long patient fade.
    exclude: drums, percussion, struck alloy, acoustic instruments, orchestral strings, brass, ballad tempos, slow or half-time playing, stacked harmony, close studio harmony, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 18 seconds, keyboard, then bass, then both guitars, no vocal]

      [Verse 1]
      Your message was waiting at the second gate.
      Opposite circuit. Early arrival. Nine hours clear.
      I read it twice beside the manifest window.
      Cass asked whether somebody had died.
      I said no. Somebody had landed.
      Then I walked the wrong way toward the hall.

      [Chorus - two men answer "not nothing" after line 4]
      Nineteen, at the far rail, past the second gate.
      You have six hours. I have nine.
      No promises larger than the morning.
      Eleven times is not nothing.
      Put your coat beside mine on the barrier.
      We can be two people until the first call.

      [Verse 2]
      Once you brought two cups and dropped one at the gate.
      Once the sealed-season alarm kept us on opposite sides.
      Once we had forty minutes and spent thirty arguing.
      Last time your sleeve was torn at the shoulder.
      I meant to mend it. The departure sounded.
      I remember the tear better than what we said.

      [Chorus - same single blunt answer]
      Nineteen, at the far rail, past the second gate.
      You have six hours. I have nine.
      No promises larger than the morning.
      Eleven times is not nothing.
      Put your coat beside mine on the barrier.
      We can be two people until the first call.

      [Verse 3]
      At half past five you come under the port light,
      walking fast because both of us always walk fast.
      You have grease across one cuff and no bag.
      I have four cases somebody else is watching.
      Neither of us says this cannot keep working.
      Neither of us wastes the first minute.

      [Bridge]
      A whole life is not arriving later.
      A whole life is the part that arrives.

      [Final Chorus]
      Nineteen, at the far rail, past the second gate.
      Your call at midnight. My hall at eight.
      No promise except the coat on the barrier.
      Eleven times is not nothing.
      The twelfth is in spring if both lanes hold.
      I have not written it down. I know the way.

      [Outro - fade]
