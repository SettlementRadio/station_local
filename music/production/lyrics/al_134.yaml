    exclude: acoustic instruments, orchestral strings, brass, ballad tempos, stacked harmony, close studio harmony, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 4 seconds, struck alloy and one guitar, no vocal]

      [Verse 1]
      Berth at eleven, hall at eight, out again by four,
      and the walk between the two of them is about nine minutes
      and it is the only part of that whole port I have seen
      and I have been through it about forty times.

      [Chorus]
      One day in port and none of it is mine.
      Eight hours of it are the hall and six are asleep
      and the rest is a walk down a road I could draw from memory
      and have never once turned left on to see what is there.

      [Verse 2]
      I wrote this on that nine minutes and I did not write it down,
      because I do not write anything down and never have,
      and I sang it at the four of them at about a quarter to eight
      and we played it at nine and none of them had heard it.

      [Chorus]
      One day in port and none of it is mine.
      Eight hours of it are the hall and six are asleep
      and the rest is a walk down a road I could draw from memory
      and have never once turned left on to see what is there.

      [Verse 3]
      Iber is a fraction behind the guitars the whole way through
      because he is listening for what comes next like the rest of them
      and you can hear five people finding out what a song is
      in front of about two hundred who think it is an old one.

      [Bridge]
      We did it again the next morning and that is the take.
      It is worse than the night before and it is the honest one.

      [Final Chorus - the whole band shouting]
      One day in port and none of it is mine,
      and there is a departure at four and a lane after that
      and a settlement somewhere at the end of the week
      that will get exactly the same nine minutes out of me.

      [Outro - cold stop]
