  - id: s_1101
    title: Faster Than the Freight
    track_number: 6
    mood: [triumphant, driving, fast]
    fact: >-
      Nessa Dray played the fiddle line an octave above where it was written, which Rhea Molt has said
      is the only change to one of her songs she has ever accepted.
    arrangement_note: a guest fiddle plays the written line an octave up so that it sits above the guitars instead of inside them, and the sixteen-second break is still the lead guitar's with the fiddle over the top of it
    intro: 10
    outro: fade
    target_duration: "4:20"
    prompt: >-
      Fast boogie rock at the hard-rock edge, 164 BPM, triumphant and driving, fast and amplified.
      Female lead vocal, bright hard mezzo, fast and clipped, singing ahead of the beat and cutting
      every line end short, no vibrato. Two blunt male voices answer "not yet" and "move" in the
      choruses, never harmony; the whole band joins only the last two lines of the final chorus.
      Iber Tance is absent: no keyboard. Nessa Dray's guest fiddle plays one octave above the written
      line, a thin hard lead above two electric guitars rather than inside them; electric bass and
      struck-alloy drum kit drive underneath. Tracked quickly in the long final cargo hall, where the
      fiddle reaches the far door and the guitars stay close and dry, first-take feel, very little
      overdub. A sixteen-second lead-guitar break remains clearly the break instrument, with the high
      fiddle sustaining and cutting across it rather than taking over. Ten-second intro: fiddle alone
      for six seconds, then both guitars join for four. Fade on the high fiddle.
    exclude: keyboards, organ, acoustic instruments other than the guest fiddle, orchestral strings, brass, ballad tempos, stacked harmony, close studio harmony, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 10 seconds, fiddle alone for 6, guitars joining for 4, no vocal]

      [Verse 1]
      Nine ports. Eleven days. Door still moving.
      Freight comes off while the guitars come in.
      Wyll builds the kit beside a working hold.
      Tem counts cases between the first two chords.
      Cass finds power at the back of the hall.
      I count the minutes nobody gave us.

      [Chorus - two men answer "not yet" after line 2 and "move" after line 5]
      Freight behind us. Fiddle overhead.
      Hall door open. Cargo not down yet.
      Manifest late. Departure on time.
      Nobody waits on the faster lane.
      If the room is ready, move.
      If it is not, move anyway.

      [Verse 2]
      Nessa looked once at the line Cass showed her.
      Then she put the bow a whole octave higher.
      I said that is not where any of it sits.
      She said it sits there now and played through me.
      I opened my mouth to put it back.
      The note crossed the hall before the word arrived.
      I said keep it. Nobody moved for a second.

