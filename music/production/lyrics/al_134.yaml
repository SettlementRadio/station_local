    lyrics: |
      [Intro - 14 seconds, keyboard and bass, no vocal]

      [Verse 1]
      Eleven times in twelve years and I have counted all eleven
      and could tell you the port and the month and what the weather did
      and which berth and which hall and what was said on two,
      and there is no version of this where that is a lot.

      [Verse 2]
      Your lane goes the other way round and that is the whole problem.
      It is not a disagreement and it is nobody's fault
      and there is no office anywhere I could go and shout at
      and I have thought about that a great deal and it does not help.

      [Chorus]
      Nineteen, at the far end of it, past the second gate.
      Nine hours if the turnaround holds and six if it does not.
      I have got a hall at eight and you are out at midnight
      and that is the whole of it and it is worth the run.

      [Verse 3]
      There is a woman on the near circuit who told me to stop
      and she was being kind and she has been in this before
      and she said eleven times in twelve years is not a life,
      and I said no, it is eleven times, and that is not nothing.

      [Chorus]
      Nineteen, at the far end of it, past the second gate.
      Nine hours if the turnaround holds and six if it does not.
      I have got a hall at eight and you are out at midnight
      and that is the whole of it and it is worth the run.

      [Bridge]
      Twelfth one is in the spring if neither circuit changes.
      I have not written it down. I have not needed to.

      [Final Chorus]
      Nineteen, at the far end of it, past the second gate,
      and I will be walking down it about half past five
      with a hall at eight and nothing to say for myself,
      and you will be there, and that is the whole of the plan.

      [Outro - fade]
