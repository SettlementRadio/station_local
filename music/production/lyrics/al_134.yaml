      [Verse 2]
      It is not disrespect. It is nine years of the same exchange.
      They want it read and I want it signed and both of us are right
      and neither of us has moved a single step since 2610
      and the whole thing takes about four minutes every time.

      [Chorus]
      Sign it on the way out. Do not read it to me.
      I have got a berth at six and a hall at eight
