songs:
  - id: s_1096
    title: One Day in Port
    track_number: 1
    mood: [driving, restless, fast]
    fact: >-
      Rhea Molt wrote it walking from the berth to the hall and the band played it that night without
      anyone else having heard it; the take on the record is from the following morning.
    arrangement_note: the band had heard this once when they recorded it, so nothing is worked out, the keyboard follows the guitars a fraction late all the way through and nobody fixed it
    intro: 4
    outro: cold
    target_duration: "3:55"
    prompt: >-
      Fast boogie rock at the hard-rock edge, 160 BPM, driving and restless, amplified and loud.
      Female lead vocal, bright hard mezzo, fast and clipped, singing ahead of the beat and cutting
      every line end short, no vibrato. Two blunt male voices answer only "none of it" and "keep
      moving" in the choruses, never harmony; the whole five-person band shouts the final chorus.
      Two electric guitars, electric bass, drum kit with a short struck-alloy crack, compact electric
      organ-toned keyboard high beside the guitars but following every change a fraction late. The
      band learned the song in front of an audience the night before and records it the following
      morning without settling the joins. Tracked in a narrow hall beside the berth, hard dry walls,
      first-take uncertainty, very little overdub. Four seconds of struck alloy and one guitar before
      the first sung word. Cold stop.
    exclude: acoustic instruments, orchestral strings, brass, ballad tempos, stacked harmony, close studio harmony, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 4 seconds, struck alloy and one guitar, no vocal]

      [Verse 1]
      Berth eleven. Hall eight. Departure at four.
      Nine minutes from the ramp to the loading arch.
      Food stall shut. Blue gate. Two broken lamps.
      A left turn after the manifest office.
      I know the sign above it. I know the paint.
      I have never taken it. Not once. Not yet.

      [Chorus - two men answer "none of it" after line 1 and "keep moving" after line 4]
      One day in port and none of it is mine.
      One straight road and a borrowed night.
      Hall lights ahead. Hauler behind.
      Nine minutes clear. Keep moving.
      I can draw every door with my eyes shut
      and cannot tell you what is round the corner.

      [Verse 2]
      The first line came between the gate and the food stall.
      The second landed under the loading arch.
      I kept both by saying them against my steps.
      No page. No list. No room to lose one.
      Cass heard them at the side door and found a chord.
      Tem found the bottom. Wyll counted. Iber came late.

      [Verse 3]
      Last night the first turn nearly lost all five of us.
      Iber watched Cass and arrived one beat after.
      Wyll hit the stop while Tem kept going.
      Two hundred people shouted as if we meant it.
      This morning the floor is empty and we still do not.
      The late chord stays. The wrong stop stays too.

      [Chorus - same two blunt answers]
      One day in port and none of it is mine.
      One straight road and a borrowed night.
      Hall lights ahead. Hauler behind.
      Nine minutes clear. Keep moving.
      I can draw every door with my eyes shut
      and cannot tell you what is round the corner.

      [Bridge]
      If I turn left, I miss the hall.
      If I never turn, I keep the song.

      [Final Chorus - the whole band shouting]
      One day in port. None of it is mine.
      One straight road and a departure time.
      Gate at three. Hauler at four.
      Lane all week. Keep moving.
      Another settlement, another borrowed night,
      another left turn I will know and never take.

      [Outro - cold stop]
    take: null                    # M-31 fills this in at the Suno sitting

  - id: s_1097
    title: Three Ballots for a Speaker
    track_number: 2
    mood: [wry, rowdy, brisk]
    fact: >-
      The co-operative voted three times before it would pay for the band's amplification, and Cass
      Verrow's solo here is the first thing they ever played through it.
    arrangement_note: the eighteen-second break is the first sound the band ever put through the rig they had to win three votes for, and it is louder and dirtier than anything around it because nobody had worked out how to set it yet
    intro: 8
    outro: fade
    target_duration: "4:10"
    prompt: >-
      Fast boogie rock at the hard-rock edge, 148 BPM, wry and rowdy, brisk, amplified and loud.
      Female lead vocal, bright hard mezzo, fast and clipped, singing ahead of the beat and cutting
      every line end short, no vibrato. Two blunt male voices answer "ask again" and "eleven words"
      in the choruses, never harmony; the five-person band shouts the last chorus. Two electric
      guitars, electric bass, struck-alloy drum kit, compact electric organ-toned keyboard punching
      short chords high beside the guitars. Wide freight hall with a hard return from the new rig,
      tracked quickly, first-take feel, very little overdub. The eighteen-second lead-guitar break is
      the rig's captured setup test, made before the full-band take and retained inside it: a sudden
      jump in level, dirty input, badly set, physically startling, never corrected. Eight seconds of
      bass, drums and clipped keyboard before the first sung word. Fade after the full-band shout.
    exclude: acoustic instruments, orchestral strings, brass, ballad tempos, stacked harmony, close studio harmony, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 8 seconds, bass, drums and clipped keyboard, no vocal]

      [Verse 1]
      First vote: thirty hands against us.
      I understood every one of them.
      A second van carries freight. A speaker carries noise.
      One has a rate. One has a promise.
      Tem sat at the back with his figures folded.
      When the chair called finished, he stood anyway.

      [Chorus - two men answer "ask again" after line 2 and "eleven words" after line 5]
      Same room. Same question. Same row of hands.
      Stand up, Tem. Ask it again.
      He hates the front. He hates a speech.
      He knows every number on the page.
      Third night. No spare words.
      Say what it costs. Then sit down.

      [Verse 2]
      Second vote: four hands short.
      We had carried the figures through nine kitchens,
      over cold food, past sleeping children,
      to a clerk with flour still on both wrists.
      Four freight crew were out on the lane.
      They came home with somebody else's version.
      Tem unfolded the page and started a third list.

      [Chorus - same two blunt answers]
      Same room. Same question. Same row of hands.
      Stand up, Tem. Ask it again.
      He hates the front. He hates a speech.
      He knows every number on the page.
      Third night. No spare words.
      Say what it costs. Then sit down.

      [Verse 3]
      Third vote: Tem used eleven words.
      No story. No kitchens. No second van.
      Price of the rig. Number of halls. Five names.
      He put the page down before the count began.
      The four missing hands came up first.
      Then six more. Then the chair stopped counting.

      [Instrumental - Cass's lead-guitar break, 18 seconds, the badly set rig test]

      [Bridge]
      Cass pulled both hands off the strings.
      Tem said: put that one on the record.

      [Final Chorus - the whole band shouting]
      Same room. Third question. Every hand counted.
      Stand up, Tem. Never mind. Sit down.
      The membership is never wrong for free.
      Every one of them has to live with the noise.
      Every one of them came on the third night.
      Every one of them heard what they bought.

      [Outro - fade]
    take: null                    # M-31 fills this in at the Suno sitting

  - id: s_1098
    title: Paid by the Record
    track_number: 3
    mood: [bitter, hard, fast]
    fact: >-
      Tem Osgar wrote it the evening the membership voted down the band's request to be paid by the
      port instead.
    arrangement_note: the bass chair wrote this and the bass is mixed forward for the whole song, and the two answering voices come in on every line of the chorus rather than on short phrases, which happens nowhere else on the record
    intro: 5
    outro: sustain
    target_duration: "4:15"
    prompt: >-
      Fast boogie rock at the hard-rock edge, 156 BPM, bitter and hard, fast, amplified and loud.
      Female lead vocal, bright hard mezzo, fast and clipped, singing ahead of the beat and cutting
      every line end short, no vibrato. Two blunt male voices give the exact parenthetical response
      after every chorus line, never harmony. Tem Osgar's electric bass is the lead instrument: dry,
      forward and loud, pushing against two clipped electric guitars, struck-alloy drums and compact
      electric organ-toned keyboard on short off-beat chords. Tracked quickly in the wide freight
