    lyrics: |
      [Intro - 16 seconds, keyboard and guitars, no vocal]

      [Verse 1]
      There are four clerks at the co-operative and all four of them
      have been there longer than this band has existed
      and they have a window and a counter and a manifest book each
      and every single thing any of us does goes past one of them.

      [Chorus]
      Sign it on the way out. Do not read it to me.
      I have got a berth at six and a hall at eight
      and whatever is wrong with it will still be wrong on Thursday
      and you will still be here and so, unfortunately, will I.

      [Verse 2]
      It is not disrespect. It is nine years of the same exchange.
      They want it read and I want it signed and both of us are right
      and neither of us has moved a single step since 2610
      and the whole thing takes about four minutes every time.

      [Chorus]
      Sign it on the way out. Do not read it to me.
      I have got a berth at six and a hall at eight
      and whatever is wrong with it will still be wrong on Thursday
      and you will still be here and so, unfortunately, will I.

      [Verse 3]
      At the annual meeting the four of them sing it at us,
      all four, in the doorway, badly, as we come in,
      and have done every year since the record came out
      and I have not managed to say anything back once.

      [Bridge]
      They read everything. They have read every page we have signed.
      Twice they have stopped us signing something and both times they were right.

      [Final Chorus - the two answering voices alone, lead out]
      Sign it on the way out. Do not read it to me.
      There is a berth at six and a hall at eight
      and four people at a counter who have read the whole thing
      and will still be there in the spring when we get back.

      [Outro - held chord, the answering voices on it]
