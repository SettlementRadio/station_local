      [Verse 1]
      Everybody else on this circuit travels like a settlement moving.
      Cass has three cases and a bag for the bag he keeps the leads in.
      Iber brings a thing to sit on, which I have stopped asking about.
      And then there is Wyll, who has one bag, and has always had one bag.

      [Chorus]
      Nothing to unpack. Nothing to leave behind.
      Off the hauler, into the hall, out again at four,
      and the only person on this crew who is never looking for anything
      is the one who decided years ago not to own it.

      [Verse 2 - one item a bar, the band stopping dead after each]
      Two shirts. One coat. A tin with something in it.
      Sticks. Spare sticks. A second pair of spare sticks.
      A photograph he has never once shown anybody.
      And a spanner, which is not for the kit, and he will not say what it is for.

      [Chorus]
      Nothing to unpack. Nothing to leave behind.
      Off the hauler, into the hall, out again at four,
      and the only person on this crew who is never looking for anything
      is the one who decided years ago not to own it.

      [Verse 3]
      I asked him about it once on a nine-hour lane in the dark
      and he said that a thing you carry is a thing you think about
      and he would rather think about the second half of a set,
      and then he went to sleep, which I think was the rest of the answer.

      [Verse 4]
      He has left one bag at one berth in twelve years,
      and it came back down the relay road eleven days later, unopened,
      and he took it off the clerk and said thanks and put it down
      and did not check it, in front of all four of us, on purpose.

      [Final Chorus - the whole band shouting]
      Nothing to unpack. Nothing to leave behind,
      and I have four cases in a hall about nine ports back
      that somebody is going to have to send on after me,
      and he is asleep, and he is right, and I hate it.

      [Outro - fade]
