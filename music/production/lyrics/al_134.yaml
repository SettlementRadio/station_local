      [Verse 1]
      There are four clerks at the co-operative and all four of them
      have been there longer than this band has existed
      and they have a window and a counter and a manifest book each
      and every single thing any of us does goes past one of them.

      [Chorus]
      Sign it on the way out. Do not read it to me.
      I have got a berth at six and a hall at eight
      and whatever is wrong with it will still be wrong on Thursday
