      [Intro - 16 seconds, keyboard stamps, struck alloy and guitars, no vocal]

      [Verse 1]
      Four clerks. Four windows. Four manifest books.
      The first one reads aloud with one finger on the line.
      The second will not stamp a page with an empty box.
      The third knows every berth before the board changes.
      The fourth says good morning at any hour.
      Every road this band takes passes that counter.

      [Chorus - Rhea leads; two men answer "read it" after line 1 and "four minutes" after line 4]
      Sign it on the way out. Do not read it to me.
      Berth at six. Hall at eight. Gate closing.
      Whatever is wrong will still be wrong on Thursday.
      Put the mark here. Give me four minutes back.
      You will be here when the next run lands.
      So will I. That is the difficult part.

      [Verse 2]
      Window two stopped my hand over a cargo figure.
      I said the hold was closed and the hauler was waiting.
      She turned the manifest round without raising her voice.
      One digit put our fee on somebody else's run.
      I had signed halfway through my own name.
      She crossed it clean and made me start again.

      [Chorus - same lead and two short answers]
      Sign it on the way out. Do not read it to me.
      Berth at six. Hall at eight. Gate closing.
      Whatever is wrong will still be wrong on Thursday.
      Put the mark here. Give me four minutes back.
      You will be here when the next run lands.
      So will I. That is the difficult part.

      [Verse 3]
      At the spring meeting they stood across the doorway.
      Four clerks with no books and nothing to stamp.
      The first one gave a count. The others came in.
      They sang our own words back before we sat down.
      Every line landed slower and clearer than mine.
      Ninety members watched me fail to answer.

      [Bridge]
      They read every page. We skip every line.
      Twice they stopped us. Twice they were right.

      [Final Chorus - two male voices as the four clerks, Rhea completely absent]
      Sign it on the way out. We already read it.
      Your berth is six. Your hall is eight. We know.
      It will still be wrong on Thursday if we sign it wrong now.
      Take the four minutes. Read the cargo line.
      We will be here when your next run lands.
      So will you. That is the useful part.

      [Outro - held chord, the answering voices on it]
