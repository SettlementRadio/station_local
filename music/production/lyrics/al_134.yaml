  - id: s_1099
    title: Nothing to Unpack
    track_number: 4
    mood: [comic, loud, fast]
    fact: >-
      Wyll Petrin has never carried more than one bag on a circuit, and the second verse is a list of
      what is in it.
    arrangement_note: the list in the second verse is sung at the top of the tempo with one item to a bar and the band stopping dead after each one, which is the only silence anywhere on the track
    intro: 3
    outro: cold
    target_duration: "3:50"
    prompt: >-
      Fast boogie rock at the hard-rock edge, 172 BPM, comic and loud, very fast and amplified.
      Female lead vocal, bright hard mezzo, fast and clipped, singing ahead of the beat and cutting
      every line end short, no vibrato. Two blunt male voices answer "nothing" and "leave it" on the
      choruses, never harmony; all four players present shout the final one. Two electric guitars,
      electric bass and struck-alloy drum kit, no keyboard. Tracked in a low dead hall that swallows
      every decay, fast and dry, first-take feel, very little overdub. The second verse is eight
      objects at one object per bar; after every object the entire band stops dead, then restarts at
      full speed, with no other silence anywhere. Three seconds of drums before the first sung word.
      Final line ends in a hard collective stop, no fade.
    exclude: acoustic instruments, keyboards, organ, orchestral strings, brass, ballad tempos, stacked harmony, close studio harmony, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 3 seconds, drums, no vocal]

      [Verse 1]
      Cass has three cases and one case for leads.
      Tem has a crate of pages nobody asked him to bring.
      I have four bags and know what is in two.
      We unload like a settlement changing address.
      Wyll steps off the hauler with one hand free.
      One bag. Same bag. Twelve years. No search.

      [Chorus - two men answer "nothing" after line 1 and "leave it" after line 4]
      Nothing to unpack. Nothing to leave behind.
      One bag through the gate. One bag by the kit.
      Hall at nine. Back on the hauler at four.
      If it does not fit, leave it.
      Wyll is ready while the rest of us count cases
      and accuse the port of moving them.

      [Verse 2 - one item a bar, the band stopping dead after each]
      Two shirts.
      One coat.
      A sealed tin.
      Drumsticks.
      Spare drumsticks.
      A photograph turned inward.
      One small spanner.
      Nothing else.

      [Chorus - same two blunt answers]
      Nothing to unpack. Nothing to leave behind.
      One bag through the gate. One bag by the kit.
      Hall at nine. Back on the hauler at four.
      If it does not fit, leave it.
      Wyll is ready while the rest of us count cases
      and accuse the port of moving them.

      [Verse 3]
      On a nine-hour lane I asked about the photograph.
      He said a thing you carry is a thing you think about.
      I said that sounded like a reason to show it.
      He said it sounded like a reason not to.
      Then he put the bag under his head,
      shut his eyes and finished the conversation.

      [Verse 4]
      Once he left it at a berth behind us.
      Eleven days later it came down the relay road,
      unopened, with three clerk marks on the handle.
      Wyll said thanks and put it beside the kit.
      Four of us stood waiting for him to check.
      He counted us instead and walked into the hall.

      [Final Chorus - the whole band shouting]
      Nothing to unpack. Nothing to leave behind,
      one bag through the gate and nothing missing.
      I have four cases in a hall nine ports back.
      Somebody will put them on the next manifest.
      Wyll is asleep. Wyll is right.
      I hate it.

      [Outro - hard collective stop]
