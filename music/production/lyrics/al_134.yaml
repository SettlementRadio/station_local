      [Verse 1]
      A record is a thing that happens once and then keeps going
      and a port is a thing that happens and then it is gone,
      and we play about ninety ports a year on this circuit
      and we have made two records in twelve and a half years.

      [Pre-Chorus]
      One of those is in a crate somewhere and it is still earning.

      [Chorus]
      Pay us for the ports. Pay us for the nights.
      Not for a crate on a siding that somebody else moves.
      We are not a thing that gets pressed and put in a box.
      We are five people in a hall and it is Tuesday.

      [Verse 2]
      Tem did the arithmetic and took it to the meeting
      and it is not even close, it is not a marginal case,
      and it went down, and the reason it went down
      is that it is how the co-operative has always done it.

      [Chorus]
      Pay us for the ports. Pay us for the nights.
      Not for a crate on a siding that somebody else moves.
      We are not a thing that gets pressed and put in a box.
      We are five people in a hall and it is Tuesday.

      [Verse 3]
      He wrote this the same evening and he wrote it angry
      and it is the only angry thing this band has ever done
      and by the time we recorded it he had stopped being angry
      and I had started, which is roughly how the two of us work.

      [Bridge]
      They changed it five years later. That is on the next record.
      Nobody has ever said out loud that Tem was right.

      [Final Chorus - the whole band shouting]
      Pay us for the ports. Pay us for the nights.
      Ninety halls a year and a hold going out behind us
      and a membership of ninety who all voted about it,
      and we will be at the meeting in the spring.

