  room: >-
    Five halls at five ports, none of them for longer than a turnaround, which is the card's "tracked
    quickly in whatever hall the berth was next to" taken literally — nothing here was played twice
    and the room changes on almost every track. This is the first Turn and Burn record with
    amplification, which the co-operative voted on three times before it would pay for it, so the
    keyboard and the guitars are louder and harder here than anything the band had put out before,
    and s_1097's solo is the first thing that ever went through the rig. One fact-bound session
    exception is explicit: Nessa Dray's guest fiddle on s_1101, played an octave above where it was
    written, which is the only change to one of her own songs Rhea Molt has ever accepted. The break
    on that track is still the lead guitar's (§7).

