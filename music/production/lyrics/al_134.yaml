  - id: s_1098
    title: Paid by the Record
    track_number: 3
    mood: [bitter, hard, fast]
    fact: >-
      Tem Osgar wrote it the evening the membership voted down the band's request to be paid by the
      port instead.
    arrangement_note: the bass chair wrote this and the bass is mixed forward for the whole song, and the two answering voices come in on every line of the chorus rather than on short phrases, which happens nowhere else on the record
    intro: 5
    outro: sustain
    target_duration: "4:15"
    prompt: >-
      Fast boogie rock at the hard-rock edge, 156 BPM, bitter and hard, fast, amplified and loud.
      Female lead vocal, bright hard mezzo, fast and clipped, singing ahead of the beat and cutting
      every line end short, no vibrato. Two blunt male voices give the exact parenthetical response
      after every chorus line, never harmony; all five band members shout the final chorus while the
      two responses remain distinct. Tem Osgar's electric bass is the lead instrument: dry, forward
      and loud, pushing against two clipped electric guitars, struck-alloy drums and compact electric
      organ-toned keyboard on short off-beat chords. Tracked quickly in the wide freight hall, the new
      rig throwing the bass back from the rear wall, first-take feel, very little overdub. Five
      seconds of bass alone before struck alloy joins. Ends on a held bass note with the band striking
      one final chord around it.
    exclude: acoustic instruments, orchestral strings, brass, ballad tempos, stacked harmony, close studio harmony, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 5 seconds, bass first, struck alloy joining, no vocal]

      [Verse 1]
      Tem put ninety marks across one sheet.
      One for every port hall on the circuit.
      Then two marks underneath for two pressed records.
      He drew a line. Nobody needed the total.
      We came straight from unloading the hold,
      still wearing the dust that somebody else was paid for.

      [Pre-Chorus - bass and lead voice only]
      Ninety marks. Two crates. Five people still standing.

      [Chorus]
      Pay us for the ports. (pay the hands)
      Pay us for the nights. (pay the night)
      Not for a crate earning money on a siding. (not the crate)
      We are five people in a hall and it is Tuesday. (standing here)

      [Verse 2]
      The woman at the front said the pressing carries risk.
      Tem said the crew carries everything else.
      A man from a freight crew said changing one rate
      meant changing every rate, and he was right.
      Somebody asked who would count the nights.
      Five hands went up. None belonged to the office.

      [Chorus]
      Pay us for the ports. (pay the hands)
      Pay us for the nights. (pay the night)
      Not for a crate earning money on a siding. (not the crate)
      We are five people in a hall and it is Tuesday. (standing here)

      [Verse 3]
      The vote went down before the last ferry.
      Tem folded the figures once and put them away.
      At the berth he wrote four lines on the back,
      hard enough for the pen to cut the page.
      He handed them to me without saying sing this.
      I sang them before his hand left the paper.

      [Bridge]
      The page is closed. The rate is the rate.
      The spring meeting is already on the manifest.

      [Final Chorus - the whole band shouting]
      Pay the ports. (pay the hands)
      Pay the nights. (pay the night)
      Ninety halls and the same five names. (standing here)
      The hold goes out. We go to another berth. (not the crate)
      Keep the page. Keep the count.
      We will ask again in the spring.

      [Outro - held bass note, one band chord around it]
