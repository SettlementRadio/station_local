songs:
  - id: s_1096
    title: One Day in Port
    track_number: 1
    mood: [driving, restless, fast]
    fact: >-
      Rhea Molt wrote it walking from the berth to the hall and the band played it that night without
      anyone else having heard it; the take on the record is from the following morning.
    arrangement_note: the band had heard this once when they recorded it, so nothing is worked out, the keyboard follows the guitars a fraction late all the way through and nobody fixed it
    intro: 4
    outro: cold
    target_duration: "3:55"
    prompt: >-
      Fast boogie rock at the hard-rock edge, 160 BPM, driving and restless, amplified and loud.
      Female lead vocal, bright hard mezzo, fast and clipped, singing ahead of the beat and cutting
      every line end short, no vibrato. Two blunt male voices answer only "none of it" and "keep
      moving" in the choruses, never harmony; the whole five-person band shouts the final chorus.
      Two electric guitars, electric bass, drum kit with a short struck-alloy crack, compact electric
      organ-toned keyboard high beside the guitars but following every change a fraction late. The
      band learned the song in front of an audience the night before and records it the following
      morning without settling the joins. Tracked in a narrow hall beside the berth, hard dry walls,
      first-take uncertainty, very little overdub. Four seconds of struck alloy and one guitar before
      the first sung word. Cold stop.
    exclude: acoustic instruments, orchestral strings, brass, ballad tempos, stacked harmony, close studio harmony, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 4 seconds, struck alloy and one guitar, no vocal]

      [Verse 1]
      Berth eleven. Hall eight. Departure at four.
      Nine minutes from the ramp to the loading arch.
      Food stall shut. Blue gate. Two broken lamps.
      A left turn after the manifest office.
      I know the sign above it. I know the paint.
      I have never taken it. Not once. Not yet.

      [Chorus - two men answer "none of it" after line 1 and "keep moving" after line 4]
      One day in port and none of it is mine.
      One straight road and a borrowed night.
      Hall lights ahead. Hauler behind.
      Nine minutes clear. Keep moving.
      I can draw every door with my eyes shut
      and cannot tell you what is round the corner.

      [Verse 2]
      The first line came between the gate and the food stall.
      The second landed under the loading arch.
      I kept both by saying them against my steps.
      No page. No list. No room to lose one.
      Cass heard them at the side door and found a chord.
      Tem found the bottom. Wyll counted. Iber came late.

      [Verse 3]
      Last night the first turn nearly lost all five of us.
      Iber watched Cass and arrived one beat after.
      Wyll hit the stop while Tem kept going.
      Two hundred people shouted as if we meant it.
      This morning the floor is empty and we still do not.
      The late chord stays. The wrong stop stays too.

      [Chorus - same two blunt answers]
      One day in port and none of it is mine.
      One straight road and a borrowed night.
      Hall lights ahead. Hauler behind.
      Nine minutes clear. Keep moving.
      I can draw every door with my eyes shut
      and cannot tell you what is round the corner.

      [Bridge]
      If I turn left, I miss the hall.
      If I never turn, I keep the song.

      [Final Chorus - the whole band shouting]
      One day in port. None of it is mine.
      One straight road and a departure time.
      Gate at three. Hauler at four.
      Lane all week. Keep moving.
      Another settlement, another borrowed night,
      another left turn I will know and never take.

      [Outro - cold stop]
