    lyrics: |
      [Intro - 5 seconds, struck metal in the rhythm of folding seats being stacked, no vocal]

      [Verse 1 - stacking rhythm only]
      Forty of us on the stairs and the door is still shut,
      the inspector is up there with a clipboard and a torch.
      Somebody's brought food. Somebody's brought a bottle.
      Somebody's brought a whole ration of somebody else's biscuits.
      This is the best night anybody has had all storm season
      and none of us has got any further than the second landing.

      [Pre-Chorus]
      And you are three steps below me on the turn -

      [Chorus]
      Queue for the roof (queue for the roof)
      Everybody wants the one place with a view (with a view)
      Two hundred people and a rail and a flat bit of tar,
      and I would stand here all night if you stand here too.

      [Verse 2]
      They only open it four evenings in the year,
      when the storm coast is clear and the wind is under thirty.
      The rest of the time it is a locked hatch and a rumour,
      and the rumour is better than most things that are true.
      I have heard it described by people who have never been up
      and they describe it beautifully and at length.

      [Pre-Chorus]
      And you are two steps below me now -

      [Chorus]
      Queue for the roof (queue for the roof)
      Everybody wants the one place with a view (with a view)
      Two hundred people and a rail and a flat bit of tar,
      and I would stand here all night if you stand here too.

      [Verse 3]
      He shouts down that it is full and to come back at ten.
      Nobody moves. Nobody has ever moved.
      There is a settlement's worth of us on one staircase
      and not one person is in a hurry to get anywhere else.

      [Chorus]
      Queue for the roof (queue for the roof)
      Everybody wants the one place with a view (with a view)
      Two hundred people and a rail and a flat bit of tar,
      and I would stand here all night if you stand here too.

      [Outro - fade on the stacking rhythm and the group answer]
