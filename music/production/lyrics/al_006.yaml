    lyrics: |
      [Intro - 8 seconds, plucked electronic strings, gated drums entering at five seconds, no vocal]

      [Verse 1]
      Everybody on this coast has an opinion about Thursday.
      The board says one thing, the yard says the opposite,
      your uncle says the sea has a look about it,
      and all four of them will be wrong in the same direction.

      [Chorus]
      Spare me the weather (spare me the weather)
      Tell me what you are doing, not what the sky is doing (not the sky)
      I have had a season of everybody's predictions
      and not one of them has ever come and knocked on my door.

      [Verse 2]
      They said the storm season would break early, it broke late.
      They said the last ferry would run, and then it did not run,
      and a hundred of us stood on the hard with our bags
      being told by a man with a list to try again tomorrow.
      A hauler took nine of us as far as the point
      and put us off there, which was honest, and no use.

      [Chorus]
      Spare me the weather (spare me the weather)
      Tell me what you are doing, not what the sky is doing (not the sky)
      I have had a season of everybody's predictions
      and not one of them has ever come and knocked on my door.

      [Instrumental - plucked electronic strings, 12 seconds]

      [Verse 3]
      You are as bad as the board, you are worse than the board,
      you have got a whole forecast about the two of us.
      Next year, you say. When the work eases. When the road opens.
      There is no version of the road where it opens for that.

      [Chorus]
      Spare me the weather (spare me the weather)
      Tell me what you are doing, not what the sky is doing (not the sky)
      I have had a season of everybody's predictions
      and not one of them has ever come and knocked on my door.

      [Chorus - group, plucked strings dropping out on every refusal]
      Spare me the weather (spare me the weather)
      Come to the door. Knock on it. Say a day of the week.
      I have had a season of everybody's predictions.
      Be the one that turns up.

      [Outro - fade on the plucked strings]
    take: null                    # M-30 fills this in at the Suno sitting

