    lyrics: |
      [Intro - 4 seconds, struck metal seat frames, band in on the fifth, no vocal]

      [Chorus]
      Sit down, sit down, the announcement is not finished,
      the man with the list has three more names to read.
      You have been halfway out of that chair for twenty minutes
      and the only person who has noticed is me.

      [Verse 1]
      It is the annual meeting and the annual meeting is long,
      the fee is discussed, the fee is discussed again.
      There is a woman at the front with a very good argument
      and she is going to make it four separate times.
      The ration board comes up. The ration board always comes up.
      Two men behind us have been asleep since the second item.

      [Chorus]
      Sit down, sit down, the announcement is not finished,
      the man with the list has three more names to read.
      You have been halfway out of that chair for twenty minutes
      and the only person who has noticed is me.

      [Verse 2]
      You have looked at the door. You have looked at the clock.
      You have looked at me twice and pretended it was the clock.
      Everybody else is watching the front of the room
      and I have not heard one word since the second item.

      [Bridge]
      Nine rows, four hundred chairs, one hall, one hour.
      I would sit through the whole thing twice for the walk home.

      [Verse 3]
      When it ends there will be a queue at the transfer hall door
      and we will be at the back of it, on purpose, both of us,
      and the walk to the berth takes nine minutes at a normal pace
      and about forty if it is done properly.
      So stay in the chair. Let them read out every name.
      I have never wanted a meeting to run over before.

      [Chorus]
      Sit down, sit down, the announcement is not finished,
      the man with the list has three more names to read.
      You have been halfway out of that chair for twenty minutes
      and the only person who has noticed is me.

      [Outro - cold stop on a struck frame]
