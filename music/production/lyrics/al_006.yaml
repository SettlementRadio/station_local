      Bright electronic power-pop, 128 BPM, restless and social, quick. Female lead vocal, low alto,
      strong and level, holding the long notes in the hook and singing the chorus twice the size of
      the verse. Two voices doubling the hook in octaves and answering the lead line for line across
      the chorus. Synth bass, electronic drum kit, layered compact synthesizers, and struck metal
      percussion playing the clattering rhythm of folding metal seats being stacked, which is the
      only thing under the first verse. Ringing electric-piano and organ tones, gated electronic
