  - id: s_0057
    title: Borrow My Evening
    track_number: 2
    mood: [flirtatious, warm, midtempo]
    fact: >-
      Sel Ardin split the title between six voices so Nara Veck never sings the full request alone.
    arrangement_note: six voices pass the three-word title between them in overlapping pairs so the lead never sings the whole request alone; Nessa Dray's guest composite fiddle answers the second half of every chorus
    intro: 9
    outro: fade
    target_duration: "4:05"
    prompt: >-
      Bright electronic power-pop at a midtempo, 112 BPM, flirtatious and warm. Female lead vocal,
      low alto, strong and level, holding the long notes in the hook. Six voices pass the three-word
      hook between them in overlapping pairs, one pair per word, so the lead never sings the whole
      request alone, then all six join the repeated group chorus. Synth bass, electronic drum kit,
      layered compact synthesizers, struck metal
      percussion, and one guest composite fiddle — bright and thin-toned, a single instrument and
      never a string section — answering the second half of every chorus. Ringing electric-piano and
      organ tones, gated electronic drums, dry verses opening into a wide reverberant chorus. Nine
      seconds of synthesizer and fiddle before the first sung word. Fade.
    exclude: acoustic drum kit, guitars, continuous four-on-the-floor club beat, orchestral string section, rapped sections, whispered vocals, vocal tuning, dance-pop and club production, hi-NRG, house
    lyrics: |
      [Intro - 9 seconds, synthesizer with a composite fiddle figure over it, no vocal]

      [Verse 1]
      I am not asking for the week and I am not asking for the year,
      I know exactly how much of you there is to go round.
      There is a queue for it. I have stood in the queue.
      I have watched four people take their turn and I did not complain.

      [Chorus - title passed across six voices in overlapping pairs, fiddle answers the last two lines]
      Borrow my evening. Give it back how you like.
      Bent, late, spent, with the good part already used —
      I would rather have it wrecked and handed over
      than kept nice on a shelf for somebody sensible.

      [Verse 2]
      Your shift ends when the last hauler is off the hard,
      mine ends when the hall does, which is never the same night.
      Between the two of them there is a corridor of about an hour
      and I have got very good at being in it.
      I know which door you come out of and how long you take
      and I have never once let on that I know.

      [Chorus - title passed across six voices in overlapping pairs, fiddle answers the last two lines]
      Borrow my evening. Give it back how you like.
      Bent, late, spent, with the good part already used —
      I would rather have it wrecked and handed over
      than kept nice on a shelf for somebody sensible.

      [Middle eight - lead with close group answers]
      Pass it down the line until it reaches where you are.
      Keep the last word for yourself if that is what gets you here.

      [Verse 3]
      So come and take it, take Tuesday, take the wet half of it,
      take the part where the power drops and we sit in the dark and talk.
      Take the walk to the berth and the argument on the way,
      take the bit where it rains and neither of us says so.
      I am not keeping anything back for a better offer.
      There is no better offer. I have looked at the board.

      [Final Chorus - title passed across six voices in overlapping pairs, fiddle answers the last two lines]
      Borrow my evening. Give it back how you like.
      Bent, late, spent, with the good part already used —
      I would rather have it wrecked and handed over
      than kept nice on a shelf for somebody sensible.

      [Outro - fade on the fiddle and the shared hook]
