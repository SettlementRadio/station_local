      Miro Olt leaves a deliberate gap each time the singer refuses another prediction.
    arrangement_note: the guest synth-harpsichord drops out for a full bar every time the lead refuses a prediction, and the gap is never filled by anything else
    intro: 8
    outro: fade
    target_duration: "3:30"
    prompt: >-
      Bright electronic power-pop, 122 BPM, impatient and playful, brisk. Female lead vocal, low
