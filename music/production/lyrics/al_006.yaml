  - id: s_0056
    title: Clear by Closing
    track_number: 1
    mood: [optimistic, bright, brisk]
    fact: >-
      Nara Veck finished the lead two minutes before the hall's booked power allotment ended.
    arrangement_note: nothing is doubled or overdubbed anywhere in this song, because the take had to fit inside the allotment, and the last chorus is the room as it stood
    intro: 6
    outro: cold
    target_duration: "3:20"
    prompt: >-
      Bright electronic power-pop, 124 BPM, optimistic and brisk. Female lead vocal, low alto,
      strong and level, holding the long notes in the hook and singing the chorus twice the size of
      the verse. Two voices doubling the hook in octaves, a repeated group chorus, one
      call-and-response answer in the last third of the song. Synth bass, electronic drum kit,
      layered compact synthesizers, struck metal percussion. Ringing electric-piano and organ tones
      over the synthesizers, gated electronic drums, dry verses opening into a wide reverberant
      chorus, hook engineered to be sung back. Everything played live inside one take with nothing
      doubled and nothing overdubbed. Six seconds of synthesizer and struck metal before the first
      sung word. Cold stop.
    exclude: acoustic drum kit, guitars, continuous four-on-the-floor club beat, orchestral strings, rapped sections, whispered vocals, vocal tuning, dance-pop and club production, hi-NRG, house
    lyrics: |
      [Intro - 6 seconds, synthesizer chord with struck metal on the last bar, no vocal]

      [Verse 1]
      The lamps go off at ten whatever anybody wants,
      the desk goes dark, the doors get chained at five past.
      Everything I have to say to you has to fit
      between the second bell and the sound of the shutters.

      [Chorus]
      So let us be clear by closing.
      Not tidy, not agreed, not signed at the bottom,
      just clear — you know where I am and I know where you are,
      and neither of us goes home carrying the other one's week.

      [Verse 2]
      You are the last person in this settlement who tells me the truth
      at the speed I can take it, which is slower than you think.
      Everyone else waits for a better hour and the better hour never lands,
      and the road seals, and the whole thing goes out on the carrier wave in pieces,
      four days one way and four days back with the weather in it,
      and by then neither of us can remember which part mattered.

      [Chorus]
      So let us be clear by closing.
      Not tidy, not agreed, not signed at the bottom,
      just clear — you know where I am and I know where you are,
      and neither of us goes home carrying the other one's week.

      [Verse 3]
      Two minutes left, and I have said it, and it is out in the room now.
      You have got the same two minutes and the same going lamps,
      and whatever you do with them I will still be here on Thursday,
      in the same chair, in the same port hall, at the same hour.
      That is not pressure. That is the timetable.

      [Chorus]
      So let us be clear by closing.
      Not tidy, not agreed, not signed at the bottom,
      just clear — you know where I am and I know where you are,
      and neither of us goes home carrying the other one's week.
      Clear by closing. The lights are going anyway.

      [Outro - cold stop as the last chord cuts]
    take: null                    # M-30 fills this in at the Suno sitting

  - id: s_0057
    title: Borrow My Evening
    track_number: 2
    mood: [flirtatious, warm, midtempo]
    fact: >-
      Sel Ardin split the title between six voices so Nara Veck never sings the full request alone.
    arrangement_note: the title line is split word by word across six voices and the lead never sings the whole of it herself; a guest composite fiddle answers the second half of every chorus
    intro: 9
    outro: fade
    target_duration: "3:40"
    prompt: >-
