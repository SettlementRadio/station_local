      strong and level, holding the long notes in the hook and singing the chorus twice the size of
      the verse. Two voices doubling the hook in octaves, a repeated group chorus. Synth bass,
      electronic drum kit whose snare is replaced throughout by struck metal seat frames, layered
      compact synthesizers. Ringing electric-piano and organ tones, gated electronic drums, dry
