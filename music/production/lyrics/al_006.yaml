  - id: s_0056
    title: Clear by Closing
    track_number: 1
    mood: [optimistic, bright, brisk]
    fact: >-
      Nara Veck finished the lead two minutes before the hall's booked power allotment ended.
    arrangement_note: every part is performed live in one take with no overdubs; the band's two backing voices double the hook in octaves, Sel Ardin supplies the call-and-response answer, and the last chorus is the room as it stood
