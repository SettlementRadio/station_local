    exclude: acoustic drum kit, guitars, continuous four-on-the-floor club beat, orchestral strings, rapped sections, whispered vocals, vocal tuning, dance-pop and club production, hi-NRG, house
    lyrics: |
      [Intro - 16 seconds, one low resonance-pipe note down a hallway with synthesizer over it, no vocal]

      [Verse 1]
      Everybody else went through to the room where the food was,
      you stopped in the corridor to say one thing to me
      and then did not say it, and stood there instead,
      with the noise of the party going on behind the door,
      and the scrubber in the wall doing the only talking,
      and the light off the port hall coming under the bulkhead.

      [Refrain]
      It is warmer out here than it is in there.
      Whatever they are doing in there, it is colder.

      [Verse 2]
      There is a resonance pipe at the far end of this hallway
      and its low note reaches me before I hear it.
      I know every service door in this building,
      I walk this corridor four times a day,
      and I had never heard that note until tonight.

      [Refrain]
      It is warmer out here than it is in there.
      Whatever they are doing in there, it is colder.

      [Verse 3]
      Somebody could come through that door at any moment,
      which is why neither of us has moved an inch.
      You are close enough that I can tell you have been outside,
      the whole storm coast is on your coat and your hands are still cold
      and you have not put them anywhere and neither have I.

      [Refrain]
      It is warmer out here than it is in there.
      Whatever they are doing in there, it is colder.

      [Verse 4]
      Say it or do not say it. I am not going anywhere.
      The party will go on for another hour and a half,
      they will not miss us, they have not missed us yet,
      and I am not going back through that door until you have.
      I would stand in this corridor until the season turns.

      [Refrain - group answer]
      It is warmer out here than it is in there.
      Whatever they are doing in there, it is colder.
      It has been warmer out here all night.

      [Outro - sustain, the pipe note left ringing after the band stops]
