  - id: s_0060
    title: Heat in the Hallway
    track_number: 5
    mood: [sultry, tense, steady]
    fact: >-
      Ivena Sorn's resonance-pipe note was recorded in the Meridian studio hallway because it
      overloaded the main-room microphone at the planned distance.
    arrangement_note: one guest resonance-pipe note runs under the whole song, recorded down a hallway rather than in the room, and the song has a refrain and no chorus
    intro: 16
    outro: sustain
    target_duration: "4:20"
    prompt: >-
      Bright electronic power-pop taken slow, 100 BPM, sultry and tense, steady. Female lead vocal,
      low alto, strong and level, holding the long notes in the refrain. Two voices doubling the
      refrain in octaves, one call-and-response answer in the last third of the song. Synth bass,
      electronic drum kit, layered compact synthesizers, struck metal percussion, and one guest
      resonance pipe — a long alloy tube with a deep organ tone — holding a single low note under
