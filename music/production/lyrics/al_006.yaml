    lyrics: |
      [Intro - 11 seconds, synthesizer with a clipped composite-guitar figure answering it, no vocal]

      [Verse 1]
      Twelve years ago we stood in a doorway like this one
      and neither of us had anything worked out at all.
      You had a coat that was no use and I had less than that,
      and the rain came off the roof between us in a line.
      The last ferry had gone and we both knew that it had
      and neither of us mentioned it for about an hour.

      [Verse 2]
      I could not have told you then how any of it went.
      I would have guessed wrong about the settlement, the work, the money,
      wrong about who stayed and wrong about who did not,
      and wrong about which of the two of us would ask first.

      [Chorus]
      Same weather, same roof, same two feet of dry ground.
      Everything else in this settlement has been rebuilt twice
      and there is still a puddle in exactly the same place
      and you are still standing on the dry side, leaving me the wet.

      [Verse 3]
      There is a figure the guitar plays that I have heard before,
      four notes, clipped, from a session in a depot years back.
      I did not know she had kept it. I did not know I had.
      That is what this record is, if anybody asks.

      [Chorus]
      Same weather, same roof, same two feet of dry ground.
      Everything else in this settlement has been rebuilt twice
      and there is still a puddle in exactly the same place
      and you are still standing on the dry side, leaving me the wet.

      [Bridge]
      Nothing has been decided out here. Nothing ever is.
      We just keep ending up under the same bit of metal.

      [Final Chorus - group]
      Same weather, same roof, same two feet of dry ground.
      Everything else in this settlement has been rebuilt twice
