    exclude: acoustic drum kit, guitars, continuous four-on-the-floor club beat, orchestral string section, rapped sections, whispered vocals, vocal tuning, dance-pop and club production, hi-NRG, house
    lyrics: |
      [Intro - 9 seconds, synthesizer with a composite fiddle figure over it, no vocal]

      [Verse 1]
      I am not asking for the week and I am not asking for the year,
      I know exactly how much of you there is to go round.
      There is a queue for it. I have stood in the queue.
      I have watched four people take their turn and I did not complain.

      [Chorus]
      Borrow my evening. Give it back how you like.
      Bent, late, spent, with the good part already used —
      I would rather have it wrecked and handed over
      than kept nice on a shelf for somebody sensible.

      [Verse 2]
      Your shift ends when the last hauler is off the hard,
      mine ends when the hall does, which is never the same night.
      Between the two of them there is a corridor of about an hour
      and I have got very good at being in it.
      I know which door you come out of and how long you take
      and I have never once let on that I know.

      [Chorus]
      Borrow my evening. Give it back how you like.
      Bent, late, spent, with the good part already used —
      I would rather have it wrecked and handed over
      than kept nice on a shelf for somebody sensible.

      [Middle eight - six voices, one word each]
      Nobody sings the whole of this line on their own.
      That is not modesty, it is how the thing was built.

      [Verse 3]
      So come and take it, take Tuesday, take the wet half of it,
      take the part where the power drops and we sit in the dark and talk.
      Take the walk to the berth and the argument on the way,
      take the bit where it rains and neither of us says so.
      I am not keeping anything back for a better offer.
      There is no better offer. I have looked at the board.

      [Chorus]
      Borrow my evening. Give it back how you like.
      Bent, late, spent, with the good part already used —
      I would rather have it wrecked and handed over
      than kept nice on a shelf for somebody sensible.

      [Outro - fade on the fiddle and the shared hook]
