    exclude: acoustic drum kit, guitars, continuous four-on-the-floor club beat, orchestral strings, rapped sections, whispered vocals, vocal tuning, dance-pop and club production, hi-NRG, house
    lyrics: |
      [Intro - 7 seconds, synthesizer and gated electronic drums, no vocal]

      [Verse 1]
      You have got a very good way of not saying no.
      It is a whole craft and you have got the whole of it.
      It takes about four minutes and it sounds like agreement
      and I walk out of the room feeling reasonably well treated
      and it is only on the stairs that I notice what happened.

      [Chorus]
      Give me one plain answer. I can carry either one.
      I have got a hold full of things I am carrying already
      and not one of them weighs what a maybe weighs.
      Say it plainly. I will not make you say it twice.

      [Verse 2]
      Everybody here is polite and nobody here is clear,
      the whole settlement runs on people being nearly sure.
      The berth is nearly yours. The work is nearly settled.
      The ferry nearly goes on the day they said it would.
      You can go a whole year on a nearly. I have done it.
      I have got a year I would like back, if anybody is offering.

      [Chorus]
      Give me one plain answer. I can carry either one.
      I have got a hold full of things I am carrying already
      and not one of them weighs what a maybe weighs.
      Say it plainly. I will not make you say it twice.

      [Verse 3 - synth bass alone, three lines]
      Here is mine, and it is three lines long, and I wrote it on the back of a manifest.
      Yes. Whenever you like. Tell me where to stand.
      That is all it takes and it took me eleven years.

      [Final Chorus - all voices]
      Give me one plain answer. I can carry either one.
      I have got a hold full of things I am carrying already
      and not one of them weighs what a maybe weighs.
      Say it plainly. I will not make you say it twice.
      One plain answer. That is the whole of the ask.

      [Outro - cold stop, everything cutting together]
