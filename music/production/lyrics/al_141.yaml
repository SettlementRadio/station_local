  - id: s_1152
    title: Owe It to the Shop
    track_number: 5
    mood: [wry, brisk, plain]
    fact: >-
      The woman who kept the crews in credit through the closure is in the second verse and asked the
      band to leave her name in it.
    arrangement_note: the briskest thing on the record, and the only one where the two harmonies sing the whole chorus rather than the last line of it, because the chorus is a thing a lot of people would say
    intro: 4
    outro: fade
    target_duration: "3:40"
    prompt: >-
      106 BPM brisk blues; high female lead, two low harmonies, guitar, concertina, piano, dry bass, fade.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - full band, four seconds]

      [Verse 1]
      At the wharf end, where the lane turns muddy,
      one warm window keeps the winter back.
      Flour on the shelf and oil behind the counter,
      ration tins in one careful little clean stack.
      She knows which freight crew missed its payment,
      who has children, whose old mother needs the coal.
      Never asks for reasons, never offers pity;
      only takes her pencil from its string.

      [Refrain]
      Put it on the book till water's running.
      Put it by the flour, plain and small.
      Debt can bow a head when someone names it;
      trust can let you leave there standing tall.

      [Verse 2]
      One column holds the tea and winter candles.
      One holds boots repaired and canvas thread.
      No interest blooms beside the quiet figures,
      no stamped demand comes riding on the relay.
      Her rule is pay the shop when work comes homeward,
      before the bright new coat, before the ale.
      Keep the promise without making speeches.
      She will keep your hunger from the lane.

      [Refrain]
      Put it on the book till water's running.
      Put it by the flour, plain and small.
      Debt can bow a head when someone names it;
      trust can let you leave there standing tall.

      [Verse 3]
      Thaw brings cargo, wages, boots at daybreak,
      and coins begin to gather by the scale.
      Each hand pays its line without reminder;
      each mark disappears beneath the nail.
      I ask what happens if the locks stay empty.
      She looks at me until the question ends.
      Then slides a sack of rice across the counter,
      for the new freight crew delayed beyond the bend.

      [Final Refrain]
      Put it on the book; the water's running.
      Leave the pencil hanging where it falls.
      What we owed was counted out in winter;
      what she gave us never fit the book at all.

      [Outro - fade]
