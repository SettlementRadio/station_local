    outro: fade
    target_duration: "3:55"
    prompt: >-
      92 BPM warm blues; high female lead, two low harmonies, concertina first, guitar, piano, fade.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - concertina and guitar, eleven seconds]

      [Verse 1]
      Coal at dawn and flour in the evening,
      lamp oil knocking softly in the hold,
      letters from a sister past the basin,
      seed in sacks and medicine kept cold.
      Every hauler wears the town upon it,
      every rope brings news against the stone.
      Then you stepped ashore beside the concertina,
      carrying one small case and nowhere else to go.

      [Chorus]
      Everything comes by water, bread and trouble, work and rain.
      Everything comes by water, leaves us by the same old way.
      Let the freight crew read the manifest and call the cargo plain;
      I know the thing I waited for was you upon that boat.

      [Verse 2]
      When they drained the cut the shop went hollow,
      bare hooks, empty bins, one ration left to share.
      Chalk marks climbed the lock-house door till winter;
      no hull answered when we turned to stare.
      We learned the weight of ordinary plenty,
      how a cabbage has a route, how coal has miles.
      You learned every cold room on the lane then,
      and stayed when staying offered no reward.

      [Post-Chorus]
      No last ferry, no late light under canvas,
      only footprints where the water ought to be.

      [Verse 3]
      Spring came first as damp along the stonework,
      then a dark line rising past the gate.
      Children ran the bank to meet the first bow;
      every grown hand found a reason there to wait.
      The relay carried word beyond the basin,
      but our lane knew hours before it crossed the air.
      I heard your concertina through the window,
      bright as something newly landed, choosing to remain.

      [Chorus]
      Everything comes by water, bread and trouble, work and rain.
      Everything comes by water, leaves us by the same old way.
      Let the freight crew read the manifest and call the cargo plain;
      I know the thing I waited for was you upon that boat.

      [Outro - fade]
