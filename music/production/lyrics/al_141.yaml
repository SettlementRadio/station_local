  - id: s_1148
    title: Everything Comes By Water
    track_number: 1
    mood: [rolling, warm, communal]
    fact: >-
      Wenna Ferrin's concertina is on it from the first bar and she had been in the band three months
      when they recorded it.
    arrangement_note: the concertina is the first sound on the record and on this band's whole catalogue, and it is played by somebody who has been in the band a quarter of a year and is audibly finding her place
