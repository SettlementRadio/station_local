  - id: s_1149
    title: The Cut Is Closed
    track_number: 2
    mood: [still, cold, patient]
    fact: >-
      The gang who drained the cut sing the chorus, and they were paid for it out of the same share
      the band was.
    arrangement_note: eight or nine untrained voices off the repair gang sing one chorus flat and ragged and a beat behind, and they are a gang rather than a backing part — this band's two harmonies stay where they always are
    intro: 17
    outro: sustain
    target_duration: "4:20"
    prompt: >-
      68 BPM cold blues; high female lead, two low harmonies, concertina, ragged gang chorus, held end.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, blended or studio choir, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, cold ending, fade-out
    lyrics: |
      [Intro - concertina alone, seventeen seconds]

      [Verse 1]
      Stop planks at the head gate Monday morning,
      Thursday boots were sinking in the bed.
      Eleven miles of mud lay open under us,
      pale stones showing where the water pressed.
      We found a kettle, four bent wheels, a gate hinge,
      stripped wire wound around a willow root,
      all the little things a freight crew loses
      and lets the dark green surface keep as truth.

      [Work Chorus]
      The cut is closed, the pay is thin, the winter settles in.
      Lift together, set it square, and mind the rotten ground.
      The water kept our living out of sight here;
      now the bottom tells us what the place is built around.

      [Verse 2]
      One man clears the silt below the third gate.
      One woman checks the stone for frost and seams.
      Eight hands drag a broken beam to daylight,
      then divide a ration by the lock-house fire.
      No cargo moves, no office sends an answer,
      no spare coin waits beneath the account.
      Still they shoulder every frozen barrow,
      because a town can owe what it cannot count.

      [Gang Chorus - eight or nine voices, ragged and late]
      THE CUT IS CLOSED. THE CUT IS CLOSED TILL SPRING.
      MUD ON THE BOOTS AND NOTHING IN THE TIN.

      [Verse 3]
      At the deepest bend we find the old foundations,
      black oak laid before our oldest wall.
      Every hauler passed above those buried timbers;
      no manifest had named them there at all.
      We stand where loaded boats will cross by summer,
      ankle-deep in what the current leaves.
      Then cover every scar with gates and water,
      trusting work the way the whole lane trusts the stream.

      [Work Chorus]
      The cut is closed, the pay is thin, the winter settles in.
      Lift together, set it square, and mind the rotten ground.
      The water kept our living out of sight here;
      now the bottom tells us what the place is built around.

      [Outro - sustain]
