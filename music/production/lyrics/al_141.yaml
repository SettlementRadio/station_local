# al_141 — Everything Comes By Water · The Ninefoot Cut (b_063) · Relay Road Import · 2612 · 7 songs · album
#
# Written by M-25. **The file shape is fixed by al_001.yaml — read that header once.** Production
# vocabulary (COMMISSION.md §8): never enters the wiki, never said on air. Lyrics written by hand;
# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# Made in 2610, the season the cut was drained for repair and nobody working on it earned anything,
# and issued at the road head in 2612. Relay Road Import had written asking for more of the first
# record and got a slower one made by five people with no wages coming in.
#
# **This is the record the style card describes.** Wenna Ferrin came off the next boat that spring,
# so the concertina arrives on the first bar of `s_1148` and the second harmony voice — female, under
# the lead with Torr Bexley's — arrives with her. al_140 has neither and says so; from here on the
# card applies as written.
#
# Fenna Crole has said the record is not about the closure and that it is simply the only time the
# five of them have ever been in the same room for a whole season, which is what `s_1151` and
# `s_1153` are actually about. **The repair gang sing the chorus of `s_1149`** and were paid the way
# the band was, out of a share of what the lock house had. **Torr Bexley winds a boat rope round the
# neck of the bass** on `s_1151` to deaden it and has never taken it off, so from this record on the
# bass is shorter and drier than it was on al_140.
#
# `generation:` and every `take:` are empty until M-34.

album:
  id: al_141
  title: Everything Comes By Water
  band: b_063
  band_name: The Ninefoot Cut
  label: label_7
  release_year: 2612
  genre: old-system-sessions
  cornerstone: false
  song_count: 7
  style_card: b_063
  room: >-
    The lock house front room again, in a winter with no water in the cut outside it and no money in
    the house. Small, wooden, stone behind everything, one or two microphones, nothing overdubbed.
    The card holds in full for the first time: light high female lead sung quietly, two harmony voices
    close under her on choruses — one male, one female — never above her, and a concertina in the
    line-up. Three things are this record's own. The upright bass has a boat rope wound round its neck
    from s_1151 onwards, which is where the band's dry short bottom end comes from. The repair gang
    sing the chorus of s_1149, eight or nine untrained voices, ragged and paid out of the same share
    the band was. And Wenna Ferrin had been in the band three months when it was cut, which is audible
    and was left audible.

