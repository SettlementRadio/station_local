  - id: s_1150
    title: A Winter Off the Boats
    track_number: 3
    mood: [slow, blue, close]
    fact: >-
      Fenna Crole wrote it in the four days her whole family were in the lock house together for the
      first time since 2599, which she has said was three days more than anybody needed.
    arrangement_note: the two harmonies stay out of it until the last refrain, which is the only time on the record the band leave the lead on her own for that long
    intro: 14
    outro: fade
    target_duration: "4:15"
    prompt: >-
      64 BPM close blues; solo high female lead till final refrain, piano, concertina, dry bass, fade.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, continuous backing vocals, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano and concertina, fourteen seconds]

      [Verse 1]
      My brother came up empty from the sea end,
      my sister left her hauler on the stones.
      Mother moved her sewing from the back room,
      and four shut doors remembered we were home.
      We stacked our boots beside the single fire,
      passed one bowl and called the silence rest.
      Outside, the drained cut held no cargo;
      inside, every old word waited to be said.

      [Refrain]
      With the boats laid up, we all come homeward.
      Four rooms, one fire, too much weather in our clothes.
      We are kinder with eleven miles between us,
      but winter shuts the lane and everybody knows.

      [Verse 2]
      First day we spoke of locks and coming thawtime.
      Second day we sorted rope and grain.
      Third day she asked why I had never answered
      the relay sent before the autumn rain.
      My brother watched the kettle cloud the window,
      then put the question level on the board.
      He said I used the cut to keep from choosing.
      I said he used the sea to leave us all.

      [Refrain]
      With the boats laid up, we all come homeward.
      Four rooms, one fire, too much weather in our clothes.
      We are kinder with eleven miles between us,
      but winter shuts the lane and everybody knows.

      [Bridge]
      No last ferry came to end the evening.
      No freight crew knocked and gave us work to do.
      The house held every breath above the table,
      while the bare canal reflected nothing through.

      [Verse 3]
      At dawn he tied his blanket to his shoulder,
      though frost was white as flour on the track.
      I found the six clean words I should have given,
      but pride can make a mouth refuse its work.
      He left one glove beside the cooling kettle.
      I keep it where the cargo ledgers lie.
      Spring will put the water back between us;
      before it does, I mean to make this right.

      [Final Refrain - two harmonies enter]
      When the boats return, we may go outward.
      Four rooms, one fire, one word still left to choose.
      We are kinder with eleven miles between us;
      I would rather lose the distance than lose you.

      [Coda - fade]
    take: null # M-34 fills this in at the Suno sitting

  - id: s_1151
    title: Nothing Moves Till the Thaw
    track_number: 4
    mood: [dry, tired, midtempo]
    fact: >-
      Torr Bexley plays with a boat rope wound round the neck of the bass to deaden it, which he began
      doing because of the cold and has never stopped.
    arrangement_note: the bass is muffled with rope from the first bar and is shorter and drier than a bass, closer to a low drum, and every record after this one has it
    intro: 6
    outro: cold
    target_duration: "3:45"
    prompt: >-
      84 BPM dry blues; high female lead, two low harmonies, rope-muted bass, guitar, concertina, stop.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, ringing or sustained bass, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, fade-out
    lyrics: |
      [Intro - deadened bass and guitar, six seconds]

      [Verse 1]
      Frost has sealed the mud beneath the footbridge.
      Every empty gate throws back the wind.
      Cargo lists hang useless in the office;
      pencil dates go pale and start again.
      I mend the same short rope each morning,
      sweep the same clean step by half past nine.
      Across the cut a neighbor lifts her curtain,
      counting idle windows just like mine.

      [Chorus]
      Nothing turns before the thaw comes.
      No gate, no wheel, no wages on the lane.
      Put another cup beside the fire;
      waiting weighs less when someone knows your name.

      [Verse 2]
      First week every freight crew oils its tackle.
      Second week the broken chairs get square.
      Third week someone knocks without a reason,
      holding half a loaf and standing there.
      We trade old stories for a jar of pickles,
      argue which dark cloud contains the rain.
      By the fourth week every shut-up household
      knows who needs a ration, coal, or company.
      News no distant relay bothered carrying:
      whose roof leaks, whose child has outgrown shoes.

      [Turn]
      Let the far relay keep selling sunshine.
      Let the core call winter picturesque.
      Here the cold is rent without the money,
      and every friendly knock becomes a wage.

      [Chorus]
      Nothing turns before the thaw comes.
      No gate, no wheel, no wages on the lane.
      Put another cup beside the fire;
      waiting weighs less when someone knows your name.

      [Verse 3]
      Then one night the drainpipe starts its tapping.
      One black ribbon opens by the wall.
      Boots appear before the office doorway;
      someone brings a fresh new manifest.
      We will miss the hours we claimed to hate here,
      doors unlocked before the evening bell.
      Soon the haulers pull our lives to motion;
      tonight we let the melting water tell.
      Cold has drawn a map through all our doorways;
      every borrowed kindness leaves a mark.

      [Outro - cold stop]
