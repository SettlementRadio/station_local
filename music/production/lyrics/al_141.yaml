  - id: s_1153
    title: Somebody Else's Kitchen
    track_number: 6
    mood: [warm, fond, slow]
    fact: >-
      Written about the fortnight the band spent eating in other people's kitchens, and Fenna Crole
      has never said whose.
    arrangement_note: the warmest thing on the record and the only one where the concertina and the piano play the same line for the whole of it, which was Wenna Ferrin's idea and her first
    intro: 13
    outro: sustain
    target_duration: "4:10"
    prompt: >-
      78 BPM warm blues; high female lead, two low harmonies, doubled concertina and piano, bass, hold.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, cold ending, fade-out
    lyrics: |
      [Intro - concertina and guitar, thirteen seconds]

      [Verse 1]
      First night, cabbage folded into barley,
      steam along a window patched with tape.
      Seven wet coats crowd the narrow passage;
      five more chairs are boxes turned in place.
      Someone tears the final loaf in pieces,
      someone adds hot water to the stew.
      No one asks what cargo failed to reach us.
      Hunger is a fact we all can use.

      [Verse 2]
      Next night, farther up beside the fourth gate,
      onion, beans, and pepper from a jar.
      A freight crew tells a joke about the core lanes;
      nobody gets it, everybody laughs.
      We wash plates in one tin basin,
      dry them with a sleeve and stack them straight.
      Tomorrow our own fire will hold another table;
      tonight we take the place somebody makes.

      [Refrain]
      Somebody else's kitchen, somebody else's chair,
      somebody's last clean ration finding room enough to share.
      Sit wherever hands can pass a bowl along.
      Eat until the dark outside remembers you belong.

      [Verse 3]
      A newcomer sits closest to the doorway,
      ready for the moment she should leave.
      Three months on the lane and still apologizing,
      still believing welcome must be earned.
      An old hand puts more potatoes on her plate then,
      asks her for the tune she played last week.
      By the final cup she knows the children's nicknames;
      by the door she knows which floorboard speaks.

      [Refrain]
      Somebody else's kitchen, somebody else's chair,
      somebody's last clean ration finding room enough to share.
      Sit wherever hands can pass a bowl along.
      Eat until the dark outside remembers you belong.

      [Final Verse]
      Fourteen nights and fourteen different tables,
      every manifest of hunger crossed away.
      When the cargo comes, we'll fill our shelves and kettles,
      send the borrowed bowls back down the lane.
      No brass plate will mark the winter's giving.
      No relay will announce who carried whom.
      Just a knock, a coat, a space beside the cooker,
      and another chair appearing in the room.

      [Outro - sustain]
