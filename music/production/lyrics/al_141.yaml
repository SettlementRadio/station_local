  - id: s_1154
    title: Back on the Water
    track_number: 7
    mood: [bright, driving, final]
    fact: >-
      The first thing the five of them played on the day the water came back, standing on the lock
      beam, and the record ends where the closure did.
    arrangement_note: the brightest and fastest thing on the record, and the one place where the light kit is played with sticks, because it was played outdoors on a lock beam before it was played indoors
    intro: 8
    outro: cold
    target_duration: "3:35"
    prompt: >-
      108 BPM bright blues; high female lead, two low harmonies, guitar, concertina, bass, sticks, stop.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, fade-out
    lyrics: |
      [Intro - full band, eight seconds]

      [Verse 1]
      Pull the stop planks, let the first stream shoulder
      through the gate and darken all the clay.
      Children mark the rise against the stonework;
      grown hands find no better work today.
      Two long days the empty channel gathers,
      taking sky and willow leaf again.
      Every window on the lane stands open,
      listening for water under wind.

      [Chorus]
      Water under us again, work before us once again.
      Open every gate and loose the waiting line.
      Same eleven miles, but every mile is waking;
      let the loaded morning take its time.

      [Verse 2]
      Freight crews roll their canvas, test the towropes,
      chalk new cargo figures by the door.
      Shop hands wheel the flour sacks from storage;
      someone hangs fresh prices on the board.
      The first hauler rounds the lower corner,
      strange paint shining, captain half asleep.
      He sees nine people cheering from the lock beam,
      checks his manifest and asks what he has missed.

      [Break - concertina, guitar, and stick kit, eight seconds]

      [Chorus]
      Water under us again, work before us once again.
      Open every gate and loose the waiting line.
      Same eleven miles, but every mile is waking;
      let the loaded morning take its time.

      [Verse 3]
      Nothing happened that the relay noticed,
      no new settlement, treaty, launch, or crown.
      Mud took water, ropes took weight and purpose,
      one unknown boat went quietly down.
      Yet the winter loosened from our shoulders,
      every debt stood half an inch less tall.
      We raised both hands as cargo passed beneath us,
      and the stranger waved without knowing why at all.

      [Final Chorus]
      Water under us again, work before us once again.
      Open every gate and loose the waiting line.
      Same eleven miles, but every mile is waking;
      let the loaded morning take its time.
      Let the concertina carry past the basin;
      let the stick beat answer from the stone.

      [Coda - cold stop]
