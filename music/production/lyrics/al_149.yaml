  - id: s_1204
    title: Slow Set at Six
    track_number: 4
    mood: [tired, tender, slow]
    fact: >-
      Stormline Issue booked the band for the hour after the dancing stopped and paid it at the
      dancing's rate, which the house has never explained and has never repeated for anybody else.
    arrangement_note: everything on this track is played as tired as it can be played without dragging, and the kit is brushes on a closed hi-hat only
    intro: 5
    outro: fade
    target_duration: "3:40"
    prompt: >-
      46 BPM tired tender slow torch at the very end of a night; low grainy female lead close and dry
      and audibly tired, compact electric keyboards, upright bass, brushes on a closed hi-hat and
      nothing else from the kit, fade.
    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending, snare and toms
    lyrics: |
      [Intro - keyboards, five seconds]

      [Verse 1]
      Six in the morning is a strange hour to be paid for.
      The doors are open. There is grey outside.
      The cleaners have begun along the far wall
      and they work around us and they do not mind.
      There are perhaps nine people on the benches
      and two of them are staff and one's asleep.
      One came off a hauler at about four
      and has not decided yet to go to bed.
      This is the set. This is what we are here for.
      I would not swap it for the ten o'clock.

      [Verse 2]
      The house pays this hour what it pays the dancing,
      which nobody has ever asked them to,
      and when the shipboard press went and asked them
      they said nothing and have said nothing since.
      It has not happened for another act.
      It has not happened twice. It happened once.
      I have decided not to look at it too closely
      in case it turns out to be an error.
      A thing that is in your favour and unexplained
      is a thing you carry carefully and do not shake.

      [Refrain]
      Slow at six, and the light along the storm coast.
      Slow at six, and the money is the same.
      Whatever this is, somebody decided it,
      and did not put their name on it, and left.

      [Verse 3]
      He came in once, the man who signs the dockets,
      and stood at the back with his coat over his arm,
      and heard the whole hour out and did not clap
      and went away and put the rate up by a tenth.
      Ask him and he will tell you it is business.
      The dance acts fill the hall. That much is true.
      But somebody in that office likes this hour
      and I have never once found out which one.
      I would like to. I have decided not to try.
      Some accounts are better left uncounted.

      [Outro - keyboards and bass, fading]
