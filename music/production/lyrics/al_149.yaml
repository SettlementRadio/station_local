    prompt: >-
      46 BPM tired tender slow torch at the very end of a night; low grainy female lead close and dry
      and audibly tired, compact electric keyboards, upright bass, brushes on a closed hi-hat and
      nothing else from the kit, fade.
    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending, snare and toms
    lyrics: |
      [Intro - keyboards, five seconds]

      [Verse 1]
      Six in the morning, grey along the storm coast.
      Cleaners turn the chairs beneath the lights.
      Nine people remain along the benches,
      holding to the soft end of the night.
      You came from a hauler at the fourth hour,
      salt dried white across your working sleeve.
      You said the freight lane opened after sunrise.
      You had nowhere else you had to be.
      I watched your tired hands around the water.
      You watched the wet dawn gather over me.

      [Refrain]
      Slow at six, and the light along the storm coast.
      Slow at six, with the rain in measured time.
      Night has spent the loud part of its body.
      What remains can sit beside what is mine.

      [Verse 2]
      Between two lines, you told me about inland,
      orchards under domes beside a rail.
      You said you sent a share of every docket
      to a room you had not entered in a year.
      I did not ask who waited in that room.
      You did not ask why I was still awake.
      We gave each other one hour without questions,
      a kindness neither one of us could fake.

      [Verse 3]
      At seven, someone opened the high shutters.
      The room became too honest in the day.
      Your hauler called once from the loading channel.
      You stood, then let the second calling wait.
      I wanted something simple I could offer:
      a place, an hour, a reason not to leave.
      Instead I said the sealed road would be clearer.
      You said, "I know," and fastened up your sleeve.
      Outside, freight lights faded in the weather.
      Your empty glass stayed warm beside my knee.

      [Final Refrain]
      Slow at six, and the light along the storm coast.
      Slow at six, with the rain in measured time.
      Night has spent the loud part of its body.
      What remains can sit beside what is mine.

      [Outro - keyboards and bass, fading]
