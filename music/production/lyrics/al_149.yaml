  - id: s_1202
    title: A Coast With No Ferry
    track_number: 2
    mood: [wistful, spacious, patient]
    fact: >-
      Juna Carrow wrote it in her first sealed season, on finding that a coast with no last ferry has
      no hour at which the night is agreed to be over.
    arrangement_note: nothing marks the ends of sections — the piano runs straight through every join, and the break arrives without a cue
    intro: 15
    outro: sustain
    target_duration: "4:15"
    prompt: >-
      48 BPM spacious patient slow torch in a wide empty hall; low grainy female lead close and dry
      with long line ends, upright piano running continuously through every section join and taking a
      sixteen-second break, upright bass, brushed kit, sustained ending.
    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending, drum fills marking section ends
    lyrics: |
      [Intro - piano alone, fifteen seconds]

      [Verse 1]
      Where I come from the night ends at midnight
      because that is when the last ferry goes.
      Everybody stands up at the same moment.
      Half the room goes down the stair at once.
      What is left is left on purpose, and it knows it,
      and that is the hour the whole form was built for.
      Out here there is no boat and no departure
      and nothing tells a room that it is done.

      [Verse 2]
      In a sealed season nobody is leaving.
      There is nowhere any of them have to be.
      So a hall can run from ten until whenever
      and whenever is a word that has no hour.
      I have finished sets at four and at half five
      and once at seven with the wet light coming through,
      and every one of them just stopped, eventually,
      the way a conversation stops. Not ended. Stopped.

      [Chorus]
      A coast without a ferry has no midnight.
      A coast without a ferry has no last.
      I did not know how much I leaned upon it
      until I stood in a hall that had no end.

      [Instrumental - upright piano break, sixteen seconds]

      [Verse 3]
      I am not asking anybody's pity.
      There are worse things than a night that will not close.
      But a form needs a shape and mine had one
      and its shape was a boat leaving at twelve.
      So I have started calling it at three,
      out loud, from the front, which nobody asked for,
      and the storm coast lets me, being a polite place,
      and about nine people every night go home.
      The rest of them stay on and I stay with them
      and none of us can tell you what we are waiting for.

      [Chorus]
      A coast without a ferry has no midnight.
      A coast without a ferry has no last.
      So I will be the boat, and I will call it,
      and whoever wants an ending has got mine.

      [Outro - piano sustaining]
