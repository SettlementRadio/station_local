    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, a four-on-the-floor kick in the band itself, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - keyboards and bass, six seconds]

      [Verse 1]
      The wall takes every other beat between us.
      Dust lifts softly from the window frame.
      Beyond it, half the storm coast loses balance.
      In here, eleven chairs and no one's name.
      You came through looking for a quieter doorway,
      one hand pressed against your ringing ear.
      The floor kept moving under both our tables.
      You laughed and asked what anybody did in here.

      [Verse 2]
      You said the loud room made it hard to answer.
      I said the quiet one could do that too.
      Your sleeve was wet from sealed season weather.
      A silver paper star clung to your shoe.
      Each time the other side struck through the plaster,
      the glasses gave a small replying sound.
      We spoke inside the spaces they had left us,
      low enough to keep the words from going round.

      [Pre-Chorus]
      Stay until the wall stops shaking.
      Stay until your hands lie still.

      [Chorus]
      Let the next room dance the night to pieces.
      Let the low lane carry home the noise.
      We can take the half they leave between it,
      make a little shelter for a voice.

      [Verse 3]
      Near four, the wall went suddenly to breathing.
      The doors next door released a cloud of heat.
      Tired bodies crossed into our dimness,
      bright dust drying slowly on their cheeks.
      You moved your chair enough to let them settle.
      She slept with both hands around a glass.
      No one asked us for a faster ending.
      No one missed the room they had just left.
      When wet dawn reached the high coast windows,
      your silver star was shining by my feet.

      [Final Chorus]
      Let the next room dance the night to pieces.
      Let the low lane carry home the noise.
      We can take the half they leave between it,
      make a little shelter for a voice.

      [Outro - keyboards fading, kit last]
