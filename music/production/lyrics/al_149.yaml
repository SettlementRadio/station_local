#
# Stormline Issue's first record in the form, made because the coast had sealed, the crates had gone,
# the dance acts were off the coast, and there was a singer in a hall with a band she had put
# together four months earlier. **Juna Carrow is the same voice as `al_148`'s** — the card says so —
# and this is where she stops singing it the way the core taught her.
#
# **The record is about a coast and not about a catalogue.** The dispute is furniture: eleven numbers
# on a sleeve, a question she will not answer, a hall that pays the slow hour at the dancing's rate.
# The subjects are a season with no agreed end to the night, a wall with dancing on the other side of
# it, an instrument that could not go home, and one person saying a thing too late.
#
# **One departure from the card, and it is the wiki's.** b_066's backing line is *none*; Sel Ardin
# sings the answering line on `s_1207` and it is the only track the band has ever ended with two
# voices. The wiki wins (D-092's precedent) and the other six exclude backing vocals outright.
# `s_1205` carries a guest synth-harpsichord the card does not list, which the wiki puts in the room
# and the card does not exclude; the break on it is still the piano's, because §7 gives a break only
# to an instrument the card already names.
#
# `generation:` and every `take:` are empty until M-36.

