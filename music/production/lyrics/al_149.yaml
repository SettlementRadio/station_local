    prompt: >-
      52 BPM warm aching closing slow torch in a wide empty hall; low grainy female lead close and
      dry, one second low female voice entering under her on the closing section only and finishing
      the last line with her, upright piano, upright bass, brushed kit, sustained ending.
    exclude: harmony above the lead, backing vocals before the closing section, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - piano, ten seconds]

      [Verse 1]
      The chairs were upside down on all the tables.
      Rain tapped lightly at the service door.
      You stood with one arm halfway in your coat sleeve,
      looking at the clock above the bar.
      All sealed season I had found a reason:
      too much noise, too many people near.
      Now the wide hall held the two of us,
      four minutes and the thing I would not say.
      You pulled the second sleeve across your shoulder.
      I heard the outer landing call your weight.

      [Verse 2]
      In autumn, by the freight doors, you had asked me
      whether silence meant I wanted you to stay.
      I watched a loader back into the weather.
      I let the warning lamps provide the answer.
      You nodded once, the way a person nods
      when kindness finally costs too much to give.
      Every night since then I made the sentence,
      took it apart, and carried it back home.

      [Refrain]
      Late enough to say it, and I said it,
      and the room was mostly stacked and nearly dark.
      Nobody heard it and it does not matter.
      A thing said late is still a thing said.

      [Bridge]
      The last ferry had already crossed the harbour.
      The relay road was silver under rain.
      If you left, you had to walk till morning.
      If you stayed, I had to use your name.

      [Verse 3]
      I said, "I wanted every hour you offered.
      I was afraid that wanting made a claim.
      I thought a quiet answer would be gentler."
      You said, "A quiet answer hurts the same."
      Then you took your arm back from the coat sleeve
      and laid the coat across the nearest chair.
      No promise came to make the season easier.
      No old mistake dissolved into the air.
      You only stood beside me at the piano,
      close enough that neither voice was spared.

      [Coda - second low female voice enters on line two; both voices sing the last line]
      I was late enough to say I wanted you.
      You were late enough to say you knew.
      The coast can keep the hour without an ending.
      Late enough, and neither of us moved.

      [Outro - two voices and piano sustaining]
