  - id: s_1202
    title: A Coast With No Ferry
    track_number: 2
    mood: [wistful, spacious, patient]
    fact: >-
      Juna Carrow wrote it in her first sealed season, on finding that a coast with no last ferry has
      no hour at which the night is agreed to be over.
    arrangement_note: nothing marks the ends of sections — the piano runs straight through every join, and the break arrives without a cue
    intro: 15
    outro: sustain
    target_duration: "4:15"
    prompt: >-
      48 BPM spacious patient slow torch in a wide empty hall; low grainy female lead close and dry
      with long line ends, upright piano running continuously through every section join and taking a
      sixteen-second break, upright bass, brushed kit, sustained ending.
    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending, drum fills marking section ends
    lyrics: |
      [Intro - piano alone, fifteen seconds]

      [Verse 1]
      Back home, midnight came with one long warning,
      a ferry horn below the window glass.
      Coats rose from their chairs before the echo.
      Every unfinished sentence learned to pass.
      You could stay, but staying was a choice then.
      You could leave and blame the boat and tide.
      Out here, sealed weather holds the harbour.
      No horn divides the ones who leave from those who hide.

      [Refrain]
      A coast without a ferry has no midnight.
      Every hour leans into the next.
      Keep your coat on if you mean to leave me.
      Take it off if leaving can still wait.

      [Verse 2]
      At three, the cleaners passed us without asking.
      At four, the outer lamps went pale.
      You held the cup between your hands for warmth
      and told me half the truth about the inland rail.
      I had one question waiting at my teeth.
      You had an answer neither of us used.
      With no last berth announced across the hall,
      we let the empty morning make the rules.
      Your glove lay open on the table between us,
      palm upward, asking nothing of my hand.

      [Instrumental - upright piano break, sixteen seconds]

      [Verse 3]
      Wet daylight opened slowly through the high panes.
      Freight lights moved like embers on the lane.
      You said, "If there were a boat, I would be on it."
      I said, "There is no boat." You smiled again.
      That was not forgiveness or a promise.
      It was one more hour neither had to name.
      Somewhere beyond the storm, clocks reached the ending.
      Here, the coast kept weather at the gate.
      I leaned across the table till our hands met.
      The room went on. This time I let it stay.

      [Final Refrain]
      A coast without a ferry has no midnight.
      Every hour leans into the next.
      Keep your coat on if you mean to leave me.
      Take it off if leaving can still wait.

      [Outro - piano sustaining]
