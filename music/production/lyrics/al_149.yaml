    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, a four-on-the-floor kick in the band itself, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - keyboards and bass, six seconds]

      [Verse 1]
      There is a wall, and there is a room behind it,
      and there are four hundred people in that room.
      You can feel it in the floor before you hear it.
      You can hear it in the gaps, which is worse.
      We are eleven in here and the lamps are on
      and the hall we have is the hall they finished with.
      That is the arrangement. I agreed to it.
      I would agree to it again tomorrow night.

      [Verse 2]
      He counted off their kick and halved it, flatly,
      standing at the wall with one hand on the plaster,
      and every beat we play lands in their silence
      and every beat they play lands in ours.
      Nobody in either room has noticed.
      It is the single best thing on this record.
      Two bands in one building, in agreement,
      who have never met and never will.

      [Chorus]
      Let them dance. It is a good night for it.
      Let the whole coast go through there and come back.
      We are the half of the evening that is quiet
      and there is no evening without both.

      [Verse 3]
      At about four the wall goes soft and empty
      and the ones who are still upright wander in,
      coats on, glassy, sweating, and enormous,
      and sit down at the back and do not speak.
      Those are the best forty minutes of the week.
      They have had all the noise that they can hold.
      Whatever a person has been carrying since the sealed season
      arrives at about ten past four. And then we play.

      [Chorus]
      Let them dance. It is a good night for it.
      Let the whole coast go through there and come back.
      We are the half of the evening that is quiet
      and there is no evening without both.

      [Outro - keyboards fading, kit last]
