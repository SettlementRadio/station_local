    target_duration: "4:20"
    prompt: >-
      50 BPM glassy hypnotic slow torch in a wide empty hall; low grainy female lead close and dry,
      long sustained plucked electronic string figures underneath from the first bar, upright piano
      taking a fifteen-second break over them, upright bass, brushed kit, sustained ending.
    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - plucked electronic strings alone, twenty seconds]

      [Verse 1]
      Under a sheet beside the service corridor,
      black keys gathered salt from every door.
      Someone had marked a berth upon the casing,
      someone who could not come back for it before.
      All sealed season, strangers passed beside it.
      Wet coats brushed the corners going through.
      Some nights one glassy string would wake from nowhere,
      thin as relay frost and just as blue.
      I began to think the thing was listening,
      waiting for the hands it used to know.
      I knew that kind of waiting all too well.

      [Verse 2]
      The first time we uncovered it, the weather
      pushed hard enough to bow the outer pane.
      I touched one key. A cold note crossed the ceiling
      and held there long after I pulled away.
      It did not fit the room, which made it honest.
      Nothing on this coast fits while it seals.
      We live in borrowed coats and borrowed quarters,
      learning what a temporary shelter feels.

      [Instrumental - upright piano break over the held strings, fifteen seconds]

      [Bridge]
      If the owner hears us through the distance,
      let them hear no claim inside the sound.
      We kept the dust away and used it gently.
      We needed what the storm had left around.

      [Verse 3]
      When the ferry lanes reopen after weather,
      someone will arrive with proper keys.
      They will lift the case and check the corners,
      sign a line, and carry it from me.
      In another hall, beneath a different ceiling,
      every note may shorten, warm, and clear.
      They will never hear the wet inside the plaster.
      They will never know what happened to it here.
      I will miss the sound and not possess it.
      That is something I am learning how to do.

      [Refrain]
      It belongs to someone coming after.
      It was ours the way a season is.
      Hold the note until the glass stops trembling.
      Let it leave without pretending it will stay.

      [Outro - plucked strings sustaining alone]
