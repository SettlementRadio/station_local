    exclude: harmony above the lead, backing vocals before the closing section, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - piano, ten seconds]

      [Verse 1]
      There is an hour that gets things said at last
      and it is later than anybody plans for.
      Not the good hour. Not the one at midnight
      when the room is full and everybody's clever.
      The other one, when the chairs are going up
      and the person you have been not saying it to
      is putting on a coat with their back turned
      and there are about four minutes left of it.
      Everybody has an hour like that somewhere.
      Most people let it go and get their coat.

      [Verse 2]
      She has been at the side of the hall all sealed season,
      arranging other people's voices, quietly,
      and she said one line to me in a corridor in autumn
      that I have thought about most weeks since then.
      I did not answer it. I have not answered it.
      I put her on the end of this instead,
      which is not an answer either, and she knows that,
      and she came in and sang it anyway.

      [Chorus]
      Late enough to say it, and I said it,
      and the room was mostly stacked and nearly dark.
      Nobody heard it and it does not matter.
      A thing said late is still a thing said.

      [Verse 3]
      There will not be another one like this one.
      The storm coast will go on and we will play it
      and this will be the only night with two.
      The band is four and it will stay at four
      and the card says one voice and I agree with it
      and this is the exception and it is the last.
      So when the piano goes down to the last figure
      and the hall out there is empty to the doors,
      there are two of us on the line, and only once,
      and the whole of what it is is that it happened.

      [Coda - the second voice entering, both together on the last line]
      Late enough to say it, and we said it.
      Late enough. And the doors are standing open.

      [Outro - two voices and piano sustaining]
