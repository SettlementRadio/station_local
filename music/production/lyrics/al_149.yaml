    prompt: >-
      68 BPM wry midtempo slow torch in a hall built for dancing; low grainy female lead close and
      dry, compact electric keyboards in place of a piano, upright bass, brushed kit sitting at
      exactly half a dance tempo, faint four-on-the-floor bleeding through a wall in the background
