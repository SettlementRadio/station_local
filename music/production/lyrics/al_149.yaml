    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, fade ending
    lyrics: |
      [Intro - piano and bass, eight seconds]

      [Verse 1]
      Four minutes after meeting, you leaned closer.
      Rain moved silver down the harbour glass.
      You asked me if the core was how they tell it,
      all warm rooms and doors that open fast.
      You asked who stayed, who left, who heard the ending.
      You asked which story people there believe.
      I watched your honest interest cross the table
      and chose the smaller mercy of my smile.

      [Chorus]
      Ask me about the weather on this coast.
      Ask me what the hall is like in a sealed season.
      Ask me anything you want about tonight.
      Ask me about the core, and I will smile.

      [Verse 2]
      The core is one cold landing after midnight,
      wet shoes beside a heater turned too low.
      It is a cup left waiting on a table,
      four bare notes that only two would know.
      It is being young enough to call that everything,
      old enough to know it could not stay.
      None of this is yours for asking kindly.
      None of it grows truer when explained.

      [Instrumental - upright piano break, thirteen seconds]

      [Bridge]
      Some doors close cleanly. Some remain behind you,
      open in the mind and shut in fact.
      Every relay question sends me near one.
      Every small reply would take me back.

      [Verse 3]
      Ask instead how long the freight lane closes,
      where the coast lights vanish in the rain,
      why the final ferry horn means nothing
      when sealed weather holds it in the bay.
      Ask me why I stay until the cleaners,
      why I like the wide hall nearly bare.
      Those are things I may decide to give you.
      They are mine because they happened here.
      You can know me without owning every doorway.
      You can let one country keep its air.

      [Final Chorus]
      Ask me about the weather on this coast.
      Ask me what the hall is like in a sealed season.
      Ask me anything you want about tonight.
      Ask me about the core, and I will smile.

      [Outro - cold stop]
