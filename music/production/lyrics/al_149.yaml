    prompt: >-
      54 BPM cold slow torch in a wide empty hall; low grainy female lead close and dry with air in
      the tone, one section sung flat and strictly in time over upright bass alone, upright piano,
      brushed kit, hard cold stop.
    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, fade ending
    lyrics: |
      [Intro - piano and bass, twelve seconds]

      [Verse 1]
      Eleven numbers reached me from the core,
      clean enough to fit beneath my thumb.
      No weather in them, no rooms, no breathing,
      nothing of the hands they travelled through.
      One was winter with the lane iced over.
      One was heat that buckled the back door.
      One was made while someone I loved was leaving.
      Every number knows a year I cannot prove.
      Put them in a row and they look harmless.
      Read them slowly and the old walls move.

      [Verse 2 - flat, strict time, bass only]
      Nineteen eleven. Nineteen twenty-four.
      Nineteen thirty-one, and thirty-eight.
      Two thousand and six. Two thousand and nine.
      Two thousand and twenty, twenty-one, and two.
      Two thousand and thirty. Two thousand and forty-one.
      Eleven marks beneath a stranger's lock.
      Eleven years still waiting in their cases.
      Eleven doors that do not know my key.

      [Chorus]
      Numbers on the sleeve, nothing underneath them.
      Numbers where the names were meant to be.
      Hold them to the relay light and listen:
      every empty figure carries me.

      [Verse 3]
      A woman sent a message from a ship berth.
      She knew the first, the seventh, and the last.
      She said the fourth had crossed a sealed-season winter
      folded in the lining of her coat.
      She did not ask me who had shut the cases.
      She did not offer comfort or advice.
      She only wrote, "I kept them through the crossing."
      I read that sentence in the hall at night.
      Somewhere what was taken is still moving.
      Somewhere it is warm against a life.

      [Bridge]
      Let the office keep its careful order.
      Let the dust lie evenly and deep.
      What a number holds cannot be counted.
      What a locked door owns it cannot keep.

      [Final Chorus]
      Numbers on the sleeve, nothing underneath them.
      Numbers where the names were meant to be.
      Hold them to the relay light and listen:
      every empty figure carries me.

      [Outro - cold stop]
