    target_duration: "4:05"
    prompt: >-
      70 BPM dry bitter midtempo slow blues torch in a wide hall; low grainy female lead close and
      dry, upright piano answering the end of each chorus with a bare four-note figure and taking a
      thirteen-second break, upright bass, brushed kit, hard cold stop.
    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, fade ending
    lyrics: |
      [Intro - piano and bass, eight seconds]

      [Verse 1]
      Everybody out here asks the same thing
      inside about four minutes of hello.
      They do not mean it badly. It is interest.
      It is the only thing they know about me yet.
      What was it like. Was it as good as they say.
      Did you know him. Were you there at the end.
      I have a face I do now, and I use it,
      and the conversation moves along.

      [Chorus]
      Ask me about the weather on this coast.
      Ask me what the hall is like in a sealed season.
      Ask me anything you want about tonight.
      Ask me about the core, and I will smile.

      [Verse 2]
      He does it for me now, which I have not thanked him for.
      Four notes at the end of every chorus,
      off a song from a record nobody out here has,
      and the four notes are the answer and they are not mine.
      Nobody in the hall knows what they are.
      Two people up the relay road will know.
      That is the correct number of people
      and I would not add one to it if I could.

      [Instrumental - upright piano break, thirteen seconds]

      [Verse 3]
      It was cold and it was late and it was small
      and I was twenty-four and it was everything.
      That is the answer, and it is not sayable,
      and it would not survive being said out loud.
      So it goes in four notes at the end of a chorus
      in a wet hall with the dancing through the wall.
      Ask me about the core and I will smile at you
      and mean it, which is not the same as answering.

      [Chorus]
      Ask me about the weather on this coast.
      Ask me what the hall is like in a sealed season.
      Ask me anything you want about tonight.
      Ask me about the core, and I will smile.

      [Outro - cold stop]
