  room: >-
    A wet coast hall in a sealed season, recorded after the dancing had finished and most of the room
    had gone — wide and empty behind the band, the voice close and dry against it. The card holds:
    low grainy female lead with air in the tone and a small fall at the end of every phrase, upright
    piano taking every instrumental break, upright bass under her without doubling the line, brushed
    kit, and the hall's compact electric keyboards wherever its piano will not hold its tuning, which
    on this record is `s_1203` and `s_1204`. Two tracks are their own. `s_1205` has a guest
    synth-harpsichord that came down in a dance crate and could not go back, held long and glassy
    under everything, with the piano still taking the break over it. And `s_1207` ends on two voices,
    which is the only backing vocal in the band's life.

