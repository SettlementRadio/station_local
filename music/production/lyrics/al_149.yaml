    prompt: >-
      50 BPM glassy hypnotic slow torch in a wide empty hall; low grainy female lead close and dry,
      long sustained plucked electronic string figures underneath from the first bar, upright piano
      taking a fifteen-second break over them, upright bass, brushed kit, sustained ending.
    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - plucked electronic strings alone, twenty seconds]

      [Verse 1]
      It came down in the cargo with the dance kit
      and the crate went back and this did not go with it.
      By then the season had begun to seal
      and a thing in the wrong hall is in the wrong hall.
      A synth-harpsichord in a room like this one
      is not what anybody would have chosen.
      It sat under a sheet in the side corridor
      for eleven weeks and then somebody uncovered it.
      Nobody wrote to ask about it either.
      Nobody up the road appeared to miss it.

      [Verse 2]
      He plays it as if it were owed him, which it is not,
      and he has charged the house for every week it stayed,
      and the house has paid, because the house is careless
      with everything except the dancing nights.
      I do not like him and he does not like me
      and neither of us has ever said so out loud.
      He is the best thing on this side of the record
      and he knows it, and I have not told him.

      [Instrumental - upright piano break over the held strings, fifteen seconds]

      [Verse 3]
      There is a way of using what is in the room
      that is not the same as wanting it.
      I did not want this. I do not want it now.
      But it is here and it is cold and it goes on forever
      and the hall behind it has the wet in the plaster
      and it holds a note the way this coast holds weather.
      When the season lifts, the crate will come and take it.
      Whoever gets it next will get a different thing.
      It will not sound like this in a dry hall.
      It will not sound like this anywhere but here.

      [Refrain]
      Somebody else's, and it is going back.
      Somebody else's, and it made this record.
      I will not ask the house to buy it for me.
      I will remember exactly how it sounded.

      [Outro - plucked strings sustaining alone]
