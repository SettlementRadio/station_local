    title: Numbers on the Sleeve
    track_number: 1
    mood: [cold, wry, slow]
    fact: >-
      The eleven numbers Juna Carrow sings are the Lower Bell catalogue numbers of the records she
      cannot get back, in the order the receiver listed them.
    arrangement_note: the eleven numbers are sung in strict time with only the bass under them, flat and without expression, and the band comes back in on the line after
