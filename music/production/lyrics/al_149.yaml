    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, fade ending
    lyrics: |
      [Intro - piano and bass, twelve seconds]

      [Verse 1]
      There is a list in an office in the core
      with eleven lines on it and all of them are mine.
      Not mine in law. I want to be exact.
      Mine in the sense that I am on all eleven.
      A man I have never met has put them in an order
      and the order is the order they were made in,
      and he has done that carefully and well,
      and he will never hear a bar of any one.

      [Verse 2]
      Nineteen eleven. Nineteen twenty-four.
      Nineteen thirty-one, and thirty-eight.
      Two thousand and six. Two thousand and nine.
      Two thousand and twenty, twenty-one, and two.
      Two thousand and thirty. Two thousand and forty-one.
      That is all of them. That is the whole shelf.
      Eleven numbers and a lock and a receiver
      and the man who dusts the top box every week.

      [Chorus]
      So I put the numbers on the sleeve.
      Nothing else on the back of it at all.
      If they will not press them I will print them,
      and whoever wants to look them up can look.

      [Verse 3]
      The house here asked me what I wanted on it.
      I said eleven numbers and no words.
      They said that people would not understand it.
      I said that some of them would understand it well.
      It went out up the relay in the autumn
      to rooms I will not see across the lag,
      and a woman in the core wrote to the shipboard press
      to say she had them all and had them still,
      and had bought the last one twice, in different halls,
      and would I like to know which two they were.

      [Chorus]
      So I put the numbers on the sleeve.
      Nothing else on the back of it at all.
      If they will not press them I will print them,
      and whoever wants to look them up can look.

      [Outro - cold stop]
