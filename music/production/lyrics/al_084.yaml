  - id: s_0687
    title: Past the End of the Route
    track_number: 2
    mood: [rolling, hopeful, midtempo]
    fact: >-
      Written about the record itself reaching settlements the band had never worked, and Wend Amory
      recorded the vocal before knowing whether it would.
    arrangement_note: the tune opens out at every chorus rather than tightening, with the guitar moving up and the fiddle staying where it is, which is the only place on the record the arrangement gets bigger instead of harder
    intro: 8
    outro: fade
    target_duration: "4:05"
    prompt: >-
      140 BPM hopeful skiffle reel; low dry male bass-baritone, female chorus, widening arrangement, fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, crate percussion, boxy dead room, cold ending
    lyrics: |
      [Intro - guitar, eight seconds]

      [Verse 1]
      A clerk wraps one fresh copy in a square of cargo paper,
      writes a settlement four stops beyond our far-end hall.
      I have watched its lights go under us and never stood there.
      We have no berth, no freight crew waiting, no familiar gate.
      The new press is supposed to make the distance smaller.
      Nobody in this transfer hall can swear that it will work.
      The clerk ties off the parcel and sets Thursday by the name.

      [Chorus]
      Past the end of the route and out the other side,
      into one more room where none of us has worked.
      Seventeen years of two known halls and one known hold,
      now a little pressed thing travels farther than we do.
      Past the end of the route, if the Thursday run gets through.

      [Verse 2]
      Everything we move, we count ourselves and hand across.
      We know the loading strap, the pilot, and the time it leaves.
      This small parcel rides beneath somebody else's manifest,
      changes hands at sidings where our names mean nothing yet.
      Maybe someone drops it. Maybe rain gets through the wrapping.
      Maybe one night, four stops down, a hall clerk opens it,
      and hears Col's crooked bow before she knows his face.

      [Turnaround - fiddle alone, four bars]

      [Verse 3]
      Ilsa says a manifest has always done exactly this:
      told a stranger what a hold contained after the hold was gone.
      I say lists do not dance. She knots the parcel tighter.
      "Neither do you," she says, and Col nearly drops the case.
      Reddin signs the corner where the shipping clerk has pointed.
      I touch our four small names and take my hand away.
      The Thursday carrier loads it underneath a coil of wire.

      [Chorus]
      Past the end of the route and out the other side,
      into one more room where none of us has worked.
      Seventeen years of two known halls and one known hold,
      now a little pressed thing travels farther than we do.
      Past the end of the route, if the Thursday run gets through.

      [Final Chorus - harmony from the bass chair]
      Past the end of the route and out the other side,
      past our contacts, past the lanes our own work knows.
      If it comes to nothing, Thursday brings another load.
      If it reaches one warm room, we may never hear of it.
      The carrier shuts the door. The little parcel goes.

      [Outro - fade]
