    lyrics: |
      [Intro - bass and fiddle, ten seconds]

      [Verse 1]
      Ilsa wrote the low part of this about nine years ago
      in a key that suited her voice and not the fiddle,
      and at some point somebody wrote a chart for it
      and moved it up a tone to make the fiddle easier.
      Nobody remembers who. It has been played that way since.
      Every one of us had forgotten there was another one.

      [Chorus]
      Hold the low end. That is the entire instruction.
      Everything above it can go where it wants to go.
      Somebody has to be the floor of this arrangement.
      Nobody ever thanks the floor and the floor knows.

      [Verse 2]
      Oren Saye came in for one afternoon off a route
      and read the chart once and put it down on the stand
      and played the whole thing a tone below what was written,
      and when we stopped he said, this is her key, isn't it.
      He had played on something of hers about eleven years back.
      He had heard it once, in a hall, and he had it.

      [Chorus]
      Hold the low end. That is the entire instruction.
      Everything above it can go where it wants to go.
      Somebody has to be the floor of this arrangement.
      Nobody ever thanks the floor and the floor knows.

      [Verse 3]
      There is no harmony on this one, which is not an accident.
      Ilsa is not on it. She would not play her own key
      with a man who had never met her getting it right first time,
      and went out to the berth and came back when it was done.
      She has not said anything about it since and she will not.
      It is the best track on the record and she is not on it.

      [Final Chorus - no harmony, lead alone]
      Hold the low end and let the rest of it argue.
      Somebody has to be the floor of this arrangement.
      Nobody ever thanks the floor and the floor knows,
      and the woman who wrote this floor was out at the berth.

      [Outro - fade]
