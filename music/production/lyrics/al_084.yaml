  room: >-
    A transfer hall rather than a loaded hold, for the first time in this band's life, with a roof
    that leaked during the sessions. The card holds — low bass-baritone lead under the fiddle and
    never lifted, one female harmony from the bass chair on choruses, fiddle taking every break, bass
    big and woody, slapback short — but the boxy dead hold is gone and there is room around the band
    on every track. Four fact-bound details live in their own songs: Reddin Vosk's loose-fittings
    figure is played on an actual drum kit on s_0686 for the first time in seventeen years; Nessa Dray
    plays a second fiddle against Col Sennet on s_0689 and lends him nothing; Oren Saye plays bass on
    s_0690 in Ilsa Brack's original key rather than the band's written one, and Brack is not on that
    track; and s_0691 changes room tone halfway through because the band moved three times in one
    night under a leaking roof. All four members sing in unison on s_0692, which is the only place
    this band has more than one voice.

