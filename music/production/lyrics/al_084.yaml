  - id: s_0688
    title: A Room With Doors
    track_number: 3
    mood: [warm, midtempo, wry]
    fact: >-
      The title is what Ilsa Brack called the transfer hall, having spent seventeen years recording in
      places you could not leave.
    arrangement_note: the quietest and most spacious thing the band has recorded, with everything sitting further apart than on any hold record, because the room is the joke and the joke needs the room to be audible
    intro: 6
    outro: fade
    target_duration: "3:50"
    prompt: >-
      128 BPM warm roomy reel; low dry male bass-baritone, female chorus, sparse brushed kit, soft fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, crate percussion, boxy dead room, dense or compressed mix, cold ending
    lyrics: |
      [Intro - band, six seconds]

      [Verse 1]
      Ilsa walked in first and stopped beneath the leaking sign,
      looked from the north door to the loading door behind us.
      For fifteen quiet seconds she said nothing to the room.
      Then, mostly to the bass case, "You can walk out of this one."
      Seventeen years inside a loaded hold had taught us one exit,
      usually shut behind the cargo, usually someone else's choice.
      She put the bass down halfway from both doors and smiled.

      [Chorus]
      A room you can leave. Imagine that. A room you can leave.
      Two working doors and neither one is blocked.
      Step outside for air, come back when you are ready.
      Nobody with a manifest decides when it is locked.
      A room you can leave, and still choose to come back in.

      [Verse 2]
      Reddin set the snare too far from Ilsa on the first day.
      Col kept walking backward till the fiddle sounded thin.
      I could not feel the bass through all that open floor between us.
      Every count arrived with half a breath too much around it.
      We drew chalk marks where our boots had stood inside the hold,
      moved them out one board at a time, then tried the turn again.
      By evening, four small islands found a way to share the air.

      [Verse 3]
      Reddin hated both the doors and said they spoiled the bottom.
      Two days later, he was telling us where each should stay.
      Col did not notice. Col can miss a bulkhead if the tune is good.
      Ilsa walked outside three times and came back with hot tea.
      I stood beneath the north frame on the second evening,
      saw our berth lights through the rain beyond the transfer gate,
      and felt no hand behind me waiting to seal the hatch.

      [Chorus]
      A room you can leave. Imagine that. A room you can leave.
      Two working doors and neither one is blocked.
      Step outside for air, come back when you are ready.
      Nobody with a manifest decides when it is locked.
      A room you can leave, and still choose to come back in.

      [Final Chorus - harmony from the bass chair]
      A room you can leave, and Ilsa noticed first.
      Seventeen years with cargo pressed against the only hatch.
      Step outside for air; leave both doors standing open.
      Hear the bass come through the gap and choose to turn back.
      A room you can leave, and four people staying late.

      [Outro - fade]
