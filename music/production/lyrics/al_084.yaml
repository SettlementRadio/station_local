  - id: s_0691
    title: Weather at the Transfer
    track_number: 6
    mood: [cold, restless, quick]
    fact: >-
      The hall's roof was leaking during the sessions and the band moved three times in one night,
      which is why the track changes room tone halfway through.
    arrangement_note: the room tone changes audibly in the middle of the track because the band physically moved to a drier corner of the hall between two verses, and the take was kept rather than restarted
    intro: 4
    outro: fade
    target_duration: "3:40"
    prompt: >-
      158 BPM restless reel; low dry male bass-baritone, female chorus, room shifts, water drips, fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, consistent room tone, crate percussion, cold ending
    lyrics: |
      [Intro - band, four seconds]

      [Verse 1]
      Water finds the north corner ten minutes after dark.
      First one drop beside the snare, then six across the floor.
      Ilsa sets a bucket down without releasing the bass line.
      Reddin shifts the kick two boards and keeps the figure running.
      Col moves under the loading sign; I follow with the lead.
      At ten, the first dry corner has a silver line of rain.
      We lift the cables, count to four, and move again.

      [Chorus]
      Weather in the transfer hall and weather on the coast
      with a settlement's storm season pressing on the roof.
      Move the bass, move the kit, keep the fiddle off the water.
      Sunday has a loaded run. Tonight we find the dry.

      [Verse 2 - the room changes here]
      Near midnight, the third corner fails above the fiddle.
      Col tucks bow and case beneath his arm and crosses fast.
      Ilsa walks the bass; I drag the stand; Reddin rolls the floor tom.
      We settle by the east wall close enough to share one lamp.
      Here the roof is lower and every wooden note comes back.
      The fiddle stands in front of me instead of at my shoulder.
      Four wet coats steam beside the last dry stack of cargo.

      [Chorus]
      Weather in the transfer hall and weather on the coast
      with a settlement's storm season pressing on the roof.
      Move the bass, move the kit, keep the fiddle off the water.
      Sunday has a loaded run. Tonight we find the dry.

      [Verse 3]
      I used to curse the sealed hold and its one narrow hatch,
      cargo at my elbow, warm breath coming straight back.
      But somebody checked that hull before we left the berth.
      Somebody signed the joints and put a number by the seal.
      This transfer roof belongs to everyone and therefore no one.
      Rain has reached my boot; the final bucket overflows.
      Seventeen years inside a box, and now I miss the box.

      [Final Chorus - harmony from the bass chair]
      Weather in the transfer hall and weather on the coast,
      four full buckets, four wet coats, one corner left.
      Move the bass, move the kit, keep the fiddle off the water.
      Hold the east wall till the final long note fades.
      Sunday has a loaded run and one dry roof below.

      [Outro - fade]
