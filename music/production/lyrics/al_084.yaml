  - id: s_0689
    title: Two Bows on One Tune
    track_number: 4
    mood: [fast, competitive, bright]
    fact: >-
      Nessa Dray plays against Col Sennet and lent him neither of her bows, which he mentioned in every
      interview about the record for the next decade.
    arrangement_note: two fiddles at once, one trained and one not, and neither of them gives an inch anywhere in the track, with the break traded between them in four-bar exchanges that get shorter as it goes
    intro: 16
    outro: sustain
    target_duration: "4:25"
    prompt: >-
      166 BPM competitive reel; low dry male bass-baritone, two clashing fiddles, short trades, held end.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, matched or unison fiddles, crate percussion, fade-out, cold ending
    lyrics: |
      [Intro - two fiddles, sixteen seconds]

      [Verse 1]
      Col met Nessa Dray beside the north door second morning.
      She had two good bows laid straight inside an open case.
      His own hair hung in gaps and one loose strand kept catching.
      He pointed to the spare and asked if he could use it once.
      Nessa looked at his worn bow, then looked him in the face.
      "No," she said, not cruelly, and carried both inside.
      Col stood in the doorway like the weather had accused him.

      [Chorus]
      Two bows on the one tune and one of them is better
      and everybody knows which; nobody will say it.
      Four bars, four bars, two bars, two bars, one.
      One clean hand, one crooked hand, and neither giving ground.

      [Instrumental - two fiddles trading, shortening exchanges, twenty seconds]

      [Verse 2]
      Halfway through the break, her clean note crossed his rough one.
      He leaned late; she climbed above; he caught her on the turn.
      At supper Nessa said, "A bow becomes a person's hand.
      You do not lend your hand because another wore his through."
      She named a repairer three stops down the relay road.
      Col asked the price. She said it cost four working days.
      He wiped his own old bow and did not ask again.

      [Chorus]
      Two bows on the one tune and one of them is better
      and everybody knows which; nobody will say it.
      Four bars, four bars, two bars, two bars, one.
      One clean hand, one crooked hand, and neither giving ground.

      [Verse 3]
      Sunday, Nessa buckled both good bows inside the case.
      Her berth call sounded while the rain came through the roof.
      Col carried one end of her trunk as far as the relay gate.
      She asked if he would send the old bow down for proper hair.
      He said the loose strand only caught when he was showing off.
      She said, "You show off every night," and shouldered up the case.
      At the gate they played one final bar against the weather.

      [Final Chorus - harmony from the bass chair]
      Two bows on the one tune, and both good bows leave Sunday.
      Four bars, four bars, two bars, two bars, one.
      One clean hand, one crooked hand, and neither giving ground.
      Nessa takes the relay. Col keeps every fraying strand.
      Both hold one long note before the transfer doors shut.

      [Outro - one long note held by both fiddles]
