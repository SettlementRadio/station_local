      [Intro - fiddle and chimes, fourteen seconds]

      [Verse 1]
      There is a run out on Sunday and all four of us are on it
      and that has been true for seventeen years without a gap.
      We have not stopped once to make a record. Not once.
      Every one of these was cut in a week we were not working
      and every week we were not working was a week unpaid,
      which is the whole economics of this band in two lines.

      [Chorus]
      Still on the route, and still going out on Sunday.
      Nobody here has ever done this for a living.
      A band is what four people do with the time between,
      and the time between is not very much time.

      [Verse 2]
      The co-operative had a members' meeting in the hall
      on the last afternoon, which nobody planned,
      and about forty of them stayed on afterwards to watch,
      and they are on this track, standing, not saying much.
      They are the label. That is not a figure of speech.
      Every one of them owns a piece of this record.

      [Instrumental - fiddle break, sixteen seconds]

      [Verse 3]
      So all four of us sang the end of it, together, flat,
      which we have never done and are not going to do again,
      because Ilsa sings and the rest of us make a noise
      and putting the four of us on one line is a decision.
      It is not good singing. It was not meant to be.
      It is four members of a co-operative facing forty more.

      [Chorus - all four in unison]
      Still on the route, and still going out on Sunday.
      Nobody here has ever done this for a living.
      A band is what four people do with the time between,
      and the time between is not very much time.

      [Final Chorus - all four in unison, the room audible]
      Still on the route, and the hold is loaded Saturday,
      and there is a hall at the far end and we will be at it.
      A band is what four people do with the time between.
      Seventeen years. Sunday. Same berth. Same four.

      [Outro - held chord]
