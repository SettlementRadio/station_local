songs:
  - id: s_0686
    title: Everything Not Tied Down
    track_number: 1
    mood: [fast, bright, driving]
    fact: >-
      The opening figure is the one Reddin Vosk had been playing on loose fittings for seventeen
      years, transcribed for a real kit for the first time.
    arrangement_note: the figure that opened every dance this band ever played arrives on an actual drum kit instead of on a hold's loose fittings, which is either the record's best idea or its worst depending on who in the band is asked
    intro: 12
    outro: cold
    target_duration: "3:55"
    prompt: >-
      164 BPM bright skiffle reel; low dry male bass-baritone, female chorus, real kit figure, cold stop.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, crate percussion, boxy dead room, fade-out
    lyrics: |
      [Intro - drum figure and fiddle, twelve seconds]

      [Verse 1]
      The co-operative rolled a proper kit across the transfer floor,
      kick, two toms and polished snare, each one inside a case.
      Reddin walked around it twice and would not take his coat off.
      Seventeen years his opening lived on hatch cover and chain.
      Four hundred dancers knew the figure by the second bar,
      but no one knew where either hand was meant to fall.
      He set his two old sticks across the shining snare and breathed.

      [Chorus]
      Everything not tied down is going to move,
      so choose the wall, leave room, and know which strap can take it.
      You cannot stop a cargo when the whole deck turns beneath it.
      You decide which way it travels, then you let it go.
      Everything not tied down, including us, will move.

      [Verse 2]
      First the kick took what the crate had always swallowed.
      Then the snare threw every crooked little stroke across the hall.
      Col came in too early, laughed, and started from the top.
      Ilsa felt the cleaner bottom through the boards beneath her bass.
      It carried farther than the chain had ever carried,
      past the loading gate to workers stacking freight outside.
      Reddin played it once, then checked the cart to find his chain.

      [Verse 3]
      At closing, someone laid a grey sheet over all the drums.
      The proper kit belonged to everybody, which meant it stayed.
      Our hatch cover waited nine days down the relay road.
      Our coupling ring and stripped wire waited in the hold.
      Reddin coiled the old chain underneath his travelling case,
      left the polished snare asleep beside the transfer wall,
      and said, "A better tool is good. It does not make it mine."

      [Chorus]
      Everything not tied down is going to move,
      so choose the wall, leave room, and know which strap can take it.
      You cannot stop a cargo when the whole deck turns beneath it.
      You decide which way it travels, then you let it go.
      Everything not tied down, including us, will move.

      [Final Chorus - harmony from the bass chair]
      Everything not tied down is going to move,
      polished snare or length of chain or case beside the door.
      You cannot stop a cargo when the whole deck turns beneath it.
      Reddin counts us in and lets the new kit carry.
      Then he lifts the old chain with us when we go.

      [Outro - cold stop]
