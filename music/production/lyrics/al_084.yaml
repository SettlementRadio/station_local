    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, crate percussion, boxy dead room, dense or compressed mix, cold ending
    lyrics: |
      [Intro - band, six seconds]

      [Verse 1]
      Ilsa walked in on the first morning and stood still
      and looked at the far wall for about a quarter of a minute
      and said, to nobody, that it was a room you could walk out of,
      and then went and put the bass down and said nothing else.
      Seventeen years of making records in a hold.
      A hold has one way out and it is not usually open.

      [Chorus]
      A room you can leave. Imagine that. A room you can leave.
      Two of them, at either end, and both of them work.
      You can go out for air in the middle of a take
      and come back in, and the take is still there.

      [Verse 2]
      It sounds like a small thing and it is not a small thing.
      You play differently in a room you cannot get out of.
      Everything is a bit tighter and a bit more urgent
      and nobody ever says why, and everybody knows why.
      Take that away and the band came apart for two days
      and had to learn to play in a place with no pressure on it.

      [Verse 3]
      Reddin hated it. Reddin has hated every good thing
      that has ever happened to this band, on principle, for a week,
      and then quietly decided it was his idea all along.
      Col did not notice. Col has never noticed a room.
      I stood in one of the doorways on the second night
      and could see the berth from it, and that was new.

      [Chorus]
      A room you can leave. Imagine that. A room you can leave.
      Two of them, at either end, and both of them work.
      You can go out for air in the middle of a take
      and come back in, and the take is still there.

      [Final Chorus - harmony from the bass chair]
      A room you can leave, and a woman who noticed first,
      after seventeen years of being sealed in with the cargo.
      You can go out for air in the middle of a take.
      Nobody in this band has ever been able to do that.

      [Outro - fade]
