      because there was nothing to write and nobody to write it for.
      Then a man from the co-operative brought a kit into the room
      and asked him, politely, whether he could do it on that.

      [Chorus]
      Everything not tied down is going to move,
      and the ones who know that load a hold in a certain way.
      You do not stop things moving. That is not the trade.
      You decide in advance which way you would like them to go.

      [Verse 2]
      He could. Obviously he could. He did it in one.
      And it is cleaner and it is louder and it carries,
      and every person who has heard both of them says the same:
      the new one is better and the old one was ours.
      Both of those are true and neither is worth arguing.
      He has kept the chain. It is on the cart. It is coming back.

      [Verse 3]
      What the co-operative bought was the shared press format
      and what the shared press format buys is other people,
      settlements down the lane that we have never worked
      hearing a figure a man invented in a hold in eighty-three.
      That is not nothing. That is a very great deal.
      It cost us the crates and I am still deciding about it.

      [Chorus]
      Everything not tied down is going to move,
      and the ones who know that load a hold in a certain way.
      You do not stop things moving. That is not the trade.
      You decide in advance which way you would like them to go.

      [Final Chorus - harmony from the bass chair]
      Everything not tied down is going to move,
      including four people who were doing very well as they were.
      You do not stop things moving. That is not the trade,
      and this one is moving, and we are on it, and here we go.

