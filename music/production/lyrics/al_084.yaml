    lyrics: |
      [Intro - band, four seconds]

      [Verse 1]
      There is water coming through the roof at the north corner
      and it has been coming through the roof for about a decade
      and the transfer hall is not going to be repaired this year
      because the cargo it holds does not mind and people do not stay.
      We are people. We stayed. There were buckets by ten.
      By midnight there were four of them and we had moved twice.

      [Chorus]
      Weather in the transfer hall and weather on the coast
      and a roof with a settlement's worth of storm season on it.
      Move the bass. Move the kit. Move it all again.
      Nobody is stopping. There is a run out on Sunday.

      [Verse 2 - the room changes here]
      There. That is the third move and you can hear it happen.
      Everything gets slightly closer and slightly drier
      and the fiddle is suddenly in front instead of beside
      and the take carried on because nobody wanted to lose it.
      The co-operative asked whether we would do it clean.
      We have been asked that before. The answer is the same.

      [Chorus]
      Weather in the transfer hall and weather on the coast
      and a roof with a settlement's worth of storm season on it.
      Move the bass. Move the kit. Move it all again.
      Nobody is stopping. There is a run out on Sunday.

      [Verse 3]
      A hold never leaked. That is the one thing about a hold.
      Whatever else is wrong with it, and a great deal is,
      the roof is somebody's whole professional responsibility
      and it is checked before every run by a person with a list.
      Nobody checks a transfer hall. Nobody owns it enough.
      Seventeen years in a sealed box and I miss the box.

      [Final Chorus - harmony from the bass chair]
      Weather in the transfer hall and weather on the coast,
      and four buckets and a band in a different corner.
      Move the bass. Move the kit. Move it all again,
      and get it down before the north end gives up entirely.

      [Outro - fade]
