    lyrics: |
      [Intro - guitar, eight seconds]

      [Verse 1]
      There is a settlement about four stops past our far end
      that I have flown over and never once stood in
      and there is going to be a copy of this in a rack there
      in about a season, if the format does what they say.
      I am singing this before anybody knows whether it works.
      That is a strange thing to do and I have done it anyway.

      [Chorus]
      Past the end of the route and out the other side,
      to rooms with our tunes in them and none of us in the room.
      Seventeen years of two halls and a hold in between
      and now a thing with our names on going somewhere on its own.

      [Verse 2]
      A record is a strange object for a crew to make.
      Everything else we have ever done, we were there for.
      You load it, you sign it, you take it, you hand it over.
      This one goes off on its own and does the work itself
      and arrives somewhere we have no berth and no contact
      and starts a conversation we are not part of.

      [Turnaround - fiddle alone, four bars]

      [Verse 3]
      Ilsa says that is exactly what a manifest does
      and has done for four hundred years, and she is right,
      and I said a manifest is not a tune, and she said
      it is a list of what was in the hold and so is this.
      There is no arguing with her when she is like that.
      There is a copy going out on the Thursday run.

      [Chorus]
      Past the end of the route and out the other side,
      to rooms with our tunes in them and none of us in the room.
      Seventeen years of two halls and a hold in between
      and now a thing with our names on going somewhere on its own.

      [Final Chorus - harmony from the bass chair]
      Past the end of the route and out the other side,
      and if it comes to nothing we will have lost a fortnight.
      Seventeen years of two halls and a hold in between.
      Somebody four stops down is going to put it on.

      [Outro - fade]
