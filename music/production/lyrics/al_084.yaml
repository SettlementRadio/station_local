  - id: s_0690
    title: Hold the Low End
    track_number: 5
    mood: [deep, driving, plain]
    fact: >-
      Oren Saye played it after one run-through and remembered Ilsa Brack's original key when the band
      had written the chart in another.
    arrangement_note: a different bass player, in the key the song was written in rather than the one on the chart, and no harmony voice anywhere on the track because the woman who sings it is not on it
    intro: 10
    outro: fade
    target_duration: "4:00"
    prompt: >-
      150 BPM deep skiffle reel; low dry male bass-baritone alone, round guest upright bass, roomy fade.
    exclude: harmony vocals, backing vocals, second voices, electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, crate percussion, cold ending
    lyrics: |
      [Intro - bass and fiddle, ten seconds]

      [Verse 1]
      Ilsa made the low line nine years back inside a winter hold,
      set it where her voice sat warm beneath the scrape of Col's old bow.
      Someone later copied it and raised the ink one tone,
      easier for the fiddle, wrong for where the floor began.
      The paper travelled with us till the error looked official.
      Ilsa read it in the transfer hall and shut the bass case hard.
      She said, "If that is what you wrote, find someone else to hold it."

      [Chorus]
      Hold the low end. That is the entire instruction.
      Let the fiddle climb; let every loose thing argue.
      Somebody has to be the floor beneath the cargo.
      Nobody thanks the floor. The floor still bears the load.

      [Verse 2]
      Oren Saye came off a midday relay with a borrowed bass.
      He read the chart one time, then set the paper face down.
      On the second pass he dropped the opening a tone.
      Every board beneath us found the weight it had been missing.
      "This was Ilsa's key," he said, before we asked him why.
      Eleven years before, he heard her play it at a port hall,
      once through, after midnight, with a freight crew at the door.

      [Chorus]
      Hold the low end. That is the entire instruction.
      Let the fiddle climb; let every loose thing argue.
      Somebody has to be the floor beneath the cargo.
      Nobody thanks the floor. The floor still bears the load.

      [Verse 3]
      Ilsa heard the lower opening from outside the north door.
      She stayed beside the berth lights till the final turn was done.
      Oren wiped the borrowed strings and waited by the case.
      When she came back in, he offered her the chart face down.
      She left the paper where it was and checked the tuning peg.
      "Third note drags," she said. He nodded. "Yours did too."
      She almost smiled, then took her coat and carried in the bass.

      [Final Chorus - no harmony, lead alone]
      Hold the low end and let the rest of it argue.
      Somebody has to be the floor beneath the cargo.
      Nobody thanks the floor. The floor remembers weight.
      Oren has the old key; Ilsa has the harder silence.
      One low voice above them, with no answer coming in.

      [Outro - fade]
