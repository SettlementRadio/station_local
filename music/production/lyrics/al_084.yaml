    lyrics: |
      [Intro - two fiddles, sixteen seconds]

      [Verse 1]
      He asked her for a bow. That is the whole story.
      She had two in the case and she was using one of them
      and his has been rehaired about four times too often
      and he asked, at the door, on the second morning, and she said no.
      Not unkindly. Not rudely. She said no and went in.
      He has told that story in every interview for a decade.

      [Chorus]
      Two bows on the one tune and one of them is better
      and both of us know which and neither of us will say it.
      Four bars, four bars, two bars, two bars, one.
      That is a conversation and not one of us is being polite.

      [Instrumental - two fiddles trading, shortening exchanges, twenty seconds]

      [Verse 2]
      What she actually said, later, in the transfer hall,
      is that a bow is a person's hand and you do not lend a hand,
      and that if his was worn out then he should have it done,
      and that she would tell him where, and she did, and he has not.
      Col thinks she was making a point about training.
      She was making a point about a rehair costing four days' work.

      [Chorus]
      Two bows on the one tune and one of them is better
      and both of us know which and neither of us will say it.
      Four bars, four bars, two bars, two bars, one.
      That is a conversation and not one of us is being polite.

      [Verse 3]
      She goes out on Sunday down the relay road to somewhere else
      and there is a session player's whole life in one sentence:
      four days here, nine days on a run, a hall, a berth,
      forty bands who will all say she made their record.
      He will still be here. He will be here in thirty years.
      Both of those are careers. Only one of them is ours.

      [Final Chorus - harmony from the bass chair]
      Two bows on the one tune, and the good one leaves on Sunday.
      Four bars, four bars, two bars, two bars, one.
      That is a conversation and not one of us is being polite,
      and he is going to be talking about it until he stops.

      [Outro - one long note held by both fiddles]
