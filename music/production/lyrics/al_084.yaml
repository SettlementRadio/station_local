# al_084 — Everything Not Tied Down · Loose Cargo (b_039) · Common Wake Cooperative · 2600 · 7 songs
#
# Written by M-24. **The file shape is fixed by al_001.yaml — read that header once.** Production
# vocabulary (COMMISSION.md §8): never enters the wiki, never said on air. Lyrics written by hand;
# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# **The record that left the route.** The shared press format reached the co-operative in 2600 and
# Loose Cargo were the first band it put through it, so for the first time a record of theirs went
# past the two halls it was made for. They also came out of the hold: this was cut in a transfer hall,
# because the co-operative finally had somewhere to put them. Wend Amory has always said the band
# lost something in the move and it sold four times what the first one did, and both of those are
# true at once, which is what this album is about.
#
# The prompts change with the room. **No hold anywhere on this record** — the kit is a real kit for
# the first time on s_0686, the crates are gone, and there is space around the band that al_083 does
# not have. What does not change is the card: low bass-baritone under the fiddle, never lifted into a
# brighter key, one female harmony from the bass chair on choruses.
#
# Two session players are in the arrangement notes as guests, not members — Nessa Dray's second
# fiddle on s_0689 and Oren Saye's bass on s_0690, where Ilsa Brack does not play at all. **s_0692 is
# the one place the backing line bends**, and the wiki is why: all four of them sing on it because
# the co-operative's members were in the room. It is four voices in unison, not a harmony stack, and
# the exclude line says so.
#
# Two of the seven take a fiddle break. `generation:` and every `take:` are empty until M-33.

