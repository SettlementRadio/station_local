  - id: s_0692
    title: Still Working the Route
    track_number: 7
    mood: [warm, communal, midtempo]
    fact: >-
      Recorded on the last day before the crew went back to work, and all four of them are singing
      because the co-operative's members were in the room.
    arrangement_note: all four members sing the last two choruses in flat unison rather than in harmony, which happens nowhere else in this band's life, and the room they are singing to is a co-operative meeting that came to watch
    intro: 14
    outro: sustain
    target_duration: "4:30"
    prompt: >-
      144 BPM communal reel; low male bass-baritone, four rough unison voices, fiddle break, held end.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, stacked or blended harmony, choir, crate percussion, cold ending
    lyrics: |
      [Intro - fiddle and chimes, fourteen seconds]

      [Verse 1]
      Sunday has a loaded run and all four names are on it.
      Ilsa checks the manifest; Reddin coils the transfer rope.
      Col has packed the fiddle twice and opened it again.
      Seventeen years, no missed departure, no abandoned cargo.
      The berth call waits on Saturday beside our four work coats.
      Tonight the co-operative fills the hall with folding chairs.
      Tomorrow we return the key and take the relay east.

      [Chorus]
      Still on the route, and still going out on Sunday.
      Same four names beneath the same departing load.
      We found a wider room; we did not leave the freight road.
      Still on the route, with one free night to spend.

      [Verse 2]
      Forty members finish votes on roof sheets, ink and wages.
      Nobody folds a chair. They turn them toward the floor.
      A woman from the night desk asks if wider roads come next.
      A loader by the gate asks who will take our Sunday cargo.
