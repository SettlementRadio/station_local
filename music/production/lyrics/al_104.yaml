# al_104 — Second Shift Blues · Undershore Local (b_048) · Relay Road Import · 2607 · 7 songs · album
#
# Written by M-25. **The file shape is fixed by al_001.yaml — read that header once.** Production
# vocabulary (COMMISSION.md §8): never enters the wiki, never said on air. Lyrics written by hand;
# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# The band's second and last record, cut in 2606 across four nights in the same Europa canteen and
# issued at the road head in 2607. **The shift pattern that ended the band is the reason it took four
# nights spread over a season to make a record of seven songs**, and it is written into `s_0850`,
# which was recorded on one of the two nights a month the pattern left all four of them off duty.
# Undershore Local knew this was the last one while they were making it and said so on the sleeve in
# one line, without explanation; `s_0855` is that line at length, and the last sound on it is the
# yard gate, which has never been locked and is on the take anyway.
#
# **`s_0853` is the one song in this band's life that Hob Venner is not on** — he was on shift and
# came in after it was finished, so Tel Brask sings the lead from the harmonica chair, and there is
# no guitar on the track at all because the guitar was on the second shift. b_048's card had already
# said this song would happen — *"on one song in the band's life he takes the lead"* — and this is
# it. The exclude line keeps the usual gravel baritone and the guitar out rather than leaving either
# to chance (D-096).
#
# Saira Dunn arranged everything here including the harmonica parts, and plays throughout in gloves
# with the fingers cut off, which is audible on the keys on every track and is the subject of
# `s_0851`. As on al_103, every exclude line keeps a bass out: this band has never had one.
#
# `generation:` and every `take:` are empty until M-34.

