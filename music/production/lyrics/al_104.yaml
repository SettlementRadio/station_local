  room: >-
    The same Europa under-ice works canteen as al_103, cut across four nights spread over a season
    because that is how often the shift pattern put all four of them off duty at once, and after
    midnight every time, when the heating had gone off. Hard cold room, tape hiss, one take, no
    overdubs, no bass anywhere in the band, kit still with no cymbals. The card holds: male gravel
    baritone that tires across a take and drops to plain speech at the ends of lines, one blunt male
    second voice from the harmonica chair on choruses. Two things are this record's own. Saira Dunn
    plays in cut-off gloves and the wool is audible on the keys on every track, worst on s_0851 where
    the lyric names it. And s_0853 has neither the lead voice nor the guitar on it, because both
    belong to a man who was on shift — Tel Brask sings it and plays the horn, which is one job too
    many and audibly so.

