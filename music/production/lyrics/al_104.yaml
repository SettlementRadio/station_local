  - id: s_0851
    title: Cold Store, Late Hour
    track_number: 3
    mood: [slow, close, cold]
    fact: >-
      Saira Dunn plays in gloves with the fingers cut off, which can be heard on the keys throughout,
      because the canteen heating was off after midnight.
    arrangement_note: the wool of a cut-off glove is audible going down on the keys on every chord, and it was left in rather than played round, which is the only decision anybody made about this track
    intro: 13
    outro: fade
    target_duration: "4:10"
    prompt: >-
      66 BPM close cold blues; tired gravel baritone, wool-muted piano, soft guitar, rim kit, room fade.
    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, clean piano attack, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano in cut-off gloves, thirteen seconds]

      [Verse 1]
      The heating in that canteen goes off at midnight sharp.
      A timer in a locked box makes the matter final.
      Day shift holds the key; night shift keeps its coats.
      She cuts the fingers from a pair of woollen gloves,
      presses both palms round the cup before it cools.
      Beyond the wall, the cold store murmurs differently.
      Waste heat from the scrubber finds one hidden seam.
      Nobody points toward it. Everybody knows.

      [Refrain]
      Cold store, and a late hour, and a woman in cut gloves.
      Stand beside the leaking wall and keep your voice low.
      Nothing here is ours except the warmth we do not name.

      [Verse 2]
      One by one, late workers drift behind the cold store,
      wet sleeves touching pipes they are not meant to find.
      No one blocks the gallery or lingers past the bell.
      Five warm minutes put some feeling in the fingers.
      A maintenance notice warns of unexplained heat loss.
      Someone folds it small and sets it by the ration urn.
      Silence can be solidarity when meters watch the walls.

      [Refrain]
      Cold store, and a late hour, and a woman in cut gloves.
      Stand beside the leaking wall and keep your voice low.
      Nothing here is ours except the warmth we do not name.

      [Verse 3]
      Before first shift, she wipes the pipe and leaves it bare.
      The room returns to lawful cold before inspection.
      Forty coats move outward through the second airlock.
      The wall keeps one handprint fading in the frost.
      Tonight another late crew will discover it again,
      guided by no sign, no map, no spoken invitation.
      Certain kinds of knowledge travel best through shoulders.

      [Final Refrain]
      Cold store, and a late hour, and a woman in cut gloves.
      Stand beside the leaking wall and keep your voice low.
      Nothing here is ours, so share it while it lasts.

      [Coda - fade, piano and room]
