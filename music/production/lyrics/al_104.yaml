    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, clean or edited ending, vocal tuning, whispered or rapped sections, modern studio production, cold ending, fade-out
    lyrics: |
      [Intro - piano and guitar, eighteen seconds]

      [Verse 1]
      The yard gate above the airlock never needed locking.
      Its bolt lies under seven years of painted weather.
      Every shift has pushed it wide with shoulder, crate or boot.
      Tonight closure notices hang from both its rails.
      Workers carry cups, spare gloves and locker photographs.
      Nothing leaves in order. Nothing fits one cargo list.
      The gate keeps swinging for whoever comes behind.
      One woman checks the locker row for anything forgotten.
      She finds a child's drawing taped behind a door.

      [Refrain]
      Nobody locks it behind us and nobody ever has.
      Pull it near, then let it open toward the dark.
      The last one out should never choose who cannot follow.

      [Verse 2]
      Some take transfer berths; some stay above the ice.
      Some have nowhere certain past the final ration week.
      At the relay wall, addresses pass from hand to hand.
      Promises grow brave because no rota can test them.
      We will meet next season. We will write each month.
      Everybody hears the doubt and makes the promise anyway.
      Hope is sometimes manners at a closing gate.

      [Refrain]
      Nobody locks it behind us and nobody ever has.
      Pull it near, then let it open toward the dark.
      The last one out should never choose who cannot follow.

      [Verse 3]
      Near morning, only four wet coats remain inside.
      They turn the canteen lamps down one by one.
      No speech can hold the gallery, the deck, the vanished shifts.
      They shoulder final bags and cross the upper airlock.
      One worker gives the painted gate a backward push.
      It swings once, catches nothing, swings again.
      The open works receives the sound and gives it back.

      [Final Refrain]
      Nobody locks it behind us and nobody ever has.
      Pull it near, then let it open toward the dark.
      Leave a way through for whatever comes after us.

      [Outro - sustain, the yard gate]
