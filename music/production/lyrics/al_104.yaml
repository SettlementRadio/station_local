    target_duration: "3:20"
    prompt: >-
      114 BPM hard blues; gravel baritone, flat membership figures, guitar, flat piano, harmonica, stop.
    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, vocal tuning, whispered or rapped sections, modern studio production, fade-out
    lyrics: |
      [Intro - full band, four seconds]

      [Verse 1]
      The noticeboard hangs crooked by the second airlock,
      old totals fading underneath the newest sheet.
      Thumb marks darken every year somebody has checked it.
      The figures need no colour and no voice raised high.
      They wait above the deck plan, plain enough to challenge,
      a history of bodies leaving one by one.
      Count the empty hooks if numbers feel too distant.

      [Chorus]
      Half of the local left and the half that stayed got quieter.
      Every missing worker takes a portion of the room.
      The board says it in figures; empty chairs say more.

      [The board - one voice, flat, read off the wall]
      Six hundred and forty in 2591.
      Three hundred and eleven now.
      Ninety-two of those are on the second shift.

      [Verse 2]
      People leave the works before they leave each other:
      one shift cut, one deck sealed, then the western gallery.
      Transfer forms move families toward another berth.
      Relay calls grow shorter after distance finds its price.
      The local keeps their names until the dues run out,
      then one more line goes pale beside the meeting date.
      What remains must carry every task with fewer hands.

      [Chorus]
      Half of the local left and the half that stayed got quieter.
      Every missing worker takes a portion of the room.
      The board says it in figures; empty chairs say more.

      [Verse 3]
      At meetings, those who stay pull chairs toward the heater.
      Debate grows short because the other side is gone.
      Four clean votes pass with no opposing hand.
      Agreement feels like victory until the coats are counted.
      The woman keeping minutes leaves wide margins now.
      Through the wall, an empty gallery returns each word.
      Quiet is not peace when half the voices moved away.

      [Final Chorus]
      Half of the local left and the half that stayed got quieter.
      Every missing worker takes a portion of the room.
      The board says it in figures. Read the empty chairs.

      [Outro - cold stop]
