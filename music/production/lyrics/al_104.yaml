  - id: s_0854
    title: The Last Grievance
    track_number: 6
    mood: [hard, defiant, brisk]
    fact: >-
      Played once at the branch's final meeting and once for the record, and the band refused a second
      take on the grounds that they had already done it twice.
    arrangement_note: one take and no alternative exists, which is true of everything on this record and was argued about only here, and the argument is why the ending is abrupt
    intro: 3
    outro: cold
    target_duration: "3:15"
    prompt: >-
      120 BPM defiant blues; hard gravel baritone, guitar, flat piano, harmonica, rim kit, abrupt stop.
    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, polished performance, vocal tuning, whispered or rapped sections, modern studio production, fade-out
    lyrics: |
      [Intro - full band, three seconds]

      [Verse 1]
      Final meeting, Thursday, forty-one wet coats,
      two hundred chairs and no reason left to fill them.
      Closure papers wait beneath the branch-room lamp.
      The final item concerns the second-gallery door:
      bulkhead warped, seal split, cold entering at floor level,
      first raised in 2588 and raised eleven times.
      Everybody knows the hinge. Nobody laughs tonight.
      Every winter added one more signature beneath it.

      [Refrain]
      The last grievance is about a door and it always is.
      Not the vanished deck or all the wages gone.
      A door, because a door might still be made to close.

      [Verse 2]
      One worker reads the prior answers into silence:
      parts requested, inspection due, no immediate risk.
      Another places melted ice beneath the meeting table,
      water gathered from the coat worn by that door.
      The chair calls the vote. Forty-one hands rise.
      A unanimous demand from a branch already closing
      still makes the office clerk record the proper number.
      Meltwater reaches the closure papers before the ink dries.

      [Refrain]
      The last grievance is about a door and it always is.
      Not the vanished deck or all the wages gone.
      A door, because a door might still be made to close.

      [Verse 3]
      At dawn, maintenance arrives with seal and hinges.
      The office wants the final ledger closed in order.
      Forty-one workers watch one old door meet its frame.
      Warm air stays inside for once without assistance.
      Then they stack the chairs, return the branch-room key,
      and walk through the repaired bulkhead toward the airlock.
      Some victories come late and still belong to those who asked.
      Behind them, the old draft finally stops crossing the floor.

      [Final Refrain]
      The last grievance is about a door and it always is.
      Not the vanished deck or all the wages gone.
      The door closes clean. Make the office write that down.

      [Outro - cold stop]
