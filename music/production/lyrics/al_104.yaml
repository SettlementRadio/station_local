    prompt: >-
      108 BPM dry shuffle; blunt male lead, no guitar, flat piano, stop-start harmonica, rim kit, fade.
    exclude: bass guitar, upright bass, electric bass, guitar, acoustic guitar, gravel baritone lead, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, continuous harmonica, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano and harmonica, five seconds]

      [Verse 1]
      I come off the late deck after every heater closes,
      hands too numb to turn the canteen kettle switch.
      One worker holds a metal horn above the scrubber pipe.
      Another sets the empty cups beneath its little warmth.
      Nobody expects comfort worthy of the word.
      We only want the water not to hurt our teeth.
      At this hour, small improvements count as luxury.

      [Chorus]
      Nothing here is warm to drink and nothing warm to sit on
      and nothing warm to say to anybody at this hour.
      Put the kettle on the scrubber pipe. It is the only warm thing here.

      [Verse 2]
      You ask whether I will take the early transfer.
      The answer waits somewhere behind my frozen mouth.
      Better quarters, warmer deck, one season from this canteen;
      everything we claimed we wanted when the cold began.
      Yet the offer carries only one berth allocation.
      The horn falls silent every time I try to answer.
      Some choices leave no breath for keeping music under them.

      [Chorus]
      Nothing here is warm to drink and nothing warm to sit on
      and nothing warm to say to anybody at this hour.
      Put the kettle on the scrubber pipe. It is the only warm thing here.

      [Verse 3]
      At last the kettle shakes one thread of steam.
      I split the transfer paper down the centre fold.
      Warmth without you is another kind of under-ice work.
      We feed both halves beneath the scrubber flame.
      Morning may make fools of this expensive answer.
      Tonight your shoulder finds mine on the metal bench.
      Nothing here to drink is warm; enough warmth left to stay.

      [Final Chorus]
      Nothing here is warm to drink and nothing warm to sit on
      and nothing warm to say to anybody at this hour.
      Put the kettle on the scrubber pipe. We have one answer now.

      [Outro - fade]
