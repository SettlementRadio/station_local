  - id: s_0855
    title: Nobody Locks It Behind Us
    track_number: 7
    mood: [final, slow, warm]
    fact: >-
      The last thing Undershore Local recorded, and the sound at the end is the yard gate, which
      nobody had ever locked and which is on the take anyway.
    arrangement_note: the yard gate swings at the end of the take because the drummer walked out through it while the tape was running, and nobody went back and cut it off
    intro: 18
    outro: sustain
    target_duration: "4:20"
