    outro: sustain
    target_duration: "4:15"
    prompt: >-
      72 BPM weary blues; plain gravel baritone, flat piano triplets, guitar, rim-and-skin kit, held end.
    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, vocal ornament or melisma, vocal tuning, whispered or rapped sections, modern studio production, cold ending, fade-out
    lyrics: |
      [Intro - piano triplets and guitar, fourteen seconds]

      [Verse 1]
      Four o'clock, the neighbourhood is opening its doors.
      Supper lamps come on while I am sealing mine.
      Children fill the relay court between the housing blocks.
      You carry two warm cups as far as the airlock gate.
      Mine will cool untouched beside the night manifest.
      The shift bell takes the hour before our hands can meet.
      Evening begins for everyone except the second shift.

      [Chorus]
      Second shift blues and there is nothing else to call it.
      Four to midnight, midnight to eight, and then again.
      Count the hours missing from the people still awake.

      [Verse 2]
      Morning workers lose the sleep but keep the evening.
      Night crews trade their bodies for a quieter deck.
      Second shift takes birthdays, ballots, ordinary meals,
      all the little hours no wage form knows to price.
      I know your life by notes left underneath the heater:
      ration paid, back late, leak fixed, missed you again.
      A household can survive while never being together.
      The wall calendar stays full of things I never see.

      [Chorus]
      Second shift blues and there is nothing else to call it.
      Four to midnight, midnight to eight, and then again.
      Count the hours missing from the people still awake.

      [Verse 3]
      Twice a month the rota gives us one whole evening.
      We spend the first asleep in clothes beside the stove.
      On the second, we keep every room lamp burning,
      eat too late and let the relay messages go unanswered.
      Nothing grand occurs; that is exactly what we wanted.
      Your cup stays warm because my hand is there to lift it.
      Midnight comes without an airlock in between.

      [Final Chorus]
      Second shift blues and there is nothing else to call it.
      Four to midnight, midnight to eight, but not tonight.
      Count the hours found again by people still awake.

      [Outro - sustain]
