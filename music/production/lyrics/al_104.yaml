    title: Second Shift Blues
    track_number: 1
    mood: [slow, blue, weary]
    fact: >-
      The only song the band gave their own form's name to, and Hob Venner said he used the word
      because it was the plainest one available.
    arrangement_note: the plainest twelve-bar on either record, taken slowly, with the piano triplets doing all the ornament and the voice doing none
