  - id: s_0850
    title: Nobody Off at the Same Time
    track_number: 2
    mood: [wry, midtempo, tired]
    fact: >-
      Written about the shift pattern that ended the band, and recorded on one of the two nights a
      month that pattern left them all free.
    arrangement_note: one section is a rota read flat over the kit alone with the rest of the band out of it, because a rota is what ended this band and there is no way to sing one
    intro: 8
    outro: fade
    target_duration: "3:45"
    prompt: >-
      98 BPM tired shuffle; gravel baritone, flat rota over drums, guitar, flat piano, harmonica, fade.
    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, vocal tuning, whispered or rapped sections, rapped delivery, modern studio production, cold ending
    lyrics: |
      [Intro - guitar and piano, eight seconds]

      [Verse 1]
      They call it rolling and it rolls, that much is true.
      It rolls four friends through different doors and hours,
      never cruel enough to give them someone they can blame.
      One finishes as another seals a working coat.
      One wakes when the last is halfway down the ladder.
      Arithmetic has no office where a person can object.
      It only has a noticeboard and columns drawn in black.

      [Chorus]
      Nobody is off at the same time, and that is how a friendship ends.
      Not a row, not money, not a door slammed hard.
      Four empty chairs around one table tell it plainly.

      [The pattern - one voice, flat, over the kit]
      North gate early. Cold store late. Gallery nights. Deck early.
      Second week: gate late, store nights, gallery early, deck late.
      Two nights in the month. That is what is left.

      [Verse 2]
      She marks both common nights three months ahead,
      trade shifts, save ration, keep the meeting-room key.
      The first is lost when north gate needs an extra body.
      The second reaches midnight before the last friend comes.
      Still three cups wait and one stays by the heater.
      Nobody calls the evening wasted while the chair remains.
      Friendship learns to live in whatever time survives.

      [Chorus]
      Nobody is off at the same time, and that is how a friendship ends.
      Not a row, not money, not a door slammed hard.
      Four empty chairs around one table tell it plainly.

      [Verse 3]
      By sealed season, notes replace the common table:
      leak is fixed, gate froze, your cup is on the shelf.
      One friend transfers; one takes permanent night duty.
      Nobody announces that the four will not meet again.
      The pattern rolls, efficient and without intention.
      At each shift change, two pass briefly in the airlock,
      long enough to touch one shoulder and keep moving.

      [Final Chorus]
      Nobody is off at the same time, and that is how a friendship ends.
      Not a row, not money, not a door slammed hard.
      Four chairs stay waiting though the table has gone cold.

      [Outro - fade]
