  - id: s_0808
    title: Turn the Lamps Down
    track_number: 13
    mood: [slow, close, final]
    fact: >-
      Cut at the end of the third night with the canteen lights already off, which is why the piano
      is the loudest thing on it.
    arrangement_note: recorded with the canteen lights off and the piano louder than the voice, which is the only place on any of this band's records where the slide is not the loudest thing after the singer
    intro: 20
    outro: sustain
    target_duration: "4:15"
    prompt: >-
      62 BPM very slow blues; low hoarse female contralto close and tired, upright piano louder than
      the voice, steel-bar slide well back, upright bass, sticks barely there, sustain into the room.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, brushed drums, prominent slide guitar, cold ending, fade-out
    lyrics: |
      [Intro - piano alone, twenty seconds]

      [Verse 1]
      The steward turned them off at two and left the key.
      Amon kept on playing, because a piano does not need a lamp.
      Del found the low end by leaning on the wall to feel it.
      Orin played what he could hear of us and nothing more.
      And I have sung this room in the light for all these years
      and I have never once heard it the way it was that night.

      [Refrain]
      Turn the lamps down.
      Everything in here is easier in the dark.
      Nobody has to look at anybody now.

      [Verse 2]
      There is a thing that happens to a room when the light goes.
      It gets bigger and it gets closer, both at the same time.
      The urn ticks as it cools. The pipe behind the wall knocks twice.
      A man who has been sitting still all evening gets up to go
      and you hear the whole of it, the chair, the coat, the door,
      and none of it is on the take, because it stopped for him,
      and all of it is why the take sounds like it does.

      [Refrain]
      Turn the lamps down.
      Everything in here is easier in the dark.
      Nobody has to look at anybody now.

      [Verse 3]
      That is the end of the third night and the end of the record.
      We put the chairs back on the tables by touch alone.
      Del found the key. Orin found his coat and not his stick.
      Amon sat there at the piano for a while after we finished,
      not playing anything, just sitting with his hands on it,
      and nobody hurried him, and nobody said a word,
      and then we went out the door and down the lane and home.

      [Refrain]
      Turn the lamps down.
      Everything in here is easier in the dark.
      Nobody has to look at anybody now.

      [Outro - sustain, piano and room]
