  - id: s_0806
    title: Sit Down, You're Blocking the Door
    track_number: 11
    mood: [fast, communal, bright]
    fact: >-
      There were more people in the canteen than it holds and this is the track on which the band
      stopped asking them to move.
    arrangement_note: a canteen full past its own notice shouts one line back, ragged and unpitched and in no particular key, which is a crowd and not a backing part — this band has one backing voice and it is a man's, from the bass chair
    intro: 5
    outro: fade
    target_duration: "3:30"
    prompt: >-
      114 BPM fast bright blues shuffle; low hoarse female contralto, a packed hard room shouting one
      line back ragged and unpitched, steel-bar slide, piano, upright bass, sticks, fade.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, blended or studio crowd vocals, drum machines, vocal tuning, whispered or rapped sections, modern studio production, brushed drums, cold ending
    lyrics: |
      [Intro - full band, five seconds]

      [Verse 1]
      Forty-two is what the notice on the wall allows.
      There were ninety in the room and eleven on the stair.
      The steward stood against the urn and let the thing go.
      A man had brought his mother. A freight crew came off the late.
      Somebody's boy was sitting underneath the piano
      with his hands over his ears and would not be moved.

      [Chorus]
      Sit down, you are blocking the door.
      Sit down, there is no more floor.
      Sit anywhere at all and we will play around you.

      [Verse 2]
      We asked them three times to move, then Del just started,
      and after that we did not ask, and it was better,
      and it should have been the way we did it all along.
      You cannot run a room like that from where we stand.
      A room like that will run itself or it will not run,
      and all we have to do is be the loudest thing in it.

      [Chorus]
      Sit down, you are blocking the door.
      Sit down, there is no more floor.
      Sit anywhere at all and we will play around you.

      [The room - everybody in the canteen, ragged and unpitched]
      SIT DOWN. SIT DOWN. THERE IS NOWHERE LEFT TO SIT.

      [Verse 3]
      Somebody got a table through the doorway on its side
      and put it down for four more people out along the lane.
      Somebody brought chairs out of a room that is still locked.
      The steward wrote it up on Thursday in his own words
      and the words he chose were, attendance was above the notice,
      which is the most that man has ever said about a night.

      [Final Chorus]
      Sit down, you are blocking the door.
      Sit down, there is no more floor.
      Sit anywhere at all. Sit on the stair. Sit on the floor.
      We are not going to ask again.

      [Outro - fade]
