album:
  id: al_098
  title: The Room at Terrace Road
  band: b_046
  band_name: Terrace Road Four
  label: label_7
  release_year: 2624
  genre: old-system-sessions
  cornerstone: true
  song_count: 13
  style_card: b_046
  room: >-
    A tram works canteen on Mars, hard-walled, free only between shifts, with the works audible
    through it. One live room, everybody on every microphone, no overdubs, the steel-bar slide the
    loudest thing after the voice. The card holds throughout: low smoky female contralto behind the
    beat, bending the last note of a line down, and one male second voice from the bass chair
    answering the last line of a verse and never running harmony through a chorus. Two things are
    this record's and not the band's: Orin Lask plays sticks where Nan Sudell played brushes, and
    the works shift bell is audible on s_0796, s_0800, s_0804 and s_0808. Four fact-bound details
    live in their own songs — Amon Furlow's left hand alone on s_0798, Wesla Tarn's boot counting
    the band in on s_0800, the twenty-second slide passage on s_0803 that is the only instrumental
    break on the record, and the canteen steward audible asking the band to stop on s_0804.

