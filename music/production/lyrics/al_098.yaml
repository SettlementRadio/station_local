  - id: s_0803
    title: Long Way to the Yard
    track_number: 8
    mood: [rolling, steady, patient]
    fact: >-
      Wesla Tarn plays the slide with the length of tram brake shoe she has used since 2606, and it
      is the track the band point at when anyone asks what the sound is.
    arrangement_note: the only instrumental passage on the record — twenty seconds of the steel bar alone over bass and kit, with the piano out of it entirely, because the question the song answers is what the slide sounds like
    intro: 18
    outro: sustain
    target_duration: "4:10"
    prompt: >-
      88 BPM steady twelve-bar blues; low hoarse female contralto behind the beat, long steel-bar
      slide passage over bass and sticks with no piano under it, hard canteen room, sustain.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, brushed drums, clean or polished slide tone, cold ending, fade-out
    lyrics: |
      [Intro - slide guitar alone, eighteen seconds]

      [Verse 1]
      It is a length of brake shoe off the tram works floor.
      I put it in my coat and I have had it ever since.
      A better one would sound like a better one, not this.
      This has a burr along one edge that I will not take off,
      and that burr is on every record I have ever made.

      [Chorus]
      It is a long way to the yard on foot,
      longer with a case, and longer in the dark,
      and I have made that walk with worse things than a song.

      [Verse 2]
      Amon asked me once what I would do if it broke.
      I said a brake shoe does not break, it is a brake shoe.
      He said everything breaks, and went back to the piano.
      I would find another one and play it until it was the same,
      and in four years nobody alive would hear the difference.

      [Chorus]
      It is a long way to the yard on foot,
      longer with a case, and longer in the dark,
      and I have made that walk with worse things than a song.

      [Instrumental - slide guitar, twenty seconds]

      [Verse 3]
      The works has changed the trams twice over since I took it.
      The shoe is off a car that has not run for years,
      and the men who ran that car are on a different line
      or working the far siding or in a room like this one.
      So the sound of this band is a part off a dead tram
      played by a woman who kept it because it was there,
      and that is all it is, and people write in asking.

      [Final Chorus]
      It is a long way to the yard on foot,
      longer with a case, and longer in the dark,
      and I would carry twice that far to get the sound.

      [Outro - sustain]
