  - id: s_0800
    title: Nobody Counts It In
    track_number: 5
    mood: [loose, late, warm]
    fact: >-
      It starts with Wesla Tarn's foot on the canteen floor because nobody had settled who would
      count the band in now that Orin Lask was on the kit.
    arrangement_note: the count is a boot on a hard floor and nothing else, and the band come in one at a time behind it rather than together, which is what a band does when it has not agreed who starts
    intro: 4
    outro: cold
    target_duration: "3:30"
    prompt: >-
      108 BPM loose blues shuffle; low hoarse female contralto behind the beat, count-in is a boot on
      a hard floor, band entering one instrument at a time, slide, piano, upright bass, cold stop.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, brushed drums, drum count-in, fade-out
    lyrics: |
      [Count-in - a boot on the canteen floor, four seconds]

      [Verse 1]
      Nan used to do it. Four on the rim and off we went.
      Then Nan went, and the first night back there was a gap
      where a count had been, and all four of us stood in it.
      Orin looked at me. I looked at Del. Del looked away.
      Somebody has to start it and none of us will say who.

      [Chorus]
      So nobody counts it in,
      and my boot goes on the floor,
      and whoever hears it first is in the band tonight.

      [Verse 2]
      He can play. That was never once the argument.
      He has better hands than Nan and half her sense of when.
      The trouble with a new man is the old one is still here.
      Orin knows it too. He said so once, out on the lane,
      and I told him it would pass, and it has not passed yet,
      and neither of us has raised it since, which is how it goes.

      [Chorus]
      So nobody counts it in,
      and my boot goes on the floor,
      and whoever hears it first is in the band tonight.

      [Bridge]
      Four on the rim.
      Four on the rim was all it ever was.
      Nobody thought about it once in twelve whole years.

      [Verse 3]
      So the record starts with a boot, and the boot is mine,
      and the last car takes the siding with a shriek next door.
      I would rather have the count. I am not going to ask.
      Ask a man to count you in and you have said the rest.
      He will do it some Wednesday, and I will not say a word,
      and that will be the end of a thing that nobody named.

      [Chorus]
      So nobody counts it in,
      and my boot goes on the floor,
      and whoever hears it first is in the band tonight.

      [Outro - cold stop]
