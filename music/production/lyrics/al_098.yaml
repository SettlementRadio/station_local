  - id: s_0805
    title: Cold Toast and an Argument
    track_number: 10
    mood: [funny, brisk, dry]
    fact: >-
      The argument in the second verse is one Del Marran and Amon Furlow had about the money for
      these sessions, and both of them agreed to it going on the record.
    arrangement_note: the argument section is the lead voice taking both sides quickly over a stripped band, because neither of the two men it belongs to sings on this band's records and neither was going to start
    intro: 8
    outro: fade
    target_duration: "3:40"
    prompt: >-
      106 BPM brisk blues shuffle; low hoarse female contralto behind the beat, one quick section
      where she takes both sides of an argument over bass and piano alone, steel-bar slide, fade.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, spoken word, second lead voice, modern studio production, brushed drums, cold ending
    lyrics: |
      [Intro - piano and bass, eight seconds]

      [Verse 1]
      The toast in this canteen is cold before it is cut,
      because the grill is on a timer that nobody can find.
      You take it as it comes or you go without,
      and the ration board says nothing whatever about toast,
      and the saying of it is the point, and not the toast.

      [Chorus]
      Cold toast, and then an argument.
      That is the whole of a Wednesday.
      Come down the lane for one and get the other free.

      [Verse 2]
      Del says the money for these nights comes four ways even.
      Amon says four ways even is not what even means
      when one of them has carried the piano up the stair.
      Del says that nobody asked him to, and Amon says
      that somebody had to, and it is always the same somebody.
      Both of them said put it on the record. So it is on.

      [The argument - lead voice taking both sides, flat and quick]
      Four ways even. Four ways even is not even.
      Somebody carried the piano. Nobody asked you to.
      Somebody had to. It is always the same somebody.
      Put it on the record, then. Put it on the record.

      [Chorus]
      Cold toast, and then an argument.
      That is the whole of a Wednesday.
      Come down the lane for one and get the other free.

      [Verse 3]
      Here is what I know that neither of them knows.
      They are both right, and it does not matter which is more,
      and one day there will be four of us in here, or none,
      and the money for a Wednesday will not be the reason.
      You let them have it out and then you play the next one,
      and the toast is cold for everybody, which is even.

      [Chorus]
      Cold toast, and then an argument.
      That is the whole of a Wednesday.
      Come down the lane for one and get the other free.

      [Outro - fade]
