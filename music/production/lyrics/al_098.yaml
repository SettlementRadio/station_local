  - id: s_0807
    title: Play the One About the Rain
    track_number: 12
    mood: [warm, generous, midtempo]
    fact: >-
      The title is what one regular shouted at the band every week for eleven years, and this is the
      song they eventually wrote to answer him.
    arrangement_note: the bridge is the request itself, sung three times and answered once, and the band drop under it to piano and bass so the line is the only thing in the room
    intro: 12
    outro: fade
    target_duration: "4:05"
    prompt: >-
      84 BPM warm midtempo blues; low hoarse female contralto behind the beat, band dropping to piano
      and upright bass under one repeated line, steel-bar slide, sticks, hard canteen room, fade.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, brushed drums, cold ending
    lyrics: |
      [Intro - piano and slide, twelve seconds]

      [Verse 1]
      Every Wednesday for eleven years, the same man, the same coat.
      He waits until the room is quiet and he asks for it by name.
      There is no song about the rain. There never has been one.
      He knows that, and he asks, and the room has come to wait
      the way you wait for a bell, and would notice if he stopped.

      [Chorus]
      So here it is. It took eleven years, and it is not the rain.
      It is a man who asks for something that was never there,
      and a room that lets him, and a Wednesday, and a song.

      [Verse 2]
      I asked him once where he had got the whole idea from.
      He said his mother had it off a record off the cargo
      and played it till it wore, and then she played it worn.
      He has never heard it. He does not know what it is called.
      What he has is a kitchen, and a sound, and a word for weather.

      [Chorus]
      So here it is. It took eleven years, and it is not the rain.
      It is a man who asks for something that was never there,
      and a room that lets him, and a Wednesday, and a song.

      [Verse 3]
      So this is what he gets, and I expect he will be disappointed.
      A room does not hand a man the thing he keeps on asking for.
      It keeps him asking, and it keeps a place for him to ask in.
      He comes down the lane on Wednesdays in the same coat,
      and if he stopped, we would all notice, and none of us would say.

      [Bridge]
      Play the one about the rain.
      Play the one about the rain.
      Play it anyway.

      [Final Chorus]
      So here it is. It took eleven years, and it is not the rain.
      It is a man who asks for something that was never there,
      and a room that lets him ask, and a Wednesday, and a coat.

