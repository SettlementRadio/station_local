  - id: s_0802
    title: The Water's Off Again
    track_number: 7
    mood: [wry, plain, midtempo]
    fact: >-
      The verse listing what the district is short of was chalked on the canteen wall and Wesla Tarn
      read it off the wall during the take.
    arrangement_note: the list section is sung flat on one note with the band dropping to bass and kit underneath it, because it is a notice being read out and not a verse
    intro: 7
    outro: fade
    target_duration: "3:35"
    prompt: >-
      100 BPM midtempo blues shuffle; low hoarse female contralto behind the beat, one section sung
      flat on a single note over bass and sticks alone, steel-bar slide, upright piano, fade.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, spoken word, modern studio production, brushed drums, cold ending
    lyrics: |
      [Intro - slide guitar, seven seconds]

      [Verse 1]
      Third time this month, and the notice went up Monday.
      The steward chalked the rest along the canteen wall,
      and I read it off the wall while we were making this,
      because the wall was right there and because it was true.

      [Chorus]
      The water is off. It will be on.
      It has been off before and it came back.
      Put the kettle where your hand will find it in the dark.

      [Verse 2]
      There is a way a district takes a thing like this.
      The second day there is a queue and someone in it shouts.
      The third day it is fixed, or it is not, and either way
      we have all worked out who to ask and who is no use,
      and it comes out again the next time and the time after that.

      [The wall list - sung flat, one note]
      No water till the morning. No hot until Thursday.
      The east stair light is out. The second-floor scrubber is out.
      Ration Tuesday and Friday. Nothing on the board about the rest.

      [Chorus]
      The water is off. It will be on.
      It has been off before and it came back.
      Put the kettle where your hand will find it in the dark.

      [Verse 3]
      The steward wiped it off on Thursday when the water came,
      and I asked him not to, and he said the wall is not yours.
      But it is on the record now, and the record does not wipe,
      so a man who chalks a notice up to save himself a question
      is on a thing that has gone further than he has ever been,
      and he does not know it, and I am not going to be the one.

      [Chorus]
      The water is off. It will be on.
      It has been off before and it came back.
      Put the kettle where your hand will find it in the dark.

      [Outro - fade]
