  - id: s_0804
    title: Nobody Asked for Quiet
    track_number: 9
    mood: [fast, loud, defiant]
    fact: >-
      The loudest thing the band has recorded, and the canteen steward can be heard telling them to
      stop before the last chorus arrives.
    arrangement_note: a man's voice comes in over the top of the band asking them to stop and the band do not stop, which is on the take because nobody in the room heard him at the time
    intro: 3
    outro: cold
    target_duration: "3:15"
    prompt: >-
      116 BPM fast loud blues shuffle; low hoarse female contralto pushed hard, steel-bar slide,
      upright piano, upright bass, sticks, one man's voice cutting across the band near the end.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, brushed drums, quiet or restrained dynamics, fade-out
    lyrics: |
      [Intro - full band, three seconds]

      [Verse 1]
      There is a notice on the door about the noise at night.
      The steward reads it out when he has had a week,
      and then it is Wednesday again and the room fills up
      and the notice is a piece of paper on a door.

      [Chorus]
      Nobody in this room asked anybody to be quiet.
      Not one of them came down the lane tonight for quiet.
      There is quiet at home. There is quiet on the shift.
      There is quiet in the dark for a long time after that.

      [Verse 2]
      Del hit the bass so hard the second string went flat.
      Amon stood up at the piano, which he never does,
      and the slide went where it goes when I have stopped thinking.
      Whatever we were doing, we were not doing it quietly.

      [Chorus]
      Nobody in this room asked anybody to be quiet.
      Not one of them came down the lane tonight for quiet.
      There is quiet at home. There is quiet on the shift.
      There is quiet in the dark for a long time after that.

      [Verse 3]
      The steward came in at the top of the last one,
      and you can hear him. He is on the record saying stop.
      We did not stop. That is not a boast. We did not hear him.
      He told me after, out on the siding, that he had never
      seen the room like it, and that we would not do it again.
      Both of those were true. We have not done it since.
      It is on here once, and once is how a thing like that goes.

      [Chorus]
      Nobody in this room asked anybody to be quiet.
      Not one of them came down the lane tonight for quiet.
      There is quiet at home. There is quiet on the shift.
      There is quiet in the dark for a long time after that.

      [Outro - cold stop]
