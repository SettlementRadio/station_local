  - id: s_0799
    title: She Took the Other Line
    track_number: 4
    mood: [slow, aching, blue]
    fact: >-
      Nan Sudell wrote it and left it behind when she went in 2622, and it is the only song on any
      of the band's records Wesla Tarn did not write.
    arrangement_note: written by the drummer who had already left and played by the drummer who replaced her, which is why it is shorter-lined and plainer than anything else here and why the kit stays out of the first verse entirely
    intro: 14
    outro: fade
    target_duration: "4:20"
    prompt: >-
      66 BPM slow blues; low hoarse female contralto behind the beat, steel-bar slide, upright piano
      and bass, kit absent from the first verse then sticks played soft, hard canteen room, fade.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, brushed drums, cold ending
    lyrics: |
      [Intro - slide and piano, fourteen seconds]

      [Verse 1]
      Two lines leave the terrace and they run a mile apart.
      One goes down to the works. One goes out past the siding.
      For nine years I took the one that put me on the shift.
      She took the other one and did not look for me.
      I never asked her why. I had the answer in my hand.
      You get on what is going where you have to go.

      [Verse 2]
      I kept the early car. I kept the shift. I kept the room.
      She kept nothing that I know of, which is her own business.
      Somebody heard she went two stops down the line and stayed.
      Both of them were certain. Neither of them wrote.
      That is a lane for you. Everybody knows. Nobody knows.

      [Chorus]
      And I would not go after her.
      Not down that line. Not for a day.
      I have been on the wrong car once
      and I did not care for the ride.

      [Verse 3]
      There is a way of leaving that does not need a door.
      I have watched myself do it, more than once, and come back.
      She did it properly and got the fare together first,
      which is more than I have managed and I have had the years.

      [Chorus]
      And I would not go after her.
      Not down that line. Not for a day.
      I have been on the wrong car once
      and I did not care for the ride.

      [Final Verse]
      Two lines leave the terrace and they run a mile apart.
      Somebody is on both of them tonight and neither one is me.
      I have a cold urn and a cup and a song I did not write.
      If she hears it out there she will know the tune at once.
      She will not know who is singing. I would keep it that way.

      [Outro - fade]
