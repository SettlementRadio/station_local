# al_098 — The Room at Terrace Road · Terrace Road Four (b_046) · Relay Road Import · 2624 · 13 songs · album
#
# Written by M-25. **The file shape is fixed by al_001.yaml — read that header once.** Production
# vocabulary (COMMISSION.md §8): never enters the wiki, never said on air. Lyrics written by hand;
# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# **The cornerstone of the genre and the only one in it** — thirteen songs, one room, one whole
# 56-minute programme. Cut over three nights in the tram works canteen on Mars in 2623 and issued at
# the road head in 2624, and it is the record Relay Road Import put most of a crossing behind after
# the crate went astray in 2622. The extra passes §5 asks for went here.
#
# The room is the subject and the subject is not the premise: a canteen is a canteen, the water goes
# off, the toast is cold, a man asks for the same song for eleven years. Nothing on this record is
# about being on Mars; Mars is where the tram is.
#
# Two things the wiki fixes and the card does not. **Orin Lask is on sticks, not brushes** — the
# card's brushes are Nan Sudell's and she left in 2622, so this record is the first with the harder
# kit and the prompts say so on every track (D-096, and D-095's dated exception in another form).
# And **s_0799 is the one song on either of this band's records Wesla Tarn did not write**: Nan
# Sudell wrote it and left it behind, and it is written plainer and shorter-lined than anything
# around it on purpose.
#
# `generation:` and every `take:` were filled from the dispatch manifest at M-34, and all thirteen
# takes match their lyric exactly. **Track 1 was made a fortnight after the rest of the record.** The
# first sitting returned two takes of `s_0797` rather than one of each, so `s_0796` was never
# generated at all and the dispatch refused the pile until it was noticed (D-097); it was regenerated
