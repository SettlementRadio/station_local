songs:
  - id: s_0796
    title: The Room at Terrace Road
    track_number: 1
    mood: [rolling, warm, midtempo]
    fact: >-
      The works' shift bell rings twice during the take and the band played through it both times,
      because the canteen was theirs only until it rang the third.
    arrangement_note: the works bell is audible twice and nothing in the arrangement acknowledges either one, which is the whole of the band's relationship with the room they record in
    intro: 12
    outro: sustain
    target_duration: "3:50"
    prompt: >-
      96 BPM rolling twelve-bar blues; low hoarse female contralto behind the beat, steel-bar slide
      loudest after the voice, upright piano and bass, sticks not brushes, hard canteen room, sustain.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, brushed drums, cold ending, fade-out
    lyrics: |
      [Intro - slide guitar and piano, twelve seconds]

      [Verse 1]
      The room at Terrace Road is a canteen until nine,
      and after that it is whatever the four of us can make.
      Amon sets the piano where the draught cannot get at it.
      Del stands in the corner because the corner takes the bass.
      Orin counts us in these days, and he counts a shade too fast.

      [Chorus]
      It is ours until the bell,
      and the bell has gone twice already,
      and the third one is the works
      asking for its room back.

      [Verse 2]
      There is a mark along the skirting where my case has always sat.
      There is a chair that no one sits in, and nobody says why.
      The late bell goes above us at ten and we play under it.
      Between those two a room can be a different thing entirely,
      and the works has never once come down the lane to look.
      Monday it belongs to them. Wednesday, near enough, to us.

      [Chorus]
      It is ours until the bell,
      and the bell has gone twice already,
      and the third one is the works
      asking for its room back.

      [Verse 3]
      A woman off the second siding comes in every week
      and stands against the doorframe with her coat still buttoned up.
      She waits until we finish and she says the same four words.
      Whatever we were paid for this, that is the part I keep.
      Orin says he would prefer the money. He is not wrong.
      But she is there on Wednesday, and the money never is.

      [Bridge]
      Bell.
      Second bell.
      Nobody in this room moves for a bell that is not the third.

      [Final Chorus]
      It is ours until the bell,
      and the bell has gone twice already,
      and the third one is the works
      asking for its room back,
      and we will hand it back.

      [Outro - sustain, piano held under the room]
