  - id: s_0798
    title: Two Cups and No Sugar
    track_number: 3
    mood: [dry, slow, funny]
    fact: >-
      Amon Furlow plays the whole track with his left hand because he would not put the cup down,
      and the band kept the take rather than have the argument.
    arrangement_note: the piano is left hand only from first bar to last and the bass and slide cover the top of it, which leaves a hole in the middle of the band that nobody fills
    intro: 6
    outro: cold
    target_duration: "3:45"
    prompt: >-
      78 BPM slow blues shuffle; low hoarse female contralto behind the beat, upright piano left hand
      only with nothing in the middle register, steel-bar slide, upright bass, sticks, cold stop.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, brushed drums, right-hand piano, fade-out
    lyrics: |
      [Intro - piano, left hand only, six seconds]

      [Verse 1]
      He would not put it down. That is the whole of it.
      I said, Amon, there is a table eighteen inches off your knee.
      He said the table's cold and the cup is not, and played.
      So the bass took the low end and the slide took the top
      and the piano did what a piano does with half a man.

      [Refrain]
      Two cups, and neither one of them is mine,
      no sugar on the ration since the spring,
      and a man who will not set a thing down for a song.

      [Verse 2]
      The urn is at the end and it gives out about eleven.
      There has been an argument in this room about that urn
      every Wednesday I have played here, and it is never settled.
      Del says first come first served. Orin says that is convenient.
      I say I am the one who sings and I should have the first,
      and all three of them ignore me, which is the correct answer.

      [Refrain]
      Two cups, and neither one of them is mine,
      no sugar on the ration since the spring,
      and a man who will not set a thing down for a song.

      [Verse 3]
      He finished it left-handed and he never mentioned it again.
      When the take came back we all heard what was missing,
      and the room agreed the missing part was better than the argument.
      So that is what is on the record, half a piano and a cup,
      and if you want the other half, come down the lane on a Wednesday
      and buy him one, and watch him put it carefully down.

      [Refrain]
      Two cups, and neither one of them is mine,
      no sugar on the ration since the spring,
      and a man who will not set a thing down for a song.

      [Coda - cold stop]
