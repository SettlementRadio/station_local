  - id: s_0801
    title: Working Both Ends
    track_number: 6
    mood: [driving, hard, shuffling]
    fact: >-
      Written about holding the works shift and the canteen night at the same time, which all four
      of them were still doing when the record was made.
    arrangement_note: the hardest thing on the record and the only one taken at the top of the band's range, with a four-bar turnaround for piano and slide together where a verse would otherwise be
    intro: 9
    outro: cold
    target_duration: "3:25"
    prompt: >-
      112 BPM hard driving blues shuffle; low hoarse female contralto behind the beat, steel-bar
      slide and upright piano in unison on a four-bar turnaround, upright bass, sticks, cold stop.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, brushed drums, fade-out
    lyrics: |
      [Intro - full band, nine seconds]

      [Verse 1]
      Six to two at the works and then this room at nine.
      Four hours in between to eat and sleep and be a person.
      Del does not sleep at all and says he never has.
      Orin has a second job down the lane nobody asks about.
      I have got a bed I see about as often as I see Saturn,
      which is to say I know that it is there and rarely look.

      [Chorus]
      Working the both ends and meeting in the middle,
      and the middle is a Wednesday and a hard room and a bell.
      Nobody made us do it. Nobody is going to stop us.

      [Verse 2]
      People ask us when we mean to give the shift away.
      The shift is what buys strings and pays the rent on this,
      and this is what turns the shift into a week and not a wall.
      I have watched three bands around here find that out,
      and every one of them was better than us when they went.

      [Chorus]
      Working the both ends and meeting in the middle,
      and the middle is a Wednesday and a hard room and a bell.
      Nobody made us do it. Nobody is going to stop us.

      [Verse 3]
      There is a cost. I am not going to pretend there is not.
      Nan sat down in 2622 and did the sum and left.
      I did the same arithmetic and came out the other side,
      and I could not tell you why, except that Wednesday comes
      and the room is full and warm and the last car's on the siding,
      which is not a reason, and it has held for every year I have counted.

      [Turnaround - piano and slide, four bars]

      [Chorus]
      Working the both ends and meeting in the middle,
      and the middle is a Wednesday and a hard room and a bell.
      Nobody made us do it. Nobody is going to stop us.

      [Outro - cold stop]
