  - id: s_0797
    title: Don't Wait Up for the Late Car
    track_number: 2
    mood: [shuffling, wry, tired]
    fact: >-
      Del Marran built the bass figure out of the rhythm the last tram makes over the joints outside
      the canteen, and he has never played it any other way.
    arrangement_note: the bass plays four beats and a gap and four more, all the way through, which is what a tram does over the joints outside the door and is the only thing on the track that never varies
    intro: 8
    outro: fade
    target_duration: "3:40"
    prompt: >-
      104 BPM blues shuffle; low hoarse female contralto behind the beat, upright bass figure with a
      gap in it running throughout, steel-bar slide, piano, sticks, hard canteen room, fade.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, brushed drums, cold ending
    lyrics: |
      [Intro - upright bass alone, eight seconds]

      [Verse 1]
      Del found it on a Tuesday standing out beside the siding,
      the last car going over the joints outside the door.
      Four beats and a gap in it, and then four more,
      and he has never played it any other way since.
      You can hear the tram in it if somebody tells you first,
      and if nobody tells you it is a man playing bass.

      [Chorus]
      So do not wait up for me on the late one,
      I am two shifts and a long lane from my own door,
      and the last car out of here goes past that wall
      whether I am on it or I am not.

      [Verse 2]
      There is a woman on that car most nights with a bag of tools,
      coming off a shift as I am going down to mine.
      Neither of us has ever said a word out loud.
      I would not know her name to save my life or hers,
      and I would know her walk across a hall of forty people.
      That is a kind of knowing. It is not a large one.

      [Chorus]
      So do not wait up for me on the late one,
      I am two shifts and a long lane from my own door,
      and the last car out of here goes past that wall
      whether I am on it or I am not.

      [Verse 3]
      Amon says the tram is flat and plays against it twice.
      Orin puts a stick down and just lets the thing go by.
      Everybody in the canteen turns their head at once,
      because a tram is only ever going where it goes,
      and none of us are on it, and the urn is still warm.

      [Chorus]
      So do not wait up for me on the late one,
      I am two shifts and a long lane from my own door,
      and the last car out of here goes past that wall
      whether I am on it or I am not.

      [Outro - fade]
