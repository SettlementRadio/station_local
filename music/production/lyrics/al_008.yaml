    exclude: synthesizers, electronic drums, drum kit, string sections, studio choir, vocal tuning, rapped sections, whispered vocals, belted vocals, dance-pop production
    lyrics: |
      [Intro - 16 seconds, muted upright bass and acoustic-toned guitar, chimes at eleven seconds, no vocal]

      [Verse 1]
      There is one light left on in the galley all night
      because somebody on every crew is always awake.
      It is over the kettle and it is the colour of weak tea
      and everybody who has ever worked a night knows it.
      Nobody turns it off. Nobody has ever turned it off.
      It is on in every hauler on this circuit at this hour.

      [Refrain]
      Leave the light on in the galley. Somebody is always coming in.

      [Verse 2]
      I came off watch at two and you were sitting there
      with a cup gone cold and a manifest you were not reading.
      You did not look surprised and you did not move up,
      you just pushed the other chair out with your foot
      and carried on not reading the same page of the same list
      for about as long as it takes to boil a kettle.

      [Refrain]
      Leave the light on in the galley. Somebody is always coming in.

      [Verse 3]
      We are four berths from a cabin with six people asleep
      so the whole of this has to be conducted quietly.
      Every important thing I have ever said to you
      has been said at about a quarter of my actual volume,
      under a scrubber, over a kettle, with one eye on the door,
      and it has still been the loudest part of my week.

      [Refrain]
      Leave the light on in the galley. Somebody is always coming in.

      [Verse 4]
      In a fortnight there is a port and after the port a road
      and after the road a settlement where one of us gets off.
      I know which one. You know which one. Nobody is saying.
      Push the chair out with your foot again and I will sit down.

      [Refrain - crew, very quiet]
      Leave the light on in the galley. Somebody is always coming in.
      Leave it on the whole way to the port.

      [Outro - sustain, muted bass under the last chime]
