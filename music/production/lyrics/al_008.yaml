    lyrics: |
      [Intro - 9 seconds, acoustic-toned guitar with wire chimes, no vocal]

      [Verse 1]
      The crew shuttle runs the length of the yard and back
      from the transfer hall to the last berth on the hard,
      and it stops eleven times and everybody knows the stops.
      Mine is the fourth. Yours is the second to last.
      I have known that for two years and never once used it.

      [Chorus]
      So I got off at the fourth stop early with my bag on my shoulder
      and said something about wanting the air, which was a lie,
      and we walked the whole wet length of the service road
      talking about nothing at about half the speed it takes.

      [Verse 2]
      Twenty minutes. Twenty-two if the gate is shut.
      I have made that walk take twenty-eight before now
      by asking a question I already had the answer to
      just before we got to the turning by the pump house.
      The whole freight crew goes past us on the shuttle
      and every one of them has the sense not to wave.

      [Chorus]
      So I got off at the fourth stop early with my bag on my shoulder
      and said something about wanting the air, which was a lie,
      and we walked the whole wet length of the service road
      talking about nothing at about half the speed it takes.

      [Instrumental - both guitars, 10 seconds]

      [Verse 3 - acoustic-toned guitar only]
      You got off one stop early on the Tuesday after.
      You did not say anything about the air.
      You did not say anything at all, and neither did I,
      and we walked the whole way in and it took thirty-one minutes.

      [Chorus]
      So I got off at the fourth stop early with my bag on my shoulder
      and said something about wanting the air, which was a lie,
      and we walked the whole wet length of the service road
      talking about nothing at about half the speed it takes.

      [Outro - sustain, guitar and chimes]
