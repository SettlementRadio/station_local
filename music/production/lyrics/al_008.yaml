      [Chorus]
      Everybody knows the fare (everybody knows the fare)
      Everybody knows it is a shade more than it was (than it was)
      Nobody has ever seen it written on a board
      and every single person on this deck can tell you what it is.

      [Verse 1]
      A man at the first port says it went up in the spring.
      A woman at the second says it went up in the spring
      of a different year, and she has the receipt to prove it,
      and the two of them have never met and never will.

      [Chorus]
      Everybody knows the fare (everybody knows the fare)
      Everybody knows it is a shade more than it was (than it was)
      Nobody has ever seen it written on a board
      and every single person on this deck can tell you what it is.

      [Verse 2]
      I am not complaining about the fare. I am complaining
      that the fare is the only thing anybody talks about
      on a two-day crossing with nothing else to do
      and somebody standing at the rail that I would rather talk to.

      [Chorus]
      Everybody knows the fare (everybody knows the fare)
      Everybody knows it is a shade more than it was (than it was)
      Nobody has ever seen it written on a board
      and every single person on this deck can tell you what it is.

      [Verse 3]
