  - id: s_0076
    title: The Galley Light
    track_number: 5
    mood: [wistful, intimate, steady]
    fact: >-
      Oren Saye plays upright bass with a cloth under the strings so the sleeping crew could remain
      in the adjoining cabin.
    arrangement_note: a guest upright bass is played with a cloth under the strings and every part on the record is played at the volume of a room where people are asleep next door
    intro: 16
    outro: sustain
    target_duration: "4:20"
    prompt: >-
      Warm live-room soft rock, 96 BPM, wistful and intimate, steady. Male lead vocal, warm baritone
