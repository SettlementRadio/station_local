  room: >-
    Cut for the shared shipboard pressing format of 2600, so the record had to travel further than
    the band ever had. The style card is followed straight: this is where the hand-built percussion
    becomes the tuned oxygen-tank drums the card names, because 2600 is the year Cado Veir proved
    they could be tuned the same way twice. The per-song departures are the guests — a composite
    fiddle counting with a bow rather than a voice, a guitar break cut in a loading passage, an
    upright bass with a cloth under the strings so the next cabin could stay asleep.

