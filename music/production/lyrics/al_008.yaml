  - id: s_0072
    title: Shared Format
    track_number: 1
    mood: [confident, communal, brisk]
    fact: >-
      Cado Veir demonstrates three different oxygen-tank tunings before the first sung line to make
      the Localist argument audible.
    arrangement_note: three tuned oxygen-tank drums are struck in turn before the first sung word, each a different pitch, and all three run under the choruses
    intro: 16
    outro: fade
    target_duration: "3:45"
    prompt: >-
      Warm live-room jangle pop and soft rock, 126 BPM, confident and communal, brisk. Male lead
      vocal, warm baritone that roughens at the top of the range, plain and a shade behind the beat,
      no vibrato. Whole-crew chorus of four to six voices in unison rather than harmony, mixed
      registers, answering the lead, one high harmony only on the final chorus. Two composite
      guitars, one acoustic-toned and one electric, electric bass, and hand-built percussion of
      three tuned metal tank drums at three distinct pitches, struck in turn before the first sung
      word and all three running under every chorus, plus hanging wire chimes. Whole band tracked
      together in a live room, percussion left ringing, light compression, loose rather than
      gridded. Sixteen seconds of the three tank drums before the first sung word. Fade.
    exclude: synthesizers, electronic drums, string sections, studio choir, vocal tuning, rapped sections, whispered vocals, dance-pop production, four-on-the-floor kick
    lyrics: |
      [Intro - 16 seconds, three tuned tank drums struck in turn, chimes at eleven seconds, no vocal]

      [Verse 1]
      Somebody worked out that a sleeve is a size
      and a size is a thing that a hundred ships can hold.
      So the same crate fits the same shelf in every port
      and a record made in one cabin gets as far as the road goes.

      [Chorus]
      Send it out. Send the whole of it out.
      Let it turn up in a port hall nobody here has seen
      and be sung wrong by people who have never met us.
      That is not losing it. That is the point of making it.

      [Verse 2]
      There is a man on this crew who will not have it,
      who says the drum is tuned to this room and no other,
      that you can post the shape of a thing and not the thing,
      and he is right, and he knows he is right, and he is still coming.

      [Chorus]
      Send it out. Send the whole of it out.
      Let it turn up in a port hall nobody here has seen
      and be sung wrong by people who have never met us.
      That is not losing it. That is the point of making it.

      [Verse 3]
      I would like it to reach one particular berth
      about four legs out from here on the long circuit,
      where somebody I have not seen since the spring
      will hear the second track and know exactly who it is for.

      [Chorus]
      Send it out. Send the whole of it out.
      Let it turn up in a port hall nobody here has seen
      and be sung wrong by people who have never met us.
      That is not losing it. That is the point of making it.

      [Chorus - whole crew, three drums together]
      Send it out. Send the whole of it out.
      Everything on this crate is the same size as everything else
      and one of them has got your name written inside the sleeve.
      Go and find it. It has gone further than I can.

      [Outro - fade on the three drums]
