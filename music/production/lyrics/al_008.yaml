    lyrics: |
      [Intro - 12 seconds, acoustic-toned guitar over the room's low hum, no vocal]

      [Verse 1]
      Everything on this ship is louder than a person.
      The scrubber, the fans, the thing behind the panel
      that nobody has fixed and everybody has stopped hearing,
      the bulkhead door that has never once shut quietly.
      You learn to talk under it or you do not talk.

      [Verse 2]
      So we have got about four notes of room to work in,
      quieter than the engines and louder than the dark.
      Anything said properly out loud in this corridor
      is said to the whole crew whether it was meant for them or not.

      [Chorus]
      Say it quieter than the engines. I will hear it.
      I have been listening for it for the whole of the last leg.
      There is no privacy on a hauler and there never was
      and the two of us have made a small one anyway.

      [Verse 3]
      You said it once at the wrong volume by mistake
      and Emi looked up from the far end of the table
      and said nothing at all, then, or ever, about it,
      which is the kindest thing that crew has ever done.

      [Chorus]
      Say it quieter than the engines. I will hear it.
      I have been listening for it for the whole of the last leg.
      There is no privacy on a hauler and there never was
      and the two of us have made a small one anyway.

      [Bridge]
      They will put the lights down at eleven the way they always do.
      Everything worth saying on this ship gets said after that.

      [Chorus - lead alone on the last line]
      Say it quieter than the engines. I will hear it.
      I have been listening for it for the whole of the last leg.
      There is no privacy on a hauler and there never was.
      Say it once, at any volume, and I will have it for good.

      [Outro - fade, the room's hum left running]
