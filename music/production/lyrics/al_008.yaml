    lyrics: |
      [Intro - 4 seconds, four beats of a bow tapped on a fiddle body, band in on the fifth, no vocal]

      [Verse 1]
      There is a list on the wall by the transfer hall door
      for the trip out on the ninth, and it is nearly full.
      Fourteen names in ink and a gap at the bottom
      and a stub of pencil hanging off a bit of wire.

      [Pre-Chorus]
      I am not going to think about this for a week -

      [Chorus]
      Add my name in pencil (add my name in pencil)
      Not in ink, not yet, but put it on the sheet (on the sheet)
      If it is wrong I will rub it out on Thursday
      and if it is right I will go over it in ink myself.

      [Verse 2]
      You put yours down at four this afternoon.
      I know because I have looked at that list nine times
      and I would have noticed a change in the weather sooner
      than I noticed your handwriting on the second column.

      [Pre-Chorus]
      So here I am at the wall with a bit of wire and a stub -

      [Chorus]
      Add my name in pencil (add my name in pencil)
      Not in ink, not yet, but put it on the sheet (on the sheet)
      If it is wrong I will rub it out on Thursday
      and if it is right I will go over it in ink myself.

      [Middle eight]
      Everybody I know decides everything twice.
      Once at the desk, and once at the door with a coat on.

      [Verse 3]
      A hauler out on the ninth is eleven days of nothing
      but the same four faces and whatever anybody brought.
      I have been on worse trips with better reasons
      and I have never once put my name down this fast.

      [Chorus]
      Add my name in pencil (add my name in pencil)
      Not in ink, not yet, but put it on the sheet (on the sheet)
      If it is wrong I will rub it out on Thursday
      and if it is right I will go over it in ink myself.

      [Outro - cold stop on a struck tank drum]
