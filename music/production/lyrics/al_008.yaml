      It costs a whole crossing of standing in the wrong queue,
      it costs looking like a fool in front of six of my crew,
      and it is the cheapest thing I have ever paid for.

      [Final Chorus - six voices, all different words]
      Everybody knows the fare (everybody knows the fare)
      Everybody knows it is a shade more than it was (than it was)
      Nobody has ever seen it written on a board.
      Pay it. Get on. She is at the rail and the ferry goes at four.

      [Outro - fade on six voices at once]
