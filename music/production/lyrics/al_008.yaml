    lyrics: |
      [Intro - 7 seconds, electric composite guitar over tank drums, no vocal]

      [Verse 1]
      It is eleven degrees in the loading passage and dropping
      and I have come out in a shirt like a person with a plan.
      There is a queue for the lift and the queue is not moving,
      there is cargo halfway down it that nobody will claim,
      and you are at the front of it in the good coat, obviously.

      [Chorus]
      Loan me your coat. It is a straightforward request.
      I am not asking for the year or the berth or the name.
      Twenty minutes of somebody else's warm sleeve
      and the whole passage watching to see what you do.

      [Verse 2]
      You made a performance of it, which I did expect.
      You looked at me, and at the queue, and back at me,
      and you took your time with the buttons on the way out
      and handed it over like the manifest for a whole hold.

      [Chorus]
      Loan me your coat. It is a straightforward request.
      I am not asking for the year or the berth or the name.
      Twenty minutes of somebody else's warm sleeve
      and the whole passage watching to see what you do.

      [Instrumental - guest guitar break in the loading passage, 14 seconds]

      [Verse 3]
      It is three days later and I still have the thing.
      I have worn it to the port hall and out to the hard,
      I have had it over the back of a chair at four meals,
      and every single person on this crew has noticed
      and not one of them has said a word about it to me.

      [Final Chorus - whole crew, one high harmony]
      Loan me your coat. It is a straightforward request.
      I am not asking for the year or the berth or the name.
      Twenty minutes of somebody else's warm sleeve —
      it is Thursday, it is still on the back of my chair, and you have not asked.

      [Outro - fade on the guitar and the crew]
