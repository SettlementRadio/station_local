    title: Talk to the Crew, Not Me
    track_number: 5
    mood: [wry, rowdy, fast]
    fact: >-
      The verse is what Bel Corrow says to anyone who asks the band to decide something the
      co-operative has not voted on.
    arrangement_note: the lead sings the verses and the crew answer every second line of them, so the song is arranged as an argument the singer keeps losing, and the break is the lead guitar over the crew still going
