    exclude: close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 20 seconds, chimes and bass, no vocal]

      [Verse 1]
      Everybody from a settlement has one place they are from
      and I have got a route, which is not the same thing,
      and when people ask I say the between and they nod
      and about a third of them know what I actually mean.

      [Verse 2 - recorded alone in a sealed bay]
      It is not a place. There is nothing to look at. There are no doors.
      It is nine days of the same four faces and a hold behind you
      and everybody I have ever loved is at one end or the other
      and I have spent twenty-three years in the part in the middle.

      [Chorus]
      The between. That is the whole of the address.
      Not a settlement, not an outpost, not a port with a name.
      The bit that everybody else goes through to get somewhere
      is the bit that four of us have made a life in.

      [Verse 3]
      I could not do that second verse with the band in the room.
      I tried it twice on the Tuesday and it came out wrong
      and Bel said go and do it in the sealed bay on your own,
      which he offered without asking me what the matter was.

      [Chorus]
      The between. That is the whole of the address.
      Not a settlement, not an outpost, not a port with a name.
      The bit that everybody else goes through to get somewhere
      is the bit that four of us have made a life in.

      [Bridge]
      Nobody grows up wanting this. You end up in it.
      And then one year you notice you would not take the other thing.

      [Final Chorus - the crew entering from a long way off]
      The between. That is the whole of the address,
      and there are about four hundred of us out here at any hour
      and none of us can point at it on anything,
      and every one of us knows exactly where it is.

      [Outro - held chord, left to decay]
