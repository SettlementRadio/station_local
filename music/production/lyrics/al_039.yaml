    exclude: crew chorus, group vocals, close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 6 seconds, rhythm guitar and bass, no vocal]

      [Verse 1]
      A copy came back down the relay road from four settlements out
      with our songs on it and our crate number and our sleeve
      and one name on the writing line that is not one of ours
      and belongs to a person none of us has ever met.

      [Pre-Chorus]
      It came off a hauler at the near siding on a Tuesday.

      [Chorus]
      Somebody typed that. Somebody sat and typed that
      and then went home and had an evening like anybody else.
      It is not a machine and it is not the weather.
      It is a person and there is a name and I know the name.

      [Verse 2]
      The co-operative went at it properly, in writing, for two years,
      and it is settled now and it is cited at meetings
      and none of that gives anybody back the eighteen months
      Ryke spent finding out how a thing like that even happens.

      [Pre-Chorus]
      Two years of pages. Two years of somebody else's evenings.

      [Chorus]
      Somebody typed that. Somebody sat and typed that
      and then went home and had an evening like anybody else.
      It is not a machine and it is not the weather.
      It is a person and there is a name and I know the name.

      [Verse 3]
      There is no crew behind me on this one, which is deliberate,
      and it is the only song of ours that has ever been sung alone,
      and it is because the thing this is about is the opposite
      of what a line with five names on it is for.

      [Bridge]
      I do not want an apology. I have been offered one twice.
      I want the page corrected on every copy that exists.

      [Final Chorus]
      Somebody typed that. Somebody sat and typed that.
      Four hundred crates went out of a hall with it on them
      and every one of those is still out there somewhere
      and the correction is not printed on any of them.

      [Outro - cold stop]
