    lyrics: |
      [Intro - 3 seconds, the hall's departure timer alone, no vocal]

      [Verse 1]
      Fourteen hours to Meridian and the load is not on
      and the man with the sheet has been called away to something
      and the timer on the wall has not stopped since we came in
      and does not care about any of that at all.
      Fifty-eight crates and a lane that does not wait
      and a hall full of people all doing the same arithmetic.

      [Chorus]
      Fourteen hours to Meridian. Fourteen. Now thirteen.
      Nothing anybody says in this hall changes that number.
      You can argue with the office and you can argue with the weather
      and the one thing on that wall is not in the conversation.

      [Verse 2]
      We left it running through the take because it was already going
      and it turns out to be almost exactly the tempo of this,
      which nobody arranged, and which is why the song never moves,
      because a departure timer has no idea that it is playing.

      [Chorus]
      Fourteen hours to Meridian. Fourteen. Now thirteen.
      Nothing anybody says in this hall changes that number.
      You can argue with the office and you can argue with the weather
      and the one thing on that wall is not in the conversation.

      [Verse 3]
      Every settlement I have ever loaded out of has one
      and every crew on every lane has stood underneath one
      and said something to it, out loud, that they would not repeat,
      and it has gone on doing the only thing it does,
      which is the most reliable relationship any of us has.

      [Bridge]
      We made it with about forty minutes spare, which is not close.
      It felt close. It always feels close. It is never close.

      [Final Chorus - all five voices]
      Fourteen hours to Meridian. Fourteen. Now thirteen.
      That is the most honest instrument on this record
      and it is the only one that did not have to be paid,
      and it is still on that wall and it is still going.

      [Outro - cold stop, the timer running on]
