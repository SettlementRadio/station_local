    lyrics: |
      [Intro - 14 seconds, stripped-wire chimes and one guitar, no vocal]

      [Verse 1]
      There was a page in her coat that morning and we all knew it,
      not because she had said anything, because she had gone quiet,
      and this crew is bad at a lot of things and good at that,
      and nobody asked her about it and everybody was careful.

      [Pre-Chorus]
      Fifteen years on a manifest and one page in a coat.

      [Chorus]
      The one she did not hand in. It is in a coat somewhere.
      Fifteen years of turning up and one page written at four
      and a members' meeting that went the other way by eleven votes
      and a morning where she came in and sang this instead.

      [Verse 2]
      It was never about her. That is what people get wrong.
      She had been paid the same as the rest of us for years
      and there were four other people on the co-operative's books
      who had not, and she had known all four of their numbers,
      four names on four crews on four different lanes.

      [Chorus]
      The one she did not hand in. It is in a coat somewhere.
      Fifteen years of turning up and one page written at four
      and a members' meeting that went the other way by eleven votes
      and a morning where she came in and sang this instead.

      [Verse 3]
      I would not have won that vote. I want that on the record.
      Half the membership was out on a lane and voted by carrier wave.
      I said what I thought at the meeting and it was not enough
      and about nine people I have known for twenty years
      changed their minds because of something she said at the back.

      [Bridge]
      She has never mentioned the page and none of us has either.
      It is fifteen more years now. It is probably still in the coat.

      [Final Chorus - the lead out, the woman's voice alone at the top]
      The one she did not hand in. It is in a coat somewhere,
      and there are four people on a manifest getting a proper rate
      who have no idea that any of that happened at all,
      and that is the way she wanted it and it is what she got.

      [Outro - fade]
