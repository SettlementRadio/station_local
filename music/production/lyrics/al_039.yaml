    exclude: close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production, gridded or corrected timing
    lyrics: |
      [Intro - 4 seconds, tank drums alone, no vocal]

      [Verse 1]
      Hess played this to nothing at all in a bay at the first port
      with a count in his head and the manifest on the floor in front of him
      and nine days later two guitars answered a man who was not there
      and eleven days after that I sang to both of them.

      [Chorus]
      Three ports and one run and nobody in the same room,
      and if it sounds like four people it is an accident.
      This is a crew that has never all been off shift together
      and the record is exactly as honest about that as we are.

      [Verse 2]
      There is a bar in the second chorus where the guitars are early
      and they are early because the drums were played in a bigger bay
      and Ryke heard it and left it and did not tell anybody
      and I found out about it four years later at a meeting.

      [Instrumental - lead guitar break, 16 seconds]

      [Chorus]
      Three ports and one run and nobody in the same room,
      and if it sounds like four people it is an accident.
      This is a crew that has never all been off shift together
      and the record is exactly as honest about that as we are.

      [Verse 3]
      Every band I know that got good got good in one room
      and we have never had one and we have been at this since 2596
      and what we have instead is nine days of thinking about a part
      before anybody is allowed to hear you play it,
      nine days of a hold and a lane and the same four faces
      and a part in your head that has nowhere to go.

      [Final Chorus - all five voices]
      Three ports and one run and nobody in the same room.
      I would like one room. I have wanted one room for years.
      And I would not swap what this does for what that does,
      and neither would any of the four of them, and I have asked.

      [Outro - cold stop]
