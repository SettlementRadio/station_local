  - id: s_0329
    title: Hold the Whole Chorus
    track_number: 1
    mood: [anthemic, singalong, midtempo]
    fact: >-
      Thirty-one members of the co-operative sing the final chorus, recorded in a transfer hall
      between two departures.
    arrangement_note: the last chorus is thirty-one untrained voices in a transfer hall, recorded in one go between two departures, and the band drops to bass and drums underneath so that nothing competes with it
    intro: 10
    outro: sustain
    target_duration: "5:00"
    prompt: >-
      Boogie-driven rock, 122 BPM, anthemic and midtempo, built to be sung back. Male lead vocal,
      high hard tenor, carrying and a shade nasal, pushing at the top of every chorus and staying
      there, plain and undecorated, no vibrato. A crew chorus of four and five voices in unison
      rather than harmony, mixed registers with one woman's voice clearly audible above the men —
      and on the final chorus a large untrained crowd of about thirty voices in a big hard hall,
      rough and slightly late, with the band dropped to bass and drums underneath. Two electric
      guitars, electric bass, drum kit with tuned oxygen-tank drums left ringing rather than damped,
      stripped-wire chimes. Tracked loose rather than gridded, light compression. Ten seconds of
      chimes and guitar before the first sung word. Ends on a held chord with the whole crowd
      sustaining over it.
    exclude: close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 10 seconds, stripped-wire chimes and guitar, no vocal]

      [Verse 1]
      There is a thing a room does about four seconds into a chorus
      where everybody stops listening and starts doing it instead
      and you can feel the floor change and you can stop working,
      and it is the only part of this job I have never got used to.

      [Chorus]
      Hold the whole chorus. Do not let it drop.
      Not the good half, not the bit you are sure of, all of it,
      right to the end of the line where it runs out of air,
      and if you have to be flat then be flat and be loud.

      [Verse 2]
      We put a notice out that we wanted whoever was free
      and thirty-one people came to a transfer hall on a Tuesday
      between a departure at eleven and a departure at one
      and stood on the floor in their coats and sang it four times.

      [Chorus]
      Hold the whole chorus. Do not let it drop.
      Not the good half, not the bit you are sure of, all of it,
      right to the end of the line where it runs out of air,
      and if you have to be flat then be flat and be loud.

      [Verse 3]
      None of them can sing. That is not a criticism.
      Two of them are clerks and one of them runs a scrubber line
      and one is eleven years old and came with her mother
      and is the loudest thing on the whole of this record.

      [Bridge]
      We got it on the second go and did the other two for them.
      Nobody was going to say we had finished after one.

      [Final Chorus - thirty-one voices, band down to bass and drums]
      Hold the whole chorus. Do not let it drop.
      Not the good half, not the bit you are sure of, all of it,
      and that is a hall full of people who were somewhere else at ten
      and were back at work by two and are on a record for good.

      [Outro - held chord, the whole hall sustaining]
