    exclude: close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 5 seconds, full band, no vocal]

      [Verse 1]
      A man came down to the berth off the last ferry in a good suit
      with a page in his hand and a departure in the morning
      and asked for a decision by the end of the afternoon,
      and I said yes before I had finished hearing the question,
      because I am the one at the front and that is what happens.

      [Chorus]
      Go and talk to the crew. Do not talk to me.
      I have not got a vote that is worth any more than theirs.
      There are ninety people in this and I am one of them
      and the one you are looking at is the one who sings.

      [Verse 2]
      Bel took the page out of my hand without any comment
      and handed it back to the man and told him about the meeting,
      the date of it, the time of it, and where he could sit,
      and the man looked at me and I looked at the floor.

      [Chorus]
      Go and talk to the crew. Do not talk to me.
      I have not got a vote that is worth any more than theirs.
      There are ninety people in this and I am one of them
      and the one you are looking at is the one who sings.

      [Instrumental - lead guitar break, crew chanting underneath, 14 seconds]

      [Verse 3]
      He has said it about forty times in twenty-three years
      and about eleven of those times he has said it to me,
      and every single one of the eleven I had deserved
      and about four of them I have gone back and thanked him for.

      [Bridge]
      It is slower. It is slower every single time.
      It is the reason none of us has ever been sacked or bought.

      [Final Chorus - all five voices]
      Go and talk to the crew. Do not talk to me.
      He is at the third table on the left at every meeting.
      Bring the page. Bring the numbers. Bring the whole thing.
      And bring a coat, because it goes on until about ten.

      [Outro - fade]
