#   outro      cold | fade | sustain — the intended shape (§7: roughly 30 / 45 / 25 across all 500)
#   target_duration  what the take should come out near (§7's duration bands). Judged by ear
#   prompt     the exact text to paste into Suno's style box. Built from the band's six-line style
#              card in music/production/styles.yaml plus this song's mood and arrangement note
#   exclude    the style card's exclude line, plus anything this song needs kept out
#   lyrics     the words. Opens on an instrumental-intro tag, always
#   take       **M-18 fills this in.** One block per song: attempts, date, model version, and the
