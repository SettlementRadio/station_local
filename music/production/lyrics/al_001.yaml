      [Verse 1]
      It was a chair. It was an empty chair.
      Nobody wanted it, nobody sat there.
      It came up on a hauler with the rest of the room
      And six months on we are still not agreed.

      [Chorus]
      Longest legs in town on the shortest of quarrels,
      And neither of them is putting it down.
      Take the chair, take the whole set, take the table as well -
      I'll be right about this when we're old.

      [Verse 2 - the two accounts alternating, same music, played harder]
      He says he asked her politely, and he asked her twice.
      She says he never asked her at all.
      He says he offered, and she rolled her eyes.
      She says he moved it out to the transfer hall.
      He says he put it back exactly where it stood.
      She says she was standing in the door and watched him go.
      And then nobody spoke for four days.

      [Chorus]
      Longest legs in town on the shortest of quarrels,
      And neither of them is putting it down.
      Take the chair, take the whole set, take the table as well -
