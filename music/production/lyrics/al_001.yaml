  - id: s_0001
    title: Meet Me at Noon
    track_number: 1
    mood: [bright, expectant, brisk]
    fact: >-
      Vara Ennel wrote the chorus on the back of a room-booking refusal and kept the clerk's stamped
      time as the title.
    arrangement_note: keyboard figure alone for the first six seconds, hand percussion joining on the last bar before the verse
    intro: 6
    outro: cold
    target_duration: "3:05"
    prompt: >-
      Sunshine pop and soft rock, 124 BPM, bright and expectant. Female lead vocal in mid register,
      clear and unforced, plain conversational diction, sung just ahead of the beat and never
      belted. Three group voices answering the lead across the chorus, a low harmony under the last
      chorus, all four voices on the final refrain. Harpsichord-toned electric keyboard, fretted
