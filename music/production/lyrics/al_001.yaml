      [Intro - 9 seconds, dry rhythm on stacked drinking cups alone, no vocal]

      [Verse 1]
      Four cups upside down on a ration tray,
      You said give me one minute, I'll say what I mean.
      The kettle was empty, the lights were half out,
      And you wrote it on a receipt at seventeen past.

      [Chorus]
      It was a paper cup promise (paper cup promise)
      Cheap in the hand and it held (and it held)
      Everybody laughed when you made it (when you made it)
      Nobody's laughing now.

      [Verse 2]
      You'd think a thing like that would go soft in the rain,
      Something you'd throw in the bin by the door.
      But I have had good paper come apart in my hands,
      And that one got up and caught the last ferry with me.

      [Chorus]
      It was a paper cup promise (paper cup promise)
      Cheap in the hand and it held (and it held)
      Everybody laughed when you made it (when you made it)
      Nobody's laughing now.

      [Bridge]
      Not a ring, not a room, not a name on a line.
      Just a tray and a table and the last of your time.

      [Final Chorus - all four voices]
      It was a paper cup promise (paper cup promise)
      Cheap in the hand and it held (and it held)
      Everybody laughed when you made it (when you made it)
      Nobody's laughing now - it held, it held.

      [Outro - fade on the cup rhythm and the repeated "it held"]
