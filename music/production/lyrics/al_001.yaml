      I traced it with a finger and it went cold and still,
      And it looked like a road out and it looked like nothing at all.

      [Verse 2]
      Your side of the room keeps the shape that you left,
      A cup, a coat, an argument half done.
      Your last word came down the relay on a Tuesday
