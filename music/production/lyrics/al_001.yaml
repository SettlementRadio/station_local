      I kept the hour, I kept the hour.

      [Verse 2]
      You're never late, you're carefully slow,
      You check the time like it might have moved.
      I've got a pocket full of official no
      And an afternoon with nothing to prove.

      [Pre-Chorus]
      I don't need the room, I don't need the hall,
      Just the middle of the day they didn't own at all.

      [Chorus]
