# --------------------------
# M-17's 45 songs failed four of COMMISSION.md §12's counted rules on every album: one section
# shape across nine songs in twelve, the echoed answer in 45 of 45, the title used as the hook in
# 41 of 45, and not one lyric of the 45 carrying two of the world's own nouns. The words are new;
# every song's id, title, mood, fact, intro, outro and target duration are unchanged, because those
# come from the wiki and from §7's distributions and were never what was wrong.
#
#   · **Section shapes vary.** No shape covers more than a quarter of an album.
#   · **The echoed answer is now a device rather than a habit** — three songs an album at most.
#     The band's answering voices have not gone anywhere; they are in the section tags and the
#     prompts, where they belong. A group answering the lead is an arrangement. A parenthetical
#     repeat of the line just sung is a tic, and it was in all 45.
#   · **The title is the hook in a minority of songs.** Elsewhere it names the record's image and
#     the chorus says something else.
#   · **Every lyric carries the world's furniture** — §12 rule 5's list, used as furniture and never
#     as subject (§3). Relay-pop is love across the lag; this is the album where that is audible.
#
# The prompts carry relay-pop's palette as COMMISSION.md §2 now states it — power-pop, jangle,
# sunshine pop and soft rock, never dance-pop and never modern produced radio pop. M-17 wrote
# "contemporary produced pop" at the top of all 23 b_001 prompts, which is the sound stage R
# removed from the form.
#
# The shape
# ---------
# album:       what record this is. Identity only; the wiki is the authority for every field.
# generation:  the per-album metadata block. **Empty until M-18 fills it in at the Suno sitting.**
#              `make music-tag` (M-05) reads it and writes licence period, generation date, model
#              version and the AI marker into every audio file's own tags.
# songs[]:     one entry per song, in track order, keyed by the wiki's song id.
#   mood       copied from the wiki's mood_tags — the prompt is built from it
#   fact       copied from the wiki. The lyric has to fit it; it is why the song is this song
#   arrangement_note  the one per-song instruction inside the fixed style card (COMMISSION.md §7)
#   intro      the instrumental ramp, in seconds, before the first sung word (§7: ≥40% of songs
