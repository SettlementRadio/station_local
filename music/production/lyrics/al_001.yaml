    lyrics: |
      [Intro - 6 seconds, keyboard figure alone, hand percussion on the last bar, no vocal]

      [Verse 1]
      The clerk had a stamp and she used it twice,
      Once on the paper and once on the hour.
      Nine tidy words and a refusal underneath,
      And the only good thing on it was the time.

      [Pre-Chorus]
      I don't need the room and I don't need the hall -

      [Chorus]
      Come and find me where the transfer hall goes quiet,
      Under the clock, on the stroke, and let the whole queue pass.
      They can have their paper back, I kept the hour.
      I kept the hour, and it costs nobody anything.

      [Verse 2]
      You're never late, you're carefully slow,
      You check the time like it might have moved.
      I've a pocket full of official no
      And an afternoon that nobody has booked.

      [Pre-Chorus]
      I don't need the room and I don't need the hall -

      [Chorus]
      Come and find me where the transfer hall goes quiet,
      Under the clock, on the stroke, and let the whole queue pass.
      Twelve is twelve wherever you are standing,
      And the ferry can go without me. I'm not on it.

      [Outro - cold stop on the downbeat, no ring]
