      Nobody puts a stamp on a hand (nobody, nobody)

      [Final Chorus - all four voices]
      Meet me at noon (meet me at noon)
      Out where the light comes through the glass (through the glass)
      Meet me at noon (meet me at noon)
      I'll be there early, let the whole queue pass.
      They can have their paper back, I'm done with it -
