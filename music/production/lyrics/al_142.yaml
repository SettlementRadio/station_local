  - id: s_1163
    title: Stay Where the Water Is
    track_number: 9
    mood: [final, close, warm]
    fact: >-
      The last thing cut in the wharf room, sung with the doors on to the water standing open, and a
      boat goes past underneath the final verse.
    arrangement_note: both doors on to the water were left open for the take and a boat goes past two-thirds of the way through the last verse, which nobody in the room looked up at and nobody cut out
    intro: 15
    outro: sustain
    target_duration: "4:15"
    prompt: >-
      76 BPM warm blues; high female lead, low harmonies, concertina, open doors, passing boat, hold.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, dry or sealed room, vocal tuning, whispered or rapped sections, modern studio production, cold ending, fade-out
    lyrics: |
      [Intro - concertina and guitar, fifteen seconds]

      [Verse 1]
      Your berth card waits beside the wharf-room doorway,
      two clean bags are standing by the wall.
      Last ferry leaves below the morning water;
      you have paid the fare and answered every call.
      I will never tell you not to travel.
      Every open lane deserves a look.
      I only ask you stand here through the evening,
      hear the loaded haulers clear the hook.

      [Chorus]
      Stay where the water is tonight.
      Stay until the window loses light.
      Home is not a chain around your ankle;
      it is one known shore that holds your place in sight.

      [Verse 2]
      My brother chose a settlement beyond us.
      My sister nearly followed past the core.
      Every person landing at this basin
      left another lamp beside another door.
      Going is not faithless, staying no surrender;
      neither one can prove a heart is true.
      I would rather bless the road that takes you
      than make the water something owed to you.

      [Chorus]
      Stay where the water is tonight.
      Stay until the window loses light.
      Home is not a chain around your ankle;
      it is one known shore that holds your place in sight.

      [Verse 3 - doors open; a hauler passes after line four]
      The evening freight crew loosens from the lower gate.
      Cargo chains knock softly under strain.
      Neither of us turns to watch the bow pass,
      though its wake sends silver through the room.
      You put one bag back underneath the table,
      leave the other standing for the dawn.
      One more night is not a final answer;
      it is room enough to hear what carries on.

      [Final Chorus]
      Stay where the water is tonight.
      Stay until the window loses light.
      If tomorrow takes you past the basin,
      leave one known shore that still keeps your place in sight.
      Every cargo comes from somewhere distant;
      every traveler leaves one door behind.

      [Coda - sustain, open water through both doors]
