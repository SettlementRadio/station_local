  room: >-
    Two rooms eleven miles apart — the lock house front room at the head of the cut, and a wharf room
    at the bottom with two doors on to the water — plus one track cut standing under a canal bridge.
    Everything acoustic and close, one or two microphones, nothing overdubbed, the bass still deadened
    with rope. The card holds throughout: light high female lead sung quietly, two close harmonies
    under her, concertina in the line-up. Three fact-bound details live in their own songs: the lock
    key struck on the arch of the seventh bridge on s_1161, which arrives a beat late and is what the
    whole track is played against; the two lock keepers' daughters who were in the room for s_1160 and
    had never met; and the boat that goes past under the final verse of s_1163, through open doors,
    with nobody looking up.

