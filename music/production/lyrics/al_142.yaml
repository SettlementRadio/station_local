  - id: s_1159
    title: The Bottom Gate Leaks
    track_number: 5
    mood: [blunt, hard, driving]
    fact: >-
      The bottom gate of the lowest lock has leaked since 2601 and the band sent this song to the
      navigation office with a copy of the record.
    arrangement_note: the hardest thing on the record, taken flat out with the concertina doubling the bass line rather than the tune, which is the only place on any of their records it goes down there
    intro: 4
    outro: cold
    target_duration: "3:30"
    prompt: >-
      110 BPM hard blues; high female lead, low harmonies, concertina doubles bass, guitar, kit, stop.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, fade-out
    lyrics: |
      [Intro - full band, four seconds]

      [Verse 1]
      The bottom gate leaks through every season,
      silver at the hinge and brown below.
      Eleven written notices have found the office;
      two pairs of boots went there to make it known.
      One man filled the form knee-deep in water,
      dried it on the boiler by the quay.
      Somewhere there is a file with every answer.
      Here the top pound drains toward the sea.

      [Refrain]
      The bottom gate leaks, four inches by the morning.
      No alarm will sound, no red light starts.
      Small waste lives forever without danger;
      quiet damage never gets a chart.

      [Verse 2]
      Four inches means a loaded cargo waiting,
      freight crew wages thinning in the sun,
      one missed berth beyond the lower basin,
      one more ration bought when work is done.
      The office keeps the water, labor, shipping
      each beneath a different careful hand.
      No one desk can see the whole thing leaking;
      every desk can say it understands.

      [Refrain]
      The bottom gate leaks, four inches by the morning.
      No alarm will sound, no red light starts.
      Small waste lives forever without danger;
      quiet damage never gets a chart.

      [Bridge]
      Come in summer when the pound lies shallow.
      Bring your polished shoes and stand below.
      Hear a working week escape beside you,
      drop by patient drop where wages go.

      [Verse 3]
      We have packed the split with rope and sacking,
      watched the patch pull loose before the rain.
      We have marked the fall beside the lock wall,
      sent the figures outward on the lane.
      If the next reply says further consultation,
      we will send wet boots instead of words.
      Let them dry beneath the office boiler.
      Let the stain explain what paper never could.

      [Final Refrain]
      The bottom gate leaks, four inches by the morning.
      Eighteen summers running through the dark.
      Mend the hinge before the whole cut feels it;
      small neglect has left a working mark.

      [Outro - cold stop]
