  - id: s_1157
    title: It Was Meant for Somebody Else
    track_number: 3
    mood: [wry, rolling, plain]
    fact: >-
      About a coat somebody left in the lock house and never came back for, which is still on the same
      hook.
    arrangement_note: a plain rolling three-chord thing with the concertina out of it entirely, which is the only track on the record without one and makes the coat song sound like the first record
    intro: 8
    outro: fade
    target_duration: "3:45"
    prompt: >-
      94 BPM rolling blues; high female lead, low harmonies, guitar, piano, dry bass, no concertina.
    exclude: concertina, slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - guitar and bass, eight seconds]

      [Verse 1]
      A good black coat hangs by the lock-house doorway,
      shoulders broad and lining stitched by hand.
      Someone left it after tea one autumn,
      then crossed the cut before the evening rain.
      No name hides inside the inner pocket,
      no berth slip, no old cargo receipt.
      Only river grit along the left cuff,
      and one pale thread where something used to be.

      [Chorus]
      It was meant for somebody else,
      so we keep it dry and leave the hook alone.
      Storm season takes what people fail to fasten;
      this one thing may still be coming home.

      [Verse 2]
      Twice my own coat split across the shoulder.
      Twice I stood beneath that warmer cloth.
      It would fit me like a thing I had commissioned;
      no one on the lane would know the loss.
      But I picture him beyond the farthest lock gate,
      counting every garment he has worn,
      thinking of a room beside the water
      where he left one useful piece of home.

      [Interlude - piano and guitar, eight seconds]

      [Verse 3]
      A young freight crew came asking after shelter,
      soaked from tying cargo through the squall.
      One stood shivering by the empty fireplace,
      staring at the finest coat of all.
      I gave him mine and wrapped myself in canvas.
      He laughed, then understood and did not ask.
      Some promises are made without a witness;
      some are only hooks we do not pass.

      [Chorus]
      It was meant for somebody else,
      so we keep it dry and leave the hook alone.
      If the owner steps from some late hauler,
      one small faith will still be waiting home.

      [Verse 4]
      Years may turn the black wool brown and brittle.
      Dust may find the collar and the seam.
      Still each morning someone clears the doorway,
      careful not to brush away the dream.
      The last ferry brings a hundred strangers;
      any one might recognize the thread.
      Till that day the coat keeps its own silence,
      holding room for someone not here yet.

      [Outro - fade]
