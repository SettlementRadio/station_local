  - id: s_1162
    title: She Never Wrote Back
    track_number: 8
    mood: [slow, aching, blue]
    fact: >-
      The only song on the record Fenna Crole did not write; Aldis Merrow wrote it, has never said who
      it is about, and the band have stopped asking him.
    arrangement_note: written by the piano chair and sung by the lead, which is the arrangement of the whole band inverted for one track, and the piano never comes forward at any point in it
    intro: 18
    outro: fade
    target_duration: "4:25"
    prompt: >-
      62 BPM aching blues; quiet high female lead, end harmonies, distant piano, guitar, dry bass, fade.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, forward or virtuoso piano, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano alone, eighteen seconds]

      [Verse 1]
      I sent the page beneath a flour manifest,
      sealed against the damp with candle wax.
      Wrote the berth where every last ferry found me,
      wrote the month I thought that I'd be back.
      Cargo took it outward through the basin,
      relay notice said it cleared the line.
      I slept beneath the certainty of answer,
      foolish as a clock that trusts the time.

      [Verse 2]
      First year I blamed weather in the between,
      storm season, missed hands, a broken seal.
      Second year I blamed her work and family,
      all the honest things a silence might conceal.
      Third year every reason turned to mercy;
      I stopped making villains out of air.
      Some doors close without a sound between them.
      Some departures never know they're there.

      [Refrain]
      She never wrote back, and the lane kept waking.
      She never wrote back, and the locks ran down.
      Nothing cruel arrived for me to answer;
      only no word, wearing every sound.

      [Verse 3]
      I kept one page unfinished by the window,
      changing how it opened every spring.
      Anger made it short and pride made it colder;
      loneliness forgave most everything.
      Then I saw the sentences were asking
      someone absent to explain my life to me.
      I folded them beneath the cargo ledger,
      let the empty paper finally be.

      [Refrain]
      She never wrote back, and the lane kept waking.
      She never wrote back, and the locks ran down.
      Nothing cruel arrived for me to answer;
      only no word, wearing every sound.

      [Verse 4 - two harmonies enter on the final four lines]
      If her letter comes when I am older,
      I will break the seal with steady hands.
      I will meet the person who once wrote it
      as the person time has let me stand.
      If it never comes, the water still moves outward.
      Bread still reaches every waiting town.
      I can live without the final reason.
      I have lived through all the years till now.

      [Outro - fade]
