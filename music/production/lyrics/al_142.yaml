  - id: s_1160
    title: Two Names on the Bill
    track_number: 6
    mood: [midtempo, fond, plain]
    fact: >-
      The two names in the chorus belong to the lock keepers who worked the cut before Fenna Crole's
      family did, and both their daughters were in the room for it.
    arrangement_note: the piano is played very quietly for the whole track because two old women were talking in the room while it was cut and nobody would have dreamed of asking them to stop
    intro: 10
    outro: sustain
    target_duration: "4:00"
    prompt: >-
      88 BPM fond blues; high female lead, low harmonies, very quiet piano, concertina, dry bass, hold.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, loud or forward piano, vocal tuning, whispered or rapped sections, modern studio production, cold ending, fade-out
    lyrics: |
      [Intro - piano and concertina, ten seconds]

      [Verse 1]
      Scraping back a shelf beside the doorway,
      we found blue letters underneath the white.
      Two careful names along the old oak lintel,
      one still clear and one worn nearly light.
      Before our key had turned inside this lock house,
      two other families woke here in the dark,
      boiled the same first kettle before morning,
      watched the same low cargo clear the mark.

      [Chorus]
      Under the whitewash, somebody was here.
      Someone kept the water, someone kept the year.
      Houses on the lane belong to every hand in turn;
      paint us over gently when our own time disappears.

      [Verse 2]
      Their daughters came and stood below the writing,
      one with silver hair, one walking with a cane.
      Neither knew the other till a small remembered detail:
      where the winter coats had dripped beside the drain.
      Then the room filled up with fathers in the morning,
      muddy cuffs and bread wrapped for the day,
      one who sang while opening the upper paddle,
      one who never spoke before the gates were raised.

      [Room Voices - two older women, softly overlapping]
      He kept the spare key underneath the flour.
      So did mine, but only after frost.
      We must have passed as children by the basin.
      We passed through more than either of us thought.

      [Chorus]
      Under the whitewash, somebody was here.
      Someone kept the water, someone kept the year.
      Houses on the lane belong to every hand in turn;
      paint us over gently when our own time disappears.

      [Verse 3]
      No one owns the hour before the sunrise,
      or the beam polished smooth by every palm.
      The settlement may print a holder's name there;
      work remembers bodies, not the form.
      We leave the blue letters beneath the peeling,
      add no fresh one while the walls are ours.
      Someday other hands will scrape this doorway,
      hear us in the kettle and the waking water.

      [Final Chorus]
      Under the whitewash, somebody was here.
      Someone kept the water, someone kept the year.
      Houses on the lane belong to every hand in turn;
      paint us over gently, but leave the letters near.

      [Coda - sustain]
