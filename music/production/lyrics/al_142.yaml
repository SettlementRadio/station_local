  - id: s_1156
    title: Letters Take a Season
    track_number: 2
    mood: [patient, blue, midtempo]
    fact: >-
      The second verse is Aldis Merrow's arithmetic about an answer that cannot arrive in the same
      year as the letter it answers, sung as he wrote it out.
    arrangement_note: the arithmetic section is sung flat over the piano alone with the rest of the band out of it, because it is a sum being read off a sheet and has no tune in it
    intro: 14
    outro: sustain
    target_duration: "4:05"
    prompt: >-
      82 BPM patient blues; high female lead, low harmonies, flat count over solo piano, concertina, hold.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, vocal tuning, whispered or rapped sections, rapped delivery, modern studio production, cold ending, fade-out
    lyrics: |
      [Intro - piano, fourteen seconds]

      [Verse 1]
      I wrote in spring when blossom touched the towpath,
      asked if you would meet me at the sea.
      Sealed the page beneath the cargo ledger,
      watched the hauler take it out from me.
      Summer crossed the lane without an answer.
      Storm season shut the farther relay down.
      By winter I had learned to sleep without you,
      then thaw brought your handwriting back around.

      [Flat Count - one voice over piano alone]
      One season outward. One season waiting.
      One season homeward through the lag.
      Ask under blossom, answer under blossom.
      Count one full year inside the bag.

      [Verse 2]
      You said yes to someone from last April,
      someone certain, restless, ready then.
      I read your yes beside a different window,
      with different work and steadier hands.
      The last ferry named an open berth there.
      My mother needed help above the gate.
      A true reply can travel without lying
      and still arrive too honestly, too late.

      [Refrain]
      Write it while the words are warm and living.
      Send it though the weather will have turned.
      We cannot make the distance keep our timing;
      we can tell the truth before it learns.

      [Verse 3]
      I answered from the person I had grown to,
      not the one who watched your cargo leave.
      I said love had not become refusal;
      it had changed the shape of what I need.
      Maybe next spring you will read that sentence,
      standing in a room I cannot see.
      You may bless the year that stood between us.
      You may write another life to me.

      [Refrain]
      Write it while the words are warm and living.
      Send it though the weather will have turned.
      We cannot make the distance keep our timing;
      we can tell the truth before it learns.

      [Coda - sustain]
      One season outward. One season home.
      Every answer finds us changed.
      No heart stays unchanged.
