  - id: s_1158
    title: Eleven Miles of Water
    track_number: 4
    mood: [steady, warm, rolling]
    fact: >-
      Torr Bexley counts the eleven miles off by the bridges rather than by the locks, which is how the
      crews do it and why his numbers do not agree with the band's first record.
    arrangement_note: one short section is two voices counting the same eleven miles two different ways, one after the other, with the band holding a single chord under both of them
    intro: 12
    outro: fade
    target_duration: "4:00"
    prompt: >-
      92 BPM warm blues; high female lead, low harmonies, two flat counters, held chord, concertina, fade.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - concertina and piano, twelve seconds]

      [Verse 1]
      You count bridges from the bow of a hauler,
      every arch a milepost over rain.
      I count locks by paddles, beams, and waiting,
      every fall a number in my hands.
      You say fourth bridge, I say third gate,
      both point where the hawthorn meets the wall.
      We have shared this cut since early morning,
      naming different roads and not lost once at all.

      [Chorus]
      You count the bridges, I count the gates.
      Same green water carries both our weights.
      Freight crews know the language of arriving;
      keep your measure, I will keep mine straight.

      [Verse 2]
      Seventeen arches lean across the channel,
      eleven chambers lower toward the sea.
      One old aqueduct escapes our numbers,
      though we always stop there for our tea.
      Your cargo clock begins when rope starts pulling.
      Mine begins when upper paddles rise.
      By the long pound both accounts are even,
      and the afternoon is level in our eyes.

      [Two Counts - flat voices over one held chord]
      Bridge one, bridge two, aqueduct, bridge four.
      Lock one, lock two, third gate, long pound.
      Bow calls forward. Bank calls downward.
      Both call home before the final round.

      [Chorus]
      You count the bridges, I count the gates.
      Same green water carries both our weights.
      Freight crews know the language of arriving;
      keep your measure, I will keep mine straight.

      [Verse 3]
      When the fog erases every marker,
      you hear brick throw back the engine's hum.
      I feel pressure changing at the balance,
      know which lock the hidden water comes from.
      No manifest can hold both kinds of knowing,
      no lane map shows the body learning place.
      Walk beside me through the final mile now;
      tell me what you see and let me name the gates.

      [Bridge]
      One route underneath us, two lives above it.
      Neither needs the other's count erased.

      [Final Chorus]
      You count the bridges, I count the gates.
      Same green water carries both our weights.
      At the basin all our numbers open;
      we arrive together, neither one too late.

      [Outro - fade]
