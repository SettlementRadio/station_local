    target_duration: "3:40"
    prompt: >-
      100 BPM dry blues; high female lead, low harmonies, guitar-concertina unison, piano, bass, fade.
    exclude: slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - guitar and concertina, six seconds]

      [Verse 1]
      Your letter found the wrong gate in the springtime,
      wrong district, wrong river, wrong stone wall.
      Someone read the manifest too quickly;
      someone else pushed cargo down the hall.
      I broke the seal beside the morning kettle,
      saw a question meant for distant hands.
      I should have tied it to the next returning hauler.
      Instead I wrote the answer that I had.

      [Refrain]
      You called across the lag and reached a stranger.
      I called back before good sense could start.
      The relay knows the place that you intended;
      it cannot know the place that heard your heart.

      [Verse 2]
      Your next page came with weather from last winter,
      asking if the bottom lock still froze.
      I sent the height of water after rainfall,
      then added how the evening primrose grows.
      Soon the error was the least of what we carried:
      market news, bad jokes, a pressed green leaf,
      your account of one loud night in the transfer hall,
      my small confession written underneath.

      [Refrain]
      You called across the lag and reached a stranger.
      I called back before good sense could start.
      The relay knows the place that you intended;
      it cannot know the place that heard your heart.

      [Bridge]
      Right names close the distance like a ledger.
      Wrong names leave a door nobody planned.
      One can lose a parcel for a season;
      one can find a life in other hands.

      [Verse 3]
      Now your letters come addressed without correction,
      my lock house written plainly by the lane.
      The clerk who made the first mistake is elsewhere;
      neither of us ever learned his name.
      If you arrive upon the last ferry,
      bring the coat you promised and no proof.
      I will meet you where the water leaves the basin,
      wrong for every place but this one, coming home.

      [Refrain]
      You called across the lag and reached a stranger.
      I called back before good sense could start.
      The relay knows the place that you intended;
      it cannot know the place that heard your heart.

      [Outro - fade]
