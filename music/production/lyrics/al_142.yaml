# al_142 — Not the Band You Wrote For · The Ninefoot Cut (b_063) · Relay Road Import · 2619 · 9 songs · album
#
# Written by M-25. **The file shape is fixed by al_001.yaml — read that header once.** Production
# vocabulary (COMMISSION.md §8): never enters the wiki, never said on air. Lyrics written by hand;
# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# Cut in 2617 in the lock house and in a wharf room at the bottom of the cut, and issued at the road
# head in 2619. **The band's answer to the argument out here about whether the importer landed the
# wrong band from Earth** — and it disappointed the people who had written the letters, because it is
# not an angry record and only `s_1155` and `s_1156` are about the argument at all. The rest is a
# coat on a hook, a leaking gate, two names under whitewash and a bridge with an echo.
#
# It is the longest record they have made and **the only one made in two rooms**: the lock house at
# the head of the cut and a wharf room eleven miles down it, which is what `s_1163` is about and why
# the last track has open doors and a boat going past in it. `s_1161` was cut standing underneath a
# canal bridge, with Sim Pallow striking the arch with a lock key all the way through and the arch
# giving it back a beat late.
#
# **`s_1162` is the only song on the record Fenna Crole did not write.** Aldis Merrow wrote it, words
# and all, and handed it over to be sung; the lead voice does not change, because the card's voice
# line is about who sings and this band's writer and singer are simply not the same person here.
#
# `generation:` and every `take:` are empty until M-34.

