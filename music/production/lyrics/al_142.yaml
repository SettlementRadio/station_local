  - id: s_1161
    title: Working Under the Bridge
    track_number: 7
    mood: [loud, defiant, fast]
    fact: >-
      Sim Pallow strikes the arch of the bridge with a lock key all the way through, because the band
      played this one standing underneath it.
    arrangement_note: a lock key struck on stone is the only percussion on the track and the arch returns it about a beat late, so the band are playing against their own echo and gave up trying not to
    intro: 3
    outro: cold
    target_duration: "3:20"
    prompt: >-
      112 BPM fast blues; high female lead, low harmonies, stone-key echo only, guitar, concertina, stop.
    exclude: drum kit, slide guitar, electric instruments, synthesizers, drum machines, brass, orchestral strings, harmony above the lead, dry or close recording, vocal tuning, whispered or rapped sections, modern studio production, fade-out
    lyrics: |
      [Intro - lock key on stone, three seconds]

      [Verse 1]
      Rain comes sideways at the seventh crossing,
      drives three haulers underneath the arch.
      Canvas snaps above the waiting cargo;
      towropes darken, boots sink in the path.
      One hand strikes a lock key on the stonework.
      One beat later, brick returns the blow.
      We lift the jammed brace to that crooked measure,
      half on what we hit and half on echo.

      [Chorus]
      Under the arch, let the old bridge answer.
      Strike it once and hear the second hand.
      Freight crews pull when both sounds come together;
      rain can take the lane, but not our stand.

      [Arch Beat - lock key on stone, no other percussion]
      One for the hand.
      Two for the stone.
      One from the living.
      Two coming home.

      [Verse 2]
      Water climbs the wheel marks by the abutment.
      Stripped wire whistles from a broken post.
      She knots the hauling line around her shoulder;
      he sets both heels and calls the next pull close.
      Every shout returns with someone else's ending,
      every count comes doubled from the span.
      We stop trying to make the echoes follow,
      learn to leave a beat for what comes back.

      [Chorus]
      Under the arch, let the old bridge answer.
      Strike it once and hear the second hand.
      Freight crews pull when both sounds come together;
      rain can take the lane, but not our stand.

      [Verse 3]
      By late afternoon the brace sits level.
      First boat eases through with inches clear.
      Initials cut above us catch the lamplight,
      hands from other storms still gathered here.
      No office gave permission for the shelter.
      Stone made room and labor made the claim.
      We shoulder tools toward the lock-house fire,
      while the arch keeps calling after us through rain.

      [Break - lock key and delayed echo]

      [Final Chorus]
      Under the arch, let the old bridge answer.
      Strike it once and hear the second hand.
      Cargo moves when both sounds come together;
      rain can take the lane, but not our stand.

      [Outro - cold stop]
