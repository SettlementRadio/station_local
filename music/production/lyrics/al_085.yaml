  - id: s_0696
    title: Who Is Paying for the Room
    track_number: 4
    mood: [brisk, blunt, wry]
    fact: >-
      The lyric is a version of the argument the band had with the co-operative about the cost of the
      hold, and both sides agreed it was accurate.
    arrangement_note: the verses alternate between two positions in the arrangement — one where the band is together and one where the fiddle and bass are on opposite sides of the tune — because the lyric is two people arguing and both of them are right
    intro: 4
    outro: cold
    target_duration: "3:50"
    prompt: >-
      154 BPM blunt reel; low dry male bass-baritone, female chorus, split fiddle and bass, cold stop.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, fade-out
    lyrics: |
      [Intro - band, four seconds]

      [Verse 1]
      The invoice sat between us at a borrowed settlement table,
      nine nights in a hired hold picked out in heavy ink.
      Four work coats faced two co-operative coats at nine.
      Rain moved along the berth glass; nobody touched the tea.
      Ilsa had the figures. Reddin had his arms crossed tight.
      The officers had nine hundred names behind their answer.
      Everybody knew the money had to leave somebody's hands.

      [Chorus]
      Who is paying for the room. Somebody is paying for the room.
      It is never nobody. There has never once been a nobody.
      It leaves by the gate, or the co-operative ledger,
      or four wage packets missing half a working fortnight.

      [Verse 2 - the band pulls apart]
      They said, "We cannot justify a hold that does not move."
      We said, "You asked us back. This was the price we named."
      They said, "Both are true and neither finds the money."
      We said, "Every promise reaches cost before the end."
      They said, "Yes. Exactly." Then the whole room lost its language.
      Ilsa poured the cooling tea and let the silence take one minute.
      "Send the invoice to the members. Let the owners choose."

      [Instrumental - fiddle break, sixteen seconds]

      [Verse 3]
      Ballot slips went out beneath the freight manifests on Tuesday,
      down the relay road, through sidings, halls and waiting berths.
      Hauler crews marked yes or no between their loading shifts.
      Some wrote, "Far too much." Some wrote, "Hire it twice."
      Nine hundred working owners sent the paper home.
      The count came back a yes with every objection still attached.
      Ilsa read the total once and pushed the invoice down the table.

      [Chorus]
      Who is paying for the room. Somebody is paying for the room.
      It is never nobody. There has never once been a nobody.
      It leaves by the gate, or the co-operative ledger,
      or four wage packets missing half a working fortnight.

      [Final Chorus - harmony from the bass chair]
      Who is paying for the room. Nine hundred freight crews are.
      It is never nobody. There has never once been a nobody.
      Nine nights in a hold that never leaves its berth.
      This time everybody paid, and everybody got a vote.
      Ilsa lifts the tea. The officers lift theirs.

      [Outro - cold stop]
