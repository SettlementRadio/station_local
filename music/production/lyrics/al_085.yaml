  - id: s_0694
    title: A Hold Going Nowhere
    track_number: 2
    mood: [midtempo, wry, warm]
    fact: >-
      Written about the hired hold the record was made in, which the co-operative paid for by the
      night and which never left its berth.
    arrangement_note: the tune sits still — no key change, no tempo change and no dynamic change anywhere in it, and the band deliberately never builds — because it is a song about paying by the night for something that is not moving
    intro: 6
    outro: fade
    target_duration: "3:55"
    prompt: >-
      136 BPM warm static reel; low dry male bass-baritone, female chorus, no build, boxy hold, fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, dynamic swells, key changes, cold ending
    lyrics: |
      [Intro - band, six seconds]

      [Verse 1]
      I asked the co-operative clerk to find an empty hold.
      She found six that carried cargo and one tied at the berth.
      The travelling six were spoken for; the idle one cost extra.
      Forty-one a night, she said, and watched me understand.
      Nine nights for a room built only to be somewhere else,
      nine nights going nowhere with no load beneath our names.
      I signed the hire form and laughed before the ink was dry.

      [Chorus]
      Paid by the night for a thing that is not moving,
      tied at a berth with nothing in it but a band.
      Every other hold along the lane earns while it travels.
      We hired one, shut the hatch, and did not sail.
      Forty-one till morning. Let the berth lights stay.

      [Verse 2]
      Ilsa did the arithmetic and read it at the table:
      three hundred sixty-nine before we bought a meal.
      "What exactly have you paid for?" I said, "The sound we know."
      "You bought the shape," she said. "The cargo made the sound."
      Reddin tapped the empty wall; it answered like a tank.
      Col said, "Put the cases round us. That will dull it down."
      Ilsa checked the total twice and brought her bass aboard.

      [Verse 3]
      By the seventh night, the joke had found its honest answer:
      four work coats by the hatch and no shift whistle due,
      nobody waiting for the manifest, no cargo to inspect,
      nowhere the four of us were meant to be by dawn.
      We sat on cases after closing with the berth lights coming through.
      Forty-one had bought an hour nobody else could claim.
      Ilsa raised her cup and said, "That part was worth the shape."

      [Chorus]
      Paid by the night for a thing that is not moving,
      tied at a berth with nothing in it but a band.
      Every other hold along the lane earns while it travels.
      We hired one, shut the hatch, and did not sail.
      Forty-one till morning. Let the berth lights stay.

      [Final Chorus - harmony from the bass chair]
      Paid by the night for a thing that is not moving,
      and every freight crew on the lane can laugh at that.
      Nine idle nights, one invoice, four coats beside the hatch.
      Let them laugh. We knew exactly what we bought.
      Forty-one till morning, and nowhere else to go.

      [Outro - fade]
