    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, dynamic swells, key changes, cold ending
    lyrics: |
      [Intro - band, six seconds]

      [Verse 1]
      We said we would make a third one if it was made in a hold
      and the co-operative said fine and then went and looked
      and discovered that a hold is a thing that is usually going somewhere
      and that a hold that is not going somewhere still costs money.
      Forty-one a night. Nine nights. For a room at a berth.
      That is the single most expensive joke I have ever made.

      [Chorus]
      Paid by the night for a thing that is not moving,
      tied at a berth with nothing in it but a band.
      There is a whole trade out there running on this,
      and we hired one and sat in it and did not sail.

      [Verse 2]
      Ilsa did the arithmetic and read it out at the table
      and asked, reasonably, what exactly we thought we were buying.
      I said the sound. She said you are buying a shape.
      A hold sounds like a hold because it is full of things.
      Take the cargo out and it is a big empty tin.
      She was right about that too and we did it anyway.

      [Verse 3]
      What we were actually buying, and I know this now,
      is nine nights of the four of us in a room with a door shut
      at the end of twenty-seven years of doing this,
      with nobody's shift in the morning and nothing to sign.
      That is worth forty-one a night. That is worth more.
      The co-operative has not sent us the invoice and will not.

      [Chorus]
      Paid by the night for a thing that is not moving,
      tied at a berth with nothing in it but a band.
      There is a whole trade out there running on this,
      and we hired one and sat in it and did not sail.

      [Final Chorus - harmony from the bass chair]
      Paid by the night for a thing that is not moving,
      and every crew on this lane has heard about it by now.
      There is a whole trade out there running on this.
      Let them laugh. It was worth every single night.

      [Outro - fade]
