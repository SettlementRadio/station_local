  - id: s_0695
    title: Slower Than We Used To
    track_number: 3
    mood: [slow, fond, weathered]
    fact: >-
      The tempo is the one Col Sennet asked for after twenty-seven years of playing it faster, and the
      band recorded it his way on the first take.
    arrangement_note: the tempo is about twenty beats a minute under where this tune has been played for twenty-seven years, at the fiddle player's request, and everything in the arrangement has more room in it as a direct result
    intro: 14
    outro: fade
    target_duration: "4:35"
    prompt: >-
      118 BPM weathered reel; low dry male bass-baritone, female chorus, sparse crates, roomy phrasing.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, fast reel tempo, cold ending
    lyrics: |
      [Intro - fiddle, fourteen seconds]

      [Verse 1]
      Col asked at the table, quietly, before we started,
      whether we could take the old one twenty beats below.
      Four cups stopped halfway up; the berth lights held behind him.
      That was how a long-unsaid thing entered the hired hold.
      Twenty-seven years we drove that figure at one speed,
      fast enough to fill two halls and clear the final ferry.
      Nobody had asked him once how fast his hands could hear it.

      [Chorus]
      Slower than we did it and better than we did it,
      and it turns out there was a tune under the tempo all along.
      Nothing in this empty hold is hurrying tonight.
      Let the long bow cross the bar and leave the space behind.

      [Verse 2]
      I said why now, and he said because I can hear it now,
      then turned the tuning peg and would not say another word.
      Maybe it was fingers stiff from cargo straps and weather.
      Maybe it was ears that needed fewer notes at once.
      Reddin gave a count with half the old impatience gone.
      Ilsa let the low line open wide beneath the fiddle.
      One pass from first low scrape to fade, and nobody called again.

      [Pre-Chorus]
      Twenty-seven years is long enough to hide one question.
      Four cups on a table are enough to let it out.

      [Verse 3]
      At the old pace, every heel knew where to land before us.
      Tonight the crate brush waits; the stripped-wire chimes hang clear.
      I can hear Col breathe before he pulls the second figure.
      I can hear the wood complain beneath Ilsa's lowest string.
      The far hall may demand it fast when Thursday comes again.
      They can stamp and shout; we will not chase their feet.
      This one crossed the years to reach the speed it needed.

      [Chorus]
      Slower than we did it and better than we did it,
      and it turns out there was a tune under the tempo all along.
      Nothing in this empty hold is hurrying tonight.
      Let the long bow cross the bar and leave the space behind.

      [Final Chorus - harmony from the bass chair]
      Slower than we did it, and he asked, and we did it,
      and the far hall is going to want it fast and will not get it.
      Nothing in this hold is in a hurry any more.
      Twenty-seven years, four cups, one question at a table.
      Col holds the final bow until the berth lights blur.

      [Outro - fade]
