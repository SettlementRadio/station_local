  - id: s_0697
    title: Take the Long Berth Home
    track_number: 5
    mood: [rolling, warm, tired]
    fact: >-
      Ilsa Brack sings the lead for the only time in the band's life, and Wend Amory does not appear on
      the track at all.
    arrangement_note: the bass chair sings the lead outright and there is no low male voice anywhere on the track and no harmony under her, because the man who would sing it is not in the room and the woman who has sung underneath him for twenty-seven years is on her own
    intro: 12
    outro: fade
    target_duration: "4:20"
    prompt: >-
      132 BPM warm rolling reel; plain female lead alone, upright bass, fiddle, boxy hold, soft fade.
    exclude: male vocals, low male harmony, backing vocals, second voices, electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, cold ending
    lyrics: |
      [Intro - fiddle and bass, twelve seconds]

      [Verse 1]
      Fourteen nights inside a hold can shrink a person's language.
      Pass the wrench. Check the list. Move your case. Count four.
      Three men I have known longer than most people know a home,
      each one close enough to hear me set my cup down wrong.
      Tonight I need the water road beyond the loading lamps,
      nine more minutes past the direct way to the settlement gate.
      Wend sees me take my coat and does not ask to come.

      [Chorus]
      Take the long berth home, the one past the water gate.
      It is nine minutes further and there is nobody on it.
      You have been in a hold with three men for a fortnight.
      Take the long way. Do not talk to anybody.

      [Verse 2]
      The short road follows cargo carts beneath the relay signs,
      freight crews changing shifts and port clerks shouting numbers.
      The long road turns behind the tanks and finds the black water.
      No manifests, no questions, no one matching pace.
      I let my work hands open; both palms still smell of strings.
      Nine minutes is not freedom. It is near enough tonight.
      By the bend, I hear my own boots instead of everybody else's.

      [Bridge]
      He has stood behind me on a berth for twenty-seven years
      and both of us know when the other needs that walk alone.

      [Verse 3]
      Every crew that works this port has found the water turning.
      Nobody marks it on a chart or calls it by a name.
      You take it after blame, after good news, after finishing,
      whenever even kindness feels like one demand too many.
      At the far end Wend is waiting with my bass case by his leg.
      He gives me back the strap and falls in half a step behind.
      We reach the settlement gate without exchanging one word.

      [Chorus]
      Take the long berth home, the one past the water gate.
      It is nine minutes further and there is nobody on it.
      You have been in a hold with three men for a fortnight.
      Take the long way. Do not talk to anybody.

      [Final Chorus - lead alone, no harmony]
      Take the long berth home, the one past the water gate,
      where one old friend knows better than to follow.
      He will meet you at the far end and carry what is heavy.
      Take the long way. Let the dark water keep the silence.
      Nine minutes, then the gate, then home beside a friend.

      [Outro - fade]
