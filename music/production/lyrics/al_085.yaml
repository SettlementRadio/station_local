# al_085 — Dance It Off the Deck · Loose Cargo (b_039) · Common Wake Cooperative · 2607 · 7 songs
#
# Written by M-24. **The file shape is fixed by al_001.yaml — read that header once.** Production
# vocabulary (COMMISSION.md §8): never enters the wiki, never said on air. Lyrics written by hand;
# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# **The last record, made in a hold that was not going anywhere.** The co-operative wanted a third and
# the band agreed on one condition — a hold again — which meant hiring one by the night and paying
# for a room that never left its berth. Wend Amory called that the most expensive joke the band ever
# made and the record is written as the joke landing: it is looser and slower than anything else they
# did, and the two things it is about are money and finishing.
#
# The room comes back and the prompts come back with it: boxy, close, dead, the fittings ringing
# behind the kit, no hall space anywhere. Brin Noll retuned the hold's loose metal before the
# engineers arrived, so the fittings are in tune with the band on this record and were not on al_083.
#
# **s_0697 is the one song in this band's life where the harmony singer takes the lead outright**, and
# the card has said so since M-20. Wend Amory is not on that track at all — no low male voice, no
# harmony under her, nothing. It is stated in the prompt and it happens once.
#
# Two of the seven take a fiddle break. `generation:` and every `take:` are empty until M-33.

