  - id: s_0698
    title: One More Around the Hold
    track_number: 6
    mood: [fast, communal, bright]
    fact: >-
      Talla Venn plays second guitar on the scarred instrument he has repaired between sessions for
      thirty years, and he tuned it down to match the hold.
    arrangement_note: a second guitar tuned down to the pitch the hold's own fittings ring at, played by somebody who has been repairing the same scarred instrument for thirty years, sitting under the band's guitar rather than beside it
    intro: 8
    outro: sustain
