    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, untuned clatter, fade-out
    lyrics: |
      [Intro - fiddle and ringing metal, ten seconds]

      [Verse 1]
      A man came down two days before anybody else did
      with a bag of tools and a list and about nine hours,
      and went round this hold tightening and slackening things
      until every loose fitting in it was in the same key as us.
      Nobody asked him to. He has done it for other people.
      He said a room either answers you or it argues, and chose.

      [Chorus]
      Dance it off the deck. Dance it off the plate.
      There is nothing under this floor for about nine metres
      and every step four hundred people take comes back up,
      and tonight it comes back up in tune, which is new.

      [Verse 2]
      On the first record the metal was just noise
      and we called that character, because that is what you call it
      when a thing is wrong and you cannot afford to fix it
      and somebody in a review has been kind about it.
      This one rings. You can hear the difference immediately.
      Reddin has been quietly furious about that for a week.

      [Turnaround - the tuned fittings alone, four bars]

      [Verse 3]
      Twenty-seven years of loading and unloading this
      and about eleven of playing in it once it was empty,
      and it has taken until the last record anybody makes
      for somebody to turn up and tune the building.
      Brin Noll. Off the frontier, works everywhere, says nothing.
      He is going to do the same thing in a shed in Cold Harbor.

      [Chorus]
      Dance it off the deck. Dance it off the plate.
      There is nothing under this floor for about nine metres
      and every step four hundred people take comes back up,
      and tonight it comes back up in tune, which is new.

      [Final Chorus - harmony from the bass chair]
      Dance it off the deck and let the fittings answer.
      There is nothing under this floor for about nine metres.
      Every step four hundred people take comes back up,
      and a man with a bag of tools decided what it would say.

      [Outro - cold stop]
