  - id: s_0699
    title: Off at the Last Stop
    track_number: 7
    mood: [midtempo, warm, final]
    fact: >-
      The last thing Loose Cargo recorded, and the four of them played it twice through without
      stopping because nobody wanted to be the one to call the end.
    arrangement_note: the whole tune is played through twice without a break between the two passes, and the second pass is quieter and slower than the first because nobody was willing to be the one who stopped it
    intro: 16
    outro: fade
    target_duration: "4:45"
    prompt: >-
      138 BPM warm final reel; low dry male bass-baritone, female chorus, two full passes, slowing fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, big finish, cold ending
    lyrics: |
      [Intro - fiddle and bass, sixteen seconds]

      [Verse 1]
      Nobody called it final. Nobody wanted that word loose.
      Four work coats waited by the hatch, four cases by the wall.
      Ilsa knew. Col knew. Reddin checked the clock and looked away.
      I had known a month and never found a useful way to say it.
      Beyond the berth, a Sunday carrier loaded someone else's cargo.
      The co-operative would hear later on a carrier wave.
      Inside the hired hold, we counted four and let the fiddle start.

      [Chorus]
      Off at the last one with everything you came with,
      and the hold behind you swept, and the paper signed.
      Nobody hands you anything. Nobody says well done.
      You put your coat on and you go down the ramp.

      [Verse 2]
      We reached the held last note; Col kept the bow in motion.
      Reddin touched the crate again instead of setting down the sticks.
      Ilsa found the opening underneath the fading chord.
      I followed half a breath behind and let the first line turn.
      Nobody looked up. Looking up would ask the question.
      Round again, a little softer, one slow fraction under.
      The tune knew where to go when none of us would call the end.

      [Verse 3]
      Afterward, Ilsa swept the chalk and splinters from the deck.
      Col wound the worn bow loose and shut it in the case.
      Reddin took the chain apart and hung it by the hatch.
      He said he had no plans, which meant he had at least three.
      Ilsa had a loading shift; Col had promised someone lessons.
      I signed the empty-hold form and returned the borrowed key.
      Four coats left four hooks bare without a speech between them.

      [Chorus]
      Off at the last one with everything you came with,
      and the hold behind you swept, and the paper signed.
      Nobody hands you anything. Nobody says well done.
      You put your coat on and you go down the ramp.

      [Final Chorus - harmony from the bass chair, the second pass, quieter]
      Off at the last one with everything you came with.
      There is a run out on Sunday and it is not ours.
      Nobody hands you anything. Nobody says well done.
      Four people reach the ramp and stop beneath the berth light.
      Then Ilsa takes the first step and the other three go with her.

      [Outro - long fade over the second pass]
