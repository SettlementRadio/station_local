    lyrics: |
      [Intro - band, four seconds]

      [Verse 1]
      This is what was actually said, near enough, at the table,
      and both sides have read it and both sides have agreed
      that it is a fair account of a conversation about money
      between four people who make records and one who pays for them,
      in a settlement neither side is from, at a berth, at nine.
      Nobody comes out of it badly. That is the strange part.
      Everybody in that room had a completely reasonable position.

      [Chorus]
      Who is paying for the room. Somebody is paying for the room.
      It is never nobody. There has never once been a nobody.
      Either it comes out of the door or it comes out of the label
      or it comes out of four people not being paid for a fortnight.

      [Verse 2 - the band pulls apart]
      They said we cannot justify a hold that does not move.
      We said the last two records are the reason you have members.
      They said that is true and it is not an argument about cost.
      We said everything is an argument about cost eventually.
      They said yes. Exactly. That is our whole point.
      And there was a very long silence, and Ilsa made tea.
      She let it sit there for a minute and then said her piece.

      [Instrumental - fiddle break, sixteen seconds]

      [Verse 3]
      What settled it is that the members voted for it.
      Not the officers. The members. About nine hundred of them,
      most of whom are on a run at any given hour
      and none of whom will ever hear this record in a hall.
      They voted to hire a hold for a band on their own label.
      That is a co-operative and it is why we are on one.

      [Chorus]
      Who is paying for the room. Somebody is paying for the room.
      It is never nobody. There has never once been a nobody.
      Either it comes out of the door or it comes out of the label
      or it comes out of four people not being paid for a fortnight.

      [Final Chorus - harmony from the bass chair]
      Who is paying for the room. Nine hundred freight crews are.
      It is never nobody. There has never once been a nobody.
      Either it comes out of the door or it comes out of the label,
      and this time it came out of everybody, on a vote.

      [Outro - cold stop]
