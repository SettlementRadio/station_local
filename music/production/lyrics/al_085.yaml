    lyrics: |
      [Intro - fiddle and bass, twelve seconds]

      [Verse 1]
      Twenty-seven years underneath somebody else's line
      and a third below it on the chorus and nothing in the verses,
      which is a real job and I have never once complained about it
      and which four hundred people in two halls have never noticed.
      He wrote this one and then said he was not going to sing it
      and went out onto the berth and did not come back until it was done.

      [Chorus]
      Take the long berth home, the one past the water gate.
      It is nine minutes further and there is nobody on it.
      You have been in a hold with three men for a fortnight.
      Take the long way. Do not talk to anybody.

      [Verse 2]
      I have sung one line at a time for twenty-seven years
      and I have never had to work out where a verse goes
      or what to do with my hands or when to come in,
      and the first take of this was frankly a disgrace.
      Col said nothing. Reddin said nothing, which cost him.
      By the fourth one I had stopped listening to myself.

      [Bridge]
      He has stood behind me on a berth for twenty-seven years
      and both of us have been out on that walk on our own.

      [Verse 3]
      There is a walk from the berth to the settlement gate
      that goes past the water and takes about nine minutes longer
      and every crew that has ever worked this port knows it
      and none of them will tell you why they take it.
      You take it because for nine minutes nobody is asking you anything.
      That is the whole song. That is the entire song.

      [Chorus]
      Take the long berth home, the one past the water gate.
      It is nine minutes further and there is nobody on it.
      You have been in a hold with three men for a fortnight.
      Take the long way. Do not talk to anybody.

