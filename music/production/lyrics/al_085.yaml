    lyrics: |
      [Intro - fiddle, fourteen seconds]

      [Verse 1]
      He asked at the table, quietly, before we started,
      whether we would consider taking it about twenty under,
      and there was a pause of the kind that happens in a band
      when somebody says a thing they have been not saying for years.
      Twenty-seven years of this tune at one speed.
      Nobody had ever asked. Nobody had ever thought to ask.

      [Chorus]
      Slower than we did it and better than we did it,
      and it turns out there was a tune under the tempo all along.
      Nothing in this hold is in a hurry any more.
      Nothing on this record has anywhere to be.

      [Verse 2]
      I said why now, and he said because I can hear it now,
      which is either about his hands or about his ears
      and he would not say which and it does not matter which.
      A man who has played the same forty tunes since he was nineteen
      is allowed, once, at the end, to ask for one of them slowly.
      We did it on the first take. Nobody discussed it further.

      [Pre-Chorus]
      Twenty-seven years is a long time to not be asked
      and a long time to not ask, and he did both.

      [Verse 3]
      What it does is give the words somewhere to sit.
      At the old speed you get four of them into a bar
      and you are through the second verse before anybody hears it
      and a dance does not need you to be heard, it needs you to go.
      This is not for a dance. Nothing on this record is.
      This is four people in a hired hold at a berth.

      [Chorus]
      Slower than we did it and better than we did it,
      and it turns out there was a tune under the tempo all along.
      Nothing in this hold is in a hurry any more.
      Nothing on this record has anywhere to be.

      [Final Chorus - harmony from the bass chair]
      Slower than we did it, and he asked, and we did it,
      and the far hall is going to want it fast and will not get it.
      Nothing in this hold is in a hurry any more.
      Twenty-seven years and one question at a table.

      [Outro - fade]
