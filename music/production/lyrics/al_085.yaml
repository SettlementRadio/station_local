    prompt: >-
      166 BPM bright reel; low dry male bass-baritone, two detuned guitars, fiddle break, held end.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, matched guitars, cold ending
    lyrics: |
      [Intro - two guitars and fiddle, eight seconds]

      [Verse 1]
      Talla Venn arrived with one scarred guitar beneath his coat.
      Thirty years of patches showed along the composite grain:
      four new frets, a borrowed bridge, two plates around the shoulder,
      somebody's initials almost sanded from the neck.
      He struck the hold's low fitting, turned each peg two tones,
      played the note beneath my own and let the room decide.
      Both guitars sat together like a cart with one low wheel.

      [Chorus]
      One more around, and one more after that,
      and the fittings ring back and the crates come in behind.
      Nine metres of nothing underneath this floor
      and eleven people with no reason yet to leave.

      [Instrumental - fiddle break, fourteen seconds]

      [Verse 2]
      Three freight hands from the next berth heard us through the wall.
      One co-operative clerk came down to bring the hire key.
      Brin returned for chalk, then stayed beside the hatch.
      One woman followed no one and refused to give a name.
      With Talla and the four of us, that made eleven bodies.
      Reddin cleared the cases back and marked a narrow floor.
      The nameless woman took first place and pulled the clerk around.

      [Verse 3]
      Talla's lower strings kept rubbing under mine like weather.
      Col threw the fiddle high; the tuned plates answered back.
      Eleven sets of boots and shoes made more than enough floor.
      No caller, no paid gate, no coats arranged in hundreds.
      Just a hired hold at berth and one more night before we finished.
      I had always said a dance was never measured by the door.
      With six people turning, I found out I meant it.

      [Chorus]
      One more around, and one more after that,
      and the fittings ring back and the crates come in behind.
      Nine metres of nothing underneath this floor
      and eleven people with no reason yet to leave.

      [Final Chorus - harmony from the bass chair, the room joining in]
      One more around, and one more after that,
      and Talla with the scarred guitar will not be stopping first.
      Nine metres of nothing underneath this floor,
      three tuned fittings, six dancers, five against the wall.
      One more around. The nameless woman counts us in.

      [Outro - held chord, the fittings ringing]
