      [Intro - fiddle and bass, sixteen seconds]

      [Verse 1]
      Nobody said this was the last one. Nobody says that.
      There was no meeting and there was no announcement
      and there is not going to be a fourth record
      and every one of the four of us has known that for a month.
      The co-operative does not know yet. It will find out
      the way everybody finds anything out on this lane: late,
      off a carrier wave, from somebody at a berth, in a port hall.

      [Chorus]
      Off at the last one with everything you came with,
      and the hold behind you swept, and the paper signed.
      Nobody hands you anything. Nobody says well done.
      You put your coat on and you go down the ramp.

      [Verse 2]
      So we played it through and got to the end of it
      and not one of the four of us stopped playing,
      and it went round again, quieter, and slightly slower,
      because stopping would have been somebody's decision
      and none of us was going to be the person who made it.
      You can hear the second pass. It is on the record.

      [Verse 3]
      Twenty-seven years, two halls, four records,
      one festival, about nine hundred nights and one long argument
      about whether a band that could not stand still could be recorded,
      which we settled, in a hold, on two borrowed microphones.
      Ilsa is going to keep working. Col is going to teach.
      Reddin says he is going nowhere, which means nothing at all.

      [Chorus]
      Off at the last one with everything you came with,
      and the hold behind you swept, and the paper signed.
      Nobody hands you anything. Nobody says well done.
      You put your coat on and you go down the ramp.

      [Final Chorus - harmony from the bass chair, the second pass, quieter]
      Off at the last one with everything you came with.
      There is a run out on Sunday and it is not ours.
      Nobody hands you anything. Nobody says well done,
      and the four of us are still playing, and it is finished.

      [Outro - long fade over the second pass]
