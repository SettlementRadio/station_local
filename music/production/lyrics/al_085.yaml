  - id: s_0693
    title: Dance It Off the Deck
    track_number: 1
    mood: [fast, loose, bright]
    fact: >-
      Brin Noll retuned the hold's loose metal before the sessions so the room would answer the
      chorus, and three of those fittings are audible on the take.
    arrangement_note: the hold's own fittings have been retuned to the key of the tune, so the room rings back in pitch on every chorus instead of clattering, which is a thing done to a building rather than to an instrument
    intro: 10
    outro: cold
    target_duration: "4:05"
    prompt: >-
      162 BPM loose reel; low dry male bass-baritone, female chorus, three tuned fittings, cold stop.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, large hall reverb, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, untuned clatter, fade-out
    lyrics: |
      [Intro - fiddle and ringing metal, ten seconds]

      [Verse 1]
      Brin Noll came down the berth ramp with a canvas bag of tools,
      struck the forward bracket once and waited for the ring.
      He tightened one long fitting, hung a washer on another,
      wedged a strip of cargo seal beneath the third loose plate.
      Nine hours with a gauge, a wrench, and chalk across his sleeve,
      till three notes in the hired hold sat under Col's low string.
      "A room can answer or argue," Brin said. "This one can choose."

      [Chorus]
      Dance it off the deck. Dance it off the plate.
      Put your working heel down where the long brace meets the floor.
      Three pieces of loose metal throw the chorus back in tune.
      Dance it off the deck and let the empty hold reply.
      Nine metres under every step, and nothing holding still.

      [Verse 2]
      Reddin hit the first crate hard and all three fittings answered.
      He stopped with both sticks raised and glared into the roof.
      For years the chain and hatch had landed where they pleased,
      half a tone against the fiddle, sharp beneath the bass.
      Now the room came back obedient on every counted four.
      He tried to push the snare ahead; the brackets followed clean.
      By supper he was calling it suspiciously well behaved.

      [Turnaround - the tuned fittings alone, four bars]

      [Verse 3]
      Brin sat by the hatch while Col ran once around the figure.
      First plate held the bottom; second caught the middle note.
      Third one rang above us like a cup against a bulkhead.
      Ilsa found a harmony and let the fittings carry it.
      Brin packed every tool except the chalk he left behind,
      marked three small circles where the deck should take a heel,
      then shouldered up the bag and caught the last relay home.

      [Chorus]
      Dance it off the deck. Dance it off the plate.
      Put your working heel down where the long brace meets the floor.
      Three pieces of loose metal throw the chorus back in tune.
      Dance it off the deck and let the empty hold reply.
      Nine metres under every step, and nothing holding still.

      [Final Chorus - harmony from the bass chair]
      Dance it off the deck and let the fittings answer.
      First one low, second middle, third above the line.
      Put your working heel down on the circles Brin left white.
      Dance it off the deck; the whole hold answers back.
      Reddin counts the final turn and almost calls it right.

      [Outro - cold stop]
