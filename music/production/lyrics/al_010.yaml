    lyrics: |
      [Intro - 9 seconds, upright piano with brushed kit, no vocal]

      [Verse 1]
      The lamps come up at one and the room looks like a room,
      which is a thing nobody who comes here at nine ever sees.
      Chairs on tables. A woman with a cloth and a list.
      Two hundred cups going into a bin four at a time.

      [Chorus]
      Closed for counting. Everybody out.
      That is what the sign says and the sign is nineteen years old
      and the people who put it up went home in the spring
      and the four of us are still here, counting, every night.

      [Verse 2]
      You are the last one at the table with your coat done up
      and a cup you finished forty minutes ago in front of you,
      and the woman with the cloth has come past twice
      and not asked you to move, which she would ask anybody else.

      [Chorus]
      Closed for counting. Everybody out.
      That is what the sign says and the sign is nineteen years old
      and the people who put it up went home in the spring
      and the four of us are still here, counting, every night.

      [Bridge]
      There is a whole shift of people in the settled worlds
      who only ever see each other after somebody says everybody out.

      [Verse 3]
      So stay until the count is done and walk back with me.
      The last ferry has gone and there is no reason to hurry.
      It is fourteen minutes to the transfer hall and the lamps are on
      and there is nothing in this quarter open at that hour
      and I have never once minded the walk when you are on it.

      [Final Chorus - closing staff answering, cups into bins behind them]
      Closed for counting. Everybody out.
      The bins are full, the till is short, the list is done.
      Put the chairs up. Put the lamps down. Leave the last one.
      Everybody out. Not you. You wait. I am nearly finished.

      [Outro - sustain, the room and the cups still going]
