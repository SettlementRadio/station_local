    exclude: guitars, synth pads, electronic drums, saxophone and smoky late-club arrangement, orchestral strings, belted vocals, vocal tuning, rapped sections, dance-pop production
    lyrics: |
      [Intro - 15 seconds, upright piano and bass, hand percussion at eleven seconds, no vocal]

      [Verse 1]
      There is a thing that happens in a room like this one
      when the piano stops in the middle of an evening.
      Everybody hears the room for the first time all night —
      the counter, the door, the four conversations, the street,
      the scrubber in the ceiling that has run all winter,
      a hauler on the road outside that nobody would have heard.

      [Refrain]
      Nobody looks up. Everybody hears it.
      And then somebody starts again and nobody says a word.

      [Verse 2 - no piano]
      That is what I am afraid of, if you want it plainly.
      Not the argument. Not the being told. Not the winter.
      Not the season sealing with the two of us on one side of it.
      The bit where the noise we make together stops for a second
      and we both find out what the room actually sounds like.

      [Refrain]
      Nobody looks up. Everybody hears it.
      And then somebody starts again and nobody says a word.

      [Verse 3]
      We have been very good at keeping something going.
      Four nights a week, the same table, the same walk after,
      the same fourteen minutes to the transfer hall in the cold.
      There is a version of that which is a life
      and a version which is two people avoiding a quiet room,
      and I have not been able to tell which of them this is.

      [Refrain]
      Nobody looks up. Everybody hears it.
      And then somebody starts again and nobody says a word.

      [Verse 4]
      So somebody take their hands off the keys for a bar
      and let us both listen to what is left underneath.
      If there is nothing there we should probably know,
      tonight, in this room, with the lamps still down.
      If there is something there I would like to hear it once,
      plainly, at the ordinary volume, with nothing playing.

      [Refrain - whole group]
      Nobody looks up. Everybody hears it.
      Stop the piano. I am not afraid of the room.

      [Outro - sustain, the piano returning under the last chord]
