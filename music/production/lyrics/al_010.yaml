      [Verse 1]
      She has been on that counter since before the room was a room,
      since before the last ferry ran this late on a Thursday.
      She takes eleven coats a minute on a Thursday
      and she has a face for each of them and none of them is the same
      and everybody who comes in here thinks theirs is the real one.

      [Chorus]
      Everybody gets the smile at the counter.
      Everybody. The whole quarter. Four nights a week.
      I know exactly what it is and what it is worth
      and I have been coming here on Thursdays for two years.

      [Verse 2]
      I have watched her do it to a man off the last ferry
      with a bag and a bad week and no berth for the night,
      and he stood up straighter, and he stayed for another hour,
