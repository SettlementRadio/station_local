    lyrics: |
      [Intro - 5 seconds, brushes on a metal serving tray with piano, no vocal]

      [Verse 1]
      You are one drink behind me and you have been all evening,
      which is not an accident and is not about the drink.
      You are waiting to see how the whole thing goes
      before you commit to being here for the rest of it.

      [Refrain]
      I have never once known you to catch up.
      Not in two years. Not once.

      [Verse 2]
      It is the same with the coat. You keep it over the chair
      instead of giving it in at the counter like a person
      who intends to be in the room for another hour.
      You sit where you can see the door and the transfer hall clock.
      Every single thing you own is arranged for leaving.

      [Refrain]
      I have never once known you to catch up.

      [Verse 3]
      I am not complaining. I would like that on the record.
      A person who keeps their coat is a person who has been caught out
      in some settlement, in some winter, before I met them,
      by somebody kind, on a Tuesday, with the lamps down,
      and I would rather have the coat on the chair than not have you.

      [Refrain]
      I have never once known you to catch up.

      [Bridge]
      The woman on the counter has stopped asking you for it.
      She just nods now. She has worked here nineteen years.

      [Verse 4]
      But you are still here at the second bell, which is new,
      and the coat is on the back of the chair and not on you,
      and the last ferry went twenty minutes ago without you,
      and there is a drink in front of you that you have not touched
      and I am not going to say a word about any of it.

      [Refrain - whole group]
      I have never once known you to catch up.
      You are one behind. Stay one behind. Stay.

      [Outro - fade on the brushed tray]
