      I have kept every one of them, which is not normal behaviour.

      [Verse 3]
      Tonight she said my name before I got to the counter
      and had the ticket out and the hook ready and my coat over her arm
      and said it is cold, and there is a seat by the piano,
      and I have not recovered and it has been an hour and a half.

      [Chorus - whole group]
      Everybody gets the smile at the counter.
      Everybody. The whole quarter. Four nights a week.
      That one was not the counter smile. I have the set.
      I have four hundred and six of them and that was not one.

