  - id: s_0092
    title: Table Near the Door
    track_number: 2
    mood: [watchful, romantic, steady]
    fact: >-
      Tovin Ashe wrote the bass answer for two customers who chose the same visible table through an
      entire season.
    arrangement_note: the upright bass answers every vocal line with the same short figure all the way through, in the same place, exactly as the two customers took the same table
    intro: 7
    outro: cold
    target_duration: "4:00"
    prompt: >-
      Compact close soft rock, 88 BPM, watchful and romantic, steady. Female lead vocal, low and
      warm, close to the microphone, understated and conversational, letting phrases fall away
      rather than holding them. Three-part close harmony stacked behind the lead on every chorus,
      the whole group on the last one, never shouted. Upright piano, upright bass answering every
      vocal line with the same short figure in the same place throughout, brushed drum kit,
      harpsichord-toned keyboard played by hand, light hand percussion. Dry and small, gentle tape
