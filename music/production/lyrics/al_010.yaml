    lyrics: |
      [Intro - 15 seconds, upright piano and bass, hand percussion at ten seconds, no vocal]

      [Verse 1]
      There are nine people in this room and four of them work here
      and every one of the nine knows everybody we know.
      You can say anything you like at this table tonight
      and it will be in a different quarter of the core by Friday
      and out on the relay to two settlements by the ninth.

      [Chorus]
      So keep your voice down. Keep it under the piano.
      Say the important half of it towards the wall.
      There is a whole conversation going on behind that door
      and not one word of it is about us yet.

      [Verse 2]
      It is not shame and it is not anybody's business,
      it is that a thing this new does not survive being handled.
      Give it a month. Give it until the season changes.
      Then let the whole quarter have it and I will not care at all.

      [Chorus]
      So keep your voice down. Keep it under the piano.
      Say the important half of it towards the wall.
      There is a whole conversation going on behind that door
      and not one word of it is about us yet.

      [Verse 3]
      You said my name at the ordinary volume once tonight,
      across a table, in a room with the lamps up,
      and I have not been able to think about anything since.
      Half the room heard it. The woman on the coats heard it.
      She has not said anything and she is not going to.

      [Bridge]
      They are counting the till behind that door and talking.
      Whatever they are saying, they are saying it about somebody.

      [Chorus - muffled group behind the door]
      So keep your voice down. Keep it under the piano.
      Say the important half of it towards the wall.
      Or do not. Say it here. Say it at the ordinary volume.
      I have decided I do not mind what gets to Friday.

      [Outro - cold stop, the door voices cutting off with the band]
