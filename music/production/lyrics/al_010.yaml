    exclude: guitars, synth pads, electronic drums, saxophone and smoky late-club arrangement, orchestral strings, belted vocals, vocal tuning, rapped sections, dance-pop production
    lyrics: |
      [Intro - 7 seconds, upright bass figure with piano over it, no vocal]

      [Verse 1]
      They have the table by the door on a Tuesday and a Thursday
      and they have had it since the storm season turned, without booking it.
      She comes off the last ferry, he comes up from the port hall,
      and the two of them are in that chair by the quarter past.
      He gets here first. She comes in about ten minutes after
      and does not look for him, because she knows exactly where he is.

      [Chorus]
      The table by the door, where the whole room can see you.
      Anybody in this quarter could walk in and there you are.
      That is not carelessness. That is the entire point.
      Whatever this is, the two of you are not hiding it.

      [Verse 2]
      I have watched people take the corner and the back booth
      and the seat behind the pillar with their coats still on,
      and I have watched what happens to them by the winter,
      and none of it happens to the two by the door.

      [Chorus]
      The table by the door, where the whole room can see you.
      Anybody in this quarter could walk in and there you are.
      That is not carelessness. That is the entire point.
      Whatever this is, the two of you are not hiding it.

      [Verse 3]
      There is a woman at this piano who has been in the corner for years,
      who takes the back booth, and keeps his coat, and is very careful,
      and who would like it noted that he has watched two customers
      teach him more about the whole subject than the whole quarter did.

      [Bridge]
      They pay, they go, they say goodnight to the woman on the coats.
      Tuesday. Thursday. Same table. For a whole season.

      [Chorus - whole group]
      The table by the door, where the whole room can see you.
      Anybody in this quarter could walk in and there you are.
      I have got the corner table and a bill and a coat.
      Next Tuesday I am sitting where the door is.

      [Outro - cold stop, the bass figure cut off halfway through]
