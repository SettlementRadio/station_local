  - id: s_0091
    title: Soft Closing
    track_number: 1
    mood: [intimate, restrained, midtempo]
    fact: >-
      Mela Jorn sings the accepted lead while closing the piano lid one step at a time between
      verses.
    arrangement_note: the piano gets quieter and duller by one step between each verse as the lid comes down, and the last verse is played on a nearly closed instrument
    intro: 10
    outro: fade
    target_duration: "3:45"
    prompt: >-
      Compact close sunshine pop and soft rock, 96 BPM, intimate and restrained. Female lead vocal,
      low and warm, close to the microphone, understated and conversational, letting phrases fall
      away rather than holding them. Three-part close harmony stacked behind the lead on every
      chorus, the whole group on the last one, never shouted. Upright piano, upright bass, brushed
      drum kit, harpsichord-toned keyboard played by hand, light hand percussion. Dry and small,
      gentle tape warmth, no large reverb. The piano gets one step quieter and duller between each
      verse, as though the lid were being closed by degrees, and the final verse is played on a
      nearly closed instrument. Ten seconds of piano before the first sung word. Fade.
    exclude: guitars, synth pads, electronic drums, saxophone and smoky late-club arrangement, orchestral strings, belted vocals, vocal tuning, rapped sections, dance-pop production
    lyrics: |
      [Intro - 10 seconds, upright piano with the lid fully open, brushed kit at seven seconds, no vocal]

      [Verse 1]
      Nothing is going to be settled tonight and we both know it.
      The room is half full of people who have not decided
      whether they are going home or having another one,
      and the two of us have been in that condition since the spring.

      [Chorus]
      So we close it softly. We do not close it at all.
      We let it stand there with the lamps down and the door on the latch
      and neither of us says the sentence that would finish it,
      and neither of us gets up, and neither of us leaves.

      [Verse 2]
      There is a way of putting a lid down over an hour
      so gently that nobody in the room hears it go,
      and I have watched you do it to whole years of your life
      with a coat over your arm and a very kind face.

      [Chorus]
      So we close it softly. We do not close it at all.
      We let it stand there with the lamps down and the door on the latch
      and neither of us says the sentence that would finish it,
      and neither of us gets up, and neither of us leaves.

      [Bridge]
      The last ferry has gone. It went at the quarter past.
      Neither of us mentioned it and neither of us moved.

      [Verse 3]
      I would rather have this than the version with an ending in it.
      I would rather sit in a shut room in the core all winter
      with the piano nearly closed and the lamps nearly out
      than be told plainly, tonight, by somebody kind.

      [Chorus - whole group]
      So we close it softly. We do not close it at all.
      We let it stand there with the lamps down and the door on the latch.
      Ask me in the spring. Ask me on the worst day of the year.
      Do not ask me now. Now is the only good hour I have got.

      [Outro - fade, the piano almost shut]
