  - id: s_0667
    title: Pipes Down a Tone
    track_number: 3
    mood: [deep, rolling, strange]
    fact: >-
      Orsa Lipp tuned the settlement pipes a full tone below their working pitch for this track alone
      and a shop steward filed a complaint about it.
    arrangement_note: the pipes are a full tone below their working pitch on this track and nothing else on the record, which puts them under the bass rather than over it, and they take the whole instrumental break because the retuning is the only reason the track exists
    intro: 12
    outro: sustain
    target_duration: "4:30"
    prompt: >-
      132 BPM deep jump-reel; dry male tenor, low acoustic resonance pipes, pipe break, held ending.
    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, amplified organ, bright high register, cold ending, fade-out
    lyrics: |
      [Intro - the low pipes alone, twelve seconds]

      [Verse 1]
      Orsa loosened eleven fittings after the shift went home.
      One turn on each, then one more measured against the bow.
      The first pipe dropped beneath the note Toller expected.
      By the fifth, every bench in Forge had started humming.
      The steward came back through and stopped beside the rack.
      Orsa kept both hands still until she asked the pitch.

      [Chorus]
      Down a tone and the whole floor goes soft under you.
      Under the bass. Under the boots. Under the building.
      You do not hear it so much as find out about it later
      when your chest tells you something has been going on.

      [Verse 2]
      The steward wrote the complaint against the bench.
      Eleven working signals keep the settlement on pitch.
      At six, somebody past the bulkhead needs the right instruction.
      Orsa signed the sheet and set a lamp beside the clock.
      By half past four each fitting stood at working pitch.
      She checked the first. He checked all eleven after.

      [Instrumental - the low pipes take the break, twenty seconds]

      [Verse 3]
      What it sounds like is the thing nobody will write down.
      It sounds like the floor of the world going down one step.
      Everything in the room agrees with it and nothing sits above it.
      The fiddle is up there somewhere sounding like a bird.
      I sang the second verse and could not hear my own voice
      and did not care at all, which is not like me.

      [Chorus]
      Down a tone and the whole floor goes soft under you.
      Under the bass. Under the boots. Under the building.
      You do not hear it so much as find out about it later
      when your chest tells you something has been going on.

      [Final Chorus - the pipes answering the vocal line]
      Down a tone, and back up by half past four,
      and a shop that never knew, and a man who wrote it down.
      You do not hear it so much as find out about it later.
      One night in Forge every boot went down a step.

      [Outro - one very low pipe note left ringing]
