      [Intro - band, four seconds]

      [Verse 1]
      Forty minutes. Forty. And eleven pipes to put back
      and a rack to hang them on and a check to run twice
      and a steward at the door at half past four with a list.
      One take. That is what forty minutes is. One take.
      Orsa said go and Bree counted and we went,
      and what you can hear is four tired people not stopping.

      [Chorus]
      Back before the morning. Back before the shift.
      Everything in this building has to be where it was.
      Nobody is going to know that we were ever here
      except the eleven minutes of it we are taking away.

      [Verse 2]
      Toller comes in early in the second turn. It is on there.
      I run out of air in the fourth line and you can hear it.
      The fiddle break is not learned. It is four nights old.
      There is a thing at the end that I still cannot explain.
      Deep Register asked, on the way out, if we wanted another.
      All four of us said no at the same time, which never happens.
      Four nights is what we asked for and four nights is what it is.

      [Instrumental - fiddle break, under-rehearsed, twelve seconds]

      [Verse 3]
      Because a fifth night is a lie about what this was.
      This was four workers in a shop between two shifts
      with a label who could not find a room and a settlement
      that has never once been asked what it sounds like.
      Get the pipes up. Get the rack straight. Get the plate back.
      Wipe the bench. Move the cart. Take the lamp off the wall.
      Somebody check the rack against the list and then check it again.
      There is a manifest on that bench that has to be signed at six.

      [Final Chorus - pipes answering the vocal line]
      Back before the morning. Back before the shift,
      and the big motor at six, and the line, and the air,
      and a shop full of people who will never hear this,
      working in a room that is on a record now.

      [Outro - cold stop]
