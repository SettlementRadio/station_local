  - id: s_0666
    title: Shut the Machines Down
    track_number: 2
    mood: [brisk, hard, plain]
    fact: >-
      The tune is timed to the shop's shutdown sequence, which takes ninety seconds, and the band
      rehearsed to it for a month before recording.
    arrangement_note: the first ninety seconds of the track are played against the shop's actual shutdown sequence and the band arrives in stages as each machine stops, so the arrangement gets quieter and the tune gets clearer at exactly the rate the building goes silent
    intro: 20
    outro: cold
    target_duration: "4:10"
    prompt: >-
      Jump blues and reel tempos, 144 BPM, brisk and hard, plain. Male lead vocal, dry mid tenor,
      flat and matter-of-fact, clipping the ends of lines, singing against the fiddle he is playing
      himself. Absolutely no backing or harmony vocal of any kind. Long unamplified alloy organ tones
      from bowed and struck resonance pipes, composite fiddle, upright bass, cut-stock kit and struck
      alloy, bass and drums dry against a hugely reverberant metal workshop. The first ninety seconds
      run against real industrial machinery shutting down in stages — heavy motors winding down one
      after another, air releasing, a building going quiet — and the band enters piece by piece as
      each machine stops, so the mix gets cleaner and the tune gets clearer as the noise leaves.
