  - id: s_0671
    title: Back Before the Morning
    track_number: 7
    mood: [urgent, fast, tired]
    fact: >-
      Recorded last on the fourth night with forty minutes left before the pipes had to be retuned,
      and it is a single take with no repairs.
    arrangement_note: one take with nothing repaired, taken at the top of the band's range and audibly rushed, with the fiddle taking a short break in the middle that is plainly under-rehearsed and kept anyway
    intro: 4
    outro: cold
    target_duration: "4:15"
    prompt: >-
      172 BPM urgent jump-reel; breathless male tenor, acoustic pipes, rough single take, cold stop.
    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, amplified organ, edited or corrected performance, fade-out
    lyrics: |
      [Intro - band, four seconds]

      [Verse 1]
      Forty minutes and eleven pipes still off the rack.
      A steward waits beside the door with both lists open.
      Orsa says go. Bree counts before Dane finds his breath.
      Toller reaches the first turn half a beat too soon.
      Nobody looks across. The shop clock takes another minute.
      Four tired people keep the tune in front of morning.

      [Chorus]
      Back before the morning. Back before the shift.
      Everything in this building has to be where it was.
      Nobody is going to know that we were ever here
      when the big motor takes the first load at six.

      [Verse 2]
      Dane loses air and cuts the fourth line short.
      The old words fall eleven seconds through the gap.
      Bree drops one strike and catches the next on alloy.
      Orsa points at the clock without leaving the pipes.
      The fiddle break turns wrong and Dane stays with the turn.
      Nobody stops to mend it. Nobody has the time.

      [Pre-Chorus]
      Thirty-one minutes. Orsa pulls the first pipe free.
      Twenty-eight. The steward clears one space along the rack.
      The tune keeps running while the clock removes the room.

      [Instrumental - fiddle break, under-rehearsed, twelve seconds]

      [Verse 3]
      Get the pipes up. Get the rack straight. Get the plate back.
      Wipe the bench. Move the cart. Take the lamp off the wall.
      Somebody check the rack against the list and then check it again.
      There is a manifest on that bench that has to be signed at six.
      Toller takes the bass through the bulkhead door.
      Bree finds one tool beneath the stock and puts it home.
      The steward checks all eleven. Orsa checks them after.

      [Final Chorus - pipes answering the vocal line]
      Back before the morning. Back before the shift,
      and the big motor at six, and the line, and the air,
      and a shop full of people coming through the gate,
      finding every pipe at pitch and every tool in place.

      [Outro - cold stop]
