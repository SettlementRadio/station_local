    lyrics: |
      [Intro - the low pipes alone, twelve seconds]

      [Verse 1]
      A resonance pipe is cut to a length and the length is the note
      and the note is the one the shop needs for its own signalling,
      and there are eleven of them in this building on a rack
      and none of them were put there for a man to play tunes on.
      Orsa took them down a full tone for one tune.
      One. And put them back before the morning, as always.

      [Chorus]
      Down a tone and the whole floor goes soft under you.
      Under the bass. Under the boots. Under the building.
      You do not hear it so much as find out about it later
      when your chest tells you something has been going on.

      [Verse 2]
      A steward filed a complaint and he was entirely right to.
      Those pipes are the shop's, and the shop is the settlement's,
      and a signal that is a tone flat at six in the morning
      is a man on the far side of a bulkhead getting the wrong instruction.
      It was back by half past four. It was checked twice.
      The complaint stands on the record and so does the tune.

      [Instrumental - the low pipes take the break, twenty seconds]

      [Verse 3]
      What it sounds like is the thing nobody will write down.
      It sounds like the floor of the world going down one step.
      Everything in the room agrees with it and nothing sits above it.
      The fiddle is up there somewhere sounding like a bird.
      I sang the second verse and could not hear my own voice
      and did not care at all, which is not like me.

      [Chorus]
      Down a tone and the whole floor goes soft under you.
      Under the bass. Under the boots. Under the building.
      You do not hear it so much as find out about it later
      when your chest tells you something has been going on.

      [Final Chorus - the pipes answering the vocal line]
      Down a tone, and back up by half past four,
      and a shop that never knew, and a man who wrote it down.
      You do not hear it so much as find out about it later.
      One night in Forge the whole floor went down a step.

      [Outro - one very low pipe note left ringing]
