      [Verse 3]
      There are no pipes on this one. I asked for none.
      That building would have made this enormous and it is not.
      It is a small thing that happens twice a day at a gate
      to a man who has not yet worked out how to say good morning,
      and putting eleven seconds of alloy under it
      would have been the biggest lie on this record.

      [Chorus]
      Second shift, second stair, second half of the day.
      She goes up as the whole of my week is going down.
      There is a settlement of four hundred thousand out there
      and the only place I have ever seen her is a gate.

      [Final Chorus - fiddle answering the vocal line]
      Second shift, second stair, and one of these days
      the list is going to check quickly and the gate is going to clear
      and there will be nothing in the way at all, and I will say it,
      or I will not, and we will do this for another four years.

      [Outro - fade]
