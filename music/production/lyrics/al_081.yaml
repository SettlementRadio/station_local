    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, amplified organ, dry studio sound, cold ending
    lyrics: |
      [Intro - pipes and fiddle, fourteen seconds]

      [Verse 1]
      You sing a line in here and the line does not stop.
      It goes up into the roof and comes back down eleven seconds later
      and lands on top of whatever you were going to say next,
      so the first night I sang a record's worth of mud.
      Toller stood at the far wall with his hands over his ears
      and said, kindly, that he had heard worse. He had not.

      [Chorus]
      Hot floor, cold shop, and the machines all stopped,
      and a building that has been shouting since before any of us.
      You do not sing over a room like this. You sing into the gaps.
      Say half of it and let the shop say the other half.

      [Verse 2]
      Orsa worked it out, because Orsa always works it out.
      Two lines and then a bar of nothing. Two lines and wait.
      It sounds like a man who cannot remember his own song.
      It is the only reason there is a record and not a noise.
      Hardest thing I have ever learned and I have learned some things.
      Shut up in the middle of a line, on purpose, four hundred times.

      [Verse 3]
      This is a shop. There is a shift in here at six.
      There is a bench behind me with somebody's work on it
      and a rack of stock that nobody was allowed to move
      and a floor that is warm from a settlement's worth of heat.
      We are guests. We are guests with four nights and a deadline
      and a label who found nowhere else in Forge that rings.
      Four nights between a bulkhead and a rack of stock.

      [Chorus]
      Hot floor, cold shop, and the machines all stopped,
      and a building that has been shouting since before any of us.
      You do not sing over a room like this. You sing into the gaps.
      Say half of it and let the shop say the other half.

      [Final Chorus - pipes answering the vocal line]
      Hot floor, cold shop, and four of us in it,
      and a note I let go of a very long time ago
      still coming down out of the roof at me now.
      Say half of it. The shop has been here longer.

      [Outro - held note left to decay for eleven seconds]
