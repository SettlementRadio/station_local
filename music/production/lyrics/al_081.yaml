  - id: s_0668
    title: Dance in Your Work Boots
    track_number: 4
    mood: [fast, blunt, communal]
    fact: >-
      Bree Hollan plays struck alloy taken off the shop's own scrap rack and put back the same night,
      and the piece she used is named in the sleeve.
    arrangement_note: the percussion is a single piece of scrap alloy off the shop's rack struck with a hand tool, played instead of most of the kit rather than on top of it, and it is the loudest thing on the track
    intro: 6
    outro: sustain
    target_duration: "3:30"
    prompt: >-
      168 BPM blunt jump-reel; dry male tenor, loud struck scrap plate, acoustic pipes, held ending.
    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, amplified organ, full drum kit, fade-out, cold ending
    lyrics: |
      [Intro - struck alloy alone, six seconds]

      [Verse 1]
      Nobody here changes to come out. There is nowhere to change.
      You finish at four and the hall is at half past five
      and the boots you have got on are the boots you are dancing in,
      which is a hundred and forty years of Forge in one sentence.
      A core visitor asked why nobody dressed for the floor.
      Bree held up both hands, still black from the shift.

      [Chorus]
      Dance in your work boots. Dance in the coat you wore in.
      Nobody in this settlement has ever owned a second pair.
      There is grease on this floor and there is grease on every floor.
      The whole town smells of the whole town. Get up.

      [Verse 2]
      Bree went to the scrap rack and came back with a plate
      about the size of a hatch and a hand tool for hitting it,
      stock number cut along one edge under the grease.
      She struck it once. Every work boot found the pitch.
      Before the morning she wiped both faces clean.
      The plate went back between two offcuts on the rack.

      [Verse 3]
      The shift steward dances nearest to the scrap rack.
      A welder turns with one glove tucked inside his belt.
      A freight crew stamps the grease they carried from the line.
      Bree lifts the tool and leaves the next hard beat to them.
      The plate rings on after every heel comes down.
      At quarter to six, nobody has changed their boots.

      [Chorus]
      Dance in your work boots. Dance in the coat you wore in.
      Nobody in this settlement has ever owned a second pair.
      There is grease on this floor and there is grease on every floor.
      The whole town smells of the whole town. Get up.

      [Final Chorus - pipes answering the vocal line]
      Dance in your work boots. It is a quarter to six.
      There is a shift in the morning and there is always a shift.
      The whole town smells of the whole town. Get up,
      and put the plate back on the rack before you go.

      [Outro - one struck plate left ringing]
