  - id: s_0666
    title: Shut the Machines Down
    track_number: 2
    mood: [brisk, hard, plain]
    fact: >-
      The tune is timed to the shop's shutdown sequence, which takes ninety seconds, and the band
      rehearsed to it for a month before recording.
    arrangement_note: the first ninety seconds of the track are played against the shop's actual shutdown sequence and the band arrives in stages as each machine stops, so the arrangement gets quieter and the tune gets clearer at exactly the rate the building goes silent
    intro: 20
    outro: cold
    target_duration: "4:10"
    prompt: >-
      144 BPM hard jump-reel; dry male tenor, machinery shutdown, band enters in stages, cold stop.
    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, amplified organ, fade-out
    lyrics: |
      [Intro - the shop's shutdown sequence, twenty seconds, band entering as machines stop]

      [Verse 1]
      The shift steward puts one hand against the panel.
      First the big motor rolls nine seconds toward silence.
      Then the cutting line lets go and belts slap still.
      Four air valves empty somewhere past the bulkhead.
      Bree waits with the tool held over struck alloy.
      The whole settlement keeps breathing off what stops in here.

      [Chorus]
      Shut it down, shut it down, and count it while it goes.
      Nine for the big one, twelve for the line, four for the air.
      Forge has never heard this building reach the bottom.
      Hold the last count. Let the empty shop arrive.

      [Verse 2]
      Bree came in on the struck alloy at forty-one seconds
      because that is when the second motor lets go of the belt.
      Toller waits until the air has finished, which is sixty-eight.
      Orsa is last, and the pipes come in on nothing at all,
      into a shop that has been loud since before his father.
      Dane raises the fiddle. The steward watches the panel.

      [Chorus]
      Shut it down, shut it down, and count it while it goes.
      Nine for the big one, twelve for the line, four for the air.
      Forge has never heard this building reach the bottom.
      Hold the last count. Let the empty shop arrive.

      [Verse 3]
      A shift steward stood at the door for the whole ninety seconds
      with a hand on the panel in case any of it went wrong,
      because a shop that is stopped wrong is a shop that is broken
      and the settlement does not stop needing what this place makes.
      She never once looked at the band. She watched the machines.
      She said afterwards it was the longest minute of her working life.

      [Final Chorus - pipes answering the vocal line]
      Shut it down, shut it down, and count it while it goes,
      and start it up at six and never mention it again.
      Nobody in Forge has ever heard this building empty
      except one steward with her hand against the panel.

      [Outro - cold stop]
