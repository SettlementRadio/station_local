    The settlement's own working pipe shop in Forge, over four nights with the machines stopped and
    an eleven-second decay in the building. The card holds in every respect but one, and that one is
    dated: the resonance pipes are **not amplified anywhere on this record**, because in 2583 this
    band was Purist and Orsa Lipp's whole argument was that the pipes were an acoustic instrument.
    They are bowed and struck in the room and the room does the rest. Everything else is the card —
    male lead singing against the fiddle he is playing himself, no vocal harmony of any kind, bass
    and kit kept dry against the ringing shop, slapback on the voice. Two fact-bound exceptions live
    in their own songs: the pipes are tuned a full tone below working pitch on s_0667 and nowhere
    else, and there are no pipes at all on s_0670. s_0671 is a single take with no repairs because
    there were forty minutes left before the pipes had to go back.

