    lyrics: |
      [Intro - band, eight seconds]

      [Verse 1]
      Toller wrote a bass part like a man writes a bass part,
      down where the good notes live, underneath everything else,
      and he played it on the first night and it went into the roof
      and did not come back, and there was a hole in the band.
      So he moved the whole thing up an octave, all of it,
      and he has been annoyed about it since about a quarter past nine.

      [Chorus]
      No quiet in this building. Not one second of it.
      Not when it is running and not when it is stopped.
      Even the empty version of this room has a hum in it
      that is not a machine and that nobody can find.

      [Verse 2]
      The low notes are not gone. That is what nobody believes.
      They are still in here somewhere going round and round
      the way a shout goes round a hold with the cargo out,
      and they will come back down when the third verse is starting
      and sit on top of it like a man sitting on his own hat.
      You cannot mix that. You can only stop making it.

      [Chorus]
      No quiet in this building. Not one second of it.
      Not when it is running and not when it is stopped.
      Even the empty version of this room has a hum in it
      that is not a machine and that nobody can find.

      [Verse 3]
      There is a whole way of playing that this shop invented
      by refusing to carry anything below a certain note,
      and every band in Forge has done it since without knowing why,
      and the reason is a bass player being sensible in 2583.
      He is not going to get any credit for that. He would hate it.
      Toller Grange, who moved a bass part up and never said so.

      [Final Chorus - pipes answering the vocal line]
      No quiet in this building. Not one second of it,
      and we made a record in it, which was a strange idea.
      Even the empty version of this room has a hum in it,
      and there is nothing under this band tonight but pipes.

      [Outro - fade]
