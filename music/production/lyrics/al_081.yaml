    lyrics: |
      [Intro - struck alloy alone, six seconds]

      [Verse 1]
      Nobody here changes to come out. There is nowhere to change.
      You finish at four and the hall is at half past five
      and the boots you have got on are the boots you are dancing in,
      which is a hundred and forty years of Forge in one sentence.
      Somebody from the core wrote that we look like we came from work.
      We did come from work. Where does he think we came from.

      [Chorus]
      Dance in your work boots. Dance in the coat you wore in.
      Nobody in this settlement has ever owned a second pair.
      There is grease on this floor and there is grease on every floor.
      The whole town smells of the whole town. Get up.

      [Verse 2]
      Bree went to the scrap rack and came back with a plate
      about the size of a hatch and a hand tool for hitting it,
      and it is on the sleeve with its stock number, which she insisted on,
      and it went back on the rack the same night before the shift.
      Deep Register wanted her to keep it and she would not.
      She said it is not mine, it is the shop's, and put it back.

      [Verse 3]
      There is no kit on this one worth calling a kit.
      There is a woman hitting a piece of the building with a tool.
      Every settlement on the frontier makes its own noise
      out of what it already has and cannot afford to buy twice,
      and Forge has a rack of offcuts and eleven long pipes
      and that is why we sound like this and nobody else does.

      [Chorus]
      Dance in your work boots. Dance in the coat you wore in.
      Nobody in this settlement has ever owned a second pair.
      There is grease on this floor and there is grease on every floor.
      The whole town smells of the whole town. Get up.

      [Final Chorus - pipes answering the vocal line]
      Dance in your work boots. It is a quarter to six.
      There is a shift in the morning and there is always a shift.
      The whole town smells of the whole town. Get up,
      and put the plate back on the rack before you go.

      [Outro - one struck plate left ringing]
