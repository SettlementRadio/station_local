    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, amplified organ, fade-out
    lyrics: |
      [Intro - the shop's shutdown sequence, twenty seconds, band entering as machines stop]

      [Verse 1]
      Ninety seconds. That is what it takes to stop this building.
      The big one first, and it takes nine of them on its own,
      then the line, then the air, then a sound like a held breath,
      and then a room the size of a settlement with nothing in it.
      We rehearsed against that for a month in our own time,
      because you cannot ask a shop to do it twice.
      Every scrubber in this settlement runs off that line.

      [Chorus]
      Shut it down, shut it down, and count it while it goes.
      Nine for the big one, twelve for the line, four for the air.
      Nobody in Forge has ever heard this building empty.
      That is what you are listening to. That is the whole record.

      [Verse 2]
      Bree came in on the struck alloy at forty-one seconds
      because that is when the second motor lets go of the belt.
      Toller waits until the air has finished, which is sixty-eight.
      Orsa is last, and the pipes come in on nothing at all,
      into a shop that has been loud since before his father,
      and it is the best twenty seconds any of us have made.

      [Chorus]
      Shut it down, shut it down, and count it while it goes.
      Nine for the big one, twelve for the line, four for the air.
      Nobody in Forge has ever heard this building empty.
      That is what you are listening to. That is the whole record.

      [Verse 3]
      A shift steward stood at the door for the whole ninety seconds
      with a hand on the panel in case any of it went wrong,
      because a shop that is stopped wrong is a shop that is broken
      and the settlement does not stop needing what this place makes.
      He never once looked at the band. He looked at the machines.
      He said afterwards it was the longest minute of his working life.

      [Final Chorus - pipes answering the vocal line]
      Shut it down, shut it down, and count it while it goes,
      and start it up at six and never mention it again.
      Nobody in Forge has ever heard this building empty
      and four of us have, four times, and we are not the same.

      [Outro - cold stop]
