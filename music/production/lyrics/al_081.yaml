# Written by M-24. **The file shape is fixed by al_001.yaml — read that header once.** Production
# vocabulary (COMMISSION.md §8): never enters the wiki, never said on air. Lyrics written by hand;
# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# Four nights in a working Forge pipe shop with the machines shut down, recorded there because Deep
# Register could not find a room anywhere in Forge with the same reverberation. **The eleven-second
# decay is the arrangement problem of the whole record** and every prompt states it: the tempos were
# chosen against it, the bass and kit are kept dry against it, and Dane Verrow sings in gaps he had
# to learn to leave. Only four nights, because Orsa Lipp tuned the settlement's own pipes down for
# the sessions and had to tune them back before every morning shift.
#
# **One collision between the wiki and the style card, resolved the wiki's way.** b_038's card says
# *amplified* resonance pipes; the wiki says the band was Purist until 2591 and that Orsa Lipp spent
# a decade arguing the pipes were an acoustic instrument. **So nothing on this record is amplified**
# — every prompt says the pipes are bowed and struck acoustically in the room, and the first
# amplifier in this band's life is the first sound on al_082. The card is not amended; the exception
# is dated, and it expires in 2591.
#
# The band has **no backing vocal anywhere, ever** — the card is explicit and so is the line-up, and
# the pipes answer the vocal where a second voice would be. Every exclude line here keeps harmony
# out. Two of the seven take an instrumental break; b_038 is the one band in this genre whose card
# gives the break to two instruments, and they trade it. `generation:` and every `take:` were
# filled from the dispatch manifest at M-33.

