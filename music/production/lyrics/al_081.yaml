  - id: s_0670
    title: Second Shift Sweetheart
    track_number: 6
    mood: [warm, midtempo, fond]
    fact: >-
      Dane Verrow wrote it about someone he only ever saw at shift changeover, and it is the only
      song on the record with no pipes on it at all.
    arrangement_note: no resonance pipes anywhere on this track, which leaves the fiddle carrying the whole top of the arrangement alone and makes the room sound much smaller than it does on everything else
    intro: 10
    outro: fade
    target_duration: "3:50"
    prompt: >-
      138 BPM warm jump-reel; dry male tenor, fiddle-led with no pipes, intimate workshop, soft fade.
    exclude: vocal harmony, backing vocals, second voices, resonance pipes, organ, sustained drones, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, cold ending
    lyrics: |
      [Intro - fiddle alone, ten seconds]

      [Verse 1]
      Twelve minutes at the changeover and that is the whole thing.
      She comes up the stair as I am going down it
      and there is a bottleneck at the gate where the lists get checked
      and for about a minute and a half nobody can move.
      Four years of that. Four years of a minute and a half.
      I know what she eats. I do not know where she lives.
      I do not know her deck. I do not know her name.

      [Chorus]
      Second shift, second stair, second half of the day.
      She goes up as the whole of my week is going down.
      There is a settlement of four hundred thousand out there
      and the only place I have ever seen her is a gate.

      [Verse 2]
      Bree says ask her. Bree says this is not complicated.
      Bree has never had to say anything to anybody in her life
      because Bree opens a door and the room rearranges itself.
      Orsa says nothing, which is Orsa's whole position on it.
      Toller said, once, that a gate is a fine place to meet somebody,
      and then went back to the bass and did not elaborate.

      [Turnaround - fiddle alone, four bars]

      [Verse 3]
      At changeover yesterday the list jammed at her name.
      The clerk read it once and asked her to repeat it.
      Dane stood three places back and learned it through the queue.
      The gate cleared before he found a word to follow.
      Today the fiddle keeps the room close around him.
      Tomorrow he has twelve minutes and her name.

      [Chorus]
      Second shift, second stair, second half of the day.
      She goes up as the whole of my week is going down.
      There is a settlement of four hundred thousand out there
      and the only place I have ever seen her is a gate.

      [Final Chorus - fiddle answering the vocal line]
      Second shift, second stair, and one of these days
      the list is going to check quickly and the gate is going to clear
      and there will be nothing in the way at all, and I will say it,
      or I will not, and we will do this for another four years.

      [Outro - fade]
