  - id: s_0669
    title: Nothing Here Is Quiet
    track_number: 5
    mood: [loud, insistent, bright]
    fact: >-
      Toller Grange plays the bass line an octave higher than written because the low notes
      disappeared entirely into the room.
    arrangement_note: the bass plays its whole part an octave above where it is written because the low octave was inaudible in this building, which leaves nothing at all under the band except the pipes
    intro: 8
    outro: fade
    target_duration: "3:45"
    prompt: >-
      164 BPM bright jump-reel; dry male tenor, high upright bass, acoustic low pipes, long room fade.
    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, amplified organ, deep bass, sub-bass, cold ending
    lyrics: |
      [Intro - band, eight seconds]

      [Verse 1]
      Toller struck the low note once beside the stock rack.
      Orsa's pipes rolled over it and took it through the roof.
      He tried again with Bree standing by the far wall.
      She held one hand up: nothing underneath the room.
      Toller moved the line an octave toward the fiddle.
      At quarter past nine the missing part came back as wood.

      [Chorus]
      No quiet in this building. Not one second of it.
      Not when it is running and not when it is stopped.
      Even the empty version of this room has a hum in it
      that is not a machine and that nobody can find.

      [Verse 2]
      The old low notes keep circling somewhere above the lamps.
      One comes down late beside a rack of stripped wire.
      Another lands across the fiddle in the second turn.
      A shout goes round an empty hold exactly that way:
      cargo gone, doors open, nobody where it returns.
      Toller stays high and lets the lost notes pass.

      [Chorus]
      No quiet in this building. Not one second of it.
      Not when it is running and not when it is stopped.
      Even the empty version of this room has a hum in it
      that is not a machine and that nobody can find.

      [Verse 3]
      A cutter on the night shift stands beside the door.
      She hears the high bass plainly through the closing line.
      At morning she will whistle it above the cutting bench.
      Toller will be gone before the big motor starts.
      He checks the upper string and packs it in the cart.
      The shop keeps both the hum and what he played above it.

      [Final Chorus - pipes answering the vocal line]
      No quiet in this building. Not one second of it,
      not at the bulkhead and not beside the wire.
      Even the empty version of this room has a hum in it,
      and the bass walks high while the pipes hold underneath.

      [Outro - fade]
