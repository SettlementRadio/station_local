songs:
  - id: s_0665
    title: Hot Floor, Cold Shop
    track_number: 1
    mood: [fast, cavernous, driving]
    fact: >-
      Dane Verrow sings against an eleven-second decay and had to leave gaps he later described as
      the hardest thing he ever learned to do.
    arrangement_note: the vocal leaves a full bar of silence after every second line so that the room can finish the line for him, which is the only way anything sung in this building is audible at all
    intro: 14
    outro: sustain
    target_duration: "4:00"
    prompt: >-
      152 BPM cavernous jump-reel; dry male tenor, fiddle, acoustic resonance pipes, 11-second decay.
    exclude: vocal harmony, backing vocals, second voices, electric guitar, synthesizers, drum machines, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, amplified organ, dry studio sound, cold ending
    lyrics: |
      [Intro - pipes and fiddle, fourteen seconds]

      [Verse 1]
      Dane sang the first line hard against the roof.
      He reached the third before the first came down.
      Both landed on the fiddle and buried every word.
      Toller stood by the stock rack with his hands over his ears.
      Bree stopped counting. Orsa let the pipe note finish.
      Eleven seconds later all four heard what went wrong.

      [Chorus]
      Hot floor, cold shop, and the machines all stopped,
      and a building that has been shouting since before any of us.
      You do not sing over a room like this. You sing into the gaps.
      Say half of it and let the shop say the other half.

      [Verse 2]
      Orsa chalked two marks on the bench beside the bow.
      Sing to the second mark. At the third, say nothing.
      Dane tried once and filled the gap too early.
      Tried twice and watched his old line cross the new one.
      On the third he held his breath and let the shop answer.
      Leaving one bar empty took the whole first night.

      [Verse 3]
      Somebody's half-cut signal plate lay on a freight manifest.
      A shift list hung at six beside the bulkhead door.
      Nobody moved the stock or touched the marked-out bench.
      The floor stayed warm from Forge beneath their boots.
      At half past four the steward checked each rack.
      Dane waited through the silence till her footsteps cleared.

      [Chorus]
      Hot floor, cold shop, and the machines all stopped,
      and a building that has been shouting since before any of us.
      You do not sing over a room like this. You sing into the gaps.
      Say half of it and let the shop say the other half.

      [Final Chorus - pipes answering the vocal line]
      Hot floor, cold shop, and four of us in it,
      and a note I let go of a very long time ago
      still coming down out of the roof at me now.
      Say half of it. Wait. Let the shop finish.

      [Outro - held note left to decay for eleven seconds]
