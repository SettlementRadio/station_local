  room: >-
    A port hall on the morning after the festival's last night, doors open, the site being cleared
    outside. Not a hold this time — the room is bigger and harder than anything else in this band's
    catalogue and the prompts say so, but the kit is still crates and struck metal and the bass is
    still big and woody. The card holds: low bass-baritone lead under the fiddle and never lifted,
    one female harmony from the bass chair on choruses. Three fact-bound details live in their own
    songs: the second fiddle on s_1122 belongs to a player off another crew whom the co-operative has
    never been able to credit; the harmony on s_1123 is sung from the doorway because the hall was
    full; and the last voice on s_1125 is a port officer asking the band to move, left on the take.
    The crews singing on s_1121 and s_1125 are a crowd and not a backing vocal.

