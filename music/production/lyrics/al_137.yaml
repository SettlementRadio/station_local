    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, matched or unison fiddles, cold ending
    lyrics: |
      [Intro - two fiddles, fourteen seconds]

      [Verse 1]
      There was a woman off a crew from somewhere down the lane
      standing at the side of the hall on the second night
      with a fiddle case she had carried into a port hall
      the way you carry a thing you are not sure you will use.
      Col saw the case before he saw her, which is Col,
      and by the second tune the two of them were at it.

      [Chorus]
      Two crews, one tune, and nobody has met before,
      and it took about four bars and then it took none.
      That is the thing nobody outside this trade believes:
      we all know the same forty tunes and we have never met.

      [Instrumental - two fiddles trading, eighteen seconds]

      [Verse 2]
      She is better than he is. He said so at the time.
      She is better than he is by a distance and she was lost,
      because our tunes have a limp in them and hers do not
      and she spent half of it working out where the beat had gone.
      Then she found it, and she got in front of it,
      and there is about six seconds on this take that is hers alone.

      [Chorus]
      Two crews, one tune, and nobody has met before,
      and it took about four bars and then it took none.
      That is the thing nobody outside this trade believes:
      we all know the same forty tunes and we have never met.

      [Verse 3]
      Nobody wrote her name down. Nobody wrote anything down.
      It was four in the morning and the doors were still open
      and the co-operative has been trying to find her since,
      because she is on this record and she is not on the sleeve.
      If you are reading this and it was you, it was you.
      There is a payment sitting at the co-operative with no name on it.

      [Final Chorus - harmony from the bass chair]
      Two crews, one tune, and one of them went home,
      and there is a berth number somewhere that nobody kept.
      We all know the same forty tunes and we have never met,
      and I have listened to those six seconds about nine hundred times.

      [Outro - fade]
