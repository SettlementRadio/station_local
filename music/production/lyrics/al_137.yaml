  - id: s_1121
    title: Everybody's Circuit
    track_number: 1
    mood: [fast, communal, bright]
    fact: >-
      Wend Amory wrote it on the run in and the second verse names four crews who were at the
      festival, three of whom asked afterwards to be taken out of it.
    arrangement_note: a hall full of freight crews shouts the last line of every chorus back at the band, ragged and unpitched and in about three keys, which is the only reason this track was worth cutting the morning after
    intro: 10
    outro: cold
    target_duration: "4:00"
    prompt: >-
      Skiffle and jump blues at reel tempo, 160 BPM, fast and bright, communal. Male lead vocal, low
      bass-baritone, unhurried and dry, sitting under the fiddle, staying in his own low register and
      never lifted into a brighter key. One female harmony voice on the choruses only. At the end of
      every chorus a room full of untrained adults shouts the last line back — ragged, unpitched,
      several keys at once, a crowd and never a stacked backing vocal. Composite fiddle, fretted
      composite guitar, big woody upright bass, a kit built out of wooden crates and struck metal,
      stripped-wire chimes. Recorded in a large hard port hall with the doors open: bigger and
      brighter than a hold, some outdoor noise leaking in. Ten seconds of fiddle before the first sung
      word. Cold stop.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, stacked or blended backing vocals, studio choir, fade-out
    lyrics: |
      [Intro - fiddle, ten seconds]

      [Verse 1]
      Somebody in an office worked out that if every crew
      on the whole circuit timed its turnaround for the same week
      then for six days there would be four thousand people
      in one port hall who normally pass each other in the dark.
      It should not have worked. Half of it did not work.
      The half that worked was the best week of my life.

      [Chorus]
      One circuit for everybody, and nobody's port,
      and a hall that was built for a load and not for this.
      Whatever crew you are off, get out on that floor.

      [Crews - shouted flat, no harmony]
      NOBODY IS SIGNING ANYTHING TONIGHT.

      [Verse 2]
      I wrote the second verse on the run in, on the deck,
      and put four crews in it by name, because they were there,
      and three of those four have since asked to come out of it
      on the grounds that they were not quite as they are described.
      They were exactly as they are described. Ask anybody.
      The fourth crew asked for another verse and did not get one.

      [Chorus]
      One circuit for everybody, and nobody's port,
      and a hall that was built for a load and not for this.
      Whatever crew you are off, get out on that floor.

      [Crews - shouted flat, no harmony]
      NOBODY IS SIGNING ANYTHING TONIGHT.

      [Verse 3]
      There were crews there who had been on the same lane for years
      and had never once been in the same settlement at the same hour
      and stood at a door working out that they knew each other
      off a carrier wave, by voice, and not by face at all.
      A man walked up to Ilsa and said I know your bass
      and could not tell you what she looked like. That is the circuit.

      [Final Chorus - harmony from the bass chair, the crews over the top]
      One circuit for everybody, and nobody's port,
      and it is over on Sunday and the whole thing scatters.
      Whatever crew you are off, get out on that floor.

      [Crews - shouted flat, no harmony]
      NOBODY IS SIGNING ANYTHING TONIGHT.

      [Outro - cold stop]
