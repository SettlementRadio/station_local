# al_137 — Burn Festival Set · Loose Cargo (b_039) · Common Wake Cooperative · 2594 · 5 songs · EP
#
# Written by M-24. **The file shape is fixed by al_001.yaml — read that header once.** Production
# vocabulary (COMMISSION.md §8): never enters the wiki, never said on air. Lyrics written by hand;
# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# Five tunes cut in a port hall on the morning after the last two nights of the first freight-circuit
# burn festival, with the doors still open and the festival being cleared outside them. **The
# shortest thing this band made and the only one with other crews singing on it** — which is a room
# full of freight crews shouting along, not a second harmony part. b_039 has one harmony voice, from
# the bass chair, on choruses, and that does not change here; the exclude lines keep any blended or
# stacked backing vocal out and the prompts describe the crews as a crowd.
#
# The record is a working band's snapshot of one week and the lyrics are written that way: nobody in
# them knows the festival is going to become an anchor of the whole calendar. It went out along the
# route for a season and then out of print, which Wend Amory has called the only sensible thing the
# co-operative ever did with a record of theirs — so the words are loose, local and unpolished on
# purpose.
#
# Two of the five take a fiddle break, one of them against a fiddler off another crew whose name
# nobody wrote down. `generation:` and every `take:` are empty until M-33.

