    lyrics: |
      [Intro - guitar and fiddle, eight seconds]

      [Verse 1]
      This is not our hall. This is not anybody's hall.
      It is a port hall, which means it is a room for cargo
      that somebody put a floor in about forty years ago
      because there was nowhere else on the whole site to put people.
      There is a weighbridge at the far end under a sheet.
      There is a manifest board on the wall with last week still on it.

      [Chorus]
      Somebody else's floor and everybody's night,
      and none of us will ever be in this room again.
      Play it like you are borrowing it, because you are.
      Leave it the way you found it. Leave it better.

      [Verse 2]
      Ilsa is in the doorway. There is nowhere else for Ilsa.
      The hall was full at nine and it was fuller at eleven
      and by the time we were recording there was a person
      in every part of that building including the stair,
      so she stood in a doorway with the outside behind her
      and sang the chorus from about forty feet away.

      [Chorus]
      Somebody else's floor and everybody's night,
      and none of us will ever be in this room again.
      Play it like you are borrowing it, because you are.
      Leave it the way you found it. Leave it better.

      [Verse 3]
      You can hear the outside on her. You can hear the site.
      There is a hauler being moved about a hundred yards off
      and a man shouting numbers and the wind coming round the corner
      and a whole festival being taken apart behind her voice.
      The co-operative wanted to cut that verse and re-record it.
      They have been told what everybody tells them, which is no.

      [Final Chorus - harmony from the doorway, distant]
      Somebody else's floor and everybody's night,
      and a woman in a doorway with a settlement behind her.
      Play it like you are borrowing it, because you are,
      and get off it by noon, because the load comes in at one.

      [Outro - fade]
