    lyrics: |
      [Intro - fiddle and the site being cleared outside, sixteen seconds]

      [Verse 1]
      It is nine in the morning and there is a man with a list
      walking round this hall putting a mark against everything,
      and outside there is a whole week coming apart in sections
      and going back onto the ships it arrived on.
      We have got about forty minutes and five tunes
      and a co-operative that wants a record out of this.

      [Chorus]
      Sign off, then dance, in that order, always.
      Get the load away and then have the night you have earned.
      Nobody at this festival is on anybody's clock,
      which is the first time that has been true in years.

      [Verse 2]
      The whole point of the week was that it was between runs.
      Everybody's turnaround, nobody's shift, no cargo waiting,
      and four thousand people on a site with nothing to do
      for the first time since any of them started working.
      You could feel people not knowing how to have it.
      By the third day they had worked it out. By the fifth it was gone.

      [Verse 3]
      There is a woman here from a crew off the far circuit
      who has not been off her own lane in eleven years
      and has spent this week being introduced to about nine people
      whose voices she has known on a carrier wave since she was young.
      She said it was like a room full of people she had read about.
      She is going out at noon and it is not going to happen again.

      [Chorus]
      Sign off, then dance, in that order, always.
      Get the load away and then have the night you have earned.
      Nobody at this festival is on anybody's clock,
      which is the first time that has been true in years.

      [Final Chorus - harmony from the bass chair, the crews over the top]
      Sign off, then dance, and then go and load the hold,
      and the next one is in a year and everybody says they will come.
      Nobody at this festival is on anybody's clock.
      Half of us will be on a run. That is the arrangement.

      [Officer - spoken, off-microphone, over the last chord]
      Right, gentlemen, I am going to have to ask you to move.

      [Outro - held chord]
