  - id: s_1125
    title: Sign Off and Dance
    track_number: 5
    mood: [brisk, satisfied, communal]
    fact: >-
      Cut with the doors open while the festival was being cleared, and the last voice on it is a port
      officer asking the band to move.
    arrangement_note: the site is audibly being taken apart outside for the whole track, and the last thing on the record is not music but a port officer's speaking voice asking the band to move, which was left on
    intro: 16
    outro: sustain
    target_duration: "4:10"
    prompt: >-
      150 BPM brisk reel; low dry male bass-baritone, crew shouts, site-clearance noise, officer ending.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, stacked or blended backing vocals, clean studio recording, cold ending
    lyrics: |
      [Intro - fiddle and the site being cleared outside, sixteen seconds]

      [Verse 1]
      Nine in the morning, one port officer with a list,
      marking every borrowed rail and folded meal-hall table.
      Outside, six festival days come apart in sections:
      lamps into cases, scaffold down, signs off the wall.
      Clearance carts reverse through both wide-open doors.
      The officer checks his time and gives us forty minutes.
      Reddin finds two crates still standing and counts four.

      [Chorus]
      Sign off, then dance, in that order, always.
      Get the load away and then have the night you have earned.
      Nobody on this floor is on another person's clock.
      The morning shift can wait until the final turn comes round.

      [Verse 2]
      Two crews roll the outer fencing past the doorway.
      Someone stacks the ration cups in towers by the gate.
      Twenty dancers stay between the weighbridge and our cases,
      coats unbuttoned, eyes half shut, boots grey with six days' dust.
      Col lifts the fiddle over shouted clearance numbers.
      Ilsa's distant line comes in with wind behind it.
      Every time the officer looks up, the floor has one more pair.

      [Verse 3]
      A woman from the far circuit stands beside the last sign.
      Eleven years upon one lane, first week beyond its berths.
      She has met nine carrier-wave voices face to face,
      learned which laugh belongs to whom and who is shorter than they sound.
      Her noon run flashes twice upon the relay board.
      She takes one final turn with North Ledger's youngest pilot,
      then keeps her work coat on and stays for one more chorus.

      [Chorus]
      Sign off, then dance, in that order, always.
      Get the load away and then have the night you have earned.
      Nobody on this floor is on another person's clock.
      The morning shift can wait until the final turn comes round.

      [Final Chorus - harmony from the bass chair, the crews over the top]
      Sign off, then dance, and then go and load the hold,
      fold the final table, clear the borrowed port-hall floor.
      Nobody on this floor is on another person's clock.
      North Ledger, Last Light, every crew still here—sing once.
      Then take your cases, find your berth, and scatter with the loads.

      [Officer - spoken, off-microphone, over the last chord]
      Right, gentlemen, I am going to have to ask you to move.

      [Outro - held chord]
    take: null # M-33 fills this in at the Suno sitting
