  - id: s_1122
    title: Two Crews, One Tune
    track_number: 2
    mood: [quick, competitive, warm]
    fact: >-
      Col Sennet plays it against a fiddler off another crew whose name nobody wrote down, and the
      co-operative has never been able to credit her.
    arrangement_note: two fiddles, one of them plainly a different player with a different training, trading the break between them, and the second one is better and does not know the tune
    intro: 14
    outro: fade
    target_duration: "4:20"
    prompt: >-
      156 BPM duel reel; low dry male bass-baritone, two mismatched fiddles trading, open-hall fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, matched or unison fiddles, cold ending
    lyrics: |
      [Intro - two fiddles, fourteen seconds]

      [Verse 1]
      A woman off a crew from somewhere down the lane
      stood beside the port-hall wall with one shut fiddle case.
      She held it by the handle like a tool she might not need.
      Col saw the scarred black case before he saw her face.
      He lifted his own bow; she raised one shoulder back.
      By the second tune, her latches lay open on the floor.
      By the third, both fiddles crowded under one low lamp.

      [Chorus]
      Two crews, one tune, and nobody has met before,
      four bars asking questions, four bars cutting in.
      We all carry forty tunes between a hold and hall.
      Find the crooked beat and play as if you always knew.

      [Instrumental - two fiddles trading, eighteen seconds]

      [Verse 2]
      She played cleaner, quicker, every ornament in place.
      Col dragged his old wrong accent through the middle of the bar.
      First exchange she missed the limp and landed one beat early.
      Second time she watched the dancers, not his bowing hand.
      Third time she found the gap and stepped in front of him.
      Col laughed aloud and dropped the next four bars entirely.
      For six bright seconds, one unknown fiddle owned the hall.

      [Chorus]
      Two crews, one tune, and nobody has met before,
      four bars asking questions, four bars cutting in.
      We all carry forty tunes between a hold and hall.
      Find the crooked beat and play as if you always knew.

      [Verse 3]
      At four, the doors stood open and the run-out calls began.
      She wiped the fiddle down and shut it in the scarred black case.
      Col asked which berth. She pointed through the clearing crews.
      He asked her name; a cargo hauler sounded over both of them.
      She waved once from the ramp and vanished past the manifest board.
      Nobody wrote the crew, the route, the berth or player down.
      Only one clean rosin mark stayed pale beneath the lamp.

      [Final Chorus - harmony from the bass chair]
      Two crews, one tune, and one of them went home,
      one scarred case gone somewhere down the relay road.
      We all carry forty tunes between a hold and hall.
      Col plays four empty bars and leaves her answer open.
      Find the crooked beat and play as if you always knew.

      [Outro - fade]
