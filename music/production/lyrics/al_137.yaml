  - id: s_1123
    title: Somebody Else's Floor
    track_number: 3
    mood: [rolling, warm, midtempo]
    fact: >-
      Ilsa Brack sings the harmony from the doorway because the hall was full and there was nowhere
      else to put her.
    arrangement_note: the harmony voice is sung from a doorway several rooms' width from the band with the outside audible behind her, which is further away than any vocal on any of this band's records
    intro: 8
    outro: fade
    target_duration: "3:55"
    prompt: >-
      134 BPM warm rolling reel; low dry male bass-baritone, distant doorway harmony, open hall fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, close or blended harmony, cold ending
    lyrics: |
      [Intro - guitar and fiddle, eight seconds]

      [Verse 1]
      This is not our hall and no crew keeps the key.
      Cargo gets the weekdays; borrowed feet get Saturday.
      A weighbridge sleeps beneath a sheet behind the dancers.
      Last week's manifest still covers half the western wall.
      Coats hang from the hooks where loading straps should go.
      Four thousand strangers leave one narrow path between them.
      We set the cases down as if the floor might ask them back.

      [Chorus]
      Somebody else's floor and everybody's night,
      and none of us will ever be in this room again.
      Play it like you are borrowing it, because you are.
      Leave it the way you found it. Leave it better.

      [Verse 2]
      Ilsa carries in the bass and finds no place to stand.
      The hall filled up at nine; by eleven, every stair was taken.
      Reddin points toward the doorway forty feet behind us.
      She wedges one bass foot where the threshold meets the stone.
      Outside, clearance carts reverse beneath the morning lamps.
      Inside, Col lifts the tune above a thousand moving coats.
      Ilsa sends one distant line across the whole hard room.

      [Chorus]
      Somebody else's floor and everybody's night,
      and none of us will ever be in this room again.
      Play it like you are borrowing it, because you are.
      Leave it the way you found it. Leave it better.

      [Verse 3]
      Wind comes round the corner, lifts the tally sheets behind her.
      A hauler moves one hundred yards beyond the loading gate.
      Someone calls out numbers while the scaffold loses bolts.
      Ilsa holds the chorus steady through the reversing signal.
      One child slips between her bass case and the open door.
      She moves an inch, no more, and sends the next line farther.
      The whole festival comes down outside; the borrowed floor keeps turning.

      [Final Chorus - harmony from the doorway, distant]
      Somebody else's floor and everybody's night,
      and a woman in a doorway with a settlement behind her.
      Play it like you are borrowing it, because you are,
      sweep it clean by noon; the next load comes at one.
      Leave both doors unblocked and every borrowed hook returned.

      [Outro - fade]
