  - id: s_1124
    title: Ration Week Reel
    track_number: 4
    mood: [fast, hard, defiant]
    fact: >-
      Reddin Vosk built the kit for it out of fittings borrowed off three different crews and gave
      every piece back before the run out.
    arrangement_note: every piece of the percussion came off a different ship and none of it matches, so the kit is louder, higher and more ragged than anything on the earlier record, and all of it went back before the run out
    intro: 6
    outro: cold
    target_duration: "3:45"
    prompt: >-
      168 BPM hard skiffle reel; low dry male bass-baritone, borrowed metal kit, fiddle break, cold stop.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, matched drum kit, cymbals, fade-out
    lyrics: |
      [Intro - borrowed metal and fiddle, six seconds]

      [Verse 1]
      Ration week begins with one late run and half a notice.
      The store queue bends around the port hall before dawn.
      Four hundred workers count the days against their tokens,
      trade one meal for two, then check the sum again.
      Nobody calls it danger; everybody calls it badly timed.
      Children ask why supper changed and get a longer answer.
      By Thursday, every crew has found the same short face.

      [Chorus]
      Short week, long face, and the same again on Thursday,
      and a queue at the store with four hundred people in it
      all doing the same sum in their heads and getting it right.
      It is fine. It is genuinely fine. We are all just cross.

      [Instrumental - fiddle break, fourteen seconds]

      [Verse 2]
      Reddin borrows one hatch fitting from the near-end crew,
      chain from a grey hauler waiting on the outer berth,
      bright alloy from a woman guarding Southbound Nine.
      She holds it out and says, "Before the Sunday run."
      Nothing shares a pitch, a shape, a bolt or working age.
      He hangs all three from crates and strikes the queue's complaint.
      Three ships answer one another underneath the fiddle break.

      [Chorus]
      Short week, long face, and the same again on Thursday,
      and a queue at the store with four hundred people in it
      all doing the same sum in their heads and getting it right.
      It is fine. It is genuinely fine. We are all just cross.

      [Verse 3]
      After dark, a full-hold crew rolls two sealed cases
      toward a lighter hauler at the far end of the berth.
      No names cross the manifest; no clerk records the weight.
      One third changes hands beneath a broken loading lamp.
      Nobody calls it charity or waits around for thanks.
      Next month, weather turns and cargo comes the other way.
      Everybody knows the sum because everybody has been short.

      [Final Chorus - harmony from the bass chair]
      Short week, long face, and the same again on Thursday,
      and Reddin at the gate returning three things before six.
      It is fine. It is genuinely fine. We are all just cross,
      and the Sunday run goes out with every borrowed bolt aboard.
      Next month, from the other direction. Everybody knows.

      [Outro - cold stop]
