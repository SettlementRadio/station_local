songs:
  - id: s_1121
    title: Everybody's Circuit
    track_number: 1
    mood: [fast, communal, bright]
    fact: >-
      Wend Amory wrote it on the run in and the second verse names four crews who were at the
      festival, three of whom asked afterwards to be taken out of it.
    arrangement_note: a hall full of freight crews shouts the last line of every chorus back at the band, ragged and unpitched and in about three keys, which is the only reason this track was worth cutting the morning after
    intro: 10
    outro: cold
    target_duration: "4:00"
    prompt: >-
      160 BPM bright reel; low dry male bass-baritone, female chorus, ragged crew shouts, cold stop.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, stacked or blended backing vocals, studio choir, fade-out
    lyrics: |
      [Intro - fiddle, ten seconds]

      [Verse 1]
      Four thousand people found the same port in one short week,
      freight crews who had crossed for years as lights beyond the glass.
      Cases filled the manifest room; coats buried every rail.
      Two haulers waited empty while their deck hands took the floor.
      Ilsa knew three voices before she knew three faces.
      Reddin built a crate kit where the weigh clerk used to sit.
      Six days should have broken down. Six days somehow held.

      [Chorus]
      One circuit for everybody, and nobody's port,
      and a hall that was built for a load and not for this.
      Whatever crew you are off, get out on that floor.

      [Crews - shouted flat, no harmony]
      NOBODY IS SIGNING ANYTHING TONIGHT.

      [Verse 2]
      North Ledger lost its cook at cards behind the berth.
      Lantern Six wore matching coats and swore it was not planned.
      Pale Runner signed three times for Southbound Nine's own cargo.
      Last Light came for one quick dance and stayed through Sunday noon.
      Four crew names I wrote between two watch bells on the run in,
      four small truths their deck mates shouted louder every time.
      Last Light asked for one more line. Three crews asked for less.

      [Chorus]
      One circuit for everybody, and nobody's port,
      and a hall that was built for a load and not for this.
      Whatever crew you are off, get out on that floor.

      [Crews - shouted flat, no harmony]
      NOBODY IS SIGNING ANYTHING TONIGHT.

      [Verse 3]
      Near the open doors, two pilots stopped and stared a moment.
      Same lane, same storm seasons, never once the same dry berth.
      Each knew when the other laughed from years of carrier waves.
      Neither knew the coat, the height, the scar above one eye.
      A man came up to Ilsa saying, "I would know that bass anywhere."
      Then looked directly past her for the player he had heard.
      She took his hand and said, "You know enough. Come dance."

      [Final Chorus - harmony from the bass chair, the crews over the top]
      One circuit for everybody, and nobody's port,
      and it is over on Sunday and the whole thing scatters.
      Whatever crew you are off, get out on that floor.

      [Crews - shouted flat, no harmony]
      NOBODY IS SIGNING ANYTHING TONIGHT.

      [Outro - cold stop]
