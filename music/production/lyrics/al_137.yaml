  - id: s_1124
    title: Ration Week Reel
    track_number: 4
    mood: [fast, hard, defiant]
    fact: >-
      Reddin Vosk built the kit for it out of fittings borrowed off three different crews and gave
      every piece back before the run out.
    arrangement_note: every piece of the percussion came off a different ship and none of it matches, so the kit is louder, higher and more ragged than anything on the earlier record, and all of it went back before the run out
    intro: 6
    outro: cold
    target_duration: "3:45"
    prompt: >-
