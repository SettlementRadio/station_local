    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, vocal tuning, whispered or rapped sections, modern pop production, bright or lifted lead vocal, matched drum kit, cymbals, fade-out
    lyrics: |
      [Intro - borrowed metal and fiddle, six seconds]

      [Verse 1]
      A ration week is not a famine and it is not a crisis.
      It is a form of arithmetic that arrives about twice a year
      when a supply run is late and a port is not to blame
      and everybody eats slightly less than they had planned to.
      Nobody dies. Everybody complains. That is the whole event.
      And every crew on the circuit has a tune about it.

      [Chorus]
      Short week, long face, and the same again on Thursday,
      and a queue at the store with four hundred people in it
      all doing the same sum in their heads and getting it right.
      It is fine. It is genuinely fine. We are all just cross.

      [Instrumental - fiddle break, fourteen seconds]

      [Verse 2]
      Reddin has a hatch fixing off a crew from the near end,
      a length of chain off a hauler nobody could name,
      and a piece of alloy that a woman handed him at a door
      and said bring it back, and he did, before the run out.
      None of it matches. That is the sound of this track.
      Three ships and a port hall and nothing that belongs together.

      [Chorus]
      Short week, long face, and the same again on Thursday,
      and a queue at the store with four hundred people in it
      all doing the same sum in their heads and getting it right.
      It is fine. It is genuinely fine. We are all just cross.

      [Verse 3]
      What actually happens in a short week is the good part.
      A crew with a full hold gives a crew with a light one
      about a third of what it has, quietly, at a berth,
      and nobody writes it down, and it is never mentioned again.
      That is not charity and nobody in this trade calls it that.
      It is next month, from the other direction, and everyone knows.

      [Final Chorus - harmony from the bass chair]
      Short week, long face, and the same again on Thursday,
      and a man giving a chain back at a gate at six.
      It is fine. It is genuinely fine. We are all just cross,
      and there is a run out on Sunday and a hold to fill.

      [Outro - cold stop]
