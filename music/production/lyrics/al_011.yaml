  - id: s_0104
    title: Receipt Without a Name
    track_number: 7
    mood: [mysterious, wounded, steady]
    fact: >-
      The percussion is Elo Vara tapping the unsigned meal receipt that appeared inside the session
      account.
    arrangement_note: the rhythm is a folded paper receipt tapped against a table edge, with Brin Noll's guest wire chimes behind it, and there is no drum kit in the song
    intro: 11
    outro: fade
    target_duration: "4:00"
    prompt: >-
      Compact close soft rock, 88 BPM, mysterious and wounded, steady. Female lead vocal, low and
      warm, close to the microphone, understated and conversational, letting phrases fall away
      rather than holding them. Three-part close harmony stacked behind the lead on the choruses,
      never shouted. Upright piano, upright bass, harpsichord-toned keyboard played by hand, a folded
      paper receipt tapped against a table edge as the entire rhythm with guest hanging wire chimes
      behind it, and no drum kit anywhere in the song. Dry and small, gentle tape warmth, no large
      reverb. Eleven seconds of tapped paper, chimes and piano before the first sung word. Fade.
    exclude: guitars, drum kit, synth pads, electronic drums, saxophone and smoky late-club arrangement, orchestral strings, belted vocals, vocal tuning, rapped sections, dance-pop production
    lyrics: |
      [Intro - 11 seconds, a folded receipt tapped on a table edge with chimes and piano, no vocal]

      [Verse 1]
      Somebody paid for the meal on the eleventh of the month.
      A whole table, nine of us, at the end of a long week,
      the night the last ferry was cancelled and nobody could get home,
      and the slip turned up in the account with no name on it
      and nobody at that table has ever said a word.

      [Chorus]
      A slip with no name on it at all. Signed by nobody.
      Somebody in this room went out to the counter quietly
      while the rest of us were arguing about a room booking,
      and came back, and sat down, and joined in with the argument.

      [Verse 2]
      I have gone through it four times like a person with a case.
      Two of them could not have. Three of them would have said.
      One of them would have said it twice and then again in the spring.
      That leaves three, and one of the three is you.

      [Chorus]
      A slip with no name on it at all. Signed by nobody.
      Somebody in this room went out to the counter quietly
      while the rest of us were arguing about a room booking,
      and came back, and sat down, and joined in with the argument.

      [Verse 3]
      It is not the money. It was not very much money,
      about what one person's ration costs for a fortnight.
      It is that somebody in a bad month, with the house not paying,
      went and did a warm thing and arranged for nobody to know,
      which is a way of loving a room full of people.

      [Bridge]
      I have put the slip in the ledger where it will not be found
      and written nothing beside it, which is the only kind thing left.

      [Chorus - whole group]
      A slip with no name on it at all. Signed by nobody.
      I am not going to ask you. I am never going to ask.
