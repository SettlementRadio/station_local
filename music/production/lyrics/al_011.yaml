    exclude: guitars, synth pads, electronic drums, saxophone and smoky late-club arrangement, orchestral strings, belted vocals, vocal tuning, rapped sections, dance-pop production
    lyrics: |
      [Intro - 7 seconds, an out-of-tune office upright with bass under it, no vocal]

      [Verse 1]
      Three times now. Ten in the morning, a room booked,
      a message out on the carrier wave the night before,
      a chair with nobody in it and a woman at a desk
      being extremely sorry about a thing that is not her fault
      and doing it beautifully, for the third month running.

      [Chorus]
      He is not going to call. He was never going to call.
      There is a version of this where I keep turning up at ten
      in a good coat, with a folder, being reasonable,
      until the whole of a year has gone into that empty chair.

      [Verse 2]
      I am not angry about the money. I would like that on the record.
      The money is a number and a number can be argued down
      the way a ration or a fare or a room rate can be argued down.
      What I mind is the three mornings, and the good coat,
      and the fact that I said nothing on any of them.

      [Chorus]
      He is not going to call. He was never going to call.
      There is a version of this where I keep turning up at ten
      in a good coat, with a folder, being reasonable,
      until the whole of a year has gone into that empty chair.

      [Verse 3]
      You came with me the third time and you sat in the corridor
      and you did not say I told you so, which you had, twice.
      You asked me afterwards where I would like to have lunch
      as though the morning had gone entirely to plan.

      [Bridge]
      There is one call I am going to make this afternoon
      and it is not to that office and it is not about money.

      [Chorus - whole group]
      He is not going to call. He was never going to call.
      I am not turning up at ten in a good coat again.
      There is a whole day in it that I have never had free
      and I know exactly who I am going to spend it with.

      [Outro - cold stop on the out-of-tune note]
