    exclude: guitars, synth pads, electronic drums, saxophone and smoky late-club arrangement, orchestral strings, belted vocals, vocal tuning, rapped sections, dance-pop production
    lyrics: |
      [Intro - 4 seconds, plucked electronic strings, no vocal]

      [Verse 1]
      Somebody has to be the one who brings it up,
      who says the number out loud in a port hall full of coats
      while everybody else looks at the middle of the table
      and works out how to be somewhere else by the second sentence.

      [Chorus]
      So let it be somebody else this time. Let it be anybody else.
      I have done it three seasons running and I am tired of the face
      people make at the person who mentions what is owed.
      It is a good face. I have made it myself, at somebody braver.

      [Verse 2]
      There is a way this quarter of the core has of admiring the ones
      who ask — afterwards, in the corridor, quietly, out of the way,
      and never once in the room while the asking is going on,
      and I have had a great deal of that particular admiration.

      [Chorus]
      So let it be somebody else this time. Let it be anybody else.
      I have done it three seasons running and I am tired of the face
      people make at the person who mentions what is owed.
      It is a good face. I have made it myself, at somebody braver.

      [Bridge]
      They put a name to my part on the sleeve that was not mine.
      Nobody in that office thought I would say anything about it.

      [Verse 3]
      And you stood up. In the room. With the coats on the chairs.
      You said one sentence and you got it slightly wrong
      and it was the best thing anybody has done for me all year
      and I have not found a way to tell you that since Tuesday.

      [Chorus - whole group]
      So let it be somebody else this time. Let it be anybody else —
      you already did, and it was you, and you did not have to.
      I have got the face I make at somebody braver.
      I have been making it at you across a table all week.

      [Outro - fade on the plucked figure]
