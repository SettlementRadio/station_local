  - id: s_0103
    title: The Founder Won't Call
    track_number: 6
    mood: [angry, restrained, midtempo]
    fact: >-
      Calo Meret plays the office piano beneath a lyric drafted after the label founder missed three
      scheduled account meetings.
    arrangement_note: the piano is the label's own office upright, out of tune in two places, and neither note is avoided anywhere in the song
    intro: 7
    outro: cold
    target_duration: "3:40"
    prompt: >-
      Compact close soft rock, 96 BPM, angry and restrained, midtempo — anger kept entirely out of
      the volume. Female lead vocal, low and warm, close to the microphone, understated and
      conversational, letting phrases fall away rather than holding them, never raised. Three-part
      close harmony stacked behind the lead on the choruses, never shouted. A guest upright office
      piano that is out of tune on two notes, with neither note avoided anywhere in the song, upright
      bass, brushed drum kit, harpsichord-toned keyboard played by hand, light hand percussion. Dry
