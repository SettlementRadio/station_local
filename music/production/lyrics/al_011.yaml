  - id: s_0100
    title: Your Usual Corner
    track_number: 3
    mood: [nostalgic, affectionate, steady]
    fact: >-
      Sel Ardin arranged the chorus for the four singers who still met at the band's first club table
      in 2612.
    arrangement_note: the chorus is arranged for exactly four voices and no more, because four people still sit at that table, and one of the four is a step behind the others every time
    intro: 12
    outro: sustain
    target_duration: "4:15"
    prompt: >-
      Compact close soft rock, 84 BPM, nostalgic and affectionate, steady. Female lead vocal, low
      and warm, close to the microphone, understated and conversational, letting phrases fall away
      rather than holding them. A chorus arranged for exactly four voices in close harmony and no
      more, with one of the four entering a step behind the others every time, never shouted.
      Upright piano, upright bass, brushed drum kit, harpsichord-toned keyboard played by hand,
      light hand percussion. Dry and small, gentle tape warmth, no large reverb. Twelve seconds of
      piano and brushed kit before the first sung word. Ends on a sustained chord.
    exclude: guitars, synth pads, electronic drums, saxophone and smoky late-club arrangement, orchestral strings, belted vocals, vocal tuning, rapped sections, dance-pop production
    lyrics: |
      [Intro - 12 seconds, upright piano with brushed kit, keyboard at eight seconds, no vocal]

      [Verse 1]
      Four of us took that corner the first winter we were here
      because it was the coldest table and nobody wanted it,
      under a scrubber vent that has never once been quiet.
      We have had it every Thursday since, without arranging it,
      through two changes of management, one new floor,
      and every Clearing Day this quarter has had in between.

      [Chorus]
      Your usual corner. Same four chairs, same draught.
      Nobody books it and nobody has ever had to.
      There are people in this room who were not born
      when the four of us started sitting in that corner on a Thursday.

      [Verse 2]
      One of us has stopped drinking and one of us has stopped talking
      about the thing everybody at that table knows about,
      and one of us comes in late every week from a shift
      and one of us is always there first, which is me.

      [Chorus]
      Your usual corner. Same four chairs, same draught.
      Nobody books it and nobody has ever had to.
      There are people in this room who were not born
      when the four of us started sitting in that corner on a Thursday.

      [Bridge]
      Nothing about that table has ever been said out loud.
      Twenty-nine years of the four of us not saying it.

      [Verse 3]
      You were late tonight and I watched the door for an hour
      like a fool, with nothing else in my week,
      and when you came in you looked at the corner first
      and then at me, and you have never done that before.

      [Chorus - four voices, one a step behind]
      Your usual corner. Same four chairs, same draught.
      Nobody books it and nobody has ever had to.
      Sit where you always sit. I am not going anywhere.
      I have got the whole of a Thursday and no other plans at all.

      [Outro - sustain, piano holding under the four voices]
