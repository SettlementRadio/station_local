  - id: s_0101
    title: One Honest Minute
    track_number: 4
    mood: [direct, spare, slow]
    fact: >-
      The group removed every backing voice until the final line, where Sel Ardin adds a single unison
      answer.
    arrangement_note: no backing voice anywhere in the song until the very last line, where one unison answer arrives and the song stops
    intro: 16
    outro: sustain
    target_duration: "4:30"
    prompt: >-
      Compact close soft rock, 76 BPM, direct and spare, slow. Female lead vocal, low and warm,
      close to the microphone, understated and conversational, letting phrases fall away rather than
      holding them. No backing voice anywhere in the song until the very last line, where a single
      unison answer arrives and the song ends. Upright piano, upright bass, brushed drum kit played
      very lightly, harpsichord-toned keyboard played by hand, light hand percussion. Dry and small,
      gentle tape warmth, no large reverb. Four verses, a one-line refrain after each that expands
      to two lines at the end, no chorus anywhere. Sixteen seconds of piano alone before the first
      sung word. Ends on a sustained chord.
    exclude: guitars, synth pads, electronic drums, saxophone and smoky late-club arrangement, orchestral strings, belted vocals, vocal tuning, rapped sections, dance-pop production
    lyrics: |
      [Intro - 16 seconds, upright piano alone, bass entering at twelve seconds, no vocal]

      [Verse 1]
      Give me one honest minute and I will give you the year.
      Not the version for the table. Not the one for the room.
      The one you would give somebody you were never going to see again
      on a bench, in the cold, at the transfer hall, at the end of a bad week,
      with the last ferry gone and nothing to be polite for.

      [Refrain]
      Sixty seconds. Then we can go back to being kind.

      [Verse 2]
      I have had nine years of being handled beautifully.
      Everybody in this quarter of the core is good at it.
      We are a settlement of people saying the near thing kindly.
      Nobody has said a true thing to me since the spring
      and I have not said one either and I started it.

      [Refrain]
      Sixty seconds. Then we can go back to being kind.

      [Verse 3]
      So here is mine, and it is not going to sound well.
      I have been coming to this room four nights a week for you.
      Not for the work, not for the money, which is not arriving,
      not for the four chairs in the corner, much as I love them,
      and not for the walk back afterwards, which I also love.
      For you. Since about the second winter. That is the minute.

      [Refrain]
      Sixty seconds. Then we can go back to being kind.

      [Verse 4]
      That is the whole of it and the minute is nearly up
      and I have spent about nine years getting to the end of it
      and you have not said anything and the piano has stopped
      and there is a woman at the counter pretending to count something
      and I would like it noted that I have never done this before.

      [Refrain - one unison answer on the last line]
      Sixty seconds. Then we can go back to being kind.
      Do not be kind. Say it badly. Say anything.

      [Outro - sustain, one held chord and nothing else]
