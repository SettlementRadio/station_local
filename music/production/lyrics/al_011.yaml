  - id: s_0098
    title: Catalogue of Small Debts
    track_number: 1
    mood: [wry, controlled, midtempo]
    fact: >-
      Mela Jorn sings from the band's unpaid-invoice list but replaces every amount with the favor it
      was meant to purchase.
    arrangement_note: the list in the second and third verses is sung on one repeated note, with the piano moving underneath it and the voice not moving at all
    intro: 8
    outro: fade
    target_duration: "3:50"
    prompt: >-
      Compact close soft rock, 92 BPM, wry and controlled, midtempo. Female lead vocal, low and
      warm, close to the microphone, understated and conversational, letting phrases fall away
      rather than holding them, and singing the listed lines of the second and third verses on one
      repeated note while the piano moves underneath. Three-part close harmony stacked behind the
      lead on every chorus, the whole group on the last one, never shouted. Upright piano, upright
      bass, brushed drum kit, harpsichord-toned keyboard played by hand, light hand percussion. Dry
      and small, gentle tape warmth, no large reverb. Eight seconds of piano and bass before the
      first sung word. Fade.
    exclude: guitars, synth pads, electronic drums, saxophone and smoky late-club arrangement, orchestral strings, belted vocals, vocal tuning, rapped sections, dance-pop production
    lyrics: |
      [Intro - 8 seconds, upright piano with the bass entering at five seconds, no vocal]

      [Verse 1]
      I have kept a list since the spring and I am not proud of it.
      Not amounts. I could not tell you what anything cost.
      What is on the list is what the money was for,
      which is a different page altogether and a longer one,
      and I have been over it in the dark more often than I would admit
      to anybody at all in a room with the lamps up.

      [Chorus]
      A catalogue of small debts, none of them worth naming,
      every one of them still open at the end of the year.
      Nobody in this quarter owes anybody anything much.
      Everybody in this quarter is owed one thing.

      [Verse 2 - listed, one repeated note]
      A coat, one night, in the rain, off somebody's own back.
      Nine minutes held at a transfer hall desk that was closing.
      A berth for a fortnight and no mention of the rent.
      Somebody standing in for a shift on the worst possible day.
      A cup of something at four in the morning, twice.
      One conversation nobody wanted to have and somebody had.

      [Chorus]
      A catalogue of small debts, none of them worth naming,
      every one of them still open at the end of the year.
      Nobody in this quarter owes anybody anything much.
      Everybody in this quarter is owed one thing.

      [Verse 3 - listed, one repeated note]
      And the other page, the short one, is the things I have not done.
      Two letters not written. One question not asked.
      A woman at a table for a whole season, waiting,
      while I was extremely busy being reasonable.

      [Chorus - whole group]
      A catalogue of small debts, none of them worth naming,
      every one of them still open at the end of the year.
      I am going to settle one of them tonight in person
      and it is the only one on either page that matters.

      [Outro - fade on the piano]
