  - id: s_0099
    title: Called in a Favor
    track_number: 2
    mood: [urgent, intimate, brisk]
    fact: >-
      Oren Saye played the accepted bass part without a fee after the label's payment desk closed
      during the session.
    arrangement_note: a guest upright bass takes the lead line's answers for the whole song, which is the part nobody was paid for, and it is mixed level with the voice
    intro: 5
    outro: cold
    target_duration: "3:25"
    prompt: >-
      Compact close sunshine pop and soft rock, 108 BPM, urgent and intimate, brisk. Female lead
      vocal, low and warm, close to the microphone, understated and conversational, letting phrases
      fall away rather than holding them. Three-part close harmony stacked behind the lead on every
      chorus, the whole group on the last one, never shouted. Upright piano, brushed drum kit,
      harpsichord-toned keyboard played by hand, light hand percussion, and a guest upright bass
      answering every lead line for the whole song, mixed level with the voice rather than
      underneath it. Dry and small, gentle tape warmth, no large reverb. Five seconds of upright
      bass alone before the first sung word. Cold stop.
    exclude: guitars, synth pads, electronic drums, saxophone and smoky late-club arrangement, orchestral strings, belted vocals, vocal tuning, rapped sections, dance-pop production
    lyrics: |
      [Intro - 5 seconds, upright bass alone, no vocal]

      [Verse 1]
      There is a right way to ask and I have never learned it.
      You want to sound like it is nothing, and it is not nothing,
      and the person you are asking can hear the difference
      in the first four words, however carefully you pick them.

      [Pre-Chorus]
      So I did it badly, at the door, at half past one -

      [Chorus]
      I asked you for something and I am not sorry that I did.
      You came out in the cold on the strength of one bad sentence
      with your coat over your shirt and your keys in your hand.
      Whatever the going rate is for that, I cannot pay it.

      [Verse 2]
      The transfer hall desk had shut. It shuts at exactly the hour
      when the thing you need doing becomes impossible to do,
      and the last ferry had gone, and the road was down to one lamp.
      Everybody who could have signed it had gone home
      and I stood in a corridor working out who I could wake.

      [Pre-Chorus]
      And there were four names and I used the wrong one on purpose -

      [Chorus]
      I asked you for something and I am not sorry that I did.
      You came out in the cold on the strength of one bad sentence
      with your coat over your shirt and your keys in your hand.
      Whatever the going rate is for that, I cannot pay it.

      [Verse 3]
      You did not mention it in the morning, which was worse.
      You made the tea. You asked about the room booking.
      A person who does a thing like that and does not mention it
      has put a debt on me I intend to carry for good.

      [Chorus - whole group]
      I asked you for something and I am not sorry that I did.
      You came out in the cold on the strength of one bad sentence
      with your coat over your shirt and your keys in your hand.
      Ask me for something. Anything. At any hour. Please.

      [Outro - cold stop, the bass cutting off with the voice]
