      close to the microphone, understated and conversational, letting phrases fall away rather than
      holding them, clipped rather than warm here. Three-part close harmony stacked behind the lead
      on every chorus, never shouted. Upright piano, upright bass, brushed drum kit, light hand
      percussion, and a guest synth-harpsichord — plucked electronic strings — playing one bright
