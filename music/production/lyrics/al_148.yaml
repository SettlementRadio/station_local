      everything on the second night a whole tone lower than he had on the first.
    arrangement_note: two upright basses, the band's own tuned a whole tone down, and the low register is doubled from the second verse onward
    intro: 7
    outro: cold
    target_duration: "4:15"
    prompt: >-
      50 BPM cold resigned Purist slow torch; low grainy female lead, no vibrato, two upright basses
      doubling the low register from the second verse with a dark heavy tone, upright piano taking a
      fourteen-second break, brushed kit with hand percussion, hard cold stop.
    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, fade ending, bright bass tone
    lyrics: |
      [Intro - two basses, seven seconds]

      [Verse 1]
      Somebody told him between the two nights.
      He did not tell the rest of us till after.
      He came in on the second night and tuned down
      and played the whole of it a whole tone under.
      Nobody asked him what he thought he was doing.
      You could hear it from the doorway. It was obvious.
      A man had had some news at about six
      and had decided where to put it.
      It went into the bottom of the instrument
      because there was nowhere else for it to go.

      [Verse 2]
      They keep the run. They are entitled to it.
      Two years of pressing owed is two years owed
      and a plant is not a friend and never said it was
      and everything in the building is security.
      So there are boxes with our name across the side
      in a building that we cannot get into,
      and the cargo doors are shut on the whole spring
      and nobody is doing anything wrong.

      [Instrumental - upright piano break over the low basses, fourteen seconds]

      [Verse 3]
      It is not the loss. I want to be precise.
      The loss is a thing that people can survive.
      It is that it is finished and still sitting there,
      complete, and boxed, and forty feet away.
      A record that is made and never issued
      is not a record. It is an argument.
      I would rather they had stopped us in the winter
      than let us do the whole of it and hold it.
      A thing you never finished is a story.
      A thing you finished is a room you cannot enter.

      [Refrain]
      The plant has ours. The plant is in the right.
      The plant is a shed with a lock and a fair claim.
      Somebody down there dusts the top box weekly
      and does not know a single word of it.
      I hope he likes his job. I mean that plainly.
      He is the last person who will stand near it.

      [Outro - cold stop]
