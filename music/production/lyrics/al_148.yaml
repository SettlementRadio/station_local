  - id: s_1199
    title: The Plant Keeps Ours
    track_number: 5
    mood: [cold, resigned, slow]
    fact: >-
      Toben Alt heard between the two nights that the plant intended to hold the run, and plays
      everything on the second night a whole tone lower than he had on the first.
    arrangement_note: two upright basses, the band's own tuned a whole tone down, and the low register is doubled from the second verse onward
    intro: 7
    outro: cold
    target_duration: "4:15"
    prompt: >-
      50 BPM cold resigned Purist slow torch; low grainy female lead, no vibrato, two upright basses
      doubling the low register from the second verse with a dark heavy tone, upright piano taking a
      fourteen-second break, brushed kit with hand percussion, hard cold stop.
    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, fade ending, bright bass tone
    lyrics: |
      [Intro - two basses, seven seconds]

      [Verse 1]
      The message reached us shortly after six:
      the lower cargo doors were sealed till payment.
      He read it twice beside the station heater,
      folded it, and put it in his coat.
      We had worked the spring with both doors open,
      watched the cases stack up row by row.
      We could cross the lane and see them through the wire,
      close enough to count and not to hold.
      He said, "Come back tomorrow. They may settle."
      His voice had found a darker place to stand.

      [Verse 2]
      We went down after last ferry and waited.
      Frost drew a border on the outer fence.
      Our names were black along the nearest cases.
      A night guard lifted one hand through the glass.
      He knew us. That was worse than being strangers.
      He pointed to the notice by the gate.
      Debt has tidy letters, dates, and margins.
      Labour has two hands against the wire.

      [Refrain]
      They keep what is ours behind the cargo doors.
      Finished, counted, dry beneath the light.
      Near enough to touch if wire were water,
      far enough to keep us there all night.

      [Instrumental - upright piano break over the low basses, fourteen seconds]

      [Verse 3]
      By morning, freight was moving on the high lane.
      Other people's cases cleared the berth.
      The guard brought coffee out and would not charge us.
      None of us could make the kindness work.
      He has a wage, a child, a room above us.
      He did not build the lock or make the claim.
      Still, when he walked between our stacked-up winter,
      every step of his went through my name.
      I can bear an ending I can carry.
      I can bear a thing unfinished, gone.
      What I cannot lift is work completed,
      waiting in the light and moving on.

      [Final Refrain]
      They keep what is ours behind the cargo doors.
      Finished, counted, dry beneath the light.
      Near enough to touch if wire were water,
      far enough to keep us there all night.

      [Outro - cold stop]
