  - id: s_1200
    title: Close the House
    track_number: 6
    mood: [final, aching, hushed]
    fact: >-
      Maro Deyn plays the closing figure alone, and he has not played in public since 2612.
    arrangement_note: voice and piano only, with no bass and no drums anywhere on the track, and the last forty seconds are the piano alone after the voice has finished
    intro: 20
    outro: sustain
    target_duration: "3:40"
    prompt: >-
      46 BPM hushed aching closing Purist torch; low grainy female lead and one upright piano and
      nothing else at all, no vibrato, the piano alone for the last section after the voice has
      stopped, tracked live in a small club room, tape warmth, sustained ending.
    exclude: bass, drums, percussion, keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano alone, twenty seconds]

      [Verse 1]
      Close the house. There is no other sentence.
      Close it properly and turn the key yourself.
      Do not let it go on being nearly open
      for another year, for anybody's sake.
      We have watched you warm the empty tables,
      set six cups and pour out only two.
      You keep the lane light burning through the daylight
      as if a tired bulb could summon anyone.
      No season fixes every broken doorway.
      The last ferry goes at midnight either way.

      [Refrain]
      Close the house. Let it be a thing you did
      and not a thing that happened while you watched.
      There is a difference and it is the whole difference,
      and it is yours to take, and only yours.

      [Verse 2]
      Think of every storm coat in the entrance,
      every wet boot drying by the wall,
      every child asleep across two chairs
      while their people waited for the weather call.
      You gave the settlement a room past midnight,
      a door that opened when the core went dark.
      Closing cannot reach back through those evenings.
      Loss does not erase the thing it marks.

      [Verse 3]
      Take the notices down before tomorrow.
      Pay the final shift and sweep the stair.
      Give the woman from the coast her blue cup.
      Leave the broken clock exactly where it is.
      Then come away before the lane turns morning.
      Do not stay to hear the building cool.
      A room without its people is just timber.
      You are not the room. You get to leave.
      Close the house, then come and sit down here.
      There is a chair by the piano. There always was.

      [Final Refrain]
      Close the house. Let it be a thing you did
      and not a thing that happened while you watched.
      There is a difference and it is the whole difference,
      and it is yours to take, and only yours.

      [Outro - piano alone, forty seconds, sustaining]
