    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, fade ending
    lyrics: |
      [Intro - piano and bass, nine seconds]

      [Verse 1]
      Before he held the key, we knew the bad stair,
      the third one from the landing, split and loud.
      We knew which window leaked in storm season,
      which chair could take the weight and which gave out.
      The woman from the lane brought up her own cup.
      The freight boys left their wet coats by the heat.
      Nobody called ahead or asked permission.
      The room was open. That was what it meant.

      [Chorus]
      The founder's room, and we are in it, playing.
      The founder's room, and the founder's at the back.
      Rain at the window, boots along the landing,
      one bad light above the narrow bar.
      He has the key. The room has everybody.
      Nobody says which one of those will last.

      [Verse 2]
      He sits where he can see the whole door opening.
      He knows the regulars by coat and cough.
      He knows who missed the last ferry from the settlement,
      who needs another hour before the walk.
      Some nights he laughs before the joke is over.
      Some nights he counts the bottles on the shelf.
      When someone says, "Your room," he looks behind him
      as if the room might answer for itself.

      [Turn]
      Maybe buying shelter makes you frightened.
      Maybe every key comes with a doubt.
      Maybe he can hear us fill the silence
      and knows a lock can only keep things out.

      [Verse 3]
      At closing, everyone lifts something with them:
      a tune, a quarrel, someone else's news.
      The room goes home in twenty different bodies
      and comes back when the lane lights turn to blue.
      He checks the window, tests the lower landing,
      waits until the final footsteps cease.
      Then he stands alone inside his purchase
      with all that borrowed warmth and borrowed peace.

      [Final Chorus]
      The founder's room, and we are in it, playing.
      The founder's room, and the founder's at the back.
      Rain at the window, boots along the landing,
      one bad light above the narrow bar.
      He has the key. The room has everybody.
      Nobody says which one of those will last.

      [Outro - cold stop]
