    prompt: >-
      72 BPM wry cold midtempo Purist slow blues torch; low grainy female lead well forward, no
      vibrato, upright piano staying behind the voice throughout and never answering it, upright
      bass, brushed kit with light hand percussion, hard cold stop.
    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, fade ending
    lyrics: |
      [Intro - piano and bass, nine seconds]

      [Verse 1]
      He bought the room. That is a matter of record.
      He borrowed on the shelf to do it with.
      Nobody asked him to and nobody stopped him
      and it was two years back and it is done.
      We play in it. We have always played in it.
      It was a room before it was an asset.
      The stair is the same stair off the same lane.
      The window still does not shut in storm season.

      [Chorus]
      The founder's room, and we are in it, playing.
      The founder's room, and the founder's at the back.
      Whatever a room is for, it is not for owning.
      Somebody had better tell him. Nobody will.

      [Verse 2]
      I put it on the paper as the title
      and I did it partly to see what he would say.
      He read it, and he looked at me a moment,
      and he did not say a word and signed it off.
      The others took that to mean it was over.
      I am not certain that is what it meant.
      A man can let a thing go past him quietly
      and still be carrying the whole of it at home.

      [Verse 3]
      There is nothing cruel in it. I want that clear.
      He is the reason any of this was pressed.
      Twenty-three years of one house and one form
      and no other house in the settlement would touch it.
      But he has put the room in with the paper
      and the room has people in it every week,
      and when the paper goes, as paper does,
      they will come for it, and it will have our name.

      [Chorus]
      The founder's room, and we are in it, playing.
      The founder's room, and the founder's at the back.
      Whatever a room is for, it is not for owning.
      Somebody had better tell him. Nobody will.

      [Outro - cold stop]
