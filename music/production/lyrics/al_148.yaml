#
# The band's second record, made eighteen years after the first, and the last thing Lower Bell
# Editions ever pressed. **Juna Carrow sings all six**, seven years into the chair, and the card's
# voice line covers both singers because both are the same low grainy contralto — which is the whole
# reason M-20 could write one voice line for a band with two leads.
#
# It was cut in the room the founder had bought in 2610 with a loan against the catalogue, which is
# what the title is about and what the band rather than the founder chose to call it. The plant held
# the run within a month, so the record went from being made to being disputed without ever being
# sold.
#
# **Two things depart from the card and both are the wiki's.** `s_1199` has a second upright bass on
# it — Oren Saye alongside Toben Alt — which is the only track in the band's life with two, and Alt
# plays the second night a whole tone below the first. And `s_1200` is credited to two people: one
# voice and one piano, with no bass and no drums anywhere on it, and the closing figure is the last
# thing Maro Deyn has played in public.
#
