  - id: s_1198
    title: Nothing Since the Festival
    track_number: 4
    mood: [wistful, spare, patient]
    fact: >-
      Odell Prine plays the brush pattern off the band's first record note for note, which is the
      only thing the four of them agreed on before they started.
    arrangement_note: the brush pattern is the one from the band's first record, unchanged, and it is the only continuous thing on the track
    intro: 16
    outro: fade
    target_duration: "3:55"
    prompt: >-
      52 BPM wistful patient Purist torch; low grainy female lead behind the piano, no vibrato, a
      single unchanging brush pattern running the whole length of the track, upright piano, upright
      bass, light hand percussion, fade.
    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending, drum fills
    lyrics: |
      [Intro - brushes alone, then piano, sixteen seconds]

      [Verse 1]
      Eighteen years between one record and the other
      and the only thing agreed before we started
      was the pattern the man behind the kit would play,
      which is the pattern off the first one, note for note.
      He did not offer it. He simply did it.
      By the second bar the rest of us had stopped
      and then we all came in and did not mention it
      and that is how a band decides a thing.
      Nobody voted. Nobody was asked.
      A pattern started and the room agreed.

      [Verse 2]
      Nothing has come out of here since the festival.
      That is not idleness. That is a queue.
      He would not put his own band up the order
      in front of anybody he had signed,
      and there was always somebody he had signed,
      until this spring, when suddenly there was not.
      The last ferry brought nobody down this season.
      The relay brought no crate up to the door.
      So here we are, at the front, because the queue behind us
      has walked off down the lane and gone.

      [Chorus]
      Nothing out of here since the festival, and now this.
      Eighteen years, and a fortnight, and a room.
      Everything we did not do is on it
      and none of it is anything to hear.

      [Verse 3]
      A gap is not a silence. We were playing.
      Three nights a week for eighteen years, in here.
      Nobody wrote it down and nobody pressed it
      and about four thousand people heard it happen.
      They came up off the water and they sat there
      and went back out and did not write it down.
      If the shelf goes and the masters go with it
      that is still four thousand evenings in the world.
      He has the brush pattern. I have the rest of it.
      Between the two of us it is all still here.
      Neither one of us is giving it back.

      [Outro - brushes last, fading]
