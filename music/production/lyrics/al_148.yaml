    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, fade ending
    lyrics: |
      [Intro - bass alone, six seconds]

      [Verse 1]
      They showed us the paper in a back office
      while a hauler shook the glasses on the shelf.
      Four minutes, with the lane light through the shutters
      cutting every person there in half.
      He kept both hands around a cup of water.
      He would not meet the woman at his right.
      I watched the freight crew couple up the cargo.
      I watched one worker signal with a glove.
      Anything was easier than reading
      how cheaply someone else had priced our trust.

      [Verse 2 - flat, strict time, bass only]
      The lease on the room. The plant account in credit.
      The masters. The unsold. The two spare presses.
      The cases. The name. The catalogue entire.
      The rights in everything the house has issued.
      Eleven lines. A number at the bottom.
      Eleven doors with somebody else's keys.
      My breath among the goods that could be taken.
      His quiet hand beside the place to sign.

      [Chorus]
      Borrowed against us, borrowed in our absence,
      borrowed with our coats hung by the door.
      He wanted one warm room against the winter.
      He put every other room beneath the floor.

      [Instrumental - upright piano break, thirteen seconds]

      [Verse 3]
      He said he saw a winter without shelter,
      one shut door, and people in the cold.
      He said the figure looked like something manageable.
      He said he thought the lender wanted walls.
      I wanted anger. Anger has a handle.
      You grip it and you know which way to pull.
      But he sat there looking old beneath the lane light,
      sorry in a way that changed no line.
      Outside, the hauler cleared the lower turning.
      Every coupled case went out of sight.
      We stayed until the office heater clicked off,
      four people and a debt that knew our names.

      [Final Chorus]
      Borrowed against us, borrowed in our absence,
      borrowed with our coats hung by the door.
      He wanted one warm room against the winter.
      He put every other room beneath the floor.

      [Outro - cold stop]
