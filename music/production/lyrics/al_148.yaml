    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending, drum fills
    lyrics: |
      [Intro - brushes alone, then piano, sixteen seconds]

      [Verse 1]
      At the burn festival she wore my old coat,
      though the night was warm and both sleeves dragged.
      She laughed when sparks went up beyond the floodwall.
      She danced until the final lantern sagged.
      By dawn her cup was cold beside the doorway.
      Her berth was empty on the morning ferry.
      She left the coat, one glove, and no explanation.
      I told myself the relay would be late.
      All day the cleaning crews swept ash from corners.
      All day I heard the same soft circle turn.

      [Refrain]
      Since the fireline folded into daylight,
      every clock in here has kept one hour.
      The lane fills up, the last ferry keeps leaving,
      but this room still smells of rain and flowers.

      [Verse 2]
      Years learned all the ordinary motions:
      filters changed and freight moved through the berth,
      neighbours raised their children on the next floor,
      someone painted over her small mark.
      I took the night work, slept through every morning,
      missed three winters on the stormward lane.
      People asked, then learned to stop their asking.
      I learned how silence answers just the same.

      [Bridge]
      The brushes keep one circle without hurrying.
      They do not heal. They do not fall behind.
      Some things survive by making no decision,
      keeping perfect time while years divide.

      [Verse 3]
      Last week the relay carried three plain words:
      "I am coming." Nothing after that.
      I cleaned the cup and put it by the doorway.
      I found the coat still folded at the back.
      Tonight the burn field glows beyond the floodwall.
      Another year is gathering for flame.
      If she steps down when the morning ferry settles,
      I will not ask her where she learned to stay.
      I only know the hour has started moving.
      I only know the room has changed its air.

      [Final Refrain]
      Since the fireline folded into daylight,
      every clock in here has kept one hour.
      The lane fills up, the last ferry keeps leaving.
      Now one light is moving through the flowers.

      [Outro - brushes last, fading]
