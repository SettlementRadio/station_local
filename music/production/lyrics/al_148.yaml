  - id: s_1196
    title: Bela's Key
    track_number: 2
    mood: [tender, warm, slow]
    fact: >-
      Juna Carrow sings it in Bela Runn's key instead of her own and has never sung it in any other,
      including on the coast.
    arrangement_note: the whole song sits low in the singer's range and slightly under where she is comfortable, which is the point and must not be corrected
    intro: 13
    outro: sustain
    target_duration: "3:45"
    prompt: >-
      48 BPM tender Purist torch ballad; low grainy female lead pitched at the bottom of her range
      and slightly below comfort, no vibrato, upright piano, upright bass, brushed kit with light
      hand percussion, sustained ending.
    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending, transposing the vocal upward
    lyrics: |
      [Intro - piano, thirteen seconds]

      [Verse 1]
      She sang this one for twenty-six years running
      and I came in and sang it the next spring.
      They told me from the start to take it upward,
      to put it where my own voice wants to go.
      I tried it twice in front of nobody
      and both times it was better and it was wrong.
      So it stays where she had it, underneath me,
      and I go down to meet it every time.

      [Verse 2]
      There is a place a fourth below your comfort
      where the tone goes grainy and the breath runs out,
      and a lot of people call that a mistake
      and a few of us have built a life in it.
      That is where she lived. That is where the song lives.
      I do not sound like her. I never did.
      But the shape of what she did is in the corners
      and I am not the one who takes it out.

      [Refrain]
      Leave it where she had it. Leave it low.
      A key is not a preference. It is a room.
      Move it up and everything gets easier
      and the thing you moved it for is not there.

      [Verse 3]
      She left over an account she asked to see twice
      and she has not been in this quarter since.
      I do not know her. We have never spoken.
      The last ferry she took, she took alone.
      Somewhere out past the relay she is living
      and does not think about a Tuesday in the core.
      I will sing this in her key on the storm coast
      and in every hall I get to after that.

      [Refrain]
      Leave it where she had it. Leave it low.
      A key is not a preference. It is a room.
      Move it up and everything gets easier
      and the thing you moved it for is not there.

      [Outro - piano sustaining]
