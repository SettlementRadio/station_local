    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, fade ending
    lyrics: |
      [Intro - bass alone, six seconds]

      [Verse 1]
      They showed us the paper in a back office
      and gave us about four minutes with the thing.
      There was a hauler idling in the lane outside
      and I watched it the whole time and not the page.
      Nobody in the band can read that language.
      One of us could count, and that was enough.
      It is a list. That is all a paper is.
      Somebody writes down everything you have
      and puts a figure at the bottom of the column
      and the figure is smaller than the list.
      It is always smaller. That is what a figure is.

      [Verse 2]
      The lease on the room. The plant account in credit.
      The masters. The unsold. The two spare presses.
      The cases. The name. The catalogue entire.
      The rights in everything the house has issued.
      Eleven lines and every one of them is us.
      The eleventh line is the one that has my voice on.
      I am on a piece of paper as security
      and the man who wrote me down was in the room.

      [Instrumental - upright piano break, thirteen seconds]

      [Verse 3]
      I do not think he understood the list.
      I think he saw a number and a room he wanted
      and signed a thing a lawyer put in front of him
      and went back down the stair and opened up.
      That is not a defence. It is worse than one.
      A man who understood it could be argued with.
      There is nobody to shout at in this building.
      There is only what the paper says there is.
      I have shouted at a man across a table.
      It is a good deal better than this is.

      [Refrain]
      Borrowed against the room and the recordings,
      borrowed against the whole of what we made.
      Somewhere on that column I am a figure
      and the freight crew at the bar are worth more.
      Borrowed against a Tuesday and a stairwell.
      Borrowed against the thing that cannot move.

      [Outro - cold stop]
