      including on the coast.
    arrangement_note: the whole song sits low in the singer's range and slightly under where she is comfortable, which is the point and must not be corrected
    intro: 13
    outro: sustain
    target_duration: "3:45"
    prompt: >-
      48 BPM tender Purist torch ballad; low grainy female lead pitched at the bottom of her range
      and slightly below comfort, no vibrato, upright piano, upright bass, brushed kit with light
      hand percussion, sustained ending.
    exclude: keyboards, synthesizers, plucked electronic strings, backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, added reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending, transposing the vocal upward
    lyrics: |
      [Intro - piano, thirteen seconds]

      [Verse 1]
      Her chair was gone before they gave me mine.
      A pale ring on the floor showed where it stood.
      They said the lower notes would fight my breathing,
      said I could lift the song and make it good.
      I tried it in the room before the doors unlocked.
      The easy key came clean and meant no harm.
      Still, every line arrived without its shadow,
      every open word had lost its weight.
      So I went down until the grain came through me,
      down where another woman left the air.

      [Verse 2]
      There is a floor below the floor you stand on,
      reached by giving up your easy breath.
      Nothing shines there. Nothing asks for polish.
      You hold the note or feel it leave your chest.
      She knew that room. I only know its doorway.
      I do not wear her voice or know her face.
      But when the storm coast dims beyond the windows,
      the lowest line still keeps an empty place.

      [Refrain]
      Leave it where she had it. Leave it low.
      A key is not a preference. It is a room.
      Move it up and everything gets easier
      and the thing you moved it for is not there.

      [Bridge]
      The relay sometimes carries half a story:
      she crossed the core, she found a warmer berth.
      I let the rumours pass without an answer.
      Absence does not tell you what it is worth.

      [Verse 3]
      Once, after the last ferry, I stayed behind
      and sang it to the chairs without the lights.
      The low note broke. I heard my own voice enter,
      rough and small and finally mine that night.
      It did not chase her shadow from the corner.
      It did not need to. Both of us could stay.
      One voice can leave a shape another carries
      without becoming what has gone away.
      Tomorrow I will meet it at the bottom,
      not as a debt and not to prove I know.

      [Final Refrain]
      Leave it where she had it. Leave it low.
      A key is not a preference. It is a room.
      Move it up and everything gets easier
      and the thing you moved it for is not there.

      [Outro - piano sustaining]
