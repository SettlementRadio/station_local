  - id: s_1218
    title: Not the Core's Music
    track_number: 5
    mood: [defiant, blunt, midtempo]
    fact: >-
      The band will not use the core's word for what it plays, and this is the song the sleeve prints
      their objection next to.
    arrangement_note: the most direct thing on the record — the voice sits forward and the held keyboard tone drops out entirely under every chorus
    intro: 5
    outro: cold
    target_duration: "3:55"
    prompt: >-
      70 BPM blunt defiant midtempo slow torch in a large cold seafront hall; high light male tenor
      well forward and unforced, plucked electronic strings taking a thirteen-second break, the held
      keyboard tone dropping out entirely under each chorus, upright bass, brushed kit, hard cold stop.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, fade ending
    lyrics: |
      [Intro - bass and plucked strings, five seconds]

      [Verse 1]
      A visitor from the core asked what to call it.
      Rain ran from his coat across the floor.
      I said the last hour already had a language
      long before his question reached the shore.
      He offered me the word they use for filing.
      I let it sit untouched between our drinks.
      A useful name can still belong elsewhere.
      A fitted coat can still be someone else's.

      [Chorus]
      Not their music. Not their room. Not their hour.
      Ours, and made here out of what was here.
      Call it what you need to keep your map in order.
      I will not carry that word in my mouth.

      [Verse 2]
      My mother's brother played the end of nights
      where Bight Row met the old transfer hall.
      He carried brushes wrapped inside his work shirt,
      played when freight crews had spent all their noise.
      No one asked him what the hour was called.
      They knew which door was warm and walked inside.
      I have those brushes, worn down near the handle.
      His hand is gone. The reason has survived.

      [Instrumental - plucked electronic strings break, thirteen seconds]

      [Bridge]
      Names come down the relay packed like cargo,
      clean and dry and useful at the core.
      Some arrive and settle into living.
      Some stay in their cases by the door.

      [Verse 3]
      The visitor stayed on through sealed-season midnight.
      He watched the dancers leave along the lane.
      He watched the night crews fill the empty benches,
      salt and tired laughter in their clothes.
      Near the end, he stopped preparing questions.
      He held one worn brush lightly in his hand.
      I did not ask him whether he had learned it.
      I did not need agreement from that man.
      When he left, the borrowed word went with him.
      The last hour kept the name it never had.

      [Final Chorus]
      Not their music. Not their room. Not their hour.
      Ours, and made here out of what was here.
      Call it what you need to keep your map in order.
      I will not carry that word in my mouth.

      [Outro - cold stop]
