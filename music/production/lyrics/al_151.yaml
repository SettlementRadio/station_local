  room: >-
    Six large cold seafront halls at the end of six dance nights, doors shut behind the last of the
    room, the sea wall audible through the wall on two of them. The card holds throughout: high light
    male tenor, quiet and unforced and almost breathy at the top, holding long notes without vibrato
    and letting them fade rather than stopping them; synth-harpsichord where a piano would be, taking
    every instrumental break; compact electric keyboards holding one long tone under everything;
    upright bass; brushed kit. **No piano and no guitar anywhere on this record.** Two tracks are
    their own. `s_1215` opens on nine separate bass notes, one for each lamp on the sea wall, before
    anything else happens. And the instrument on `s_1217` is tuned half a tone flat all the way
    through, because the sea wall was, and that is left in rather than corrected.

