      tone flat, one long held keyboard tone, upright bass, brushed kit, fade.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, pitch correction, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - plucked strings and held tone, nine seconds]

      [Verse 1]
      Cold follows everyone in from the sea wall.
      It shines on coats and settles into shoes.
      The first few minutes, nobody stops shaking.
      Then the room takes on the heat we lose.
      Breath lifts softly past the loading doorway.
      Wet sleeves darken every wooden chair.
      We do not make the winter less than winter.
      We make one hour that people choose to share.

      [Refrain]
      This is the warm hour and it is not long.
      Between the cold outside and the cold after
      there is about an hour of a room
      that is the temperature of people. Stay in it.

      [Verse 2]
      Freight crews come with salt across their collars.
      Night staff come with daylight in their eyes.
      Two young lovers miss the harbour crossing,
      laugh as if they meant to miss it twice.
      Nobody asks which body made the shelter.
      Every shoulder adds a little more.
      Even the storm coast gives its cold up slowly
      when enough wet people close one door.

      [Verse 3]
      Every Thursday, one woman takes the back wall.
      First to enter, last to cross the lane.
      She removes her gloves but keeps her coat on.
      I have never heard her give a name.
      Once, a stranger tried to take her corner.
      She looked up; he moved without a word.
      That small space is hers for sixty minutes.
      What she needs from it is not ours to learn.

      [Bridge]
      Every life has somewhere heat can find it:
      near an engine, under work lights, after dark.
      Do not ask a person why they need it.
      Hold the door and let them keep their hour.

      [Final Refrain]
      This is the warm hour and it is not long.
      Between the cold outside and the cold after
      there is about an hour of a room
      that is the temperature of people. Stay in it.

      [Outro - plucked strings, fading]
