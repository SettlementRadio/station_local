#
# Five years of playing the last hour of coast dance nights before anybody offered them a record, and
# the reason they got one is that the house had pressed one slow record that year and it had sold up
# the relay. Six nights at the end of six dance nights, in the halls the band was already booked
# into, with the doors shut behind the last of the room.
#
# **This is the genre's only male lead**, and the card is where that was decided (M-20, D-089):
# a high light tenor, quiet and unforced, no vibrato, long notes let go rather than stopped. There
# is no piano anywhere on either Nine Lamps record — the synth-harpsichord is where the piano would
# be, and it takes every break.
#
# **`s_1218` is the band refusing the core's word for what they play, and the lyric never says the
# word.** It is not in the song, it is not in the prompt, and the sleeve prints the objection beside
# the house's own filing, which is the first time a house had done that and is now the band's
# contract. The hazard board's four levels in `s_1214` are working, standing, sealed and bright
# hazard, in the order the board posts them — the top one is what the two people above the
# hazard-board office named themselves after (`music/wiki/pulse-dance.yaml`).
#
# `generation:` and every `take:` are empty until M-36.

