    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, fade ending
    lyrics: |
      [Intro - held keyboard tone and plucked strings, thirteen seconds]

      [Verse 1]
      There is a board at the end of Bight Row
      and a man who changes it at six and noon.
      It is the only thing out here that everybody reads
      and nobody has ever thanked him for.
      He does not decide it. He is told it and he posts it.
      People stand and look at it and go.
      Whatever is on that board decides the evening
      for about nine thousand people and four halls.

      [Verse 2]
      Working. Standing. Sealed. And bright hazard.
      That is the order and it does not change.
      Working is a shift and a wage and a crossing.
      Standing is a day you do not plan.
      Sealed is the long one and it is most of winter.
      And the top one is the one nobody works,
      and two people above the office took the name
      because it is the level everybody dances.

      [Chorus]
      When the board comes down we are still playing.
      When the board comes down the hall stays lit.
      Whatever it says, the last hour is the last hour.
      Nothing on that board has come for us.

      [Verse 3]
      I have played to eleven and to nine hundred
      and the board is why, and it is never me.
      A man in an office reads the carrier wave
      and I find out what my Thursday is at noon.
      That is not a complaint. That is the storm coast.
      Everybody here is on the same board.
      The difference between us and everybody else
      is that we are booked for after it, whatever it says.
      Nobody cancels the last hour. There is nothing in it
      that a bad sea can take away from anyone.

      [Chorus]
      When the board comes down we are still playing.
      When the board comes down the hall stays lit.
      Whatever it says, the last hour is the last hour.
      Nothing on that board has come for us.

      [Outro - cold stop]
