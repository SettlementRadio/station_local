    target_duration: "3:45"
    prompt: >-
      64 BPM tender warm midtempo slow torch in a large cold seafront hall; high light male tenor
      quiet and unforced with no vibrato, plucked electronic strings and the whole band tuned half a
      tone flat, one long held keyboard tone, upright bass, brushed kit, fade.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, pitch correction, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - plucked strings and held tone, nine seconds]

      [Verse 1]
      He tunes it to the wall before we start.
      Not to a fork, not to the bass, not to a meter.
      He stands at the loading door with it on a chair
      and he listens to eleven miles of stone.
      The wall hums. Everybody here knows that.
      Most people stopped hearing it at about six.
      He hears it every night and matches it
      and the whole band comes up to wherever he lands.

      [Refrain]
      This is the warm hour and it is not long.
      Between the cold outside and the cold after
      there is about an hour of a room
      that is the temperature of people. Stay in it.

      [Verse 2]
      That week the wall was down about half a tone,
      which happens when the water is a certain way,
      and so this record is half a tone below
      the place that anybody else would call correct.
      The house asked us. We said we would rather not.
      They said that it would sound flat up the relay
      and we said yes, because it is, and it was,
      and they pressed it, and they have not said it since.

      [Verse 3]
      There is a woman who comes every Thursday, always,
      and stands where the heat comes off the back wall,
      and I have never seen her speak to anybody
      and she is the first one in and the last out.
      I do not know her name and never will.
      She is what I am doing this for, roughly.
      Everybody has one hour that is warm
      and it is nobody's business which one.
      The whole storm coast has one, if you ask them,
      and not one of them will tell you what it is.

      [Refrain]
      This is the warm hour and it is not long.
      Between the cold outside and the cold after
      there is about an hour of a room
      that is the temperature of people. Stay in it.

      [Outro - plucked strings, fading]
