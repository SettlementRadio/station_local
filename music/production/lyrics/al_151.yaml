    prompt: >-
      44 BPM spare hushed slow torch in a large cold seafront hall; nine single upright bass notes
      with silence between them before anything else, then high light male tenor quiet and breathy
      with no vibrato, plucked electronic strings, one long held keyboard tone, brushed kit, fade.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - nine single bass notes, twenty-two seconds]

      [Verse 1]
      Nine of them along the top of the wall
      and they go on at four and off at nine.
      You can see them from the far side of the water
      and from about two miles out on a clear night.
      Six of them are original. Three are not.
      The three replacements are a different colour
      and everybody out here can tell you which
      and nobody has ever had them changed.

      [Verse 2]
      He plays them at the top of every evening,
      one note each, with a gap you could walk through,
      and by about the fourth one the room is quiet
      without anybody having asked it to be.
      That is a better opening than anything
      the four of us have ever worked out since.
      It was not an idea. He did it once, cold,
      because the hall had gone dark early and he waited.

      [Refrain]
      Nine along the wall and nine to count.
      Count them out and then begin the hour.
      The sea is doing what the sea has always done.
      The lamps are what we put against it. Nine.

      [Verse 3]
      One went out in the sealed season two years back
      and stayed out for eleven weeks in the dark
      and I have never seen this coast so bothered
      by a thing that no one needed and none used.
      They put it back in spring. The wall was whole.
      A man I do not know shook my hand about it,
      which had nothing to do with me at all,
      and I understood him and I shook his hand.
      Eleven weeks of eight is not the same.
      Anyone out here could tell you which was out.

      [Refrain]
      Nine along the wall and nine to count.
      Count them out and then begin the hour.
      The sea is doing what the sea has always done.
      The lamps are what we put against it. Nine.

      [Outro - the nine notes again, fading]
