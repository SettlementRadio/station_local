    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, resonant or bright drums, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - held tone and brushes, eleven seconds]

      [Verse 1]
      Salt gets on the glass and then inside it.
      Salt gets on the wire and in the case.
      It blooms along the bolts beside the airlock,
      leaves a pale line underneath a cup.
      Everything we own begins departing
      one small grain a night, too slow to watch.
      You wrote the date behind the window frame
      the week we took this room above the wall.
      Half the numbers vanished by next winter.
      We stayed long enough to lose them all.

      [Verse 2]
      Your red coat faded pink across the shoulders.
      My good knife opened orange at the seam.
      The relay socket failed each sealed season.
      We learned which words could wait till it was clean.
      Once you said, "Replace it when it falters."
      I asked which thing you meant and made you laugh.
      Outside, the sea worked patiently on iron.
      Inside, neither one of us asked back.

      [Refrain]
      Salt on the glass and salt along the wire.
      Nothing out here is going to keep.
      Play it while the thing you play it on is going.
      Everything is going. Play it now.

      [Verse 3]
      Now the cargo rail is red beneath my fingers.
      Your coat hangs clean in someone else's room.
      I could change the glass and strip the whole frame,
      seal each edge against another bloom.
      But I would rather see the weather working,
      know the cost of every year we had.
      Keeping is not love. I know that lately.
      Love was every ordinary thing we spent.
      Tonight the storm coast leans against the window.
      I leave one lamp on while the numbers fade.

      [Coda]
      Touch the glass. The whole sea moves behind it.
      Say it now. There may not be a later.

      [Final Refrain]
      Salt on the glass and salt along the wire.
      Nothing out here is going to keep.
      Play it while the thing you play it on is going.
      Everything is going. Play it now.

      [Outro - the hall's own sound, fading]
