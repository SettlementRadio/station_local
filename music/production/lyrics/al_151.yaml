    lyrics: |
      [Intro - held keyboard tone and plucked strings, thirteen seconds]

      [Verse 1]
      At six, the crowd stood quiet on Bight Row,
      rain running from their sleeves into the drain.
      A woman held one child beneath her coat.
      Her other hand kept calling through the relay.
      The man she wanted worked beyond the sea wall.
      The board would say if anyone came through.
      No one spoke while old levels were lifted.
      Every face looked upward for the new.
      Some had meals kept warm in distant kitchens.
      Some had beds already cold and empty.

      [Verse 2 - held keyboard tone only; one level per line]
      Working.
      Standing.
      Sealed.
      Bright hazard.

      [Chorus]
      When the board comes down we are still playing.
      When the board comes down the hall stays lit.
      Bring your unanswered call in from the weather.
      Set it by the door and come inside.

      [Verse 3]
      Bright hazard. Nobody crossed till morning.
      The woman closed her hand around the relay.
      She carried both her children to the warm hall,
      chose a bench beneath the loading light.
      Near midnight, one brief signal found her handset:
      safe behind the wall, no passage yet.
      She read it twice and passed it to the oldest.
      He nodded like a child who had learned not to.
      Her youngest slept with cheek against her shoulder.
      Outside, the carrier wave kept changing.
      Inside, every long note faded free.

      [Bridge]
      A board can tell you where the danger gathers.
      It cannot tell you how to spend the wait.
      It cannot warm a shoulder soaked by weather.
      It cannot make the sea wall open late.
      But one lit room can hold what has no answer
      till the storm coast gives another name.

      [Final Chorus]
      When the board comes down we are still playing.
      When the board comes down the hall stays lit.
      Bring your unanswered call in from the weather.
      Set it by the door and come inside.

      [Outro - cold stop]
