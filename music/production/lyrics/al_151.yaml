  - id: s_1219
    title: Salt on the Glass
    track_number: 6
    mood: [final, cold, spacious]
    fact: >-
      Corle Sten's brushes are on a drum head the salt had already ruined, which the band kept
      because it had stopped ringing and has not replaced since.
    arrangement_note: the ruined head does not ring at all and is the only drum sound on the track, which is why the hall is audible all the way through
    intro: 11
    outro: fade
    target_duration: "4:00"
    prompt: >-
      46 BPM cold spacious closing torch in a large cold seafront hall; high light male tenor quiet
      and breathy with long notes let go rather than stopped, brushes on a completely dead drum head
      with no ring at all, plucked electronic strings, one long held keyboard tone, upright bass, the
      hall audible throughout, fade.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, resonant or bright drums, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - held tone and brushes, eleven seconds]

      [Verse 1]
      Salt gets on the glass and then inside it.
      Salt gets on the wire and in the case.
      Everything out here is being taken
      about a grain a night, and nobody minds.
      You buy a thing and it begins to go
      and the going of it is the whole arrangement.
      That is not sad. That is the storm coast.
      Ask anybody who has lived here twenty years.

      [Verse 2]
      The head went first. It went in the second season.
      It stopped ringing altogether, which should be a fault,
      and he hit it once in a hall on a dead Tuesday
      and the four of us looked up at the same time.
      There is nothing under it. There is no tail.
      You hear the hall instead, the whole way through,
      and the hall is eleven miles of wall and weather
      and that is the sound the band has had since then.

      [Refrain]
      Salt on the glass and salt along the wire.
      Nothing out here is going to keep.
      Play it while the thing you play it on is going.
      Everything is going. Play it now.

      [Verse 3]
      He has been offered heads. He turns them down.
      A man came up from the core with one in autumn,
      a good one, free, because he liked the record,
      and got a drink and a long talk and no sale.
      When it goes, it goes. We are not replacing it.
      There is a version of this band that has a ring in it
      and it is a perfectly good band and it is not us,
      and the sea will have the rest of this by spring.

      [Refrain]
      Salt on the glass and salt along the wire.
      Nothing out here is going to keep.
      Play it while the thing you play it on is going.
      Everything is going. Play it now.

      [Coda]
      Salt on the glass, and the glass is nearly through.
      Play it now. There is not going to be a later.

      [Outro - the hall's own sound, fading]
