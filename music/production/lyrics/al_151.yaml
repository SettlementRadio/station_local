      band counts them in that order on stage as well.
    arrangement_note: nine separate bass notes with silence between them before anything else enters, and the same nine close the track
    intro: 22
    outro: fade
    target_duration: "3:50"
    prompt: >-
      44 BPM spare hushed slow torch in a large cold seafront hall; nine single upright bass notes
      with silence between them before anything else, then high light male tenor quiet and breathy
      with no vibrato, plucked electronic strings, one long held keyboard tone, brushed kit, fade.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - nine single bass notes, twenty-two seconds]

      [Verse 1]
      Nine lamps ran along the top of the sea wall.
      He taught me how to count them from the quay.
      The first meant cargo clearing past the harbour.
      The fourth meant I could trust what I could see.
      At nine, the dark began beyond the headland.
      His hauler always crossed before that line.
      I never asked what waited past the ninth light.
      He never made me carry it as mine.

      [Refrain]
      Nine along the wall and nine to count.
      Leave a breath of dark between each one.
      The sea can take the shape of every warning.
      I will count until the crossing comes.

      [Verse 2]
      One went out midway through sealed season.
      Eight pale marks remained above the foam.
      Every night I stopped before the missing,
      every night his cargo still came home.
      He laughed and said a lamp was not a promise.
      I knew that. Knowing did not make it true.
      The unlit place grew larger than the water.
      I watched it even when he stood in view.

      [Bridge]
      We build small orders out of danger:
      nine low lights, a timetable, a rail.
      None can hold the sea where we have put it.
      Still, the hands remember when they fail.

      [Verse 3]
      In spring, a working crew restored the ninth one.
      A different colour opened on the stone.
      Everyone could name the new replacement.
      Nobody mistook it for the old.
      He and I stood watching from the harbour.
      His hand found mine before the lamps went on.
      Eight had brought him safely through the winter.
      Nine made room for fear to become small.
      Far out, another hauler crossed the black line.
      Someone else began the count from one.

      [Final Refrain]
      Nine along the wall and nine to count.
      Leave a breath of dark between each one.
      The sea can take the shape of every warning.
      I will count until the crossing comes.

      [Outro - the nine notes again, fading]
