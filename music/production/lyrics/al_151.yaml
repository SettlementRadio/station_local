  - id: s_1216
    title: Nothing to Dance To
    track_number: 3
    mood: [wry, dry, slow]
    fact: >-
      Sabin Loch wrote it the night a hall manager asked the band to play faster, and it is the
      slowest thing Stormline Issue has ever pressed.
    arrangement_note: the slowest thing the house has pressed, and the kit plays half of what it wants to the whole way through
    intro: 6
    outro: fade
    target_duration: "4:30"
    prompt: >-
      44 BPM very slow dry torch in a large cold seafront hall; high light male tenor quiet and
      unforced with no vibrato, plucked electronic strings taking a sixteen-second break, one long
      held keyboard tone, upright bass, brushed kit playing extremely sparsely, fade.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending, any increase in tempo
    lyrics: |
      [Intro - held tone and bass, six seconds]

      [Verse 1]
      He came up at about half four and asked us,
      politely, which I will give him, if we could lift it.
      The room is going flat, he said. Just lift it.
      Something they can move to. Half an hour.
      There were nineteen people left and four asleep
      and one of them was him, an hour before.
      I said we would see what we could do about it
      and then we played the slowest thing we know.

      [Verse 2]
      There is nothing here to dance to. That is the offer.
      That is the entire product, and it is honest.
      Four hundred came in earlier for the dancing
      and they got it, and they got it very loudly,
      and what is left at this end of the evening
      is the ones who did not want it or are done.
      A hall that cannot tell those two apart
      should not be booking anybody after two.
      In a sealed season there is nowhere else to go.
      That is not the same as wanting to be here.

      [Instrumental - plucked electronic strings break, sixteen seconds]

      [Verse 3]
      He has not asked again. We are still booked.
      I think he found out afterwards it worked.
      The room went quiet in the way a room goes
      when it stops trying to be somewhere else,
      and the nineteen stayed and four more came in late
      off a hauler that had come in on the tide,
      and one of them stood the whole hour by the door
      with her coat on and did not sit and did not move.
      I do not know what that was and I did not ask.
      Whatever it was, it took the whole slow hour.

      [Refrain]
      There is nothing here to move to. Sit down.
      There is nothing here to move to. That is it.
      Whatever it is you have carried in this evening,
      put it on the floor. We will be a while.

      [Outro - held tone fading]
