    lyrics: |
      [Intro - held tone and bass, six seconds]

      [Verse 1]
      By half four, the bright room had emptied.
      Paper stars lay crushed along the floor.
      Nineteen people held the final tables.
      Four slept beneath their coats beside the door.
      A woman stood alone near the airlock,
      both hands closed around a cargo strap.
      She had arrived from somewhere in the weather.
      She looked too tired to leave and too awake to ask.

      [Verse 2]
      I left one chair turned toward the low heater.
      She saw it and remained against the wall.
      Outside, sealed-season rain crossed sideways.
      A last ferry warning sounded down the hall.
      Nothing in the room required an answer.
      Nothing tried to pull her hands apart.
      Her boots left two dark islands on the flooring.
      I watched them widen while the cold rain fell.
      We let the slow hour open at its own pace,
      wide enough to hold a guarded heart.

      [Instrumental - plucked electronic strings break, sixteen seconds]

      [Refrain]
      There is nothing here to move to. Sit down.
      There is nothing here to move to. That is it.
      Whatever it is you have carried in this evening,
      put it on the floor. We will be a while.

      [Verse 3]
      Near the end, she crossed toward the heater.
      She set the cargo strap beneath the chair.
      No one looked or offered her a greeting.
      Kindness sometimes means pretending not to care.
      The sleeping four woke slowly into daylight.
      A hauler docked beyond the sea wall rail.
      She took the strap but left her coat unfastened,
      stood one moment longer in the pale.
      Whatever she had carried stayed unspoken.
      Still, she left with one hand hanging free.

      [Final Refrain]
      There is nothing here to move to. Sit down.
      There is nothing here to move to. That is it.
      Whatever it is you have carried in this evening,
      put it on the floor. We will be a while.

      [Outro - held tone fading]
