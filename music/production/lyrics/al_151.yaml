  - id: s_1218
    title: Not the Core's Music
    track_number: 5
    mood: [defiant, blunt, midtempo]
    fact: >-
      The band will not use the core's word for what it plays, and this is the song the sleeve prints
      their objection next to.
    arrangement_note: the most direct thing on the record — the voice sits forward and the held keyboard tone drops out entirely under every chorus
    intro: 5
    outro: cold
    target_duration: "3:55"
    prompt: >-
      70 BPM blunt defiant midtempo slow torch in a large cold seafront hall; high light male tenor
      well forward and unforced, plucked electronic strings taking a thirteen-second break, the held
      keyboard tone dropping out entirely under each chorus, upright bass, brushed kit, hard cold stop.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, fade ending
    lyrics: |
      [Intro - bass and plucked strings, five seconds]

      [Verse 1]
      They have a word for it and I will not use it.
      It is a good word. It is somebody else's.
      It came down here in a crate with the equipment
      and it fits, and that is not the point at all.
      There were people playing the last hour on this coast
      before a single crate came off a hauler,
      in halls that had one lamp and a wet floor,
      and nobody has written any of them down.

      [Verse 2]
      My mother's brother played the end of nights
      in a room on Bight Row that is a store now.
      He never heard a record from the core.
      He would not have known the word if you had said it.
      What he played is what I play. I have his kit.
      The brushes in this room tonight were his.
      If the name for it arrived here in a box
      then the name is about the box and not the music.

      [Chorus]
      Not their music. Not their room. Not their hour.
      Ours, and made here, out of what was here.
      Call it whatever fits on a sleeve.
      I will not say it and I never have.

      [Instrumental - plucked electronic strings break, thirteen seconds]

      [Verse 3]
      The house files us under the word regardless
      and prints what I have said about it alongside,
      which is more than any other house would do
      and is the whole of why I stay with them.
      I am not asking anybody to agree.
      I am asking that both things sit on the sleeve.
      They do. They have since we first put a record out.
      That is a contract and it is the only one.

      [Chorus]
      Not their music. Not their room. Not their hour.
      Ours, and made here, out of what was here.
      Call it whatever fits on a sleeve.
      I will not say it and I never have.

      [Outro - cold stop]
