      [Verse 1]
      A hall is not a floor. That is the whole difference
      and nobody who has only ever played halls understands it.
      A floor is what four hundred people do to a building.
      You can put one into a room that has never had one
      and you can take it out again on Monday morning
      the way a freight crew takes a hold apart at a berth,
      and the room will not remember and the people will.

      [Chorus]
      Bring your own floor. Do not wait to be given one.
      There is no room anywhere that comes with people in it.
      Whatever you are carrying, that is the venue.
      The building is a roof and it is not the point.

      [Verse 2]
      Nessa Dray came out from four stops down the road
      for one night and stayed for three, which was not the arrangement,
      and about halfway through this she looked up at Neve
      and put about eight beats a minute on it without asking anybody.
      Neve went with her. Corr went with her. Tobe swore.
      I sang the second half of this considerably faster than I meant to.

      [Instrumental - two fiddles trading, eighteen seconds]

      [Verse 3]
      Neve says she had not agreed to it and never would have
      and has not once asked her to put it back where it was
      and has been playing it at the new speed ever since,
      which is the most Neve Torrin sequence of events possible.
      That is what a session player is actually for.
      Not the part. The look. The eight beats nobody agreed to.

      [Chorus]
      Bring your own floor. Do not wait to be given one.
      There is no room anywhere that comes with people in it.
      Whatever you are carrying, that is the venue.
      The building is a roof and it is not the point.

      [Final Chorus - high harmony from the fiddle chair]
      Bring your own floor, and mind who you let stand on it,
      because somebody will lift it out from under you at the join.
      Whatever you are carrying, that is the venue,
      and it is going faster than it was and we are staying with it.

      [Outro - cold stop]
