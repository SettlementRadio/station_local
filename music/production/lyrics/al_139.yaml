  - id: s_1134
    title: Four Hundred Off the Frontier
    track_number: 2
    mood: [fast, loud, communal]
    fact: >-
      The dancers on it travelled from Cold Harbor at the label's expense, and the sleeve lists the
      hall's own staff by name as well, because they danced too.
    arrangement_note: the loudest thing on the record, with the floor mixed almost level with the band because there are four hundred people on it in a room built for a thousand sitting still
    intro: 14
    outro: sustain
    target_duration: "4:30"
    prompt: >-
      176 BPM loud reel; plain female lead, high harmony, forward caller, huge dancing floor, held end.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, small dry room, cold ending
    lyrics: |
      [Intro - band and rising floor, fourteen seconds]

      [Verse 1]
      Four hundred Cold Harbor dancers took the night ferry east,
      work boots under narrow seats and food packed for four days.
      Nine were sick before the carrier cleared the storm coast.
      Twenty played at cards; the rest slept through the turn.
      Concordance put hot cups out beside the arrival gate.
      No one asked for door money; every name was marked already.
      By dusk, four hundred coats had filled the marble corridor.

      [Call - shouted over the band, well forward]
      Straight down the middle. Two lines. Now.

      [Chorus]
      Four hundred off the coast and about nine from the hall,
      work coats meeting polished shoes beneath the chandelier.
      Nobody watches once the western line begins.
      Everybody in the building has the same two hands.

      [Verse 2]
      Nine hall staff stood along the wall through two full figures,
      keys at belts, clean cloths folded, jackets buttoned straight.
      Then the woman who had polished those boards eleven years
      set her cloth upon the rail and joined the centre line.
      A keeper followed, then two ushers, then the lighting man.
      By the chorus, every staff hook held an empty coat.
      Alis called them forward by the names they gave the floor.

      [Verse 3]
      Empty bolt holes crossed the boards in twenty ordered rows.
      Cold Harbor boots stepped over them with Concordance shoes.
      One cleaner turned a freight hand underneath the stage lip.
      One usher missed the cast and laughed against the wall.
      The chandelier still sorted light from dark above us,
      but down below no doorway knew the staff from travelling crews.
      Corr held one low figure while the whole room changed its places.

      [Call - shouted over the band, well forward]
      All the way up. Hold it. Both lines. Away.

      [Chorus]
      Four hundred off the coast and about nine from the hall,
      work coats meeting polished shoes beneath the chandelier.
      Nobody watches once the western line begins.
      Everybody in the building has the same two hands.

      [Final Chorus - high harmony from the fiddle chair, the caller forward]
      Four hundred off the coast and about nine from the hall,
      cleaner, keeper, lighting man and six more in the line.
      Nobody watches once the western line begins.
      Stack the seats behind the doors. Do not bolt them down tonight.

      [Outro - held chord, the room still going]
