  - id: s_1136
    title: Bring Your Own Floor
    track_number: 4
    mood: [fast, competitive, bright]
    fact: >-
      Nessa Dray plays the second fiddle part and lifts the tempo halfway through with a look, which
      Neve Torrin says she had not agreed to and has never asked her to undo.
    arrangement_note: two fiddles, and the tempo goes up about eight beats a minute exactly halfway through because the guest decided it should, with no discussion and no warning and the rest of the band following her
    intro: 16
    outro: cold
    target_duration: "4:25"
    prompt: >-
      168 to 176 BPM fiddle duel; plain female lead, high harmony, no caller, sudden halfway lift.
    exclude: spoken calling, called dance figures, shouted instructions, electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, gradual accelerando, small dry room, fade-out
    lyrics: |
      [Intro - two fiddles, sixteen seconds]

      [Verse 1]
      Four hundred Cold Harbor dancers crossed the ferry with us,
      carrying the floor in boots, bad knees and working hands.
      Concordance gave the roof, the sprung boards and the chandelier.
      We filled the empty bolt rows from the stage to western doors.
      A freight crew knows a hold becomes the load inside it.
      By the same rule, one quiet hall became a turning floor.
      Monday takes the seats back. Nobody takes the steps.

      [Chorus]
      Bring your own floor. Do not wait to be given one.
      There is no room anywhere that comes with people in it.
      Whatever you are carrying, that is the venue.
      The building is a roof and it is not the point.

      [Verse 2]
      Nessa Dray came four stops down and stayed three nights.
      Halfway through the tune, she looked across at Neve.
      No raised bow, no spoken count, just one small forward nod.
      Nessa drove the next exchange eight beats above the first.
      Neve caught her by the third bar; Corr leaned into the chase.
      Tobe swore and brought the kit beneath them without slipping.
      I took the next verse quicker than my breath had planned.

      [Instrumental - two fiddles trading, eighteen seconds]

      [Verse 3]
      Afterward, Neve said, "I did not agree to any lift."
      Nessa wiped the bow and said, "You followed all the same."
      Neither apologized. Both played it faster next night.
      Cold Harbor dancers learned the quicker turn by Friday.
      One look between two fiddlers moved four hundred pairs of feet.
      No caller marked the moment; no one voted at the join.
      The floor decided by continuing and would not give it back.

      [Chorus]
      Bring your own floor. Do not wait to be given one.
      There is no room anywhere that comes with people in it.
      Whatever you are carrying, that is the venue.
      The building is a roof and it is not the point.

      [Final Chorus - high harmony from the fiddle chair]
      Bring your own floor, and mind who you let stand on it,
      because somebody will lift it out from under you at the join.
      Whatever you are carrying, that is the venue,
      and Nessa has it moving faster; Neve stays beside her.

      [Outro - cold stop]
