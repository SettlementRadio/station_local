  - id: s_1138
    title: Home on the Late Run
    track_number: 6
    mood: [slow, warm, tired]
    fact: >-
      Tobe Marran plays it on chimes he built out of stage wire the hall was throwing away, and he
      asked the hall keeper for the wire before the band had played a note.
    arrangement_note: the chimes on this track are made out of wire the hall was throwing out and were built between the first and second nights, so they are longer and duller than the band's usual ones and they carry the whole top of the arrangement
    intro: 12
    outro: fade
    target_duration: "4:40"
    prompt: >-
      100 BPM tired slow dance; quiet female lead, high harmony, no caller, dull wire chimes, hall fade.
    exclude: spoken calling, called dance figures, shouted instructions, electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, fast reel tempo, cold ending
    lyrics: |
      [Intro - hand-built chimes, twelve seconds]

      [Verse 1]
      Before we played a note, Tobe found the wire bin,
      nine dull metres cut from the old lights over the stage.
      He asked the keeper, "Is that leaving with the rubbish?"
      The keeper said yes, then watched him carry it away.
      Tobe worked past supper with a wrench across his knees.
      By second night, long crooked chimes hung over his chair.

      [Chorus]
      Going home on the late one with the whole coast asleep,
      four days on a ferry and a settlement in the dark,
      and about eleven of us awake in a hold at the front
      not saying anything and not wanting to.

      [Verse 2]
      He struck one after closing and it did not ring clean.
      It rolled through the emptied hall like a freight line braking,
      low enough to feel in the stacked seats by the wall.
      The cleaner stopped her broom until the sound was gone.
      Then Tobe struck the next, and Neve found a line above it,
      something slow enough to leave the tired boards alone.

      [Verse 3]
      On the late run east, the cases slept under canvas.
      Corr used his coat for a pillow beside the forward hold.
      Eleven of us watched the core lights thin behind the ferry,
      too tired for cards and too awake to trust the bunks.
      Tobe kept the new chimes wrapped inside his working shirt.
      Every hard turn made them answer without being touched.

      [Chorus]
      Going home on the late one with the whole coast asleep,
      four days on a ferry and a settlement in the dark,
      and about eleven of us awake in a hold at the front
      not saying anything and not wanting to.

      [Final Chorus - high harmony from the fiddle chair, very quiet]
      Going home on the late one with the whole coast asleep,
      and Tobe in the corner with nine metres of wire in a bag.
      Four days on a ferry and a settlement in the dark,
      and Saturday waiting in a shed beside the stove.

      [Outro - fade]
