  - id: s_1140
    title: Last Turn in the Core
    track_number: 8
    mood: [fast, final, communal]
    fact: >-
      The last thing played on the fourth night, after the hall's licensed hours had ended, and the
      hall keeper let it run rather than stop it as he had stopped everybody else that season.
    arrangement_note: the fastest and longest thing the band has recorded, played past the hour the hall is licensed to, with the whole floor and the hall's own staff on it and nobody making any attempt to bring it to an end
    intro: 12
    outro: sustain
    target_duration: "4:50"
    prompt: >-
      184 BPM frantic reel; plain female lead, forward shouted caller, huge floor, extra turns, held end.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, small dry room, cold ending, fade-out
    lyrics: |
      [Intro - band, twelve seconds]

      [Verse 1]
      The minute hand crossed eleven above the west door.
      The keeper rose from his stool and reached for the switch.
      We had seen him do it to every dance that season:
      one clean cut, then coats, complaints and corridor light.
      Alis had the last turn waiting under her breath.
      The floor saw her lift one hand and would not break apart.

      [Call - shouted over the band, well forward]
      One more. All of you. Down the middle. Go.

      [Chorus]
      Last turn in the core and the clock has gone past.
      Nobody has stopped us. Nobody is going to.
      There is a man at the side with his hand on a switch
      who has decided, tonight, not to use it.

      [Verse 2]
      The keeper looked across at his cleaner by the window,
      apron tied at her waist, both hands with a freight man,
      taking the long way round a room she had swept for years.
      He took his hand off the switch and folded both arms.
      The clock moved on. The west door stayed closed.
      Alis caught his eye and called another turn.

      [Instrumental - fiddle break, eighteen seconds]

      [Verse 3]
      Midnight found the ushers dancing with the ferry crew.
      Half past found our packed cases still stacked against the wall.
      The light man climbed down and left the chandelier burning.
      Someone opened bread meant for the morning crossing.
      Every time the line came home, the keeper raised one finger:
      once more for the coast, once more before the early boat.

      [Call - shouted over the band, shouting now]
      Round again. And again. Nobody sits down.

      [Final Chorus - high harmony from the fiddle chair, the whole room on it]
      Last turn in the core and the clock has gone past,
      and the ferry is at seven with our cases still unpacked.
      There is a man at the side with his hand on a switch
      and he is not going to use it, so we are not going to stop.

      [Outro - held chord, the whole room on it]
