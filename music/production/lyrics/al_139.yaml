  - id: s_1137
    title: Paid Before We Played
    track_number: 5
    mood: [blunt, midtempo, wry]
    fact: >-
      Corr Ballan made the label hand the fee over in front of the band before the first night, having
      been at three dances where nobody was paid after one.
    arrangement_note: the plainest arrangement on the record with nothing decorating anything, the bass forward and the fiddle staying out of the way, because it is a song about a transaction being witnessed
    intro: 4
    outro: fade
    target_duration: "3:50"
    prompt: >-
      152 BPM blunt live reel; plain female lead, high harmony, no caller, forward bass, sparse hall fade.
    exclude: spoken calling, called dance figures, shouted instructions, electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, instrumental flourishes, small dry room, cold ending
    lyrics: |
      [Intro - band, four seconds]

      [Verse 1]
      Corr stood in the Concordance corridor before the first door,
      four cases and four people making a wall behind him.
      The Harbor Standard man had the fee inside his coat.
      Corr said, "Put it on the bench where all five of us can count it."
      He did not raise his voice. He did not move aside.
      Three coast dances had sent him home carrying promises.

      [Chorus]
      Money first. Not because anybody is a liar.
      Because a promise at eleven is not a promise at four
      and a man who is very sorry in the morning
      has still not paid five people who have to eat.

      [Verse 2]
      The label man went red and asked if this was necessary.
      Corr pointed at the cases and said, "So are those."
      Then the notes came out, flat and clean on the bench,
      five shares counted twice while the hall filled beyond the door.
      The man signed the receipt. Corr folded it into his pocket.
      After that they spoke about lights, supper and the opening turn.

      [Verse 3]
      There is a hall keeper down the coast who owes six bands.
      He shakes every hand, promises morning, then loses the ledger.
      A young crew from another settlement will believe him next winter.
      Corr believed three different men in three different rooms,
      and carried his bass home hungry after every one.
      Three is exactly enough to change how a man guards a doorway.

      [Chorus]
      Money first. Not because anybody is a liar.
      Because a promise at eleven is not a promise at four
      and a man who is very sorry in the morning
      has still not paid five people who have to eat.

      [Final Chorus - high harmony from the fiddle chair]
      Money first, and then the doors, and then the tune,
      and everybody in that corridor knew it was fair.
      A promise at eleven is not a promise at four.
      Ask any freight crew what a signature is for.

      [Outro - fade]
