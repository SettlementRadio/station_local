    lyrics: |
      [Intro - band and rising floor, fourteen seconds]

      [Verse 1]
      Four hundred people who have never left the coast
      on a ferry, in the dark, for four days, to dance,
      with about nine of them being sick in the first hour
      and every one of them saying it was worth it afterwards.
      They were carried. Not charged. Fed twice. Put somewhere.
      That is what a label is for and nobody uses one that way.

      [Call - shouted over the band, well forward]
      Straight down the middle. Two lines. Now.

      [Chorus]
      Four hundred off the coast and about nine from the hall,
      and the nine are on the sleeve because the nine came out.
      Nobody watched. There was nobody left to watch.
      Everybody in that building was doing the same thing.

      [Verse 2]
      The hall's own staff were supposed to be working
      and stood at the sides for about two tunes, professionally,
      and then a woman who has cleaned that room for eleven years
      put her cloth down on a rail and walked out into it.
      Her name is on the sleeve and so are the other eight.
      Harbor Standard asked whether that was necessary. It was.

      [Verse 3]
      There is a thing that happens in a room with no seats in it
      that does not happen anywhere with seats, ever, at all,
      which is that nobody can tell who came to watch
      and who came to dance and who works there and who does not.
      Take the chairs out and a room stops sorting people.
      That is not a metaphor. That is joinery.

      [Call - shouted over the band, well forward]
      All the way up. Hold it. Both lines. Away.

      [Chorus]
      Four hundred off the coast and about nine from the hall,
      and the nine are on the sleeve because the nine came out.
      Nobody watched. There was nobody left to watch.
      Everybody in that building was doing the same thing.

      [Final Chorus - high harmony from the fiddle chair, the caller forward]
      Four hundred off the coast and about nine from the hall,
      and a chandelier over the top of the whole business.
      Nobody watched. There was nobody left to watch.
      Bolt the seats back in on Monday. Not tonight.

      [Outro - held chord, the room still going]
