    lyrics: |
      [Intro - band, ten seconds]

      [Verse 1]
      Everybody comes the other way. That is the road.
      You get good on a frontier floor and you go to the core
      and you play a hall with a sprung stage and a curtain
      and you come home in nine years with an accent and a manager.
      I wrote the first half of this on the way in
      feeling extremely clever about not doing that.

      [Call - shouted over the band, well forward]
      Take hands. All the way down. And turn.

      [Chorus]
      We went the other way and brought the floor with us.
      Four hundred people off the ice in a hall with a chandelier.
      Nobody here is going anywhere on their own.
      If we are playing the core, the coast is coming too.

      [Verse 2]
      The condition was simple and the label agreed to it
      after about a fortnight of finding out I meant it:
      four hundred Cold Harbor dancers, carried, not charged,
      or there is no record and Harbor Standard can have the nights back.
      They said it would cost more than the hall did. It did.
      They did it anyway, which I did not expect, and I have said so.

      [Call - shouted over the band, well forward]
      Cast off. Both lines. Long way round. Hold.

      [Chorus]
      We went the other way and brought the floor with us.
      Four hundred people off the ice in a hall with a chandelier.
      Nobody here is going anywhere on their own.
      If we are playing the core, the coast is coming too.

      [Verse 3 - written after seeing the room]
      And then I saw it, and I had to write this bit again.
      It is a beautiful room. It is a genuinely beautiful room.
      It is also a room that was built for people sitting down,
      with the seats bolted to the floor in rows facing one way.
      They took two hundred of them out for us in a day.
      Somebody in this settlement is going to be furious about that.

      [Final Chorus - high harmony from the fiddle chair, the caller forward]
      We went the other way and brought the floor with us,
      and they unbolted the seats, which is the whole story.
      Nobody here is going anywhere on their own.
      Four nights. Then the ferry. Then home.

      [Outro - cold stop]
