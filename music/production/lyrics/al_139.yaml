      track on the record. Female lead vocal, plain mid register, strong and unornamented, phrasing
      like somebody calling across a room, pushing hard. One high female harmony from the fiddle chair
      through the choruses. A second woman calls dance figures over the band — short rhythmic shouted
      instructions, spoken not sung, never rapped — mixed well forward and shouting by the end.
      Composite fiddle taking an eighteen-second break, fretted acoustic-toned composite guitar,
      upright bass, cut-stock kit, stripped-wire chimes. Tracked live in an enormous hard-walled
      concert hall with four hundred dancers, very loud. Twelve seconds of band before the first sung
      word. The ending goes round twice more than it should. Ends on a held chord with the whole room
      on it.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, small dry room, cold ending, fade-out
    lyrics: |
      [Intro - band, twelve seconds]

      [Verse 1]
      The hall stops at eleven. It has stopped at eleven
      all season, on everybody, without exception, including
      two things this settlement was extremely proud of
      and one man who is on every wall in the building.
      At eleven the keeper stands up and it is over.
      That is the rule and there is nothing personal in it.

      [Call - shouted over the band, well forward]
      One more. All of you. Down the middle. Go.

      [Chorus]
      Last turn in the core and the clock has gone past.
      Nobody has stopped us. Nobody is going to.
      There is a man at the side with his hand on a switch
      who has decided, tonight, not to use it.

      [Verse 2]
      He is standing at the door with his arms folded
      watching a cleaner he has employed for eleven years
      dance the long way round a room she has never sat in
      with four hundred people off an ice coast four days away.
      He let it run. He let the whole thing run.
      He has not explained it to anybody and he does not have to.

      [Instrumental - fiddle break, eighteen seconds]

      [Verse 3]
      Four nights. Two hundred seats out. Nine names on a sleeve.
      A figure with a bar of five in it loose in the core now.
      A woman who sang behind somebody for six years
      standing in front of a band in a hall with a chandelier.
      That is what we came for and we did not know it
      until about four minutes ago and here it is.

      [Call - shouted over the band, shouting now]
      Round again. And again. Nobody sits down.

      [Final Chorus - high harmony from the fiddle chair, the whole room on it]
      Last turn in the core and the clock has gone past,
      and the ferry is at seven and none of us have packed.
      There is a man at the side with his hand on a switch
      and he is not going to use it, so we are not going to stop.

      [Outro - held chord, the whole room on it]
