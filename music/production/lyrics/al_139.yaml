    lyrics: |
      [Intro - band, four seconds]

      [Verse 1]
      He stood in the corridor of a hall in the core
      with four people behind him and a man from the label in front
      and said he would like the money now, in front of everybody,
      before anybody played anything, and would not move.
      It was not rudeness. He had been at three dances
      where a band played four hours and went home with a promise.

      [Chorus]
      Money first. Not because anybody is a liar.
      Because a promise at eleven is not a promise at four
      and a man who is very sorry in the morning
      has still not paid five people who have to eat.

      [Verse 2]
      The label's man was genuinely offended for about a minute
      and then, to his credit, worked out what was being said,
      which is not that he would not pay but that he might not have to,
      and that the difference is invisible until it is not.
      He got it out and counted it in the corridor.
      Nobody has mentioned it since and nobody has needed to.

      [Verse 3]
      There is a hall keeper on the coast who owes six bands
      and every one of them believed him at the time,
      and he is not a criminal and he is not going to be charged
      and he will do it again this winter to somebody young.
      Corr has been at three of those. Three is enough.
      Three is exactly enough to change how a man stands in a corridor.

      [Chorus]
      Money first. Not because anybody is a liar.
      Because a promise at eleven is not a promise at four
      and a man who is very sorry in the morning
      has still not paid five people who have to eat.

      [Final Chorus - high harmony from the fiddle chair]
      Money first, and then the doors, and then the tune,
      and everybody in that corridor knew it was fair.
      A promise at eleven is not a promise at four.
      Ask any freight crew what a signature is for.

      [Outro - fade]
