  - id: s_1133
    title: We Went the Other Way
    track_number: 1
    mood: [driving, bright, defiant]
    fact: >-
      Suli Orley wrote it on the way to the core and changed the last verse after seeing the hall,
      which she has described as a room built for people who are sitting down.
    arrangement_note: the first two verses are the version written on the way in and the last verse is the one written after seeing the room, and the arrangement gets harder rather than bigger at exactly that point
    intro: 10
    outro: cold
    target_duration: "4:05"
    prompt: >-
      170 BPM hard reel; plain female lead, high harmony, forward shouted caller, huge hall, cold stop.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, small dry room, fade-out
    lyrics: |
      [Intro - band, ten seconds]

      [Verse 1]
      Every old story sends the coast road toward the core:
      one good frontier floor, one ferry, one impressive room.
      I wrote that much while Cold Harbor disappeared behind us,
      boots beneath the berth seats, work coats tied above.
      Four hundred dancers filled the carrier with sleep and sickness.
      I thought the polished hall would ask us all to shrink.
      I carried that bright argument four days beneath my tongue.

      [Call - shouted over the band, well forward]
      Take hands. All the way down. And turn.

      [Chorus]
      We went the other way and brought the floor with us.
      Four hundred people off the ice in a hall with a chandelier.
      Nobody here is going anywhere on their own.
      If we are playing the core, the coast is coming too.

      [Verse 2]
      At the Concordance gate, a clerk held four hundred names,
      every fare already paid and every door charge crossed away.
      Nobody reached for coins; nobody got turned aside.
      Harbor Standard's woman watched the final coach unload,
      handed me the signed list and said, "You meant the number."
      I said, "You paid it." She said, "You made that the price."
      Then Alis called the first long line beneath the chandelier.

      [Call - shouted over the band, well forward]
      Cast off. Both lines. Long way round. Hold.

      [Chorus]
      We went the other way and brought the floor with us.
      Four hundred people off the ice in a hall with a chandelier.
      Nobody here is going anywhere on their own.
      If we are playing the core, the coast is coming too.

      [Verse 3 - written after seeing the room]
      The hall was more beautiful than anger had allowed:
      white ceiling, sprung boards, chandelier like winter stars.
      Two hundred seats lay stacked behind the eastern doors,
      bolts still bright in empty rows where every face once pointed forward.
      I crossed my clever last verse out against the ferry timetable.
      A cleaner showed me where the workers hid the proper wrench.
      By night, four hundred feet had taught the sprung floor other work.

      [Final Chorus - high harmony from the fiddle chair, the caller forward]
      We went the other way and brought the floor with us,
      four days from the ice, through one unpriced door.
      Nobody here is going anywhere on their own.
      Stack the seats on Monday. Tonight, turn every row.
      Four nights. Then the ferry. Then Cold Harbor home.

      [Outro - cold stop]
