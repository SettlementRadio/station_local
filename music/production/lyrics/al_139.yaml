  - id: s_1139
    title: She Sang Behind for Six Years
    track_number: 7
    mood: [warm, rolling, fond]
    fact: >-
      Neve Torrin sings the only lead Suli Orley has given away, for the reason Wire and Rosin once
      wrote Orley an introduction and made her play it alone.
    arrangement_note: the fiddle chair sings the lead and the usual lead singer sings the harmony underneath her instead, which is the exact reverse of everything else this band has recorded and happened once
    intro: 8
    outro: fade
    target_duration: "4:20"
    prompt: >-
      148 BPM warm rolling reel; higher female lead, usual lead in low chorus harmony, no caller, fade.
    exclude: spoken calling, called dance figures, shouted instructions, electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, small dry room, cold ending
    lyrics: |
      [Intro - fiddle, eight seconds]

      [Verse 1]
      Suli told me how Wire and Rosin wrote her an opening,
      set the page on a chair beneath the little red lamp,
      and left her alone to find a way through it.
      She called after Hessa. The corridor door stayed shut.
      So Suli played until her hands stopped asking permission.
      I heard that story for years and missed the warning in it.

      [Chorus]
      She sang behind for six years and she never once said so,
      and then she stood in front of a band and never went back.
      There is a way of handing something to somebody
      that looks exactly like being left in a room alone.

      [Verse 2]
      I have held the high line since this band began,
      safe behind the bow and somebody else's first breath.
      In a hall in the core, Suli put the words in my hand.
      "Next one is yours," she said, already walking from me.
      I asked when we would practise. She pointed through the door.
      Four hundred people were stamping for us to come back.

      [Verse 3]
      My first line shook. Suli waited underneath it,
      a third down in the place I had always kept for myself.
      She did not pull me straight or reach across the gap.
      She held one low note until I found the next one clean.
      Six years behind Hessa on a frontier settlement floor,
      then one night behind me while the whole core room turned.

      [Chorus]
      She sang behind for six years and she never once said so,
      and then she stood in front of a band and never went back.
      There is a way of handing something to somebody
      that looks exactly like being left in a room alone.

      [Final Chorus - the usual lead singing harmony underneath]
      She sang behind for six years and she never once said so.
      There is a way of handing something to somebody
      that looks exactly like being left in a room alone,
      and one day I may know who needs the door shut behind them.

      [Outro - fade]
