    lyrics: |
      [Intro - band, six seconds]

      [Verse 1]
      There is a figure we do on the coast that nobody else does
      and it takes a bar of five in the middle of a straight tune
      and everybody in Cold Harbor has walked it since they were six
      and not one person in this room had ever seen it before.
      It came up the relay road in a hold with a freight crew.
      She called it on the first night and four hundred core dancers
      went in about nine directions and it was magnificent.

      [Teaching - spoken over the band, unhurried, no singing]
      Right. Stop. Everybody stop. Nobody has done this before,
      so we are going to do it slowly and then we are going to do it properly.
      Take your partner. Long step on the fifth. Wait for it.
      Wait. Wait. There. That is it. Again.

      [Verse 2]
      The band vamped for a minute and forty behind that
      and Harbor Standard's man was at the side going white
      and Corr just held the figure under it the way he does
      and Tobe looked at me once and neither of us stopped.
      You do not start a take again because the floor is learning.
      Learning is the loudest thing that happened in four nights.

      [Instrumental - fiddle break, sixteen seconds]

      [Chorus]
      Ask a room to turn and give it time to turn.
      Nobody was born knowing where their feet go.
      Four hundred people off the ice were taught this too,
      by somebody, in a shed, about nine years ago.

      [Verse 3]
      Second time round they had it. Not well. They had it.
      By the fourth night there were core dancers teaching each other
      down at the far end where the caller cannot see,
      which is exactly how it got to Cold Harbor in the first place.
      There is going to be a bar of five in this settlement now
      and in about four years nobody will remember where it came from.

      [Chorus]
      Ask a room to turn and give it time to turn.
      Nobody was born knowing where their feet go.
      Four hundred people off the ice were taught this too,
      by somebody, in a shed, about nine years ago.

      [Final Chorus - high harmony from the fiddle chair, the caller forward]
      Ask a room to turn and give it time to turn,
      and keep the take, and let the minute forty stand.
      Nobody was born knowing where their feet go.
      That is on the record and I would not cut a second.

      [Outro - fade]
