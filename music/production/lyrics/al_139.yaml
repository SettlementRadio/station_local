  - id: s_1135
    title: Ask a Core Room to Turn
    track_number: 3
    mood: [quick, wry, communal]
    fact: >-
      Alis Doone calls a figure the core dancers did not know and spends the first chorus teaching it
      to them, which the band kept rather than start again.
    arrangement_note: the caller teaches a figure over the whole of the first chorus instead of calling it, so the lead does not sing that chorus at all and the band vamps underneath the instruction until the floor has it
    intro: 6
    outro: fade
    target_duration: "4:15"
    prompt: >-
      166 BPM quick reel; plain female lead, forward caller teaches first turn, fiddle break, hall fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, small dry room, cold ending
    lyrics: |
      [Intro - band, six seconds]

      [Verse 1]
      Alis called the coast turn in the core that night,
      four clean bars, then one long fifth step underneath the pipes.
      Cold Harbor feet came off the ferry knowing every step.
      Core-side couples reached the extra beat and broke nine ways.
      Two lines crossed; one pair turned; three stopped beside the stage.
      Alis raised both hands before the tangle found the wall.
      Corr held the low figure and the whole band waited there.

      [Teaching - spoken over the band, unhurried, no singing]
      Right. Stop. Everybody stop. Nobody has done this before,
      so we are going to do it slowly and then we are going to do it properly.
      Take your partner. Long step on the fifth. Wait for it.
      Wait. Wait. There. That is it. Again.

      [Verse 2]
      Corr played the same four notes beneath her slow instruction.
      Tobe brushed the first beat; Neve held the bow at rest.
      I watched four hundred shoulders loosen on the waiting count.
      First attempt, half the room forgot the partner's hand.
      Second, one long step landed all along the eastern line.
      Third, the chandelier shook under boots arriving clean.
      Alis dropped both hands and let the full-speed turn begin.

      [Instrumental - fiddle break, sixteen seconds]

      [Chorus]
      Ask a room to turn and give it time to turn.
      Nobody was born knowing where their feet go.
      Four hundred people off the ice were taught this too,
      by somebody, in a shed, about nine years ago.

      [Verse 3]
      Second time through, Concordance dancers found the long step.
      Fourth night, they were teaching newcomers by the western doors.
      One older woman tapped the fifth beat with her heel,
      caught a stranger's sleeve and walked him under without words.
      Alis saw it from the front and left that corner alone.
      A figure moves by hands and feet beyond the caller's sight.
      By closing, both settlements were getting part of it wrong.

      [Chorus]
      Ask a room to turn and give it time to turn.
      Nobody was born knowing where their feet go.
      Four hundred people off the ice were taught this too,
      by somebody, in a shed, about nine years ago.

      [Final Chorus - high harmony from the fiddle chair, the caller forward]
      Ask a room to turn and give it time to turn,
      wait through every crossed line till the fifth step lands.
      Nobody was born knowing where their feet go.
      Corr holds four notes. Alis lifts both hands. Again.

      [Outro - fade]
