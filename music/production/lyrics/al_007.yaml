    title: Crew Rates
    track_number: 1
    mood: [assertive, bright, driving]
    fact: >-
      The four members sing the figures from a rejected pay offer before Ressa Morn answers with the
      accepted rate.
    arrangement_note: the four members sing the rejected figures in flat unison before the lead answers alone with the accepted rate; the crew never sings under him in that exchange, and Nessa Dray's guest composite fiddle plays a two-note answer after the accepted figure
    intro: 8
    outro: cold
    target_duration: "4:00"
    prompt: >-
      Warm live-room jangle pop, 128 BPM, assertive and driving. Male lead vocal, warm baritone that
      roughens at the top of the range, plain and a shade behind the beat, no vibrato. Whole-crew
      chorus of exactly four voices in flat unison rather than harmony. The four voices sing the
      rejected figures, then stop while the lead sings the accepted rate alone; one high harmony
