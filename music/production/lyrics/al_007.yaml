  room: >-
    A port meeting room taken between co-operative votes at the first freight-circuit burn festival,
    with the kitchen rest area through one wall. **The band is still Purist here** — the wiki dates
    its Localist turn to 2600 and al_008 — so the hand-built percussion on this EP is found metal off
    the tables and the crates it came in on, not the tuned oxygen-tank drums Cado Veir wins the
    argument with six years later, and the electric composite guitar is barely amplified. Guest
    parts are printed exactly: Nessa Dray's composite fiddle on s_0066 and s_0068, Oren Saye's
    upright bass on s_0067 and s_0071, and Talla Venn's bright composite guitar on s_0069 and
    s_0070. Voice, backing and exclude remain fixed, and the whole-crew chorus is already the
    band's signature on its first record.

