    lyrics: |
      [Intro - 8 seconds, struck metal cups and acoustic-toned guitar, no vocal]

      [Verse 1]
      They read it out to a room of forty people
      with the door open and the kitchen going next door.
      A number for the day, a smaller one for the night,
      and a line at the bottom about what they call goodwill.

      [Rejected offer - four voices in flat unison]
      Seven shares by day. Five shares by night.
      One more if the hold arrives complete.

      [Accepted rate - lead alone, guest fiddle answers after the last line]
      Nine shares either shift, and goodwill does not count.
      No night discount. No goodwill written in for pay.
      Nine shares either shift. Put that at the bottom.

      [Verse 2]
      Nobody shouted. That is not how it went.
      A woman at the back asked what goodwill was worth
      in a hard season on a long circuit with a full hold,
      and nobody at the front of the room could tell her.

      [Rejected offer - four voices in flat unison]
      Seven shares by day. Five shares by night.
      One more if the hold arrives complete.

      [Accepted rate - lead alone, guest fiddle answers after the last line]
      Nine shares either shift, and goodwill does not count.
      No night discount. No goodwill written in for pay.
      Nine shares either shift. Put that at the bottom.

      [Verse 3]
      I have been on both sides of a table like that one.
      I have been the one with the paper and the reasonable voice.
      It is easier at that end and it pays better too
      and I would not go back to it for twice the rate.

      [Rejected offer - four voices in flat unison]
      Seven shares by day. Five shares by night.
      One more if the hold arrives complete.

      [Accepted rate - lead alone, guest fiddle answers after the last line]
      Nine shares either shift, and goodwill does not count.
      No night discount. No goodwill written in for pay.
      Nine shares either shift. Put that at the bottom.

      [Final Chorus - whole crew on the accepted rate, one high harmony, guest fiddle answers]
      Nine shares either shift, and goodwill does not count.
      Nine shares either shift. Put that at the bottom.
      The burn festival is on and the port hall is full
      and we will sing it all the way to the vote at nine.

      [Outro - cold stop, all voices together]
