      [Intro - 11 seconds, a tuning check played as a figure on the bright guitar, no vocal]

      [Verse 1]
      There is a queue at the transfer hall from six in the morning,
      four hundred people and one desk and a man with a stamp.
      You get one place in it and you keep it all day
      and you do not get it back if you step out of the line.

      [Verse 2]
      I had a place at forty from the front and you had nothing,
      you came off a hauler at nine with a bag and a bad night.
      I did not think about it. I have thought about it since.
      I said stand here, and I went to the back, and that was that.

      [Chorus - lead alone, guest guitar answers each line]
      Hold my place in line. That is all it is.
      Not a ring, not a room, not a name on a berth.
      Somebody keeps a space for you where a space is worth having
      and you find out what you are to each other by half past eight.

      [Verse 3]
      You did the same for me at the port hall in the spring,
      in the rain, for two hours, and you never said a word about it
      until somebody asked, at a table, in front of people,
      and you told it badly and I have not stopped thinking about it.

      [Chorus - lead begins alone, crew enters on the third line, guest guitar answers]
      Hold my place in line. That is all it is.
      Not a ring, not a room, not a name on a berth.
      Somebody keeps a space for you where a space is worth having
      and you find out what you are to each other by half past eight.

      [Instrumental - the tuning-check figure, 12 seconds]

      [Final Chorus - whole crew, one high harmony]
      Hold my place in line. That is all it is.
      Not a ring, not a room, not a name on a berth.
      Somebody keeps a space for you where a space is worth having.
      I have got you at forty from the front. Take your time.

      [Outro - sustain, the figure ringing on]
