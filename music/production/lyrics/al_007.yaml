    exclude: synthesizers, electronic drums, string sections, studio choir, vocal tuning, rapped sections, whispered vocals, dance-pop production, four-on-the-floor kick
    lyrics: |
      [Intro - 5 seconds, upright bass turn twice, no vocal]

      [Verse 1]
      The count went on till four and we sat outside it,
      on the crates in the corridor with our coats over our knees.
      Somebody's cousin came out twice with a number
      and both times the number was different and both times it was wrong.

      [Pre-Chorus]
      So we did what a crew does with a long night -

      [Chorus]
      We might be better paid by morning (better paid by morning)
      We might be exactly where we are (where we are)
      Either way there is a walk down to the berth at six
      and I would like to take it with you, whatever the count says.

      [Verse 2]
      You had the good sense to bring a flask and not an opinion.
      Everybody else on that deck had brought the opposite.
      There was a man doing the whole thing on a ration biscuit
      and explaining, at volume, how a co-operative ought to work.
      There was a man explaining shares to a woman who had drafted them
      and she let him, and she has never let anybody since.

      [Pre-Chorus]
      And the corridor got colder and we did not go in -

      [Chorus]
      We might be better paid by morning (better paid by morning)
      We might be exactly where we are (where we are)
      Either way there is a walk down to the berth at six
      and I would like to take it with you, whatever the count says.

      [Verse 3]
      They came out at ten past with a hand up for quiet.
      I did not hear the number. I will tell you what I heard.
      I heard you laugh before the room did, half a second early,
      which is how I knew, and I would rather have that than the money.

      [Chorus]
      We might be better paid by morning (better paid by morning)
      We might be exactly where we are (where we are)
      Either way there is a walk down to the berth at six
      and I would like to take it with you, whatever the count says.

      [Outro - fade on the bass turn and the crew answer]
