    lyrics: |
      [Intro - 6 seconds, both composite guitars, no vocal]

      [Verse 1]
      The boards go up on the Thursday and they change everything,
      who is on nights, who is on the long leg, who is off.
      You get about four minutes with the sheet in front of you
      to work out whether the next month is any good.

      [Chorus - lead begins alone, crew enters one bar late, guest guitar marks "second bell"]
      So we said the same hour out loud at the same time,
      Sunday, second bell, the bench by the water.
      It is not a plan. It is barely an arrangement.
      It is the one hour neither of us will give away.

      [Verse 2]
      I have watched people lose whole years to a shift board.
      Two of them working the same lane for a decade
      and never once off at the same time in the same port,
      passing it up and down the relay at four days a leg,
      writing to each other about weather and the price of things.

      [Chorus - lead begins alone, crew enters one bar late, guest guitar marks "second bell"]
      So we said the same hour out loud at the same time,
      Sunday, second bell, the bench by the water.
      It is not a plan. It is barely an arrangement.
      It is the one hour neither of us will give away.

      [Bridge]
      Burn day is a working day. Nobody gets it off.
      That is exactly why the hour before it is worth anything.

      [Verse 3]
      If the board changes, and the board always changes,
      if they put me on the night leg or the long haul out,
      I will be at the bench anyway at the second bell,
      and I will sit there like a fool for the whole hour
      on the reasonable chance that you are doing the same.

      [Final Chorus - crew enters on the first beat, one high harmony, guest guitar marks "second bell"]
      So we said the same hour out loud at the same time,
      Sunday, second bell, the bench by the water.
      It is not a plan. It is barely an arrangement.
      It is the one hour neither of us will give away.

      [Outro - fade, crew chorus arriving on the beat at last]
