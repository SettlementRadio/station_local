    lyrics: |
      [Intro - 3 seconds, one struck metal cup, no vocal]

      [Verse 1]
      There is a cup in the sink and it has been there since Tuesday
      and everybody in this cabin knows exactly whose it is.
      Nobody has moved it. Nobody is going to.
      It has become a matter of principle in a room four metres long.

      [Refrain - dry two-note guest fiddle answer after the line]
      It is not about the cup. It has never been about the cup.

      [Verse 2]
      Emi says leave it, Emi says it will resolve itself,
      which is what Emi says about everything and it never has.
      Jalen washed it on the Wednesday out of weakness
      and had to be talked to, at length, by all of us.

      [Refrain - dry two-note guest fiddle answer after the line]
      It is not about the cup. It has never been about the cup.

      [Verse 3]
      Four of us in a cabin on a circuit with no end to it,
      sharing a shelf, a kettle, a shift board and a sink,
      four berths, one lamp, and a hold full of somebody else's cargo.
      You cannot say the big thing so you say the small thing,
      and the small thing is a cup, and the cup is in the sink.

      [Refrain - dry two-note guest fiddle answer after the line]
      It is not about the cup. It has never been about the cup.

      [Bridge]
      I have washed that cup nine times since the circuit started,
      once for everybody here and five times for you alone,
      and I am not doing it again while anybody is watching.

      [Verse 4]
      You came in last night off the late deck watch and you washed it
      without a word, and put it back on the shelf with the handle turned out.
      I heard you do it. I lay there and I heard the whole thing.
      And that is the nicest thing anybody has done for me all season.

      [Refrain - dry two-note guest fiddle answer after the line]
      It is not about the cup. It has never been about the cup.

      [Outro - cold stop, one last struck cup]
