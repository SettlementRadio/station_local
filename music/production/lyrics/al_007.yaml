    lyrics: |
      [Intro - 4 seconds, muted acoustic-toned guitar, no vocal]

      [Chorus - half volume, whole band quiet]
      Do not wake the cook, do not wake the cook,
      she has been on since four and she is asleep through that wall.
      Sing it if you want but sing it like a rumour,
      and whatever else happens tonight, keep it down.

      [Verse 1]
      There are nine of us in a meeting room after the vote
      with two guitars, a crate of cups and nowhere else to go.
      The hall is shut, the port hall is worse than shut,
      and the burn festival is officially over as of ten.

      [Chorus - a step louder]
      Do not wake the cook, do not wake the cook,
      she has been on since four and she is asleep through that wall.
      Sing it if you want but sing it like a rumour,
      and whatever else happens tonight, keep it down.

      [Verse 2]
      You are sitting on the table with your boots off, laughing
      into your sleeve, which is the quietest you can manage,
      and every time somebody hits the crate too hard
      the whole room stops dead and looks at the wall.

      [Middle eight - almost spoken, band nearly silent]
      She fed four hundred people today on a broken burner.
      Keep the crate down. She has earned one quiet hour without us in it.

      [Verse 3]
      At two in the morning the door goes and it is her.
      She stands in it. She looks at the crate, and at the cups,
      and she says: not that one, that one is the good crate.
      And then she sits down and asks somebody to start again.

      [Chorus - full voice, whole crew]
      Do not wake the cook, do not wake the cook —
      too late, she is up, she is holding a cup and singing.
      Sing it now like it is the last hour of the festival.
      It is the last hour of the festival. Nobody is keeping anything down.

      [Outro - fade on the whole room]
