  - id: s_1225
    title: Open the Doors Slowly
    track_number: 6
    mood: [final, warm, hopeful]
    fact: >-
      The last line is what the Longwall hall's keeper says when a seal lifts, and Emre Talt holds
      the closing chord until the doors are actually open.
    arrangement_note: the closing chord is held until the hall's doors are physically open and the outside is audible on the take, which is why the end runs long
    intro: 4
    outro: cold
    target_duration: "4:10"
    prompt: >-
      50 BPM warm hopeful closing torch in a very large hall; high light male tenor quiet and
      unforced, plucked electronic strings holding one final chord for a very long time at the end
      with the outside becoming audible over it, one long held keyboard tone, upright bass, brushed
      kit, hard cold stop after the doors.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, fade ending
    lyrics: |
      [Intro - plucked strings, four seconds]

      [Verse 1]
      Word reached Bight Row early in the evening:
      by morning, both sea-wall gates would stand.
      Carrier waves repeated lifted, lifted.
      Every glass stopped halfway to a hand.
      Some began to laugh before believing.
      Some pulled folded tickets from their coats.
      One woman sat as if she had heard nothing,
      looking at the rain beyond the doors.

      [Chorus]
      Open the doors slowly. Do not throw them.
      Open the doors slowly. Let it in.
      We have learned the size of every closed room.
      Give our eyes a little time to change.

      [Verse 2]
      By midnight, cargo crews were loading.
      Ferry berths filled faster than the board.
      Eleven weeks of wanting somewhere elsewhere,
      then an open lane and too much choice.
      A hundred people stayed inside the long hall.
      Freedom waited plainly past the wall.
      Wanting out had held us all together.
      Getting out belonged to each alone.
      Some had dreamed so long of that first crossing
      they no longer knew exactly what came next.

      [Verse 3]
      The keeper crossed to where the two doors fastened.
      He put one hand against the swollen frame.
      Outside, a hauler moved along the wet road.
      Spring freight called its numbers through the rain.
      He drew the first door back and waited.
      Cold came in and travelled row by row.
      The woman who had stared beyond the doorway
      stood at last, but did not choose to go.
      He opened up the second without asking.
      Morning made a wide line on the floor.

      [Final Chorus]
      Open the doors slowly. Do not throw them.
      Open the doors slowly. Let it in.
      We have learned the size of every closed room.
      Give our eyes a little time to change.

      [Coda - one long chord held as the doors open and the outside becomes audible]
      Open the doors slowly. There is no hurry.
      It has been eleven weeks. Let the coast in.

      [Outro - cold stop after the doors]
