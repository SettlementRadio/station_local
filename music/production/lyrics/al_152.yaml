    intro: 10
    outro: sustain
    target_duration: "4:05"
    prompt: >-
      44 BPM hushed aching spare slow torch in a very large hall; high light male tenor quiet and
      breathy with long notes let go rather than stopped, plucked electronic strings, one long held
      keyboard tone, upright bass and no percussion of any kind, sustained ending.
    exclude: drums, brushed kit, percussion of any kind, piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - held tone and bass, ten seconds]

      [Verse 1]
      He went between two songs and he went properly,
      sitting up, in the corner, coat still on.
      Eleven weeks of nights will do that to a man
      and he is fifty-one and does the loading too —
      the cargo off the road, the kit, the cases,
      the whole of it, both ends, for eleven weeks.
      Nobody woke him. Nobody thought about it.
      The three of us just started the next one
      and it was four bars in before I understood
      what the enormous quiet underneath it was.

      [Verse 2]
      There is a thing that happens with no drums
      that I have not heard in eleven years of this.
      The hall comes forward. All of it. At once.
      Every foot of wall and every empty seat.
      The bass stopped holding anybody's time
      and started being the lowest thing in a room,
      and I sang about a third quieter than usual
      and it was still too loud by half. It was.

      [Refrain]
      Salt in everything and sleep in everything
      and a season with eleven weeks of dark.
      Let the man alone. He is not missing it.
      He is doing what the whole storm coast wants to do.

      [Verse 3]
      He woke at the end and said that he was sorry
      and we said nothing, having got a track out of it,
      and then we played the last one with him back
      and it was fine, and it was the ordinary thing.
      That is the record: forty ordinary hours
      and about six minutes where the room got in.
      You cannot arrange for that. You can only be there
      often enough that it eventually occurs.
      Forty nights is how you buy the six minutes.
      There is no other way of buying them at all.

      [Refrain]
      Salt in everything and sleep in everything
      and a season with eleven weeks of dark.
      Let the man alone. He is not missing it.
      He is doing what the whole storm coast wants to do.

      [Outro - bass and held tone sustaining]
