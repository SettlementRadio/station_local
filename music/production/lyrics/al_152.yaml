  - id: s_1221
    title: The Last Hour Each Night
    track_number: 2
    mood: [tired, tender, patient]
    fact: >-
      The band played the last hour of every night of that seal, and Sabin Loch closed all forty of
      them with this one.
    arrangement_note: the arrangement is the one the band arrived at by playing it forty times, and the break is where the fortieth night's version differed
    intro: 7
    outro: fade
    target_duration: "3:55"
    prompt: >-
      54 BPM tired tender patient slow torch in a very large hall; high light male tenor quiet and
      unforced with long notes let go rather than stopped, plucked electronic strings taking a
      fifteen-second break, one long held keyboard tone, upright bass, brushed kit, fade.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - plucked strings and bass, seven seconds]

      [Verse 1]
      The first night, she arrived after the dancing,
      hair still wet and work badge in her hand.
      She chose the table nearest to the doorway,
      kept her coat on, never tried to speak.
      No last ferry sounded through the weather.
      No closing hour could send her somewhere else.
      When the outer lamps went pale near morning,
      she left one empty cup upon the shelf.

      [Verse 2]
      By the tenth night, someone saved her table.
      By the twentieth, her coat came off.
      By the thirtieth, she brought a second cup
      and pushed it toward a tired woman from the docks.
      Small things changed without becoming promises.
      Every change took several nights to see.
      The sealed season narrowed all our distances.
      The final hour gave some of them relief.

      [Chorus]
      Last hour, every night, for eleven weeks.
      Last hour, and then the doors, and then the cold.
      Everything I learned about her kindness
      happened between four and five.

      [Instrumental - plucked electronic strings break, fifteen seconds]

      [Bridge]
      Repetition is a way of saying,
      "I came back. I thought you might be here."
      No one has to turn it into more than that.
      No one has to make the meaning clear.

      [Verse 3]
      On the fortieth, the board promised clearing.
      Morning ferries waited past the wall.
      She sat until the final light was lifted,
      then left both cups clean beside the hall.
      I watched her take the lane toward the harbour.
      She never turned. There was no need to turn.
      Somewhere up the relay she is waking
      in a room that sealed weather cannot reach.
      I still look once toward her table near four.
      Habit keeps an hour after people leave.

      [Final Chorus]
      Last hour, every night, for eleven weeks.
      Last hour, and then the doors, and then the cold.
      Everything I learned about her kindness
      happened between four and five.

      [Outro - held tone, fading]
