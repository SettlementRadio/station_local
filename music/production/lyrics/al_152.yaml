  - id: s_1225
    title: Open the Doors Slowly
    track_number: 6
    mood: [final, warm, hopeful]
    fact: >-
      The last line is what the Longwall hall's keeper says when a seal lifts, and Emre Talt holds
      the closing chord until the doors are actually open.
    arrangement_note: the closing chord is held until the hall's doors are physically open and the outside is audible on the take, which is why the end runs long
    intro: 4
    outro: cold
    target_duration: "4:10"
    prompt: >-
      50 BPM warm hopeful closing torch in a very large hall; high light male tenor quiet and
      unforced, plucked electronic strings holding one final chord for a very long time at the end
      with the outside becoming audible over it, one long held keyboard tone, upright bass, brushed
      kit, hard cold stop after the doors.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, fade ending
    lyrics: |
      [Intro - plucked strings, four seconds]

      [Verse 1]
      The seal lifts at a time somebody decides
      and the word goes round the row before the board.
      Everybody knows an hour before it's posted.
      Nobody out here has ever known how.
      It is not the carrier wave. It is not the board.
      It is somebody's cousin at the harbour office.
      The hall was still full when it came through that night
      and the whole room turned around to face the door
      and the dance band played on for about a minute
      to four hundred backs, and finished, and came off.

      [Verse 2]
      Then it was ours, as it had been for weeks,
      with eleven days of everybody's patience
      spent, and the crates already being loaded,
      and half the room with somewhere they could go —
      a berth, a road, a crossing, a relay seat,
      eleven weeks of not being where they live.
      A hundred stayed. I do not know why they stayed.
      There was a boat and a road and a lifted season
      and a hundred people sat down on a wet floor
      and let us take the last hour of the seal.

      [Chorus]
      Open the doors slowly. Do not throw them.
      Open the doors slowly. Let it in.
      There is a whole coast out there and it is freezing
      and every one of us has waited weeks.

      [Verse 3]
      He held the last chord while the keeper walked it,
      both doors, one at a time, the whole way back,
      and you can hear the weather arrive across it,
      and the sea, and somebody's hauler on the road,
      and the first cargo of the spring going by.
      It runs about a minute past the ending.
      The house asked whether we would like it shortened.
      We said no, and they printed it entire,
      and it is the last thing on the record. Here:

      [Coda - the doors opening, the outside audible]
      Open the doors slowly. There is no hurry.
      It has been eleven weeks. Let the coast in.

      [Outro - cold stop after the doors]
