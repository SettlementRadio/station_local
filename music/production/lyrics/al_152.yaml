  - id: s_1223
    title: The Slow Hour Pays
    track_number: 4
    mood: [dry, wry, midtempo]
    fact: >-
      The hall pays the dance bands by the night and Nine Lamps by the hour, which Sabin Loch has
      called the only honest arrangement on the coast.
    arrangement_note: the most conversational vocal on the record, almost spoken in the verses without ever leaving the sung line
    intro: 6
    outro: cold
    target_duration: "3:45"
    prompt: >-
      68 BPM dry wry midtempo slow torch in a very large hall; high light male tenor quiet and almost
      conversational but always sung, plucked electronic strings taking a thirteen-second break, one
      long held keyboard tone, upright bass, brushed kit, hard cold stop.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, spoken or rapped sections, dance and modern studio production, fade ending
    lyrics: |
      [Intro - bass and plucked strings, six seconds]

      [Verse 1]
      They pay the dance bands by the night, in full,
      whatever happens, whoever comes, whatever.
      That is a fee and it is a proper fee
      and I would take it if it were on offer.
      They pay us by the hour, which is different,
      and everybody thinks that it is worse.
      An hour is an hour. It is measurable.
      A night is whatever the hall decides it was.
      A hauler crew gets paid against a manifest.
      Nobody argues with a manifest either.

      [Verse 2]
      I have been in three arguments about a night.
      Not one of them was ever settled properly.
      A night began when somebody says it began
      and finished when the man with the keys was tired.
      Nobody has ever argued with a clock.
      You start, and then you stop, and it is counted,
      and the money that arrives is the same money
      whether they liked it or they did not like it.
      That is the only wage out on this storm coast
      that has never once been settled by a mood.

      [Chorus]
      By the hour, and the hour is what we play.
      By the hour, and I have never once been short.
      Everybody tells me I should ask for a fee.
      Everybody telling me is owed one.

      [Instrumental - plucked electronic strings break, thirteen seconds]

      [Verse 3]
      There is one hall on this coast that pays like that
      and I have stayed with it eleven years for the reason.
      Not loyalty. I would go tomorrow, gladly,
      if somebody would count the same way twice.
      A fair arrangement is not a kind arrangement.
      Nobody down here is being kind to anyone.
      It is only that a clock cannot be argued with
      and that is the whole of what I am asking for.

      [Chorus]
      By the hour, and the hour is what we play.
      By the hour, and I have never once been short.
      Everybody tells me I should ask for a fee.
      Everybody telling me is owed one.

      [Outro - cold stop]
