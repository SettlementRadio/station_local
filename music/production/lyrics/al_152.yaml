  - id: s_1222
    title: Nobody Went Home
    track_number: 3
    mood: [warm, communal, slow]
    fact: >-
      Nera Bly counts the room in at the top of the song, and the number is the one the hall's door
      keeper handed her on a slip that night.
    arrangement_note: a spoken count of the room off a paper slip at the top, kept on the take, and the bass comes in on the number
    intro: 5
    outro: fade
    target_duration: "3:50"
    prompt: >-
      58 BPM warm communal slow torch in a very large hall; a quiet spoken number read off a slip of
      paper at the top and kept, then high light male tenor quiet and unforced, plucked electronic
      strings, one long held keyboard tone, upright bass entering on the number, brushed kit, fade.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - a spoken count read off a slip, then bass, five seconds]
      A hundred and forty-one.

      [Verse 1]
      Half past four, the dance floor bare and shining.
      The last hauler had already cleared the coast.
      Still, a hundred forty-one found chairs there,
      strangers tired of being tired alone.
      A cook sat down beside a relay worker.
      Two cleaners shared an orange by the wall.
      A boy asleep across his father's jacket
      never knew the loud room had gone small.
      His father kept one hand across his ankle.
      Each outer footstep made the fingers tighten.

      [Chorus]
      Nobody went home. Nobody could.
      Nobody went home and it was better.
      Every locked road brought us to one room.
      Every empty chair became a shelter.

      [Verse 2]
      Eleven weeks had worn the news to nothing.
      Everyone had heard each story twice.
      The cook knew when the relay worker's shift changed.
      One cleaner knew the father missed his wife.
      Familiarity had lost its manners.
      People let the quiet show on them.
      No one had to make the hour important.
      Staying was enough to make it real.

      [Bridge]
      Count the bodies, not the reasons.
      Reasons alter when the weather clears.
      Count the coats along the cold wall.
      Count the hands that set down fear.

      [Verse 3]
      Eleven days later, the seal lifted.
      Cargo moved and ferries filled by noon.
      The cook took inland work beyond the siding.
      The relay worker left the following June.
      The cleaners stayed. The father found his crossing.
      The boy grew past the jacket on the chair.
      Ask them why they spent that Tuesday waiting.
      Each will say there was no road from there.
      None will say how good the room became
      when nobody had anywhere to go.

      [Final Chorus]
      Nobody went home. Nobody could.
      Nobody went home and it was better.
      Every locked road brought us to one room.
      Every empty chair became a shelter.

      [Outro - bass and held tone, fading]
