# **The last record of the genre and the last of the 55.** The sealed season of 2623 ran eleven weeks
# and the band played the last hour of forty nights of it in the Longwall hall, after Cordon Hours
# had finished and most of the room had gone. Six of those hours were recorded and this is what came
# out of them, issued in 2624 while the rest of the industry was in Concordance booking the reopened
# hall — which is `al_150`, made in the same year by the other band on the same house, and the two
# records do not mention each other.
#
# The hall's keeper left the lamps on past his own hours for every one of the six and is the only
# person outside the band named on the sleeve. He is `s_1220` and he is the last line of `s_1225`,
# which is what he says when a seal lifts.
#
# `s_1224` has no drums on it at all, because the drummer was asleep in the corner between two songs
# and the other three played it without him. It is the only track on either Nine Lamps record with
# no kit.
