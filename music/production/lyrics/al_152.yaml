    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending, close-miking the room
    lyrics: |
      [Intro - held tone and plucked strings, sixteen seconds]

      [Verse 1]
      Fortieth night, and the seal has three days left,
      and the hall has had four hundred in it since eight.
      They have gone. The floor is wet and full of paper.
      There are nine of them left and one of them is staff.
      It is ten past four and we are due to start
      and the keeper is standing by the switch and does not throw it.
      He looks at us. We look at him. He shrugs.
      And that is how the lamps stayed up all six nights.

      [Verse 2]
      He is not paid past four. Nobody is.
      He has a family up the row and a bed in it
      and he has stayed an extra hour six times
      for four people playing to almost nobody.
      He will not take anything. We have offered twice.
      He said the second time that he would like it
      if his name went on the back of it in full,
      which is the cheapest thing that anyone has asked us.

      [Chorus]
      Lamps left burning in an empty room.
      Somebody upstairs decided not to.
      That is the whole of it and it is enough
      to have made a record out of. Here it is.

      [Verse 3]
      A sealed season is eleven weeks of inside.
      By the fortieth night you know each other's coats.
      The dance crowd and the nine who stay behind
      and the woman on the door and the keeper and us.
      That is a settlement, whatever else it is.
      Nobody chose it. The weather chose it for them.
      And the last hour of it every night was ours
      and no one from the core has ever heard it.

      [Chorus]
      Lamps left burning in an empty room.
      Somebody upstairs decided not to.
      That is the whole of it and it is enough
      to have made a record out of. Here it is.

      [Outro - the hall, fading]
