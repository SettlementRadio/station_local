    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - plucked strings and bass, seven seconds]

      [Verse 1]
      Forty nights and this one at the end of each.
      Not because it is the best thing that we have.
      Because it finishes, which is a quality
      that about four songs in a hundred have.
      You can hear the room decide to put its coat on
      somewhere around the middle of the second verse
      and that is not a failure, that is the job,
      and a closer that will not close is a bad closer.
      Out here a sealed season has no last ferry
      and somebody has to say when it is over.

      [Verse 2]
      It changed across the season, slowly, nightly,
      the way a thing does when nobody is watching.
      By about the twentieth it had lost a section.
      By the thirtieth the bass had changed its mind.
      Nobody discussed a bar of it out loud.
      Forty repetitions and a room
      will do more to a song than any argument,
      and none of us could put it back if asked.

      [Chorus]
      Last hour, every night, for eleven weeks.
      Last hour, and then the doors, and then the cold.
      Everything I know about this coast
      I learned between about four and about five.

      [Instrumental - plucked electronic strings break, fifteen seconds]

      [Verse 3]
      The fortieth one is the one that got recorded
      and it is the one that is the least like the first,
      and somewhere in a hall on a wet Tuesday
      is the version I would rather you had heard.
      That one is gone. It went the way they go.
      There is no tape of a room that is not recorded.
      What there is, is this, at the end of the season,
      played by four people who had done it enough.
      It went up the relay in the spring to strangers.
      I hope the room came with it. It may not have.

      [Chorus]
      Last hour, every night, for eleven weeks.
      Last hour, and then the doors, and then the cold.
      Everything I know about this coast
      I learned between about four and about five.

      [Outro - held tone, fading]
