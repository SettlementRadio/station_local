  - id: s_1223
    title: The Slow Hour Pays
    track_number: 4
    mood: [dry, wry, midtempo]
    fact: >-
      The hall pays the dance bands by the night and Nine Lamps by the hour, which Sabin Loch has
      called the only honest arrangement on the coast.
    arrangement_note: the most conversational vocal on the record, almost spoken in the verses without ever leaving the sung line
    intro: 6
    outro: cold
    target_duration: "3:45"
    prompt: >-
      68 BPM dry wry midtempo slow torch in a very large hall; high light male tenor quiet and almost
      conversational but always sung, plucked electronic strings taking a thirteen-second break, one
      long held keyboard tone, upright bass, brushed kit, hard cold stop.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, spoken or rapped sections, dance and modern studio production, fade ending
    lyrics: |
      [Intro - bass and plucked strings, six seconds]

      [Verse 1]
      She came in with manifest ink on both hands,
      twelve hours of cargo pulling at her back.
      Her crew had missed the berth by seven minutes.
      The next hauler would not clear till eight.
      She bought one drink and counted out the smallest.
      She chose a chair that faced away from clocks.
      Nothing in her posture asked for company.
      Nothing in the room required her strength.

      [Refrain]
      A slow hour pays in smaller breathing.
      It pays in hands that finally lie still.
      Keep your coins. The night has taken plenty.
      Let the empty room return your name.

      [Verse 2]
      At twenty past, she loosened both her shoulders.
      At half, she set the work badge on the table.
      Near the end, she looked toward the windows
      where sealed-season rain had started straight.
      A clock can count the distance between burdens.
      It cannot set the worth of what it keeps.
      For sixty minutes she belonged to no shift,
      no loaded lane, no foreman, and no sleep.

      [Instrumental - plucked electronic strings break, thirteen seconds]

      [Verse 3]
      At five, the harbour channel called her number.
      She pinned the work badge underneath her coat.
      Before she left, she turned the chair toward morning,
      ready for the next one off the road.
      She paused beside the airlock, shoulders level.
      Then walked back steadily toward the cargo lights alone.
      That was all. No promise and no rescue.
      Just a body given back an hour.
      On the storm coast, rest is often borrowed.
      Still, what has been borrowed can be ours.

      [Coda]
      The clock moves on. The chair stays by the window.
      Another freight light turns along the wall.

      [Final Refrain]
      A slow hour pays in smaller breathing.
      It pays in hands that finally lie still.
      Keep your coins. The night has taken plenty.
      Let the empty room return your name.

      [Outro - cold stop]
