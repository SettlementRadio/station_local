    intro: 10
    outro: sustain
    target_duration: "4:05"
    prompt: >-
      44 BPM hushed aching spare slow torch in a very large hall; high light male tenor quiet and
      breathy with long notes let go rather than stopped, plucked electronic strings, one long held
      keyboard tone, upright bass and no percussion of any kind, sustained ending.
    exclude: drums, brushed kit, percussion of any kind, piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - held tone and bass, ten seconds]

      [Verse 1]
      He fell asleep upright in the corner,
      coat still fastened, cargo gloves still on.
      Salt had dried in pale lines at his shoulders.
      Eleven weeks of night had brought him down.
      No one touched him. No one called it weakness.
      Someone moved a chair beneath his feet.
      The whole cold hall made room around his breathing.
      Even tired strangers kept it clean.

      [Verse 2]
      He had worked the first hauler before daylight,
      carried cases when the dance room closed,
      sent half his wage along the inland relay,
      taken every hour that no one chose.
      Sealed season makes a virtue out of staying,
      till a body cannot tell duty from need.
      Sleep came through him like an opened airlock.
      For once, the storm coast asked no more.

      [Refrain]
      Salt in everything and sleep in everything
      and a season with eleven weeks of dark.
      Let the man alone. He is not missing it.
      He is doing what the whole storm coast wants to do.

      [Bridge]
      Keep the door against the loading weather.
      Let the last ferry leave without his weight.
      Work will know exactly where to find him.
      Rest is the one thing that will not wait.

      [Verse 3]
      Near six, he woke and reached for both his gloves.
      Shame arrived before his eyes were clear.
      He said, "I should have stayed awake beside you."
      I said, "You stayed. You simply slept in here."
      Someone brought him water from the bar sink.
      Someone found a dry scarf for his neck.
      He stood slowly, older than the evening,
      then left one glove behind upon the step.
      I keep it where the salt line meets the window,
      proof that even work must lose its grip.

      [Final Refrain]
      Salt in everything and sleep in everything
      and a season with eleven weeks of dark.
      Let the man alone. He is not missing it.
      He is doing what the whole storm coast wants to do.

      [Outro - bass and held tone sustaining]
