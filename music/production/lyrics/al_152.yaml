    lyrics: |
      [Intro - held tone and plucked strings, sixteen seconds]

      [Verse 1]
      The dance floor emptied shortly after four.
      Wet paper crossed the boards beneath our shoes.
      Nine people stayed beneath the high lamps:
      one freight worker, two cleaners, someone bruised,
      a woman with a sleeping child beside her,
      three who had already missed last ferry,
      and the keeper with his hand beside the switches.
      He looked across the room and left it bright.

      [Refrain]
      Lamps left burning in an empty room.
      Lamps left burning past the final hour.
      Stay until your coat has lost the weather.
      Stay until the child begins to wake.

      [Verse 2]
      His own rooms waited somewhere up the row.
      A cup sat clean beside his kitchen basin.
      Still, he brought more heat into the low hall
      and set a folded blanket on the chair.
      The woman woke and thanked him without speaking.
      He nodded once and checked the outer lane.
      Kindness at that hour had no performance.
      It was one person choosing not to close.

      [Bridge]
      Sealed season teaches narrow mercies:
      room on a bench, dry socks, an extra light.
      No one calls them grand enough for stories.
      Everyone remembers them at night.

      [Verse 3]
      By five, the cleaners turned the final tables.
      One by one, the stranded stood to leave.
      The freight worker took the child across one shoulder.
      Her mother fastened both their sleeves.
      Outside, storm-coast morning found the windows.
      Inside, warmth remained above each chair.
      The child woke smiling at the ceiling light.
      The keeper waited till the last coat crossed him,
      then lowered every switch except the stair.
      A settlement is built from hours like that one:
      borrowed, ordinary, freely spared.

      [Final Refrain]
      Lamps left burning in an empty room.
      Lamps left burning past the final hour.
      Stay until your coat has lost the weather.
      Stay until the child begins to wake.

      [Outro - the hall, fading]
