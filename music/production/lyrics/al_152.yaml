    The Longwall hall on Meridian's storm coast across the sealed season of 2623, six nights out of
    forty, recorded after the dance band had finished and most of the room had gone — a very large
    cold hall with the lamps still up. The card holds throughout: high light male tenor, quiet and
    unforced and almost breathy at the top, long notes let go rather than stopped; synth-harpsichord
