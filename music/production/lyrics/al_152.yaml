      keeper handed her on a slip that night.
    arrangement_note: a spoken count of the room off a paper slip at the top, kept on the take, and the bass comes in on the number
    intro: 5
    outro: fade
    target_duration: "3:50"
    prompt: >-
      58 BPM warm communal slow torch in a very large hall; a quiet spoken number read off a slip of
      paper at the top and kept, then high light male tenor quiet and unforced, plucked electronic
      strings, one long held keyboard tone, upright bass entering on the number, brushed kit, fade.
    exclude: piano, guitar, backing vocals, saxophone and brass, orchestral strings, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - a spoken count read off a slip, then bass, five seconds]

      [Verse 1]
      A hundred and forty-one. She read it out.
      The woman on the door had counted them in
      and wrote it on a slip and handed it over
      because she thought that we would like to know.
      A hundred and forty-one at half past four
      in a hall that holds nine hundred when it wants to.
      The dance had finished ninety minutes back
      and the last hauler off the coast had gone at two.
      Nobody went home. That is the whole song.

      [Verse 2]
      It was the twenty-second night of eleven weeks
      and everybody in the place was sick of everybody.
      That is what a seal does by about then.
      The same four hundred faces and no exit.
      Nobody had come in off the relay in weeks.
      Nobody had anything to say that was new.
      And a hundred and forty-one of them sat down
      after the loud part, in the cold, and stayed,
      and about a third of them were not the kind
      who would admit in daylight that they had.

      [Refrain]
      Nobody went home. Nobody could.
      Nobody went home and it was better.
      There is a difference between the two of those
      and by the end of a season there is not.

      [Verse 3]
      The seal lifted eleven days after that
      and the first crate off the coast took half the room.
      Everybody who could go, went, and quickly,
      and I have never blamed a single one of them.
      But there was a Tuesday in the middle of the winter
      with a hundred and forty-one in a wet hall
      who had nowhere to be and stayed on anyway,
      and I would put that against most things I know.
      They will not tell you that in the storm season.
      They will tell you they were waiting for a boat.

      [Refrain]
      Nobody went home. Nobody could.
      Nobody went home and it was better.
      There is a difference between the two of those
      and by the end of a season there is not.

      [Outro - bass and held tone, fading]
