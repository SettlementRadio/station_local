  - id: s_0843
    title: Saltwater Boots
    track_number: 4
    mood: [plain, midtempo, cold]
    fact: >-
      Saira Dunn's piano is a quarter-tone flat for the whole track because it would not hold pitch in
      the cold and the band would not move rooms.
    arrangement_note: the piano is a quarter-tone under everything and never corrected, so the guitar and the voice both lean away from it, which is the sound of the record and is worst here
    intro: 10
    outro: fade
    target_duration: "3:50"
    prompt: >-
      94 BPM cold blues; gravel baritone, quarter-flat piano, acoustic guitar, rim-and-skin kit, fade.
    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, in-tune piano, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano and guitar, ten seconds]

      [Verse 1]
      Salt water finds the stitching before the leather knows.
      One black line appears along the outer heel.
      By midday, every step releases what came in.
      By shift end, both socks carry the under-ice cold.
      The issue desk calls this pair within its working life.
      My feet call every metre back to the airlock.
      Neither voice has power over next spring's allowance.

      [Refrain]
      Salt water in the boots and salt water in the seam.
      It gets in and it stays in and it takes the leather off.
      Two pairs a year, and the second pair is never as good.

      [Verse 2]
      First pair comes with spring shift and a signature.
      Second comes from ration credit priced beyond a week.
      Somewhere dry, a purchasing clerk approved the seam.
      Somewhere wet, four hundred workers test it daily.
      No manifest records the hours spent changing socks,
      or every careful strip of sealing cloth at night.
      Cheap equipment makes expensive rituals at home.

      [Refrain]
      Salt water in the boots and salt water in the seam.
      It gets in and it stays in and it takes the leather off.
      Two pairs a year, and the second pair is never as good.

      [Verse 3]
      You wait beside the heater with the patching needle,
      turn each boot beneath the lamp and find the weaker edge.
      I say the pair is finished. You refuse the office verdict.
      One close stitch, one seal, one night beneath the pipe.
      Morning finds the leather ugly, stiff and holding.
      Care does not make poor material become fair.
      It only gets a tired person through another shift.

      [Final Refrain]
      Salt water in the boots and salt water in the seam.
      It gets in and it stays in and it takes the leather off.
      Two pairs a year, and your repair outlasts them both.

      [Outro - fade]
