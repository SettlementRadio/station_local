  - id: s_0844
    title: Ask Me When I'm Dry
    track_number: 5
    mood: [funny, shuffling, warm]
    fact: >-
      Tel Brask plays the harmonica through a lamp horn, which is how he played it in the canteens so
      it would carry down a gallery.
    arrangement_note: fourteen seconds of harmonica through a metal lamp horn with a long ring behind it, which is the band's most copied trick and the only instrumental passage on the record
    intro: 6
    outro: fade
    target_duration: "3:40"
    prompt: >-
      106 BPM shuffle; gravel baritone, horn-played harmonica break, guitar, flat piano, rim kit, fade.
    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, amplified or effected harmonica, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - harmonica through a metal horn, six seconds]

      [Verse 1]
      I come through the airlock with my coat still running,
      nine hours of gallery water gathered at the hem.
      You have kept the evening meal above the ration heater.
      Before I reach the chair, you ask if I am happy.
      A kind question can arrive at an unkind hour.
      My answer lands too hard against the metal room.
      The lamp horn sends it farther than I meant.

      [Chorus]
      Ask me when I am dry and I will give you an answer.
      Ask me now and you will get whatever comes out.
      I have been wet for nine hours; do not trust the first reply.

      [Verse 2]
      You take your cup and leave mine on the table,
      no slammed door, no speech rehearsed for me to lose.
      Water forms a dark ring underneath my elbows.
      Steam lifts slowly from the meal you kept from cooling.
      In the quiet, every cruel word returns with edges.
      Tiredness may explain a wound; it does not close it.
      I wait until my working hands belong to me again.

      [Instrumental - harmonica through the horn, fourteen seconds]

      [Chorus]
      Ask me when I am dry and I will give you an answer.
      Ask me now and you will get whatever comes out.
      I have been wet for nine hours; do not trust the first reply.

      [Verse 3]
      Forty minutes later, both boots stand by the pipe.
      I find you in the next room reading weather changes.
      The honest answer is not simple, only kinder:
      mostly yes, sometimes no, never because of you.
      You look once at the coat still dripping by the door.
      Tomorrow we will choose a better hour for questions.
      Tonight I wash the cups and ask to start again.

      [Final Chorus]
      Ask me when I am dry and I will give you an answer.
      Ask me now; I have waited for the true reply.
      Mostly yes, and yes to you, and sorry for the rest.

      [Outro - fade]
