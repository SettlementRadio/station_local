  - id: s_0848
    title: Walk Out Together
    track_number: 9
    mood: [communal, final, warm]
    fact: >-
      The local's whole night shift sings the last chorus, about forty people, and the sleeve credits
      them under the branch number rather than by name.
    arrangement_note: about forty people who came off a shift sing the last chorus at whatever distance they were standing at, ragged, in three keys and a beat behind the band, and nobody moved them
    intro: 12
    outro: fade
    target_duration: "4:00"
    prompt: >-
      102 BPM warm blues; gravel baritone, ragged 40-voice finale, guitar, flat piano, harmonica, fade.
    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, blended or studio choir, drum machines, large hall reverb, cymbals, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano and guitar, twelve seconds]

      [Verse 1]
      Forty workers leave the under-ice deck at eleven,
      wet coats dark, pay slips folded in their gloves.
      The second airlock opens; nobody steps through.
      One grievance stands alone beside the closing gate.
      Then another shoulder settles level with it.
      No speech has called them. No office light goes out.
      A shift becomes a body by refusing to divide.

      [Chorus]
      Walk out together or do not walk out at all.
      One is easy to dismiss and hard to keep employed.
      Forty is the number power has to answer.

      [Verse 2]
      Management sends one message to each separate locker:
      delays are under review, return to scheduled work.
      The branch has heard those careful words for four wet months.
      A woman near the ladder folds her message twice,
      puts it underneath the empty boot of the grievance.
      Thirty-nine more notices make paper hold its ground.
      The gate alarm complains; the line does not move.

      [Chorus]
      Walk out together or do not walk out at all.
      One is easy to dismiss and hard to keep employed.
      Forty is the number power has to answer.

      [Verse 3]
      At midnight, office doors unlock above the deck.
      The answer comes in pieces, smaller than the demand.
      Nobody cheers; a partial wage remains a partial wage.
      Still the first concession crosses through the airlock.
      Forty workers lift their coats and take the homeward gallery,
      not in step, not one key, not clean enough for slogans.
      The sound arrives one beat behind and fills the works.
      The wet floor carries every answer upward.

      [The night shift - forty voices, ragged and unpitched]
      WALK OUT TOGETHER. WALK OUT TOGETHER.

      [Final Chorus]
      Walk out together or do not walk out at all.
      One is easy to dismiss and hard to keep employed.
      Forty is the number power has to answer.
      Walk home together. Come back together. Count again.

      [Outro - fade]
