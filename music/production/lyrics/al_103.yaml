  - id: s_0845
    title: The Second Gate
    track_number: 6
    mood: [slow, blue, still]
    fact: >-
      About a man who worked the second gate for thirty years; he heard the record when it came out
      and told the band he did not recognise himself in it.
    arrangement_note: the last verse is the correction and it was written after the man had spoken to the band, so it sits on the end of a song that has already made its mind up
    intro: 17
    outro: sustain
    target_duration: "4:20"
    prompt: >-
      68 BPM slow triplet blues; tired gravel baritone, flat piano, guitar, rim-and-skin kit, held end.
    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, vocal tuning, whispered or rapped sections, modern studio production, cold ending, fade-out
    lyrics: |
      [Intro - piano triplets, seventeen seconds]

      [Verse 1]
      Thirty years at second airlock, day and night rotation.
      Every manifest arrives beneath my working hand.
      Cargo inward, workers outward, one lamp over everything.
      I know the sound of every seal along this gallery.
      Knowing is not loving. Staying is not choosing.
      A stool can fit the body and still not be a home.

      [Verse 2]
      My family crossed the cargo road before the last closure,
      found a Mars-side room and work beside a warmer gate.
      I filed for transfer first year, fifth year, then the tenth.
      Each reply praised continuity at this essential post.
      Praise is cheaper than a berth on any outbound hauler.
      Duty is the word an office uses when it means no.

      [Refrain]
      The second gate, the second gate, the same lamp every shift.
      Do not call me rooted when the lock is on your side.
      I have wanted more than this for thirty years.

      [Verse 3]
      Relay calls arrive with children turning older,
      voices crossing distance bodies cannot cross.
      They know the kettle, stool and gate from what I show them.
      I know their rooms by corners in a narrow screen.
      Love survives on schedules; that is not the same as living.
      Another manifest slides underneath the glass.

      [Refrain]
      The second gate, the second gate, the same lamp every shift.
      Do not call me rooted when the lock is on your side.
      I have wanted more than this for thirty years.

      [Final Verse]
      Tonight I leave the transfer form above the ledger,
      unsigned by the office, signed by me again.
      Morning may return it with the usual reason.
      Morning may surprise a man who stopped expecting.
      Either way, this gate is work and not my nature.
      I turn the lamp down. I do not call it home.
      I send it anyway.

      [Outro - sustain]
