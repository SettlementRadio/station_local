  - id: s_0846
    title: Two Shifts, No Sleep
    track_number: 7
    mood: [tired, driving, hard]
    fact: >-
      Cut at the end of a double shift and Hob Venner's voice fails on the last verse, which the band
      kept on the grounds that it was accurate.
    arrangement_note: the lead voice gives out in the third verse and comes back for the last line, and there is no second take anywhere on this record to put in its place
    intro: 4
    outro: cold
    target_duration: "3:20"
    prompt: >-
      118 BPM hard blues; gravel baritone fails in verse three, guitar, flat piano, harmonica, stop.
    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, clean or unstrained vocal, vocal tuning, whispered or rapped sections, modern studio production, fade-out
    lyrics: |
      [Intro - full band, four seconds]

      [Verse 1]
      First shift starts before the sleeping block is stirring.
      Second starts when daylight feed turns white above the deck.
      By the overlap, my hands have lost one glove between them.
      By the evening ration, both clocks disagree.
      The scrubber keeps one note beneath the whole sixteen hours.
      I carry it through airlock, canteen, cup and chair.
      Sleep has become a place the lift no longer reaches.

      [Chorus]
      Two shifts and no sleep and a canteen at the end of it.
      Call it ordinary; ordinary still has weight.
      Ask the hands that miss the cup and catch it anyway.

      [Verse 2]
      A desk above the ice calls overlap efficient.
      Down here, one worker signs the same load twice,
      one forgets the north valve and remembers at the ladder,
      one hears a child inside the gallery alarm.
      Nobody is careless; care has simply spent itself.
      The branch sends figures upward. Thanks come downward.
      Neither one can keep an overtired hand from shaking.
      No schedule counts the mistakes exhaustion nearly makes invisible.

      [Chorus]
      Two shifts and no sleep and a canteen at the end of it.
      Call it ordinary; ordinary still has weight.
      Ask the hands that miss the cup and catch it anyway.

      [Verse 3 - the voice goes]
      I reach the canteen door and lose the word for doorway.
      Coat on the chair, head in my hands, light going—
      [Voice fails]
      Someone moves the hot cup safely from my elbow.
      Someone takes the next shift card out of my pocket.
      The room stays still until my breathing finds its level.
      I can say one thing clearly: do not call this harmless.

      [Final Chorus]
      Two shifts and no sleep and a canteen at the end of it.
      Call it ordinary; ordinary still has weight.
      Ask the voice that left and came back for the warning.

      [Outro - cold stop]
