songs:
  - id: s_0840
    title: Nothing Dries Down Here
    track_number: 1
    mood: [wry, rolling, midtempo]
    fact: >-
      Hob Venner wrote the chorus on the back of a grievance form and the form is reproduced on the
      sleeve of the Europa pressing.
    arrangement_note: the flat piano is most audible here because the guitar sits out of the choruses entirely, which was not planned and was kept once everybody heard what it did
    intro: 8
    outro: fade
    target_duration: "3:45"
    prompt: >-
      100 BPM damp blues; tiring gravel baritone, flat piano, guitar, rim-and-skin kit, hiss, fade.
    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - guitar and piano, eight seconds]

      [Verse 1]
      She hangs two work coats over pipes above the scrubber,
      one from day shift, one still dripping from the night.
      Morning finds the shoulders dark and both sleeves heavy.
      She pulls the colder one around her working shirt.
      At the airlock, someone laughs and says it suits the weather.
      Under ice, a joke is what you use before a grievance.
      The wet has learned the shape of everybody here.

      [Chorus]
      Nothing dries down here. Nothing has ever dried down here.
      Hang it for a week; the water only changes pockets.
      Take the boots off anyway. Refuse to call it normal.

      [Verse 2]
      Four hundred coats breathe steam into one narrow room.
      Warm pipes knock behind them; nothing leaves the air.
      Gloves bloom white along the seams by supper.
      Boot leather softens, cracks, then opens at the heel.
      The works counts heat supplied and marks the standard met.
      Nobody measures water carried home in clothing,
      or the ration cells spent drying socks beside a stove.

      [Chorus]
      Nothing dries down here. Nothing has ever dried down here.
      Hang it for a week; the water only changes pockets.
      Take the boots off anyway. Refuse to call it normal.

      [Verse 3]
      At home she peels the work coat from her shoulders,
      lays it by the door so it cannot wet the bed.
      A child asks why the ceiling drips when ice lies overhead.
      She puts one metal bowl beneath the faithful leak,
      opens the grievance form and smooths it on her knee.
      A complaint begins wherever patience stops pretending.
      Tonight the bowl and every signature fill slowly.

      [Final Chorus]
      Nothing dries down here. Nothing has ever dried down here.
      Hang it for a week; the water only changes pockets.
      Take the boots off anyway. Refuse to call it normal.
      Leave the wet form at the gate where no one can ignore it.

      [Outro - fade]
