    lyrics: |
      [Intro - guitar in the gallery, twenty seconds]

      [Verse 1]
      You stand beyond the scrubber plant at gallery east.
      I stand by the ladder where the warning lamps begin.
      Nine hundred feet of metal keeps our bodies separate.
      I call your working number; four seconds later
      my own voice reaches back before your answer starts.
      Anger sounds less certain when the room returns it.
      Cold makes every distance feel officially measured.

      [Refrain]
      Down in the ice yard, where everything you say comes back
      four seconds older, wearing edges you did not intend.
      Leave a space for me. I am trying to answer.

      [Verse 2]
      We learned this conversation during first storm season:
      speak one line, then wait through its returning shadow.
      No interruption travels clean across the gallery.
      No quick defence can climb above the older words.
      Tonight you say the transfer came and you are taking it.
      My answer leaves too fast, collides with what I said before.
      Silence is the only room where both can land.

      [Refrain]
      Down in the ice yard, where everything you say comes back
      four seconds older, wearing edges you did not intend.
      Leave a space for me. I am trying to answer.

      [Verse 3]
      At last I say I knew this gate would never hold you.
      The gallery repeats it softer toward the east.
      Your reply begins before the final echo leaves me:
      knowing is not kindness, letting go is not enough.
      We walk toward the middle through the scrubber dark,
      each step taking distance from the measured floor.
      Four seconds shrink to three, then two, then breath.
      At halfway, neither voice needs the gallery to travel now.

      [Final Refrain]
      Down in the ice yard, where everything you say comes back
      four seconds older, wearing edges you did not intend.
      There is room between the echoes. Meet me there.

      [Coda - sustain, gallery decay]
