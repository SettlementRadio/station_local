# of its own funds after the works refused, which is why the Europa sleeve carries a branch number
# where a producer's name goes.
#
# **The cold is in the arrangement and not in the words.** Saira Dunn's piano could not be brought to
# pitch and she played it a quarter-tone flat rather than move rooms, which is `s_0843` and is audible
# under everything else on the record. Marta Ospel's kit has no cymbals, taken off because the
# gallery's four-second decay made them unusable, so nothing here has a bright top end and the whole
# band plays harder to make up for it.
#
# **Two things fight the style card and both are resolved the wiki's way** (D-096). `s_0847` was cut
# in the nine-hundred-foot gallery and its four-second decay is the room — so that song's exclude line
# drops the card's `large hall reverb` and asks for the decay by name, where every other song on the
# record keeps it out. And **this band has no bass player**: the wiki's line-up is guitar, piano,
# harmonica and drums, so every exclude line here keeps a bass of any kind out, rather than relying on
# the card's `electric bass` to do it (§7, no line-up gains a player).
#
# `generation:` and every `take:` were filled from the dispatch manifest at M-34. Generated on
# 2026-09-02 on Suno v5.5 — **not on the second generator the card had planned for**, so nothing
# here is split across vendors and no new evidence file was needed. Eight of the nine takes match
# their lyric exactly; s_0844 sings the whole lyric and then repeats 51 words of it, which is
# recorded in that song's `take:` block and drops nothing (D-093: the take broadcasts as it is).
# The whole record was cut in four minutes fifteen, which is the fastest sitting in the catalogue.

