    track_number: 8
    mood: [cold, spacious, slow]
    fact: >-
      Recorded in the gallery rather than the canteen, and the four-second decay on it is the room and
      not anything the recording did.
    arrangement_note: four people standing well apart in a nine-hundred-foot gallery, one microphone, four seconds of decay on everything, and no piano because it could not be got in there
    intro: 20
