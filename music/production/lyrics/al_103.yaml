  - id: s_0841
    title: The Long Ladder
    track_number: 2
    mood: [driving, hard, steady]
    fact: >-
      Marta Ospel plays it on a kit with no cymbals, which she took off because the gallery's echo
      made them unusable and never put back.
    arrangement_note: skins and rims and nothing bright anywhere, so the guitar has to carry the whole top of the band and is played harder than it would otherwise be
    intro: 5
    outro: cold
    target_duration: "3:25"
    prompt: >-
      112 BPM hard blues; gravel baritone, hard acoustic guitar, flat piano, rim-and-skin kit, stop.
    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, hi-hat, ride, crash, vocal tuning, whispered or rapped sections, modern studio production, fade-out
    lyrics: |
      [Intro - drums and guitar, five seconds]

      [Verse 1]
      The lift fails dark halfway through the blowout drill.
      Red lamps turn the second gallery toward the ladder.
      Two hundred rungs rise through a sweating metal shaft,
      one bulkhead at the top and four hundred boots below.
      Nobody panics; panic has no room in single file.
      Hands find the rails, shoulders find the person ahead.
      The long climb starts before the alarm stops speaking.
      Every rung repeats the weight the lift was built to spare.

      [Chorus]
      Up that long ladder and down that long ladder,
      two hundred rungs and a bulkhead at the top.
      Count only the next one. Let the rest wait overhead.

      [Verse 2]
      Forty rungs from daylight, one worker turns an ankle.
      The line bends round her without breaking its pace.
      A man below takes both her arms across his shoulders,
      her good boot knocking hard against the rail.
      He does not promise strength enough for what remains.
      She counts the rungs against his ear to keep them moving.
      Sixty-seven, sixty-eight, then breath instead of numbers.

      [Chorus]
      Up that long ladder and down that long ladder,
      two hundred rungs and a bulkhead at the top.
      Count only the next one. Let the rest wait overhead.

      [Verse 3]
      At the upper airlock, other hands receive her.
      He sits against the bulkhead till his shaking passes.
      By next shift, the lift is running, drill marked complete.
      No citation travels down the deck, no story needs his name.
      Yet every year when warning lights begin their turning,
      someone leaves a water flask beside the hundredth rung.
      He takes the ladder still and never takes the flask away.

      [Final Chorus]
      Up that long ladder and down that long ladder,
      two hundred rungs and a bulkhead at the top.
      Count for the one you carry. Let the rest wait overhead.

      [Outro - cold stop]
