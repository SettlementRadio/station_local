  - id: s_0842
    title: Wages in Two Halves
    track_number: 3
    mood: [blunt, brisk, defiant]
    fact: >-
      The local's committee asked the band not to record it during a live dispute about split
      payments, the only time it ever asked them for anything.
    arrangement_note: one voice reads the committee's request flat with the band out of it, and then the band come back in on the same chorus they were asked not to record
    intro: 3
    outro: cold
    target_duration: "3:15"
    prompt: >-
      116 BPM blunt blues; hard gravel baritone, spoken request, guitar, flat piano, harmonica, stop.
    exclude: bass guitar, upright bass, electric bass, synthesizers, brass, orchestral strings, backing harmony stacks, drum machines, large hall reverb, cymbals, vocal tuning, whispered or rapped sections, modern studio production, fade-out
    lyrics: |
      [Intro - full band, three seconds]

      [Verse 1]
      Half arrives on Friday, half when cargo clears.
      Cargo clears when one dry office signs the outer manifest.
      The deck has finished loading; the office has gone home.
      Rent takes one full wage and does not split its hunger.
      Heat cells, boots and supper all come due in one.
      A promise cannot feed the week that waits between.

      [Chorus]
      Wages in two halves is a wage and a promise.
      I can spend a wage. I have never spent a promise.
      Pay it whole before the next shift leaves the deck.

      [The committee - one voice, flat]
      Not while the dispute is live. Give the talks another week.
      We are asking once. Do not make the promise harder.

      [Verse 2]
      One woman counts six ration marks across nine evenings,
      turns the smallest boot sole toward the kitchen lamp.
      Her second half is waiting on a hauler already gone.
      The committee asks for time; the child asks for dry feet.
      Both requests are honest. Only one is in the room.
      She threads the cracked sole, knowing thread will not hold,
      and puts tomorrow's wet boot by the heater.

      [Chorus]
      Wages in two halves is a wage and a promise.
      I can spend a wage. I have never spent a promise.
      Pay it whole before the next shift leaves the deck.

      [Verse 3]
      Four months put no full Friday in a worker's hand.
      The office keeps its order; the deck keeps every loading time.
      At shift change, wet coats fill the second gate together.
      No one blocks the airlock. No one lifts a threat.
      They stand long enough to make the missing half visible,
      forty quiet bodies where one promise used to hide.
      The signing light stays on beyond the office hour.

      [Final Chorus]
      Wages in two halves is a wage and a promise.
      I can spend a wage. I have never spent a promise.
      Pay it whole. We brought the promise to your door.

      [Outro - cold stop]
