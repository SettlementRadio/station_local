      [Verse 1]
      Do not ask me about it at the gate with my coat half on
      and do not ask me about it in the eleventh hour on a deck
      and do not ask me the thing you actually want to ask
      in the four minutes between the shed and the road.

      [Guest piano - one chord, then silent]

