  - id: s_0309
    title: Last Bell at the Hall
    track_number: 6
    mood: [reflective, sustained, slow]
    fact: >-
      Ivena Sorn ends the track alone on the pipes and marked the tuning on her cuff, and it is the
      tuning the band have used ever since.
    arrangement_note: the band leaves one instrument at a time through the last two minutes and the pipes finish the track alone, in a tuning nobody in this band had used before and everybody has used since
    intro: 22
    outro: sustain
    target_duration: "5:30"
    prompt: >-
      Even mid-tempo heartland rock at its slowest, 100 BPM, reflective and sustained, slow. Female
      lead vocal, warm mid alto, level and unhurried, plain diction, ending lines flat rather than
      lifting them, never belting. No backing vocal of any kind anywhere; the second guitar gives one
      short answer after the last line of the first two choruses and stops answering before the
      two-minute exit begins. Two bright thin-toned electric guitars hard apart, electric bass,
      resonance pipes with a deep alloy organ tone, drum kit. Tracked live in a Forge yard building,
      steady unhurried drums, light compression, no reverb of any size. Begin a two-minute withdrawal
      at the bridge: rhythm guitar leaves after its first line, lead guitar after its second, drums
      after line two of the final chorus, and bass after line four; Isa sings a brief coda over Ivena
      Sorn's pipes, then Ivena ends alone. Twenty-two seconds of pipes alone before the first sung
      word. Ends on a long held pipe note with nothing else on it.
    exclude: backing vocals of any kind, group or shouted choruses, synthesizers, electronic drums, brass, orchestral strings, stadium reverb, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 22 seconds, pipes alone, no vocal]

      [Verse 1]
      There is a bell in the second hall on the route that they ring
      about ten minutes before they want everybody gone,
      and it is not loud and it is not unfriendly and it works,
      and I have heard it twenty-four times and never once resented it.

      [Pre-Chorus]
      Ten minutes. That is the whole of the warning anybody gets.

      [Verse 2]
      Every good room has one. It does not have to be a bell.
      It is a light going up, it is a chair going on a table,
      it is a keeper standing near a door and not saying anything,
      and if a room has not got one then the room does not end.

      [Chorus]
      Last bell. Ten minutes. Finish what you are saying.
      Nobody is being thrown out and nobody is in trouble.
      Somebody has to lock this and go home to their own life
      and it has been somebody's whole evening and not yours.
      There is a last ferry for everything and this is the hall's.

      [Verse 3]
      Ivena came down for one afternoon to play the ending
      and found a tuning nobody in this band had ever used,
      and wrote it on her cuff in the way she has always done,
      and we have used it on everything since and never told her.

      [Chorus]
      Last bell. Ten minutes. Finish what you are saying.
      Nobody is being thrown out and nobody is in trouble.
      Somebody has to lock this and go home to their own life
      and it has been somebody's whole evening and not yours.

      [Bridge - two-minute exit begins; rhythm guitar leaves after line 1, lead guitar after line 2]
      She would not do a second one. She said the room had settled.
      I did not understand that for about four years.

      [Final Chorus - drums leave after line 2, bass after line 4; only voice and pipes remain]
      Last bell. Ten minutes. Finish what you are saying.
      Get your coat. Say the thing to the person now.
      There is a whole settlement outside and it is cold
      and this room has been warm for four hours and it is enough.

      [Vocal Coda - Isa over Ivena's pipes only]
      Last bell. Ten minutes. I heard it.
      The door is open. I am going now.

      [Outro - Ivena alone, one long held pipe note]
