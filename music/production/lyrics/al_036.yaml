  - id: s_0307
    title: Give the Solo Away
    track_number: 4
    mood: [generous, rowdy, fast]
    fact: >-
      Perin Dask stood down and the solo is played by a loader the band met at the yard gate,
      credited on the sleeve by name.
    arrangement_note: the band's own lead guitarist stays on rhythm for the whole song and a third guitar enters only for the twenty-second break, played by a yard loader who used to play but is not now in a band, so it is slower and simpler than anything else on the record
    intro: 7
    outro: cold
    target_duration: "4:20"
    prompt: >-
      Even mid-tempo heartland rock at its fastest, 134 BPM, generous and rowdy, fast. Female lead
      vocal, warm mid alto, level and unhurried, plain diction, ending lines flat rather than
      lifting them, never belting. No backing vocal of any kind anywhere; the second band guitar
      gives one short answer after the last line of each chorus and otherwise stays on rhythm. Two
      bright thin-toned band guitars hard apart, both playing rhythm; electric bass, resonance pipes
      doubling the bass under the chorus with a deep alloy organ tone, drum kit. Tracked live in a
      Forge yard building, steady unhurried drums, light compression. A third, guest electric guitar
      enters only for a twenty-second break, played by a yard loader who used to play but is not now
      in a band — restrained, slower, simpler and plainer than anything else on the record, with one
      note held unexpectedly long before it resolves. Seven seconds of both band guitars before the
      first sung word. Cold stop.
    exclude: backing vocals of any kind, group or shouted choruses, synthesizers, electronic drums, brass, orchestral strings, stadium reverb, vocal tuning, whispered or rapped sections, dance and electronic production, virtuosic or fast lead guitar
    lyrics: |
      [Intro - 7 seconds, both guitars, no vocal]

      [Verse 1]
      There is a loader we met by the gate of that yard
      who has worked the morning shift since before we booked the building,
      and he told us in the second week that he used to play,
      in the way people say it, which means do not ask me to.

      [Verse 2]
      So nobody asked him for four weeks and then Perin did,
      and he said no, and then said no again, and then said when,
      and came in on a Thursday with a guitar in a bag
      that had not been out of the bag since about 2611.

      [Chorus]
      Give the solo away. It is not a possession.
      Somebody in this yard has been waiting nine years to be asked
      and the four of us have been asked more times than we can count,
      and one of those is a problem and it is not his.

      [Instrumental - the loader's guitar break, 20 seconds, slow and plain]

      [Verse 3]
      It is slower than Perin would have played it and simpler,
      and he holds one note about a bar past where you expect it
      and then comes off it in a way I did not see coming,
      and Perin turned round in the room and said keep that.

      [Chorus]
      Give the solo away. It is not a possession.
      Somebody in this yard has been waiting nine years to be asked
      and the four of us have been asked more times than we can count,
      and one of those is a problem and it is not his.

      [Verse 4]
      His name is on the sleeve in the same size as the rest of us
      and the label asked twice whether that was really what we wanted
      and I said yes twice, and there was no third time,
      and he has not come back to play on anything since and I keep asking.

      [Final Chorus]
      Give the solo away. It is not a possession.
      There is one of him on every loading crew in every yard
      in every settlement on this whole lane, doing the work,
      with an instrument still in its case at the end of a shift,
      and nobody has asked any of them for about twenty years.

      [Outro - cold stop]
