    lyrics: |
      [Intro - 16 seconds, pipes and one guitar, no vocal]

      [Verse 1]
      Nothing has moved in this yard since about the middle of the season
      and there are four crates of cargo by the wall that nobody has claimed
      and are on no manifest anybody in this settlement can find
      and a light at the top that comes on before anybody needs it
      and goes off again at a time somebody set nine years ago.

      [Verse 2]
      We come in on the days the building is not being used,
      which is most days now, and put four amps on the floor
      and play everything about ten under where we play it live
      and stop for an hour in the middle because there is no reason not to.

      [Chorus]
      Slow yard. Nothing coming, nothing going out.
      A season of it and a door that is open at both ends
      and four of us not in a hurry for the first time
      since a man from a label first put a page on a table.

      [Verse 3]
      By the sixth week Neve had stopped bringing a clock
      and Kolm left his coat on the hook by the near door,
      and Perin knew which afternoon the yard light came on,
      and I knew the freight clerk's name without ever asking.
      Four people can spend a season waiting for nothing
      and still come back on the next clear day.

      [Chorus]
      Slow yard. Nothing coming, nothing going out.
      A season of it and a door that is open at both ends
      and four of us not in a hurry for the first time
      since a man from a label first put a page on a table.

      [Bridge]
      We play it faster on stage. We will always play it faster.
      This is the only one of ours I would rather have than the room.

      [Final Chorus]
      Slow yard. Nothing coming, nothing going out.
      There is a whole settlement of people wanting the opposite
      and I have wanted the opposite for twenty-seven years
      and it turns out that this is what I actually wanted.

      [Outro - fade on the pipes]
