  - id: s_0310
    title: Everything Still Moves
    track_number: 7
    mood: [resolute, loud, fast]
    fact: >-
      Sel Ardin built the closing chorus around Isa Lorne's guide vocal without telling her, and the
      guide take is the one on the record.
    arrangement_note: the vocal on the last chorus is a guide take that was never meant to be kept, so it is further from the microphone and less careful than the rest, and the band was arranged around it afterwards rather than the other way round
    intro: 4
    outro: cold
    target_duration: "4:05"
    prompt: >-
      Even mid-tempo heartland rock at its fastest, 136 BPM, resolute and loud, fast. Female lead
      vocal, warm mid alto, level and unhurried, plain diction, ending lines flat rather than
      lifting them, never belting — and on the final chorus a rougher, more distant, less careful
      take of the same voice, further from the microphone, with the band arranged around it. No
      backing vocal of any kind anywhere; the second guitar answers only lines one and four of the
      first two choruses and stays silent through the exposed final chorus. Two bright thin-toned
      electric guitars hard apart, electric bass, resonance pipes doubling the bass under the chorus
      with a deep alloy organ tone, drum kit. Tracked live in a Forge yard building, steady
      unhurried drums, light compression. A sixteen-second lead guitar break. Four seconds of drums
      and bass before the first sung word. Cold stop.
    exclude: backing vocals of any kind, group or shouted choruses, synthesizers, electronic drums, brass, orchestral strings, stadium reverb, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 4 seconds, drums and bass, no vocal]

      [Verse 1]
      A season in a building where nothing was going anywhere
      and four crates by the wall that did not move all year
      and a light on a timer and a door open at both ends,
      and I came out of it thinking the opposite of what I went in with.

      [Verse 2]
      Because it does move. All of it. Constantly. Under everything.
      The four crates went in the spring on a hauler out of Forge
      and the rail on the near door was finally taken off
      and the man on the gate has retired and the gate is somebody else's,
      and a whole settlement went on doing all of it without us
      while four people sat in a yard playing slowly at each other.

      [Chorus]
      It all still moves. Everything is still moving.
      The slow yard was a season and the season is over.
      Nothing has stopped anywhere and nothing is going to,
      and standing still in it for a while was the whole point.

      [Instrumental - lead guitar break, 16 seconds]

      [Verse 3]
      I sang this once to give the band something to play against
      and went out to the yard and came back and it was done,
      and Sel had built the whole last chorus round it
      and had not asked me and would not have got a yes if he had,
      and played it back once and then went and stood outside.

      [Chorus]
      It all still moves. Everything is still moving.
      The slow yard was a season and the season is over.
      Nothing has stopped anywhere and nothing is going to,
      and standing still in it for a while was the whole point.

      [Final Chorus - the guide vocal, further off and less careful]
      It all still moves. Everything is still moving.
      That is the guide from a Tuesday, sung in a coat,
      and it is the best I have sung anything in twenty years
      and I have stopped being annoyed about it, mostly.

      [Outro - cold stop]
