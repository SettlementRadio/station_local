    lyrics: |
      [Intro - 10 seconds, both guitars and pipes, no vocal]

      [Verse 1]
      People ask whether we are going to do somewhere else this year
      and they ask it the way you ask somebody about their health,
      carefully, as though the answer might be difficult,
      and the answer is no, and it has not been difficult since 2600.

      [Pre-Chorus]
      Four halls, one lane, and a hauler out of Forge on the Monday.

      [Verse 2 - one bar of band under each name]
      Forge, because it is where we live and it is first.
      Low Span, on the freight exchange, three days after.
      Verrin Reach, which is the small one and the best one.
      Cold Harbor at the end of it, and then the yard, and then home.

      [Chorus]
      The same four, the same order, twenty-four years of it.
      Not because we could not go further. We were asked.
      Because a hall you have played twenty-four times
      is a room full of people and not a room full of strangers.

      [Verse 3]
      There is a woman at Verrin Reach who brings her daughter now
      and the daughter is the age the woman was at the first one
      and neither of them has ever come up and said anything to me
      and I would not know what to do with it if they did.

      [Chorus]
      The same four, the same order, twenty-four years of it.
      Not because we could not go further. We were asked.
      Because a hall you have played twenty-four times
      is a room full of people and not a room full of strangers.

      [Bridge]
      Two settlements have asked to be put on the route and been refused.
      It is not a route any more. Four is what it is.

      [Final Chorus]
      The same four, the same order, twenty-four years of it,
      and one day it will be three, and that is coming,
      and I have thought about which one and I will not say,
      and the year it happens we will play the other three anyway.

      [Outro - fade]
