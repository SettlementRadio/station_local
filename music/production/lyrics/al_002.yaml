      [Verse 1]
      Same bench, same hour, same rain going sideways,
      Same man selling the same bad tea, and he knows my order now.
      I have got very good at the twenty minutes before,
      And I have never once been late for them.

      [Refrain]
      The ferry comes in at ten past, and the rest of the week is the wait for it.

      [Verse 2]
      They put a clock up in the port hall but it runs a minute fast,
      So everybody standing here is early and pretending not to be.
      I brought the good coat. I brought the other one back.
