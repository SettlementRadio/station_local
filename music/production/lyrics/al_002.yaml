    lyrics: |
      [Intro - 19 seconds, keyboard and brushed kit, bass at thirteen seconds, no vocal]

      [Verse 1]
      Everything shuts at once around here,
      One minute it is a street and then it is a shape.
      The last ferry went at eleven and took the noise with it,
      And I walk it slower than I need to.

      [Chorus]
      The town is honest for an hour once the lights go over,
      Nothing is dressed up and neither am I.
      There is nobody waiting up and nowhere I have to be,
      And that is not the worst way to be out.

      [Verse 2]
      I liked you better than I ever said,
      Which is the kind of sentence you can only get out in the dark.
      You would have laughed at me. You would have been kind about it.
      That is the worst of it, honestly. You would have been kind.

      [Chorus]
      The town is honest for an hour once the lights go over,
      Nothing is dressed up and neither am I.
