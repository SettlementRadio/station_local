    lyrics: |
      [Intro - 15 seconds, keyboard alone in a large reflective hall, chimes at ten seconds, no vocal]

      [Verse 1]
      They shut it for repairs and we got used to small,
      Low rooms, a bulkhead door, everybody's elbow.
      Now here is a hundred feet of nothing over my head
      And I can hear my own voice coming back to me from three sides.

      [Chorus]
      Rooms with windows (rooms with windows)
      Everything sounds further than it is (further than it is)
      Say a thing kindly and it goes round the whole place (round the whole place)
      And it gets back to you by the end of the week.

      [Verse 2]
      You stand at the second one, she stands at the third,
      And each of you answers me from somewhere else.
      It should not work, it should not hold together at all,
      But the scrubber is off for the first time in years, and it does.

      [Chorus]
      Rooms with windows (rooms with windows)
      Everything sounds further than it is (further than it is)
      Say a thing kindly and it goes round the whole place (round the whole place)
      And it gets back to you by the end of the week.

      [Bridge]
      Nobody built this for us. We got in on a form.
      Eleven days, and then it belongs to somebody else.

      [Final Chorus - all four voices, spread across the hall]
      Rooms with windows (rooms with windows)
      Everything sounds further than it is (further than it is)
      Say a thing kindly and it goes round the whole place (round the whole place)
      And it gets back to you by the end of the week.

      [Outro - fade, the hall carrying the last group answer]
