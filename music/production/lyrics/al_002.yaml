    lyrics: |
      [Intro - 22 seconds, keyboard pattern alone, bass at fifteen seconds, kit at nineteen, no vocal]

      [Verse 1]
      I have been awake since the middle of the night
      Doing arithmetic I already know the answer to.
      The window's going grey at the bottom edge,
      Which is the first honest thing that's happened for hours.

      [Chorus 1 - lead alone]
      Morning takes its time (takes its time)
      It does not care that you were up (does not care)
      Morning takes its time (takes its time)
      And it comes anyway, and it comes anyway.

      [Verse 2]
      Somebody's boots on the stair at five,
      Somebody's kettle, somebody's radio low.
      A whole building deciding to be a day again
      Without a vote, without a meeting, without one word from me.

      [Chorus 2 - two voices]
      Morning takes its time (takes its time)
      It does not care that you were up (does not care)
      Morning takes its time (takes its time)
      And it comes anyway, and it comes anyway.

      [Bridge]
      I used to think the trick was getting through the night.
      The trick is being here for the part after it.

      [Verse 3]
      I'll be no good today and that is allowed,
      I'll do the one job I can do and leave the rest.
      And you'll come in at noon with your terrible news
      And we will make it smaller between us, the way we do.

      [Final Chorus - all four voices, low harmony underneath]
      Morning takes its time (takes its time)
      It does not care that you were up (does not care)
      Morning takes its time (takes its time)
      And it comes anyway, and it comes anyway.
      It comes anyway.

      [Outro - long fade on the decorated keyboard pattern]
