  room: >-
    Forge's largest pipe hall, eleven days, with a pipe rig already standing when the band walked in
    — which is the only reason eleven days were enough and is why the hall's own largest tube is on
    the record at all. The style card holds unbent for twelve of the thirteen: amplified pipes,
    rhythm guitar, bass, drum kit with struck alloy, tracked live, one low male harmony from the
    bass chair. The four fact-bound exceptions are explicit rather than silent — Ivena Sorn's
