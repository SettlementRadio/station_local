    outro: cold
    target_duration: "4:30"
    prompt: >-
      Riff-led hall rock at the hard-rock edge, 138 BPM, driving and anthemic, fast. Male lead
      vocal, big hall baritone with a hard edge at the top of the range, pushing into the chorus
      rather than belting it, sung slightly ahead of the band, no vibrato. One low male harmony
      voice from the bass chair, under the lead on choruses only, never above him and never a stack.
      Amplified resonance pipes — long alloy tubes, deep organ tone, carrying the bottom — rhythm
      electric guitar, electric bass, drum kit with struck alloy. Tracked live in a large ringing
      hall, drums roomy, guitar mid-range and unpolished. One opening riff that returns unchanged at
