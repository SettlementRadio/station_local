  - id: s_0287
    title: Long Alloy
    track_number: 4
    mood: [heavy, solemn, slow]
    fact: >-
      Juno Kerrick and Ivena Sorn tuned the hall's largest pipe to the room rather than to the band,
      and every guitar was retuned to match it.
    arrangement_note: Ivena plays the hall's largest pipe beneath the sung sections and every instrument is tuned around it; for the twenty-second break she drops out and Juno plays that same pipe alone
    intro: 24
    outro: sustain
    target_duration: "5:40"
    prompt: >-
      Riff-led hall rock at the hard-rock edge, 104 BPM, heavy and solemn, slow. Male lead vocal,
      big hall baritone with a hard edge at the top of the range, pushing into the chorus rather
      than belting it, sung slightly ahead of the band, no vibrato. One low male harmony voice from
      the bass chair, under the lead on choruses only, never above him and never a stack. One very
      large amplified resonance pipe — a long alloy tube with a deep organ tone, played by Ivena
      under the sung sections and tuned to the room rather than concert pitch — with guitar and bass
      tuned around it. The instruments remain firmly in tune with one another; the unusual center is
      low and stable, never a bad-intonation effect. Rhythm electric guitar, electric bass, drum kit
      with struck alloy. Tracked live in a large ringing hall, drums roomy, guitar mid-range and
      unpolished. For a twenty-second break Ivena and the band drop out and Juno plays the largest
      pipe alone. Twenty-four seconds of Ivena on that pipe before the first sung word. Ends on
      Juno's held pipe note left to decay in the hall.
    exclude: acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production, stacked studio harmony
    lyrics: |
      [Intro - 24 seconds, the hall's largest pipe alone, no vocal]

      [Verse 1]
      There is a tube in that hall that is longer than the van
      and it has been bolted to the back wall since before the reorganisation
      and nobody has moved it because nobody could move it,
      and it is tuned to the building and the building has not changed.
      It came off a hauler in pieces before anybody here was working
      and whoever bolted it up did not leave a name on it.

      [Verse 2]
      They spent the whole of a morning finding where it actually was,
      the two of them, with the doors shut and the heating off,
      and then she said a number and he wrote it on his hand
      and we retuned four instruments to a wall.

      [Chorus]
      The long tube, and everything comes to it.
      Not the other way round. Nothing comes to us.
      The room was here first and the room will be here after
      and the only sensible thing is to agree with it.

      [Instrumental - Juno on the largest pipe alone, Ivena and the band out, 20 seconds]

      [Verse 3]
      It sits about a third of a tone off where you want it
      and the first four times you hear this you will think it is wrong,
      and then one morning it will be the only right note in the hall
      and every easier tuning will feel like it is trying too hard.
      There is a note under this settlement that everything else is measured from
      and it is a length of alloy screwed to a wall in a cold hall.

      [Chorus]
      The long tube, and everything comes to it.
      Not the other way round. Nothing comes to us.
      The room was here first and the room will be here after
      and the only sensible thing is to agree with it.

      [Bridge]
      There is a settlement's worth of alloy in that wall.
      Somebody hung it there for a reason nobody wrote down.

      [Final Chorus]
      The long tube, and everything comes to it.
      She marked the tuning on her cuff and would not do it twice.
      We wrote that number on this wall and nowhere else,
      because no other hall has ever asked the same thing of us.

      [Outro - held note, left to decay in the hall]
