    lyrics: |
      [Intro - 16 seconds, the empty hall and pipes, no vocal]

      [Verse 1]
      We have been in better halls with better everything in them
      and none of them do the thing this one does at the low end,
      and nobody can tell you why, and two people have measured it,
      and both of them went away and did not write anything down.

      [Verse 2]
      It is bolted alloy and a bad roof and a floor that slopes
      and a heating system that argues with the settlement's own scrubber,
      and if you built it again out of the same materials
