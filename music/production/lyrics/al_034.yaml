    exclude: acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production, stacked studio harmony, bright ringing cymbals
    lyrics: |
      [Intro - 3 seconds, the cracked cymbal and kick, no vocal]

      [Verse 1]
      Third day of a run and the scrubber is at the top of its range
      and everybody on the deck has taken a layer off
      and the numbers on the panel are the numbers you do not like
      and there is nothing to do about any of it for six hours.

      [Chorus]
      Everything runs hot. Everything runs hot.
      The metal, the argument, the man on the third shift.
      Nothing here has stopped yet and nothing here feels right,
      and you sit in it and you do the job and it passes.

      [Verse 2]
      He cracked it on the fourth day and the new one never came,
      stuck at a siding somewhere with a fortnight of other things,
      and he played the rest of the booking on that dead short sound,
      short, ugly, gone in half a second, and it is perfect,
      and it is on every chorus and there is nothing else like it.

      [Chorus]
      Everything runs hot. Everything runs hot.
      The metal, the argument, the man on the third shift.
      Nothing here has stopped yet and nothing here feels right,
      and you sit in it and you do the job and it passes.

      [Verse 3]
      I have been in a hold at fifty degrees with three people
      who all went quiet because nobody wanted to stop the shift.
      Then one of them pulled the alarm and opened the near door,
      and we stood outside until the panel came back green,
      and every one of us learned the other three names properly.

      [Bridge]
      It cools down. It always cools down.
      That is not comfort, that is just the shape of a shift.

      [Final Chorus]
      Everything runs hot. Everything runs hot.
      The metal, the argument, the man on the third shift.
      Six hours in and the panel comes back green
      and nobody says anything about any of it ever again.

      [Outro - cold stop on the cracked cymbal]
