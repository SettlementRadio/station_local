    title: Home on the Slow Circuit
    track_number: 13
    mood: [warm, resolute, midtempo]
    fact: >-
      The final chorus is the one the band had closed every performance with since 2594 and had
      never put on a record.
    arrangement_note: the closing chorus is the one the band has ended every night with for twenty-five years and it is played exactly as it is played live, with nothing added and no second attempt
    intro: 11
    outro: sustain
    target_duration: "5:05"
    prompt: >-
      Riff-led hall rock at the hard-rock edge, 120 BPM, warm and resolute, midtempo. Male lead
      vocal, big hall baritone with a hard edge at the top of the range, pushing into the chorus
      rather than belting it, sung slightly ahead of the band, no vibrato. One low male harmony
      voice from the bass chair, under the lead on choruses only, never above him and never a stack.
      Amplified resonance pipes — long alloy tubes, deep organ tone — rhythm electric guitar,
      electric bass, drum kit with struck alloy. Tracked live in a large ringing hall, drums roomy,
      guitar mid-range and unpolished, the final chorus played exactly as it is played live with
      nothing added. Eleven seconds of pipes and guitar before the first sung word. Ends on a held
      chord left ringing in the hall.
    exclude: acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production, stacked studio harmony
    lyrics: |
      [Intro - 11 seconds, pipes and guitar, no vocal]

      [Verse 1]
      There is a fast circuit and a slow one and they end in the same place
      and one of them takes four days and the other takes nine,
      and everybody young takes the fast one, which is correct,
      and everybody who has done both of them takes the slow one.

      [Verse 2]
      The slow one goes through settlements that have nothing in them
      but a hall, a gate, a transfer hall and about two hundred people,
      and every one of those halls has had us in it twice
      and half of them still have the poster up from the first time.

      [Chorus]
      Home on the slow circuit. Nine days and a hall a night.
      No one is waiting at the far end with anything for us.
      That is not a sad thing. That is the arrangement.
      Nine days of somebody's Friday and then the yard.

      [Verse 3]
      We have ended every night with this since the first burn festival
      after the last listed song and before the lights come up.
      Some halls are empty by then and some are still standing,
      but the same four bars tell everybody the night is finished,
      and nobody asks for another because everybody knows the road home.

      [Chorus]
      Home on the slow circuit. Nine days and a hall a night.
      No one is waiting at the far end with anything for us.
      That is not a sad thing. That is the arrangement.
      Nine days of somebody's Friday and then the yard.

      [Bridge]
      Twenty-five years of the same four bars at the end of every night.
      It has outlived a bass player and most of the halls.

      [Final Chorus - as played live, nothing added]
      Home on the slow circuit. Nine days and a hall a night.
      Whoever is standing at the end of it can have the last one.
      Put the lights up. We are not doing another.
      Get home safely and we will see you in the spring.

      [Outro - held chord, left ringing in the hall]
