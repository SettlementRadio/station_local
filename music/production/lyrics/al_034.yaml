    exclude: acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production, stacked studio harmony
    lyrics: |
      [Intro - 14 seconds, the riff building from pipes to full band, no vocal]

      [Verse 1]
      Give four people the same question twenty-two times
      and by the ninth answer nobody knows what the question was.
      Four hours in a cold hall can make eight seconds enormous
      and make a small decision feel like something worth a fight.
      There is a freight crew out on the long lane tonight
      who will hear it once, know whether it moves, and settle the matter.

      [Chorus]
      Hammer down the line, hammer down the line,
      whatever is at the far end of it can wait its turn.
      One thing at a time and all of it at once,
      and the hall gets what the hall came for.

      [Verse 2]
      The first answer comes before you understand the room.
      The last comes after you have stopped hearing yourself.
      Somewhere in between there is one where you are still trying,
      and it is nearly always earlier than anybody wants to admit.

      [Chorus]
      Hammer down the line, hammer down the line,
      whatever is at the far end of it can wait its turn.
      One thing at a time and all of it at once,
      and the hall gets what the hall came for.

      [Instrumental - pipe break, the same riff an octave down, guitar out, 14 seconds]

      [Verse 3]
      Tor said it on the sixth take and nobody listened to him.
      Said the second one, said it flatly, went back to the kit,
      and on the ninth day it was the second one, exactly as he said,
      and he did not mention it, which is worse than mentioning it.

      [Bridge]
      Eleven days. One hall. A rig somebody else left standing.
      We would not have got half of this in a room of our own,
      and the hall was cold and the heating came on when it liked.

      [Final Chorus]
      Hammer down the line, hammer down the line,
      whatever is at the far end of it can wait its turn.
      Twenty-two answers and the honest one came second,
      exactly where Tor said it was before we made it difficult.

      [Outro - cold stop on the riff]
