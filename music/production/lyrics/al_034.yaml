      He will not let the outer doors open until the room is right,
      which has cost two hall keepers a morning each,
      and he was a freight crew hand for eleven years before this
      and says a bad rail is a bad rail wherever it is bolted,
      in a hall, in a hold, on a hauler, it makes no difference.

      [Bridge]
      One of the loud ones came up afterwards and apologised.
      I told her to be worse next time. I meant it.

      [Final Chorus]
      Count the loud ones. Four of them tonight,
      and the railings they are leaning on are answering too.
      The room has got a part whether anybody writes it down or not,
      including the pieces of it that hold the roof up.

      [Outro - fade on the railings]
