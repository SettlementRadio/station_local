    lyrics: |
      [Intro - 12 seconds, pipes and bass, no vocal]

      [Verse 1]
      I came back from the yard after the ninth evening
      with both knees making decisions I had not agreed to.
      There was a chair beside the table and a plate under a cloth,
      and I sat before I had taken either boot off.

      [Verse 2]
      At that height the kitchen looks like somewhere you can stay.
      The light reaches the table and does not ask for anything.
      A man awake since four can stop pretending he is not tired
      when nobody in the room needs him to stand back up.

      [Pre-Chorus]
      Twenty-seven years of coming in after the light went out.

      [Chorus]
      Don't wait up for the yard. It will still be there.
      Go to bed. Leave the light. I will come in quietly.
      There is no cargo at the far end of this that will not keep,
      and I have said that to you for twenty-seven years.

      [Verse 3]
      She has waited up for the yard more times than I have worked
      and has never once said that it was a thing she was doing,
      and the plate is under the cloth and the chair is at the table
      and there is no version of this where I get to be right about it.
      Her father did it for the freight crew before I ever did
      and she has been waiting up for a yard since she was small.

      [Chorus]
      Don't wait up for the yard. It will still be there.
      Go to bed. Leave the light. I will come in quietly.
      There is nothing at the far end of this that will not keep,
      and I have said that to you for twenty-seven years.

      [Bridge]
      Eleven days in a hall is not a long time to be away.
      It is eleven evenings. Somebody counted them.

      [Final Chorus]
      Don't wait up for the yard. It will still be there.
      Go to bed. Leave the light. I will come in quietly.
      I am going to keep saying it and you are going to keep waiting,
      and we have both known how that ends since the beginning.

      [Outro - fade on the quiet pipes]
