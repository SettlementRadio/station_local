  - id: s_0284
    title: Hammer Down the Line
    track_number: 1
    mood: [driving, anthemic, fast]
    fact: >-
      The band recorded the opening riff twenty-two times and chose the second take after playing
      all twenty-two back in one sitting.
    arrangement_note: the opening riff is the whole architecture of the song and returns unchanged at every join, and the fourteen-second pipe break is the same riff an octave down with the guitar out
