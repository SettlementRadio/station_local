    lyrics: |
      [Intro - 10 seconds, one-handed piano and pipes, no vocal]

      [Verse 1]
      There are two things anybody in this settlement talks about
      and one of them is what the season did to the roof
      and the other is what the season did to the rate,
      and they are the same conversation and everybody knows it.

      [Verse 2]
      Calo came in with the arrangement copied out in full,
      four pages, both hands, everything in the right place,
      and then he heard the pipes come up under the first chorus
      and put his left hand in his lap and left it there all night.

      [Chorus]
      The wages and the weather. That is the whole of it.
      Ask anybody at the gate and you will get both in one sentence.
      Nothing else moves out here. Nothing else needs to.
      Two numbers on a board and a look out of the window.

      [Verse 3]
      My mother could tell you the rate for every year since the reorganisation
      and could not tell you one thing that happened in the core,
      and I used to think that was small of her and it is not,
      it is the only two numbers that ever changed anything in this house.

      [Chorus]
      The wages and the weather. That is the whole of it.
      Ask anybody at the gate and you will get both in one sentence.
      Nothing else moves out here. Nothing else needs to.
      Two numbers on a board and a look out of the window.

      [Bridge]
      Weather moves first. Wages follow six weeks later.
      One comes through the roof and one comes through the pay,
      and both of them arrive whether anybody is ready or not.

      [Verse 4]
      There is a board at the gate with the rate on it in chalk
      and a window above it that everybody looks through first,
      and in nine years of standing there I have never once
      seen a person check the rate before checking the sky.

      [Final Chorus]
      The wages and the weather. That is the whole of it,
      and a hall with the heating on and eleven days paid for.
      Both numbers were bad that season and we made this anyway,
      and it was the warmest room we had that season.

      [Outro - fade on the one-handed piano]
