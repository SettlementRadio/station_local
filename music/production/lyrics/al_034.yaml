  - id: s_0285
    title: Six Days In
    track_number: 2
    mood: [hoarse, defiant, midtempo]
    fact: >-
      Havel Ost sings the whole track on the voice he had left after losing it on the sixth day of
      the sessions.
    arrangement_note: the whole band drops back under the vocal because the vocal cannot come forward, so the loudest thing on the track is the pipes in the gaps between lines and the singer is never asked to reach
    intro: 5
    outro: fade
    target_duration: "4:20"
    prompt: >-
      Riff-led hall rock at the hard-rock edge, 116 BPM, hoarse and defiant, midtempo. Male lead
      vocal, big hall baritone with a hard edge at the top of the range, damaged and rough, staying
      low in the range and never reaching, sung slightly ahead of the band, no vibrato. One low male
      harmony voice from the bass chair, under the lead on choruses only, never above him and never
      a stack. Amplified resonance pipes — long alloy tubes, deep organ tone — filling every gap
      between vocal lines and dropping right back underneath them; rhythm electric guitar, electric
      bass, drum kit with struck alloy. Tracked live in a large ringing hall, the band held back
      under the voice throughout, drums roomy, guitar mid-range and unpolished. Five seconds of
      pipes and guitar before the first sung word. Fade.
    exclude: acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production, stacked studio harmony, belted or soaring vocals
    lyrics: |
      [Intro - 5 seconds, pipes and guitar, no vocal]

      [Verse 1]
      It went on the Thursday morning, halfway through a line,
      not gradually, not with any warning, just gone,
      one word came out and the next one did not follow it
      and the room went quiet in a way I have not heard before.

      [Chorus]
      Six days gone and there is nothing left to sing with
      and there are five days of hall booked and paid for.
      So the band came down and the pipes took the top off it
      and what you are hearing is what I had left.

      [Verse 2]
      They spent two days building beds around the shape of me,
      guitar, bass, alloy, everything but the thing that was broken,
      and nobody said we should stop and nobody said we should carry on,
      they just kept playing quieter until I could get over the top.

      [Chorus]
      Six days gone and there is nothing left to sing with
      and there are five days of hall booked and paid for.
      So the band came down and the pipes took the top off it
      and what you are hearing is what I had left.

      [Verse 3]
      My voice came back in spring and I used it everywhere,
      but every time the throat goes rough I know this room again:
      four people making space around the part that would not work,
      nobody calling it brave and nobody asking me to reach.

      [Bridge]
      A hall this size does not care what your voice is doing.
      Neither does a manifest. Neither does the last ferry.
      You get up and you do the thing at the volume you have got.

      [Final Chorus]
      Six days into it and there is nothing left to sing with,
      and the eleven days were booked and the eleven days were used.
      We did not make the missing part pretend that it was whole;
      we brought everything else down to the volume I had got.

      [Outro - fade on the pipes]
