      [Chorus]
      Nothing sounds like it. Nothing is going to.
      Not the core, not the new place, not the room with the good desk.
      Eleven days in a building that is falling down
      and every one of them stayed somewhere in the sound.

      [Verse 3]
      A man went round the hall on the last afternoon with a machine
      and got five people to sing the same four bars into it,
      the hall keeper, two of us, and two who had come to watch,
      eleven goes between them, none of them at the same time.

      [Chorus]
      Nothing sounds like it. Nothing is going to.
      Not the core, not the new place, not the room with the good desk.
      Eleven days in a building that is falling down
      and every one of them stayed somewhere in the sound.

      [Bridge]
      He put them together in an evening and played it back once
      and nobody said anything for a while, and then we went home.

      [Final Chorus - stacked voices, five people, arriving once]
      Nothing sounds like it. Nothing is going to,
      and one day the roof will go and that will be that,
      and there will be a car park or a store or nothing at all,
      and five voices will still carry the way that room answered.

      [Outro - held chord, the stacked voices sustaining]
