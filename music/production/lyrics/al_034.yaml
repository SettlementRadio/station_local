  - id: s_0289
    title: The Shift You Don't Come Back From
    track_number: 6
    mood: [ominous, building, midtempo]
    fact: >-
      The lyric was assembled from a list of near-misses the band collected from the pipe hall's own
      maintenance crew.
    arrangement_note: pipes open alone; rhythm guitar joins for the first verse, bass for the pre-chorus and drums for the second verse, after which the full band never drops out, while the vocal stays at one fixed volume throughout
    intro: 18
    outro: fade
    target_duration: "5:00"
    prompt: >-
      Riff-led hall rock at the hard-rock edge, 112 BPM, ominous and building, midtempo. Male lead
      vocal, big hall baritone with a hard edge at the top of the range, held at exactly the same
      volume from first line to last while the band grows louder around it, sung slightly ahead of
      the band, no vibrato. One low male harmony voice from the bass chair, under the lead on
      choruses only, never above him and never a stack. Amplified resonance pipes — long alloy
      tubes, deep organ tone — opening alone; rhythm electric guitar joins for the first verse,
      electric bass for the pre-chorus and drum kit with struck alloy for the second verse. The full
      band remains from there and nothing drops out again.
      Tracked live in a large ringing hall, drums roomy, guitar mid-range and unpolished. Eighteen
      seconds of pipes alone before the first sung word. Fade at full size.
    exclude: acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production, stacked studio harmony
    lyrics: |
      [Intro - 18 seconds, pipes alone, no vocal]

      [Verse 1 - rhythm guitar joins the pipes]
      A man who fixes the heating in that hall told us four of these
      over a cup of something in the corridor on the second night,
      and then a woman came past and added a fifth without stopping,
      and we wrote them all down on the back of the running order.

      [Pre-Chorus - bass joins, nothing drops out]
      Not one of these is about a person who was unlucky.

      [Verse 2 - drums join, full band from here onward]
      A bulkhead door that shut on a coat and not on the man in it.
      A scrubber that failed at the far end of a night shift
      and the alarm that everybody had stopped hearing years ago
      and one person who noticed the smell and said so out loud.

      [Chorus]
      Nobody plans it. Nobody gets a warning.
      There is a shift you do not come back from and it looks like all the others.
      Same gate, same coat, same thing said at the door,
      and the difference is not in anything you can see.

      [Verse 3]
      A strap that held. A rung that did not. A light that was out
      on the one week the second light was also out.
      A hauler that came in on the wrong bearing and stopped
      about the width of a room short of everything.

      [Chorus]
      Nobody plans it. Nobody gets a warning.
      There is a shift you do not come back from and it looks like all the others.
      Same gate, same coat, same thing said at the door,
      and the difference is not in anything you can see.

      [Bridge]
      Every one of these is a story about somebody who is fine.
      That is why they get told. The other ones do not get told.

      [Final Chorus]
      Nobody plans it. Nobody gets a warning.
      So say the thing at the door. Say it every time.
      Say it when it is boring and say it when you are late,
      and let it be the stupidest thing you do all week.

      [Outro - fade at full size]
