    guest piano on s_0291, kept out of the low register so the pipes keep it; Brin Noll's retuned
    railing fittings on s_0294; and Sel Ardin's assembled closing harmony on s_0295, the one place
    the backing line is exceeded. Havel Ost's voice is damaged from the sixth day onward and s_0285
    is sung on what was left of it; the voice line itself does not change.

