    exclude: acoustic guitar, twelve-string jangle, synth pads, string sections, brass, four-on-the-floor kick, vocal tuning, whispered or rapped sections, dance and electronic production, stacked studio harmony
    lyrics: |
      [Intro - 4 seconds, guitar and struck alloy, no vocal]

      [Verse 1]
      Seven years in the chair and nothing with his name on it,
      which nobody decided and everybody let happen,
      and it came up on a Tuesday evening over a bad meal
      because a copy of somebody else's record had gone round the hall
      with the wrong name printed on it, off a hauler, down the lane.

      [Verse 2 - lead vocal, no harmony, bass chair forward beneath it]
      I do not want the biggest share and I never asked for one.
      I want the line under the title where the writing goes
      to say what actually happened in the room that day,
      because in nine years somebody will read it and believe it.
      That is the whole of the argument. That is all of it.

      [Chorus]
      Put my name next to it. Not above it. Next to it.
      Same size, same page, same ink as everybody else.
      A name on a sleeve is not money and it is not pride,
      it is a fact, and facts get argued about later.

      [Verse 3]
      So we printed every share on the back of the record,
      four names, four numbers, and one of them is small
      and it is his and it is the first one he has had
      and he has not said a word about it since the day it landed.

      [Chorus]
      Put my name next to it. Not above it. Next to it.
      Same size, same page, same ink as everybody else.
      A name on a sleeve is not money and it is not pride,
      it is a fact, and facts get argued about later.

      [Bridge]
      Somewhere out on the relay road there is a copy of this
      with the wrong name on it, and we know, and we cannot get it back.

      [Final Chorus]
      Put my name next to it. Not above it. Next to it.
      Every share printed and the argument over in an evening,
      which is nine years faster than we managed the last one.
      Ask for it out loud. Nobody offers.

      [Outro - cold stop]
