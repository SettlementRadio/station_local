    lyrics: |
      [Intro - 9 seconds, tuned railing metal, no vocal]

      [Verse 1]
      Every hall has four people who make more noise than the rest
      and you can find them from the stage inside about a minute
      and they are never the ones at the front, they are halfway back
      by the doors, with their coats still on, and they arrived late,
      straight off a deck or a late lane with the dust still on them.

      [Chorus]
