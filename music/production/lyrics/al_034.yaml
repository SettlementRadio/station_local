# Written by M-22. **The file shape is fixed by al_001.yaml — read that header once.** Production
# vocabulary (COMMISSION.md §8): never enters the wiki, never said on air. Lyrics written by hand;
# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# **A cornerstone**, and one of the six to eight records that has to carry a whole 56-minute
# programme on its own (§5), so it got the extra passes §12's note asks for. Thirteen songs, eleven
# days, one Forge pipe hall with the rig left standing in it by the band who had it the fortnight
# before. The wiki gives this record a singer who lost his voice on the sixth day, an argument about
# writing shares that was settled by printing every share, a cracked cymbal, and a label asking for
# a shorter record on the last day and getting two verses cut rather than two songs. Every one of
# those facts is audible in an arrangement; where the words approach the work itself, they stay with
# the people making the decision rather than turning into sung sleeve notes.
#
# **The card's backing line is exceeded exactly once and the wiki requires it.** b_017's backing is
# *one male harmony voice from the bass chair, never a stack*, and s_0295's fact is a closing harmony
# assembled from eleven takes sung by five people. That song, and only that song, carries a stack,
# and its prompt says so. Every other track on the record has one low voice under the lead and
# nothing else.
#
# Lane-rock takes a break in roughly one song in three (§7) and b_017 gives the break to the
# amplified pipes. Four of these thirteen take one.
#
# `generation:` and every `take:` are empty until M-31's Suno sitting fills them in.

