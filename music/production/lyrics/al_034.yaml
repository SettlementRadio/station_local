      Brin came in with a bag of spanners on the sixth day
      and went round the railings of that hall tapping each one,
      and by the afternoon the rails answered the chorus cleanly,
      and he checked them again whenever the room went cold.

      [Chorus]
      Count the loud ones. Four of them tonight.
      Two by the doors, one on the rail, one I cannot see.
      They are the reason the quiet ones came out at all,
      because nobody wants to be the first person to shout.

