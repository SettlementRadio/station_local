    prompt: >-
      78 BPM wry slow blues torch; quiet low female contralto close and dry, upright piano, upright
      bass, brushed kit, plucked electronic strings, the whole band dropping out under one line in
      each verse, fade.
    exclude: backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano and bass, eight seconds]

      [Verse 1]
      The first one came in April on a Tuesday,
      a slip of paper folded into three,
      and the figure written on it in blue pencil
      was forty-one and eighty. Ask the band.
      We took it to the merchant on the corner
      who has known the house since either of us started.

      [Chorus]
      Everything on account, everything on paper.
      Everything is coming, and it will.
      I have played this room eleven hundred evenings.
      I have never yet been paid in something I could spend.

      [Verse 2]
      The second was in May and it was smaller,
      nineteen and forty, and it came by hand
      from a clerk who would not meet the eye of any of us
      and had clearly been told not to stay.
      The third one nobody remembers opening.
      The fourth was six and twenty, and was last.
      They are in Tarrin's book in the same order
      with a line drawn under the whole of what they are.

      [Chorus]
      Everything on account, everything on paper.
      Everything is coming, and it will.
      I have played this room eleven hundred evenings.
      I have never yet been paid in something I could spend.

      [Verse 3]
      I am not telling you this as a complaint.
      A complaint is a thing you take to somebody.
      There is nobody left down here to take it to;
      the man it goes to is the man it is about.
      So it goes in a song, which is where things go
      when the office and the window are both shut,
      and the freight crew who have come up off the lanes
      can hear four numbers and know what they mean.

      [Final Chorus]
      Everything on account, everything on paper,
      and the room still full at one, past the last ferry.
      I have played this room eleven hundred evenings.
      I would play it for a fifth note. There. It's told.

      [Outro - piano fading]
