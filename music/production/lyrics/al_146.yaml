  - id: s_1187
    title: Nobody Owns a Night
    track_number: 5
    mood: [aching, spacious, slow]
    fact: >-
      Hessa Lin's figure quotes the walking part Odile Prenn left behind, which is the only thing on
      the record neither claimant has ever tried to put a number on.
