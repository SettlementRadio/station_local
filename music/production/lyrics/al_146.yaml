      electronic strings, hard cold stop.
    exclude: backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, fade ending
    lyrics: |
      [Intro - piano, five seconds]

      [Verse 1]
      Four boxes came out of that building on a handcart
      and the handcart was not ours and we brought it back.
      It took a day and a half of standing arguing
      to be allowed to carry off our own.
      The cargo doors were shut and stayed shut on us.
      A man came out at four and let us through.
      They are in the room now, under the piano,
      and we sell them off the top of it at cost.
      When they are gone there will not be any others.
      That is not sad. That is arithmetic.

      [Verse 2]
      Somewhere there is a cupboard with the rest in
      and a man who is not allowed to open it,
      and two sets of solicitors who write each other
      about a thing that neither one has heard.
      I hope it is dry in there. I mean that plainly.
      I would rather it survived and stayed away
      than came out into anybody's ownership
      with a sticker on the spine and half our name.
      A thing can be looked after and still lost.

      [Refrain]
      This is the last of it they pressed. No other.
      Four boxes and a room and Thursday nights.
      If you have one of these, you got it from us
      out of the hands of somebody who played on it.

      [Verse 3]
      We are still here. That is the awkward ending.
      Nobody wants the group that did not stop.
      They want the folded house and the disputed catalogue
      and a story with a shut door at the end.
      Come up the stair. It is eleven and a half
      to cross the water and about the same to leave.
      The last ferry has gone. It always has by then.
      That has never emptied out this room yet.
      We start at ten and finish when it finishes.
      Bring the cold in with you. Shut the door.

      [Outro - cold stop]
