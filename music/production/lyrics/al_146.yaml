songs:
  - id: s_1183
    title: Everything on Account
    track_number: 1
    mood: [wry, bitter, midtempo]
    fact: >-
      The four amounts Nesta Vire sings are the four credit notes the band was last paid in, in the
      order they were issued.
    arrangement_note: the four amounts fall in the same place in each verse and the band drops out under every one of them, so the number is the loudest thing on the track
    intro: 8
    outro: fade
    target_duration: "3:45"
    prompt: >-
      78 BPM wry slow blues torch; quiet low female contralto close and dry, upright piano, upright
      bass, brushed kit, plucked electronic strings, the whole band dropping out under one line in
      each verse, fade.
    exclude: backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano and bass, eight seconds]

      [Verse 1]
      The first note came folded on a Tuesday,
      blue pencil pressed so hard it marked the back.
      We took it to the merchant on the corner;
      he held it to the light and handed it back.

      [Amount - all instruments drop out]
      Forty-one and eighty.

      [Verse 2]
      The second came by hand before the ferry,
      carried by a clerk who would not stay.
      It could not buy the coal due in that evening
      or clear the oldest ration on the slate.

      [Amount - all instruments drop out]
      Nineteen and forty.

      [Chorus]
      Everything on account, everything on paper.
      Every promise payable someday.
      A figure can be honest without feeding you.
      A signature can still turn bread away.

      [Verse 3]
      The third arrived beneath a blank white cover.
      No month, no office window, no excuse.
      We split the room rent five ways at the table
      and watched this smaller promise fail there too.

      [Amount - all instruments drop out]
      Twelve and ten.

      [Verse 4]
      The final note came after work had ended,
      thin enough to show the lamp flame through.
      It would not buy one berth beyond the water,
      but it completed what the papers knew.

      [Amount - all instruments drop out]
      Six and twenty.

      [Chorus]
      Everything on account, everything on paper.
      Every promise payable someday.
      A figure can be honest without feeding you.
      A signature can still turn bread away.

      [Bridge]
      We framed the four in order by the piano,
      not as grievance, not to make them art.
      Freight crews read the numbers after midnight
      and know which kind of paper weighs the heart.
      Paper does not sour like milk or weather.
      It waits without demanding what it owes.
      That is why a promise can outlive the hunger
      of the hands that held it when it first was cold.

      [Final Chorus]
      Everything on account, everything on paper.
      The room still fills beyond the last ferry.
      The lane keeps every promise people honor;
      these four wait above the keys, unspent.

      [Outro - piano fading]
