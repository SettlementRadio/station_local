    target_duration: "4:10"
    prompt: >-
      54 BPM spacious aching slow torch; quiet low female contralto close and level, plucked
      electronic strings quoting an old walking figure in the second half of each verse, upright
      piano taking a sixteen-second break over it, upright bass, brushed kit, sustained ending.
    exclude: backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - plucked strings, then piano, seventeen seconds]

      [Verse 1]
      After the last ferry leaves the landing,
      one old walking figure crosses town.
      A woman gone before our mothers knew her
      left it in the way her fingers came back down.
      No page keeps the pressure or the timing.
      No account can say which note came first.
      It travels in the hands of tired players,
      changing just enough to stay at work.

      [Chorus]
      Nobody owns a night between the ferries.
      Nobody owns the chair beside the flame.
      Sit until the old four notes come walking;
      leave them warmer for the hands that came.

      [Verse 2]
      One freight worker hums it near the doorway.
      One night porter taps it with a key.
      Someone from a storm-coast settlement
      knows another ending none of us have heard.
      We make room beneath the quiet opening,
      let the borrowed ending find its place.
      Every stranger adds a little weather;
      no one asks the tune to show its papers.

      [Instrumental - upright piano break over the walking figure, sixteen seconds]

      [Bridge]
      The figure does not know who first received it.
      It asks no fee and keeps no private room.
      Each pair of hands removes a little polish.
      Each tired player gives it something new.
      By dawn the tune belongs to no one.
      That is how it reaches everyone.

      [Verse 3]
      Near the first ferry, coats return to shoulders.
      Cups turn over, lamps go one by one.
      The old line walks beneath the final doorway,
      follows every worker toward the dawn.
      Some will lose the notes before next Thursday.
      Some will teach them farther down the lane.
      Time can close a house and sell the tables;
      it cannot call a shared hour back again.

      [Chorus]
      Nobody owns a night between the ferries.
      Nobody owns the chair beside the flame.
      Sit until the old four notes come walking;
      leave them warmer for the hands that came.

      [Outro - plucked strings and piano sustaining]
