    prompt: >-
      58 BPM warm resigned slow torch; quiet low female contralto close and unhurried, upright bass
      leading the arrangement with the upright piano behind it, brushed kit, plucked electronic
      strings, fade.
    exclude: backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - bass alone, then piano, thirteen seconds]

      [Verse 1]
      He has it on the wall above the upright,
      four slips in a frame he bought himself.
      Everybody asks and he explains it
      the same way every time and does not tire.
      This one is April. This one is the small one.
      This one nobody ever opened. This is last.
      He does not say the word for what they are.
      He says: this is what a record cost the band.

      [Verse 2]
      His wife has asked him twice to take it down
      and both times he has said that he will think.
      It is not a grievance hanging on the plaster.
      He is not the kind of man who keeps a grudge.
      It is only that a thing that cannot buy
      a loaf, a fare, a ration or a berth
      still bought a whole spring of five people's evenings
      and he wants the evenings written somewhere down.

      [Refrain]
      Paid in slips, and none of the slips will spend.
      Framed on the wall above where the piano stands.
      It is not a wound and it is not a joke.
      It is a receipt for something that was made.

      [Verse 3]
      The room is still the room. The band still plays it.
      People come up off the last ferry at one.
      Nobody in the audience has ever noticed
      the four small slips behind the player's head.
      And once a season somebody comes up after
      and asks him what they are, and he will tell them,
      and it takes him about a minute, and he smiles,
      and then he goes back over and sits down.

      [Refrain]
      Paid in slips, and none of the slips will spend.
      Framed on the wall above where the piano stands.
      It is not a wound and it is not a joke.
      It is a receipt for something that was made.

      [Outro - bass and piano, fading]
