  - id: s_1184
    title: Who Signs for This
    track_number: 2
    mood: [cold, tense, slow]
    fact: >-
      Ollan Beke wrote it in the plant's waiting room while the band argued for its own copies, and
      the count-in is the number on the clerk's window.
    arrangement_note: a spoken count-in on a two-digit number, kept on the take, and the piano break is the only place the tension comes off
    intro: 6
    outro: cold
    target_duration: "4:00"
    prompt: >-
      66 BPM cold tense slow blues torch; a quiet spoken two-word count-in kept at the top, quiet low
      female contralto close and level, upright piano taking a thirteen-second break, upright bass,
      brushed kit, plucked electronic strings, hard cold stop.
    exclude: backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, rapped sections, modern studio production, fade ending
    lyrics: |
      [Intro - spoken count-in on the window number, then piano, six seconds]

      [Verse 1]
      Twenty-nine is the number on the window.
      There is a bench. There is a form. There is a queue.
      The man behind the glass is not unpleasant.
      The man behind the glass has nothing he can do.
      We have been here since the middle of the morning
      with four boxes' worth of something that is ours,
      and the only question anybody asks us
      is a question about who is going to sign.

      [Verse 2]
      Not the house, because the house is not a person
      and the person who was it will not come out.
      Not the plant, because the plant is owed and knows it,
      and a thing that is security cannot go out the door.
      Not the hauler crew, who lift and leave the cargo.
      So the four of us stand there in the corridor
      being nobody the paperwork believes.

      [Chorus]
      Who signs for it, then? Somebody has to.
      Who puts a name to it? Not one of them will.
      There is a box with our own name across the side of it
      and a stranger's hand across the seal.

      [Instrumental - upright piano break, thirteen seconds]

      [Verse 3]
      By afternoon the strip light starts its humming.
      The bench has pressed a line across my coat.
      Window twenty-nine keeps calling others;
      every called name leaves more empty floor.
      Waiting turns the smallest sound to weather:
      paper sliding, chair legs, someone's cough.
      Four sealed boxes sit beneath our own names,
      close enough to touch and still held off.
      Outside, another hauler clears the siding.
      Inside, nothing ours can cross the glass.

      [Chorus]
      Who signs for it, then? Somebody has to.
      Who puts a name to it? Not one of them will.
      There is a box with our own name across the side of it
      and a stranger's hand across the seal.

      [Outro - cold stop]
