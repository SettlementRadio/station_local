    exclude: backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - plucked strings, then piano, seventeen seconds]

      [Verse 1]
      There is a walking part that came from a dead woman
      and everybody in this quarter plays it wrong.
      She left no paper. She left nothing written.
      What she left is in the hands of people's hands.
      Two houses have gone under since she stopped.
      Three rooms have closed. A whole street has been sold.
      Nobody has ever put a figure on the figure.
      Nobody has ever thought to try.

      [Chorus]
      No one owns a night. You can own the pressing.
      You can own the plant and every box in it.
      The hour between the last ferry and the first one
      belongs to whoever is awake and in the room.

      [Verse 2]
      They can have the masters. Let them have the masters.
      They have got them and they cannot agree whose.
      There are eleven records in a receiver's cupboard
      and a lamp on them and a docket and a lock.
      I would like them back. I am not going to get them.
      That is a sentence I have learned to say out loud.
      But the part that came from her goes round the quarter
      in the fingers of about a hundred hands.

      [Instrumental - upright piano break over the walking figure, sixteen seconds]

      [Verse 3]
      A claim is a thing you make about an object.
      You cannot make a claim about a Tuesday.
      You cannot take delivery of an evening,
      or hold a room, or bank an hour of it.
      Whoever comes up out of the cold and settlement
      into this light and sits and does not speak
      is doing the one thing that is not in the schedule
      and no receiver anywhere can touch.

      [Chorus]
      No one owns a night. You can own the pressing.
      You can own the plant and every box in it.
      The hour between the last ferry and the first one
      belongs to whoever is awake and in the room.

      [Outro - plucked strings and piano sustaining]
