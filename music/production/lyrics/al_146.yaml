  - id: s_1186
    title: Keep the Room Open
    track_number: 4
    mood: [defiant, warm, building]
    fact: >-
      The chorus is what the Lower Bell's staff shouted at the founder's last meeting, and all five
      of the band sing it because Nesta Vire would not sing it on her own.
    arrangement_note: all five of the band sing every chorus, ragged and unmatched and in no arrangement at all, and the lead is alone again the moment each chorus ends
    intro: 10
    outro: sustain
    target_duration: "4:15"
    prompt: >-
      72 BPM defiant building slow torch; quiet low female contralto close and unhurried in the
      verses, five untrained voices together and unarranged on every chorus, upright piano, upright
      bass, brushed kit, plucked electronic strings, sustained ending.
    exclude: trained or blended backing harmony, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted lead vocal, large reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - piano and bass, ten seconds]

      [Verse 1]
      There were nineteen of us in a room built for twelve
      and the founder at the end behind a table.
      He had the figures and he read them out
      and every one of them was true and did not help.
      Somebody's mother had worked the door since Clearing Day.
      Somebody had come in on their night off.
      He said the words that men say in that chair
      and then he stopped, and then the shouting started.

      [Chorus - all five voices]
      Keep the room open! Keep the room open!
      Whatever else goes, whatever else is sold!
      Shut the house and shut the whole account down —
      keep the room open, and we will do the rest!

      [Verse 2]
      It is not a slogan. Nobody had planned it.
      It came out of the back and went round twice
      and by the third time even the ones who hated it
      were saying it because the room had turned.
      That is what a room is. That is all it is.
      A place where nineteen people find one line.
      Ask anybody who was up against the wall there.
      They will tell you they were not the one who started.

      [Chorus - all five voices]
      Keep the room open! Keep the room open!
      Whatever else goes, whatever else is sold!
      Shut the house and shut the whole account down —
      keep the room open, and we will do the rest!

      [Verse 3]
      The house went dark before the month was over.
      Every careful figure stayed as true.
      Thursday found the lower room still lighted,
      chairs set down and kettle coming through.
      What we shouted in the crowded meeting
      became the work of every open night.
      Come off the last ferry, climb the stairwell.
      No single voice is keeping on the light.
      Nineteen hands still answer from the old walls.

      [Outro - the five voices sustaining, then piano alone]
