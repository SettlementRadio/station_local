  - id: s_1185
    title: Paid in Paper
    track_number: 3
    mood: [resigned, warm, slow]
    fact: >-
      Tarrin Meel was paid for the record in paper the plant would not accept, kept all of it, and
      has it framed on the wall of the room the band still plays.
    arrangement_note: the bass leads the whole song and the piano stays behind it, which is the only track on the record where that happens
    intro: 13
    outro: fade
    target_duration: "3:50"
    prompt: >-
      58 BPM warm resigned slow torch; quiet low female contralto close and unhurried, upright bass
      leading the arrangement with the upright piano behind it, brushed kit, plucked electronic
      strings, fade.
    exclude: backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, cold ending
    lyrics: |
      [Intro - bass alone, then piano, thirteen seconds]

      [Verse 1]
      He keeps four slips above the room's old upright,
      straight inside a frame he bought himself.
      April first, then May, then one undated,
      then the final narrow promise on the right.
      People ask why paper needs protecting
      when no merchant takes it for a loaf.
      He says the frame remembers five long evenings
      better than a figure in a closed account.

      [Verse 2]
      His wife has asked him twice to take it down
      and both times he has said he might by spring.
      It is not anger hanging on the plaster.
      Anger would have yellowed years ago.
      It is proof that something unable to buy
      a loaf, a fare, a ration, or a berth
      still consumed a whole spring of five people's evenings,
      and those evenings ought to live somewhere.

      [Refrain]
      Paid in slips, and none of the slips will spend.
      Framed on the wall where the low notes start.
      Not quite a wound and never quite a joke,
      only four small windows into work.

      [Bridge]
      Some evenings labor leaves no monument.
      Some debts disappear when doors are sold.
      He keeps no faith in paper becoming money.
      He keeps faith that hours deserve a shape.

      [Verse 3]
      At one the last ferry sends its people.
      Coats fill every hook beside the stair.
      He takes his chair beneath the four pale papers,
      lets the walking bass collect the room.
      Once a season someone waits till closing,
      asks him why the slips are hanging there.
      He tells it plainly in less than a minute,
      smiles, folds the cover, and returns to work.

      [Refrain]
      Paid in slips, and none of the slips will spend.
      Framed on the wall where the low notes start.
      The relay loses numbers, names, and reasons;
      the room remembers who gave up the hours.

      [Outro - bass and piano, fading]
