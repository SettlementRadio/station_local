  - id: s_1188
    title: Last Thing Pressed
    track_number: 6
    mood: [final, cold, hushed]
    fact: >-
      Every copy that exists outside the receiver's room came out of the four boxes the band carried
      away from the Gantry Street plant themselves.
    arrangement_note: the band drops to piano and voice alone for the last verse and the kit does not return, so the record stops on the smallest thing on it
    intro: 5
    outro: cold
    target_duration: "3:35"
    prompt: >-
      56 BPM cold hushed closing torch; quiet low female contralto very close, upright piano, upright
      bass and brushed kit dropping away entirely for the final verse leaving piano and voice, plucked
      electronic strings, hard cold stop.
    exclude: backing vocals, saxophone and brass, orchestral strings, electric guitar, drum machines, four-on-the-floor kick, belted vocals, large reverb, vocal tuning, whispered or rapped sections, modern studio production, fade ending
    lyrics: |
      [Intro - piano, five seconds]

      [Verse 1]
      Four boxes left the building on a handcart.
      The cart was borrowed, scrubbed, and carried back.
      A day and half of waiting at the cargo doors
      bought ten short minutes underneath the clock.
      We chose what four tired pairs of arms could manage,
      tied the lids with curtain cord and twine.
      They sit beneath the room's old upright piano,
      each one marked in our familiar hand.
      When the last one leaves, there are no others.
      Grief can sometimes look like simple sums.

      [Verse 2]
      Somewhere there is still a locked back cupboard,
      one clean lamp and someone checking damp.
      I hope the roof holds through the storm season.
      I hope careful hands keep every corner square.
      Wanting something back is not the same as
      wanting it destroyed for being withheld.
      Let it last beyond the names above the doorway.
      Let it wait until the claims have lost their teeth.
      A thing can be protected and still missing.
      A thing can be remembered out of reach.

      [Refrain]
      Four boxes underneath the piano.
      Four small doors the lock did not retain.
      Carry one gently through the lower quarter.
      What survives still knows the road it came.

      [Verse 3 - piano and voice only]
      We remain, which spoils the tidy ending.
      Thursday puts the lamps along the stair.
      Eleven and a half will cross the water;
      after midnight, take the long way there.
      Freight crews still arrive beyond the last ferry.
      Cold comes through each coat and fills the hall.
      We set one box upon the upright piano,
      then make room for whoever climbs the stair.
      Nothing here concludes when doors are closing.
      Bring the weather in and join us there.

      [Refrain]
      Four boxes underneath the piano.
      Four small doors the lock did not retain.
      Carry one gently through the lower quarter.
      What survives still knows the road it came.

      [Outro - cold stop]
