    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, single fiddle, fade-out
    lyrics: |
      [Intro - two fiddles alone, eighteen seconds]

      [Verse 1]
      There is a thing that happens when you put two of them in a room
      and it is not a fight, whatever the sleeve is going to say.
      It is closer to two people finishing each other's sentences
      badly, and on purpose, and at a hundred and sixty-eight.
      Nessa came in off the relay road on the Tuesday
      and by the Wednesday we had stopped explaining anything to her.

      [Chorus]
      Four bars yours and four bars mine and four bars yours again,
      and whoever is still standing at the end of it can have it.
      Nobody wins. That is not what any of this is.
      But somebody always finishes, and it matters who.

      [Verse 2]
      I wrote the last one for myself. I had it in my hand.
      I had been playing it in the cart for about a week.
      And she came round the corner of it about two bars early
      with something I have not been able to play since, and I let her.
      You can hear me not play it. There is a hole where I was.
      That is the best thing on this record and it is not mine.

      [Instrumental - two fiddles trading four bars each, twenty seconds, the second takes the last]

      [Verse 3]
      Arel says I gave it away because I knew it was better.
      Marda says I gave it away because I was tired.
      Finn has not said anything about it, which is his way of saying it,
      and Nessa has a ferry on the Sunday and will not discuss it at all.
      She is on three of these nights and then she is gone
      and there is a hole in the middle of this one where I was.

      [Final Chorus - harmony a third below]
      Four bars yours and four bars mine and four bars yours again.
      I have played this room for sixteen years and I know what I heard.
      Nobody wins. That is not what any of this is.
      Ask the floor who finished it. The floor will tell you.

      [Outro - cold stop]
