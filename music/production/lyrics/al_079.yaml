      third below the lead on the chorus only, nothing under the verses. Bright thin-toned composite
      fiddle, fretted acoustic-toned composite guitar, upright bass, cut-stock drum kit played with
      brushes and sticks. Tracked live in a wooden dance hall with no click, light slapback on the
