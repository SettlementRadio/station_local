    lyrics: |
      [Intro - fiddle and guitar, twelve seconds]

      [Verse 1]
      There is a gate between the berth and the road into town
      and it shuts at nine and nobody has ever argued with that.
      Except there is a clerk on the late shift who has, for eleven years,
      opened it for four people with a bass and a drum on a cart.
      She has never asked for anything. She has never been thanked.
      Her name is not on either record and she has not mentioned it.

      [Chorus]
      She works the late gate and she has the whole book in her head,
      what is due, what is late, what is going nowhere until the thaw.
      Eleven years of a cart at half past nine
      and eleven years of a woman deciding not to see it.

      [Verse 2]
      There is a version of this settlement that is only rules
      and there is nothing wrong with rules and rules keep the ice out.
      And then there is the other one, which is what actually happens,
      which is people quietly deciding what to enforce.
      Every hall we have ever played, we got in through somebody.
      Every one. Eleven years. Not one of them wrote it down.

      [Chorus]
      She works the late gate and she has the whole book in her head,
      what is due, what is late, what is going nowhere until the thaw.
      Eleven years of a cart at half past nine
      and eleven years of a woman deciding not to see it.

      [Verse 3]
      She is out there. She is at the far end near the door
      because she cannot stand still and cannot be seen to dance.
      This is the thank you. This is the whole of the thank you.
      It is a tune, which is not much, and it is the thing we have.
      She is going to be furious about this in the morning.
      She is going to say she was only doing the job. She was not.

      [Final Chorus - harmony a third below]
      She works the late gate and she has the whole book in her head,
      and the book says the gate is shut, and the gate has not been shut.
      Eleven years of a cart at half past nine.
      Everybody in this hall came through somebody's gate.

      [Outro - fade]
