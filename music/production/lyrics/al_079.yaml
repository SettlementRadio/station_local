  - id: s_0651
    title: Nothing Left in the Kettle
    track_number: 4
    mood: [wry, midtempo, tired]
    fact: >-
      Oren Saye plays bass so that Arel Tocke could sit in the hall and listen to the band from the
      floor for the first time in sixteen years.
    arrangement_note: the bass is a different instrument and a different player and sits further back in the room than anywhere else on the record, and the band plays slightly more carefully all the way through because one of them is out there listening
    intro: 8
    outro: sustain
    target_duration: "3:40"
    prompt: >-
      138 BPM tired fiddle reel; hard female soprano, guest upright bass, warm live hall, held ending.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, aggressive slap bass, cold ending
    lyrics: |
      [Intro - band, eight seconds]

      [Verse 1]
      It is the fourth night and the kettle has been empty for an hour
      and the woman who runs it has gone home to sleep for six hours.
      There is a rota for that kettle. There has always been a rota.
      Nobody on it has ever been paid or thanked or listed.
      Whatever this settlement is, it is that rota and four hundred boots
      and a stove somebody keeps going without being asked to.

      [Chorus]
      Nothing in the kettle and nothing in the tin,
      and about two hours of the night still to be got through.
      Somebody find a cup. Somebody find the woman.
      This is not a crisis but it is not far off one.

      [Verse 2]
      Arel is out there. Arel is on the floor.
      Sixteen years of standing behind a bass in this hall
      and tonight Oren from the relay road has it under both hands.
      Arel stands at the back with his coat still buttoned.
      First tune, he watches Oren. Second tune, he watches us.
      Third tune, somebody pulls him out onto the boards.

      [Chorus]
      Nothing in the kettle and nothing in the tin,
      and about two hours of the night still to be got through.
      Somebody find a cup. Somebody find the woman.
      This is not a crisis but it is not far off one.

      [Verse 3]
      Oren plays each written change exactly where it falls.
      At the first wrong corner Arel lifts one finger.
      At the second he smiles. At the third he mouths too late.
      By the fourth he is laughing into somebody's shoulder.
      Tomorrow he takes the bass and all four corners back.
      Tonight he hears what sixteen years has done to them.

      [Final Chorus - harmony a third below]
      Nothing in the kettle and nothing in the tin,
      and a man in his own hall with nothing in his hands.
      Somebody find a cup. Somebody find the woman.
      Sit down, Arel. There are two hours to go.

      [Outro - held chord]
