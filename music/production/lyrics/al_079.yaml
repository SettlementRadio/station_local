  - id: s_0655
    title: Money for the Room
    track_number: 8
    mood: [brisk, blunt, driving]
    fact: >-
      It replaced a tune about the same dispute that named the hall keeper directly, and Harbor
      Standard refused to press that version.
    arrangement_note: two fiddles again, the second one playing a hard unison rather than an answer, so the tune is heavier than anything else on the record without being faster
    intro: 5
    outro: fade
    target_duration: "3:35"
    prompt: >-
      152 BPM blunt two-fiddle reel; hard female soprano, heavy fiddle unison, live dance hall fade.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, fiddle solos, cold ending
    lyrics: |
      [Intro - band, five seconds]

      [Verse 1]
      The first page carried one real name in the second line.
      The Harbor man read it twice and folded up the sheet.
      Hessa took it back and struck the letters through.
      Nessa set her fiddle hard against the crossing-out.
      The name is gone. The number underneath remains.
      Forty at the door looks worse without a person on it.

      [Chorus]
      Money for the room, money for the light, money for the floor,
      show the roof repair and show the winter coal.
      Put the figure on the table where four hands can reach it.
      Forty from the door is forty. Say it plain.

      [Verse 2]
      The keeper brought a ledger thick with folded corners.
      Roof patch, stove pipe, two new boards beside the wall.
      Arel read each line and nodded till the total.
      Then he turned the book around and tapped the forty.
      Outside, a freight crew waited by the berth, coats half on.
      One saw the number through the glass and told the rest.

      [Verse 3]
      He came to the third night and stood at the back and listened
      and knew the tune before the second verse arrived.
      He smiled once, then counted every body on the floor.
      At the door he shook Arel's hand and said well played.
      Arel came back in and put the ledger by the stove.
      Neither one moved the number. Both came back next night.

      [Chorus]
      Money for the room, money for the light, money for the floor,
      show the roof repair and show the winter coal.
      Put the figure on the table where four hands can reach it.
      Forty from the door is forty. Say it plain.

      [Final Chorus - harmony a third below]
      Money for the room, money for the light, money for the floor.
      One name crossed out and one hard number left.
      Put the ledger by the stove and leave it open.
      Everybody through the door can read the line.

      [Outro - fade]
