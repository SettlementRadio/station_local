    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, dynamic swells, fade-out
    lyrics: |
      [Intro - band, six seconds]

      [Verse 1]
      A record of a dance is a record of four hundred people
      and three of them get paid and the rest of them get thanked.
      Four hundred people off a deck and off a late shift.
      That was the first one and it sold what it sold,
      and every review of it was about the sound of the floor.
      So the sound of the floor is on the invoice this time.
      It took a fortnight to agree and it took one line to write.

      [Chorus]
      Paid at the door on the way in, not on the way out.
      Small money, honest money, and it goes in a hand.
      Whoever is on that floor is on this record,
      and whoever is on this record gets their share of it.

      [Verse 2]
      The label's man said nobody has ever done that.
      Arel said that is not an argument, that is a description.
      The label's man said the accounts will not have a line for it.
      Arel said then the accounts will get a new line.
      There was a long quiet and then the man wrote it down,
      and that is how a rate on this whole coast got set.

      [Pre-Chorus]
      We played it on the first night before the money came,
      which was either confidence or a way of making sure.

      [Chorus]
      Paid at the door on the way in, not on the way out.
      Small money, honest money, and it goes in a hand.
      Whoever is on that floor is on this record,
      and whoever is on this record gets their share of it.

      [Verse 3]
      There is a woman who has danced in this hall since she was nine
      and has been on two records and has never been asked her name.
      She was in the queue at seven with her hand already out
      and she made the clerk write it down and read it back to her.
      That is the whole of it. That is what a manifest is for.
      If you are on the load, you are on the paper. Nothing else.

      [Final Chorus - harmony a third below]
      Paid at the door on the way in, not on the way out.
      Small money, honest money, and it goes in a hand.
      Nobody in this hall is doing anybody a favour.
      Everybody in this hall is at work tonight.

      [Outro - cold stop]
