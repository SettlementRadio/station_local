    lyrics: |
      [Intro - band, four seconds]

      [Verse 1]
      Every caller on this coast will tell you the same thing:
      you take the tune round once so the floor can learn the shape,
      and then you take it round again and you take it faster,
      and the second time is the one they will talk about all week.
      Doing it on a stage is easy. You just go.
      Doing it on a record with two microphones is not.

      [Chorus]
      Take it round again and do not let them feel the join.
      No slowing into it. No counting. Nothing kind.
      One bar at the old speed and the next one somewhere else,
      and four people arriving at the same place at once.

      [Verse 2]
      Nine takes. Nine. On the fifth one Marda swore
      loudly enough that Harbor Standard had to cut two bars.
      On the seventh Arel came in early and stayed early
      and we played the whole second half about a beat apart.
      The sessions ran a night over and the label paid for the night
      and did not say one word about it, which we noticed.

      [Instrumental - fiddle alone carries the gear change, sixteen seconds]

      [Verse 3]
      The eighth was clean and had nothing in it at all.
      The ninth is this one and Finn came off the beat at the join
      and got back on it inside two bars by an act of will,
      and you can hear him do it, and that is why it is the take.
      A hold full of cargo goes over a bad siding the same way.
      Something shifts, and somebody puts a hand out, and it holds.

      [Final Chorus - harmony a third below]
      Take it round again and do not let them feel the join,
      and if they feel it, keep going, because they will forgive it.
      One bar at the old speed and the next one somewhere else.
      Nine of these and this is the one with the mistake in it.

      [Outro - cold stop]
