  - id: s_0653
    title: Turn It Over Twice
    track_number: 6
    mood: [fast, insistent, hard]
    fact: >-
      The band plays the tune through twice at different speeds and joins them without a break, which
      took nine takes and is the reason the sessions ran a night over.
    arrangement_note: the whole tune is played through at one tempo and then immediately again about fourteen beats a minute faster with no pause and no ritardando between them, and the fiddle carries the join alone so the band has something to change gear against
    intro: 4
    outro: cold
    target_duration: "4:30"
    prompt: >-
      148 to 162 BPM hard fiddle reel; female soprano, sudden mid-song gear change, cold live ending.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, gradual accelerando, fade-out
    lyrics: |
      [Intro - band, four seconds]

      [Verse 1]
      First time round, the young ones learn the corners.
      Left at the coats. Right beside the stove.
      Second time, the caller lifts one hand for faster.
      The freight crew at the wall leans into the turn.
      Hessa holds one note while all four change their footing.
      The next bar lands fourteen beats above the first.

      [Pre-Chorus]
      The caller drops his hand. Hessa keeps the bow moving.
      Old speed leaves at the stove. Fast speed enters by the coats
      without one empty bar.

      [Chorus]
      Take it round again and do not let them feel the join.
      No slowing into it. No counting. Nothing kind.
      One bar at the old speed and the next one somewhere else,
      and four people arriving at the same place at once.

      [Verse 2]
      First try, Finn stayed standing at the slower door.
      Third try, Arel changed before the fiddle gave the sign.
      Fifth try, Marda sent one brush across the floor.
      Seventh try, the fast half split us down the middle.
      Nine tries carried midnight into one more night.
      The keeper brought the keys and sat beside the stove.

      [Instrumental - fiddle alone carries the gear change, sixteen seconds]

      [Verse 3]
      The eighth went clean and nobody on the floor looked up.
      On the ninth Finn lost the turn and found it two bars late.
      Hessa held the join. Marda left him one clear beat.
      Arel leaned across and pulled the low line under him.
      A hold full of cargo goes over a bad siding the same way.
      Something shifts, and somebody puts a hand out, and it holds.

      [Final Chorus - harmony a third below]
      Take it round again and do not let them feel the join,
      and if they feel it, keep going, because they will forgive it.
      One bar at the old speed and the next one somewhere else.
      Finn comes through two bars late and all four leave together.

      [Outro - cold stop]
