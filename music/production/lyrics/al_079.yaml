      Reel-tempo rockabilly and old-time dance music, 142 BPM, midtempo and warm, knowing and
      unhurried. Female lead vocal, clear high soprano with a hard edge, sung in short phrases
      between fiddle passages, never a held note, plain and unornamented. One male harmony voice a
      third below the lead on the chorus only, nothing under the verses. Bright thin-toned composite
      fiddle, fretted acoustic-toned composite guitar, upright bass, cut-stock drum kit played with
