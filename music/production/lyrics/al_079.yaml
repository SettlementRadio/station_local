  - id: s_0652
    title: She Works the Late Gate
    track_number: 5
    mood: [warm, rolling, fond]
    fact: >-
      Hessa Lund wrote it for a gate clerk who had let the band's equipment through after hours for
      eleven years and had never been thanked in public.
    arrangement_note: the tune rolls without ever accelerating and the fiddle plays the same figure under every verse rather than varying it, because the song is about somebody doing the same thing reliably for eleven years
    intro: 12
    outro: fade
    target_duration: "4:00"
    prompt: >-
      136 BPM warm rolling fiddle reel; hard female soprano, repeating fiddle figure, live hall fade.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, tempo changes, cold ending
    lyrics: |
      [Intro - fiddle and guitar, twelve seconds]

      [Verse 1]
      Half past nine, four people pushing one bad cart.
      Bass at the front and one cut drum tied behind.
      The late gate shut. The ferry papers already filed.
      She looks at us, looks once along the empty road,
      then lifts the bar and keeps her stamp beside the book.
      Eleven years and still she never asks the reason.

      [Chorus]
      She works the late gate and she has the whole book in her head,
      what is due, what is late, what is going nowhere until the thaw.
      Eleven years of a cart at half past nine
      and eleven years of a woman deciding not to see it.

      [Verse 2]
      Once the bass wheel split between the berth and gate.
      She found a freight board, rope and somebody's hammer.
      Once the last ferry put us three full hours behind.
      She kept the road lamp burning past the end of shift.
      Once Marda left the brushes on the outward cart.
      The clerk sent them through next morning with the mail.

      [Chorus]
      She works the late gate and she has the whole book in her head,
      what is due, what is late, what is going nowhere until the thaw.
      Eleven years of a cart at half past nine
      and eleven years of a woman deciding not to see it.

      [Verse 3]
      She is out there. She is at the far end near the door
      because she cannot stand still and cannot be seen to dance.
      Hessa says her name once. The whole floor turns.
      The clerk folds both arms and studies the road book.
      At the second chorus one heel finds the moving beat.
      She will call it work tomorrow. Nobody here will.

      [Final Chorus - harmony a third below]
      She works the late gate and she has the whole book in her head,
      and the book says the gate is shut, and the gate has not been shut.
      Eleven years of a cart at half past nine.
      Everybody in this hall came through somebody's gate.

      [Outro - fade]
