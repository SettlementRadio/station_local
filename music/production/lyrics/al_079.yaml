    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, fast reel tempo, cold ending
    lyrics: |
      [Intro - fiddle and guitar, ten seconds]

      [Opening Line - flat, almost spoken, band underneath]
      Cold Harbor exchange hall, and the year is ninety-four.

      [Verse 1]
      Eleven years ago we stood exactly here
      and played this room too fast because the room told us to.
      The label has the tape. The label will not stop selling it.
      Half this floor was not born when the first one came out.
      It went down the relay road and it is still going round.
      They asked me to take the name of the hall out of this song.
      I sang it again the next night and I sang it the same.

      [Chorus]
      Second set, same room, and eleven years of ice.
      Nothing here has changed except every single one of us.
      Same boards, same stove, same door that will not shut,
      and a slower tune, because we are not twenty-six.

      [Verse 2]
      What changed is the money and the money is the story.
      We would not do it again unless the floor got paid,
      and the label thought about it for a fortnight and agreed,
      and every band on this coast has used that rate since.
      Four hundred people are not scenery. They are the record.
      You can hear them on the first one. Now they can hear their names.

      [Chorus]
      Second set, same room, and eleven years of ice.
      Nothing here has changed except every single one of us.
      Same boards, same stove, same door that will not shut,
      and a slower tune, because we are not twenty-six.

      [Verse 3]
      Marda has a wrist that tells her when the storm season turns.
      Arel's bass has been repaired eleven times by Arel.
      Finn stopped drinking. I stopped shouting over the band.
      We are better than we were and we will sell about half.
      That is the arrangement and none of us mind it much,
      and the ones who mind it least are the ones out on the floor.

      [Final Chorus - harmony a third below]
      Second set, same room, and eleven years of ice,
      and the doors go up at midnight the way they always did.
      Same boards, same stove, same door that will not shut.
      Ask for it slower. We can do it slower now.

      [Outro - fade under the room]
