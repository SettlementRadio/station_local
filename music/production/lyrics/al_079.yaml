    title: Last One Standing Up
    track_number: 9
    mood: [fast, communal, bright]
    fact: >-
      Marda Kell counts the band out loud at the end because the hall was too loud for anyone to hear
      the kit, and the count is on the record.
    arrangement_note: a woman's shouted count of four is audible over the last eight bars because the room had got too loud for the kit to be heard, and it is left on the take rather than removed
    intro: 16
    outro: cold
    target_duration: "4:10"
    prompt: >-
      170 BPM bright fiddle reel; hard female soprano, loud crowd, shouted female count, cold live stop.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, fade-out
    lyrics: |
      [Intro - band and rising crowd, sixteen seconds]

      [Verse 1]
      Fifth night, last tune, and the hall has stopped being a room.
      It is one thing now and it is moving in one direction
      and the four of us on the boards are not driving it any more,
      we are hanging on to the back of it and calling that a band.
      I cannot hear the kit. Finn cannot hear the kit.
      Marda cannot hear the kit and Marda is playing it.

      [Chorus]
      Whoever is still standing gets the last tune of the night.
      Everybody else sat down about two hours ago.
      Look at them. Look at what a hall in the dark months does.
      Half this settlement is going to work on nothing.

      [Verse 2]
      Marda stands behind the kit and raises one wet brush.
      One, two, three, four, across four hundred people.
      She counts the way a freight crew counts a loaded lift.
      Finn finds the one. Oren pulls the bottom under.
      Hessa catches four and drives it toward the doors.
      Marda keeps on shouting till the final turn is clear.

      [Instrumental - fiddle break, twelve seconds]

      [Verse 3]
      There is a man from the co-operative here on a route stop
      who has been on that floor since eight and has a run at six
      and is going to sign for a full hold with no sleep in him.
      There is a gate clerk who is not supposed to be here at all.
      Whatever this is, it is the last of it until the thaw,
      and every one of them knows that, which is why nobody has gone.

      [Final Chorus - harmony a third below, the count audible over the top]
      Whoever is still standing gets the last tune of the night.
      Everybody else sat down about two hours ago.
      One, two, three, four, and the doors go up after this,
      and the ice is on the road and nobody cares at all.

      [Outro - cold stop]
