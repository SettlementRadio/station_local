  - id: s_0650
    title: Two Fiddles Arguing
    track_number: 3
    mood: [fast, competitive, bright]
    fact: >-
      Nessa Dray plays the answering fiddle and takes the last exchange, which Hessa Lund had
      written for herself and gave away during the take.
    arrangement_note: two fiddles trade four-bar phrases across a twenty-second break in the middle and the second fiddle takes the last exchange rather than the first, which was decided during the take and not before it
    intro: 18
    outro: cold
    target_duration: "4:15"
    prompt: >-
      168 BPM bright two-fiddle reel; hard female soprano, competitive trade, live hall, cold stop.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, single fiddle, fade-out
    lyrics: |
      [Intro - two fiddles alone, eighteen seconds]

      [Verse 1]
      Nessa came off the relay road with frost across her case.
      She opened it beside the stove and tightened every string.
      Hessa played four bars without looking from the bow.
      Nessa sent four back before the last note settled.
      By Wednesday neither one was leaving space politely.
      The floor made a ring and let the two of them through.

      [Chorus]
      Four bars yours and four bars mine and four bars yours again,
      and whoever is still standing at the end of it can have it.
      Nobody wins. That is not what any of this is.
      But somebody always finishes, and it matters who.

      [Verse 2]
      Hessa kept the last exchange folded in her hand.
      She had played it to the cart wheels for a week.
      Nessa reached the corner two full bars ahead
      and found a sharper ending waiting past the turn.
      Hessa raised her bow, then pointed it across.
      Nessa took the final four and did not give them back.

      [Instrumental - two fiddles trading four bars each, twenty seconds, the second takes the last]

      [Bridge]
      One bow points toward the wall. One points down the lane.
      One leaves a space above the beat. One cuts across it.
      Four bars pass between them faster than a spoken answer.
      Nessa takes the last four. Hessa stamps the floor.

      [Verse 3]
      At the cold stop Nessa looked straight toward the berth.
      Her Sunday ferry token was tucked beneath the bridge.
      Marda laughed. Arel stamped both heels once.
      Finn brought the cases and wisely said nothing.
      Hessa asked if she would take the ending next night.
      Nessa closed the case and said ask me after four bars.

      [Final Chorus - harmony a third below]
      Four bars yours and four bars mine and four bars yours again.
      I have played this room for sixteen years and I know what I heard.
      Nobody wins. That is not what any of this is.
      Ask the floor who finished it. The floor will tell you.

      [Outro - cold stop]
