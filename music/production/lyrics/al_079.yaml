  - id: s_0649
    title: Paid at the Door
    track_number: 2
    mood: [brisk, plain, satisfied]
    fact: >-
      Written about the arrangement that got the dancers paid for these sessions, and the band
      played it on the first night before the money had actually arrived.
    arrangement_note: played straight through with no dynamic changes at all, the same four instruments at the same weight from first bar to last, because the song is an argument being stated rather than made
    intro: 6
    outro: cold
    target_duration: "3:30"
    prompt: >-
      150 BPM plain fiddle reel; hard female soprano, steady full band, paid dancers, cold live ending.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, dynamic swells, fade-out
    lyrics: |
      [Intro - band, six seconds]

      [Verse 1]
      Four hundred people queue between the berth and door.
      Freight hands off a hauler, gate clerks, cooks wearing flour.
      Each one gives a name and gets it read aloud.
      The payment envelopes have not reached the desk.
      The clerk keeps writing anyway and fills the first page.
      Nobody crosses until the name beside them matches.

      [Chorus]
      Paid at the door on the way in, not on the way out.
      Small money, honest money, and it goes in a hand.
      Name on the sheet and the clerk reads it back.
      Whoever works the floor gets counted with the rest.

      [Verse 2]
      The accounts man brought a book with narrow columns.
      No column for a dancer and no room beside the total.
      Arel drew one down the margin with a ruler.
      The man said books do not work that way.
      Arel put the ruler down and waited by the stove.
      After one long minute, the man copied the new line.

      [Pre-Chorus]
      We played it on the first night before the money came,
      which was either confidence or a way of making sure.

      [Chorus]
      Paid at the door on the way in, not on the way out.
      Small money, honest money, and it goes in a hand.
      Name on the sheet and the clerk reads it back.
      Whoever works the floor gets counted with the rest.

      [Verse 3]
      There is a woman who has danced in this hall since she was nine
      and nobody at the door has ever asked her name.
      She was in the queue at seven with her hand already out
      and she made the clerk write it down and read it back to her.
      She signs beside the mark and crosses to the floor.
      Her envelope comes after midnight. She counts it twice.

      [Final Chorus - harmony a third below]
      Paid at the door on the way in, not on the way out.
      Small money, honest money, and it goes in a hand.
      Nobody in this hall is doing anybody a favour.
      Everybody in this hall is at work tonight.

      [Outro - cold stop]
