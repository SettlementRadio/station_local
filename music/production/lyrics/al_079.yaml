songs:
  - id: s_0648
    title: Second Set, Same Room
    track_number: 1
    mood: [midtempo, warm, knowing]
    fact: >-
      Hessa Lund opens by naming the hall and the year, which the label asked her to remove and she
      recorded again identically the following night.
    arrangement_note: the first line is the name of the hall and the year spoken plainly on the beat before the tune has properly started, and the band comes in underneath it rather than waiting for it to finish
    intro: 10
    outro: fade
    target_duration: "3:50"
    prompt: >-
      142 BPM warm fiddle reel; hard female soprano, knowing delivery, live dance hall, gentle fade.
    exclude: electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, fast reel tempo, cold ending
    lyrics: |
      [Intro - fiddle and guitar, ten seconds]

      [Opening Line - flat, almost spoken, band underneath]
      Cold Harbor exchange hall, and the year is ninety-four.

      [Verse 1]
      The sea-end door still needs a shoulder when it freezes.
      The stove still leans and smokes before it catches.
      A woman at the gate was nine the first time through.
      Tonight her own boy carries both their coats from the ferry.
      He runs ahead and finds the mark beside the wall
      where she wore one borrowed boot down to the sole.

      [Chorus]
      Second set, same room, and eleven years of ice.
      Nothing here has changed except every single one of us.
      Same boards, same stove, same door that will not shut,
      and a slower tune, because we are not twenty-six.

      [Verse 2]
      At the door each dancer gives the clerk a name.
      The clerk reads every name back before they cross.
      Small coins wait in envelopes under the desk.
      The woman signs for hers and makes her boy sign too.
      Eleven years ago she came through here for nothing.
      Tonight the floor is work and the settlement knows it.

      [Chorus]
      Second set, same room, and eleven years of ice.
      Nothing here has changed except every single one of us.
      Same boards, same stove, same door that will not shut,
      and a slower tune, because we are not twenty-six.

      [Verse 3]
      Marda turns her wrist once before the opening count.
      Arel checks the same repair with two careful fingers.
      Finn brings water and leaves his old cup empty.
      I can hear the floor without trying to beat it now.
      The Harbor man asks me to lose the opening line.
      Next night I name the hall and year exactly the same.

      [Final Chorus - harmony a third below]
      Second set, same room, and eleven years of ice,
      and the doors go up at midnight the way they always did.
      Same boards, same stove, same door that will not shut.
      Ask for it slower. We can do it slower now.

      [Outro - fade under the room]
