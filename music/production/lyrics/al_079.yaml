  - id: s_0654
    title: Ask the Same Question
    track_number: 7
    mood: [midtempo, plain, patient]
    fact: >-
      Finn Derrow sings the lead, the only time he did on record, because Hessa Lund had lost her
      voice on the fourth night and would not cancel.
    arrangement_note: the guitar chair sings the whole lead and the usual lead singer does not sing anywhere on the track at all — she plays fiddle and nothing else — and there is no harmony voice on it because the only harmony singer in the band is the one singing the lead
    intro: 9
    outro: sustain
    target_duration: "3:45"
    prompt: >-
      132 BPM patient fiddle reel; unpolished male baritone lead, no female or harmony vocals, live hall.
    exclude: female vocals, harmony vocals, backing vocals, electric guitars, drum machines, synthesizers, brass, orchestral strings, click-tight timing, vocal tuning, whispered or rapped sections, modern pop production, cold ending
    lyrics: |
      [Intro - band, nine seconds]

      [Verse 1]
      She has not got a voice tonight and she will not call it off,
      so there is a man at this microphone who has never stood at one,
      and if this sounds like somebody's brother at a wedding,
      that is because that is exactly what it is.
      Sixteen years I have sung a third below her.
      There is nothing underneath me now and it is a long way down.

      [Chorus]
      Same six words a night, and every night a different room.
      Same four bars, same four people, same six words.
      The tune does not change. The tune has never changed.
      Whoever is in front of it is what makes it new.

      [Verse 2]
      Hessa is eight feet away with the fiddle and no voice
      and every wrong word pulls one eyebrow higher.
      I miss the third line. She points the bow at me.
      I find the fourth because I know what that point means.
      She has sung these six words nine hundred times.
      Tonight her hands keep them moving without a sound.

      [Verse 3]
      There is a man off a hauler at the front who is enjoying this
      more than anybody should enjoy another man's bad night.
      He came in off a run with the cargo still to sign.
      He has asked for it again. He is going to be told no.
      The floor knows something is wrong and the floor is being kind,
      and being danced at kindly by four hundred people
      is the single most exposed I have ever been in my life.

      [Chorus]
      Same six words a night, and every night a different room.
      Same four bars, same four people, same six words.
      The tune does not change. The tune has never changed.
      Whoever is in front of it is what makes it new.

      [Final Chorus - lead alone, no harmony, the band very quiet]
      Same six words a night, and every night a different room.
      She will have her voice back Tuesday and I will go back behind her,
      and the man off the hauler can ask again all night.
      I have been in front once. Once is enough for anyone.

      [Outro - held chord]
