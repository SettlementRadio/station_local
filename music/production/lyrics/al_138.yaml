  - id: s_1129
    title: Hold It Under
    track_number: 4
    mood: [deep, insistent, rolling]
    fact: >-
      Corr Ballan plays one figure for the whole track without altering it, which he says is the entire
      job of a bass player and which the rest of the band disputes in public.
    arrangement_note: the bass plays one figure from the first bar to the last without a single variation, fill or change, and everything else in the arrangement moves around it, which is either the point of the track or the argument of it depending on who is asked
    intro: 14
    outro: fade
    target_duration: "4:25"
    prompt: >-
      156 BPM deep live reel; plain female lead, shouted caller, fixed bass figure, fiddle break, fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, bass fills, bass solos, cold ending
    lyrics: |
      [Intro - the bass figure alone, fourteen seconds]

      [Verse 1]
      Corr puts down one low figure before the coats are settled.
      Four notes, same weight, same gap, first bar into last.
      Neve says a bass may turn around once in an evening.
      Tobe says one fill would not bring down the transfer shed.
      Corr says movement is what everybody else is for.
      We argue loudly by the stove and mock his solemn face.
      Then Alis gives the call, and none of us asks him to change.

      [Chorus]
      Hold it under. Do not move. Do not decorate.
      Four hundred people are standing on top of that figure
      and every one of them will fall over if it moves,
      and not one of them will ever know it was there.

      [Instrumental - fiddle break over the unchanging bass, eighteen seconds]

      [Verse 2]
      Neve goes somewhere different every second time round.
      Tobe changes what he is doing about once a bar.
      I shift the third line whenever dancers crowd the words.
      Alis cuts a figure short to free the siding wall.
      Under every change, the same four notes keep coming.
      Corr watches four hundred feet forget he is there.
      That is exactly what he wants and all the proof he needs.
      At supper we dispute him. On the floor we trust the figure.

      [Call - shouted over the band]
      Round again. Same again. Nobody stops.

      [Chorus]
      Hold it under. Do not move. Do not decorate.
      Four hundred people are standing on top of that figure
      and every one of them will fall over if it moves,
      and not one of them will ever know it was there.

      [Verse 3]
      One storm-coast night, his lowest string broke at the bridge.
      First bar, nothing changed; by six, the far line drifted.
      Couples missed the cast and blamed the caller, then the floor.
      Corr knelt beside the stove and pulled a spare from his case.
      Ninety seconds later, four low notes came back.
      The whole shed settled without knowing what returned beneath it.
      Corr tied the broken string and never looked at any of us.

      [Final Chorus - high harmony from the fiddle chair, the caller over the top]
      Hold it under. Do not move. Do not decorate.
      Four hundred people are standing on top of that figure.
      Same four notes from first coat in to final door unlatched.
      Corr packs the bass. We start the argument again.

      [Outro - fade]
