  - id: s_1128
    title: No Licence, No Stage
    track_number: 3
    mood: [wry, brisk, defiant]
    fact: >-
      Written about the room Harbor Standard first heard the band in, which is the hall Ivet Sallow
      kept her ledgers for and which has held no licence since 2604.
    arrangement_note: no introduction of any consequence and no ending of any consequence, because the room this is about has no stage, no licence and no permission, and the arrangement is built to sound like something that simply starts
    intro: 6
    outro: cold
    target_duration: "3:45"
    prompt: >-
      168 BPM brisk reel; plain female lead, high chorus harmony, shouted caller, abrupt start and stop.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, long instrumental introduction, big finish, fade-out
    lyrics: |
      [Intro - band, six seconds]

      [Verse 1]
      Past the second gate, one transfer shed keeps both doors shut.
      Ivet Sallow waits upon the step with keys beneath her coat.
      No licence since 2604, no stage and no lit sign,
      just a stove already drawing and a floor she swept at six.
      She looks along the siding, counts the people coming in,
      tells the first pair, "Move the bench," and lets the evening start.
      Everybody knows the room; no public list admits it.

      [Call - shouted over the band]
      In you come. Mind the step. Straight to the middle.

      [Chorus]
      No licence, no stage, no ticket and no sign,
      and about two hundred people in there every week.
      Whatever a hall is, it is not a piece of paper.
      It is a floor and a stove and somebody at the door.

      [Verse 2]
      Ivet Sallow kept the ledgers for that room for years
      and keeps them still inside a box beneath the bench.
      Lamp oil, stove coal, two broken latches, fiddle strings,
      every coin a frontier floor required through fifteen winters.
      The hand is small and slanted; only Ivet reads it clean.
      Tonight she marks two hundred entries with one blunt pencil,
      shuts the cover when Alis calls the first two lines.

      [Verse 3]
      One Saturday, a man in polished boots came through the gate,
      holding an address that ended, "Ask the siding clerk."
      Ivet put him by the stove and made him move his case.
      He kept his good coat buttoned through four hours of dancers.
      At closing he approached us while Corr stacked the bass.
      "Where do you put the stage?" he asked. Ivet looked at the floor.
      She turned the lamp out, locked the door, and left him there.

      [Call - shouted over the band]
      Two lines. Face up. Hold. And away.

      [Chorus]
      No licence, no stage, no ticket and no sign,
      and about two hundred people in there every week.
      Whatever a hall is, it is not a piece of paper.
      It is a floor and a stove and somebody at the door.

      [Final Chorus - high harmony from the fiddle chair, the caller over the top]
      No licence, no stage, no ticket and no sign.
      Two hundred coats, one stove, one ledger under bench.
      No place upon the settlement list, no reason to stop dancing.
      Ivet keeps the key and tells you when it is on.

      [Outro - cold stop]
