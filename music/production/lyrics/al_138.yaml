    lyrics: |
      [Intro - band, six seconds]

      [Verse 1]
      There is a room out past the second gate with no licence
      and there has been no licence on it since about 2604
      and there is a dance in it every week and there has been for years
      and everybody including the people who issue licences knows.
      No stage. No door charge. A stove and a swept floor
      and a woman on the step who tells you if it is on.

      [Call - shouted over the band]
      In you come. Mind the step. Straight to the middle.

      [Chorus]
      No licence, no stage, no ticket and no sign,
      and about two hundred people in there every week.
      Whatever a hall is, it is not a piece of paper.
      It is a floor and a stove and somebody at the door.

      [Verse 2]
      Ivet Sallow kept the ledgers for that room for years
      and the ledgers are still in a box under the bench,
      and if anybody ever wants to know what a frontier dance cost
      in a room that officially has not existed since 2604,
      the numbers are all there in a hand nobody can read
      and the last entry is in the same ink as the first.

      [Verse 3]
      Harbor Standard sent a man out there to hear us
      because a gate clerk told them there was a band worth hearing,
      and it took them two years to send him, which is fair,
      because the address he was given is not really an address.
      He stood at the back with his coat on for four hours.
      He signed us the following week and asked where the stage was.

      [Call - shouted over the band]
      Two lines. Face up. Hold. And away.

      [Chorus]
      No licence, no stage, no ticket and no sign,
      and about two hundred people in there every week.
      Whatever a hall is, it is not a piece of paper.
      It is a floor and a stove and somebody at the door.

      [Final Chorus - high harmony from the fiddle chair, the caller over the top]
      No licence, no stage, no ticket and no sign.
      Every settlement on this coast has one of these
      and not one of them is on any list anywhere,
      and that is the whole reason they are still standing.

      [Outro - cold stop]
