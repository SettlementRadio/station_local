    lyrics: |
      [Intro - band, four seconds]

      [Verse 1]
      There is a hall in this settlement with a floor I know
      about as well as I know the inside of my own hands,
      and I have not stood on it since the year Wire and Rosin stopped
      and I am not going to stand on it at the price they are asking.
      Everybody in Cold Harbor knows which room this is.
      Half of them think we are right and half think we are showing off.
