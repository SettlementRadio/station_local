      A caller who cannot see the far end is guessing,
      and a floor that is being guessed at falls apart
      about eight bars before anybody notices.

      [Verse 3]
      You can hear where she is on this. She is not in the middle.
      She is off to one side and slightly further away
      and the whole record is worse by every measure a label has
      and better by the only measure that has ever mattered here,
      which is whether four hundred people know where to put their feet.
      Harbor Standard has asked twice. It is going to keep asking.

      [Final Chorus - high harmony from the fiddle chair, the caller from the side]
      Call it from where you can see it or do not call it.
      She has been in that spot on this floor for nine years
