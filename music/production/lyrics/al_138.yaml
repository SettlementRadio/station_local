  - id: s_1127
    title: Call It From the Side
    track_number: 2
    mood: [driving, loud, communal]
    fact: >-
      Alis Doone calls the whole figure from the side of the room rather than the front, because that
      is where she stands at a dance and she would not do it differently for a record.
    arrangement_note: the caller is positioned to one side rather than in front of the band and stays there for the whole track, so she is off-axis and slightly further away than she would be on any other record, which is where she stands at a dance
    intro: 8
    outro: fade
    target_duration: "4:10"
    prompt: >-
      164 BPM driving live reel; plain female lead, high chorus harmony, side-positioned caller, fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, centred or close-mic'd spoken vocal, cold ending
    lyrics: |
      [Intro - band, eight seconds]

      [Verse 1]
      Alis takes her place one third along the western wall,
      back against the bulkhead, far corner in her sight.
      From there she sees the top line bunch beside the stove,
      two new couples facing wrong, one child underfoot.
      The band is at her shoulder, not a barrier in front.
      She lifts one hand; the whole near line goes quiet.
      Then she sends the opening clean across the shed.

      [Call - shouted from the side of the room]
      Top of the room. Face your partner. And go.

      [Chorus]
      Call it from where you can see it or do not call it.
      A caller who cannot see the far end is guessing,
      and a floor that is being guessed at falls apart
      about eight bars before anybody notices.

      [Verse 2]
      A visiting caller tries the front one storm-season night.
      He sees the nearest couples and the centre moving well.
      Eight bars in, the far end knots behind a loading pillar.
      He calls them forward while they need to cast away.
      Alis leaves the side wall, crosses through the turning lines,
      frees two trapped hands, then walks him back to where she stands.
      "Watch that corner first," she says. "The near one hears itself."

      [Call - shouted from the side of the room]
      Cast. Cast. Long line. Hold it. Come back.

      [Chorus]
      Call it from where you can see it or do not call it.
      A caller who cannot see the far end is guessing,
      and a floor that is being guessed at falls apart
      about eight bars before anybody notices.

      [Verse 3]
      Four hundred people fill the shed from stove to loading door.
      Alis stays off-centre where the last long line can see her.
      Her words arrive behind the fiddle at the nearest end,
      then strike the far wall clear before the dancers need the turn.
      One couple slips; she names the fix without breaking count.
      Corr never moves the low part; Neve lifts the bow above it.
      The floor comes back together before the chorus lands.

      [Final Chorus - high harmony from the fiddle chair, the caller from the side]
      Call it from where you can see it or do not call it.
      Alis has worn one pale mark beside that bulkhead.
      Nine years in the same place, far corner in her sight.
      Face your partner. Long line. Every part comes home.

      [Outro - fade]
