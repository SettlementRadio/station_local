  - id: s_1131
    title: We Did Not Go Back
    track_number: 6
    mood: [midtempo, cold, knowing]
    fact: >-
      Neve Torrin sings the second verse about a hall she has never played, which is the exchange hall
      the band turned down that year.
    arrangement_note: the fiddle chair sings the second verse alone, in a higher voice than the lead's and with no harmony above her, about a room she has never set foot in, and the lead does not sing underneath her
    intro: 4
    outro: fade
    target_duration: "3:50"
    prompt: >-
      150 BPM cold live reel; plain female lead, higher female verse two, shouted caller, shed fade.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, blended double lead, cold ending
    lyrics: |
      [Intro - band, four seconds]

      [Verse 1]
      There is one hall in this settlement I know like both my hands:
      warped board near the west wall, cold stair behind the stage,
      third lamp always dimmer, stove that smokes before it draws.
      I have not crossed that floor since Wire and Rosin stopped.
      They asked us back this winter through a newly priced door.
      Half of Cold Harbor calls refusal honest; half calls pride.
      I can name each mark inside and still refuse to enter.

      [Verse 2 - the fiddle chair alone, higher, no harmony]
      I have never seen it. I was past the storm coast then.
      By the time I came to Cold Harbor, we had chosen not to go.
      Suli names the warped board, cold stair, smoking stove,
      speaks about the western lamps the way she speaks of weather.
      I know that hall through every detail she refuses to revisit.
      My fiddle has not crossed the door or sounded in the roof.
      I miss a room I never had, and that is strange enough.

      [Call - shouted over the band]
      All the way up. Both lines. Wait. Now.

      [Chorus]
      We did not go, and we are not going, and it is fine.
      There are eleven rooms on this coast with a floor in them
      and about nine of them will have us on a Saturday
      and none of the nine charges anybody to walk in.

      [Verse 3]
      Tonight this transfer shed has frost beneath both doors.
      Four hundred dancers fill the boards I actually know.
      Alis calls from by the bulkhead; Corr repeats the low line.
      Suli takes the chorus without looking toward the coast.
      Nobody on the floor asks what the exchange lamps are doing.
      Nobody stops a turn to price the room we did not take.
      Neve lifts the fiddle, and the shed gives back her note.

      [Chorus]
      We did not go, and we are not going, and it is fine.
      There are eleven rooms on this coast with a floor in them
      and about nine of them will have us on a Saturday
      and none of the nine charges anybody to walk in.

      [Final Chorus - high harmony from the fiddle chair, the caller over the top]
      We did not go, and we are not going, and it is fine,
      and one of us has never been in the room at all,
      though she knows the warped board, cold stair, smoking stove.
      We have this floor tonight. Turn when Alis calls.

      [Outro - fade]
