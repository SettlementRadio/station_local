#
# Suli Orley's own band, thirty-six years after she first stood on the Cold Harbor floor and twelve
# after Wire and Rosin stopped. Harbor Standard took two years to come and find them and then wanted
# the exchange hall; **Orley would not record in a room the dancers are charged to walk into**, so
# this was cut in the transfer shed the band had been playing in. That refusal is the record.
#
# **b_062 is the only band in this genre with two women out in front of the band at once**, and the
# card is explicit about how they divide: the lead sings, the fiddle chair puts one high harmony
# through the choruses, and Alis Doone calls the dance figures over the top of everything on every
# track. Calling is not singing and it is not rapping — it is short rhythmic instructions shouted
# across a room at people who are moving — and every prompt here says so while the exclude lines keep
# rapped verses out. Harbor Standard asked twice for the calling to come off. It is on all seven.
#
# Two of the seven take a fiddle break, which is b_062's break instrument. `generation:` and every
# `take:` are empty until M-33.

