    lyrics: |
      [Intro - solo guitar, twelve seconds]

      [Verse 1]
      I was nineteen and standing at the back of the exchange hall
      about six feet from a band that did not know I existed,
      and somebody played this and I had it by the second turn
      and I have played it about four thousand times since.
      I do not know who wrote it. I have asked everybody.
      I have asked people who were playing here before I was born.
      It came off a hauler, or off a ferry, or off nothing at all.

      [Call - shouted over the band]
      Take hands. Long way round. Wait for the fiddle.

      [Chorus]
      Nothing I know came off a piece of paper.
      All of it came off a floor with people on it,
      out of somebody's hands about nine feet away
      on a Tuesday, badly lit, with my coat still on.

      [Verse 2]
      There is a way of learning that the core does not have
      and it is not better and it is not worse and it is ours.
      You stand at the back. You watch a hand. You go home.
      You have got about a third of it and you play the third.
      Next week you get another third and it is wrong
      and by the time you have the whole thing it is a different tune.

      [Call - shouted over the band]
      Second couple up. Cast off. Both lines.

      [Chorus]
      Nothing I know came off a piece of paper.
      All of it came off a floor with people on it,
      out of somebody's hands about nine feet away
      on a Tuesday, badly lit, with my coat still on.

      [Verse 3]
      Six years I stood behind Hessa Lund and sang a third under her
      and she never once told me a tune. Not one. Ever.
      She would play it and look at me and that was the lesson
      and I have never had a better one from anybody since.
      Now there are four people behind me doing the same thing
      and I have not told any of them anything either.

      [Final Chorus - high harmony from the fiddle chair, the caller over the top]
      Nothing I know came off a piece of paper.
      All of it came off a floor with people on it,
      and every one of you out there tonight is doing it now
      whether you have noticed or you have not.

      [Outro - cold stop]
