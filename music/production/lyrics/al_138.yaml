  - id: s_1130
    title: Charge the Band, Not the Floor
    track_number: 5
    mood: [hard, plain, defiant]
    fact: >-
      Suli Orley wrote it after a hall keeper offered the band a larger fee out of a raised door price,
      and she reads the offer out before the first verse.
    arrangement_note: the offer is read out plainly over the introduction, off a piece of paper, before a note is sung, and the band does not react to it — it simply starts the tune underneath the last sentence
    intro: 10
    outro: cold
    target_duration: "4:05"
    prompt: >-
      162 BPM hard reel; plain female lead, high harmony, shouted caller, spoken offer, cold stop.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, rhythmic spoken word, whispered vocals, vocal tuning, modern pop production, fade-out
    lyrics: |
      [Intro - the offer read aloud off a piece of paper, ten seconds, band entering underneath]
      Two and a half times the standing fee, payable on the night,
      the difference to be met from an adjustment to the door.

      [Verse 1]
      That is what the keeper wrote and exactly what he meant.
      Nothing in the offer hides a figure or a fee.
      He has a stove to feed, three roof seams under ice,
      and a settlement's winter pressed against the outer wall.
      Two and a half our usual pay looked generous across the table.
      It was generous to four people standing near the stove,
      paid by four hundred people queueing in the cold.

      [Chorus]
      Charge the band. Take it out of what you pay us.
      Do not put it on a door that people queue at in the ice.
      There are four of us and there are four hundred of them
      and only one of those numbers can afford it.

      [Call - shouted over the band]
      Straight down the middle. Turn. And out.

      [Verse 2]
      He said, reasonably, that the floor would not notice.
      One more coin beneath a mitten; nobody would turn away.
      Ivet at the shed door knows who counts before they enter,
      who brings three children, which freight crew comes off shift.
      One quiet coin becomes another when the roof leaks next year.
      Nine winters later, one dance costs a full shift's pay,
      and the people who built the floor are home beside the stove.

      [Chorus]
      Charge the band. Take it out of what you pay us.
      Do not put it on a door that people queue at in the ice.
      There are four of us and there are four hundred of them
      and only one of those numbers can afford it.

      [Verse 3]
      We turned it down and we have turned the same one down twice
      and the second time it was the exchange hall itself,
      which is the room I stood in when I was nineteen
      and would very much like to play before I stop.
      I know each board beneath that floor and every western lamp.
      Not at that price. Not through a paid and counted door.
      I will play this transfer shed until the stove gives out.

      [Final Chorus - high harmony from the fiddle chair, the caller over the top]
      Charge the band. Take it out of what you pay us.
      There are four of us and there are four hundred of them,
      and every one of the four hundred works for a living,
      and so do we, and that is the end of the arithmetic.

      [Outro - cold stop]
