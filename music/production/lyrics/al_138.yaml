      [Verse 2 - the fiddle chair alone, higher, no harmony]
      I have never been in it. I have never once been in it.
      I was on the far side of the ice when all that happened
      and by the time I got here we were not going there,
      and so there is a room in my own settlement I have never seen.
      She talks about that floor the way people talk about weather.
      I have no opinion about it at all and I am in the band.

      [Call - shouted over the band]
