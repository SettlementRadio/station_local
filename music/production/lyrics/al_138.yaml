songs:
  - id: s_1126
    title: Learned Off the Floor
    track_number: 1
    mood: [fast, bright, communal]
    fact: >-
      Suli Orley took this tune off the Cold Harbor floor while she was still playing guitar for Wire
      and Rosin, and she has never found out who wrote it.
    arrangement_note: the guitar states the tune completely alone before anything else arrives, which is how it was learned — off a floor, one instrument at a time, with nobody explaining anything
    intro: 12
    outro: cold
    target_duration: "4:00"
    prompt: >-
      172 BPM bright reel; plain female lead, high chorus harmony, shouted caller, solo guitar, cold stop.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, sung backing chants, fade-out
    lyrics: |
      [Intro - solo guitar, twelve seconds]

      [Verse 1]
      I was nineteen at the back of the exchange-hall floor,
      coat still on, six feet behind a band that missed my face.
      Somebody played this opening and I caught the second turn.
      My left hand copied shapes against the seam inside my pocket.
      No one knew who brought it off the hauler or the ferry.
      By the final chorus, half the room was singing different words.
      I walked home through Cold Harbor with one third beneath my fingers.

      [Call - shouted over the band]
      Take hands. Long way round. Wait for the fiddle.

      [Chorus]
      Nothing I know came off a piece of paper.
      All of it came off a floor with people on it,
      out of somebody's hands six feet in front of mine,
      Tuesday under bad lamps, with my work coat still on.

      [Verse 2]
      At home I played the third I knew until the neighbour knocked.
      Next Tuesday, the first part changed beneath the fiddler's bow.
      I copied that one too and lost the ending while I watched.
      Third week, a freight crew stamped an extra beat across it.
      Fourth week, Hessa Lund looked back and caught me playing air.
      She moved one finger toward the chord I had been missing.
      By spring I knew the whole tune wrong enough to make it mine.

      [Call - shouted over the band]
      Second couple up. Cast off. Both lines.

      [Chorus]
      Nothing I know came off a piece of paper.
      All of it came off a floor with people on it,
      out of somebody's hands six feet in front of mine,
      Tuesday under bad lamps, with my work coat still on.

      [Verse 3]
      Six years behind Hessa, one high part beneath her line.
      She never named a chord or slowed a figure down.
      She played, then looked across; I found the missing place.
      Tonight Neve takes the harmony and watches my right hand.
      Corr holds one low shape until the floor can stand upon it.
      Alis calls the long turn over everybody's heads.
      Somewhere near the rear wall, someone plays the pocket seam.

      [Final Chorus - high harmony from the fiddle chair, the caller over the top]
      Nothing I know came off a piece of paper.
      All of it came off a floor with people on it,
      and someone under bad lamps has the first third now.
      Keep the coat on. Watch the hand. Walk home and play it wrong.

      [Outro - cold stop]
