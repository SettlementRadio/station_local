  - id: s_1132
    title: Doors at the Far End
    track_number: 7
    mood: [fast, loose, bright]
    fact: >-
      Brin Noll retuned the shed's loose metal before the band played and then stayed to play the
      chimes on this one, having done the same thing in a hold for Loose Cargo.
    arrangement_note: the shed's own loose metal has been retuned to the key of the tune and a fifth player is on the stripped-wire chimes, so the building answers the band in pitch on every chorus and the chimes answer it on top
    intro: 16
    outro: sustain
    target_duration: "4:30"
    prompt: >-
      178 BPM bright reel; plain female lead, shouted caller, tuned shed metal, wire chimes, held end.
    exclude: electric guitar, drum machines, synthesizers, brass, orchestral strings, rapped verses, whispered vocals, vocal tuning, modern pop production, untuned clatter, cold ending
    lyrics: |
      [Intro - chimes and ringing metal, sixteen seconds]

      [Verse 1]
      Brin Noll came through the snow with tools beneath one arm,
      struck the west-door bracket, listened, struck it once again.
      He tightened three loose fixings, weighted two with washers,
      chalked a line beside the stove and tuned the loading rail.
      Nine hours until the whole shed answered Neve's open string.
      He asked for water once and worked straight through the dark.
      By evening, every loose plate held its own clean note.

      [Call - shouted over the band]
      Doors at the far end. Line it up. Go.

      [Chorus]
      Doors at the far end and the cold coming in
      and four hundred people who are not going to notice.
      Open them. Open them properly. It is too warm in here.
      A shed full of dancers in the long night makes its own weather.

      [Instrumental - fiddle break over the ringing metal, sixteen seconds]

      [Verse 2]
      Brin packed the wrench and gauge but left the chimes unrolled.
      Tobe asked if all that wire was only meant for testing.
      Brin looked toward the dancers forming lines beneath the rail,
      hung the stripped wire behind the kit and found two beaters.
      He had come to tune a building and stayed to play its answer.
      Corr moved half a step; Neve left a space above the bow.
      Suli put hot tea beside him. Brin let it go cold.

      [Call - shouted over the band]
      Both doors. Both. And back down the middle.

      [Chorus]
      Doors at the far end and the cold coming in
      and four hundred people who are not going to notice.
      Open them. Open them properly. It is too warm in here.
      A shed full of dancers in the long night makes its own weather.

      [Verse 3]
      Third turn, someone shouts that frost is running down the wall.
      Alis calls both far doors open from her bulkhead mark.
      Cold air cuts the dancers; coats come off the hooks again.
      The room grows twice as long and every fixing changes colour.
      Neve climbs one register to clear the lower ringing.
      Brin finds thinner wire and answers over everything.
      Four hundred warm bodies turn the winter into weather.

      [Final Chorus - high harmony from the fiddle chair, the caller over the top]
      Doors at the far end and the cold coming in
      and a man on the wire who came to tune the building.
      Open them. Open them properly. It is too warm in here,
      and let the loading rail ring back beneath the chimes.
      Cold Harbor, follow Alis. Both lines down the middle.

      [Outro - held chord, the metal still ringing]
