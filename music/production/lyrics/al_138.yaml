      He is right and we are never going to admit it in a hall.

      [Call - shouted over the band]
      Round again. Same again. Nobody stops.

      [Chorus]
      Hold it under. Do not move. Do not decorate.
      Four hundred people are standing on top of that figure
      and every one of them will fall over if it moves,
      and not one of them will ever know it was there.

      [Verse 3]
      There was a night at the shed when a string went on him
      about two thirds of the way through a long set
      and the floor came apart inside about six bars,
      and every person in that room felt it and none of them knew why.
      He had it back on in ninety seconds and said nothing.
      That is the best argument anybody has ever made about anything.

      [Final Chorus - high harmony from the fiddle chair, the caller over the top]
      Hold it under. Do not move. Do not decorate.
      Four hundred people are standing on top of that figure.
      He has done it for nine years and he will do it for nine more
