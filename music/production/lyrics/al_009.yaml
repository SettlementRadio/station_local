  - id: s_0083
    title: The Better Bunk
    track_number: 5
    mood: [comic, affectionate, quick]
    fact: >-
      Talla Venn plays both composite guitars because Emi Soll lost the band vote over who should
      take the short break.
    arrangement_note: one guest player takes both guitar parts, so the two answer each other in exactly the same hand, and the short break is eight seconds and no longer
    intro: 6
    outro: fade
    target_duration: "3:15"
    prompt: >-
      Warm live-room jangle pop, 136 BPM, comic and affectionate, quick. Male lead vocal, warm
      baritone that roughens at the top of the range, plain and a shade behind the beat, no vibrato.
      Whole-crew chorus of four to six voices in unison rather than harmony, answering the lead line
      for line. Two composite guitars, one acoustic-toned and one electric, both played by the same
      guest player, with matched picking attack, timing and phrasing so their answers sound like one
      hand, electric bass, tuned metal tank drums and hanging wire chimes. Whole band tracked
      together in one live room, light compression, loose rather than gridded. An eight-second
      guitar break and no longer. Six seconds of both guitars before the first sung word. Fade.
    exclude: synthesizers, electronic drums, string sections, studio choir, vocal tuning, rapped sections, whispered vocals, dance-pop production, four-on-the-floor kick
    lyrics: |
      [Intro - 6 seconds, two composite guitars in the same hand, no vocal]

      [Verse 1]
      There are two bunks in that cabin and one of them is better.
      Not much better. About a hand's width farther from the scrubber vent,
      which on a long leg is the whole difference between rooms.
      Everybody who has ever been in there knows which one it is
      and nobody has ever admitted knowing it out loud.

      [Chorus]
      You take the good one. I am not being noble.
      I am building up a debt in a currency you cannot pay
      and I intend to collect it at some point in the spring
      in a port hall, in public, with your whole crew watching.

      [Verse 2]
      We put it to a vote once, which is this crew's answer to everything.
      Four people, one bunk, a formal show of hands,
      and a fifteen-minute discussion of the voting procedure
      before anybody had established what the vote was for.

      [Instrumental - eight-second guitar break]

      [Verse 3]
      I lost. I want that on the record. I lost the vote,
      and I have slept by the vent for a year and a half
      and been extremely gracious about it every single day
      in a way that everybody in that cabin has found unbearable.

      [Chorus]
      You take the good one. I am not being noble.
      I am building up a debt in a currency you cannot pay
      and I intend to collect it at some point in the spring
      in a port hall, in public, with your whole crew watching.

      [Verse 4]
      Last night I came off watch and you were in the wrong one.
      You had moved. You had moved yourself, without a vote,
      and you were asleep in the bad bunk with your back to the vent
      and I stood in that doorway for a considerable length of time.

      [Chorus - whole crew]
      You take the good one. I am not being noble.
      I am building up a debt in a currency you cannot pay.
      Give it back. Take the good one. I will not ask twice.
      I will ask about four hundred times. I am aware of that.

      [Outro - fade on the two guitars]
