    lyrics: |
      [Intro - 5 seconds, tapped paper tubes and acoustic-toned guitar, no vocal]

      [Verse 1]
      There is a stall at the transfer hall that sells them off a crate,
      grown under lamps two settlements up the relay road,
      and they are expensive in a way that is frankly insulting
      and everybody on this crew buys them on the day the money lands.

      [Chorus]
      Payday flowers. Four days of colour on a metal table
      and then a week of a jar with nothing in it.
      Nobody sensible would spend a shift's money on that.
      Every sensible person I know does it anyway.

      [Verse 2]
      Jalen brings them for his mother, who says every year
      that he should not have, and puts them where the whole hall sees.
      Emi buys them for the cabin, which is a way of saying
      something Emi has never said out loud in nine years.

      [Chorus]
      Payday flowers. Four days of colour on a metal table
      and then a week of a jar with nothing in it.
      Nobody sensible would spend a shift's money on that.
      Every sensible person I know does it anyway.

      [Verse 3]
      I got you the cheap ones, the ones at the end of the crate,
      because I have watched you all year with the good ones
      and you never once looked at the price on the ticket,
      you looked at the flowers, which is why I am spending the money.

      [Chorus]
      Payday flowers. Four days of colour on a metal table
      and then a week of a jar with nothing in it.
      Nobody sensible would spend a shift's money on that.
      Every sensible person I know does it anyway.

      [Chorus - whole crew, tank drums in]
      Payday flowers, and the wrapping on the table,
      and a whole crew pretending not to watch the door.
      Four days of colour and a fortnight of the jar.
      It is worth it. Ask anybody who is not sensible.

      [Outro - fade on the tapped tubes]
