  - id: s_0079
    title: Same Berth Twice
    track_number: 1
    mood: [romantic, triumphant, driving]
    fact: >-
      Ressa Morn and Jalen Rook recorded their answering lines on opposite shifts after their credit
      argument.
    arrangement_note: the lead and the answering voice are never in the room at the same time and the two parts never overlap by a single beat, which is audible and deliberate
    intro: 8
    outro: cold
    target_duration: "3:50"
    prompt: >-
      Warm live-room jangle pop and soft rock, 130 BPM, romantic and triumphant, driving. Male lead
      vocal, warm baritone that roughens at the top of the range, plain and a shade behind the beat,
      no vibrato. A single answering voice recorded separately that never overlaps the lead by a
      beat, then the whole-crew chorus of four to six voices in unison rather than harmony on the
      last two choruses, one high harmony over the final one. Two composite guitars, one
      acoustic-toned and one electric, electric bass, tuned metal tank drums and hanging wire chimes
      left ringing. Whole band tracked together in one live room, light compression, loose rather
      than gridded. Eight seconds of both guitars and tank drums before the first sung word. Cold
      stop.
    exclude: synthesizers, electronic drums, string sections, studio choir, vocal tuning, rapped sections, whispered vocals, dance-pop production, four-on-the-floor kick
    lyrics: |
      [Intro - 8 seconds, both composite guitars over tank drums, no vocal]

      [Verse 1]
      Eleven years on this circuit and I have never had the same berth twice.
      A different bunk, a different wall, a different noise at three,
      a locker with somebody else's name half scratched off it
      and a shelf that is either too high or not there at all.

      [Chorus]
      And then they changed the rule and gave us the one room
      for the whole route, out and back, the entire way round.
      Same berth twice. Same berth eleven times.
      You can put a photograph up. You can leave a cup out.

      [Verse 2]
      It sounds like nothing. Read it on a notice and it is nothing.
      A line in a co-operative minute about room allocation.
      But a person who has slept in forty rooms in a year
      will tell you exactly what it is worth, and it is not nothing.

      [Chorus]
      And then they changed the rule and gave us the one room
      for the whole route, out and back, the entire way round.
      Same berth twice. Same berth eleven times.
      You can put a photograph up. You can leave a cup out.

      [Bridge]
      The two of us cannot agree on who wrote this,
      and we have both turned up, on opposite shifts, to sing it.

      [Verse 3]
      There is a hook by the door that has had my coat on it since spring
      and the coat knows the hook now, which is more than I expected.
      And you know which watch I am on without asking anybody,
      and you leave the light off, and the kettle warm, and the door.

      [Chorus - whole crew]
      And then they changed the rule and gave us the one room
      for the whole route, out and back, the entire way round.
      Same berth twice. Same berth eleven times.
      I have stopped counting the ports. I have started counting the weeks.

      [Final Chorus - one high harmony over the crew]
      Same berth twice, and a shelf, and a hook, and a wall.
      It is not a settlement. It is not a name on a lease.
      It is the first thing on this circuit I have not had to pack.
      Leave the cup out. Leave it out the whole way round.

      [Outro - cold stop, all voices together]
    take: null                    # M-30 fills this in at the Suno sitting

