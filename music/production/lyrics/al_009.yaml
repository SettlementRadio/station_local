      Four hours in a port hall town on a burn day, in daylight,
      and nobody in the office has noticed it yet.

      [Chorus]
      Half a shift. Half a shift and the whole port to spend it in.
      Do not tell anybody. Do not tell your own crew.
      There is a rule about mistakes on a board and the rule is
