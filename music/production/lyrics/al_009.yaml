    lyrics: |
      [Intro - 4 seconds, tank drums and a guitar pickup, no vocal]

      [Verse 1]
      The notice goes up at four and the whole hall reads it standing.
      Last ferry moved forward, weather on the crossing,
      and two hundred people work out in the same half second
      whether the thing they were going to do tonight is still on.

      [Pre-Chorus]
      Mine was not on. Mine was very much not on -

      [Chorus]
      So it is the last ferry home or it is nothing at all,
      it is the quarter past or a week on the wrong side of the water.
      I have got eleven minutes and a bag and a bad plan
      and I am going to spend all three of them badly.

      [Verse 2]
      You were at the far end of the hard with your back to me
      talking to somebody from the yard about a hold of late cargo.
      There is no dignified way to cross that much open ground
      at speed, with a bag, in front of a hundred of your own crew.

      [Pre-Chorus]
      I did it anyway. I will hear about it for years -

      [Chorus]
      So it is the last ferry home or it is nothing at all,
      it is the quarter past or a week on the wrong side of the water.
      I have got eleven minutes and a bag and a bad plan
      and I am going to spend all three of them badly.

      [Instrumental - electric composite guitar break, 14 seconds, faster than the song]

      [Verse 3]
      I did not make it. Obviously I did not make it.
      I stood on the hard and watched the lamps go round the point
      and then I turned round and you were still standing there,
      because you had not gone either, and you had not said so.

      [Chorus]
      So it is the last ferry home or it is nothing at all —
      well, it was nothing at all, and here we both are.
      A week on the wrong side of the water with you
      is not the punishment the notice seemed to think it was.

      [Outro - cold stop on the downbeat]
