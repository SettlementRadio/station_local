      [Chorus]
      There is nothing the matter with wanting. Say the thing out loud.
      Nobody has ever been ruined by an answer.
      They have been ruined by nine years of not asking
      in a cabin four berths down from somebody who would have said yes.

      [Bridge]
      So here it is, with the whole crew in the room,
      and the tape running, and no way of taking it back.

      [Silent bar]

      [Final Chorus - "There" cracks audibly after the silence, whole crew, one high harmony]
      There is nothing the matter with wanting. I want the route with you.
      Not the good version, not the one out of a song —
      the actual route, the cold ramp, the bad coffee, the lot.
      I have said it now. It is on the record. It is going out on a crate.

      [Outro - sustain, piano under the crew]
