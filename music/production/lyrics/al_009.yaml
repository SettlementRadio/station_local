    lyrics: |
      [Intro - 11 seconds, struck locker latch on the offbeat with acoustic-toned guitar, no vocal]

      [Verse 1]
      They do it with a strip of tape and a marker pen,
      the same as they have done it since before I was on the freight crew.
      Your name goes on at the start of a route and comes off at the end
      and it hangs there by the berth for eleven weeks
      and nobody has ever thought about it for a second.

      [Verse 2]
      I thought about it. I have thought about very little else
      since the morning I walked past and saw the two of them,
      mine at the end of the row where it has always been
      and yours next to it, second from the door, in the same hand.

      [Chorus]
      Your name on that locker beside mine.
      A strip of tape. Somebody in an office with a list.
      Nobody in this building meant anything by it
      and I have been walking past that row four times a day.

      [Verse 3]
      There is no message in it. I know there is no message in it.
      A woman with a rota put us in alphabetical order
      and the whole of my week has been arranged around a coincidence
      that a person with a marker pen made on a Tuesday morning.

      [Chorus]
      Your name on that locker beside mine.
      A strip of tape. Somebody in an office with a list.
      Nobody in this building meant anything by it
      and I have been walking past that row four times a day.

      [Bridge]
      At the end of the route they take the tape off with a thumbnail.
      Both names, one after the other, in about four seconds.

      [Final Chorus - whole crew, one high harmony]
      Your name on that locker beside mine.
      A strip of tape. Somebody in an office with a list.
      When they come round with the marker for the next route
      I am going to be standing there, and I am going to say something.

      [Outro - cold stop, one struck latch and nothing after it]
