  style_card: b_004
  room: >-
    One room, held for the whole route, which is what the 2619 co-operative rule change bought. So
    this record has a consistency the two EPs could not have: the same live room, the same tuned
    tank drums, the same handmade chimes, and the whole band tracked together on every song. The
    style card is followed straight. The departures are per song and each is a guest on exactly one
    part — a resonance-pipe note that waits for the handover, a locker latch retuned into a chime, a
    guest piano on the last two tracks, and one song where the same player takes both guitars
    because the band voted on who got the break.

