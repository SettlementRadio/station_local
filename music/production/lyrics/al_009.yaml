songs:
  - id: s_0079
    title: Same Berth Twice
    track_number: 1
    mood: [romantic, triumphant, driving]
    fact: >-
      Ressa Morn and Jalen Rook recorded their answering lines on opposite shifts after their credit
      argument.
    arrangement_note: the lead and the answering voice are never in the room at the same time and the two parts never overlap by a single beat, which is audible and deliberate
    intro: 8
    outro: cold
    target_duration: "3:50"
    prompt: >-
      Warm live-room jangle pop and soft rock, 130 BPM, romantic and triumphant, driving. Male lead
      vocal, warm baritone that roughens at the top of the range, plain and a shade behind the beat,
      no vibrato. A single answering voice recorded on the opposite shift from the lead that never
      overlaps him by a beat, then the whole-crew chorus of four to six voices in unison rather than
      harmony on the last two choruses, one high harmony over the final one. Two composite guitars, one
      acoustic-toned and one electric, electric bass, tuned metal tank drums and hanging wire chimes
      left ringing. Whole band tracked together in one live room, light compression, loose rather
      than gridded. Eight seconds of both guitars and tank drums before the first sung word. Cold
      stop.
    exclude: synthesizers, electronic drums, string sections, studio choir, vocal tuning, rapped sections, whispered vocals, dance-pop production, four-on-the-floor kick
    lyrics: |
      [Intro - 8 seconds, both composite guitars over tank drums, no vocal]

      [Verse 1]
      The first time was rain at the outer freight berth
      and your carrier was two hours late off the relay road.
      I was waiting for a clerk who had gone to find my papers
      and you were waiting for somebody who had already missed the boat.

      [Chorus - lead and one answering voice alternating, never overlapping]
      [Lead]
      Same berth twice in a port with thirty places to stand.
      [Answering voice - enters after the lead ends]
      I knew the coat before I looked up at your face.
      [Lead]
      Nobody arranged it and nobody needs to know.
      [Answering voice - enters after the lead ends]
      Stay until the lamps go out and call it what you like.

      [Verse 2]
      Eleven weeks later they sent our crew back by the same road,
      same rain, same clerk, and the same number over the loading ramp.
      You were there with a different coat and the same bad cup,
      and this time neither of us pretended to be waiting for papers.

      [Chorus - whole crew]
      Same berth twice, and the second time you saved me a place.
      The whole port moving and the two of us standing still.
      If anybody asks, the manifest put both crews here.
      The manifest has done one useful thing and can have the credit.

      [Verse 3]
      Your boat left first. Mine loaded through the night.
      You wrote the next arrival on the back of my gate slip.
      It is Thursday at one if the weather holds, and I have checked it
      often enough to know that the ink is wearing thin.
      There are thirty berths and three ports where our routes could cross.
      I am still going to be at this one before the ramp comes down.

      [Final Chorus - one high harmony over the crew]
      Same berth twice. A third time would begin to look deliberate.
      Bring the bad cup. I will bring the papers I do not need.
      Let the whole freight hall decide that chance has had enough.
      When your lamps come round the point, I will already be there.

      [Outro - cold stop, all voices together]
