      [Verse 1]
      Two hundred people in a port hall built for ninety
      and a route meeting that every freight crew has to be at.
      People on the window ledges, people on the floor,
      people standing three deep at the back by the door.

      [Chorus]
      And there was a chair at the end of the fourth row
      with a coat over the back of it and a hand up in the air.
      Somebody saved a seat. In a room like that.
      For me. Which is a very ordinary thing and it is not nothing.

      [Verse 2]
      You do not notice the ones who do it, that is the point.
      They do not tell you afterwards. They do not bring it up.
      Somebody moved a bag off a chair forty minutes before
      and sat there in the noise being uncomfortable about it.

      [Chorus]
      And there was a chair at the end of the fourth row
      with a coat over the back of it and a hand up in the air.
      Somebody saved a seat. In a room like that.
      For me. Which is a very ordinary thing and it is not nothing.

      [Verse 3]
      I have been on this circuit long enough to know the difference
      between people who are kind and people who are kind at you.
      One of them tells the room. One of them moves a bag.
      I have got a whole list now and I have checked it twice.

      [Bridge]
      The meeting went on for two hours and settled nothing at all
      and it is the best two hours I have spent in that hall.

