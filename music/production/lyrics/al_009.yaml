      [Intro - 3 seconds, acoustic-toned guitar, no vocal]

      [Verse 1]
      The money lands at once, which is the whole problem,
      four months of a long lane paid out in one afternoon
      to a whole freight crew standing in the same queue.
      The hall fills up. The stalls put their prices up.
      Everybody in this port has known the date for a fortnight.

      [Chorus - three out-of-time clappers enter and stay]
      Do not spend it all. Do not spend it all tonight.
      That is what the treasurer says at the top of the meeting
      to a room of people who are already halfway out of it,
      and she has said it eleven years and enjoys it every time.

      [Verse 2]
      There is a man who buys a coat every single payday
      and a woman who has bought the same three things since 2611
      and a lad on his first route who has gone very quiet
      and is going to be lending money by the ninth day.

      [Chorus]
      Do not spend it all. Do not spend it all tonight.
      That is what the treasurer says at the top of the meeting
      to a room of people who are already halfway out of it,
      and she has said it eleven years and enjoys it every time.

      [Bridge]
      I am not going to buy a coat. I have got a coat.
      I have got something in mind that costs about the same.

      [Verse 3]
      There is a room over the port hall with a floor and a fiddle player
      and they charge what they charge and it is worth about half of it,
      and if I take you there tonight it will be gone by Sunday,
      the whole four months, and I have never wanted anything less back.

      [Chorus - whole crew and the claps]
      Do not spend it all. Do not spend it all tonight.
      The treasurer is at the back of the room and she is watching me.
      She has been watching all evening and she knows exactly what this is.
      She has stopped saying it. She is clapping along with the rest of them.

      [Outro - fade on the three out-of-time clappers]
