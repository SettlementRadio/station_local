    lyrics: |
      [Intro - 16 seconds, upright piano and acoustic-toned guitar, chimes at eleven seconds, no vocal]

      [Verse 1]
      There is a way of talking out here about wanting things
      that makes it sound like a fault you should be working on.
      Wanting a room. Wanting a lane that comes back.
      Wanting a berth in a settlement instead of a bunk on a hauler.
      Wanting one particular person to be in the port when you dock.

      [Verse 2]
      My father wanted nothing publicly for forty years
      and got most of it, and said so, and meant it,
      and I have watched what that costs from about this distance
      and I am not doing it, and this is me not doing it.

      [Chorus]
      There is nothing the matter with wanting. Say the thing out loud.
      Nobody has ever been ruined by an answer.
      They have been ruined by nine years of not asking
      in a cabin four berths down from somebody who would have said yes.

      [Verse 3]
      I have been on this circuit since my first paid route.
      I have watched two people do the whole of it in silence
      out of manners, out of shifts, out of not being sure,
