  - id: s_0081
    title: Your Name on the Locker
    track_number: 3
    mood: [tender, proud, midtempo]
    fact: >-
      Brin Noll turns a locker latch into the offbeat chime after retuning its loose plate.
    arrangement_note: a locker latch with its plate retuned rings on every offbeat in place of the wire chimes, and the chimes are not used anywhere in this song
    intro: 11
    outro: cold
    target_duration: "4:10"
    prompt: >-
      Warm live-room soft rock and jangle pop, 104 BPM, tender and proud, midtempo. Male lead vocal,
      warm baritone that roughens at the top of the range, plain and a shade behind the beat, no
      vibrato. Whole-crew chorus of four voices in unison rather than harmony entering only in the
      second half, one high harmony on the final chorus. Two composite guitars, one acoustic-toned
      and one electric, electric bass, tuned metal tank drums, and a struck metal locker latch with
      a retuned plate ringing on every offbeat in place of the usual wire chimes, which are absent
