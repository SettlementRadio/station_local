      [Intro - 17 seconds, upright bass and one clean guitar, second guitar at eleven seconds, no vocal]

      [Verse 1]
      We counted them from the stage because there was time,
      Twenty of them empty and eleven that were not.
      The man on the door caught the last ferry at the interval
      And we played the whole thing anyway, right to the end.

      [Chorus]
      Best night we ever had, and I will say that in any room.
      Ask me again when I am old which one I would keep.
      Eleven people clapping like a hall four times the size -
      That is a kindness I have not forgotten and won't.

      [Verse 2]
      Somebody's aunt, somebody's neighbour, a man with a bag,
      Two who came in off the transfer hall for the warmth
      And stayed for the second half, and she knew the words to one.
      I have played to more and remembered less.

      [Chorus]
      Best night we ever had, and I will say that in any room.
      Ask me again when I am old which one I would keep.
      Eleven people clapping like a hall four times the size -
      That is a kindness I have not forgotten and won't.

