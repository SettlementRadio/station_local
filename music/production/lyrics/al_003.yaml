    lyrics: |
      [Intro - 4 seconds, guitars and metal blocks, no vocal]

      [Verse 1]
      I put my coat on twenty minutes ago,
      I have said the same three sentences four times.
      There is a ferry I could have caught and one after that,
      And I am still in your doorway saying right, well, anyway.

      [Pre-Chorus]
      Somebody in the lunch room found the short way to say it -

      [Chorus - band stops dead on the four-word line]
      I'm bad at goodbye,
      Give me an hour and I'll have another go.
      The last ferry goes at midnight from the transfer hall.
      Don't make me leave.

      [Verse 2]
      You are worse than me and that is the whole trouble,
      You start a story every time my hand is on the door.
      Neither of us is going to be the sensible one,
      So we will be here at midnight talking about the weather.

