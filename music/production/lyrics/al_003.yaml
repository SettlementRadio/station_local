    lyrics: |
      [Intro - 8 seconds, compact electric keyboard alone, guitars in on the last bar, no vocal]

      [Verse 1]
      Everybody is very sorry that we did it,
      Everybody has written in to say so twice.
      The shipboard press has printed the letters and the answers,
      And nobody was in the room on the night the room went quiet.

      [Chorus]
      It's useful trouble (useful trouble)
      The kind that gets a thing done (gets it done)
      Sorry about the noise (sorry about the noise)
      We will be gone in a minute and the door will still open.

      [Verse 2]
      You can be right and be no earthly good,
      You can keep your hands clean and keep them empty too.
      I would rather be argued with than agreed with quietly
      By somebody who has never once had to decide.

      [Chorus]
      It's useful trouble (useful trouble)
      The kind that gets a thing done (gets it done)
      Sorry about the noise (sorry about the noise)
      We will be gone in a minute and the door will still open.

      [Bridge - all four shouting]
