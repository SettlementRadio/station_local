    lyrics: |
      [Intro - 6 seconds, both guitars and kit, no vocal]

      [Verse 1]
      Four of us and one week's money on the table,
      Sorted into little piles with a job written on each.
      This one eats, this one gets us there,
      And this one is the berth, and it is not to be touched.

      [Chorus]
      Don't spend it on tonight. Don't spend it on tonight.
      We have been hungry cleverer than this before.
      There is a pile for the week after the week after this
      And nobody's hand goes near it, not even mine.

      [Verse 2]
      Somebody has owed us a ration book since the winter and won't pay,
      Somebody else paid twice and never said.
      It comes out about level if you do not look too hard,
      And looking too hard is how a band stops being one.

      [Chorus - tokens shaken here]
      Don't spend it on tonight. Don't spend it on tonight.
      We have been hungry cleverer than this before.
      There is a pile for the week after the week after this
      And nobody's hand goes near it, not even mine.

      [Bridge - all four shouting]
      Two more months! Two more months!
      Then we will be wrong about something else!

      [Final Chorus - all four voices]
