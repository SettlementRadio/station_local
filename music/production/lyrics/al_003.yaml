    lyrics: |
      [Intro - 16 seconds, both guitars, keyboard bass at ten seconds, kit at fourteen, no vocal]

      [Verse 1]
      There is a road that gets you home in nine minutes
      And a lane that takes the long side of the water.
      You have never once taken the first one with me,
      And it took me two years to work out that this was on purpose.

      [Chorus]
      Take the longer way (take the longer way)
      Nothing is waiting for us at that end (nothing waiting)
      I have got a coat and no reason to be anywhere,
      And the lights along the siding are as good as any.

      [Verse 2]
      We carried the whole lot home on our backs one night,
      Singing something stupid to keep the load moving.
      Somebody's window went up and somebody laughed,
      And you said that is the best we have ever sounded, and it was.

      [Chorus]
      Take the longer way (take the longer way)
      Nothing is waiting for us at that end (nothing waiting)
      I have got a coat and no reason to be anywhere,
      And the lights along the siding are as good as any.

      [Bridge]
      One day the nine-minute road will be the only one I have time for.
      Not this year. Not tonight.

      [Verse 3]
      So take the lane, and take it slowly, and talk.
      I will carry the heavier end and not mention it.
      There is a bench down by the water where nobody goes
      And we have never once sat on it, and we could.

      [Final Chorus - four voices in unison, instruments dropping away to guitars alone]
      Take the longer way (take the longer way)
      Nothing is waiting for us at that end (nothing waiting)
      I have got a coat and no reason to be anywhere,
      And the lights along the siding are as good as any.

      [Outro - sustain, both guitars ringing out]
