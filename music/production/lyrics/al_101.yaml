  - id: s_0830
    title: The Borrowed Piano
    track_number: 3
    mood: [rolling, warm, generous]
    fact: >-
      Saira Dunn plays the yard office piano she had spent two days tuning, and the band wrote the
      song around it once she had finished.
    arrangement_note: the piano is the reason the song exists rather than a part added to one, so it opens alone and the four voices come in around it instead of the other way about
    intro: 12
    outro: fade
    target_duration: "3:55"
    prompt: >-
      92 BPM rolling folk blues; piano leads, clear female lead, staggered trio, guitar, bass, fade.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, vocal tuning, whispered or rapped sections, cold ending
    lyrics: |
      [Intro - piano alone, twelve seconds]

      [Verse 1]
      Under an old coat in the lake-yard office,
      ninety yellow forms had learned the shape beneath.
      One cracked key showed where the tea tray always rested.
      Dust held every fingerprint except the latest one.
      She came off a cargo run with two days before departure,
      lifted all the paper, folded back the coat,
      and found a whole room everyone had stopped seeing.
      The piano held its silence like a closed-up berth.
      She treated neither dust nor neglect as a final verdict.

      [Chorus]
      A borrowed piano, a key returning slowly,
      one good note where a dead one used to be.
      Some things wait in silence for the hand that treats them kindly.

      [Verse 2]
      First day, every string argued with the weather.
      Second day, the office lamp stayed on through supper.
      Outside, freight crews crossed the berth in sleet.
      Inside, one low interval kept losing its way home.
      She ate beside the pedals, listening between bites,
      tightened, waited, tried the same two notes again,
      until the window glass and frame began to answer.
      Every corrected wire moved the argument along.
      Care is patient work performed without an audience.

      [Chorus]
      A borrowed piano, a key returning slowly,
      one good note where a dead one used to be.
      Some things wait in silence for the hand that treats them kindly.

      [Verse 3]
      On the third morning, workers stopped outside the office.
      Nobody entered; nobody needed telling why.
      The forms stayed stacked beside the newly folded coat.
      At noon she left aboard the southbound cargo hauler.
      That night two children found the first eight careful notes.
      The settlement relay carried them across the water.
      Care leaves doors unlocked long after hands have gone.

      [Final Chorus]
      A borrowed piano, every key returning,
      one good room where a dead one used to be.
      Some things wait in silence. Some hands know how to answer.

      [Outro - fade]
