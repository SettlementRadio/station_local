#
# Made in 2618 in the lake yard's meeting room — a table, two lamps and one microphone — after the
# band refused a studio in the settlement for the second time, and issued at the road head in 2619.
# It is the record on which the Shore Rounds began naming who sang which part on the sleeve, and
# `s_0829` is that decision written out: **the four sing a verse each, in the order they joined**,
# which is Bran Teale's rule and the one place in this band's life where the lead voice is shared
# rather than answered (D-096). Effa Lomm's position was that the importer would put a name on it
# anyway and it might as well be the right ones.
#
# **Saira Dunn of Undershore Local is on two tracks** — she came from Europa for the sessions and
# spent two days tuning the yard office piano, which had not been touched since it was installed.
# `s_0830` was written round the piano after she had finished with it, so the instrument is the
# reason the song exists rather than an addition to it. b_047's card lists no piano and does not
# need to: the wiki's credits put her in the room.
#
# `generation:` and every `take:` were filled from the dispatch manifest at M-34. All seven takes
# match their lyric exactly and the record is complete.

