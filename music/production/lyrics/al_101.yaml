  - id: s_0832
    title: Ask the Lamp Man
    track_number: 5
    mood: [wry, midtempo, plain]
    fact: >-
      The yard's lamp keeper was in the room for the take and objected to two lines, both of which
      stayed in.
    arrangement_note: one man's speaking voice interrupts once from a corner of the room and the band go on round him, which is exactly what happened and is why the take was kept
    intro: 6
    outro: cold
    target_duration: "3:40"
    prompt: >-
      98 BPM plain folk blues; clear female lead, staggered trio, piano, guitar, male objection, stop.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, vocal tuning, whispered or rapped sections, sung interruption, fade-out
    lyrics: |
      [Intro - piano and guitar, six seconds]

      [Verse 1]
      They say the lamp keeper locks the western room at nine,
      throws sleeping freight hands out into the weather,
      keeps the brightest oil for friends along the upper berth.
      Rumour likes a person with one key ring and a silence.
      He sits beneath the hook board, tea cooling in his hands,
      while every version travels farther down the yard.
      At last the cup meets wood and one voice cuts across us.

      [Chorus]
      Ask the lamp man. He will know. He has always known.
      He will give the useful answer and refuse the easy one.
      Take them both together; neither travels separately.

      [The objection - one man's voice, not sung]
      That is not what I said.
      And I never asked anybody to leave.

      [Verse 2]
      What he does is count eleven lamps at every closing,
      trim each wick, check every seal and storm hood twice.
      Anyone too tired for the lane can take the corner bench.
      Anyone who leaves a flame gets woken before dawn.
      Kindness wears a difficult face when fuel is measured.
      Rules sound cruelest from the person keeping watch.
      The yard remembers tone and loses half the labour.

      [Chorus]
      Ask the lamp man. He will know. He has always known.
      He will give the useful answer and refuse the easy one.
      Take them both together; neither travels separately.

      [Verse 3]
      When the storm-season relay fails along the north wall,
      eleven yard lamps hold a road above the water.
      Repair crews follow them from outer hold to berth.
      He stands inside the doorway counting every light.
      By morning, all the freight hands reach the heated room.
      Nobody corrects the story travelling the tables.
      He cleans the empty cups and fills the lamps again.

      [Final Chorus]
      Ask the lamp man. He will know. He has always known.
      He will give the useful answer and refuse the easy one.
      Take them both. Then help him carry oil against the storm.

      [Outro - cold stop]
