  - id: s_0831
    title: Ice on the Steps
    track_number: 4
    mood: [cold, sparse, restless]
    fact: >-
      Kell Moray bows the bass for the only time on any of the band's records, having borrowed the
      bow from a yard hand who played nothing else.
    arrangement_note: the upright bass is bowed rather than plucked from first bar to last, which happens once in this band's life and gives the round a cold pull underneath it that never resolves
    intro: 13
    outro: sustain
    target_duration: "4:05"
    prompt: >-
      68 BPM cold sparse round; clear female lead, staggered trio, bowed bass, thin organ, held end.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, plucked or pizzicato bass, close modern vocal production, vocal tuning, whispered or rapped sections, warm production, cold ending, fade-out
    lyrics: |
      [Intro - bowed bass, thirteen seconds]

      [Verse 1]
      Before the first storm warning, he brings out the salt,
      one dented scoop kept underneath the gate-room bench.
      He starts at the berth rail and works upward slowly,
      every tread receiving one white careful line.
      The third step takes two scoops and the heel of his boot.
      Workers pass above him with the morning manifest.
      No office order asks him to be there.
      The office never counts a danger someone else prevents.

      [Refrain]
      Ice on the steps and salt on the ice
      and one pair of hands before the yard wakes.
      Mind the third step. Mind it every year.

      [Verse 2]
      Years ago, his partner slipped there after night shift,
      split one wrist and lost a winter's worth of overtime.
      The yard filed a repair request and marked it pending.
      Spring took all the ice; the request stayed where it was.
      By next sealed season, he had found the old salt bin.
      Anger needs a task or it will turn against the body.
      He chose one dangerous step and kept it honest.

      [Refrain]
      Ice on the steps and salt on the ice
      and one pair of hands before the yard wakes.
      Mind the third step. Mind it every year.

      [Verse 3]
      This year, another worker finds him before sunrise,
      takes the second scoop and starts below the landing.
      Neither turns the labour into thanks or conversation.
      Ferry lamps come through the dark one at a time.
      By first bell, every tread is rough and white.
      The pending repair remains inside the office.
      Two people know the third step will not win today.
      Small repairs become traditions when the proper one never comes.

      [Final Refrain]
      Ice on the steps and salt on the ice
      and two pairs of hands before the yard wakes.
      Mind the third step. Mind each other every year.

      [Coda - sustain, bowed bass held]
