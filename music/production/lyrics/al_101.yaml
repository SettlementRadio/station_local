  - id: s_0834
    title: Last One Off the Water
    track_number: 7
    mood: [final, warm, close]
    fact: >-
      The four turn away from the microphone for the last round, so it gets quieter as it goes, and
      nobody asked them to do it again.
    arrangement_note: the last round is sung with all four turned away from the microphone, so the track gets quieter and further off by itself without anything being done to it afterwards
    intro: 9
    outro: sustain
    target_duration: "3:55"
    prompt: >-
      74 BPM warm round; clear female lead, staggered trio receding from mic, reed organ, held end.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, level or compressed dynamics, vocal tuning, whispered or rapped sections, cold ending, fade-out
    lyrics: |
      [Intro - reed organ, nine seconds]

      [First line - lead alone]
      Whoever is last off the water puts the lamps out and goes.

      [Verse 1]
      She ties the final lake boat underneath the berth lamp,
      checks the empty hold and hangs the wet lines high.
      Every other coat has vanished through the gate.
      One cup waits in the lamp room with a skin across it.
      The return board shows no square left open.
      Only then she lifts the first light from its hook.
      Closing is a job the dark can feel beginning.

      [Round - four voices, turning away from the microphone]
      Put the lamps out. Put them out in order.
      Leave one for the steps and one above the gate.
      Go on home. The water knows its way through darkness.
      Morning will return what night has put away.

      [Verse 2]
      At the third step she scatters what remains of salt.
      At the western rail she finds a working glove,
      carries it inside for whoever comes at dawn.
      Small duties lengthen when no other footsteps answer.
      Her home light waits two streets beyond the relay mast.
      Someone there has kept the evening ration warm.
      Still she counts each lamp before she leaves the wall.

      [Round - four voices, turning away from the microphone]
      Put the lamps out. Put them out in order.
      Leave one for the steps and one above the gate.
      Go on home. The water knows its way through darkness.
      Morning will return what night has put away.

      [Verse 3]
      The last gate lamp makes her shadow reach the water.
      She turns it low but leaves the pilot flame alive.
      Storm season teaches what can safely go completely dark.
      Beyond the yard, one upstairs window opens.
      She raises one hand; another hand appears.
      Then the gate goes quiet and her footsteps fade inland.
      The lake holds only marker lights and weather.

      [Final Round - four voices, further away still]
      Put the lamps out. Put them out in order.
      Leave one for the steps and one above the gate.
      Go on home. The water knows its way through darkness.
      Morning will return what night has put away.

      [Outro - sustain, empty room]
