  - id: s_0828
    title: Two Lamps and a Table
    track_number: 1
    mood: [close, warm, slow]
    fact: >-
      Recorded around one table with two lamps and a single microphone, which is everything the
      yard's meeting room had in it.
    arrangement_note: four people at one table at the distances they happened to be sitting at, so the voices are unevenly placed and stay that way, and a lamp is audible under the quiet passages
    intro: 11
    outro: sustain
    target_duration: "4:00"
    prompt: >-
      70 BPM close slow round; clear female lead, staggered trio, organ, guitar, lamp hum, held end.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, close modern vocal production, even or balanced vocal placement, vocal tuning, whispered or rapped sections, cold ending, fade-out
    lyrics: |
      [Intro - reed organ and a lamp humming, eleven seconds]

      [First line - lead alone]
      Two lamps on one table; choose what we can keep warm.

      [Verse 1]
      The sealed season came three weeks before the stores.
      One ration card lay empty by the blackened cup ring.
      We put the heating figures in the middle of the table,
      moved them back and forth beneath the stronger lamp.
      Outside, lake ice pressed against the meeting-room window.
      Inside, nobody could make a month from twenty days.
      The door would not shut, so we kept our coats on.

      [Round - four voices around one table]
      Two lamps and one table, four chairs pulled near.
      Put the hard sum down where every hand can reach it.
      Keep one light for figures and one for faces.
      No one leaves the colder half to someone else.

      [Verse 2]
      The settlement office sent a careful recommendation:
      close the lower room and share the upper heat.
      Easy on a form; harder with two working shifts,
      one child sleeping days, one elder walking nights.
      We read the relay notice till the words turned foolish.
      Then somebody split the final fuel mark into four
      and found the answer no official line had offered.

      [Round - four voices around one table]
      Two lamps and one table, four chairs pulled near.
      Put the hard sum down where every hand can reach it.
      Keep one light for figures and one for faces.
      No one leaves the colder half to someone else.

      [Verse 3]
      By midnight, one lamp went dark to save the cell.
      Our shadows joined along the wall above the water.
      We set four ration cards beneath the same fuel promise,
      not as witnesses, as people owing equal heat.
      The figures stayed impossible. The room grew less afraid.
      When morning found us sleeping in our meeting coats,
      both lamps were cold and every chair was occupied.

      [Final Round - four voices around one table]
      Two lamps and one table, four chairs pulled near.
      Put the hard sum down where every hand can reach it.
      Keep one light for figures and one for faces.
      We will carry the colder half together.

      [Outro - sustain]
