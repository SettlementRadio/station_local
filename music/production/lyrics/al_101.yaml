  room: >-
    A Titan lake yard's meeting room — one table with a burn on it, two lamps, one microphone, a
    window on the water and a door that does not shut — and the yard office next to it, which is
    where the piano is. Voices first and instruments beneath them, everybody at the distance they
    happen to be sitting at, no overdubs. The card holds: plain clear female mezzo starting alone,
    three voices entering a bar apart behind her, the male bass voice last, no drum kit anywhere.
    Three things are this record's own. Saira Dunn plays the yard office piano on s_0830 and s_0832
    and on nothing else the band has made. Kell Moray bows the upright bass on s_0831 with a bow
    borrowed off a man at the gate who plays nothing, which happens once in this band's life. And on
    s_0829 all four take a verse alone, in the order they joined, which is the only track on any
    Shore Rounds record where the lead is handed over rather than answered.

