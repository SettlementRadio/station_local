  - id: s_0833
    title: A Long Wait at the Gate
    track_number: 6
    mood: [patient, tired, steady]
    fact: >-
      Written waiting for a boat that never came, and Effa Lomm set the tempo by walking the length
      of the room while the others found it.
    arrangement_note: the tempo is one woman's walking pace measured across a room four times, and the hand percussion holds that pace flat for the whole track without lifting once
    intro: 16
    outro: fade
    target_duration: "4:10"
    prompt: >-
      72 BPM patient round; clear female lead, staggered trio, steady hand drum, organ, guitar, fade.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, tempo changes, close modern vocal production, vocal tuning, whispered or rapped sections, cold ending
    lyrics: |
      [Intro - hand percussion at a walking pace, sixteen seconds]

      [Verse 1]
      I walk from gate lamp to the weather notice,
      turn beneath the relay clock and walk it back.
      Your boat was due before the evening ration bell.
      The outer water holds no marker, wake or engine.
      Standing still lets every possible ending gather.
      Walking gives the fear one measured place to go.
      Fourteen boards each way; I know them without looking.

      [Chorus]
      A long wait at that gate and no boat on the water.
      Nothing to do and nothing to be done about it.
      Walk the line again. The clock has lost an hour.

      [Verse 2]
      Morning puts one word beside the manifest: delayed.
      Delayed can mean a valve, a storm, a damaged relay.
      Delayed can hold a family upright for a day.
      By night the word has thinned beneath too many fingers.
      Freight crews pass the gate and lower both their eyes.
      Someone leaves hot soup beside my walking line.
      The gate stays open. I refuse to ask by whom.

      [Chorus]
      A long wait at that gate and no boat on the water.
      Nothing to do and nothing to be done about it.
      Walk the line again. The clock has lost an hour.

      [Verse 3]
      Eleven days have filled the wall with weather sheets.
      Your marker has not answered from the northern water.
      I no longer walk all night; the body sets a limit.
      Still, at every shift change, I take the gate road home.
      One lamp burns above the berth through sealed-season dark.
      Hope is not a promise and despair is not a fact.
      I leave enough room between them for another night.

      [Final Chorus]
      A long wait at that gate and no boat on the water.
      Nothing to do and nothing to be done about it.
      Walk the line once more. Leave the gate lamp on.

      [Coda - fade]
