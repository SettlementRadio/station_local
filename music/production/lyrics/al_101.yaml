  - id: s_0829
    title: Everybody Take a Line
    track_number: 2
    mood: [communal, bright, midtempo]
    fact: >-
      The four sing a verse each in the order they joined the band, which Bran Teale insisted on and
      Effa Lomm has called the only rule they have.
    arrangement_note: four verses and four different singers, in the order they joined — female mezzo, male tenor, low female, male bass — with the other three under whoever is on, and no round anywhere until the last chorus
    intro: 5
    outro: cold
    target_duration: "3:45"
    prompt: >-
      96 BPM bright folk round; four lead voices take one verse each, guitar, hand drum, cold stop.
    exclude: drum kit, electric instruments, synthesizers, brass, orchestral strings, stacked studio harmony, one voice singing every verse, close modern vocal production, vocal tuning, whispered or rapped sections, fade-out
    lyrics: |
      [Intro - guitar and hand percussion, five seconds]

      [Chorus]
      Everybody take a line and take it in your turn.
      One voice for the gate, one for the heat, one for the food.
      Keep the last line open for whoever comes in cold.

      [Verse 1 - clear female mezzo]
      I take the transfer hall and count the arriving coats.
      Lower terrace lost its heat before the evening bell.
      Fifty people, thirty blankets, one airlock closing badly.
      I know which child has eaten and which one only says so.
      Bring the new arrivals through and point them toward my table.
      I can hold the names until the relay comes alive.

      [Verse 2 - plain male tenor]
      I take the western door and brace the lower hinge.
      Storm wind finds the gap and drives the lake dust through it.
      Give me rope, two berth hooks, anybody with dry gloves.
      If the seal gives way, the upper room loses heat.
      Do not call this courage; I know how a door is built.
      Send the next pair down when my two hands go numb.

      [Chorus]
      Everybody take a line and take it in your turn.
      One voice for the gate, one for the heat, one for the food.
      Keep the last line open for whoever comes in cold.

      [Verse 3 - low female voice]
      I take the ration room and make the thin soup honest.
      Water, root meal, salt and everything the cupboard has.
      The office count says forty; I can see it will be sixty.
      Put the smaller bowls away so no one learns their measure.
      Leave one pot untouched for crews still on the lake.
      Hunger hears a promise only when the ladle moves.

      [Verse 4 - male bass voice]
      I take the final watch beside the marker board.
      Three repair boats are late beyond the northern reeds.
      Everyone inside can hear each change I do not call.
      When the first green light appears, I lift one finger.
      When the last comes home, I leave the fourth line empty.
      Someone colder may still need a place to enter.

      [Final Chorus]
      Everybody take a line and take it in your turn.
      One voice for the gate, one for the heat, one for the food.
      Keep the last line open for whoever comes in cold.
      Nobody takes two. Nobody goes empty-handed.

      [Outro - cold stop]
