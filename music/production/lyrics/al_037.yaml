    lyrics: |
      [Intro - 6 seconds, fiddle and guitar, no vocal]

      [Verse 1]
      Nine days out and four to go and everybody on that run
      had stopped being interesting to each other about a week before,
      and there is a point in a long haul where the conversation dies
      and what is left is whoever can make a noise,
      and the hold is full and the lane is straight and the deck is cold
      and there are four days of exactly this in front of everybody.

      [Chorus - lead plus the other three men, four voices total in unison]
      A fiddle going, out on the long run, and the hold does not care
      and the freight does not care and the schedule does not care,
      and eleven people in a bay who have run out of things to say
      have suddenly all got something to be doing with their hands.

      [Verse 2]
      Nessa came down with the crew on the second port and stayed on
      and carries two bows and will not lend either of them
      and told me that on the first evening without being asked,
      which told me exactly how this run was going to go.

      [Chorus - lead plus the other three men, four voices total in unison]
      A fiddle going, out on the long run, and the hold does not care
      and the freight does not care and the schedule does not care,
      and eleven people in a bay who have run out of things to say
      have suddenly all got something to be doing with their hands.

      [Tempo lift - Nessa looks across the bay; rise from 138 to 146 BPM inside one bar, no stop]

      [Instrumental - lead guitar break with the fiddle underneath, 16 seconds, new tempo]

      [Verse 3]
      Halfway through, the whole bay changed shape without moving.
      The cook put down a cup. The keeper came off the wall.
      Eleven people found the beat at eleven different times
      and by the end of the bar everybody had it,
      with four days still ahead and none of them looking as long.

      [Final Chorus - all four voices, at the new tempo]
      A fiddle going, out on the long run, and the hold does not care,
      and the freight does not care and the schedule does not care,
      and the lane is the same length it was one bar ago,
      but every next mark on it is arriving sooner.

      [Outro - fade on the fiddle]
