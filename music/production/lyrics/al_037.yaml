    exclude: stripped-wire chimes, a woman's voice in the chorus, close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 8 seconds, bass and tank drums, no vocal]

      [Verse 1 - lead names shares 1 through 6, the other three men count them back]
      Four shares for the four of us and that is the easy part
      and after that it gets complicated in a way nobody warns you about.
      One, two, three, four, one for each of us. (one, two, three, four)
      One for the van, the strings, the skins and the leads. (five)
      One for the crate and the co-operative that sends it. (six)
      because nothing on any manifest travels for love.

      [Chorus - lead plus the other three men, four voices total in unison]
      Nine ways it splits, and then the argument splits four,
      which is the only bit of arithmetic anybody remembers.
      Nobody in this band has ever been short-changed
      and all four of us have been furious about the sums.

      [Verse 2 - the other three men count 7 and 8, then go silent for 9]
      One held back for the season when nothing comes in. (seven)
      One for whoever drove, because whoever drove did not drink. (eight)
      And one, at the end, for the man who fixed the van in 2597.

      [Chorus - four male voices total in unison]
      Nine ways it splits, and then the argument splits four,
      which is the only bit of arithmetic anybody remembers.
      Nobody in this band has ever been short-changed
      and all four of us have been furious about the sums.

      [Verse 3]
      He fixed the van in 2597 for nothing and would not take it after
      and has not asked for anything since and would be embarrassed
      and the ninth share goes to his account four times a year
      and he has never once mentioned that it arrives.

      [Bridge]
      Bel wrote all nine down in a notebook in the first year
      and reads them out at the meeting and nobody has ever moved one.

      [Verse 4]
      There are bands on this lane who have never had this conversation
      and are four years from an argument that will finish them,
      and I would rather have had ours in the first season, on paper,
      in a cold bay, with a notebook, badly, than not at all.

      [Final Chorus - four voices through line 3, lead alone on line 4]
      Nine ways it splits, and then the argument splits four,
      which is the only bit of arithmetic anybody remembers.
      Nobody in this band has ever been short-changed.
      The ninth one is not a share. It is a thank you.

      [Outro - fade]
    take: null                    # M-31 fills this in at the Suno sitting

