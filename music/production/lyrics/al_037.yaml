      [Intro - 16 seconds, upright bass and guitar, no vocal]

      [Verse 1]
      The last thing on a run is a page and a pen and a name
      and it takes about eleven seconds and nobody makes anything of it,
      and it is the only moment in nine days that is actually the end,
      and after it you are a person again and not a crew.

      [Pre-Chorus]
      Nine days of being one thing and then eleven seconds.

      [Chorus - Dov, Ryke and Hess, three male voices total]
      Sign off and go home. That is the whole ceremony.
      No speech, no handshake, nobody says well done.
      A line on a page and a walk across a yard
