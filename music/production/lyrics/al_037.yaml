  room: >-
    Four cargo bays at four ports inside one run, which is as close to the card's "one live room" as
    a hauler crew gets. The first bay, on s_0311 and s_0312, is small and keeps the low end short; the
    second, on s_0313 through s_0315, is wide and lets the tank drums ring longest; the third, on
    s_0316 and s_0317, is long and leaves a bass tail behind the beat; and the fourth, on s_0318 and
    s_0319, is tall with a leaner low end. No song was carried from one bay to the next. The card
    holds except for what Una Brack has not arrived to supply — the crew chorus is four men total,
    including the lead, with no woman above them, and there are no stripped-wire chimes anywhere.
    Three fact-bound exceptions are explicit: a relief hauler replaces Hess Vantry on drums and
    supplies the fourth crew shout on s_0315; Nessa Dray's guest fiddle runs through s_0316 and takes
    the tempo up mid-take with the band following her; and Oren Saye replaces Bel Corrow on s_0319,
    playing upright bass throughout and the closing figure in the key Dov Reyland used at the
    audition rather than the one on the chart. That last track has three crew voices and Oren does
    not sing. None of the guests joins the permanent line-up.

