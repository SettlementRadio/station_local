    lyrics: |
      [Intro - 4 seconds, drums alone, no vocal]

      [Verse 1]
      Hess did not make the third port. There is a reason and it is boring
      and it involves a berth, a schedule and a decision by somebody else,
      and we had a bay for nine hours and a song that needed drums
      and about forty minutes to decide what we were going to do.

      [Chorus - lead, two bandmates and relief drummer, four voices total]
      Somebody's cousin behind the kit, somebody's cousin behind the kit,
      and he has never been in a room with a microphone in his life,
      and he is going to rush every fill in this entire song
      and we are going to go with him because that is what a crew does.

      [Verse 2]
      Somebody knew somebody on a relief run out of the near lane
      which is where the title came from; nobody was anybody's cousin.
      He had a kit at home and played it and would not say more than that,
      and he came down the gangway looking like a man being arrested
      and sat behind it and asked, very quietly, how many times,
      and Bel said as many as it takes and he said right and did four.

      [Chorus - lead, two bandmates and relief drummer, four voices total]
      Somebody's cousin behind the kit, somebody's cousin behind the kit,
      and he has never been in a room with a microphone in his life,
      and he is going to rush every fill in this entire song
      and we are going to go with him because that is what a crew does.

      [Instrumental - lead guitar break, 14 seconds]

      [Verse 3]
      It is the fastest thing on the record by about six beats
      and none of us decided that and all of us went with it,
      and his name is on the one line with the three of ours
      and when the page came down he read the whole line twice.

      [Final Chorus - lead, two bandmates and relief drummer, four voices total]
      Somebody's cousin behind the kit, somebody's cousin behind the kit,
      and Hess heard it back and said leave it exactly there,
      and said it was his song whether or not he was on it,
      which is the most generous thing one drummer can say about another.

      [Outro - cold stop]
