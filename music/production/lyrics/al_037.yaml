  - id: s_0311
    title: Every Crew Signs
    track_number: 1
    mood: [defiant, singalong, brisk]
    fact: >-
      The song is about the argument that produced the band's one-line credit, which the co-operative
      agreed to before recording began.
    arrangement_note: Dov leads the verses while the other three men repeat selected line endings, then all four male voices total sing level with one another on every chorus, with nobody in front in those sections
    intro: 10
    outro: sustain
    target_duration: "4:15"
    prompt: >-
      Boogie-driven rock, 132 BPM, defiant and brisk, built to be shouted back. Male lead vocal,
      high hard tenor, carrying and a shade nasal, pushing at the top of every chorus and staying
      there, plain and undecorated, no vibrato. Three other male voices repeat the tagged line endings
      in unison through the verses; on every chorus the lead joins them to make four male voices total,
      all four in unison rather than harmony, level with one another and never stacked behind him.
      Two electric guitars, electric bass, drum kit with tuned oxygen-tank drums left ringing rather
      than damped. Tracked whole-band in the small first cargo bay, with short low-end decay, loose
      rather than gridded, light compression. Ten seconds of full band before the first sung word.
      Ends on a held chord with all four voices still on it.
    exclude: stripped-wire chimes, a woman's voice in the chorus, close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 10 seconds, full band, no vocal]

      [Verse 1 - other three men repeat the last phrase of lines 2 and 4]
      They sent the paper down to the bay with one name on it,
      mine, in the big letters, and the rest of them underneath
      in the size they print the things nobody is meant to read,
      and I put it on the floor and said we are not starting.

      [Chorus - lead plus the other three men, four voices total in unison]
      Every crew signs. Every crew signs or nobody does.
      One line, four names, and the same ink for all of them.
      You can have the record when the page says what happened.
      Until then we are four men sitting in a hold.

      [Verse 2 - other three men repeat the last phrase of lines 1 and 4]
      It took nine days. It went to a vote and then a second vote
      and a man came down from the co-operative to explain to us
      why it was normally done the other way, at length, twice,
      and Bel said normally is not a reason and he stopped.

      [Chorus - lead plus the other three men, four voices total in unison]
      Every crew signs. Every crew signs or nobody does.
      One line, four names, and the same ink for all of them.
      You can have the record when the page says what happened.
      Until then we are four men sitting in a hold.

      [Verse 3 - other three men repeat the last phrase of lines 2 and 6]
      It is not about the money. The money is the same either way,
      which is the part the man from the office could not follow,
      and he asked what we actually wanted about six times
      and the answer never changed and he never heard it,
      and he went out on the last ferry with the page unsigned
      and came back down nine days later and signed it in the bay.

      [Bridge]
      A crew is a crew on the manifest and a crew at the gate.
      Nobody down there is billed as the important one.

      [Final Chorus - lead plus the other three men, four voices total and level]
      Every crew signs. Every crew signs or nobody does.
      One line, four names, and the same ink for all of them.
      That page is in the crate that leaves this bay tonight
      and it took nine days and it was worth every one.

      [Outro - held chord, four voices on it]
