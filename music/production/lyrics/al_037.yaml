      undecorated, no vibrato. Three other male voices count back shares one through eight in the
      tagged parenthetical answers; the lead joins them for four male voices total in unison on the
      choruses. The other three stay silent when the ninth share is named and on the last line of the
      song. Two electric guitars, electric bass, drum kit with tuned oxygen-tank drums left ringing
      rather than damped. Tracked whole-band in the wide second cargo bay, with broad low end and a
      long tank-drum ring, loose rather than gridded, light compression. Eight seconds of bass and
