    exclude: stripped-wire chimes, a woman's voice in the chorus, close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 14 seconds, one guitar building, no vocal]

      [Verse 1 - other three men repeat the last phrase of lines 2 and 6]
      For four years everything we made stayed on our own circuit
      and got as far as the last port on it and stopped there,
      because a crate is heavy and a run is expensive
      and nobody was going to carry ours for nothing,
      and every hauler out of here has a full hold already
      and there is no room on any manifest for a favour.

      [Verse 2 - one guitar only under the first name]
      Then Cold Harbor, on a hauler that was going anyway.
      [Bass enters]
      Then Low Span, because a clerk there liked the first one.
      [Drums enter]
      Then Verrin Reach, which we have still never played.
      [Second guitar enters - four-person band now complete]
      Then Forge, which is the one that changed everything after.

      [Chorus - four male voices total in unison]
      Out past the usual lanes. Past the end of the route.
      Somewhere out there is a settlement we will never stand in
      with four people in it who know the words to this,
      and that is a strange thing to have done with a Tuesday.

      [Instrumental - lead guitar break, 16 seconds]

      [Verse 3 - other three men repeat the last phrase of lines 2 and 6]
      A woman wrote to the co-operative from a port we had not heard of
      to ask what the second verse of the third song was about,
      and Dov wrote back, on paper, four pages, and told her.
      On the fourth page he asked about her own settlement,
      whether a crate can arrive where the band itself never will
      and still count as four people having been there.

      [Chorus - four male voices total in unison]
      Out past the usual lanes. Past the end of the route.
      Somewhere out there is a settlement we will never stand in
      with four people in it who know the words to this,
      and that is a strange thing to have done with a Tuesday.

      [Final Chorus - four male voices total in unison]
      Out past the usual lanes. Past the end of the route.
      We did not go anywhere. The crate went without us.
      Everything we have ever made has travelled further than we have
      and I have made my peace with that about half the time.

      [Outro - fade at full size]
