    lyrics: |
      [Intro - 18 seconds, bass and one guitar, no vocal]

      [Verse 1]
      There is a shelf above the bunk about the width of a hand
      and everything I own on this run is on it,
      and one of the things on it is four pages of your writing
      that came aboard at the second port with the cargo manifest,
      in a bag of other people's, off a hauler going the other way.

      [Verse 2]
      I have read it eleven times, which is not a good number,
      and there is nothing in it, it is what you had for the week,
      the roof, the neighbour, the thing with the account,
      and I have read it eleven times and I will read it again tonight.

      [Chorus - lead plus the other three men, four voices total in unison]
      Cold bunk and a warm letter and eleven days to go.
      The lag out here is nine days each way and I know that,
      and I write back anyway, on the day, every time,
      and by the time it lands the week in it is over.

      [Verse 3]
      There is a man two bunks along who does not get letters
      and does not appear to want any and I do not believe him,
      and I have offered him mine to read twice, as a joke,
      and the second time he took them, and read all four pages.

      [Chorus - lead plus the other three men, four voices total in unison]
