    exclude: stripped-wire chimes, a woman's voice in the chorus, close harmony, stacked studio harmony, synthesizers, electronic drums, brass, orchestral strings, close modern studio polish, vocal tuning, whispered or rapped sections, dance and electronic production
    lyrics: |
      [Intro - 5 seconds, tank drums, no vocal]

      [Verse 1]
      First burn day any of us had been paid for properly,
      four years in, in a transfer hall with the doors open,
      and somebody put a rate up on a board at about four
      and the whole room read it at the same time and made a noise.

      [Pre-Chorus]
      Nobody had told us. It was just up there, in chalk.

      [Chorus - shouted by everyone at once]
      Burn day wages, burn day wages,
      a full rate and a half and the night after it off.
      Spend it, spend it, spend the whole of it tonight,
      it will not be here in the morning and neither will we.

      [Verse 2]
      One line does not scan. I know exactly where it goes wrong.
      Four people shouted it in a hall and I wrote it down
      exactly as it came out, including the bit that does not scan,
      and eleven people have offered to fix that line for me,
      including two who were in the transfer hall on the night.

      [Chorus - shouted by everyone at once]
      Burn day wages, burn day wages,
      a full rate and a half and the night after it off.
      Spend it, spend it, spend the whole of it tonight,
      it will not be here in the morning and neither will we.

      [Verse 3]
      A man from a label in the core said one word had to go
      and offered a better one and the better one is better
      and I said no, and he asked why, and I could not tell him,
      and I still cannot, and the word is still in it.

      [Bridge]
      There is a version of that evening in about two hundred heads
      and this is the only one anybody wrote down.

      [Final Chorus - shouted by everyone at once]
      Burn day wages, burn day wages,
      a full rate and a half and the night after it off.
      That is the line and I have not changed a word,
      and I am not going to, and that is the whole song.

      [Outro - cold stop]
    take: null                    # M-31 fills this in at the Suno sitting

