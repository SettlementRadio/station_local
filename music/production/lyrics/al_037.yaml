    prompt: >-
      Boogie-driven rock, 148 BPM, celebratory and rowdy, fast. Male lead vocal, high hard tenor,
      carrying and a shade nasal, plain and undecorated, no vibrato — and shouting the chorus at the
      same pitch and volume as the other three men rather than above them. Every chorus is all four
      male voices total shouting in unison rather than harmony. Two electric guitars, electric bass,
      drum kit with tuned oxygen-tank drums left ringing rather than damped. Tracked whole-band in
      the wide second cargo bay, with broad low end and the longest tank-drum ring on the record,
