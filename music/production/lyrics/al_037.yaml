  - id: s_0313
    title: Burn Day Wages
    track_number: 3
    mood: [celebratory, rowdy, fast]
    fact: >-
      The chorus is the one the crew shouted on the band's first burn day, and Dov Reyland has
      refused every suggestion to change a word of it.
    arrangement_note: the chorus is shouted rather than sung by all four men total, including the lead, at the same pitch and volume, and it is the only place on the record where the tenor is not above the other three
