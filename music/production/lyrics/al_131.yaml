songs:
  - id: s_1076
    title: Bay Rate
    track_number: 1
    mood: [blunt, driving, fast]
    fact: >-
      Wen Arbo built the verse out of the four different rates the crew was paid for four different
      bays, which they had argued about all that week.
    arrangement_note: the two guitars trade the same four-note figure through the whole song, one rhythm one lead, and the four rates are counted off flat in the third verse with the band dropping to bass and drums under them
    intro: 12
    outro: cold
    target_duration: "3:50"
    prompt: >-
      Dry pub rock, 148 BPM, blunt and driving, fast. Male lead vocal, plain mid baritone,
      conversational and unforced, sung hard on the beat, getting louder rather than higher at the
      end of a chorus, no vibrato. Two band voices in unison under the lead on the chorus only,
      never in harmony, all four shouting the hook on the last one. Two bright thin-toned electric
      guitars, one rhythm and one lead trading the same four-note figure, electric bass, compact
      drum kit. Tracked live in a small hard-walled shed bay, guitars close-mic'd and mid-forward,
      drums tight and untreated, nothing overdubbed but a doubled chorus vocal. Band drops to bass
      and drums under the counted list in the third verse. Twelve seconds of the two guitars trading
      the figure with the drums entering at four bars, no vocal. Cold stop.
    exclude: synthesizers, keyboards, acoustic guitar, orchestral strings, brass, stadium reverb, heavy vocal tuning, spoken-word or rapped sections, whispered vocals, dance and electronic production
    lyrics: |
      [Intro - 12 seconds, two guitars trading the figure, drums in at four bars, no vocal]

      [Verse 1]
      Four bays down the transfer hall and four different rates,
      same crew, same backs, same cargo off the same hauler.
      Bay one pays like it matters, bay four pays like a favour,
      and the hands are the same hands whichever door you stand at.
      Nobody who wrote the numbers has been down here to look.

      [Chorus]
      Bay rate, bay rate,
      whatever they are calling it this week we still lift it.
      Bay rate, bay rate,
      the number moves and the weight never does.
      Come down and carry one and then tell me what it is worth.

      [Verse 2]
      Ansa worked all four of them inside one shift on the Tuesday
      and got paid four ways for one spine and one pair of boots.
      She wrote the four of them on the back of her hand in the yard light
      and held it flat against the office glass until somebody looked up.
      They looked up. That is all they did. She went back down and finished.

      [Chorus]
      Bay rate, bay rate,
      whatever they are calling it this week we still lift it.
      Bay rate, bay rate,
      the number moves and the weight never does.
      Come down and carry one and then tell me what it is worth.

      [Verse 3]
      Ninety on the near door, eighty-two on the second,
      seventy-five on the third and I have stopped saying the fourth.
      Four rates, one shed, one manifest, one crew,
      and the argument has run all week and will run again on Monday.

      [Bridge]
      I am not asking for the good rate.
      I am asking for one rate.
      Put a number on the wall and stand behind it
      and I will carry anything you like.

      [Final chorus - all four voices, shouted]
      Bay rate, bay rate,
      whatever they are calling it this week we still lift it.
      Bay rate, bay rate,
      the number moves and the weight never does.
      Come down and carry one. Come down and carry one.

      [Outro - cold stop on the riff]
