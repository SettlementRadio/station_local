#
# Five songs cut in one night in a Cold Harbor transfer shed, in the year the four of them started
# playing. The wiki's story is a band paying for its own record and selling sixty copies at a gate,
# so nothing here is grand: the songs are about what a shift pays, who gets called when somebody
# does not turn up, and the walk back. **The pay dispute is furniture and the people are the
# subject** (§3) — the rates are what the argument is made of, not what the song is about.
#
# Lane-rock takes an instrumental break in roughly one song in three (§7) and b_016's style card
# gives the break to the lead guitar. Two of these five take one.
#
# `generation:` and every `take:` are empty until M-31's Suno sitting fills them in.

