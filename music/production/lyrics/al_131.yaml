  - id: s_1077
    title: Door Out of Use
    track_number: 2
    mood: [wry, rowdy, brisk]
    fact: >-
      The band only had the bay that night because its door was out of use, and the take keeps the
      repair crew's radio under the second verse.
    arrangement_note: the lead guitar takes a twelve-second break in the middle of the song, played over the repair crew's radio, which is left in the take and not mixed down
    intro: 6
    outro: fade
    target_duration: "3:45"
    prompt: >-
      Dry pub rock, 152 BPM, wry and rowdy, brisk. Male lead vocal, plain mid baritone,
      conversational and unforced, sung hard on the beat, getting louder rather than higher at the
      end of a chorus, no vibrato. Two band voices in unison under the lead on the chorus only,
      never in harmony, all four shouting the hook on the last one. Two bright thin-toned electric
      guitars, one rhythm and one lead, electric bass, compact drum kit. Tracked live in a small
      hard-walled shed bay, guitars close-mic'd and mid-forward, drums tight and untreated, nothing
      overdubbed but a doubled chorus vocal. A twelve-second lead guitar break in the middle of the
      song with a faint radio audible behind it, left in rather than cleaned up. Six seconds of
      rhythm guitar and a counted stick before the first sung word. Fade on the repeated hook.
    exclude: synthesizers, keyboards, acoustic guitar, orchestral strings, brass, stadium reverb, heavy vocal tuning, spoken-word or rapped sections, whispered vocals, dance and electronic production
    lyrics: |
      [Intro - 6 seconds, rhythm guitar and a counted stick, no vocal]

      [Verse 1]
      We got the room because the room was broken.
      Sign on the shutter, nobody booked, nobody coming.
      Best night of the year to be a band with no money
      is the night the door will not close and the shed is worth nothing.
      Teff had the kit in the bay before the shift had finished walking out.

      [Chorus]
      Play it while it is out of order,
      play it while nobody wants the space.
      They will fix it in the morning and charge us for the hour,
      so we are going to fill this one right up.

      [Verse 2]
      Two of the repair crew stayed and put their radio on the bulkhead,
      halfway through the take you can hear what they were listening to.
      Mel said leave it, it is the only guest we can afford,
      and he was right, and it is on the record, and it stays.
      Somebody's carrier wave, somebody's afternoon, straight through our second verse,
      and it cost us nothing and it is the best thing on the track.

      [Chorus]
      Play it while it is out of order,
      play it while nobody wants the space.
      They will fix it in the morning and charge us for the hour,
      so we are going to fill this one right up.

      [Instrumental - lead guitar break, 12 seconds, the repair crew's radio faint underneath]

      [Verse 3]
      There is a way of getting things that costs nothing but timing.
      Wait for the fault. Wait for the shift that got cancelled.
      Wait for the hauler that is late and the hold that is empty,
      and be standing there ready with a bag full of leads.
      Everything we own came to us broken and cheap
      and we have not paid full price for one hour of it yet.

      [Bridge]
      They will weld it and hang it and test it twice by seven,
      and by seven we will be gone and the tape will be in a coat.
      Fix your door. We were never supposed to be in here.

      [Chorus - all four, shouted]
      Play it while it is out of order,
      play it while nobody wants the space.
      They will fix it in the morning and charge us for the hour,
      so we are going to fill this one right up.
      We are going to fill this one right up.

      [Outro - fade on the riff and the radio]
