  - id: s_1080
    title: Nobody Signed Us
    track_number: 5
    mood: [proud, comic, fast]
    fact: >-
      Teff Onda counts the band in by shouting the number of copies they had money for, which was
      sixty.
    arrangement_note: the drummer's shouted count of sixty opens the track and comes back once near the end with all four voices on it, and the lead guitar takes a ten-second break out of the second chorus
    intro: 4
    outro: cold
    target_duration: "3:40"
    prompt: >-
      Dry pub rock, 156 BPM, proud and comic, fast and loose. Male lead vocal, plain mid baritone,
      conversational and unforced, sung hard on the beat, getting louder rather than higher at the
      end of a chorus, no vibrato. Two band voices in unison under the lead on the chorus only,
      never in harmony, all four shouting the hook on the last one. Two bright thin-toned electric
      guitars, one rhythm and one lead, electric bass, compact drum kit. Tracked live in a small
      hard-walled shed bay, guitars close-mic'd and mid-forward, drums tight and untreated, nothing
      overdubbed but a doubled chorus vocal. The drummer shouts a count of sixty to start the track
      and the whole band shouts it again near the end. A ten-second lead guitar break out of the
      second chorus. Four seconds of a shouted count and open hi-hat before the first sung word.
      Cold stop.
    exclude: synthesizers, keyboards, acoustic guitar, orchestral strings, brass, stadium reverb, heavy vocal tuning, spoken-word or rapped sections, whispered vocals, dance and electronic production
    lyrics: |
      [Intro - 4 seconds, the drummer shouts a count of sixty over an open hi-hat, no sung word]

      [Verse 1]
      Sixty copies. That was the money we had.
      Not sixty thousand, not sixty a week, sixty in a box,
      and the box came back from the press on a Thursday
      and we carried it up from the siding like it was somebody's cargo.
      Sixty is a number you can hold in both arms at once.
      Sixty is four rows of a room and one row standing.

      [Chorus]
      Nobody signed anything, nobody rang,
      no office in the core has our names written down.
      We paid for the room and the room was broken,
      and we did the whole thing on a night off.

      [Verse 2]
      Sold eleven at the gate the first Friday, four the next,
      and one to a hauler pilot who bought it to be polite.
      She played it on the run out and sent word back down the carrier wave
      that track three was the good one, which we already knew.
      By the turn of the season there were nine left in the box
      and we stopped counting them and started counting the nights instead.

      [Chorus]
      Nobody signed anything, nobody rang,
      no office in the core has our names written down.
      We paid for the room and the room was broken,
      and we did the whole thing on a night off.

      [Instrumental - lead guitar break, 10 seconds, out of the second chorus]

      [Verse 3]
      A year later a flagship label bought the tape off us
      and pressed it again without moving a single thing,
      which is either the best joke on this record
      or the only sensible decision anybody made about it.
      They kept the broken door. They kept the count. They kept the radio.
      There was nothing in it to improve and somebody upstairs knew it.

      [Bridge]
      You do not need permission to make a loud noise in a shed.
      You need a night, four people and a room nobody wants,
      and the settlement is full of rooms nobody wants.

      [Shout - all four, the count of sixty again]

      [Final Chorus - all four voices, shouted]
      Nobody signed anything, nobody rang,
      and we are still standing in the shed we started in.
      We paid for the room and the room was broken,
      and we would do the whole thing again on a night off.

      [Outro - cold stop]
