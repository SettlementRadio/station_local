  - id: s_1078
    title: Second Hitch
    track_number: 3
    mood: [defiant, singalong, midtempo]
    fact: >-
      Dessa Kelm wrote it about being the crew called in when the first one does not turn up, and
      the band took their name from it rather than the other way round.
    arrangement_note: the chorus is a whole-room singalong from the first time it arrives, with the two band voices in unison under the lead throughout and no harmony anywhere
    intro: 9
    outro: sustain
    target_duration: "4:05"
    prompt: >-
      Dry pub rock, 130 BPM, defiant and midtempo, built to be sung back. Male lead vocal, plain mid
      baritone, conversational and unforced, sung hard on the beat, getting louder rather than
      higher at the end of a chorus, no vibrato. Two band voices in unison under the lead on every
      chorus, never in harmony, all four shouting the hook on the last one. Two bright thin-toned
      electric guitars, one rhythm and one lead, electric bass, compact drum kit. Tracked live in a
      small hard-walled shed bay, guitars close-mic'd and mid-forward, drums tight and untreated,
      nothing overdubbed but a doubled chorus vocal. Nine seconds of the full band on the chorus
      figure before the first sung word. Ends on a held chord left ringing in the room.
    exclude: synthesizers, keyboards, acoustic guitar, orchestral strings, brass, stadium reverb, heavy vocal tuning, spoken-word or rapped sections, whispered vocals, dance and electronic production
    lyrics: |
      [Intro - 9 seconds, full band on the chorus figure, no vocal]

      [Verse 1]
      The call comes at five past and the call is never first.
      Somebody did not make it down and somebody has to.
      You are the name under the name on the board at the gate,
      you are the crew they get when the crew they wanted is gone.
      Boots on, coat off the hook, out into the cold of the yard,
      and the board does not say thank you and neither does the gate.

      [Pre-Chorus]
      And you go. You always go.

      [Chorus]
      Second hitch, second hitch,
      the ones who turn up when the first ones do not.
      We are not the first thing anybody thought of
      and the cargo does not care and neither do we.

      [Verse 2]
      Dessa said it plain in the yard and then said it again louder:
      being called second is not the same as being called last.
      Her father worked twenty years on the standby list at the transfer hall
      and never once left a hold sitting because of it.
      He is on no sleeve and no manifest and no plaque anywhere,
      and every run he covered went out on time.

      [Pre-Chorus]
      That is the whole of it. That is the trade.

      [Chorus]
      Second hitch, second hitch,
      the ones who turn up when the first ones do not.
      We are not the first thing anybody thought of
      and the cargo does not care and neither do we.

      [Verse 3]
      So we took the words off the song and put them on the van,
      and the name came from the chorus and not the other way round.
      Anybody can be somebody's first choice on a good day.
      Turning up on the bad one is a harder thing to be,
      and it is the only thing the four of us have ever been good at.

      [Final Chorus - all four voices, the room joining]
      Second hitch, second hitch,
      the ones who turn up when the first ones do not.
      We are not the first thing anybody thought of
      and the hauler goes out loaded either way.
      The hauler goes out loaded either way.

      [Outro - held chord, left ringing in the shed]
