  - id: s_1079
    title: Walk Home After
    track_number: 4
    mood: [tender, plain, slow]
    fact: >-
      Wen Arbo wrote it about the walk back from the shed, and the band have never played a room
      they could not walk home from since.
    arrangement_note: the band's slowest tempo, at the bottom of the card's range, with the drums brushed off the rim rather than struck and the lead guitar answering the end of every vocal line instead of a backing voice
    intro: 16
    outro: fade
    target_duration: "4:20"
    prompt: >-
      Dry pub rock at its slowest, 120 BPM, tender and plain, unhurried. Male lead vocal, plain mid
      baritone, conversational and unforced, sung hard on the beat, getting louder rather than
      higher at the end of a chorus, no vibrato. Two band voices in unison under the lead on the
      chorus only, never in harmony. Two bright thin-toned electric guitars, one rhythm and one lead
      answering the end of every vocal line, electric bass, compact drum kit played off the rim
      rather than struck. Tracked live in a small hard-walled shed bay, guitars close-mic'd and
      mid-forward, drums tight and untreated, nothing overdubbed but a doubled chorus vocal. Sixteen
      seconds of one guitar and bass walking in before the first sung word. Fade.
    exclude: synthesizers, keyboards, acoustic guitar, orchestral strings, brass, stadium reverb, heavy vocal tuning, spoken-word or rapped sections, whispered vocals, dance and electronic production, ballad string pads
    lyrics: |
      [Intro - 16 seconds, one guitar and bass walking in, drums off the rim, no vocal]

      [Verse 1]
      Half past two and the shed goes quiet in one go,
      the way a room does when four people stop at once.
      Amps off, cases shut, somebody counts the leads,
      and then there is the door and then there is the road.

      [Verse 2]
      It is eleven minutes to my step from the transfer hall gate.
      I have walked it drunk and I have walked it carrying a kit
      and I have walked it the night my sister took the last ferry out
      and I did not want to get there any faster than I did.

      [Chorus]
      We walk back after.
      That is the whole rule and we have never broken it.
      If the room is further than the walk then the room is not for us,
      and the settlement is small and I would rather it stayed that way.

      [Verse 3]
      Orl carries the bass and will not let anybody take it,
      says the weight on the shoulder is how he knows the night was real.
      Nobody talks much. There is nothing left to say
      that was not already said at volume in the bay.

      [Chorus]
      We walk back after.
      That is the whole rule and we have never broken it.
      If the room is further than the walk then the room is not for us,
      and the settlement is small and I would rather it stayed that way.

      [Bridge]
      They offered us a room in the core two years running.
      Good money, good floor, a door that shuts.
      And a walk home that is eight days of the lag long,
      and I said no twice and I would say it again.

      [Chorus]
      We walk back after.
      That is the whole rule and we have never broken it.
      If the room is further than the walk then the room is not for us,
      and the dark is cold and the step is only eleven minutes.

      [Outro - fade on the walking bass]
