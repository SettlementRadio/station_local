  - id: s_0818
    title: A Word With the Steward
    track_number: 10
    mood: [midtempo, wry, plain]
    fact: >-
      Del Marran sings the second verse, the only lead vocal on either record not sung by Wesla Tarn.
    arrangement_note: the second verse is sung by the bass chair rather than answered by it, which happens nowhere else in this band's life, and the usual lead voice is out of the room for it entirely
    intro: 8
    outro: fade
    target_duration: "3:40"
    prompt: >-
      94 BPM dry blues; smoky contralto, male lead verse two, slide, piano, bass, brushes, room fade.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, female lead on the middle verse, drum machines, vocal tuning, whispered or rapped sections, modern studio production, sticks or hard drumming, cold ending
    lyrics: |
      [Intro - bass and piano, eight seconds]

      [Verse 1]
      Your shift starts at sunset; mine ends after midnight.
      We trade one cup between us at the lower gate.
      Six months of touching sleeves while other workers pass us,
      six months of messages delayed along the relay.
      I took our two names to the room behind the urn,
      laid them on the desk beside the sealed-week manifest,
      and asked for one whole Wednesday in the same place.

      [Chorus]
      Go and see the steward when the ledger light is low.
      Let the first answer pass; leave the real need on the desk.
      Some doors down this lane open inward and very slowly.

      [Verse 2 - plain male second voice, lead]
      The first answer came before I reached the second chair:
      roster sealed, no overlap, night quota already thin.
      I showed the two untouched ration marks between our names,
      every meal we missed by working opposite the bell.
      He turned the manifest around, drew one line through Thursday,
      wrote Wednesday twice, then shut the ledger with both hands.
      No blessing, no advice, no reason we could owe him.

      [Chorus]
      Go and see the steward when the ledger light is low.
      Let the first answer pass; leave the real need on the desk.
      Some doors down this lane open inward and very slowly.

      [Verse 3]
      Wednesday came ordinary, pale and barely warm.
      We slept till noon, burned supper, missed the terrace tram.
      You read beside the window while I mended both our coats.
      Nothing worth reporting crossed the room all day.
      At sunset, when no bell divided mine from yours,
      we raised one cup toward the works beyond the glass.
      A small permission held an entire life inside it.

      [Final Chorus]
      Go and see the steward when the ledger light is low.
      Let the first answer pass; leave the real need on the desk.
      Some doors open slowly. We have Wednesday on the other side.

      [Outro - fade]
