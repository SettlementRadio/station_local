# Suno Custom mode only. Written under §12 rules 9 and 10.
#
# The band's first record, cut in the tram works canteen in 2618 for a Mars house that pressed four
# hundred copies and did nothing else with them, and bought unheard at the road head. It is a
# quieter record than al_098 and the reason is in the room: **Nan Sudell is on drums throughout and
# plays with brushes on most of it**, because the machine shop next door was on a night run and the
# band could not be louder than it. Every prompt here says brushes; al_098's say sticks.
#
# Two things this record has and the band's other one does not. **Tel Brask of Undershore Local is
# on s_0812** — the only person from outside the band on either record, on Mars for a fortnight for
# someone else's wedding, who walked in on the second night and had never heard the song. His
# harmonica takes a twelve-second passage, and it is the only instrumental break on this record;
# b_046's card lists no harmonica, and it does not need to, because the wiki's own credits put the
# instrument in the room (D-096). And **Del Marran sings the second verse of s_0818**, the only lead
# vocal on either record not sung by Wesla Tarn.
#
# `generation:` and every `take:` were filled from the dispatch manifest at M-34, and all eleven
# takes match their lyric exactly. **`s_0809`'s lyric above is the text that was actually pasted
# and sung**, which is not the draft this file first held; the dispatch caught the difference at
# 21% and the file was corrected to the take rather than the take regenerated (D-097).

