  - id: s_0813
    title: Nothing to Report
    track_number: 5
    mood: [slow, blue, weary]
    fact: >-
      Wesla Tarn wrote it about the works accident book and sings it without touching the slide,
      which she does nowhere else on either record.
    arrangement_note: no slide anywhere on the track, which leaves the piano carrying the top of the band for the only time on either record, and the singer with nothing in her hands
    intro: 16
    outro: sustain
    target_duration: "4:05"
    prompt: >-
      70 BPM bare slow blues; smoky contralto, piano, bass, brushes, no slide, hard room, held end.
    exclude: slide guitar, electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, sticks or hard drumming, cold ending, fade-out
    lyrics: |
      [Intro - piano and brushed kit, sixteen seconds]

      [Verse 1]
      A green book waits inside the lower airlock office,
      under one white lamp that never quite stops shaking.
      At every change of shift, a hand turns to a clean page,
      checks the siding number, checks the hour, checks the gate.
      Most nights three small words lie down across the paper.
      Two thousand workers breathe because those words are dull.
      No news can be the finest news a night has ever carried.

      [Verse 2]
      Nine years of blank mercy run along that shelf,
      then one page from 2610 grows heavy with a time.
      A pressure seal, a western bay, one line cut short,
      figures in the margin where a name should not have been.
      The next leaf opens clean. The careful hand continues.
      By dawn the usual words return without apology.
      Paper does not grieve; it only leaves the space.

      [Refrain]
      Nothing to report. Nothing to report.
      Good. Let the green book sleep beneath the lamp all year.
      Let every empty line mean someone reached the lane.

      [Verse 3]
      His wife still works the second siding after midnight.
      She came back on a Monday with her hair pinned high.
      Eleven years have put the closing pen into her hand.
      Each night she checks the seals and writes the quiet words.
      No one watches closely. Everyone can hear the nib.
      The bad page waits three shelves above her shoulder.
      Kindness may be silence. Silence may be something else.

      [Refrain]
      Nothing to report. Nothing to report.
      Good. Let the green book sleep beneath the lamp all year.
      Let every empty line mean someone reached the lane.

      [Final Verse]
      Leave the cover green and leave the columns hungry.
      Let the late crew curse the lamp and hurry through the gate.
      Let the foreman sharpen pencils no one needs tonight.
      Let her close the book before the first tram enters.
      There are prayers too plain for any sacred room:
      one white lamp, one clean page, one ordinary morning,
      and every coat accounted for along the lane.

      [Outro - sustain]
