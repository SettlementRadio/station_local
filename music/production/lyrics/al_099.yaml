  - id: s_0819
    title: Lights Out on the Line
    track_number: 11
    mood: [final, warm, slow]
    fact: >-
      The only tune the band recorded twice; the first attempt was wiped at Nan Sudell's insistence
      and this is the second, cut an hour later.
    arrangement_note: this is the tired take rather than the pleased one, and it is slower and further back than anything else on the record because the band had already played it once that night
    intro: 14
    outro: sustain
    target_duration: "4:00"
    prompt: >-
      74 BPM tired warm blues; smoky contralto, long slide, piano, bass, brushes, hard room, held end.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, sticks or hard drumming, bright or lifted lead vocal, cold ending, fade-out
    lyrics: |
      [Intro - slide and piano, fourteen seconds]

      [Verse 1]
      The last car leaves the siding with three windows lit.
      We watch it from the canteen while the gate clock loses colour.
      Your bag is by the airlock; mine is underneath the chair.
      We tried goodbye at eleven and it sounded much too certain.
      Now midnight gives us tired words with room to bend.
      Outside, the lane lamps darken one by one.
      Inside, neither one of us can make the first move.

      [Chorus]
      Lights out on the line, and the last car off the siding,
      first shift waiting somewhere past the relay glow.
      Stay until the room goes dark, then take the long lane home.

      [Verse 2]
      Once we left this room believing love was finished,
      walked three streets apart and slept with every lamp alive.
      Morning made us proud enough to call the silence peace.
      Evening found your coat again across the same old chair.
      Tired people cannot keep a perfect ending straight.
      One hand reaches for a cup; the other lets it stay.
      Mercy enters softly when conviction goes off shift.

      [Chorus]
      Lights out on the line, and the last car off the siding,
      first shift waiting somewhere past the relay glow.
      Stay until the room goes dark, then take the long lane home.

      [Verse 3]
      Three years later, money draws its line between us,
      one disputed sum, two versions no account can join.
      You take the north-block room and half the ration credit.
      I keep the cups and Wednesday by the canteen wall.
      Still, when anger makes me hurry toward a clean conclusion,
      I hear your tired voice asking for another hour.
      Some good advice survives the person who has gone.

      [Final Chorus]
      Lights out on the line, and the last car off the siding,
      first shift waiting somewhere past the relay glow.
      Stay until the room goes dark. I will take the long lane home.

      [Coda - sustain, slide held]
