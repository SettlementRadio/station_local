  - id: s_0811
    title: Ask Me Again on Payday
    track_number: 3
    mood: [dry, rolling, wry]
    fact: >-
      Written across two pay weeks, and the second verse names the exact sum the band was paid for
      these sessions.
    arrangement_note: the second verse is a sum read out in a song and the band drop to piano and brushes under it so the number is the only thing in the room
    intro: 7
    outro: cold
    target_duration: "3:30"
    prompt: >-
      98 BPM rolling blues; smoky contralto, slide, piano, bass, brushes, bare second verse, cold stop.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, sticks or hard drumming, fade-out
    lyrics: |
      [Intro - piano, seven seconds]

      [Verse 1]
      You brought the housing form on Tuesday after late shift,
      two rooms at the terrace end, one wage against the bond.
      Tuesday had my ration light on amber in the cupboard.
      Tuesday had the lane wind working through my only coat.
      I loved you just as much as I could manage on a Tuesday,
      which is not the kind of answer any form can hold.
      Put the pen away and bring the question back on Friday.

      [Refrain]
      Ask me again on payday and you will get a different answer.
      Ask me anything at all on a Friday and I will say yes.
      I am a braver woman with a week's wage in my coat.

      [Verse 2]
      Eleven and six came through the pay slot Friday morning.
      Four ways, room hire, then the debt against the urn.
      Two hot meals, one relay charge, a week of clean air credit,
      and enough to make the housing bond look almost like a door.
      I wrote the total on my wrist before the figures vanished.
      Money has a gift for leaving while you look at it.
      Still, the ink was there when you came down the siding.

      [Refrain]
      Ask me again on payday and you will get a different answer.
      Ask me anything at all on a Friday and I will say yes.
      I am a braver woman with a week's wage in my coat.

      [Verse 3]
      Friday I signed slowly where the two names had to meet.
      Not because the rooms were better or the work less thin,
      not because a number made the sealed season disappear.
      Friday only gave my hope a chair to sit upon.
      Tuesday keeps the books; Friday opens up the door.
      Both of them are honest, both are living in my coat,
      and both will walk beside you when the next deduction comes.

      [Refrain]
      Ask me again on payday and you will get a different answer.
      Ask me anything at all on a Friday and I will say yes.
      I am a braver woman with a week's wage in my coat.

      [Coda - cold stop]
