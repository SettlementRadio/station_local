  - id: s_0814
    title: Two Streets Over
    track_number: 6
    mood: [warm, midtempo, fond]
    fact: >-
      About somebody who lived two streets from the canteen for nine years, and Wesla Tarn has always
      refused to say whether they ever met.
    arrangement_note: the bridge is two words and a line and the band stop dead underneath it, which is the only silence on the record and is where the song declines to answer the question it has raised
    intro: 10
    outro: fade
    target_duration: "3:45"
    prompt: >-
      96 BPM warm blues; smoky contralto, slide, piano, bass, brushes, full-band pause, room fade.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, sticks or hard drumming, cold ending
    lyrics: |
      [Intro - slide and piano, ten seconds]

      [Verse 1]
      Nine years and two streets away is the whole of the story.
      I know which window catches the late relay glow.
      I know which stair. I know the dark coat on the rail.
      I know what time the light goes on and what time it goes out.
      I know the sealed-season week the curtain changed to blue.
      I have never been up that stair and I am not going to say
      whether that is because I could not or because I did not.

      [Chorus]
      Two streets away, nine years, and a lane between.
      That is not far. That is not far at all.
      I have walked further than that for a cup of tea.

      [Verse 2]
      The canteen keeps its stories warmer than its tea.
      Mine travels down the tables every time a new shift starts.
      Some tell it kindly. Some improve the final turn.
      Some place my hand upon a door I never touched.
      No one asks what wanting does when wanting has an address,
      or how a lane can widen when one crossing matters most.

      [Chorus]
      Two streets away, nine years, and a lane between.
      That is not far. That is not far at all.
      I have walked further than that for a cup of tea.

      [Bridge]
      Two streets.
      Two streets, and I have made a life on the near one.

      [Verse 3]
      There is a way of having a thing by not going and getting it.
      It is not better and it is not braver and it is not a choice.
      It is the cup kept warm, the stair left untested,
      nine years of relay weather whitening the window,
      two streets held between the first shift and the last.
      Ask if we ever met. I will ask which answer helps you.
      Then I will walk the near lane home as usual.

      [Chorus]
      Two streets away, nine years, and a lane between.
      That is not far. That is not far at all.
      I have walked further than that for a cup of tea.

      [Outro - fade]
