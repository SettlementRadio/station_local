  - id: s_0809
    title: Later Than Advertised
    track_number: 1
    mood: [shuffling, wry, brisk]
    fact: >-
      Named for the band's habit of starting an hour after the notice said, and the notice from 2617
      is reproduced on the sleeve.
    arrangement_note: the band come in one instrument at a time over the first six seconds rather than together, which is the joke in the title played rather than sung
    intro: 6
    outro: fade
    target_duration: "3:35"
    prompt: >-
      106 BPM dry blues; smoky contralto, slide, piano, bass, brushes, staggered entry, room fade.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, sticks or hard drumming, cold ending
    lyrics: |
      [Intro - piano and brushes, six seconds]

      [Verse 1]
      The notice said eight o'clock and the notice always does.
      Somebody types it up and pins it on the canteen door
      and nobody who has ever been here reads it as a time.
      Eight is when the urn goes on and Amon finds his stool.
      Half past is the tables and the lamp and the long argument.
      Nine is when we play, or half past, or whenever Del arrives.

      [Chorus]
      We are later than advertised. We have always been later.
      If you came at eight you have an hour and a cup,
      and there is nothing down this lane worth being early for.

      [Verse 2]
      There was a man from the Mars house came to hear us once
      with a watch and a coat and an appointment after ours.
      He stood in the doorway at eight and was still there at nine,
      and by the second song he had his coat over a chair.
      He bought the record off us and pressed four hundred copies.

      [Chorus]
      We are later than advertised. We have always been later.
      If you came at eight you have an hour and a cup,
      and there is nothing down this lane worth being early for.

      [Verse 3]
      The works runs to the minute and it has to and it does.
      Two thousand people move on a bell and nobody is late.
      Nobody is late twice. That is the whole of the arrangement.
      So we have one room on this whole siding where a clock
      is a piece of paper on a door and nothing more than that,
      and I would give up a good deal before I gave that up.

      [Final Chorus]
      We are later than advertised. We will be later still.
      If you came at eight you have an hour and a cup,
      and if you wanted a band that starts on time, there is the works.

      [Outro - fade]
