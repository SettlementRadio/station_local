  - id: s_0815
    title: Small Money, Loud Room
    track_number: 7
    mood: [brisk, defiant, hard]
    fact: >-
      The band's first attempt was faster and Amon Furlow talked them down to this tempo, which he
      can be heard doing at the top of the take.
    arrangement_note: one man's voice at the top of the take saying four words and the band settling to a slower count behind him, left on the record because it is the only reason the take works
    intro: 4
    outro: cold
    target_duration: "3:20"
    prompt: >-
      104 BPM hard blues; smoky contralto, slide, piano, bass, brushes, male count-in, cold stop.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, sung second lead, modern studio production, sticks or hard drumming, fade-out
    lyrics: |
      [Intro - piano, four seconds]

      [Count-in - one man's voice, not sung]
      Slower. Slower than that. There. Now.

      [Verse 1]
      Friday put a narrow wage into my pocket,
      deductions taking bites before it reached my hand.
      Enough for one good shirt or one loud night beneath it,
      not enough for both, so I wore the old one clean.
      The canteen door was shaking with the end-shift crowd.
      Brush past the keeper, hide the ration card, go in.
      A little money hates to spend the evening by itself.

      [Chorus]
      Small money in a loud room, make it last till two.
      Nobody down this lane gets rich by holding back.
      If tomorrow wants an answer, tomorrow knows the door.

      [Verse 2]
      You were standing by the urn with both hands empty,
      watching every faster pair collide against the tables.
      When the room eased back, you crossed the floor in time,
      asked for nothing larger than the length of one slow turn.
      Your coat smelled of the machine oil from the western bay.
      Mine smelled of cheap soap and the storm outside.
      We had exactly what the other one could spend.

      [Chorus]
      Small money in a loud room, make it last till two.
      Nobody down this lane gets rich by holding back.
      If tomorrow wants an answer, tomorrow knows the door.

      [Verse 3]
      At two the relay clock went pale above the counter.
      Fare money gone, first shift waiting, terrace three lanes north.
      You offered half your last warm ration for the walk.
      I offered every story I had saved from you till then.
      Dawn found us laughing by the locked transfer hall,
      richer by no measure any pay clerk would accept.
      Some nights cost little and refuse to become small.

      [Final Chorus]
      Small money in a loud room, gone before the light.
      Nobody down this lane gets rich by holding back.
      Tomorrow has its answer. Tonight has spent us well.

      [Outro - cold stop]
