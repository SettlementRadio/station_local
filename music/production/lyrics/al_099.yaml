  room: >-
    The same tram works canteen on Mars as al_098, cut five years earlier and held down by the
    machine shop next door, which was on a night run for the whole week. One live room, no overdubs,
    the steel-bar slide loudest after the voice. The card holds: low smoky female contralto behind
    the beat, bending the last note of a line down, and one male second voice from the bass chair
    answering the last line of a verse. Three things are this record's own. Nan Sudell plays brushes
    rather than sticks on all eleven, which is the sound of the whole record and is a fact about the
    shop next door rather than a choice. Tel Brask guests on harmonica on s_0812 and takes the only
    instrumental passage on the record. Del Marran takes the lead on the second verse of s_0818 and
    nowhere else in the band's life. s_0813 is sung without the slide at all, which happens nowhere
    else on either record, and s_0817 has the works generator running under it from end to end.

