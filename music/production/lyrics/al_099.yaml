  - id: s_0810
    title: Half the Fare Home
    track_number: 2
    mood: [midtempo, plain, tired]
    fact: >-
      Nan Sudell plays the whole track with brushes because the machine shop next door was on a
      night run and the band could not be louder than it.
    arrangement_note: the machine shop next door is under the second verse and nothing was done about it, which is why the whole band is playing under its own volume for four minutes
    intro: 9
    outro: fade
    target_duration: "3:40"
    prompt: >-
      92 BPM hushed blues; smoky contralto, slide, piano, bass, brushes, faint machinery, fade.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, sticks or hard drumming, loud dynamics, cold ending
    lyrics: |
      [Intro - brushed kit and bass, nine seconds]

      [Verse 1]
      My wage card cleared at midnight with the old deduction,
      room, ration, heat and the advance from last sealed season.
      Enough remained for one full fare or supper split in two.
      You were at the late gate with your collar turned against it,
      saying walking was no trouble if the storm stayed down.
      We bought the soup and watched the final tram go empty.
      Pride is warm for half a mile and useless after that.

      [Chorus]
      I have got half of what it costs to get home,
      and the rest of it is a walk, and the walk is long,
      but your hand is in my pocket and the lane is wide enough.

      [Verse 2]
      The machine shop shook the shutter on the lower lane.
      Night crews crossed behind the glass in pale work coats.
      We kept our voices low where the pressure doors were sleeping,
      traded one bad joke until it lasted three whole streets.
      At every tram stop you could still have changed your mind.
      At every tram stop I pretended not to count.
      Hunger makes accountants of the tenderest people.

      [Chorus]
      I have got half of what it costs to get home,
      and the rest of it is a walk, and the walk is long,
      but your hand is in my pocket and the lane is wide enough.

      [Verse 3]
      At the terrace airlock, dawn was silver on the seals.
      Your block turned left; mine kept along the works wall.
      We stood where one more minute meant a colder breakfast,
      both too tired to turn a cheap night into anything grand.
      You pressed tomorrow's fare card into my working hand.
      I said I would repay it. You said, not in money.
      The first shift bell went through us before we moved.

      [Final Refrain]
      I have got half of what it costs to get home,
      and the rest of it is a walk, and the walk is long,
      and tomorrow there are two of us who know the way.

      [Outro - fade]
