    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, blended or studio crowd vocals, drum machines, vocal tuning, whispered or rapped sections, modern studio production, sticks or hard drumming, cold ending
    lyrics: |
      [Intro - full band, three seconds]

      [Verse 1]
      Thursday morning finds him waiting by the airlock,
      keys enough to close each room along the lane.
      The title never leaves his careful working mouth.
      His eyes stay on the floor; one boot worries at the seam.
      A favour hangs between us, wearing orders like a coat.
      By evening every table knows which tune he means.
      By evening every chair is taken facing forward.

      [Chorus]
      Do not sing that one here (do not sing that one here),
      says the ring of keys that owns the lower lane.
      The room keeps one reply behind its teeth: sing it.

      [Call - the room answering the lead, ragged]
      Do not sing it. Do not sing it. Sing it.

      [Verse 2]
      The forbidden verse concerns a missing ration manifest,
      six sealed crates, one signature, an office staying warm.
      No foreman has a name in it; no district has a number.
      Still every desk along the works can hear its own drawer close.
      A guilty person always thinks the mirror is a window.
      An honest person laughs and asks to hear the line again.
      Tonight the canteen laughs before the first line ends.

      [Chorus]
      Do not sing that one here (do not sing that one here),
      says the ring of keys that owns the lower lane.
      The room keeps one reply behind its teeth: sing it.

      [Verse 3]
      All sealed season, workers crowd the doorway early,
      coats still dusted from the siding, cards not clocked away.
      The keys remain upstairs; their owner stays behind them.
      Yet once, beyond the glass, a shoulder keeps the beat.
      No pardon comes, no threat, no brave conversion.
      Only one gloved hand that will not quite lie still.
      Sometimes that is all the truth a hard room gets.

      [Final Chorus]
      Do not sing that one here (do not sing that one here),
      says the ring of keys that owns the lower lane.
      The room has held its answer all year long: sing it.

      [Outro - fade]
