  - id: s_0817
    title: Under the Terrace
    track_number: 9
    mood: [slow, close, late]
    fact: >-
      Recorded at four in the morning after a shift, and the works generator runs underneath the
      whole track.
    arrangement_note: the works generator is a single low note under the entire track and the piano is tuned to it, which is a thing Amon Furlow started doing years before anybody recorded it
    intro: 18
    outro: sustain
    target_duration: "4:15"
    prompt: >-
      68 BPM slow blues; tired smoky contralto, generator hum, piano, slide, bass, brushes, held end.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, sticks or hard drumming, ambient drone pad, cold ending, fade-out
    lyrics: |
      [Intro - piano and generator hum, eighteen seconds]

      [Verse 1]
      Four in the morning, eight hours beyond the shift,
      the generator holds one note beneath the floor.
      It follows through the canteen and the empty locker room,
      through the lower airlock, through the soles of both my shoes.
      The relay mast goes quiet; the terrace windows darken.
      Still that low note carries every sleeping wall.
      I take the long lane home and hear it coming with me.

      [Refrain]
      Down here below the terrace there is one long note.
      Everything anybody plays is played on top of it.
      The works keeps breathing whether we are brave or not.

      [Verse 2]
      You sleep three floors above it with the ration light on red,
      one hand beneath the pillow, one across my empty side.
      I promised I would finish before the night crews changed.
      The night crews changed; the first tram crossed the siding.
      I stood below our window, too tired to climb the stair,
      feeling your life overhead and iron under mine,
      two kinds of weight that somehow keep me standing.

      [Refrain]
      Down here below the terrace there is one long note.
      Everything anybody plays is played on top of it.
      The works keeps breathing whether we are brave or not.

      [Verse 3]
      Some morning we will take a room beyond the works,
      where silence does not tremble in the water cup.
      You say the quiet may be worse once we can hear ourselves.
      I say we will bring one chair from here to make it ours.
      Neither one believes the lane will let us go so cleanly.
      Even in that distant room, when every machine sleeps,
      my body may supply the note it learned beneath the terrace.

      [Refrain]
      Down here below the terrace there is one long note.
      Everything anybody plays is played on top of it.
      The works keeps breathing whether we are brave or not.

      [Outro - sustain, generator]
