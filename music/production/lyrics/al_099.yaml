  - id: s_0812
    title: Wrong Side of the Works
    track_number: 4
    mood: [driving, hard, blunt]
    fact: >-
      Tel Brask plays harmonica, the only person from outside the band on any of their records, and
      he had never heard the song before that night.
    arrangement_note: twelve seconds of harmonica from a man who had never heard the tune, played straight through as if he had written it, and it is the only instrumental passage on this record
    intro: 5
    outro: cold
    target_duration: "3:25"
    prompt: >-
      110 BPM hard blues; smoky contralto, slide, piano, bass, brushes, 12-second harmonica, cold stop.
    exclude: electric bass, synthesizers, brass, orchestral strings, stacked backing harmony, drum machines, vocal tuning, whispered or rapped sections, modern studio production, sticks or hard drumming, amplified harmonica, fade-out
    lyrics: |
      [Intro - full band, five seconds]

      [Verse 1]
      She sleeps above the terrace where the air stays warm.
      He works beyond the bulkhead in the cold repair yard.
      Between them stands the works with every gate on shift time,
      a kilometre of iron pretending to be a world.
      Her neighbours call the yard side hard and temporary.
      His call the terrace soft enough to make a person weak.
      Neither side has met the one it warns its children of.

      [Chorus]
      Wrong side of the wall, wrong side of the wage,
      wrong side of a bell that rings for somebody else.
      Warm is where a waiting hand stays open at the gate.

      [Verse 2]
      One storm night the west airlock lost its closing signal.
      Freight crews crossed the canteen way to reach the lower berth.
      She came down carrying a meal gone cold in paper.
      He came up with metal dust silvering both sleeves.
      They stopped beneath a dead lamp, each surprised to find
      the other side had tired eyes and ordinary shoes.
      The repair bell rang; neither one obeyed it quickly.

      [Instrumental - harmonica, twelve seconds]

      [Chorus]
      Wrong side of the wall, wrong side of the wage,
      wrong side of a bell that rings for somebody else.
      Warm is where a waiting hand stays open at the gate.

      [Verse 3]
      Now she leaves by the terrace door and circles south.
      Now he takes the freight way past the pressure pumps.
      They meet where the broken signal never was repaired,
      share whatever supper either one could spare that week.
      Both districts keep their warnings polished on the wall.
      Both bells still claim a body when the shift comes round.
      Love is not an exit. It is one unlocked crossing.

      [Final Chorus]
      Wrong side of the wall, wrong side of the wage,
      wrong side of a bell that rings for somebody else.
      Warm is where a waiting hand stays open at the gate.

      [Outro - cold stop]
