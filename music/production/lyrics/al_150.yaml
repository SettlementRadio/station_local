    prompt: >-
      48 BPM warm hushed closing slow torch in a large dry hall; low grainy female lead close with a
      small fall at the end of every phrase, upright piano, compact electric keyboards held low,
      upright bass, brushed kit, the last twenty seconds the empty room's own sound with nothing
