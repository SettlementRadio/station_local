    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending, matching the bass tone to the room
    lyrics: |
      [Intro - piano and bass, nine seconds]

      [Verse 1]
      They have taken out the balcony entirely
      and the ceiling is nine feet higher than it was.
      The bar is on the other side. The doors are new.
      I got lost between the stage and the back corridor.
      Everybody says the sound is better now
      and everybody saying it is right.
      It is better. It is plainly, audibly better.
      I stood in it and could not find the room.

      [Verse 2]
      His own bass came apart in the crossing over —
      the cold, the wet, the hold, a bad crate —
      and the hall has one it keeps in its own store
      that a hundred strangers have played and put back.
      It does not match us. You can hear it not matching.
      We could have fixed that and we did not fix it.
      A borrowed instrument in a rebuilt room
      is the most honest thing on this whole record.

      [Refrain]
      They rebuilt it and they did it well.
      They took a room I knew and made it good.
      I am not owed a single splinter of it.
      I would have liked one door to be the same.

      [Verse 3]
      A room is not a building. That is the trouble.
      A room is forty people and a smell.
      You cannot rebuild that and nobody claims to.
      The people are the ones who went away.
      They are out along the relay somewhere, mostly,
      and none of them is coming back for this.
      So it is a fine hall and it is not my hall
      and both of those are true and it is fine,
      and somebody who is twenty in this quarter
      will be standing here in thirty years and grieving.

      [Refrain]
      They rebuilt it and they did it well.
      They took a room I knew and made it good.
      I am not owed a single splinter of it.
      I would have liked one door to be the same.

      [Outro - bass last, fading]
