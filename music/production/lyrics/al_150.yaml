    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - piano alone, sixteen seconds]

      [Verse 1]
      Leave the lamps above the balcony burning.
      Leave the low ones underneath the rail.
      We have had enough of rooms deciding
      when a face becomes too dark to read.
      All sealed season, endings came like failures:
      one switch falling, coats against the cold.
      Tonight, let the final sound grow smaller
      without making everyone disappear.
      Let people see the moment after parting,
      when nobody yet knows which way to move.

      [Verse 2]
      When the last line ended, light stayed level.
      Four hundred people looked from row to row.
      Someone laughed, then covered up their laughter.
      Someone reached for someone else's coat.
      A woman near the front had tears in both eyes.
      She did not turn or wipe them from her face.
      Nothing asked her sorrow to become private.
      Nothing hurried anyone from the place.
      The bright room held the pause without an answer.

      [Chorus]
      Leave it lit. Leave the whole room lit.
      Nobody has to be anywhere at all.
      There is no last ferry from a room like this one.
      There is only the front door, and it is open.

      [Verse 3]
      The keeper waited quietly by the doorway.
      He had a family sleeping up the lane.
      Still, he let the room release us slowly,
      one pair, one coat, one unfinished name.
      Some went down to catch the harbour crossing.
      Some stood talking till the relay lamps went pale.
      The woman with the tears left with a stranger.
      He held the door and did not watch them go.
      On the storm coast, darkness comes by weather.
      Here, for once, we chose it for ourselves.

      [Final Chorus]
      Leave it lit. Leave the whole room lit.
      Nobody has to be anywhere at all.
      There is no last ferry from a room like this one.
      There is only the front door, and it is open.

      [Coda - instruments thinning away]

      [Outro - empty hall sound only, twenty seconds, sustaining]
