      This is Borrowed Against Us under another title, re-recorded because every play of the 2612
      version pays the two claimants who hold the Coldwater Court catalogue.
    arrangement_note: the same tune as the 2612 recording at a slower tempo, with the list verse shortened because it is being remembered rather than read
    intro: 7
    outro: cold
    target_duration: "4:05"
    prompt: >-
      46 BPM bruised spare slow torch in a large dry hall; low grainy female lead close and plain,
      one section sung flat and strictly in time over upright bass alone, upright piano, brushed kit,
      hard cold stop.
    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, fade ending
    lyrics: |
      [Intro - bass and piano, seven seconds]

      [Verse 1]
      I have sung this before under another name
      and if you know it, you know it, and you do.
      Twelve years ago, in a room forty feet across,
      three weeks before the whole arrangement fell,
      in a quarter of the core that had one house in it
      and has had none at all since that same spring.
      Every time that version gets a play
      the money goes to two men in an argument
      who never heard it made and do not want it
      and cannot agree which of them is owed.

      [Verse 2]
      The lease. The plant account. The masters.
      The unsold. The two presses. The whole name.
      That is six of eleven and I have lost the rest,
      which I did not expect and do not mind.
      A list you read four minutes in an office
      does not stay. What stays is the eleventh line.
      The eleventh line was me, and it is still me,
      and it is the only one I can still say.
      I have tried to get the others back for years.
      They are gone the way a room goes. All at once.

      [Refrain]
      New name, same song, and the tune has not moved.
      Slower, because I am, and because it wants it.
      Whatever this pays, it pays the four of us,
      and that is the entire reason it exists.

      [Verse 3]
      It is not a better version. I will say that.
      The first one had the cold of the actual week in it
      and this one has twelve years of thinking about it,
      which is not the same and is not worth as much.
      But that one is in a shed behind a lock
      and this one goes out up the relay road on Thursday,
      and a song that nobody can play is not a song,
      and I would rather have the worse one in the world.

      [Outro - cold stop]
