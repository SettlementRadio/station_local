    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - piano and kit, five seconds]

      [Verse 1]
      The hall reopened and the whole trade booked it,
      every house in the settled worlds, in a queue.
      Ours put its money in a wet hall up the storm coast
      and said in print that it would do it twice.
      I am not going to argue with that choice.
      The wet room is where we have made our living.
      But the hall reopened once and only once
      and I was not going to hear about it after.

      [Verse 2]
      So it came out of a season. That is the sum.
      Forty nights of hall work on the coast,
      the cheap crossing, four of us in one room,
      and a fee that took the whole of it and more.
      Nobody lent us anything. Nobody offered.
      That is not bitterness, that is the ledger.
      A house is not a friend and never says it is
      and this one paid for the sleeve, and it is a good sleeve.

      [Chorus]
      We paid the whole of it ourselves, and would again.
      Put that on the back of it in full.
      Whoever wants the room can have the room
      for the price of everything you made last year.

      [Instrumental - upright piano break, fourteen seconds]

      [Verse 3]
      There were four hundred in and it was dry
      and the sound went up and did not come back wet
      and I have never in my life heard my own voice
      arrive at the far wall and stop there properly.
      Worth it. Worth the season. Worth the crossing.
      I would not have believed a room could do that.
      And the cargo went back light and we went with it
      and the coast had rained the whole time we were gone.

      [Chorus]
      We paid the whole of it ourselves, and would again.
      Put that on the back of it in full.
      Whoever wants the room can have the room
      for the price of everything you made last year.

      [Outro - kit and piano, fading]
