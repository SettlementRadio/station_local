    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - piano alone, sixteen seconds]

      [Verse 1]
      We asked him if he'd leave the lamps up after.
      It is not what a hall does at the end.
      A hall goes dark. That is how a hall says finished.
      The lamps come up on the seats and then go down.
      He said he would have to stay on if we did,
      an hour more than he is paid to be there,
      and then he said all right, and that was all of it,
      and his name is on the sleeve of this for that.

      [Verse 2]
      So the song ends and nothing else happens.
      No lights. No door. No coats. No going home.
      Four hundred people sitting in a bright room
      with nothing to look at but each other's faces.
      It went on longer than we thought it would.
      Somebody laughed at about the forty-second mark.
      Then it was fine, and then it was very good,
      and then people got up when they wanted to.

      [Chorus]
      Leave it lit. Leave the whole room lit.
      Nobody has to be anywhere at all.
      There is no last ferry from a room like this one.
      There is only the front door, and it is open.

      [Verse 3]
      I have played four hundred closings on the storm coast
      and every one of them went out at the end,
      because the season seals and the halls are cold
      and a keeper has a family and a bed.
      This one had a man who had an hour spare
      and gave it, and is named, and did not ask.
      That is the last thing on the record, and it is his,
      and it is the only credit that I fought for.

      [Chorus]
      Leave it lit. Leave the whole room lit.
      Nobody has to be anywhere at all.
      There is no last ferry from a room like this one.
      There is only the front door, and it is open.

      [Outro - the empty hall's own sound, sustaining]
