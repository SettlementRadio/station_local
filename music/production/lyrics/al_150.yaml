  - id: s_1208
    title: The Quarter Without Me
    track_number: 1
    mood: [aching, cold, slow]
    fact: >-
      Juna Carrow names four rooms in the second verse, all four of which closed between 2617 and 2624.
    arrangement_note: the four names are sung one to a line with the band holding one chord under all four, and nothing moves until the fourth is finished
    intro: 14
    outro: sustain
    target_duration: "4:00"
    prompt: >-
      50 BPM aching cold slow torch in a large dry hall; low grainy female lead close with air in the
      tone, the band holding a single chord under one whole section, upright piano, upright bass,
      brushed kit, sustained ending.
    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - piano and bass, fourteen seconds]

      [Verse 1]
      I walked the quarter twice before the rain came,
      down the narrow lane and round the water stairs.
      Seven years had moved the doors between us,
      lifted every sign I thought would still be there.
      The bread shop kept its flour on the windows.
      The owner had a daughter at the till.
      She knew my face from somewhere she could not place it.
      I let her give me change and hold it still.
      Every turning opened like a question.
      Every answer belonged to someone else.

      [Verse 2 - one held chord; each room name on one line]
      The Anchor Stair has washing in the windows.
      The Low Room has no doorway anymore.
      The Waterhouse holds offices and silence.
      The Ropewalk stands shut, salt beneath its door.
      Four rooms held under one unmoving chord.
      Four places where my younger coat still turns.
      I can point to every wall that used to know me.
      Not one wall is required to return.

      [Chorus]
      The quarter without me got on very well.
      The quarter without me did not stop.
      Lane lights changed and other windows opened.
      I would not have waited. Nobody should.

      [Verse 3]
      The flower woman still keeps the corner.
      She bound a yellow bunch in weather paper.
      She did not know me, had no cause to know me,
      only said the rain would start by four.
      I nearly told her who I had been there.
      I nearly asked which faces still came through.
      Instead I held the flowers under shelter
      and watched the first drops darken both my shoes.
      The storm coast waits a nine-day crossing from me.
      For once, I let the old quarter be new.

      [Bridge]
      Going back is not a door reopening.
      It is standing where a missing door has been.
      It is buying flowers from a living stranger
      and carrying them onward through the rain.

      [Final Chorus]
      The quarter without me got on very well.
      The quarter without me did not stop.
      Lane lights changed and other windows opened.
      I would not have waited. Nobody should.

      [Outro - piano sustaining]
