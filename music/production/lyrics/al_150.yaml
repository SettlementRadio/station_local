      band slightly more present than a late-night mix, fade.
    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - piano and kit, five seconds]

      [Verse 1]
      Forty nights along the wet storm coast,
      four coats drying from one narrow rail.
      We kept the early coins beneath the mattress,
      spent the later ones on freight and ferry fare.
      The woman at the desk counted them twice.
      She pushed one small coin back across to me.
      I pushed it toward her. She said, "You will need it."
      I said, "Not for where we mean to be."
      The coin stayed between us like a small moon.
      Outside, last ferry sounded through the rain.

      [Refrain]
      We paid for this ourselves in weather,
      paid in mornings lost along the lane,
      paid in every room we shared too closely.
      Let the dry hall give it back as air.

      [Verse 2]
      We crossed with cargo shifting underneath us,
      slept against our cases in the hold.
      At the Concordance berth the doors stood open,
      and the largest room I knew looked small.
      No wet came down the walls behind the curtains.
      No ceiling sent my breath back as a blur.
      I spoke one line and heard it reach the far side,
      stop against the plaster, clean and sure.

      [Instrumental - upright piano break, fourteen seconds]

      [Verse 3]
      Four hundred bodies warmed the room by midnight.
      I could see the final row breathe in.
      Every tired crossing stood behind me.
      Every narrow bed came forward then.
      When we left, our cargo cases felt lighter.
      The lane was dry, the high lamps turning pale.
      We had no season left and nothing hidden.
      We had heard one voice arrive without a veil.
      Ask me if the cost was fair or foolish.
      I will say the cost was ours to name.

      [Final Refrain]
      We paid for this ourselves in weather,
      paid in mornings lost along the lane,
      paid in every room we shared too closely.
      Let the dry hall give it back as air.

      [Outro - kit and piano, fading]
