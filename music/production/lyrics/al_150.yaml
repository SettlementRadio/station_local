      upright piano, brushed kit, fade.
    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending, matching the bass tone to the room
    lyrics: |
      [Intro - piano and bass, nine seconds]

      [Verse 1]
      They raised the ceiling past the old smoke shadow.
      They moved the bar and widened every door.
      I took the wrong turn by the service corridor,
      found a stair that was not there before.
      The air was warm. The plaster held no water.
      Every distant footstep sounded clear.
      Nothing in the work had been done badly.
      Nothing I remembered waited here.

      [Verse 2]
      She used to take the corner by the railing,
      shoes beneath her chair, coat on her knees.
      Half the quarter knew which drink to bring her.
      She knew when I was frightened by my breathing.
      Someone new stood laughing in that corner,
      young enough to lean across the rail.
      I loved her for not knowing what was missing.
      I hated how the room could make that fair.

      [Refrain]
      They rebuilt it and they did it well.
      They took a room I knew and made it good.
      I am not owed a single splinter of it.
      I would have liked one door to be the same.

      [Bridge]
      Along the relay, people lose each other.
      Buildings only lose the marks we leave.
      A wall is cleaned. A stair is made more useful.
      Nobody has promised it will grieve.

      [Verse 3]
      After last ferry, I walked every aisle,
      touching nothing, naming what had gone:
      salt caught in the curtains, cracked red leather,
      one low lamp that stayed when others failed.
      Then the new lights opened on the clean floor.
      The young woman lifted both her hands.
      For one breath, this room belonged around her.
      I could see how any room begins.
      Thirty years from now she may come looking
      for the railing that she leaned against.

      [Final Refrain]
      They rebuilt it and they did it well.
      They took a room I knew and made it good.
      I am not owed a single splinter of it.
      I would have liked one door to be the same.

      [Outro - bass last, fading]
