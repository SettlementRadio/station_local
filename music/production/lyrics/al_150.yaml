    lyrics: |
      [Intro - piano and keyboards, twelve seconds]

      [Verse 1]
      The bell still goes. They have not moved the water.
      They have moved the bar and the whole east wall
      and the loading door is where the loading door was
      and the bell comes through it twice a night at least.
      Midnight, and then whatever they put on after,
      which in this quarter is the one at half past two.
      Everybody in the building stops for half a beat
      and nobody in the building says they did.

      [Verse 2]
      He answered it. He did not plan to answer it.
      The bell went in the gap after a line
      and there is a brush hit right behind it on the take
      and the two of them agree, exactly, once.
      We heard it back and nobody said anything
      and then somebody said leave it, and we left it.
      It happens twice. It is not the same both times.
      The second one he meant, and you can tell.

      [Chorus]
      Home on the last ferry, back the way I came,
      seven years and a season and a hall.
      Everybody I came out here to find
      is somewhere else and doing very well.

      [Instrumental - upright piano break, thirteen seconds]

      [Verse 3]
      I used to run for it. That is the funny part.
      Every night of my twenties, down that lane,
      and half the time I missed it and walked round
      and the walk was better than the boat and always was.
      Tonight I am inside and it is going
      and I have got nowhere at all that I need to be,
      and the bell is not for me, and I can hear it,
      and that is the best that it has ever been.

      [Chorus]
      Home on the last ferry, back the way I came,
      seven years and a season and a hall.
      Everybody I came out here to find
      is somewhere else and doing very well.

