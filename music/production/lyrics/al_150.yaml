    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, cold ending
    lyrics: |
      [Intro - piano and keyboards, twelve seconds]

      [Verse 1]
      The first bell crossed the room at twelve exactly.
      My whole body turned before my head.
      At twenty, I could hear it through three doorways
      and still arrive while ropes were being led.
      I ran that lane in shoes made slick by weather,
      one hand on my coat, one on the rail.
      Tonight I stood beneath the loading doorway,
      nowhere I must reach and no one left to fail.

      [Chorus]
      Home on the last ferry, back the way I came,
      water black beneath the quarter lights.
      Everyone I thought would wait is elsewhere.
      I can let the bell belong to night.

      [Verse 2]
      Seven years had thinned the names I carried.
      One moved inland. One crossed past the relay.
      One sends a winter greeting without questions.
      One is two streets off and stayed away.
      I used to think return meant being gathered,
      every missing face around one table.
      Now I know a place can take you homeward
      without putting anything back where it was.

      [Instrumental - upright piano break, thirteen seconds]

      [Bridge]
      The second bell came softer through the doorway.
      Rain had started somewhere past the quay.
      No warning in it, nothing I had missed yet,
      only water moving without me.

      [Verse 3]
      I watched the last coats gather in the entrance.
      A young man ran, still fastening one shoe.
      He cleared the corner just as ropes were lifted.
      I knew the breathless joy he thought he knew.
      Once I would have followed without thinking.
      Tonight I let the outer footsteps fade.
      The storm coast waits beyond a longer crossing.
      There is a room for me where I have stayed.
      The ferry moved. Its windows crossed the water.
      For the first time, leaving looked like rest.

      [Final Chorus]
      Home on the last ferry, back the way I came,
      water black beneath the quarter lights.
      Everyone I thought would wait is elsewhere.
      I can let the bell belong to night.

      [Outro - keyboards and piano, fading]
