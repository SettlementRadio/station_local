    target_duration: "4:05"
    prompt: >-
      46 BPM bruised spare slow torch in a large dry hall; low grainy female lead close and plain,
      one section sung flat and strictly in time over upright bass alone, upright piano, brushed kit,
      hard cold stop.
    exclude: backing vocals, saxophone and brass, orchestral strings, guitar, drum machines, four-on-the-floor kick, belted vocals, vocal tuning, whispered or rapped sections, dance and modern studio production, fade ending
    lyrics: |
      [Intro - bass and piano, seven seconds]

      [Verse 1]
      The first low line still enters like a winter,
      twelve years old and colder than this room.
      My breath remembers where it used to shorten.
      My hands remember what came after it.
      Back then, the core lane shone with freezing water.
      Four of us stood close to read one page.
      I thought a debt was something kept in columns.
      I did not know a debt could learn my shape.
      Now the hall is dry and twice as wide,
      but the old cold knows exactly where to wait.

      [Verse 2 - flat, strict time, bass only]
      The lease. The plant account. The masters.
      The unsold. The two presses. The whole name.
      Six remembered lines. The rest went missing.
      I can see the page but not the words.
      What stayed was breath among the listed cargo,
      my living voice made small enough to seize.
      Memory drops the numbers and the margins.
      Memory keeps the hand beside the pen.

      [Refrain]
      Call it by a name the lock has never heard.
      Take it slower down the relay road.
      What they counted once can still be carried.
      What they carried off can still come home.

      [Verse 3]
      This is the same song under a different name.
      The old name sends each play to two claimants.
      One says he owns the shelf, one says the paper,
      neither one can tell you how it felt.
      So I changed the words the years had changed already.
      I left the tune where all four voices know.
      The first held cold from one unfinished winter.
      This holds what survived and learned to move.
      It is not better. Better is not useful.
      It is mine to carry out of here.

      [Bridge]
      Let the locked one sleep beneath its number.
      Let the new one cross the freight-lit dark.
      No one owns the breath between two people.
      No old paper knows where voices are.

      [Final Refrain]
      Call it by a name the lock has never heard.
      Take it slower down the relay road.
      What they counted once can still be carried.
      What they carried off can still come home.

      [Outro - cold stop]
