    lyrics: |
      [Intro - piano and bass, fourteen seconds]

      [Verse 1]
      I walked it for two days before we played.
      Nobody asked me to. Nobody knew.
      Down the stair off the lane and along the water
      and up the other side and round again.
      Seven years is nothing and it is everything.
      The bread shop is a bread shop. That is something.
      The rest of it has turned over twice
      and none of it turned over into me.

      [Verse 2]
      The Anchor Stair is flats. The Low Room's gone.
      The Waterhouse is offices and quiet.
      The Ropewalk's standing, shut, and owned by nobody
      that anybody in the quarter can name.
      Four rooms. That is not an industry collapsing.
      That is four leases and four sets of stairs.
      But I sang in all of them before I left here
      and I cannot get into one of them tonight.

      [Chorus]
      The quarter without me got on very well.
      The quarter without me did not stop.
      I do not know why I thought that it would wait.
      I would not have waited. Nobody waits.

      [Verse 3]
      There is a woman at the corner selling flowers
      who was there when I was twenty and is there.
      She did not know me. There is no reason she would.
      I bought a bunch and did not say a word.
      She wrapped them in the paper she has always used
      and told me it was going to rain by four.
      That is the whole of my return, and it was plenty,
      and the storm coast is a nine-day crossing back,
      and I have got a hall to fill on Thursday
      and about four hundred people who know my name.

      [Chorus]
      The quarter without me got on very well.
      The quarter without me did not stop.
      I do not know why I thought that it would wait.
      I would not have waited. Nobody waits.

      [Outro - piano sustaining]
