# music/plan.yaml — how the 500 playable songs divide (D-044, and RUNBOOK.md step 3).
#
# The authority for every count. Hand-edited; nothing writes to it.
#
# Every number here is arithmetic from constraints already fixed elsewhere:
#   songs per genre  → COMMISSION.md §2
#   labels per genre → COMMISSION.md §4, plus the rule that relay-pop appears on >=4 labels,
#                      lane-rock on >=3 and Frontier Reels on >=3
#   bands per label  → COMMISSION.md §5: every label needs >=3 bands and >=40 playable songs
#                      or its retrospective cannot be made
#
# Totals, checked by tests/unit/test_music.py: 500 songs, 25 bands, every label >=3 bands.
# The same file checks every written genre against the allocation below (`make check`).
#
# --- the re-weight, 2026-08-12 (D-068, D-069) --------------------------------------------------
#
# Deck-talk and pulse-dance keep every band, album and story and stop being pressed: they carry no
# playable songs and no `labels:` block at all. Lane-rock, Frontier Reels, old-system sessions,
# void-lounge and void-ballads grow into the 130 songs they give up.
#
# `owed_to:` marks a genre whose written file does not match the numbers below yet, and names the
# card that closes the gap. While it is there, `make check` does not count that genre against the
# plan — and it goes red if the card it names is marked DONE in MUSIC_TASKS.md, so the marker
# cannot outlive the work. Removing it is part of that card, not a tidy-up afterwards.

labels:
  1: Concordance, prestige
  2: Cold Harbor, frontier
  3: Meridian, dance
  4: Forge, industrial
  5: haulers, co-op
  6: late-club, folded 2612
  7: old-system importer

genres:
  relay-pop:
    title: Relay-pop
    layer_b_bands: 9
    layer_c_figures: 5
    labels:
      - { label: 1, songs: 45, bands: 2 }
      - { label: 3, songs: 20, bands: 1 }
      - { label: 5, songs: 25, bands: 1 }
      - { label: 6, songs: 15, bands: 1 }

  lane-rock:
    title: Lane-rock
    layer_b_bands: 7
    layer_c_figures: 4
    labels:
      - { label: 2, songs: 15, bands: 1 }
      - { label: 4, songs: 50, bands: 2 }
      - { label: 5, songs: 45, bands: 2 }

  deck-talk:
    title: Deck-talk
    layer_b_bands: 10 # 7 written as layer B, plus the 3 crews M-44 brought down
    layer_c_figures: 4
    labels: [] # layer B only (D-068) — every band, album and story stays, nothing is pressed

  frontier-reels:
    title: Frontier Reels
    layer_b_bands: 6
    layer_c_figures: 4
    labels:
      - { label: 2, songs: 45, bands: 2 }
      - { label: 4, songs: 25, bands: 1 }
      - { label: 5, songs: 25, bands: 1 }

  old-system-sessions:
    title: Old-system sessions
    layer_b_bands: 5
    layer_c_figures: 4
    labels:
      - { label: 7, songs: 90, bands: 4 }

  pulse-dance:
    title: Pulse-dance
    layer_b_bands: 7 # 5 written as layer B, plus the 2 bands M-44 brought down
    layer_c_figures: 3
    labels: [] # layer B only (D-068) — the sealed-season records still exist, unpressed

  void-lounge:
    title: Void-lounge
    layer_b_bands: 4
    layer_c_figures: 3
    labels:
      - { label: 3, songs: 25, bands: 2 } # Meridian's layer A after the re-weight (D-068)
      - { label: 6, songs: 30, bands: 2 }

  core-harmonies:
    title: Core Harmonies
    layer_b_bands: 1
    layer_c_figures: 2
    labels:
      - { label: 1, songs: 20, bands: 1 }

  void-ballads:
    title: Void Ballads
    layer_b_bands: 1
    layer_c_figures: 1
    labels:
      - { label: 2, songs: 25, bands: 2 }
