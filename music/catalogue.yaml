artists:
- id: b_001
  name: Measure Kindly
  kind: group
  figure: null
  label: label_1
  settlement: Concordance
  scene: relay-pop
  active_from: 2615
  active_to: 2626
  bio: Measure Kindly formed from four clerks who sang together while checking public-hall accounts in
    2615. Vara Ennel writes direct songs about manners, money, and the point where patience runs out.
    The group moved from strict Synthesist practice to a Localist position in 2622 after discovering that
    the repaired Concordance halls changed the balance of every chorus. They rehearse at lunch, keep written
    votes on arrangements, and discard any part that two members cannot remember the next day.
- id: b_002
  name: Open Parallax
  kind: group
  figure: null
  label: label_1
  settlement: Concordance
  scene: relay-pop
  active_from: 2603
  active_to: 2626
  bio: Open Parallax began as a Purist quartet playing unamplified lunch rooms in Concordance in 2603.
    Sena Quill changes a line whenever an audience sings it more cleanly than she does, so several accepted
    versions differ from the first issues. Studio closures in 2607 pushed the group toward repaired compact
    keyboards, and it has identified as Synthesist since that year. Ivo Cern handles the money, which
    is why the group has survived three expensive disagreements without missing a release.
- id: b_003
  name: Rain Ledger
  kind: group
  figure: null
  label: label_3
  settlement: Meridian storm coast
  scene: relay-pop
  active_from: 2601
  active_to: 2626
  bio: Rain Ledger formed in a storm-coast civic shelter in 2601 and still schedules sessions around the
    local power allotment. Nara Veck writes choruses first and refuses to record a verse until the whole
    group can sing the hook while packing equipment. The band is firmly Synthesist and treats power limits,
    damaged circuits, and compressed rehearsal time as useful arranging rules. Kerr Aven keeps a written
    list of every machine failure and brings the failed sound back on the next record if it can be played
    deliberately.
- id: b_004
  name: Cabin Treaty
  kind: group
  figure: null
  label: label_5
  settlement: freight circuit of the between
  scene: relay-pop
  active_from: 2590
  active_to: 2623
  bio: Cabin Treaty formed after four crew members settled a cabin-allocation dispute by agreeing to sing
    at the next port hall in 2590. Ressa Morn writes about pay, small favors, and relationships conducted
    around shift boards, while the band keeps freight detail as background rather than subject. The group
    began as Purist but adopted a Localist position in 2600 when Cado Veir proved that repaired oxygen
    tanks could be tuned consistently. Every member has a co-operative vote, and two planned tours were
    cancelled because the vote on ticket prices failed.
- id: b_005
  name: Evening Claim
  kind: group
  figure: null
  label: label_6
  settlement: Concordance late-club quarter
  scene: relay-pop
  active_from: 2578
  active_to: 2612
  bio: Evening Claim was the early-evening act at a late-club room in 2578 and made compact harmony songs
    for people who had not decided whether to go home. Mela Jorn records a guide at the piano, then removes
    any phrase that sounds cleverer than the complaint behind it. The group moved from Synthesist to Purist
    practice in 2605 after a royalty audit could not identify the owners of its stored sequence parts.
    Lower Bell Editions folded in 2612 with the band's final account unpaid, and the four members have
    declined every offer to recreate the missing paperwork.
- id: b_006
  name: Pell and Tern
  kind: group
  figure: null
  label: label_1
  settlement: separate relay settlements
  scene: relay-pop
  active_from: 2549
  active_to: 2583
  bio: Adra Pell and Lio Tern recorded apart, passing verses between two settlements until editors could
    assemble the shared performances. Their quarrel over an altered credit remained unresolved, and their
    final shared recording has no spoken introduction.
- id: b_007
  name: Gentle Receipts
  kind: group
  figure: null
  label: label_5
  settlement: freight exchange at Low Span
  scene: relay-pop
  active_from: 2597
  active_to: 2621
  bio: Gentle Receipts made quick harmony songs for co-operative dining rooms and printed every contributor
    on the same line. The group stayed Localist throughout its career and broke up when its three singers
    accepted incompatible route contracts in 2621.
- id: b_008
  name: Ajar Almanac
  kind: group
  figure: null
  label: label_1
  settlement: Concordance archive quarter
  scene: relay-pop
  active_from: 2586
  active_to: 2614
  bio: Ajar Almanac wrote domestic songs with dates, prices, and room numbers left visible in the verses.
    The band argued for Purist recording but hired Synthesist guest players whenever a Civic Lantern deadline
    became expensive.
- id: b_009
  name: Common Lattice
  kind: collective
  figure: null
  label: label_1
  settlement: Concordance west galleries
  scene: relay-pop
  active_from: 2609
  active_to: 2626
  bio: Common Lattice is a nine-singer collective whose lead changes by song while its low female anchor
    remains on every recording. The collective is Localist, rehearses in public galleries, and assigns
    every arrangement by a written draw before the first session.
- id: b_010
  name: Vela Domestic
  kind: group
  figure: null
  label: label_3
  settlement: Meridian inland shelters
  scene: relay-pop
  active_from: 2602
  active_to: 2626
  bio: Vela Domestic pairs one low lead voice with a high answering voice and records arguments from opposite
    ends of the room. The duo is Synthesist but limits every song to equipment that can run through a
    shelter power cut.
- id: b_011
  name: Soft Tariff
  kind: group
  figure: null
  label: label_5
  settlement: Old Span freight market
  scene: relay-pop
  active_from: 2565
  active_to: 2599
  bio: Soft Tariff wrote sweet group refrains around freight-market prices and the private bargains hidden
    behind them. The group claimed Purist discipline, although its brightest release depended on a borrowed
    electronic-string case used as percussion.
- id: b_012
  name: Morrow Parcel
  kind: group
  figure: null
  label: label_1
  settlement: Concordance east sorting halls
  scene: relay-pop
  active_from: 2574
  active_to: 2608
  bio: Morrow Parcel built close group refrains around delayed notes, misdirected gifts, and workplace
    gossip in the east sorting halls. The band changed from Localist to Synthesist in 2583 when a compact
    editing desk let its six singers exchange lead lines without sharing one shift.
- id: b_013
  name: Signal Courtesy
  kind: group
  figure: null
  label: label_3
  settlement: Meridian civic towers
  scene: relay-pop
  active_from: 2606
  active_to: 2626
  bio: Signal Courtesy makes bright split-vocal songs in which one singer always waits for the other's
    full line before answering. The duo is Synthesist and turned that restraint into a public rebuke of
    the overlapping reply records released in 2619.
- id: b_014
  name: Warm Fraction
  kind: group
  figure: null
  label: label_6
  settlement: Concordance late-club quarter
  scene: relay-pop
  active_from: 2580
  active_to: 2612
  bio: Warm Fraction played short early-room sets with a low lead and three soft answering voices. The
    group moved from Synthesist to Purist practice in 2604, then spent 2612 contesting Lower Bell Editions'
    claim to its stored session parts.
- id: b_015
  name: Patient Weather
  kind: group
  figure: null
  label: label_1
  settlement: Concordance north concourse
  scene: relay-pop
  active_from: 2555
  active_to: 2589
  bio: Patient Weather sang slow-building harmony songs about waiting rooms, delayed meals, and affections
    that survived poor timing. Its Purist members refused electronic accompaniment but welcomed new singers
    whenever a former member's work schedule became incompatible.
- id: b_016
  name: Second Hitch
  kind: group
  figure: null
  label: label_2
  settlement: Cold Harbor
  scene: lane-rock
  active_from: 2619
  active_to: 2626
  bio: Second Hitch are four Cold Harbor transfer-shed loaders who started playing in the bay they still
    record in. Wen Arbo writes in the words the crew actually uses on shift and throws out any line he
    would not say out loud at the gate. Harbor Standard offered them a core studio in 2623 and the band
    turned it down twice, which the label now puts on the sleeve. They rehearse after night shift and
    have never played a room they could not walk home from.
- id: b_017
  name: Pipe and Hammer
  kind: group
  figure: null
  label: label_4
  settlement: Forge
  scene: lane-rock
  active_from: 2592
  active_to: 2626
  bio: Pipe and Hammer have played Forge halls since 2592 and are the band the settlement's younger groups
    measure themselves against. Havel Ost sings every take standing, and refuses to record a song the
    band has not already played to a paying room. Saul Ravik left over the amplified pipes in 2612 and
    Ade Prosk has held the bass since. Juno Kerrick tunes the pipes to whatever hall they are in and makes
    the guitars follow, which is why no two of their records sit in the same key.
- id: b_018
  name: Ballast Weather
  kind: group
  figure: null
  label: label_4
  settlement: Forge
  scene: lane-rock
  active_from: 2597
  active_to: 2626
  bio: Ballast Weather have kept the same four players since 2597 and have never taken a break longer
    than a season. Isa Lorne runs the band's money herself and will not sign anything at the table it
    is offered at. Kolm Estry doubles on resonance pipes, which is the only reason Deep Register signed
    a second Forge band at all. They play the same four settlements every year in the same order and have
    said they intend to keep doing so.
- id: b_019
  name: Burn Day Wages
  kind: group
  figure: null
  label: label_5
  settlement: the between
  scene: lane-rock
  active_from: 2596
  active_to: 2626
  bio: Burn Day Wages are a hauler crew who record between runs and have been the Common Wake Cooperative's
    biggest act since 2600. Dov Reyland will not take a decision the co-operative has not voted on, including
    the running order of the records. Una Brack joined as a fifth voice in 2604 and nearly resigned in
    2619 over how backing singers were paid. Every one of their records prints all its players on a single
    line, which was the band's condition for signing.
- id: b_020
  name: Hardline Sundays
  kind: group
  figure: null
  label: label_4
  settlement: Forge
  scene: lane-rock
  active_from: 2549
  active_to: 2583
  bio: Hardline Sundays played Forge's shed halls on two unamplified guitars and were the first lane-rock
    group anyone outside Forge could name. They stopped in 2583 when their singer took a maintenance post
    and turned down every offer to come back.
- id: b_021
  name: Coupling Gear
  kind: group
  figure: null
  label: label_5
  settlement: the between
  scene: lane-rock
  active_from: 2578
  active_to: 2612
  bio: Coupling Gear were a hauler crew who recorded between runs and refused to play any settlement they
    had not delivered to. They ended in 2612 when two members signed contracts on opposite circuits and
    neither would give theirs up.
- id: b_022
  name: Ninth Bay Loud
  kind: group
  figure: null
  label: label_2
  settlement: Cold Harbor
  scene: lane-rock
  active_from: 2588
  active_to: 2619
  bio: Ninth Bay Loud built their sound out of amplified transfer-shed noise and were the first lane-rock
    band Harbor Standard ever signed. They stopped in 2619 when their guitarist was told to stop playing
    and the band refused to continue with a replacement.
- id: b_023
  name: The Slow Hitch
  kind: group
  figure: null
  label: label_4
  settlement: Forge
  scene: lane-rock
  active_from: 2566
  active_to: 2600
  bio: The Slow Hitch played at half the tempo of everyone around them and argued for years that the form
    did not have to be fast. Forge audiences disagreed until they did not, which is the only reason the
    band lasted long enough to be copied.
- id: b_024
  name: Vantage Freight
  kind: collective
  figure: null
  label: label_5
  settlement: the between
  scene: lane-rock
  active_from: 2594
  active_to: 2624
  bio: Vantage Freight were a co-operative band with a rotating line-up who printed every player who ever
    appeared on one of their records. They ended in 2624 when the last founding member left haulage and
    refused to keep the name going without a crew behind it.
- id: b_025
  name: Kettle Row
  kind: group
  figure: null
  label: label_2
  settlement: Cold Harbor
  scene: lane-rock
  active_from: 2600
  active_to: 2626
  bio: Kettle Row write short loud songs about the near frontier and have never issued a record longer
    than half an hour. They play constantly and have turned down every offer to record in the core, which
    Harbor Standard has stopped making.
- id: b_026
  name: Ordinary Loud
  kind: group
  figure: null
  label: label_6
  settlement: Concordance late-club quarter
  scene: lane-rock
  active_from: 2583
  active_to: 2612
  bio: Ordinary Loud were the only lane-rock band Lower Bell Editions ever signed, brought in to give
    a late-club label something to sell in daylight. They folded with the label in 2612 and their second
    record has been caught in the catalogue dispute ever since.
- id: b_027
  name: Read It Back
  kind: group
  figure: null
  label: label_2
  settlement: Cold Harbor
  scene: deck-talk
  active_from: 2609
  active_to: 2626
  bio: Read It Back are four Cold Harbor dockers who started calling shift totals across a transfer bay
    because the posted sheet was too far from the floor to read. Vess Arun and Dob Ferrin trade the verses
    and have never recorded one in a single voice. Ilma Torre builds the percussion out of whatever the
    bay is throwing away that month and refuses to carry an instrument between sessions. Harbor Standard
    signed them in 2611 after a bay supervisor complained about the noise in writing and the complaint
    was read out at a hearing.
- id: b_028
  name: The Long Tally
  kind: group
  figure: null
  label: label_4
  settlement: Forge
  scene: deck-talk
  active_from: 2603
  active_to: 2626
  bio: The Long Tally have called Forge's floor counts since 2603 and are the crew every younger Forge
    crew is measured against. Onn Karvel writes his verses out as a numbered list and crosses off lines
    he cannot say in one breath. Juda Ness left in 2615 over the amplified pipes and has not spoken to
    the crew since, which Deep Register printed on the sleeve without asking. Sudi Farrow sings the hooks
    and is the only member who will take a second take.
- id: b_029
  name: The Wake Count
  kind: group
  figure: null
  label: label_5
  settlement: the between
  scene: deck-talk
  active_from: 2596
  active_to: 2626
  bio: The Wake Count are a hauler crew who record in cargo bays between runs and have never made a record
    in a room they were not working in. Hesta Orlow keeps the running order on the same clipboard she
    uses for the load sheet and has been photographed with both. Alto Renn answered the verses until 2609,
    when he took a berth on a circuit that does not come back, and Pim Calder has answered them since.
    Common Wake Cooperative pays them the same share it pays its loaders, which the crew has said in public
    is the only reason they are still on it.
- id: b_030
  name: Gate Shift Callers
  kind: group
  figure: null
  label: label_2
  settlement: Cold Harbor
  scene: deck-talk
  active_from: 2578
  active_to: 2607
  bio: Gate Shift Callers were the first crew anyone recorded calling a shift total over percussion, and
    they made both their records for a Cold Harbor freight office rather than a label. They stopped in
    2607 when the office was closed and the two callers took posts on opposite sides of the settlement.
    Nera Ostell clerked the relay berth two gates along and has said she learned to hold a long list from
    listening to them through a wall, which is the only thing anybody in Cold Harbor agrees the crew are
    owed.
- id: b_031
  name: Open Ledger
  kind: group
  figure: null
  label: label_5
  settlement: the between
  scene: deck-talk
  active_from: 2586
  active_to: 2612
  bio: Open Ledger were three haulers who called the manifest aloud on every run and started recording
    it because a settlement clerk kept disputing what had been delivered. They stopped in 2612 when their
    lead caller took a shore post and told the co-operative he had run out of lists.
- id: b_032
  name: Struck Metal Union
  kind: collective
  figure: null
  label: label_4
  settlement: Forge
  scene: deck-talk
  active_from: 2590
  active_to: 2619
  bio: Struck Metal Union were a rotating group of Forge floor workers with no fixed line-up, who held
    that anyone who could carry the count could record with them. They ended in 2619 after an argument
    about whether a paid member could be turned away, which nobody would put in writing.
- id: b_033
  name: Corner Bay Crew
  kind: group
  figure: null
  label: label_2
  settlement: Cold Harbor
  scene: deck-talk
  active_from: 2598
  active_to: 2624
  bio: Corner Bay Crew worked the smallest bay in Cold Harbor and built a whole style out of calling quietly,
    because the room they used was too small to shout in. They stopped in 2624 when their percussionist
    was told she could no longer work the docks and the crew declined to replace her.
- id: b_034
  name: Tally and Answer
  kind: group
  figure: null
  label: label_5
  settlement: the between
  scene: deck-talk
  active_from: 2601
  active_to: 2626
  bio: Tally and Answer are two haulers who have recorded nothing but exchanges since 2601 and have never
    put a sung line on a record. They are the crew other crews on the circuits challenge, and they have
    said in public that they have never turned a challenge down.
- id: b_035
  name: Short Rope Crew
  kind: group
  figure: null
  label: label_4
  settlement: Forge
  scene: deck-talk
  active_from: 2605
  active_to: 2626
  bio: Short Rope Crew came out of a Forge apprentice intake and were the first crew Deep Register signed
    off the strength of a hall contest rather than a recording. They record rarely and have said they
    will not release anything they cannot perform in full on the floor they work on.
- id: b_036
  name: Half a Shift
  kind: group
  figure: null
  label: null
  settlement: Cold Harbor
  scene: deck-talk
  active_from: 2610
  active_to: 2626
  bio: Half a Shift have turned down every label that has approached them and press their own records
    in runs of two hundred, which is how the form spread before any label was interested. They are the
    most widely traded deck-talk crew nobody's catalogue lists.
- id: b_037
  name: Wire and Rosin
  kind: group
  figure: null
  label: label_2
  settlement: Cold Harbor
  scene: frontier-reels
  active_from: 2578
  active_to: 2610
  bio: Wire and Rosin played Cold Harbor dance halls for thirty-two years and were the band the settlement
    hired when it wanted a floor filled rather than a concert. Hessa Lund sings and plays fiddle at the
    same time and has never recorded the two parts separately, which is why her takes are short and why
    the band stopped using a click. Arel Tocke built the group's upright bass out of composite drum stock
    in 2578 and repaired the same instrument for the rest of the band's life. Finn Derrow left in 2604
    after an argument about payment for a cancelled run of dances, and Suli Orley took the guitar chair
    without an audition because she already knew every tune from the floor.
- id: b_038
  name: The Foundry Set
  kind: group
  figure: null
  label: label_4
  settlement: Forge
  scene: frontier-reels
  active_from: 2579
  active_to: 2599
  bio: The Foundry Set were four Forge shop workers who played reel tempos underneath the settlement's
    resonance pipes, which nobody had tried before and several people objected to. Dane Verrow sings every
    lead and plays fiddle against Orsa Lipp's pipes, a pairing that is either the best or the worst thing
    about the band depending on who is asked. They rehearsed in a working pipe shop and recorded there
    twice because Deep Register could not book a room with the same reverberation. The band stopped in
    2599 when Bree Hollan took a supervisor's post and refused to keep playing for a wage lower than the
    one she was now paying others.
- id: b_039
  name: Loose Cargo
  kind: group
  figure: null
  label: label_5
  settlement: the between
  scene: frontier-reels
  active_from: 2580
  active_to: 2612
  bio: Loose Cargo were a hauler crew who played the dances at both ends of their own route and joined
    the co-operative in 2584 because it was the only label that would take a band which could not promise
    to be in one place. Wend Amory writes everything and sings it in a register low enough that the co-operative
    twice asked for a higher key and was twice refused. Col Sennet learned fiddle from recordings played
    in a hold and has an unusual bowing hand as a result, which every review mentions and which he says
    is simply how he was taught. They kept working the route the whole time and never once toured without
    cargo.
- id: b_040
  name: Kettle Hall Four
  kind: group
  figure: null
  label: label_2
  settlement: Cold Harbor
  scene: frontier-reels
  active_from: 2551
  active_to: 2585
  bio: Kettle Hall Four played the same Cold Harbor room for thirty-four years and are the earliest frontier
    reel band anyone can produce a recording of. They stopped in 2585 when the hall was converted to storage
    and the fiddle player refused to move to another room.
- id: b_041
  name: The Rope Walk
  kind: group
  figure: null
  label: label_4
  settlement: Forge
  scene: frontier-reels
  active_from: 2570
  active_to: 2600
  bio: The Rope Walk were Forge shop workers who played reels on composite instruments a decade before
    The Foundry Set added pipes to them, and they are the band The Foundry Set were accused of copying.
    They kept working shifts the whole time and never made a record outside the settlement.
- id: b_042
  name: Saltbox Reelers
  kind: group
  figure: null
  label: null
  settlement: Cold Harbor
  scene: frontier-reels
  active_from: 2558
  active_to: 2592
  bio: Saltbox Reelers never signed to anything and pressed both their records themselves out of dance
    takings, which is why so few copies exist and why every one of them is in a different sleeve. They
    played the near frontier settlements that had no hall and set up in whatever room was offered.
- id: b_043
  name: Nine Mile Turn
  kind: group
  figure: null
  label: label_5
  settlement: the between
  scene: frontier-reels
  active_from: 2590
  active_to: 2620
  bio: Nine Mile Turn were the co-operative's second reel band and the one that took the route dances
    after Loose Cargo stopped travelling. They are remembered for playing a single dance that ran eleven
    hours and for never recording anything that fast again.
- id: b_044
  name: The Turning Room
  kind: group
  figure: null
  label: label_2
  settlement: Cold Harbor
  scene: frontier-reels
  active_from: 2596
  active_to: 2626
  bio: The Turning Room are the band Harbor Standard signed to replace Wire and Rosin and have never been
    forgiven for it by anyone who was at the exchange hall in 2583. They play the same halls their predecessors
    did and share them now with Board and Bow, whose singer they asked to join them first.
- id: b_045
  name: The Long Ferry
  kind: group
  figure: null
  label: label_1
  settlement: Concordance
  scene: frontier-reels
  active_from: 2598
  active_to: 2624
  bio: The Long Ferry are the only frontier reel band a core label ever signed, and Concordance signed
    them after a committee decided the form had become respectable enough to hold. They are better regarded
    in the core than on the frontier, where the usual complaint is that nobody in the band has ever worked
    a route.
- id: b_046
  name: Terrace Road Four
  kind: group
  figure: null
  label: label_7
  settlement: Mars
  scene: old-system-sessions
  active_from: 2606
  active_to: 2626
  bio: Terrace Road Four have played the same tram works canteen on Mars every week since 2606 and have
    never played anywhere else for money. Wesla Tarn sings and plays the slide with a length of brake
    shoe off the works floor, which is the sound the band is known for and which she has never replaced.
    All four kept their shifts at the works the whole time, so the sessions happen between shifts and
    every record they have made was cut in the canteen. Nan Sudell left in 2622 over a dispute about who
    was owed what from the first record and Orin Lask took the kit. Asked in 2621 which of the three movements
    they belonged to, Wesla Tarn said she had not heard of any of them and that Mars had arguments of
    its own.
- id: b_047
  name: The Shore Rounds
  kind: group
  figure: null
  label: label_7
  settlement: Titan
  scene: old-system-sessions
  active_from: 2596
  active_to: 2626
  bio: The Shore Rounds work the Titan lake yards and sing the rounds the yards have always sung, four
    voices entering a line apart with the instruments kept underneath. Effa Lomm takes most of the leads
    because she is the one who can be heard across water, and the band has no singer's name on any sleeve
    it controls. They record where they happen to be standing — a hall, a lamp room, a meeting room with
    one microphone — and have refused a studio twice on the grounds that a round needs a room that answers.
    Kell Moray joined two years after the others and asked for the last entrance in the round, which he
    has kept ever since. The band found out in 2616 that the edition sold in the settled worlds was one
    song shorter than theirs, and Bran Teale has raised it in every letter since.
- id: b_048
  name: Undershore Local
  kind: group
  figure: null
  label: label_7
  settlement: Europa
  scene: old-system-sessions
  active_from: 2588
  active_to: 2612
  bio: Undershore Local took their name from the union branch they all belonged to in the Europa under-ice
    works, and they played the canteens of that yard and no others. Hob Venner wrote the words on yard
    paperwork and Saira Dunn arranged everything, including the parts she was not playing. Tel Brask played
    the harmonica through a lamp horn so it would carry down a gallery, which is the band's most copied
    trick and the one thing about them everybody out here can name. They stopped in 2612 when the works
    went to a shift pattern that never put the four of them off duty together, which Marta Ospel has said
    is a stupid way for a band to end and the true one.
- id: b_049
  name: Sandhouse Trio
  kind: group
  figure: null
  label: label_7
  settlement: Mars
  scene: old-system-sessions
  active_from: 2550
  active_to: 2584
  bio: Sandhouse Trio played the terrace rooms of the same Mars district Terrace Road Four came out of,
    thirty years earlier, and are the oldest thing Relay Road Import ever brought down the road. They
    stopped in 2584 when the piano player went blind and refused to be led on to a stage.
- id: b_050
  name: The Bell Yard Rounds
  kind: group
  figure: null
  label: null
  settlement: Earth
  scene: old-system-sessions
  active_from: 2568
  active_to: 2600
  bio: The Bell Yard Rounds sing on Earth itself, in the river yards where the form is generally agreed
    to have started, and are the band every account of the rounds gets round to eventually. Nothing of
    theirs has ever come down the road, so what is known out here is entirely second-hand and the settled
    worlds have argued about the running order of their second record without anybody having heard it.
- id: b_051
  name: The Long Ridge
  kind: group
  figure: null
  label: label_7
  settlement: the Belt
  scene: old-system-sessions
  active_from: 2578
  active_to: 2610
  bio: The Long Ridge were a cutting crew who worked the same Belt rock for eleven years and played the
    shift rooms of everything they were sent to afterwards. Both their records reached the road head and
    neither sold, which the importer has said is the fault of the sleeves and nothing else.
- id: b_052
  name: The Lamp Room Four
  kind: group
  figure: null
  label: null
  settlement: Titan
  scene: old-system-sessions
  active_from: 2590
  active_to: 2619
  bio: The Lamp Room Four sang the same Titan lake yards as the Shore Rounds and are the band the Shore
    Rounds learned half their rounds from, which Effa Lomm says at every opportunity. Nothing of theirs
    was ever imported, because the importer took the younger band instead and has admitted in writing
    that it could only afford one.
- id: b_053
  name: Ring Ferry Trio
  kind: group
  figure: null
  label: label_7
  settlement: Saturn
  scene: old-system-sessions
  active_from: 2596
  active_to: 2624
  bio: Ring Ferry Trio play the Saturn ring ferries themselves, on the crossing, for whoever is aboard,
    and have never once played a room that stayed still. Both their records were imported and both sold
    steadily to people who liked the idea, which the band has said is the least insulting reason anybody
    has given.
- id: b_054
  name: Cordon Hours
  kind: group
  figure: null
  label: label_3
  settlement: Meridian storm coast
  scene: pulse-dance
  active_from: 2603
  active_to: 2626
  bio: Cordon Hours have played the Longwall hall on Meridian's storm coast every sealed season since
    2603 and have never taken a booking that would put them off the coast when it closes. Anje Roul sings
    without a monitor, on the grounds that the hall tells her where the beat is and a monitor only tells
    her where the machine is. Peran Dask builds the bass parts on a rack of repaired sequencers that has
    never left the settlement, cannot be insured, and is carried to the hall by hand. The band has refused
    three times to have a record re-mastered louder for export and Stormline Issue has stopped asking;
    the argument about it is the reason they have not shared a sleeve with Bright Hazard since 2618. Kir
    Adnall ran the machines until 2618 and left over money rather than over any of that, and Wen Prile
    has run them since.
- id: b_055
  name: Bright Hazard
  kind: group
  figure: null
  label: label_3
  settlement: Meridian storm coast
  scene: pulse-dance
  active_from: 2609
  active_to: 2626
  bio: Bright Hazard are two people and a rack of machines in a room above the hazard-board office in
    Bight Row, and they are named after the board's top warning because that is the level at which nobody
    works and everybody dances. Denn Ashery sings everything and writes nothing down; Sela Vint programmes
    everything and writes all of it down, including what Ashery sang, and her session notes are printed
    on the inner sleeve of every record they have made. They build records to travel — cut short, mastered
    loud, and timed so the crate leaves before the coast seals — which is the whole of their quarrel with
    Cordon Hours and has been since 2618. Neither of them has played a sealed season since 2620, because
    they are always off the coast when it starts, and Bight Row has not let them forget it.
- id: b_056
  name: Tidegate Six
  kind: group
  figure: null
  label: label_3
  settlement: Meridian storm coast
  scene: pulse-dance
  active_from: 2596
  active_to: 2620
  bio: Tidegate Six ran the first all-night sealed-season dances on the storm coast, in a tide-gate machine
    room with the pumps still working, and every Meridian band since has played a room they opened. They
    stopped in 2620 when the gate was rebuilt and the room was filled in.
- id: b_057
  name: The Salt Circuit
  kind: group
  figure: null
  label: label_3
  settlement: Meridian storm coast
  scene: pulse-dance
  active_from: 2604
  active_to: 2626
  bio: The Salt Circuit play the small settlements up and down the storm coast rather than the halls,
    forty nights a season, and have never had a record that sold badly or one anybody argued about. Stormline
    Issue keeps them because they cost little and arrive on time, which the house has said in print and
    the band has never minded.
- id: b_058
  name: Perren Vane
  kind: solo
  figure: null
  label: null
  settlement: Meridian storm coast
  scene: pulse-dance
  active_from: 2610
  active_to: 2626
  bio: Perren Vane makes records alone in a decommissioned pump house and gives them away at hall doors,
    which he has done since 2610 and has twice refused money for in writing. Every band on the coast has
    taken something off one of his tapes and about half of them say so.
- id: b_059
  name: Late Bell Set
  kind: group
  figure: null
  label: label_6
  settlement: Concordance late-club quarter
  scene: pulse-dance
  active_from: 2600
  active_to: 2612
  bio: Late Bell Set were a late-club act who turned to the coast's form in 2607 and were the only thing
    Lower Bell Editions signed that year that made the house money. Both their records went into the disputed
    catalogue when it folded in 2612 and neither has been pressed since.
- id: b_060
  name: Vantage Rooms
  kind: group
  figure: null
  label: label_1
  settlement: Concordance
  scene: pulse-dance
  active_from: 2614
  active_to: 2626
  bio: Vantage Rooms are Civic Lantern's answer to the storm coast, formed in Concordance in 2614 by people
    who had heard the records and never been in the halls. They sell well in the core and have played
    Meridian twice, both times to rooms that were polite.
- id: b_061
  name: Turn and Burn
  kind: group
  figure: null
  label: label_5
  settlement: the between
  scene: lane-rock
  active_from: 2607
  active_to: 2626
  bio: Turn and Burn are five haulers on the Common Wake Cooperative's fastest circuit and have never
    spent longer than a turnaround in a port they played. Rhea Molt decides the set on the walk from the
    berth to the hall and has never written one down. They were the first band the co-operative voted
    to buy amplification for, which took three ballots and is still brought up at meetings. Burn Day Wages
    and Turn and Burn are the co-operative's two lane-rock bands and have not agreed about anything since
    2619.
- id: b_062
  name: Board and Bow
  kind: group
  figure: null
  label: label_2
  settlement: Cold Harbor
  scene: frontier-reels
  active_from: 2612
  active_to: 2626
  bio: Board and Bow are the band Suli Orley put together in Cold Harbor after Wire and Rosin stopped,
    and three of the five had never been paid to play before she asked them. Orley sings the lead now,
    having spent six years singing harmony behind Hessa Lund, and she still takes tunes off the floor
    rather than off anybody's paper. Alis Doone calls the figures over the top of the band on every record
    they have made, which older callers say is the wrong way round and which the dancers decided for them.
    They will not play a hall that charges the floor more than it pays the band, and have turned down
    the Cold Harbor exchange hall twice over exactly that.
- id: b_063
  name: The Ninefoot Cut
  kind: group
  figure: null
  label: label_7
  settlement: Earth
  scene: old-system-sessions
  active_from: 2598
  active_to: 2626
  bio: The Ninefoot Cut work the locks and the lighters on the eleven miles of Earth canal the band is
    named after, and play the lock houses and wharf rooms along it and nowhere else. Fenna Crole writes
    almost everything and has kept the same guitar since 2598, on the grounds that a new one would want
    playing differently. Aldis Merrow has recorded every song sitting on the same folding stool, which
    is carried out of the lock house to whichever room the band is working in. They learned that their
    first record was on sale in the settled worlds two years after it went on sale there, and Torr Bexley's
    first question was whether anybody out there had been paid for it. They have never played the river
    yards the form is agreed to have started in, and Crole has written twice that they have never claimed
    to.
- id: b_064
  name: After the Ferry
  kind: group
  figure: null
  label: label_6
  settlement: Concordance late-club quarter
  scene: void-lounge
  active_from: 2594
  active_to: 2626
  bio: After the Ferry have played the Lower Bell room three nights a week since 2594 and have never held
    a booking anywhere else in the quarter. Nesta Vire sings low and quietly enough that the room has
    to stop talking, which is a working method rather than a style, and she learned it from a room that
    would not. Ollan Beke writes at the room's own piano between the last ferry and the first, and the
    band's arrangements are what four people can carry up a stair. They have made no record since 2612,
    because everything they own is in the receiver's room with the rest of the house, and they play the
    same three nights anyway. Tarrin Meel keeps the band's accounts in the same book he kept them in when
    the house was paying.
- id: b_065
  name: Coldwater Court
  kind: group
  figure: null
  label: label_6
  settlement: Concordance late-club quarter
  scene: void-lounge
  active_from: 2578
  active_to: 2612
  bio: Coldwater Court played the Lower Bell room for eleven years before Maro Deyn founded a house to
    press it, and they are the reason there is a house at all. Bela Runn sang the first twenty-six years
    and stopped in 2604 over a set of accounts she asked to see twice; Juna Carrow replaced her the following
    year and was told to sing it her own way, which she did not do for two years. Toben Alt has never
    played a song faster than the first time he played it, and the band's whole tempo is his. They made
    one record in 2594 and nothing else until 2612, because Deyn was running the house and would not book
    his own band ahead of anybody he had signed.
- id: b_066
  name: The Quiet Half
  kind: group
  figure: null
  label: label_3
  settlement: Meridian storm coast
  scene: void-lounge
  active_from: 2617
  active_to: 2626
  bio: The Quiet Half formed on Meridian's storm coast in 2617, four months after Juna Carrow took a hall
    job out there and the season sealed with her on the wrong side of it. They play the hour after the
    dancing stops, in halls built for the opposite, and Dessa Roan sets every tempo at half whatever was
    going on before them. Carrow will not sing anything from the Coldwater Court records on stage, because
    every play of them pays the two claimants who hold that catalogue, and she says so from the stage
    often enough that the coast is bored of it. Ivor Sanne came off a hauler and had never heard the form
    before he joined; he learned it off the records Carrow cannot get back, which she lent him and asked
    for back the same week.
- id: b_067
  name: Nine Lamps
  kind: group
  figure: null
  label: label_3
  settlement: Meridian storm coast
  scene: void-lounge
  active_from: 2614
  active_to: 2626
  bio: Nine Lamps are named for the nine lamps on the Meridian sea wall and have played the last hour
    of coast dance nights since 2614, mostly in halls that booked them because somebody has to play while
    the room empties. Sabin Loch sings higher and quieter than anybody expects and has never once used
    the core's word for what the band does. Emre Talt bought a second-hand synth-harpsichord out of Concordance
    and tunes it to the sea wall's hum, which is a real pitch and changes with the weather. They have
    never played off the coast, have never been asked twice, and turned down the one hall in the core
    that asked once.
- id: b_068
  name: The Coat Room
  kind: group
  figure: null
  label: label_1
  settlement: Concordance late-club quarter
  scene: void-lounge
  active_from: 2551
  active_to: 2585
  bio: The Coat Room played the quarter for thirty-four years and were pressed by the prestige house because
    the quarter had no house of its own yet, which is the gap Lower Bell Editions was founded in. Civic
    Lantern issued them as an evening act and would not put the word late on a sleeve.
- id: b_069
  name: Harbor Late
  kind: group
  figure: null
  label: label_2
  settlement: Cold Harbor
  scene: void-lounge
  active_from: 2590
  active_to: 2626
  bio: Harbor Late are the frontier's own version of the form, playing the hours after the reel halls
    empty and taking the tempo from a port that never fully shuts. Harbor Standard keeps them on the list
    because a frontier house with nothing slow on it loses its own night staff to the relay.
- id: b_070
  name: The Ninth Table
  kind: group
  figure: null
  label: label_1
  settlement: Concordance
  scene: void-lounge
  active_from: 2598
  active_to: 2626
  bio: The Ninth Table play the form for the core's expensive rooms rather than its late ones, in halls
    where the last ferry is something the staff catch and the audience does not. Civic Lantern has issued
    them steadily for a generation and the quarter has never once claimed them.
- id: b_071
  name: Marra Ostle
  kind: solo
  figure: null
  label: null
  settlement: Concordance late-club quarter
  scene: void-lounge
  active_from: 2604
  active_to: 2626
  bio: Marra Ostle has sung the quarter's rooms without a house behind her since 2604 and pays for her
    own runs out of what the rooms pay her, which is why there are two of them. She was offered a Lower
    Bell contract in 2611 and turned it down over the term about stored parts, which is the only decision
    anybody in the quarter still congratulates her for.
- id: b_072
  name: The Standing Gallery
  kind: collective
  figure: null
  label: label_1
  settlement: Concordance
  scene: core-harmonies
  active_from: 2601
  active_to: 2626
  bio: 'The Standing Gallery are thirty-one voices and formed in 2601 in the upper rail of the Long Assembly,
    Concordance''s largest public hall, out of people who came to other acts'' concerts because the standing
    rail cost a tenth of a seat. They sang after the seats emptied, while the hall staff stacked, and
    were doing it for six years before anybody put them on a bill. Sarra Lome directs and sings the lead
    and will not start a piece until the rail is full, which on one recorded night meant the whole hall
    waiting eleven minutes for her. Perra Mull writes every part out by hand for singers who do not read
    music, in a shape-notation that has been in the core''s public rooms for two hundred years. The ensemble
    has one long argument with its house and it is not about music: until 2619 no singer''s name was printed
    on any record of the form, and Civic Lantern paid a chorus a flat fee for a night and its hired players
    by the hour.'
- id: b_073
  name: Odessa Vail
  kind: solo
  figure: p_odessa_vail
  label: label_1
  settlement: Concordance
  scene: core-harmonies
  active_from: 2542
  active_to: 2561
  bio: 'Odessa Vail wrote one towering work and then, so far as any record shows, stopped: Lanternlight,
    the Core Harmony cycle made for a Lumen Festival, which became the festival''s test piece and has
    never been out of Civic Lantern''s catalogue since. The silence afterwards is argued in every music
    programme the core has ever run — perfection reached, nerve lost, or a second cycle sent by relay
    to somebody on the frontier and never received — and it is where the worlds'' phrase for a finished
    artist comes from, that they went to the lanterns.'
- id: b_074
  name: Nera Ostell
  kind: solo
  figure: p_nera_ostell
  label: label_2
  settlement: Cold Harbor
  scene: void-ballads
  active_from: 2578
  active_to: 2612
  bio: 'Nera Ostell kept a gate at the Cold Harbor relay berth from 2578 and sang to the night traffic
    because there were hours in a shift when nothing was due in and the alternative was the beacon. Harbor
    Standard came looking for her in 2583, for the plainest reason there is: the Station Cycles were in
    every room in the settled worlds that year and the house was not allowed to sell them, so it found
    a voice at a relay berth of its own. She sings low and close and plays one composite guitar strung
    with wire off the berth''s scrap yard, in an open tuning she has never changed, and she has never
    sung a Corin Hale song in her life — she is asked every time and says no every time. In 2612 she put
    her name on a rota and went out to Ashlin Reach, and there has been no record since; the house still
    lists both of hers and still sends her the money.'
- id: b_075
  name: Aro Vantry
  kind: solo
  figure: p_aro_vantry
  label: label_2
  settlement: Cold Harbor
  scene: void-ballads
  active_from: 2617
  active_to: 2626
  bio: Aro Vantry sings high and thin over a hand-pumped reed organ, and under all of it sits a box he
    built to hold the tonic of the Station Cycles, which he learned off a copy somebody at the Cold Harbor
    gate had made off a copy. He is the only artist on Harbor Standard's list who prints where his own
    note came from, on every sleeve, unasked. He put his name on the relay rota in 2619 and has kept two
    watches since, which is how he came to be allowed to make a record at Verrin Reach, and he sends a
    copy of everything he makes up the road to Nera Ostell at Ashlin Reach. She has never answered.
- id: b_076
  name: Corin Hale
  kind: solo
  figure: p_corin_hale
  label: null
  settlement: Verrin Reach
  scene: void-ballads
  active_from: 2549
  active_to: 2584
  bio: 'Corin Hale kept the vigil at Verrin Reach, a relay outpost two crossings out from Cold Harbor,
    for a working lifetime, and came out of it in old age with the Station Cycles — void ballads sung
    against the actual drone of the outpost''s life support, which Hale would not have repaired because
    it had become the tonic note. The Cycles were left to the rota rather than to a house, under one rule
    the rota has kept ever since: anybody may copy them and nobody may sell them. Every house in the settled
    worlds has asked and every house has been refused, so what circulates is copies of copies, passed
    hand to hand along the night shift, and the settled worlds'' most-loved record in this form is the
    one no station''s library holds.'
albums:
- id: al_001
  artist: b_001
  label: label_1
  title: Terms of Arrival
  release_year: 2619
  kind: album
  cornerstone: true
  notes: Measure Kindly booked a small committee chamber after the public halls became unavailable during
    the altered-credit rush of 2619. Vara Ennel brought twelve songs about ordinary negotiations and asked
    every guest player to accept the same fee. Odo Kest nearly left when the label proposed replacing
    his parts, but a blind vote kept the original takes. The record sold steadily, and its plain account
    sheet became part of the group's reputation.
- id: al_002
  artist: b_001
  label: label_1
  title: Rooms With Windows
  release_year: 2624
  kind: album
  cornerstone: false
  notes: Measure Kindly asked Civic Lantern for the reopened Concordance public hall and were given the
    eleven days left after the house had promised The Standing Gallery the nights it wanted, which the
    group have never said anything about in print and have never been asked about without mentioning.
    The group found that the restored high windows pulled the backing voices away from the lead microphone
    and rewrote the arrangements around that effect. A fee dispute stopped work for two days, after which
    all four members accepted less money to retain control of the session ledger. Demand for the hall
    forced the final mixes into a smaller room, and the difference is audible between the two halves of
    the record.
- id: al_003
  artist: b_002
  label: label_1
  title: Useful Trouble
  release_year: 2607
  kind: album
  cornerstone: false
  notes: Open Parallax started Useful Trouble in a Concordance room fitted only for unamplified performance.
    Meridian's closures in 2607 sent repaired compact keyboards into the core market, and Keli Vos persuaded
    the group to use one after its second session failed. The decision ended the band's Purist period
    and prompted a month of letters from its lunch-room audience. Civic Lantern recovered the modest cost
    within the release year, largely because the objections made listeners curious.
- id: al_004
  artist: b_002
  label: label_1
  title: Open Until Dawn
  release_year: 2619
  kind: album
  cornerstone: false
  notes: 'The altered-credit edition circulating in 2619 made Open Parallax audit every shared line before
    recording Open Until Dawn. The arguments produced eleven songs about ownership in small daily forms:
    receipts, seats, coats, and promises. Ivo Cern posted the final split beside the studio door, and
    no session began until every participant signed it. The record was the group''s largest seller and
    also its cheapest because no credit challenge reached the label.'
- id: al_005
  artist: b_003
  label: label_3
  title: Pressure Weather
  release_year: 2607
  kind: album
  cornerstone: false
  notes: Rain Ledger recorded Pressure Weather across the Meridian storm-coast closures of 2607, moving
    between a shelter room and a repair depot whenever power became available. Stormline Issue paid for
    portable storage but not additional room time, so the band finished several vocals beside working
    crews. The stop-start method gave the record its short verses and large repeated choruses. It became
    the label's first release to recover a storm-season budget before the coast reopened.
- id: al_006
  artist: b_003
  label: label_3
  title: Clear by Closing
  release_year: 2619
  kind: album
  cornerstone: false
  notes: Stormline Issue asked Rain Ledger for a reply to the altered-credit edition circulating in 2619.
    The band answered by keeping the Meridian power allotment unchanged and printing every guest beside
    the exact part performed. A proposed featured credit for the lead singer was defeated by the four
    members before the sessions began. Stormline Issue sent it off the storm coast on the same crate as
    a Cordon Hours record and has said since that pairing the coast's own music with a relay-pop group
    was what got both of them heard inland. The record sold strongly beyond Meridian and made the band's
    Synthesist argument easier to explain than any interview had.
- id: al_007
  artist: b_004
  label: label_5
  title: Crew Rates
  release_year: 2594
  kind: ep
  cornerstone: false
  notes: Cabin Treaty cut Crew Rates during the first freight-circuit burn festival in 2594, using a port
    meeting room between co-operative votes. The six songs addressed pay and private obligations without
    turning the festival into their subject. Common Wake Cooperative charged each member one equal share
    of the pressing cost, and the first run sold from a meal cart before the closing vote. The EP established
    the group's whole-crew chorus even though Ressa Morn remained its clear lead voice.
- id: al_008
  artist: b_004
  label: label_5
  title: Shared Format
  release_year: 2600
  kind: ep
  cornerstone: false
  notes: 'The shared shipboard pressing format of 2600 let Cabin Treaty issue seven short songs beyond
    its usual freight circuit. Emi Soll standardized the group''s session notes, but Cado Veir refused
    to replace percussion that other ships could not duplicate exactly. That argument ended the band''s
    Purist claim and produced its Localist statement: a format could travel while an instrument remained
    tied to its room. The release reached more ports than the group''s preceding work and returned every
    member''s pressing share.'
- id: al_009
  artist: b_004
  label: label_5
  title: Same Berth Twice
  release_year: 2619
  kind: album
  cornerstone: true
  notes: 'Same Berth Twice followed a 2619 co-operative rule change that let Cabin Treaty hold one room
    for an entire route instead of rebuilding a session at each stop. The altered-credit dispute made
    the members unusually formal: every chorus contribution was logged before the next take. Ressa Morn
    and Jalen Rook stopped speaking outside performance after a disagreement over the title track, but
    both completed the record. The album became Common Wake Cooperative''s strongest seller and financed
    repairs to three member-owned pressing units.'
- id: al_010
  artist: b_005
  label: label_6
  title: Soft Closing
  release_year: 2583
  kind: album
  cornerstone: false
  notes: Evening Claim recorded Soft Closing after the complete Station Cycles entered general circulation
    in 2583 and late-club rooms asked for quieter early sets. Mela Jorn answered the fashion with seven
    compact songs about bills, coats, and people delaying a departure. Lower Bell Editions paid for three
    nights but charged the group for a fourth after the founder attended a rehearsal and called it a session.
    The record sold slowly until club workers began requesting it before their rooms opened.
- id: al_011
  artist: b_005
  label: label_6
  title: Catalogue of Small Debts
  release_year: 2612
  kind: album
  cornerstone: false
  notes: Evening Claim entered the studio in 2612 while Lower Bell Editions was already refusing ordinary
    payment requests. The band turned eight disputed invoices into songs about favors, trust, and the
    discomfort of asking for what is owed. The label folded before manufacturing finished, and two catalogue
    claimants issued different track orders from the same masters. The station's order follows the signed
    session ledger, although ownership of that ledger remains part of the dispute. Evening Claim got their
    masters out of the receiver's room because that ledger was signed; After the Ferry, who had played
    the house's own room three nights a week since 2594, did not, and have made no record since.
- id: al_012
  artist: b_006
  label: label_1
  title: Rooms Between Voices
  release_year: 2554
  kind: album
  cornerstone: false
  notes: The record established their separated-voice method and became the partnership's most copied
    set of arrangements.
- id: al_013
  artist: b_006
  label: label_1
  title: Tables Kept Apart
  release_year: 2581
  kind: album
  cornerstone: false
  notes: Compiled from the partnership's final exchanged sessions, it carries the disputed altered credit
    and ends without an announcement.
- id: al_014
  artist: b_007
  label: label_5
  title: Paid in Kindness
  release_year: 2600
  kind: album
  cornerstone: false
  notes: Its careful division of writing shares became a model for small co-operative groups using the
    shared pressing format.
- id: al_015
  artist: b_007
  label: label_5
  title: Route Contract Hearts
  release_year: 2616
  kind: album
  cornerstone: false
  notes: The group's final full record placed private breakups beside the route assignments that made
    reconciliation impractical.
- id: al_016
  artist: b_008
  label: label_1
  title: Calendar Left Open
  release_year: 2592
  kind: album
  cornerstone: false
  notes: The record is remembered for turning exact appointment entries into choruses that freight crews
    adopted during the burn festival.
- id: al_017
  artist: b_008
  label: label_1
  title: Notices on the Fridge
  release_year: 2612
  kind: album
  cornerstone: false
  notes: Its clipped household notices were widely read as comments on the Lower Bell collapse even though
    the band denied the connection.
- id: al_018
  artist: b_009
  label: label_1
  title: Nine Ways Home
  release_year: 2615
  kind: album
  cornerstone: false
  notes: Each singer led one piece, but the shared low anchor made the nine arrangements sound like a
    single argument.
- id: al_019
  artist: b_009
  label: label_1
  title: Hall Rules Apply
  release_year: 2624
  kind: album
  cornerstone: false
  notes: Recorded around the reopened public hall's booking rules, it made the collective's voting process
    more famous than any member.
- id: al_020
  artist: b_010
  label: label_3
  title: Kitchen Pressure Map
  release_year: 2606
  kind: album
  cornerstone: false
  notes: Finished during the studio closures, the record mapped eight household disputes onto Meridian's
    shelter power schedule.
- id: al_021
  artist: b_010
  label: label_3
  title: Shelter Guest List
  release_year: 2622
  kind: album
  cornerstone: false
  notes: The duo invited a different neighbor onto every track and printed the room position of each voice
    beside the credit.
- id: al_022
  artist: b_011
  label: label_5
  title: Market Voice Kindly
  release_year: 2571
  kind: album
  cornerstone: false
  notes: Its courteous language disguised a detailed complaint about stall fees and made the title phrase
    common at Old Span.
- id: al_023
  artist: b_011
  label: label_5
  title: Bright Case Dispute
  release_year: 2588
  kind: album
  cornerstone: false
  notes: The borrowed case heard throughout the record prompted the group's unresolved argument over whether
    the sessions remained Purist.
- id: al_024
  artist: b_012
  label: label_1
  title: Sorting Hall Affection
  release_year: 2578
  kind: album
  cornerstone: false
  notes: The six separately scheduled voices demonstrated the editing method that ended the band's Localist
    period.
- id: al_025
  artist: b_012
  label: label_1
  title: Pressed for Delivery
  release_year: 2600
  kind: album
  cornerstone: false
  notes: The shared pressing format carried the group's sorting-hall stories beyond Concordance and exhausted
    its remaining contract.
- id: al_026
  artist: b_013
  label: label_3
  title: Wait for the Answer
  release_year: 2607
  kind: album
  cornerstone: false
  notes: Recorded during Meridian's reopening, the record made deliberate gaps sound more energetic than
    crowded arrangements.
- id: al_027
  artist: b_013
  label: label_3
  title: Courtesy Holds the Credit
  release_year: 2619
  kind: album
  cornerstone: false
  notes: Its evenly divided lines and alphabetical credits offered the clearest formal answer to the Pell
    and Tern controversy.
- id: al_028
  artist: b_014
  label: label_6
  title: Before the Tables Fill
  release_year: 2586
  kind: album
  cornerstone: false
  notes: Written for empty late-club rooms, its small complaints became more durable than the elaborate
    stored arrangements.
- id: al_029
  artist: b_014
  label: label_6
  title: Fractions in Dispute
  release_year: 2612
  kind: album
  cornerstone: false
  notes: Two rival issues use different stored parts and assign incompatible ownership fractions to the
    same eight songs.
- id: al_030
  artist: b_015
  label: label_1
  title: Concourse Takes Its Time
  release_year: 2559
  kind: album
  cornerstone: false
  notes: Released during the Lanternlight season, its modest public-room refrains became a quiet counterweight
    to large formal performances.
- id: al_031
  artist: b_015
  label: label_1
  title: Work Schedule Hearts
  release_year: 2576
  kind: album
  cornerstone: false
  notes: Three departing singers and two replacements appear across the record, making its credits a guide
    to the group's changing membership.
- id: al_032
  artist: b_016
  label: label_2
  title: Nothing Loose
  release_year: 2624
  kind: album
  cornerstone: false
  notes: Second Hitch recorded over eleven nights in a cleared Cold Harbor transfer shed in 2624, after
    refusing Harbor Standard's offer of a core studio for the second time. Teff Onda broke a wrist two
    days in and played the rest of the sessions strapped. A pay dispute with the shed operator stopped
    work for one night and was settled by the band paying the fee themselves. The label pressed it exactly
    as delivered, including the shed door, and it is the record that made the near frontier take the band
    seriously. Harbor Late played the shed the week after it was cleared and Teff Onda has said the two
    nights sounded like different buildings.
- id: al_033
  artist: b_017
  label: label_4
  title: Burn Day Overtime
  release_year: 2594
  kind: album
  cornerstone: false
  notes: Deep Register funded four hundred copies so that Pipe and Hammer would have a record to sell
    at the first freight-circuit burn festival in 2594. The band were still a shed act and recorded in
    the hall they rehearsed in, over four consecutive nights, because it was the only time the room was
    free. The festival crowd learned the chorus of the title track on the first night and sang it back
    with a change the band then adopted. It sold out during the festival and the label has reissued it
    in every year it has had press time since.
- id: al_034
  artist: b_017
  label: label_4
  title: Hammer Down the Line
  release_year: 2619
  kind: album
  cornerstone: true
  notes: Pipe and Hammer took eleven days in Forge's largest pipe hall in 2619 and came out with the record
    that fixed their reputation. Havel Ost lost his voice on the sixth day and the band spent two days
    recording beds around him rather than stop. The altered-credit dispute circulating that year turned
    an evening of the sessions into an argument about writing shares, which the band settled by printing
    every share on the sleeve. Deep Register asked for a shorter record on the last day and got two verses
    cut instead of two songs. The Long Tally had the hall for the fortnight before and left the pipe rig
    standing, which is the only reason eleven days were enough.
- id: al_035
  artist: b_018
  label: label_4
  title: Nothing Rides Free
  release_year: 2600
  kind: album
  cornerstone: false
  notes: Ballast Weather cut their first record in the week Forge's shipboard presses changed to the shared
    format, and chose to record to the new timing rather than wait for a slot in the old one. The kit
    arrived incomplete and Neve Atlin played a ballast plate for most of the sessions. The band had just
    lost a disputed haulage invoice, which is where the title and half the words came from. Deep Register
    expected a Forge house record and got one that mostly sold on the hauler routes instead.
- id: al_036
  artist: b_018
  label: label_4
  title: Slow Yard
  release_year: 2624
  kind: album
  cornerstone: false
  notes: Ballast Weather booked a Forge yard building for a season in 2624 and worked in it on the days
    it was not in use, which is why the record took longer to make than any of their others. Isa Lorne
    wanted a slower record and the band tracked most of it under the tempo they play it at live. A loader
    the band knew from the yard gate plays one of the solos. Deep Register released it without a single
    and it has outsold everything else they have made.
- id: al_037
  artist: b_019
  label: label_5
  title: Every Crew Signs
  release_year: 2600
  kind: album
  cornerstone: false
  notes: The Common Wake Cooperative made this the first record it sent past its own routes, using the
    shared press format adopted that year. Burn Day Wages recorded it in cargo bays at four ports during
    a single run and would not begin until the co-operative agreed to print every player on one line.
    Hess Vantry missed one session and a relief hauler played the drums on that track. The Wake Count
    were pressed in the same run and the two crews have argued ever since about which of them the format
    was bought for. It is the record that turned a crew band into the co-operative's biggest act.
- id: al_038
  artist: b_019
  label: label_5
  title: Ten Ports Out
  release_year: 2612
  kind: album
  cornerstone: false
  notes: Written across a single ten-port run and recorded in a covered bay with the doors open, this
    is the record the band made in the year a core late-club label folded and took a booking of theirs
    with it. Una Brack sings a lead line on it for the first time. Bel Corrow spent the sessions collecting
    contract wording, four lines of which ended up in the middle of a song. The co-operative pressed twice
    as many copies as it had for the previous record and sold every one.
- id: al_039
  artist: b_019
  label: label_5
  title: Hold the Whole Chorus
  release_year: 2619
  kind: album
  cornerstone: true
  notes: Burn Day Wages recorded this across three ports inside one run in 2619, tracking the rhythm section
    at the first, the guitars at the second and the vocals at the third. A copy reached the band with
    a different writer's name printed on the label, which produced both a song and a formal complaint
    the co-operative is still cited for. Una Brack had written a resignation before the sessions and stayed
    after a members' vote changed how backing singers were paid. The running order was decided by that
    same membership, and the record is the one every hauler settlement plays on burn day.
- id: al_040
  artist: b_020
  label: label_4
  title: First Shed Hall
  release_year: 2552
  kind: album
  cornerstone: false
  notes: The record that gave the form its whole-crew chorus, and still the one older Forge players name
    first.
- id: al_041
  artist: b_020
  label: label_4
  title: Maintenance Post
  release_year: 2581
  kind: album
  cornerstone: false
  notes: Their last record, issued in the year their singer took the steady job and stopped performing.
- id: al_042
  artist: b_021
  label: label_5
  title: Between Runs
  release_year: 2585
  kind: album
  cornerstone: false
  notes: Recorded in cargo bays across a single circuit and remembered for putting a full-crew chorus
    on every track.
- id: al_043
  artist: b_021
  label: label_5
  title: Opposite Circuits
  release_year: 2600
  kind: album
  cornerstone: false
  notes: Their last full record, and the one the shared press format carried further than the band ever
    travelled.
- id: al_044
  artist: b_022
  label: label_2
  title: Ninth Bay
  release_year: 2594
  kind: album
  cornerstone: false
  notes: Made for the first freight-circuit burn festival and the record that carried lane-rock to the
    near frontier.
- id: al_045
  artist: b_022
  label: label_2
  title: The Quiet Year
  release_year: 2610
  kind: album
  cornerstone: false
  notes: Cut in one week and remembered as the record on which the band began playing below their own
    volume.
- id: al_046
  artist: b_023
  label: label_4
  title: Half the Tempo
  release_year: 2573
  kind: album
  cornerstone: false
  notes: Ignored when it was issued and cited by most of the heavy Forge bands that came after it.
- id: al_047
  artist: b_023
  label: label_4
  title: Everyone Slowed Down
  release_year: 2596
  kind: album
  cornerstone: false
  notes: Released as younger bands started copying them, and the only record of theirs that sold on issue.
- id: al_048
  artist: b_024
  label: label_5
  title: Rotating Crew
  release_year: 2603
  kind: album
  cornerstone: false
  notes: Twenty-two named players appear on it, which is the thing about it everybody remembers.
- id: al_049
  artist: b_024
  label: label_5
  title: Last Founder
  release_year: 2617
  kind: album
  cornerstone: false
  notes: Its running order follows one final circuit, port by port, and it was made as the band's remaining
    founder prepared to leave haulage.
- id: al_050
  artist: b_025
  label: label_2
  title: Short and Loud
  release_year: 2604
  kind: album
  cornerstone: false
  notes: Eight songs and twenty-four minutes, which the band have said is the correct length for anything.
- id: al_051
  artist: b_025
  label: label_2
  title: Still Refusing
  release_year: 2621
  kind: album
  cornerstone: false
  notes: A second short record, made after the band declined a core booking for what the sleeve calls
    the eleventh time.
- id: al_052
  artist: b_026
  label: label_6
  title: Daytime Record
  release_year: 2590
  kind: album
  cornerstone: false
  notes: Commissioned to widen a late-club label's catalogue and disowned by half of that label's own
    roster.
- id: al_053
  artist: b_026
  label: label_6
  title: Unavailable Since
  release_year: 2612
  kind: album
  cornerstone: false
  notes: Issued in the year the label folded, caught immediately in the catalogue dispute, and never reissued.
- id: al_054
  artist: b_027
  label: label_2
  title: Whole Bay Listening
  release_year: 2613
  kind: album
  cornerstone: false
  notes: Harbor Standard could not book a studio that would take Ilma Torre's tank drums, so the label
    cleared a Cold Harbor transfer bay for six nights in 2613 and recorded there. The bay was still in
    use during the day and every session started after the last door closed. A supervisor billed the label
    for a cracked wall panel, and the label paid it and kept the invoice, which it later reproduced on
    the reissue sleeve. It sold better on the near frontier than anything Harbor Standard had put out
    in three years, and it is the record that made the label take the form seriously. The label had cleared
    the exchange hall for Wire and Rosin on the same argument in 2583 and said so in the press, which
    Ilma Torre has said was meant as a compliment and did not arrive as one.
- id: al_055
  artist: b_027
  label: label_2
  title: Count It Twice
  release_year: 2619
  kind: album
  cornerstone: false
  notes: Read It Back spent most of 2618 in a pay dispute that stopped work at three Cold Harbor bays,
    and wrote the record while it was running. Harbor Standard offered them a core studio and a larger
    advance on condition that the dispute went unmentioned; the crew took the studio, turned down the
    advance, and mentioned it on eight of the thirteen tracks. Vess Arun lost his voice for four days
    in the middle of the sessions and Dob Ferrin carried both parts on two tracks rather than wait. Sel
    Ardin was brought in to arrange the sung hooks and stayed for the whole run. It is the crew's longest
    record, the one the label reissues, and the only deck-talk album a settlement council has ever formally
    objected to.
- id: al_056
  artist: b_027
  label: label_2
  title: Nothing Off the List
  release_year: 2625
  kind: ep
  cornerstone: false
  notes: Five tracks cut in two nights in 2625, in the same transfer bay the crew made their first record
    in, after Harbor Standard asked for a full album and was told it would get what fitted in the time.
    Ilma Torre had moved settlements and travelled back for the sessions with no instruments at all, building
    the kit again out of what the bay had. The label released it exactly as delivered and it is the shortest
    record on Harbor Standard's current catalogue.
- id: al_057
  artist: b_028
  label: label_4
  title: Count the Whole Floor
  release_year: 2605
  kind: album
  cornerstone: false
  notes: Deep Register recorded The Long Tally over three nights in a Forge assembly hall in 2605, between
    shifts, with the machinery cold. Onn Karvel had been calling floor counts there for four years and
    insisted the record be made in the room the counts were made in, which meant working at the temperature
    the room held overnight. Juda Ness played the whole record on an unamplified bass and would not allow
    a microphone closer than two metres. It is the crew's first record, it took eleven years to sell out
    its pressing, and Deep Register has never reissued it.
- id: al_058
  artist: b_028
  label: label_4
  title: Pipe Under Everything
  release_year: 2618
  kind: album
  cornerstone: false
  notes: The first record with Emel Prise, made four years after Juda Ness left, and the one that settled
    the argument he left over. Prise put amplified resonance pipes under every track, which Deep Register
    had wanted since 2607 and had never been able to get past the crew. Onn Karvel wrote the verses at
    the same length as always and has said publicly that he did not change a line for the pipes. It doubled
    the crew's audience outside Forge and is the reason younger Forge crews record with pipes as a matter
    of course — Pipe and Hammer, who had the hall next, have said they took the rig as they found it and
    that Prise never asked for it back.
- id: al_059
  artist: b_028
  label: label_4
  title: Say the Numbers Slower
  release_year: 2626
  kind: album
  cornerstone: false
  notes: Deep Register gave the crew a full season of studio time in 2626 and they used six weeks of it,
    most of that on one track. Onn Karvel had begun losing the top of his range and wrote the whole record
    at a slower call than the crew had ever recorded, which Sudi Farrow has said was the hardest thing
    they have done. Emel Prise mixed it himself after the label's engineer left over the pipe levels.
    It is the crew's best-selling record and the one Forge halls play at closing.
- id: al_060
  artist: b_029
  label: label_5
  title: Between Ports Talking
  release_year: 2600
  kind: album
  cornerstone: false
  notes: Recorded in four different cargo bays on one circuit in 2600 and issued the same year the shared
    press format arrived, which is the only reason it left the route at all. Common Wake Cooperative pressed
    three hundred copies and sold them off the ship. Alto Renn was answering the verses and Hesta Orlow
    has said the two of them worked out the whole record standing up, because there was nowhere on board
    to sit down with it. It is the earliest deck-talk record the station holds.
- id: al_061
  artist: b_029
  label: label_5
  title: Everything on the Sheet
  release_year: 2611
  kind: album
  cornerstone: false
  notes: The first record with Pim Calder answering, made three years after Alto Renn took a berth on
    a circuit that does not return. Hesta Orlow refused to re-record any of Renn's parts from the crew's
    live set and instead wrote six new tracks in a month. Oren Saye came aboard for two stops and played
    on four of them. The co-operative's members voted on the sleeve and chose a photograph of the load
    sheet.
- id: al_062
  artist: b_029
  label: label_5
  title: Longest List We Carry
  release_year: 2621
  kind: album
  cornerstone: false
  notes: Made in one bay over nine days in 2621, the first Wake Count record cut in a single room, after
    the co-operative agreed to hold the ship in port so it could be. Hesta Orlow and Pim Calder had by
    then been trading verses for ten years and the record is built almost entirely on exchanges with no
    hook at all. Two tracks were cut and replaced on the last day because a member vote found them too
    close to a Cold Harbor crew's record. Burn Day Wages had the ship held for them the season before
    and voted against holding it again, which Hesta Orlow has never let go of. It is the one Common Wake
    Cooperative sends out when anyone asks what the label does.
- id: al_063
  artist: b_029
  label: label_5
  title: Read It at the Gate
  release_year: 2623
  kind: album
  cornerstone: false
  notes: The crew's fourth record, made in 2623 across two circuits after Common Wake Cooperative put
    the question of another single-room record to a member vote and lost it. Hesta Orlow has said she
    preferred it that way. Talla Venn played on three tracks during a stop and left her instrument aboard
    by accident, which the crew returned by freight and mentioned in the notes. It is the record that
    finally put the co-operative's deck-talk on stations off the route.
- id: al_064
  artist: b_030
  label: label_2
  title: Gate Shift
  release_year: 2579
  kind: album
  cornerstone: false
  notes: The oldest deck-talk record anyone can produce a copy of, and the one every crew on the near
    frontier claims to have heard first.
- id: al_065
  artist: b_030
  label: label_2
  title: Office Hours
  release_year: 2593
  kind: album
  cornerstone: false
  notes: Recorded for the freight office that employed them and remembered for putting a real wage dispute
    on a record for the first time.
- id: al_066
  artist: b_031
  label: label_5
  title: Open Ledger
  release_year: 2594
  kind: album
  cornerstone: false
  notes: The record that carried the form off the near frontier, sold hand to hand at the first freight-circuit
    burn festival.
- id: al_067
  artist: b_031
  label: label_5
  title: Ran Out of Lists
  release_year: 2609
  kind: album
  cornerstone: false
  notes: Their last record, made in the years the lead caller was already refusing new material, and the
    one that named the crew's own dispute.
- id: al_068
  artist: b_032
  label: label_4
  title: Anyone Who Can Carry It
  release_year: 2598
  kind: album
  cornerstone: false
  notes: Nineteen different people call on it and the sleeve lists none of them, which is still how Forge
    crews argue about who was there.
- id: al_069
  artist: b_032
  label: label_4
  title: Who Was in the Room
  release_year: 2608
  kind: album
  cornerstone: false
  notes: Made under the argument that ended them, and remembered because Deep Register printed the disputed
    line-up on the sleeve without agreement.
- id: al_070
  artist: b_033
  label: label_2
  title: Small Room Rules
  release_year: 2602
  kind: album
  cornerstone: false
  notes: The record that proved the form did not need volume, and the one quieter crews across the near
    frontier still name first.
- id: al_071
  artist: b_033
  label: label_2
  title: She Kept the Kit
  release_year: 2622
  kind: album
  cornerstone: false
  notes: Their last full record, named for the percussionist whose kit the crew refused to hand to anyone
    else.
- id: al_072
  artist: b_034
  label: label_5
  title: Tally and Answer
  release_year: 2603
  kind: album
  cornerstone: false
  notes: Eight straight exchanges with no hooks at all, and the record that made the form's contests a
    thing crews travelled for.
- id: al_073
  artist: b_034
  label: label_5
  title: Never Turned One Down
  release_year: 2620
  kind: album
  cornerstone: false
  notes: Recorded against six visiting crews on one circuit, and the only deck-talk record on which the
    challengers are credited by name.
- id: al_074
  artist: b_035
  label: label_4
  title: Apprentice Intake
  release_year: 2613
  kind: album
  cornerstone: false
  notes: Made the year after they won the Forge hall contest, and remembered for naming the whole intake
    that started with them.
- id: al_075
  artist: b_035
  label: label_4
  title: Only What We Can Play
  release_year: 2625
  kind: album
  cornerstone: false
  notes: Their second record in twelve years, and the one that stated the rule they are known for on the
    sleeve.
- id: al_076
  artist: b_036
  label: null
  title: Two Hundred Copies
  release_year: 2617
  kind: album
  cornerstone: false
  notes: Pressed by the crew themselves and traded across four settlements without ever being sold in
    a shop.
- id: al_077
  artist: b_036
  label: null
  title: Still Not Signing
  release_year: 2626
  kind: album
  cornerstone: false
  notes: Made after a third refused offer, and remembered for reading the offer aloud on the opening track.
- id: al_078
  artist: b_037
  label: label_2
  title: Nobody Sat Down
  release_year: 2583
  kind: album
  cornerstone: true
  notes: Harbor Standard had never recorded a dance band and did not have a room that could hold one,
    so in 2583 it rented the Cold Harbor exchange hall on the six nights it was not booked and recorded
    Wire and Rosin playing to an actual floor. Everything was cut live with two microphones because the
    label owned two. The dancers are audible throughout and the label argued for a month about whether
    to remove them before deciding it could not be done without losing the band. It became the record
    that established what a frontier reel record sounds like, and every band in this file has been compared
    to it at least once; Harbor Standard has never let it go out of print.
- id: al_079
  artist: b_037
  label: label_2
  title: Second Set, Same Room
  release_year: 2594
  kind: album
  cornerstone: false
  notes: Harbor Standard wanted the exchange hall record made again and Wire and Rosin agreed on the condition
    that the label pay the dancers, which it did, and which set a rate other Cold Harbor bands used afterwards.
    The band was eleven years further into its working life and the tempos are noticeably lower. Nessa
    Dray and Oren Saye were hired for three of the nights and it is the first time the group recorded
    with anyone outside it. It sold about half what the first record did and the band always said it was
    the better one. Harbor Standard had recorded Nera Ostell at the relay berth the year the first one
    was made and put the two out as the whole of its frontier list, which is the only time the label has
    issued a dance record and a single voice in the same season.
- id: al_080
  artist: b_037
  label: label_2
  title: Rosin on Everything
  release_year: 2607
  kind: album
  cornerstone: false
  notes: The band's last record, made three years after Finn Derrow left and with Suli Orley on guitar.
    Harbor Standard put them in a studio this time, which Wire and Rosin had spent twenty-nine years avoiding,
    and the difference is the whole argument of the record. Hessa Lund insisted the dancers be brought
    in for four of the eight tracks and the label agreed rather than lose the sessions. It is the quietest
    thing the band made and the only one on which the fiddle is ever double-tracked.
- id: al_081
  artist: b_038
  label: label_4
  title: Hot Floor, Cold Shop
  release_year: 2583
  kind: album
  cornerstone: false
  notes: Deep Register could not find a room in Forge with the pipe shop's reverberation, so it recorded
    The Foundry Set in the shop itself across four nights in 2583 with the machines shut down. The building
    has an eleven-second decay and every tempo on the record was chosen against it. Orsa Lipp tuned the
    settlement's own resonance pipes down for the sessions and had to tune them back before the morning
    shift each time, which is why there are only four nights. It is the first record anyone made of reel
    tempos under pipes and it was reviewed on the frontier as a novelty and in Forge as an argument.
- id: al_082
  artist: b_038
  label: label_4
  title: Take the Weight Off
  release_year: 2594
  kind: album
  cornerstone: false
  notes: Made eleven years after the first record and three years after the band stopped calling itself
    Purist, which is audible from the opening bar. Deep Register put the pipes through the shop's amplification
    for the first time and Orsa Lipp, who had argued against exactly this for a decade, ran the desk himself.
    Ivena Sorn was brought in for two tracks and it is the only time two pipe players appear on the same
    frontier reel record. The band broke up five years later and never made a third.
- id: al_083
  artist: b_039
  label: label_5
  title: Between Two Ports
  release_year: 2583
  kind: album
  cornerstone: false
  notes: Loose Cargo's first record, made in a hold on the co-operative's own route because the band would
    not stop working to make it. The Common Wake Cooperative had no recording equipment and borrowed two
    microphones from Harbor Standard, which is why this record and Nobody Sat Down sound like they were
    made in the same year by the same people, and they were. Six tracks is all the route allowed. It is
    the record that proved to the co-operative that a band which could not stand still could still be
    recorded, and Burn Day Wages have said every record they have made since was made on the strength
    of it.
- id: al_084
  artist: b_039
  label: label_5
  title: Everything Not Tied Down
  release_year: 2600
  kind: album
  cornerstone: false
  notes: The shared press format reached the co-operative in 2600 and Loose Cargo were the first band
    it recorded under it, which meant the record travelled past the route for the first time. They made
    it in a transfer hall rather than a hold because the co-operative now had somewhere to put them. Wend
    Amory has always said the band lost something in the move and the record sold four times what the
    first one did. Oren Saye and Nessa Dray both play on it.
- id: al_085
  artist: b_039
  label: label_5
  title: Dance It Off the Deck
  release_year: 2607
  kind: album
  cornerstone: false
  notes: Loose Cargo's last record and the only one made after they stopped working the route full time.
    The co-operative wanted a third and the band agreed on the condition that it be recorded in a hold
    again, which meant hiring one that was not going anywhere. Wend Amory described that decision afterwards
    as the most expensive joke the band ever made. It is looser and slower than anything else they did,
    and Brin Noll retuned the hold's fittings before the engineers set anything up.
- id: al_086
  artist: b_040
  label: label_2
  title: The Kettle Hall
  release_year: 2553
  kind: album
  cornerstone: false
  notes: The oldest frontier reel record in circulation, cut in one night on borrowed equipment and reissued
    twice since.
- id: al_087
  artist: b_040
  label: label_2
  title: Thirty Years in One Room
  release_year: 2583
  kind: album
  cornerstone: false
  notes: Recorded in the band's final years and remembered for being the record Wire and Rosin were compared
    to on release.
- id: al_088
  artist: b_041
  label: label_4
  title: Down the Rope Walk
  release_year: 2583
  kind: album
  cornerstone: false
  notes: Remembered for being made in the same year and settlement as Hot Floor, Cold Shop and selling
    roughly a tenth as much.
- id: al_089
  artist: b_041
  label: label_4
  title: We Were Here First
  release_year: 2594
  kind: album
  cornerstone: false
  notes: A direct answer to The Foundry Set, made the same year as Take the Weight Off, and the title
    was the whole argument.
- id: al_090
  artist: b_042
  label: null
  title: Out of the Saltbox
  release_year: 2561
  kind: album
  cornerstone: false
  notes: Self-pressed in an edition nobody has ever counted, and the reason the band is remembered at
    all.
- id: al_091
  artist: b_042
  label: null
  title: Still No Label
  release_year: 2583
  kind: album
  cornerstone: false
  notes: Made in the year the form became a commercial proposition, by the band that had refused every
    offer to make it one.
- id: al_092
  artist: b_043
  label: label_5
  title: Nine Mile Turn
  release_year: 2591
  kind: album
  cornerstone: false
  notes: The record the co-operative made to prove Loose Cargo were not the only band it had.
- id: al_093
  artist: b_043
  label: label_5
  title: The Long Way to Everywhere
  release_year: 2616
  kind: album
  cornerstone: false
  notes: Their last, and the record that ends the co-operative's run of reel releases.
- id: al_094
  artist: b_044
  label: label_2
  title: The Turning Room
  release_year: 2600
  kind: album
  cornerstone: false
  notes: A first record made under the shared press format and sold further than any frontier reel record
    before it.
- id: al_095
  artist: b_044
  label: label_2
  title: Same Hall, New Feet
  release_year: 2619
  kind: album
  cornerstone: false
  notes: Recorded in the exchange hall Wire and Rosin used, which the band has said was either a tribute
    or a mistake.
- id: al_096
  artist: b_045
  label: label_1
  title: A Core Room Full of Reels
  release_year: 2603
  kind: album
  cornerstone: false
  notes: The first frontier reel record made in a Concordance studio, and the one the frontier press treated
    as an intrusion.
- id: al_097
  artist: b_045
  label: label_1
  title: We Went and Looked
  release_year: 2624
  kind: album
  cornerstone: false
  notes: Made after the band spent a year working the near frontier halls, and the record that finally
    quieted the complaint.
- id: al_098
  artist: b_046
  label: label_7
  title: The Room at Terrace Road
  release_year: 2624
  kind: album
  cornerstone: true
  notes: Cut over three nights in the tram works canteen on Mars in 2623 and issued at the road head in
    2624. Relay Road Import had nearly closed in 2622, when a crate went astray, and it put the largest
    part of one crossing behind this record — everything else that came down that season had been bought
    and paid for before the crate was lost, which is a decision the house has never had to defend because
    the record sold better than anything it has imported. The canteen is free only between shifts, so
    the sessions ran from the end of one and stopped at the start of the next, and the works bell is audible
    on four tracks. Orin Lask is on drums, his first record with the band; the song Nan Sudell left behind
    when she went in 2622 is on it too, and the band recorded it without her. Terrace Road Four did not
    know the record had been issued in the settled worlds until a letter reached Mars a season later,
    and Wesla Tarn's reply asking who exactly had been buying it is framed in the importer's office.
- id: al_099
  artist: b_046
  label: label_7
  title: Later Than Advertised
  release_year: 2619
  kind: album
  cornerstone: false
  notes: The band's first record, cut in the canteen in 2618 for a Mars house that pressed four hundred
    copies and did nothing else with them. Relay Road Import bought the master unheard on the recommendation
    of a clerk at the road head who had a cousin on Mars, which is the whole of the house's acquisition
    process and the reason it has the band at all. Nan Sudell is on drums throughout and plays with brushes
    on most of it because the room next to the canteen was still working. Tel Brask, of Undershore Local,
    is on one track; he was on Mars for a fortnight for someone else's wedding and walked in during the
    second night. It sold slowly for five years and then sold out entirely in the season after the second
    record landed. The Turning Room bought nine copies of it off one crate and gave eight of them away,
    which is how most of Cold Harbor came to hear a Mars band at all.
- id: al_100
  artist: b_047
  label: label_7
  title: Nobody Sings It Alone
  release_year: 2612
  kind: album
  cornerstone: false
  notes: 'Cut in a Titan lake yard''s hall over two evenings in 2611 and issued at the road head in 2612,
    the first Shore Rounds record to leave the home system. The edition the station holds is not the one
    Titan bought: the crate had room for eight songs and the importer dropped the ninth, told nobody,
    and the band learned of it in 2616 from a letter written by a listener who had heard both. Relay Road
    Import has never argued that it was right, only that the alternative was leaving the record behind
    altogether. The four voices are recorded on one microphone at the distances they stand at when they
    sing in the yard, which took most of the first evening to arrange. Bran Teale plays with two fingers
    taped after a yard injury and the guitar parts were simplified in the room to suit it. Harbor Late
    have closed on the dropped ninth song for years without ever having heard it, working from the letter
    alone, and Effa Lomm has written to the road head twice to ask them to stop.'
- id: al_101
  artist: b_047
  label: label_7
  title: Two Lamps and a Table
  release_year: 2619
  kind: album
  cornerstone: false
  notes: Made in 2618 in the lake yard's meeting room, which had a table, two lamps and one microphone,
    and issued at the road head in 2619. The band had refused a studio in the settlement for the second
    time and the importer stopped offering. Saira Dunn, of Undershore Local, came from Europa for it and
    spent two days tuning the yard office piano, which had not been touched since it was installed. This
    is the record on which the Shore Rounds began naming who sang which part on the sleeve, after four
    years of arguing that a round has no lead — Effa Lomm's position was that the importer would put a
    name on it anyway and it might as well be the right ones.
- id: al_102
  artist: b_047
  label: label_7
  title: Whatever Fits the Crate
  release_year: 2624
  kind: ep
  cornerstone: false
  notes: The first record anybody in the home system made because the settled worlds asked for one. Relay
    Road Import wrote to the Shore Rounds in 2622 asking for more and, being an importer rather than a
    label, specified the request in minutes of crate space rather than songs. The band cut five in 2623
    and the record runs to within a minute of the length the letter named. Amon Furlow came from Mars
    to play piano on one track, invited by the same letter, and met the band on the morning of the session.
    It is the only Shore Rounds record made in a hired room, and Effa Lomm has said that agreeing to the
    length was the concession and the room was merely the consequence.
- id: al_103
  artist: b_048
  label: label_7
  title: Nothing Dries Down Here
  release_year: 2600
  kind: album
  cornerstone: false
  notes: Cut in 2599 in the canteens and galleries of the Europa under-ice works, where the band had played
    for eleven years, and issued at the road head in 2600. The union local paid for the recording out
    of its own funds after the works refused, which is why the sleeve of the Europa pressing carries a
    branch number instead of a producer's name. The cold defeated the piano — it could not be brought
    to pitch and Saira Dunn played it flat rather than move rooms — and the yard's four-second decay is
    on the tracks cut in the gallery. Relay Road Import took it because it was cheap and because the house
    had nothing else that season, and it is the oldest record in the station's import catalogue. Nera
    Ostell clerked the berth the crate came in on and has said this is the record that told her a voice
    and a room were enough, which is the only time anybody on the frontier has credited an import with
    anything.
- id: al_104
  artist: b_048
  label: label_7
  title: Second Shift Blues
  release_year: 2607
  kind: album
  cornerstone: false
  notes: The band's second and last record, cut in 2606 across four nights in the same canteen and issued
    at the road head in 2607. The works had gone to a rolling shift pattern that never put the four of
    them off duty together, and the sessions were arranged around the two nights a month it did — which
    is why it took four nights spread over a season to make a record of seven songs. Saira Dunn arranged
    all of it, including the harmonica parts, and played in cut-off gloves that are audible on the keys.
    Undershore Local knew this was the last one while they were making it and said so on the sleeve, in
    one line, without explanation.
- id: al_105
  artist: b_049
  label: label_7
  title: Low Terrace Nights
  release_year: 2556
  kind: album
  cornerstone: false
  notes: The oldest record in the importer's catalogue and the one it reissues whenever it needs money.
- id: al_106
  artist: b_049
  label: label_7
  title: Ten Years of Dust
  release_year: 2566
  kind: album
  cornerstone: false
  notes: Remembered for the run of tram works songs on its second half, which every Mars band since has
    been measured against.
- id: al_107
  artist: b_050
  label: null
  title: The Bell Yard
  release_year: 2572
  kind: album
  cornerstone: false
  notes: Named for the yard the band sang in and remembered out here as the record nobody at the road
    head has ever held a copy of.
- id: al_108
  artist: b_050
  label: null
  title: Rounds for a Full Room
  release_year: 2589
  kind: album
  cornerstone: false
  notes: The record whose running order the settled worlds argue about, none of them having heard it.
- id: al_109
  artist: b_051
  label: label_7
  title: Cut and Carry
  release_year: 2587
  kind: album
  cornerstone: false
  notes: Made in a shift room with the crew still in it and remembered for the counting song that opens
    the second half.
- id: al_110
  artist: b_051
  label: label_7
  title: Nothing Grows Out Here
  release_year: 2606
  kind: album
  cornerstone: false
  notes: The band's last, cut after the crew was broken up and remembered for being funnier than its title.
- id: al_111
  artist: b_052
  label: null
  title: The Lamp Room
  release_year: 2597
  kind: album
  cornerstone: false
  notes: Cut in the lamp room the band is named after and known out here only from the Shore Rounds' versions
    of four of its songs.
- id: al_112
  artist: b_052
  label: null
  title: Late Boat Home
  release_year: 2616
  kind: album
  cornerstone: false
  notes: The band's last record, made nineteen years after their first, and the reason two Titan yards
    still argue about who taught whom.
- id: al_113
  artist: b_053
  label: label_7
  title: Ferry Money
  release_year: 2614
  kind: album
  cornerstone: false
  notes: Recorded across eleven crossings and remembered for the announcements left in between the songs.
- id: al_114
  artist: b_053
  label: label_7
  title: Both Ways Every Day
  release_year: 2624
  kind: album
  cornerstone: false
  notes: The band's last, made on the route they had worked for twenty-eight years, and the record that
    shared a season with Terrace Road Four's and sold nothing beside it.
- id: al_115
  artist: b_054
  label: label_3
  title: The Seal Comes Down
  release_year: 2607
  kind: album
  cornerstone: false
  notes: Cut in the Longwall hall during the closed season of 2606 on the machine the hall keeps for lost-property
    announcements, and issued in 2607 when the coast reopened and Stormline Issue had a season of finished
    records to put out at once. It was the third of those the house issued that spring and the one it
    had not expected anything from; the other two had studios and this had a hall with a wet floor. The
    label had paid for four songs and got eight, because the band did not stop when the tape did and Ossa
    Brill kept a second machine running from the stage. Kir Adnall's floor drum on it is a length of sea-wall
    shuttering, which the band has used on every record since and has never replaced. Anje Roul has said
    the record is out of tune in two places and that she would not change either.
- id: al_116
  artist: b_054
  label: label_3
  title: Nobody Leaves Before Six
  release_year: 2619
  kind: album
  cornerstone: false
  notes: Made in the Longwall hall across the sealed season of 2618 and issued in 2619, into a release
    calendar full of answers to the altered-credit edition — the year the band would least have chosen
    and the one Stormline Issue insisted on, and the year the house started pressing the core's slow music
    and signed Nine Lamps, which Anje Roul was asked about at every door for a season. Sel Ardin came
    out from Concordance for eleven days and built the backing vocals on eight of the eleven tracks; it
    is the only time Cordon Hours have used a hired voice and Anje Roul has said it is the only time she
    has been out-sung in her own hall. The record was mastered twice, once by the label for export and
    once by the band, and the band's is what was pressed after a fortnight of letters. The crate that
    carried it out also carried Bright Hazard, whose name the sleeve put above Cordon Hours', which is
    where the argument between the two bands starts and it has not stopped since. Kir Adnall's last session
    is track four and Wen Prile's first is track five.
- id: al_117
  artist: b_054
  label: label_3
  title: The Long Cordon
  release_year: 2624
  kind: album
  cornerstone: false
  notes: The sealed season of 2623 ran eleven weeks, the longest the storm coast has recorded. Cordon
    Hours played the Longwall hall on forty of those nights and recorded thirty of them, and what was
    issued in 2624 is thirteen songs cut out of that — chosen by the hall rather than the band, because
    Ossa Brill kept a tally of what the room stayed for and the record is the top of the tally in the
    order it was played. Concordance's largest hall reopened the same year and every house in the settled
    worlds was booking live sessions into it; Stormline Issue put its season's money into a wet hall on
    the storm coast instead and has said in print that it would do it again. Miro Olt is on three tracks
    and Calo Meret on two, both of them caught on the coast when it closed and both, by their own account,
    bored. Sela Vint of Bright Hazard plays the synth bass on one track after Peran Dask went into a splint
    in the eighth week; the two bands were not speaking and she came anyway.
- id: al_118
  artist: b_055
  label: label_3
  title: Top of the Board
  release_year: 2612
  kind: album
  cornerstone: false
  notes: Bright Hazard's first record, made in the room above the hazard-board office in Bight Row in
    2611 and issued in 2612. Stormline Issue signed the duo on one track that had already been played
    in four settlements before the house heard it, which it has since called the only signing it ever
    made in a hurry. The year the record landed was the year Lower Bell Editions folded in the core and
    the settled worlds filled up with cheap catalogue; the duo's answer was to make the shortest and loudest
    record on the house's list and get it onto a crate before the coast sealed. Sela Vint's session notes
    — every pattern, every tempo, every change — are printed on the inner sleeve, which was her condition
    for signing and has been on every record since. Nobody but the two of them plays on it, a rule fixed
    during these sessions and broken once in twelve years.
- id: al_119
  artist: b_055
  label: label_3
  title: Export Grade
  release_year: 2619
  kind: album
  cornerstone: false
  notes: 'Made in 2618 in a hired room off the coast, the first Bright Hazard record not built in the
    Bight Row room, and issued in 2619 on a crate that also carried Cordon Hours. That sleeve put Bright
    Hazard''s name above Cordon Hours'' and the two bands have not shared one since; Sela Vint has stated
    in writing that neither of them saw the sleeve before it shipped, and has also said it made no difference
    to anybody''s opinion. The record is the duo''s answer to the altered-credit edition that filled the
    2619 calendar: every sound on it is credited to whichever of them made it, down to which one pressed
    the key, and the inner sleeve runs to four pages. Sel Ardin sings on three tracks and is credited
    by name, part and take count, the first person besides the two of them to appear on a Bright Hazard
    record. It is the record that took the duo off the coast, and they have not played a sealed season
    since 2620.'
- id: al_120
  artist: b_055
  label: label_3
  title: Everywhere but Here
  release_year: 2624
  kind: album
  cornerstone: false
  notes: Cut in 2623 in four hired rooms across three settlements while the storm coast was sealed for
    eleven weeks behind them, and issued in 2624. Bright Hazard were the only act the house paid for that
    season — the year's money had gone into a wet hall on the coast, and The Quiet Half paid the Concordance
    hall fee out of their own pockets rather than wait for it — and this record is the whole of Stormline
    Issue's export list for the year. Denn Ashery's vocals were recorded in one settlement and Sela Vint's
    programming finished in another, the two of them working a fortnight and two crossings apart and sending
    parts by relay, which is why the duo calls it the first record they made without being in a room together.
    Brin Noll plays stripped-wire chimes on two tracks — the only person besides Sel Ardin to appear on
    a Bright Hazard record and the first to play an instrument on one — hired because Sela Vint wanted
    a sound she could not programme and would not fake. It sold better off Meridian than on it and Bight
    Row has said so at length.
- id: al_121
  artist: b_056
  label: label_3
  title: The First Sealed Season
  release_year: 2598
  kind: album
  cornerstone: false
  notes: The record that turned the coast's sealed-season nights into something a label would pay for.
- id: al_122
  artist: b_056
  label: label_3
  title: Gate Money
  release_year: 2610
  kind: album
  cornerstone: false
  notes: The band's last, made after the settlement began charging for the gate room, and remembered chiefly
    for the argument about the door.
- id: al_123
  artist: b_057
  label: label_3
  title: Round the Salt
  release_year: 2606
  kind: album
  cornerstone: false
  notes: The record the house put out while the storm-coast studios were still shut, made in the back
    of the band's own transport.
- id: al_124
  artist: b_057
  label: label_3
  title: Steady Trade
  release_year: 2619
  kind: album
  cornerstone: false
  notes: Remembered as the only Stormline Issue record of 2619 that had nothing to do with anybody's dispute.
- id: al_125
  artist: b_058
  label: null
  title: Pump House Tapes
  release_year: 2615
  kind: album
  cornerstone: false
  notes: Handed out at hall doors in runs of thirty and the most copied record the storm coast has.
- id: al_126
  artist: b_058
  label: null
  title: Given Away Again
  release_year: 2624
  kind: album
  cornerstone: false
  notes: Released during the eleven-week seal, when it was the only new record on the coast and nobody
    could buy it.
- id: al_127
  artist: b_059
  label: label_6
  title: Nothing After Midnight
  release_year: 2605
  kind: album
  cornerstone: false
  notes: The core's first serious attempt at the coast's form, made for the house After the Ferry played
    three nights a week for, and the record Meridian bands still say got the tempo wrong.
- id: al_128
  artist: b_059
  label: label_6
  title: The Last Pressing
  release_year: 2612
  kind: album
  cornerstone: false
  notes: Pressed in the month the house folded, alongside the last Coldwater Court record, and remembered
    as the one nobody has been able to reissue since.
- id: al_129
  artist: b_060
  label: label_1
  title: Rooms at Vantage
  release_year: 2617
  kind: album
  cornerstone: false
  notes: The prestige house's first release in the form, and the one Meridian was rudest about.
- id: al_130
  artist: b_060
  label: label_1
  title: Come Down the Coast
  release_year: 2624
  kind: album
  cornerstone: false
  notes: Recorded in Concordance's reopened hall and remembered for the sleeve note apologising to Meridian.
- id: al_131
  artist: b_016
  label: label_2
  title: Bay Rate
  release_year: 2619
  kind: ep
  cornerstone: false
  notes: Five songs cut in a Cold Harbor transfer shed in 2619, the year the four of them started playing
    together, on a night the bay was out of use for a door repair and nobody needed it. The band paid
    for it themselves and sold sixty copies at the gate over one winter. Harbor Standard bought the recording
    afterwards and pressed it without changing a thing, which is how a shed act came to be on a flagship
    label without ever auditioning for one. Wen Arbo has said the whole record cost less than a night's
    wages.
- id: al_132
  artist: b_017
  label: label_4
  title: Four Won't Fill It
  release_year: 2612
  kind: album
  cornerstone: false
  notes: The record Pipe and Hammer made in the year Saul Ravik left over the amplified pipes and Ade
    Prosk came in on the bass. Half of it was already written when the argument started and the band would
    not go back and redo the early songs, so both bass players are on it and the sound changes halfway
    through. Deep Register wanted one name on the sleeve and Havel Ost refused, which is why it prints
    two. It sold slowly and it is still the record Forge players argue about, because nobody agrees which
    half is the better one.
- id: al_133
  artist: b_018
  label: label_4
  title: The Route in Order
  release_year: 2619
  kind: album
  cornerstone: false
  notes: 'Ballast Weather made four of these songs in the four settlement halls they play every year,
    in the order the route takes them, and the other three in a Forge yard afterwards. Deep Register would
    only pay for four rooms and Isa Lorne paid for the yard days herself rather than cut a song. Perin
    Dask broke a string in the third hall and finished on five, and it is the running order, not the songs,
    that people talk about: it is the only one of their records that follows the route rather than the
    label''s idea of a first side.'
- id: al_134
  artist: b_061
  label: label_5
  title: One Day in Port
  release_year: 2619
  kind: album
  cornerstone: false
  notes: Turn and Burn made this across five ports in 2619 without staying anywhere longer than a turnaround,
    and it is the first of their records to use the amplification the Common Wake Cooperative had voted
    three times before it would buy — Loose Cargo had asked for the same rig for years and stopped working
    the route before the membership agreed to it. The membership then voted down the band's request to
    be paid by the port rather than by the record, and two of these songs come straight out of that. Rhea
    Molt has never written a set list down, so the running order here is simply the order the songs were
    finished in. It travelled further than anything the co-operative had issued since Burn Day Wages'
    last, which is where the bad feeling between the two bands starts.
- id: al_135
  artist: b_061
  label: label_5
  title: Paid by the Port
  release_year: 2624
  kind: album
  cornerstone: false
  notes: The Common Wake Cooperative reversed its own vote of 2619 and began paying Turn and Burn by the
    port, which is where the title comes from and why the band could stay two days in three of these halls
    instead of one. Cass Verrow left a guitar at a berth on the second port and played the rest of the
    record on one bought from a stall for the price of a night's fee. Iber Tance is credited as a writer
    on a Turn and Burn record for the first time. Rhea Molt lost the band's long argument about set lists
    during it, and this is the only one of their records made to a written order.
- id: al_136
  artist: b_038
  label: label_4
  title: Played and Never Pressed
  release_year: 2619
  kind: live
  cornerstone: false
  notes: Orsa Lipp recorded the band's Forge dances for himself between 2591 and 2599 on equipment the
    shop already owned, and told nobody outside the band that he had them. Deep Register put ten of them
    out in 2619, the year every label on the frontier was reopening its own cupboards, and printed a sleeve
    crediting Dane Verrow as the writer throughout. Bree Hollan, who had made the band split its writing
    four ways in 2594, disputed every track but one, and the label has never issued a corrected sleeve.
    It is the only record of what The Foundry Set sounded like in a hall rather than in the pipe shop,
    and the dancers on it are shop workers who can be heard complaining about the heat. Pipe and Hammer
    were in Forge's largest pipe hall the same year and put a verse about the sleeve into the record they
    were making, and Deep Register pressed that too.
- id: al_137
  artist: b_039
  label: label_5
  title: Burn Festival Set
  release_year: 2594
  kind: ep
  cornerstone: false
  notes: The first freight-circuit burn festival put crews, port halls and frontier dancers in one place
    for a week in 2594, and the Common Wake Cooperative wanted a record out of it while everybody was
    still talking about it. Loose Cargo were the only band on the label who could reach the festival without
    dropping a run, so they played the last two nights of it and cut five tunes in the port hall the next
    morning with the doors still open. It is the shortest thing they made and the only one with other
    crews singing on it. The co-operative sold it along the route for a season and then let it go out
    of print, which Wend Amory has called the only sensible thing it ever did with a record of theirs.
- id: al_138
  artist: b_062
  label: label_2
  title: Learned Off the Floor
  release_year: 2619
  kind: album
  cornerstone: false
  notes: Harbor Standard signed Board and Bow after a Cold Harbor gate clerk told the label there was
    a band worth hearing in a room with no licence, and it took the label two years to go and find out.
    It was cut in the transfer shed the band had been playing in rather than in the exchange hall, because
    Suli Orley would not record in a room the dancers are charged to walk into. Alis Doone's calling is
    on every track and the label asked twice for it to come off. It came out in the same year The Turning
    Room made a record in the exchange hall itself, and Cold Harbor spent a winter arguing about which
    of the two was the tribute.
- id: al_139
  artist: b_062
  label: label_2
  title: We Went the Other Way
  release_year: 2624
  kind: album
  cornerstone: false
  notes: Harbor Standard had four nights in Concordance's reopened hall in 2624 and sent Board and Bow
    to use them, which Suli Orley agreed to on the condition that Cold Harbor dancers were brought along
    and not charged to get in. Four hundred of them were, and the hall's staff have said they had never
    worked a night like it. It came out in the same year The Long Ferry released the record they made
    after a year working frontier halls, and the two were reviewed together everywhere, badly and in opposite
    directions. It is the loudest thing the band has made, and Alis Doone's calling sits further forward
    than on the first record because she asked for it.
- id: al_140
  artist: b_063
  label: label_7
  title: Ten Locks to the Sea
  release_year: 2607
  kind: album
  cornerstone: false
  notes: Cut in 2605 in the lock house at the head of the cut and issued at the road head in 2607, and
    it is the first record made on Earth that Relay Road Import has ever landed. The house had been writing
    to Earth for eleven years and had been ignored every time or asked for money in advance; this master
    reached it because a clerk on Earth read one of those letters as the address of a district rather
    than of a yard, which is how a letter meant for the Bell Yard Rounds arrived at a lock house. An Earth
    record takes two crossings rather than one, so the band had been paid, once and flat, and had stopped
    thinking about the whole business long before anybody out here heard a note of it. The argument about
    whether the importer landed the wrong band from Earth started the season it went on sale and has not
    stopped since. Fenna Crole's reply to the original letter, which opens by telling the house that this
    is not the band it wrote for, hangs in the importer's office beside Wesla Tarn's.
- id: al_141
  artist: b_063
  label: label_7
  title: Everything Comes By Water
  release_year: 2612
  kind: album
  cornerstone: false
  notes: Made in 2610, the season the cut was drained for repair and nobody working on it earned anything,
    and issued at the road head in 2612. The band had a concertina in it for the first time — Wenna Ferrin
    had come off the next boat and joined that spring — and Relay Road Import, which had written asking
    for more of the first record, got a slower one made by five people with no wages coming in. The repair
    gang are on two of the choruses and were paid the way the band was, out of a share of what the lock
    house had. Fenna Crole has said the record is not about the closure and that it is simply the only
    time the five of them have ever been in the same room for a whole season. It has never been off the
    importer's list.
- id: al_142
  artist: b_063
  label: label_7
  title: Not the Band You Wrote For
  release_year: 2619
  kind: album
  cornerstone: false
  notes: Cut in 2617 in the lock house and in a wharf room at the bottom of the cut, and issued at the
    road head in 2619. Relay Road Import had sent the band, unasked, a bundle of the letters printed out
    here arguing about whether the house had landed the wrong band from Earth, and Fenna Crole read the
    whole bundle aloud in the lock house over one evening. The record is the band's answer to it and it
    disappointed the people who had written the letters, because it is not an angry record and only two
    songs on it are about the argument at all. Aldis Merrow worked out on paper, twice, that a reply cannot
    reach the settled worlds in the same year as the letter it answers, and the band would not believe
    him until the second time. It is the longest record they have made and the only one made in two rooms.
    Board and Bow put one of its tunes into their sets the season it landed and call it by the wrong title
    on stage, which the letters out here have since argued about at greater length than the record.
- id: al_143
  artist: b_063
  label: label_7
  title: Somebody Sent Us This
  release_year: 2624
  kind: album
  cornerstone: false
  notes: Cut in 2621 and issued at the road head in 2624, because the first copy was in the crate that
    went astray in 2622 and very nearly closed the house. Fenna Crole had kept the band's second copy
    on the lock house shelf and it went out on the first crossing after the loss was worked out. The record
    exists at all because Relay Road Import had, in 2619, sent something up the road for once — a Shore
    Rounds pressing with no letter and no name on the sleeve — and the Ninefoot Cut spent a season finding
    out whose it was and then learned one of the rounds off it. It is the only record in the house's list
    on which the road ran both ways, and Effa Lomm has written that she would like to hear it and has
    not been sent one.
- id: al_144
  artist: b_064
  label: label_6
  title: The Late Fare
  release_year: 2600
  kind: album
  cornerstone: false
  notes: Lower Bell Editions had been sitting on this band for six years and could not afford to press
    it. What changed in 2600 was the shared format the shipboard presses adopted that year, which cleared
    the plant's backlog and dropped the price of a short run far enough that Maro Deyn could pay for one
    out of the Lower Bell room's takings. It was recorded across four nights in the room itself, after
    the last ferry, with the band playing its ordinary set and stopping when the room emptied. Hessa Lin
    had joined that spring and her synth-harpsichord is on every track, which the house filed as the band
    changing sides and the band has never accepted. Nesta Vire has said the record is the room and not
    the band, and that this is why it works.
- id: al_145
  artist: b_064
  label: label_6
  title: Two Ferries Missed
  release_year: 2607
  kind: album
  cornerstone: false
  notes: The house's best year. Meridian's coast was shut for the season and the core's rooms filled up
    with players who had nowhere to be, so Lower Bell Editions had its pick of hired hands for the first
    and only time and spent the money on this record. Sel Ardin came down for three nights and built the
    answering voices, and Nesta Vire has said she sang the rest of the record differently once she had
    heard what a second voice could do underneath her. The house booked three nights in the room and the
    band played a fourth; Evening Claim had been billed for a fourth night in the same room in 2583 and
    After the Ferry refused to sign for theirs, which is the first time anybody had refused Maro Deyn
    anything. Hessa Lin's own instrument had been sold that spring to clear the band's back pay, so the
    last track is the room's upright piano.
- id: al_146
  artist: b_064
  label: label_6
  title: Everything on Account
  release_year: 2612
  kind: album
  cornerstone: false
  notes: Made in the spring of 2612 and pressed in the summer, by which time Lower Bell Editions was paying
    everybody in credit notes against a catalogue it had already borrowed against. The Gantry Street plant
    finished the run and then held it, as security for two years of unpaid pressing, and every copy the
    station has came out of the four boxes the band collected in person by arguing at the window for a
    day and a half. Nesta Vire wrote most of it out of the band's own paperwork and none of it is about
    the house in general; it is about four specific payments and one meeting. The record was not distributed,
    was never reviewed, and is the thing the quarter means when it talks about what was lost — which is
    inaccurate, because the band has it and plays it.
- id: al_147
  artist: b_065
  label: label_6
  title: First Round Slow
  release_year: 2594
  kind: album
  cornerstone: false
  notes: The house's fifth record and the one that made it. Maro Deyn had founded Lower Bell Editions
    in 2589 to press other people and had put off pressing his own band for five years on the grounds
    that it would look exactly like what it was. He gave in the year the first burn festival emptied the
    quarter of everybody with a lane job, because the room was half full for a season and the band had
    nothing else to do with the nights. Talla Venn was hired for two of them and spent both arguing with
    Deyn about whether the guitar should answer the piano's left hand or stay out of its way; the record
    keeps both versions of the argument and settles neither. Bela Runn sings all six, in the last stretch
    of the twenty-six years she gave the band.
- id: al_148
  artist: b_065
  label: label_6
  title: The Founder's Room
  release_year: 2612
  kind: album
  cornerstone: false
  notes: The band's second record and the last thing Lower Bell Editions ever pressed. Nothing had come
    between it and the first because Maro Deyn would not book his own band ahead of anybody he had signed,
    and by 2612 there was nobody left to be ahead of. It was made in the Lower Bell room he had bought
    in 2610 with a loan against the catalogue, which is what the title is about and what the band, rather
    than Deyn, chose to call it. Juna Carrow had sung with them for seven years by then and sings all
    six. The plant held the run against the debt within a month of finishing it, so the record went from
    being made to being disputed without ever being sold, and both claimants have listed it since.
- id: al_149
  artist: b_066
  label: label_3
  title: Numbers on the Sleeve
  release_year: 2619
  kind: album
  cornerstone: false
  notes: 'Stormline Issue''s first record in the form, made for the plainest reason a house ever makes
    one: the coast had sealed, the crates had gone, the dance acts were off the coast, and there was a
    singer in a hall with a band she had put together four months earlier. It went out into the 2619 calendar,
    which was full of answers to the altered-credit edition, and every credit on it names who played what
    down to the part — which the settled worlds read as the band taking a side in somebody else''s argument
    and which is about the two claimants who hold Coldwater Court. The sleeve prints eleven Lower Bell
    catalogue numbers and nothing else on the back. It sold better up the relay than anything Stormline
    Issue had pressed that was not for dancing, which is the whole reason there is a second one.'
- id: al_150
  artist: b_066
  label: label_3
  title: The Quarter Without Me
  release_year: 2624
  kind: album
  cornerstone: false
  notes: 'Concordance''s largest hall reopened in 2624 and every house in the settled worlds booked time
    in it. Stormline Issue did not: it had put its season''s money into a wet hall on the storm coast
    and said in print that it would do it again. So The Quiet Half paid the hall''s fee themselves, out
    of a season of hall work, and Stormline Issue paid for the sleeve and is credited on it for the sleeve.
    It is the first time Juna Carrow had been back in the late-club quarter since 2617, and she walked
    it for two days before the band played a note. The record is the only one in the wiki where a singer
    re-records her own song to keep the money away from the people who own the first version.'
- id: al_151
  artist: b_067
  label: label_3
  title: When the Board Comes Down
  release_year: 2619
  kind: album
  cornerstone: false
  notes: Nine Lamps had been playing the last hour of coast dance nights for five years and had never
    been offered a record, on the reasonable grounds that Stormline Issue is a house for dancing. What
    changed is that the house had pressed one slow record that year and it had sold up the relay, so it
    pressed a second by the band that had been doing it longest. The sessions were six nights at the end
    of six dance nights, in the halls the band was already booked into, with the doors shut behind the
    last of the room. The sleeve files them under the core's name for the form and prints Sabin Loch's
    objection to that beside it, which is the first time a house had printed a band's complaint about
    its own filing and is now the band's contract.
- id: al_152
  artist: b_067
  label: label_3
  title: Lamps Left Burning
  release_year: 2624
  kind: album
  cornerstone: false
  notes: The sealed season of 2623 ran eleven weeks and Nine Lamps played the last hour of forty nights
    of it in the Longwall hall, after Cordon Hours had finished and most of the room had gone. Six of
    those hours were recorded and the record is what came out of them, issued in 2624 while the whole
    of the rest of the industry was in Concordance booking the reopened hall. Sabin Loch has said the
    band would not have crossed for it if the crossing had been free. The hall's keeper left the lamps
    on past his own hours for every one of the six and is the only person outside the band named on the
    sleeve.
- id: al_153
  artist: b_068
  label: label_1
  title: The Last Ferry Goes
  release_year: 2557
  kind: album
  cornerstone: false
  notes: The first record of the quarter's music anybody pressed, issued by a house that filed it under
    evening entertainment.
- id: al_154
  artist: b_068
  label: label_1
  title: Nobody Books Us Early
  release_year: 2583
  kind: album
  cornerstone: false
  notes: Their last, made the year the Station Cycles went round and every house wanted something quiet,
    and the only one they were allowed to name themselves.
- id: al_155
  artist: b_069
  label: label_2
  title: Slow at the Harbor
  release_year: 2594
  kind: album
  cornerstone: false
  notes: Made the year the burn festival filled Cold Harbor with crews and somebody had to play them out
    at four in the morning.
- id: al_156
  artist: b_069
  label: label_2
  title: Ice on the Glass
  release_year: 2619
  kind: album
  cornerstone: false
  notes: Remembered for a sleeve that credits every part twice, once as played and once as written, in
    a year when nobody trusted a credit.
- id: al_157
  artist: b_070
  label: label_1
  title: Table for the Night
  release_year: 2602
  kind: album
  cornerstone: false
  notes: The record that proved the form would sell to people who had never been in the quarter, and the
    one Lower Bell Editions was founded against.
- id: al_158
  artist: b_070
  label: label_1
  title: The Good Room
  release_year: 2612
  kind: album
  cornerstone: false
  notes: Issued the month Lower Bell Editions folded, with a sleeve note about standards that the quarter
    has never forgiven.
- id: al_159
  artist: b_071
  label: null
  title: Given a Room
  release_year: 2609
  kind: album
  cornerstone: false
  notes: Paid for out of one season's door money and sold at the door of the room it was made in.
- id: al_160
  artist: b_071
  label: null
  title: Still Here at Four
  release_year: 2623
  kind: album
  cornerstone: false
  notes: The record the quarter points at when it argues that the house was never the reason any of this
    happened.
- id: al_161
  artist: b_072
  label: label_1
  title: Nobody Had a Seat
  release_year: 2607
  kind: album
  cornerstone: false
  notes: Civic Lantern did not go looking for this ensemble. What happened in 2607 is that Open Parallax
    had the Long Assembly booked for a week and finished two days early, the hall was paid for either
    way, and somebody at the house remembered that a chorus had been singing in the upper rail after concerts
    for six years and could be had for the price of the night. So the record was made in the room the
    ensemble already knew, by people who had never been on its floor, in two days that belonged to somebody
    else. The house filed it under civic entertainment, paid a flat fee for the night, printed the ensemble's
    name and the director's and nobody else's, and considered the matter settled for the next twelve years.
    It sold steadily and quietly for a decade and is the record that made the form current again in the
    core, which Civic Lantern has taken credit for in print and Sarra Lome has never contested.
- id: al_162
  artist: b_072
  label: label_1
  title: Thirty-One Names
  release_year: 2619
  kind: album
  cornerstone: false
  notes: Twelve years with no record, for two reasons that had nothing to do with each other. The house's
    position was that the first one still sold and that a flat fee for a night is not a thing you repeat
    annually. And the Long Assembly shut in 2615 for structural repairs, which took the ensemble's whole
    sound away — thirty-one voices in a small room is a mistake, not a style. What changed in 2619 is
    that the altered-credit edition of a Pell and Tern recording surfaced and the entire settled worlds
    spent the year arguing about whose name belonged on what. Sarra Lome asked Civic Lantern, in that
    year and not before it, to print the chorus by name; the house agreed, because in 2619 refusing would
    have been the story. It was made in the North Line transfer hall in the hours after the last connection
    had gone, which is the only room in Concordance big enough that the ensemble could have for nothing,
    and the sleeve carries thirty-one names in the order the singers were standing.
- id: al_163
  artist: b_072
  label: label_1
  title: Seven Lanterns
  release_year: 2624
  kind: album
  cornerstone: false
  notes: The Long Assembly reopened in 2624 and every house in the settled worlds booked into it. Civic
    Lantern held one night of that season and gave it to this ensemble rather than to Measure Kindly,
    who had asked for it; the house has been asked why in print and answers by pointing at what it was
    founded to press. What they sang is Lanternlight — Odessa Vail's cycle, the Lumen Festival's test
    piece, the record Civic Lantern has never once let go out of catalogue. Twelve movements do not fit
    a night, so Sarra Lome chose seven, and has never said anything about the five she left out. Nobody
    had sung the cycle in a room this size since Vail's own première, because there had been no room this
    size to sing it in, and the ensemble that got to do it is the one that spent six years in the upper
    rail of it listening to other people.
- id: al_164
  artist: b_073
  label: label_1
  title: Lanternlight
  release_year: 2559
  kind: album
  cornerstone: false
  notes: The cycle itself, in the première recording, and the record every core ensemble has been measured
    against since.
- id: al_165
  artist: b_074
  label: label_2
  title: Sung at the Gate
  release_year: 2583
  kind: album
  cornerstone: false
  notes: 'The year the complete Station Cycles reached general circulation, every house in the settled
    worlds wanted the form and one of them had it. Harbor Standard asked the rota at Verrin Reach for
    terms and was told the terms: anybody may copy them and nobody may sell them. Bela Roon, who ran the
    house''s list then, went down to its own relay berth instead, on the word of a crew who had heard
    the gate clerk singing between arrivals, and made this over two nights in a store room off the berth
    with the traffic still coming in. It is a house record of the plainest commercial kind and it is the
    only one on Cold Harbor''s list that names nobody but the person on the sleeve — Ostell played everything
    on it, and the generation of hired players that fills the rest of this catalogue had not started work.
    It has never been out of print and it has never sold quickly.'
- id: al_166
  artist: b_074
  label: label_2
  title: Further Than I Went
  release_year: 2600
  kind: album
  cornerstone: false
  notes: 'Seventeen years and one record, because Harbor Standard was busy with halls and Ostell was busy
    with a gate, and because neither of them had a reason to hurry. What made this one is the shared press
    format: from 2600 a hauler crew could carry a record off its own lane and have it play at the other
    end, and the first record went further in a year than it had gone in the whole time before. Ostell
    has still never left Cold Harbor. The whole album is about that — things that travel, people who do
    not, and what it is like to be told by strangers where your own voice has been. It was made in the
    same store room off the berth, with one exception the house had to argue her into, and it is the record
    that put the form on lanes that had never heard it.'
- id: al_167
  artist: b_075
  label: label_2
  title: Same Note All Night
  release_year: 2619
  kind: album
  cornerstone: false
  notes: 'Harbor Standard had been without a void ballad voice since 2612 and found this one at the same
    gate it found the last one, which the house has been teased about ever since. What makes the record
    is the box: Vantry built a thing that holds one note, the note is the tonic of the Station Cycles,
    and he printed where it came from on the back of the sleeve when nobody had asked him to. He did that
    in the year the altered-credit edition of a Pell and Tern recording surfaced and the whole industry
    spent twelve months arguing about whose name belonged on what, which is why a small record about a
    note ended up being discussed in rooms that do not otherwise discuss this form. The seventh song is
    not his. It is the one Nera Ostell left behind when she went out to a rota, and the house had been
    sitting on it for seven years waiting for somebody who could sing it.'
- id: al_168
  artist: b_075
  label: label_2
  title: Nothing Left to Tune To
  release_year: 2624
  kind: album
  cornerstone: false
  notes: 'In the year every house in the settled worlds was booking nights in Concordance''s reopened
    hall, Harbor Standard paid for one crossing each way to Verrin Reach so that its quietest artist could
    sing in a store room with eleven people in it. The idea was to make the record against the life support
    Corin Hale would not let anybody repair. It was not there: the outpost''s plant had been replaced,
    the note had gone with it, and the only tonic on the record is the box Vantry brought out with him.
    That is what the record is about, and the house — which had expected a pilgrimage and got a wake —
    put it out unchanged. The eleven keepers gave their permission on one condition, and it is printed
    on the back of the sleeve.'
- id: al_169
  artist: b_076
  label: null
  title: Station Cycles
  release_year: 2583
  kind: album
  cornerstone: false
  notes: The year the complete cycles reached general circulation, and the record the whole form is measured
    against — never pressed by anybody, and never out of anybody's reach.
